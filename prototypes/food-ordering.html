<script>
const prices={fish:88,chicken:38,greens:28,rice:3},names={fish:'松鼠桂鱼',chicken:'宫保鸡丁',greens:'上汤时蔬',rice:'米饭'};
let cart={fish:0,chicken:1,greens:1,rice:0},total=112,mode='post',timer,category='all',flavor='正常辣';
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.hidden=false;clearTimeout(timer);timer=setTimeout(()=>e.hidden=true,3500)}
function render(){let count=0,amount=0;Object.keys(cart).forEach(k=>{count+=cart[k];amount+=cart[k]*prices[k];document.querySelector(`[data-count="${k}"]`).textContent=cart[k]});document.querySelector('#cart-count').textContent=count;document.querySelector('#cart-total').textContent='¥'+amount;document.querySelectorAll('[data-total]').forEach(e=>e.textContent='¥'+total);document.querySelector('#goods-total').textContent='¥'+(total-12);document.querySelector('#draft-note').textContent=count?`另有 ${count} 份菜待提交，尚未送厨`:'当前没有待提交菜品';document.querySelector('#submit-order').textContent=mode==='post'?'确认送厨':'请顾客付款';document.querySelectorAll('[data-mode-label]').forEach(e=>e.textContent=e.closest('#s02')?(mode==='post'?'先吃后付':'本次加菜先付'):'先吃后付')}
document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{cart[b.dataset.sku]=Math.max(0,cart[b.dataset.sku]+Number(b.dataset.delta));render()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='pre'){toast('切换为先付模式演示：既有台账不变，新点菜品付款后才送厨')}mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
document.querySelector('#submit-order').onclick=()=>{if(!Object.values(cart).some(Boolean))return toast('请先选择菜品');if(mode==='pre')return toast('已演示发起本次付款；尚无可信支付结果，不送厨');let holder=document.querySelector('#new-lines');Object.keys(cart).filter(k=>cart[k]).forEach(k=>{const row=document.createElement('div');row.className='workbench-orderline';const text=document.createElement('div');const title=document.createElement('h4');title.textContent=names[k]+' ×'+cart[k];const info=document.createElement('p');info.textContent=(k==='chicken'?flavor+' · ':'')+'¥'+prices[k]*cart[k];text.append(title,info);const status=document.createElement('span');status.className='workbench-badge workbench-badge--primary';status.textContent='待制作';row.append(text,status);holder.append(row);total+=prices[k]*cart[k];cart[k]=0});document.querySelector('[data-new-batch]').hidden=false;render();toast('本地演示：本次加菜已送厨，付款状态未改变');document.querySelector('#s03').scrollIntoView({behavior:'smooth',block:'center'})};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('[data-table]').forEach(t=>t.hidden=b.dataset.filter!=='all'&&t.dataset.status!==b.dataset.filter)});
document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{if(b.dataset.table==='A03')document.querySelector('#s02').scrollIntoView({behavior:'smooth',block:'center'});else toast(b.dataset.table+'：当前只开放 A03 的完整点餐演示')});
function filterDishes(){const q=document.querySelector('#dish-search').value.toLowerCase().replaceAll(' ','');document.querySelectorAll('.workbench-dish').forEach(d=>d.hidden=!(category==='all'||d.dataset.cat===category)||!d.dataset.name.replaceAll(' ','').includes(q))}
document.querySelector('#dish-search').oninput=filterDishes;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',x===b));filterDishes()});
document.querySelector('#flavor').onclick=()=>{flavor=flavor==='正常辣'?'少辣':'正常辣';document.querySelector('#flavor').textContent='口味：'+flavor+'⌄'};
document.querySelector('#serve-rice').onclick=e=>{e.target.textContent='已上菜';e.target.disabled=true;toast('米饭 4 碗已确认上菜，不改变收款状态')};document.querySelectorAll('[data-message]').forEach(b=>b.onclick=()=>toast(b.dataset.message));document.querySelector('#request-pay').onclick=()=>toast('已演示发起 ¥'+total+' 顾客扫码付款；尚未付款，未结清台账');document.querySelector('#reset-demo').onclick=()=>location.reload();render();
</script></html>
