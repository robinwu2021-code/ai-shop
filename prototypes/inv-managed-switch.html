<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记库存开关</title>
<!-- 真源在仓库 prototypes/inv-managed-switch.html；发布到 claude.ai 的是它的副本。样式只在 proto.css，本文件不写样式块 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="proto.css">

<div class="wrap">
<header class="top">
  <div class="eyebrow">B 端 App · 界面原型 · 2026-09-21</div>
  <h1>库存：哪些商品记库存</h1>
  <p class="sub">门店库存方案第一期。店主按品类、按单件商品决定「记不记库存」：记库存的参与进货、盘点、调拨、报损；
  不记库存的只用商城上的库存数，库存页里看不到它。服务类默认不记。七屏，示例数据取自虹选鲜果·福田店。</p>
</header>

<section>
  <div class="sec-head"><span class="sec-num">01 — 04</span><h2>按品类设置</h2></div>
  <div class="grid">

    <figure id="s01">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">库存</span><span class="meta">设置</span></div>
        <div class="scr">
          <div class="stats">
            <div><div class="n num">3</div><div class="l">在售 SKU</div></div>
            <div><div class="n num">0</div><div class="l">缺货</div></div>
            <div><div class="n num">0</div><div class="l">滞销</div></div>
            <div><div class="n num">0</div><div class="l">在途</div></div>
          </div>
          <div class="group">
            <div class="frow"><span class="chip">进货</span><span class="chip">盘点</span><span class="chip">报损</span><span class="chip">单据</span></div>
          </div>
          <div class="gt">要处理</div>
          <div class="card"><div class="hd"><span class="nm">香梨 · 5 斤装</span><span class="meta">实存 30 · 可用 28</span></div></div>
          <div class="card"><div class="hd"><span class="nm">阳光玫瑰青提</span><span class="meta">实存 12 · 可用 12</span></div></div>
        </div>
      </div>
      <figcaption class="cap"><b>01 库存首页</b>右上角多一个「设置」。</figcaption>
      <p class="why">设置放在库存页自己身上，而不是工作台：「哪些货记库存」只有在管库存的时候才会想到。
      首页不再出现「家政保洁 2 小时」这类永远不会进货的项目 —— 这是这一期店主最先感到的变化。</p>
    </figure>

    <figure id="s02">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">库存设置</span><span></span></div>
        <div class="scr">
          <div class="gt">记库存的品类</div>
          <div class="group">
            <div class="frow"><span class="k">水果</span><span class="meta">3 件商品</span><span class="sw on"></span></div>
            <div class="frow"><span class="k">家政保洁</span><span class="meta">默认不记 · 1 件</span><span class="sw"></span></div>
          </div>
          <div class="meta">全店各门店共用。服务类默认不记，实物、生鲜默认记。</div>
          <div class="meta">单件商品可在「编辑商品 → 库存管理」里单独设置，单件的设置优先。</div>
        </div>
      </div>
      <figcaption class="cap"><b>02 库存设置 · 记库存的品类</b>本店各门店经营类目的合集，每类一个开关。</figcaption>
      <p class="why">开关挂在主体上而不是门店：同一件货在 A 店记、B 店不记，账就说不清。
      「3 件商品」告诉他拨这一下会动到多少东西；「默认不记」让他知道这个灰着的状态不是出错，是平台给服务类的默认值。</p>
    </figure>

    <figure id="s03">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">库存设置</span><span></span></div>
        <div class="scr">
          <div class="gt">记库存的品类</div>
          <div class="group">
            <div class="frow"><span class="k">水果</span><span class="meta">3 件商品</span><span class="sw on"></span></div>
          </div>
        </div>
        <div class="mask"><div class="sheet">
          <div class="h">「水果」改为不记库存？</div>
          <div class="d">影响 3 件商品，其中 2 件还有库存</div>
          <div class="group">
            <div class="frow"><span class="k">香梨 · 5 斤装</span><span class="v num">实存 30</span></div>
            <div class="frow"><span class="k">阳光玫瑰青提</span><span class="v num">实存 12</span></div>
          </div>
          <div class="d">关闭后这些库存与流水保留、只读，不再出现在进货、盘点、报损里；重新打开即恢复。</div>
          <div class="acts"><div class="btn sec">取消</div><div class="btn">不记库存</div></div>
        </div></div>
      </div>
      <figcaption class="cap"><b>03 关闭品类 · 还有库存</b>列出还压着货的商品，二次确认。</figcaption>
      <p class="why">不逼他先把货报损掉：那几件货是真实存在的，报损等于做假账。
      停用而不删除，余额与流水留着，改回来原样恢复。确认键写「不记库存」而不是「确定」，按下去之前就知道会发生什么。</p>
    </figure>

    <figure id="s04">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">库存设置</span><span></span></div>
        <div class="scr">
          <div class="gt">记库存的品类</div>
          <div class="group">
            <div class="frow"><span class="k">水果</span><span class="meta">3 件商品</span><span class="sw on"></span></div>
          </div>
        </div>
        <div class="mask"><div class="sheet">
          <div class="h">暂时不能改为不记库存</div>
          <div class="d">以下单据还没完成，本次没有做任何改动</div>
          <div class="group">
            <div class="frow"><span class="k">香梨 · 5 斤装</span><span class="v go">进货单 PO0921-003 · 待收货</span></div>
            <div class="frow"><span class="k">阳光玫瑰青提</span><span class="v go">1 笔线上订单待出库</span></div>
          </div>
          <div class="d">收货或作废进货单、订单出库后，再来关闭。</div>
          <div class="acts"><div class="btn">知道了</div></div>
        </div></div>
      </div>
      <figcaption class="cap"><b>04 关闭品类 · 有在途单据</b>拒绝，并说清是哪几张单。</figcaption>
      <p class="why">在途的进货单、待出库的订单都指着这件货的库存；这时候关掉，货到了没处入、订单出不了库。
      <b>一件被拒，整类不动</b> —— 半开半关比不动更难收拾。每一行点进去就是那张单。</p>
    </figure>

  </div>
</section>

<section>
  <div class="sec-head"><span class="sec-num">05 — 07</span><h2>按单件商品设置，以及它在别处的样子</h2></div>
  <div class="grid">

    <figure id="s05">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">编辑商品</span><span></span></div>
        <div class="scr">
          <div class="gt">库存</div>
          <div class="group">
            <div class="frow"><span class="k">库存管理</span><span class="v go">跟随品类（记库存）</span></div>
            <div class="frow"><span class="k">库存</span><span class="v num">30</span></div>
            <div class="frow"><span class="k">每人限购</span><span class="v ph-">不限</span></div>
          </div>
          <div class="meta">仅修改「虹选鲜果·福田店」的库存</div>
        </div>
        <div class="foot"><div class="btn sec">保存草稿</div><div class="btn main">保存并提交</div></div>
      </div>
      <figcaption class="cap"><b>05 编辑商品 · 库存管理</b>库存那一段多一行。</figcaption>
      <p class="why">默认「跟随品类」，括号里写出当前跟到的结果 —— 不写的话「跟随」是句空话，他不知道这件货到底记不记。
      放在「库存」那一行上面：先决定记不记，再填数。</p>
    </figure>

    <figure id="s06">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">编辑商品</span><span></span></div>
        <div class="scr">
          <div class="gt">库存</div>
          <div class="group">
            <div class="frow"><span class="k">库存管理</span><span class="v go">跟随品类（记库存）</span></div>
          </div>
        </div>
        <div class="mask"><div class="sheet">
          <div class="h">库存管理</div>
          <div class="d">「水果」目前记库存</div>
          <div class="group">
            <div class="pickrow"><span>跟随品类（记库存）</span><span class="c">✓</span></div>
            <div class="pickrow"><span>记库存</span><span></span></div>
            <div class="pickrow"><span>不记库存</span><span></span></div>
          </div>
          <div class="d">记库存：参与进货、盘点、调拨、报损。不记库存：只用商城上的库存数。</div>
        </div></div>
      </div>
      <figcaption class="cap"><b>06 选择库存管理方式</b>三选一。</figcaption>
      <p class="why">给单件的例外：水果类里有一样代卖的货不想记，单独设「不记库存」即可，不用把整个品类关掉。
      选「不记库存」且这件货还有库存或在途单据时，走 03 / 04 同样的确认与拒绝。</p>
    </figure>

    <figure id="s07">
      <div class="ph">
        <div class="nav"><span class="bk">‹</span><span class="t">商品</span><span></span></div>
        <div class="scr">
          <div class="card">
            <div class="hd"><span class="nm">香梨 · 5 斤装</span><span class="chip ok">在售</span></div>
            <div class="meta">¥50.00 · 库存 30</div>
          </div>
          <div class="card">
            <div class="hd"><span class="nm">家政保洁 · 2 小时</span><span class="chip ok">在售</span></div>
            <div class="meta">¥120.00 · 库存 99 · <span class="chip">不记库存</span></div>
          </div>
        </div>
        <div class="mask"><div class="sheet">
          <div class="h">改库存 · 家政保洁 · 2 小时</div>
          <div class="group"><div class="frow"><span class="v num">99</span></div></div>
          <div class="d">这件商品不记库存，这里的数就是商城上可卖的数</div>
          <div class="acts"><div class="btn sec">取消</div><div class="btn">确定</div></div>
        </div></div>
      </div>
      <figcaption class="cap"><b>07 商品列表 · 不记库存的商品</b>标「不记库存」；改库存不再提库存账。</figcaption>
      <p class="why">记库存的商品，改库存弹层仍提示「库存页记着 X」；不记库存的只有一个数，提那本账只会让人困惑。
      进货、盘点、报损的选商品列表里，不记库存的商品不出现。</p>
    </figure>

  </div>
</section>
