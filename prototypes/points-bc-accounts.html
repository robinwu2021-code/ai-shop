<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B/C 积分账户调整</title><link rel="stylesheet" href="proto.css"><div class="wrap"><header class="top"><div class="eyebrow">B/C 积分 · 现有账户页调整</div><h1>积分账户、流水与账单</h1><p class="sub">沿用现有 sh-scaffold、sh-card、sh-chip、sh-row、sh-btn。示例数据。账户查询不要求签约，历史条款只读。</p></header><section><div class="grid"><figure id="s01"><div class="ph"><div class="nav"><span class="bk">‹</span><span class="t">门店积分</span></div><div class="scr"><div class="group"><div class="frow"><span class="k">当前门店</span><span class="v">示例门店</span></div></div><div class="group"><div class="frow"><span class="k">积分名称</span><span class="v">平台积分</span></div><div class="frow"><span class="k">代码 / 币种</span><span class="v">HX_TOKEN / CNY</span></div><div class="frow"><span class="k">可用 / 待入账</span><span class="v">100 / 20</span></div></div><div class="group"><div class="frow"><span>积分流水 ›</span></div><div class="frow"><span>积分账单 ›（展开已有组件）</span></div><div class="frow"><span>历史条款 ›（只读）</span></div></div></div></div><figcaption class="cap">调整：名称选择；余额中文标签；移除签约表单；账单按需展开。</figcaption></figure><figure id="s02"><div class="ph"><div class="nav"><span class="bk">‹</span><span class="t">我的积分</span></div><div class="scr"><div class="group"><div class="frow"><span>平台积分</span><span>奖励积分</span></div><div class="frow"><span class="k">可用积分</span><span class="v">100</span></div><div class="frow"><span class="k">待入账 / 占用</span><span class="v">20 / 0</span></div><div class="frow"><span>代码、币种、比例及账户状态独立展示</span></div></div><div class="group"><div class="frow"><span>发放 · 待入账</span><span>+20</span></div><div class="frow"><span>凭证编号、业务关联、时间</span></div></div></div></div><figcaption class="cap">调整：使用名称区分类型，流水显示业务方向和分桶；未知业务仅展示凭证，不猜订单号。</figcaption></figure></div></section></div>
<section class="wrap"><header class="top"><h2>订单详情 · 新增赠送积分卡片</h2><p class="sub">复用现有 sh-card、sh-row；与订单物流状态分开。积分受理不等于到账。</p></header><div class="grid"><figure id="s03"><div class="ph"><div class="nav"><span class="bk">‹</span><span class="t">订单详情</span></div><div class="scr"><div class="group"><div class="frow"><span>原有订单信息及物流</span></div></div><div class="group"><div class="frow"><span>赠送积分 · 平台积分</span><span>待入账</span></div><div class="frow"><span>HX_TOKEN</span><span>CNY</span></div><div class="frow"><span>预计积分</span><span>100</span></div><div class="frow"><span>待入账</span><span>100</span></div><div class="frow"><span>已到账</span><span>0</span></div></div></div></div><figcaption class="cap">B/C 共用组件；失败显示重试，预算不足保持处理中。</figcaption></figure></div></section>
