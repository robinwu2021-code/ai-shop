<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C端储值记录</title><link rel="stylesheet" href="proto.css"><link rel="stylesheet" href="proto.css?consumer-review=20261021"></head><body><div class="wrap proto-demo consumer-proto"><header class="top"><div class="eyebrow">C APP / 2026.10.21</div><h1>储值记录</h1><p class="sub">我的 → 有储值往来的门店 → 收支记录。示例数据，仅演示查询。</p><nav class="screens"><a class="scr" href="#s01">01</a><a class="scr" href="#s02">02</a><a class="scr" href="#s03">03</a><a class="scr" href="#s04">04</a><a class="scr" href="#s05">05</a><a class="scr" href="#s06">06</a><a class="scr" href="#s07">07</a><a class="scr" href="#s08">08 通知</a><a class="scr" href="#s09">09 授权</a></nav></header><section><div class="grid"><figure id="s01"><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">我的</span><span></span></div><div class="scr"><div class="group"><b>林女士</b><p class="hint">个人资料</p></div><div class="group"><div class="frow"><span>我的订单</span><span>›</span></div><a class="frow" href="#s02"><span>储值记录</span><span>›</span></a><div class="frow"><span>我的会员</span><span>›</span></div><div class="frow"><span>优惠券</span><span>›</span></div></div></div></div><figcaption class="cap"><b>01 我的</b>从「我的」统一进入；沿用已有会员码入口。</figcaption></figure><figure id="s02"><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">储值记录</span><span></span></div><div class="scr"><div class="group"><a href="#s03"><div class="sl-row"><div class="bd"><span class="nm">悦颜美肤 · 科技园店</span><span class="m">最近核销 · 10月21日 14:30</span></div><span class="amt">›</span></div></a></div><div class="group"><a href="#s03"><div class="sl-row"><div class="bd"><span class="nm">澄心美业 · 南山店</span><span class="m">最近储值 · 10月20日 18:05</span></div><span class="amt">›</span></div></a></div><p class="hint">没有更多了</p><a class="frow" href="#s09"><span>消费通知</span><span>去设置 ›</span></a></div></div><figcaption class="cap"><b>02 储值记录</b>仅展示本人有已到账储值记录的门店，包括余额为零的门店；按最近一次储值或核销倒序。</figcaption></figure><figure id="s03"><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">收支记录</span><span></span></div><div class="scr"><div class="group"><b>悦颜美肤 · 科技园店</b></div><div class="frow"><div class="tabs" role="tablist"><a href="#s03"><span class="on">全部</span></a><a href="#s04" data-record-type="RECHARGE"><span>储值</span></a><a href="#s04" data-record-type="REDEMPTION"><span>核销</span></a></div><a href="#s05">时间 ⌄</a></div><div class="group"><div class="sl-row"><div class="bd"><span class="nm">核销 · 面部护理</span><span class="m">10月21日 14:30</span></div><span class="amt">−¥128.00</span></div><div class="sl-row"><div class="bd"><span class="nm">储值 · 日常储值</span><span class="m">10月20日 16:20</span></div><span class="amt">+¥130.00</span></div><div class="sl-row"><div class="bd"><span class="nm">核销 · 肩颈护理</span><span class="m">10月18日 11:10</span></div><span class="amt">−¥80.00</span></div></div></div></div><figcaption class="cap"><b>03 收支记录</b>储值为实际到账合计，核销为实际扣减；不拆本金赠金。门店从列表带入。</figcaption></figure><figure id="s04" data-filtered-records><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">收支记录</span><span></span></div><div class="scr"><div class="group"><b>悦颜美肤 · 科技园店</b></div><div class="frow"><div class="tabs" role="tablist"><a href="#s03"><span class="">全部</span></a><a href="#s04" data-record-type="RECHARGE"><span>储值</span></a><a href="#s04" data-record-type="REDEMPTION"><span class="on">核销</span></a></div><a href="#s05">时间 ⌄</a></div><div class="group"><div class="sl-row"><div class="bd"><span class="nm">核销 · 面部护理</span><span class="m">10月21日 14:30</span></div><span class="amt">−¥128.00</span></div><div class="sl-row"><div class="bd"><span class="nm">核销 · 肩颈护理</span><span class="m">10月18日 11:10</span></div><span class="amt">−¥80.00</span></div></div></div></div><figcaption class="cap"><b>04 收支记录</b>点击类型重新加载第一页，时间条件保留；储值 Tab 同理。</figcaption></figure><figure id="s05"><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">筛选时间</span><span></span></div><div class="scr"><div class="group"><b>悦颜美肤 · 科技园店</b></div><div class="frow"><div class="tabs" role="tablist"><a href="#s03"><span class="on">全部</span></a><a href="#s04" data-record-type="RECHARGE"><span>储值</span></a><a href="#s04" data-record-type="REDEMPTION"><span>核销</span></a></div><a href="#s05">时间 ⌄</a></div></div><div class="mask"><div class="sheet" role="dialog" aria-label="筛选时间"><div class="h">筛选时间</div><label class="frow">开始日期 <input type="date" id="date-from" value="2026-10-01"></label><label class="frow">结束日期 <input type="date" id="date-to" value="2026-10-21"></label><p class="hint" id="date-error" aria-live="polite"></p><div class="acts"><button class="proto-control btn sec" id="date-reset">重置</button><button class="proto-control btn main" id="date-apply">确定</button></div><a href="#s03">取消</a></div></div></div><figcaption class="cap"><b>05 筛选时间</b>同一账单页上覆盖遮罩与底部弹框，不改变门店或类型。起止日期可分别留空，重置后点击确定才应用。</figcaption></figure><figure id="s06"><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">暂无记录</span><span></span></div><div class="scr"><div class="group"><b>暂无储值记录</b><p class="hint">到店储值后可在这里查看</p></div><div class="group"><b>筛选后暂无记录</b><p class="hint">试试其他类型或时间</p><a class="btn sec" href="#s03">清除筛选</a></div></div></div><figcaption class="cap"><b>06 暂无记录</b>分别为门店列表为空和账单筛选为空；不展示购买入口。</figcaption></figure><figure id="s07"><div class="ph"><div class="nav"><a class="bk" href="#s02">‹</a><span class="t">加载失败</span><span></span></div><div class="scr"><div class="group"><b>暂时无法加载</b><p class="hint">请稍后重试</p><a class="btn main" href="#s02">重试</a></div><div class="group"><b>继续加载失败</b><p class="hint">保留已显示的记录</p><a class="btn sec" href="#s03">重试加载</a></div></div></div><figcaption class="cap"><b>07 加载失败</b>初次失败与下一页失败分别处理；未登录先走已有登录流程，返回后刷新本人记录。</figcaption></figure><figure id="s08"><div class="ph"><div class="nav"><span></span><span class="t">微信通知示意</span><span></span></div><div class="scr"><div class="group"><div class="frow"><b>消费核销成功</b></div><div class="frow"><span class="k">门店</span><span>悦颜美肤 · 科技园店</span></div><div class="frow"><span class="k">消费项目</span><span>面部护理</span></div><div class="frow"><span class="k">核销金额</span><span class="amt">¥128.00</span></div><div class="frow"><span class="k">消费时间</span><span>10月21日 14:30</span></div><a class="frow" href="#s03"><span>查看记录</span><span>›</span></a></div></div></div><figcaption class="cap"><b>08 核销微信通知</b>仅在核销提交成功后发送。此为信息内容示意，真实模板字段及微信外观以小程序后台可用模板为准；点击进入该店账单并定位该笔记录。</figcaption></figure><figure id="s09"><div class="ph"><div class="nav"><a href="#s02">‹</a><span class="t">消费通知</span><span></span></div><div class="scr"><div class="group"><div class="frow"><b>微信消费提醒</b></div><p class="hint">接收核销成功通知，随时查看消费记录。</p></div><button class="proto-control btn" id="subscribe-demo">接收通知</button><p class="hint" id="subscribe-result" aria-live="polite">以微信授权结果为准</p><a class="frow" href="#s02">返回储值记录 ›</a></div></div><figcaption class="cap"><b>09 通知授权入口</b>小程序中点击按钮才请求微信授权；示意操作不代表真实授权。H5与App不伪造微信授权弹窗。模板／渠道未配置时隐藏授权操作，保留站内结果。</figcaption></figure></div></section><footer>接口设计：docs/technical/TDD-C端储值记录-UI与接口.md</footer></div><script>
const from=document.getElementById('date-from'),to=document.getElementById('date-to'),err=document.getElementById('date-error');
document.getElementById('date-reset').onclick=()=>{from.value='';to.value='';err.textContent='';};
document.getElementById('date-apply').onclick=()=>{if(from.value&&to.value&&from.value>to.value){err.textContent='结束日期不能早于开始日期';return;}err.textContent='';location.hash='s03';};

document.querySelectorAll('[data-record-type]').forEach(link=>link.onclick=()=>{const target=document.querySelector('[data-filtered-records]');const recharge=link.dataset.recordType==='RECHARGE';target.querySelectorAll('.tabs span').forEach(e=>e.classList.toggle('on',e.textContent===(recharge?'储值':'核销')));target.querySelector('.scr > .group:last-child').innerHTML=recharge?'<div class="sl-row"><div class="bd"><span class="nm">储值 · 日常储值</span><span class="m">10月20日 16:20</span></div><span class="amt">+¥130.00</span></div>':'<div class="sl-row"><div class="bd"><span class="nm">核销 · 面部护理</span><span class="m">10月21日 14:30</span></div><span class="amt">−¥128.00</span></div>';});
document.getElementById('subscribe-demo').onclick=()=>document.getElementById('subscribe-result').textContent='原型演示：这里唤起微信原生授权，结果不在原型中模拟为已授权';
</script></body></html>
