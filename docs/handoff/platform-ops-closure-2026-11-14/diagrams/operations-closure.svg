<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">平台运营两条独立闭环</title><desc id="desc">基础设置和账号门店之后，平台套餐核款履约与独立支付资料进件分别办理。套餐权益和经营开通不代表渠道可收款。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="1080" height="500" fill="#f8fafc"/><g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M540 80 V110"/><path d="M420 145 H270 V215"/><path d="M660 145 H810 V215"/><path d="M270 275 V315"/><path d="M810 275 V315"/><path d="M270 375 V410"/><path d="M810 375 V410"/></g><g font-family="system-ui, sans-serif" text-anchor="middle"><g fill="#e2e8f0" stroke="#94a3b8"><rect x="400" y="20" width="280" height="60" rx="10"/><rect x="400" y="110" width="280" height="70" rx="10"/></g><g fill="#e0f2fe" stroke="#7dd3fc"><rect x="60" y="215" width="420" height="60" rx="10"/><rect x="60" y="315" width="420" height="60" rx="10"/></g><g fill="#ede9fe" stroke="#c4b5fd"><rect x="600" y="215" width="420" height="60" rx="10"/><rect x="600" y="315" width="420" height="60" rx="10"/></g><g fill="#0f172a" font-size="18"><text x="540" y="57">基础设置 · 目录 · 运营岗位</text><text x="540" y="142">账号 · 经营主体 · 门店</text><text x="540" y="165" font-size="14">核对来源、模型、资格与审核状态</text><text x="270" y="251">平台商城：App 购买 / 运营代购</text><text x="270" y="351">核款 → 完整履约 → 权益与目标店开通</text><text x="810" y="251">独立支付：商户资料 → 审批 → 渠道进件</text><text x="810" y="351">签约 → 账户 / 凭据 / 产品 → 门店绑定</text><text x="270" y="435" fill="#0369a1">平台收退款统计（排除 TEST）</text><text x="810" y="435" fill="#6d28d9">指定门店收款资格与获准渠道验收</text><text x="540" y="480" font-size="15">两条链分别核验：套餐开通不等于支付渠道可收款</text></g></g></svg>