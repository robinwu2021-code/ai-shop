<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <title>运营端四类管理对象的关系</title>
  <desc>注册账户作为负责人或员工关联商户与门店；商户以主体身份进件收款渠道，收款号绑定门店；门店授权接入销售渠道。处置沿归属关系向下传导。</desc>
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <!-- 注册账户 -->
  <rect x="30" y="160" width="150" height="74" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="105" y="190" text-anchor="middle" font-weight="700">注册账户</text>
  <text x="105" y="212" text-anchor="middle" fill="#475569" font-size="12">一个自然人的登录身份</text>
  <!-- 商户 -->
  <rect x="270" y="60" width="170" height="74" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="355" y="90" text-anchor="middle" font-weight="700">商户（经营主体）</text>
  <text x="355" y="112" text-anchor="middle" fill="#475569" font-size="12">法律责任与结算的承担者</text>
  <!-- 门店 -->
  <rect x="270" y="260" width="170" height="74" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="355" y="290" text-anchor="middle" font-weight="700">门店</text>
  <text x="355" y="312" text-anchor="middle" fill="#475569" font-size="12">对外经营与履约的单元</text>
  <!-- 收款渠道 -->
  <rect x="560" y="60" width="270" height="74" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/>
  <text x="695" y="90" text-anchor="middle" font-weight="700">收款渠道</text>
  <text x="695" y="112" text-anchor="middle" fill="#475569" font-size="12">进件开户 → 收款商户号 → 绑定门店</text>
  <!-- 销售渠道 -->
  <rect x="560" y="260" width="270" height="74" rx="10" fill="#fdf4ff" stroke="#d946ef"/>
  <text x="695" y="290" text-anchor="middle" font-weight="700">销售渠道</text>
  <text x="695" y="312" text-anchor="middle" fill="#475569" font-size="12">自有小程序 / 外卖 / 团购等平台授权</text>
  <!-- edges -->
  <line x1="180" y1="180" x2="268" y2="110" stroke="#475569" marker-end="url(#a)"/>
  <text x="196" y="132" fill="#334155" font-size="12">负责人（1..n）</text>
  <line x1="180" y1="215" x2="268" y2="285" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="190" y="272" fill="#334155" font-size="12">员工身份（n..n）</text>
  <line x1="355" y1="134" x2="355" y2="258" stroke="#475569" marker-end="url(#a)"/>
  <text x="362" y="200" fill="#334155" font-size="12">名下门店（1..n）</text>
  <line x1="440" y1="97" x2="558" y2="97" stroke="#475569" marker-end="url(#a)"/>
  <text x="452" y="88" fill="#334155" font-size="12">以主体进件</text>
  <line x1="600" y1="134" x2="440" y2="272" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="520" y="176" fill="#334155" font-size="12">收款号绑定门店</text>
  <line x1="440" y1="297" x2="558" y2="297" stroke="#475569" marker-end="url(#a)"/>
  <text x="452" y="288" fill="#334155" font-size="12">门店授权接入</text>
  <text x="30" y="380" fill="#64748b" font-size="12">实线：归属 / 发起；虚线：多对多关联或绑定。注销、冻结沿实线向下传导，不沿虚线传导。</text>
</svg>
