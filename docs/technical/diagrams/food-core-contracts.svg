<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d">
<title id="t">餐饮扩展与现有商品订单基座关系</title>
<desc id="d">线上顾客与门店终端进入餐饮应用；餐饮通过应用适配调用现有商品、订单和支付库存服务。餐饮表保存个性数据并消费核心事件，打印独立消费已发生的业务事实。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="540" fill="#f7f9fc"/>
<g font-family="system-ui,sans-serif" fill="#203047">
<text x="35" y="42" font-size="24" font-weight="700">餐饮扩展：基础事实复用，个性数据旁挂</text>
<rect x="35" y="75" width="930" height="55" rx="10" fill="#e4edfc"/>
<text x="90" y="109" font-size="19">扫码 / H5 / 小程序　　服务员 / 收银台 / 点餐机　　厨房屏</text>
<rect x="35" y="180" width="280" height="125" rx="12" fill="#2563b5"/>
<text x="55" y="214" font-size="20" fill="white">餐饮应用与 fnb_* 扩展表</text>
<text x="55" y="249" font-size="16" fill="white">菜单、口味、桌台、批次</text>
<text x="55" y="277" font-size="16" fill="white">制作、上菜、业务日志</text>
<rect x="385" y="180" width="230" height="125" rx="12" fill="#e4edfc"/>
<text x="407" y="215" font-size="20">契约与应用适配</text>
<text x="407" y="249" font-size="16">授权、预览、建单、绑定</text>
<text x="407" y="277" font-size="16">付款、交付、事件转换</text>
<rect x="685" y="180" width="280" height="125" rx="12" fill="#20765b"/>
<text x="707" y="215" font-size="20" fill="white">现有商品与交易基座</text>
<text x="707" y="249" font-size="16" fill="white">商品 / SKU / 价格 / 基础订单</text>
<text x="707" y="277" font-size="16" fill="white">支付 / 库存 / 售后 / 统计</text>
<rect x="35" y="395" width="580" height="90" rx="12" fill="#e4edfc"/>
<text x="55" y="427" font-size="20">独立打印应用与通道</text>
<text x="55" y="460" font-size="16">餐饮提供内容 → 路由、任务、回执 → 云 / LAN / USB 打印</text>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)">
<path d="M175 130V175"/><path d="M315 240H379"/><path d="M615 240H679"/>
<path d="M825 305V345H175V310"/><path d="M175 305V390"/>
</g>
<text x="438" y="337" font-size="15">核心业务事件 → 餐饮幂等消费</text>
<text x="190" y="380" font-size="15">已受理业务事实</text>
<text x="685" y="420" font-size="17">金额与库存由基座维护</text>
<text x="685" y="450" font-size="17">制作与打印不改变收款事实</text>
<text x="35" y="520" font-size="15" fill="#52647b">目标设计：优先新增包、扩展表和适配器；确有缺口时才补通用核心接口。</text>
</g></svg>
