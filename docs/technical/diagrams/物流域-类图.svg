<text class="n" x="306" y="615">wx-waybill-bind　0 5,35</text><text class="sm" x="306" y="630">预先换 waybill_token 落库</text>
<rect class="job" x="556" y="598" width="248" height="40" rx="5"/>
<text class="n" x="566" y="615">wx-shipping-upload　0 */10</text><text class="sm" x="566" y="630">排空上报队列 → 微信</text>
<rect class="job" x="816" y="598" width="248" height="40" rx="5"/>
<text class="n" x="826" y="615">order-auto-receipt　0 0 3</text><text class="sm" x="826" y="630">发货后 N 天自动确认收货</text>

<!-- 底部说明 -->
<rect x="20" y="664" width="1200" height="156" rx="7" style="fill:#FBFCFD;stroke:#E3E8EE;stroke-width:1.1"/>
<text class="b" x="36" y="686">图上看不出来的三件事</text>
<text class="sm" x="36" y="708">① <tspan font-weight="700">两种扩展模型不是风格差异，是能力差异。</tspan> C、D 两列的多家实现<tspan font-weight="700">同时活着</tspan>，由路由器按配置链挑；A、B、E 三列靠 @ConditionalOnProperty，</text>
<text class="sm" x="48" y="724">同一时刻<tspan font-weight="700">只有一个 bean</tspan>。所以「寄件要支持多家」不是加一个实现就行，得先补一个 PickupRouter —— 这是本次架构的主要缺口。</text>
<text class="sm" x="36" y="746">② <tspan font-weight="700">C 与 D 正交。</tspan>「谁去查轨迹」（快递100/圆通）与「怎么呈现给买家」（微信全屏页/自建地图）是两件独立的事：同一条快递100 查来的轨迹，</text>
<text class="sm" x="48" y="762">在小程序走微信插件、在 B 端走自建地图。把它们混成一轴，就会出现「换了数据源，B 端的地图跟着没了」。</text>
<text class="sm" x="36" y="784">③ <tspan font-weight="700">读路径不碰外部。</tspan>订单详情只走 ShipmentTraceQueryPort 纯读库（图右下虚线）。轨迹由作业预先查好、token 由作业预先换好 ——</text>
<text class="sm" x="48" y="800">买家反复下拉刷不穿快递100 的计费和微信的调用配额。代价是数据最新度取决于作业频率，这正是下面方案要改的地方。</text>
</svg>
