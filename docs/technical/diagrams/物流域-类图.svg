.b{font-size:10.5px;fill:#8A94A2;letter-spacing:.1em;font-weight:600}
.l{font-size:9px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.port{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.7}
.router{fill:#FDF6EC;stroke:#D9994A;stroke-width:1.7}
.impl{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.implon{fill:#FBFDFB;stroke:#9CC9AC;stroke-width:1.4}
.caller{fill:#F7F8FA;stroke:#C4CBD5;stroke-width:1.2}
.data{fill:#EEF4FC;stroke:#8FADD4;stroke-width:1.3}
.job{fill:#FBF4F6;stroke:#C98FA6;stroke-width:1.3}
.ar{stroke:#8A94A2;stroke-width:1.2;fill:none}
.arw{stroke:#C9752F;stroke-width:1.5;fill:none}
.zone{fill:none;stroke:#DDE2E9;stroke-width:1.1;stroke-dasharray:5 4}
.zt{font-size:9.5px;fill:#A6AEBB;letter-spacing:.08em}
.badge{font-size:9px;font-weight:700}
