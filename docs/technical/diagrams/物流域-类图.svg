<!-- 数据层 -->
<rect class="zone" x="20" y="470" width="1200" height="86" rx="6"/>
<text class="zt" x="30" y="488">落库 · shop-core/fulfillment + trade</text>
<rect class="data" x="36" y="496" width="150" height="46" rx="5"/>
<text class="n" x="46" y="514">ful_freight_tmpl</text><text class="sm" x="46" y="530">首重/续重/满免/地区规则</text>
