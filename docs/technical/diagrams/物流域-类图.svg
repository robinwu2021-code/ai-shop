</style></defs>

<text class="b" x="24" y="24">物流域 · 五个能力 · 两种扩展模型</text>
<text class="sm" x="24" y="40">绿 = SPI 端口（调用方只认它）　橙 = 路由器（多家共存的关键）　白 = 具体实现　蓝 = 落库　粉 = 定时作业</text>

<!-- 调用方 -->
<rect class="zone" x="20" y="54" width="1200" height="52" rx="6"/>
<text class="zt" x="30" y="70">调用方 · shop-core / shop-app</text>
<rect class="caller" x="36" y="74" width="168" height="24" rx="4"/><text class="mt" x="46" y="90">OrderServiceImpl 算运费</text>
<rect class="caller" x="214" y="74" width="190" height="24" rx="4"/><text class="mt" x="224" y="90">ExpressPickupServiceImpl 寄件</text>
<rect class="caller" x="414" y="74" width="196" height="24" rx="4"/><text class="mt" x="424" y="90">LogisticsServiceImpl 刷轨迹</text>
<rect class="caller" x="620" y="74" width="196" height="24" rx="4"/><text class="mt" x="630" y="90">WxWaybillBindService 备展示</text>
<rect class="caller" x="826" y="74" width="190" height="24" rx="4"/><text class="mt" x="836" y="90">WxShippingUploadJob 上报</text>
<rect class="caller" x="1026" y="74" width="178" height="24" rx="4"/><text class="mt" x="1036" y="90">订单详情 读缓存</text>

