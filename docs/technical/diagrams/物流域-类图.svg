<text class="n" x="1052" y="514">ExpressCompanies</text><text class="sm" x="1052" y="530">14 个码 · 人工核验固化</text>

<!-- 作业层 -->
<rect class="zone" x="20" y="572" width="1200" height="76" rx="6"/>
<text class="zt" x="30" y="590">定时作业 · 调度表 job_definition 里逐个开关（新作业注册进来默认是关的）</text>
<rect class="job" x="36" y="598" width="248" height="40" rx="5"/>
<text class="n" x="46" y="615">logistics-trace　0 */30</text><text class="sm" x="46" y="630">扫在途 → 查轨迹 → 推进状态</text>
