<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>物流域类图：五个能力各自一个 SPI 端口，两种扩展模型（链式多家 / 条件单活）</title>
<desc>物流域按能力切成五列：运费计算、寄件下单、轨迹查询、轨迹展示、发货上报。每列顶上是 shop-base/spi 里的端口接口，调用方只认它。轨迹查询与轨迹展示这两列中间多一层路由器，把多家实现按配置链串起来、逐级回退，是「支持多家」已经成立的两处；寄件下单与发货上报两列没有路由器，靠 @ConditionalOnProperty 二选一，同一时刻只有一个 bean 活着，要支持多家必须先补路由器。底部是落库的六张表与四个定时作业。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C9752F" stroke-width="1.5" stroke-linecap="round"/></marker>
<style>
