<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1186" viewBox="0 0 1320 1186" role="img" aria-labelledby="title desc">
<title id="title">规则配置编译对象关系</title>
<desc id="desc">规则配置编译对象关系。每行是一条有向关系；同名框代表同一对象或状态，箭头上的文字表示分支条件。PricingConfigCompiler → SystemConstraints（依赖）；PricingConfigCompiler → PricingCapabilities（依赖）；PricingConfigCompiler → CompilationResult（产出）；SystemConstraints → PricingRuleCatalog（引用）；PricingRuleCatalog → RuleDefinition（定义）；CompilationResult → EffectivePricingConfig（成功时包含）；EffectivePricingConfig → Definition（包含）；EffectivePricingConfig → RuleDefinition（包含）；RuleDefinition → Parameters（使用）；ForbiddenCombination → Parameters（实现 / 继承）；CountLimits → Parameters（实现 / 继承）；FixedPolicyParameters → Parameters（实现 / 继承）</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="42" font-size="26" font-family="Arial, sans-serif" fill="#0f172a">规则配置编译对象关系</text>
<text x="30" y="74" font-size="16" font-family="Arial, sans-serif" fill="#475569">逐条展开有向关系；同名框是同一对象或状态。分支与恢复回路按箭头条件读取。</text>
