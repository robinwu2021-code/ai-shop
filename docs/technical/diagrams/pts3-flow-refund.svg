<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1210" viewBox="0 0 1640 1210"><title>核销退款与备付资金流转</title><desc>退款准备及资金结果门禁，按门店/未付D/已付已追回/已付未追回四分支退回用户，迟到追回回B。</desc>
<defs><marker id="point" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="money" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c2410c"/></marker><marker id="dep" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b"/></marker><marker id="real" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="white" stroke="#475569"/></marker><marker id="diamond" markerWidth="15" markerHeight="10" refX="14" refY="5" orient="auto-start-reverse"><path d="M0 5L7 0L14 5L7 10Z" fill="#475569"/></marker></defs>
<rect width="1640" height="1210" fill="#f8fafc"/>
<text x="35" y="48" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#172554" font-weight="650" text-anchor="start">核销退款与备付资金流转</text>
<text x="35" y="80" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526277" font-weight="400" text-anchor="start">v3 设计契约 · pay-domain内业务模块 · payTxManager · 实现与验收状态见 TDD</text>
<rect x="35" y="150" width="440" height="145" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35" y="150" width="6" height="145" rx="3" fill="#7c3aed"/>
<text x="51" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">准备退款</text>
<text x="51" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">锁核销/发放头寸</text>
<text x="51" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">返分收回冻结到专用H</text>
<rect x="600" y="150" width="440" height="145" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="600" y="150" width="6" height="145" rx="3" fill="#7c3aed"/>
<text x="616" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">现金退款结果明确</text>
<text x="616" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">成功或合法零现金完成</text>
<text x="616" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">失败重试；未知不撤销</text>
<rect x="1165" y="150" width="440" height="145" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="1165" y="150" width="6" height="145" rx="3" fill="#7c3aed"/>
<text x="1181" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">按兑付位置处理</text>
<text x="1181" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">PAYING先查清结果</text>
<text x="1181" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不能凭超时假定未付款</text>
<path d="M475,220 L600,220" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<path d="M1040,220 L1165,220" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="35" y="460" width="375" height="155" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="35" y="460" width="6" height="155" rx="3" fill="#2563eb"/>
<text x="51" y="489" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">门店户，未兑付</text>
<text x="51" y="515" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">STORE.P/A → USER.A</text>
<text x="51" y="538" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">C不变，释放该部分B额度</text>
<path d="M1385,295 L1385,360 L222,360 L222,460" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<path d="M222,615 L222,720 L805,720 L805,810" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="440" y="460" width="375" height="155" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="440" y="460" width="6" height="155" rx="3" fill="#2563eb"/>
<text x="456" y="489" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">已兑付，D未付</text>
<text x="456" y="515" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">RECEIVE预留 → USER.A</text>
<text x="456" y="538" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">D→C，释放该部分B额度</text>
<path d="M1385,295 L1385,360 L627,360 L627,460" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<path d="M627,615 L627,720 L805,720 L805,810" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="845" y="460" width="375" height="155" rx="12" fill="white" stroke="#c2410c" stroke-width="1.8"/>
<rect x="845" y="460" width="6" height="155" rx="3" fill="#c2410c"/>
<text x="861" y="489" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#c2410c" font-weight="650" text-anchor="start">已付款，回款已到</text>
<text x="861" y="515" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">RECEIVE预留 → USER.A</text>
<text x="861" y="538" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">真实回款进C，释放B额度</text>
<path d="M1385,295 L1385,360 L1032,360 L1032,460" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<path d="M1032,615 L1032,720 L805,720 L805,810" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1250" y="460" width="375" height="155" rx="12" fill="white" stroke="#be123c" stroke-width="1.8"/>
<rect x="1250" y="460" width="6" height="155" rx="3" fill="#be123c"/>
<text x="1266" y="489" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#be123c" font-weight="650" text-anchor="start">已付款，回款未到</text>
<text x="1266" y="515" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">RECEIVE预留 → USER.A</text>
<text x="1266" y="538" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">B→C，消耗预留并登记R</text>
<path d="M1385,295 L1385,360 L1437,360 L1437,460" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<path d="M1437,615 L1437,720 L805,720 L805,810" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="600" y="810" width="410" height="145" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="600" y="810" width="6" height="145" rx="3" fill="#2563eb"/>
<text x="616" y="839" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">USER.A 返回可用积分</text>
<text x="616" y="865" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">确认后才可使用</text>
<text x="616" y="888" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">返分实款已在C，不用R兑付</text>
<rect x="1165" y="810" width="440" height="145" rx="12" fill="white" stroke="#c2410c" stroke-width="1.8"/>
<rect x="1165" y="810" width="6" height="145" rx="3" fill="#c2410c"/>
<text x="1181" y="839" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#c2410c" font-weight="650" text-anchor="start">后续真实追回</text>
<text x="1181" y="865" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">R减少，实际回款补B</text>
<text x="1181" y="888" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不再增加C，不重复退分</text>
<path d="M1437,615 L1437,810" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#money)"/>
<rect x="1445" y="743" width="76" height="26" rx="4" fill="#f8fafc"/>
<text x="1450" y="760" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#c2410c" font-weight="400" text-anchor="start">迟到回款</text>
<rect x="35" y="1030" width="1570" height="130" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35" y="1030" width="6" height="130" rx="3" fill="#7c3aed"/>
<text x="51" y="1059" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">累计比例与责任边界</text>
<text x="51" y="1085" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">抵扣退分按累计商品退款；仅退运费不退积分；全商品退补齐尾差。返分收回按原发放行及迟到发放基线单独计算。</text>
<text x="51" y="1108" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">门店账单DRAFT先重算；已确认未付款先撤销确认；付款中查询后再走对应分支。</text>
</svg>
