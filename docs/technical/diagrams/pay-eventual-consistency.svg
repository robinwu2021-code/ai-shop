<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="880" viewBox="0 0 1060 880" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>支付域拆分的三层一致性保证与七处跨域调用的分类</title>
<desc>三层保证：L1 Outbox 保证事件与业务数据同事务落库、至少投递一次；L2 按业务键幂等，保证至多生效一次；L3 不变式扫描兜底，只看事实不看消息，是唯一不依赖前两层正确性的检查。七处跨域调用按方向分四类：前置（下单扣积分，唯一不能用 Outbox 的一处，改预扣加超时释放）、后置（发积分与生成结算单，改 Outbox 加幂等）、补偿（取消与超时关单退分，同样走 Outbox）、有序（退款两步，保持同步调用与状态机，只补重试任务）。四批任务 A 补欠账、B 解事务耦合、C 结构搬家、D 切换，每批停下都有价值，只有最后的切库不可回退。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.em{font-weight:700;fill:#161A21}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.l{font-size:9.5px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.l1{fill:#EEF4FC;stroke:#7FA2CC;stroke-width:1.4}
.l2{fill:#F5F0FA;stroke:#9B87BF;stroke-width:1.4}
.l3{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.6}
.warn{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.3}
.stop{fill:#FBF0F0;stroke:#C97B7B;stroke-width:1.4}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.zt{font-size:10px;fill:#A6AEBB;letter-spacing:.1em}
</style></defs>

<text class="b" x="24" y="26">① 三层保证 —— 缺一层都不够</text>

<rect class="l1" x="24" y="38" width="322" height="112" rx="8"/>
<text class="n" x="40" y="58">L1　可靠投递　Outbox</text>
<text class="t" x="40" y="78">事件与业务数据<tspan class="em">同事务落库</tspan></text>
<text class="t" x="40" y="95">投递语义 at-least-once</text>
<text class="t" x="40" y="118">✅ OutboxEventBus + OutboxDispatcher</text>
<text class="t" x="40" y="135">已有，换 MQ 只改 deliver 一个方法</text>

<rect class="l2" x="360" y="38" width="322" height="112" rx="8"/>
<text class="n" x="376" y="58">L2　幂等消费</text>
<text class="t" x="376" y="78">按业务键唯一索引去重</text>
<text class="t" x="376" y="95">at-most-once 生效</text>
<text class="t" x="376" y="118">⚠️ IdempotencyService 是<tspan class="em">接口级</tspan>的</text>
<text class="t" x="376" y="135">域内事件级要新建 pay_event_consumed</text>

<rect class="l3" x="696" y="38" width="340" height="112" rx="8"/>
<text class="n" x="712" y="58">L3　不变式兜底</text>
<text class="t" x="712" y="78"><tspan class="em">只看事实，不看消息</tspan></text>
<text class="t" x="712" y="95">「这个子单是 PAID，它有没有结算单？」</text>
<text class="t" x="712" y="118">❌ 今天没有。而它是唯一一层</text>
<text class="t" x="712" y="135">不依赖上面两层正确性的检查</text>

<text class="l" x="24" y="172">L1 + L2 = 恰好一次生效，这是常规路径。L3 兜的是前两层盖不住的两个洞：Outbox 那一行本身没写成功；消费者逻辑有 bug。</text>

<line x1="24" y1="190" x2="1036" y2="190" stroke="#E6EAF0" stroke-width="1"/>
<text class="b" x="24" y="216">② 七处跨域调用 —— 按方向分类，不能一律套 Outbox</text>

<rect class="stop" x="24" y="228" width="250" height="166" rx="8"/>
<text class="n" x="40" y="248">前置　1 处</text>
<text class="t" x="40" y="267">业务成立<tspan class="em">之前</tspan>就动了 pay 的账</text>
<text class="t" x="40" y="290">OrderServiceImpl:586</text>
<text class="t" x="40" y="306">pointsPort.deduct（下单扣分）</text>
<text class="t" x="40" y="330"><tspan class="em">唯一不能用 Outbox 的一处</tspan></text>
<text class="t" x="40" y="347">扣了单没建 → 用户白扣，</text>
<text class="t" x="40" y="363">而他不会来报（以为没下成）</text>
<text class="t" x="40" y="384">改：预扣 + 确认 + 超时释放</text>

<rect class="l1" x="288" y="228" width="250" height="166" rx="8"/>
<text class="n" x="304" y="248">后置　2 处</text>
<text class="t" x="304" y="267">业务已成，pay 侧必须最终发生</text>
<text class="t" x="304" y="290">:944　pointsPort.grant</text>
<text class="t" x="304" y="306">:963　settlePort.generateForOrder</text>
<text class="t" x="304" y="330">改：Outbox + 按 subOrderNo 幂等</text>
<text class="t" x="304" y="352">顺带的收益：markPaid 的事务</text>
<text class="t" x="304" y="368">从「订单+配额+积分+结算+事件」</text>
<text class="t" x="304" y="384">缩到只写订单表，P99 会变好</text>

<rect class="l1" x="552" y="228" width="220" height="166" rx="8"/>
<text class="n" x="568" y="248">补偿　2 处</text>
<text class="t" x="568" y="267">它本身就是补偿动作</text>
<text class="t" x="568" y="290">:1058　cancel</text>
<text class="t" x="568" y="306">:1105　closeExpiredOrders</text>
<text class="t" x="568" y="322">　　　 pointsPort.reverse</text>
<text class="t" x="568" y="346">改：同样走 Outbox ——</text>
<text class="t" x="568" y="362"><tspan class="em">补偿本身也要保证到达</tspan>，</text>
<text class="t" x="568" y="378">否则单取消了分没退</text>

<rect class="warn" x="786" y="228" width="250" height="166" rx="8"/>
<text class="n" x="802" y="248">有序　2 处</text>
<text class="t" x="802" y="267">两步严格先后，前一步失败必须停</text>
<text class="t" x="802" y="290">AfterSaleServiceImpl:319 reverseSplit</text>
<text class="t" x="802" y="306">　　　　　　　　　　:327 refund</text>
<text class="t" x="802" y="330"><tspan class="em">今天已经是对的形状</tspan> ——</text>
<text class="t" x="802" y="347">REFUNDING + 失败就停，不往下走。</text>
<text class="t" x="802" y="363">拆进程后一个字都不用改。</text>
<text class="t" x="802" y="384">要补的只有一个重试 job</text>

<rect class="stop" x="24" y="406" width="1012" height="50" rx="7"/>
<text class="n" x="40" y="426">今天没有任何东西在重试卡住的退款单</text>
<text class="t" x="40" y="445">grep -rln "REFUNDING" shop-*/src/main/java | grep -i "job\|retry"　→　空。这不是拆分才有的问题，是今天就欠着的账。</text>

<line x1="24" y1="480" x2="1036" y2="480" stroke="#E6EAF0" stroke-width="1"/>
<text class="b" x="24" y="506">③ 四批任务 —— 每批停下都有价值，只有最后一步不可回退</text>

<rect class="l3" x="24" y="518" width="244" height="150" rx="8"/>
<text class="n" x="40" y="538">批 A　补今天就欠的账</text>
<text class="t" x="40" y="558">A1　REFUNDING 重试 job</text>
<text class="t" x="40" y="575">A2　I1 / I2 / I4 不变式扫描</text>
<text class="t" x="40" y="592">A3　事件级幂等表</text>
<text class="t" x="40" y="616">不依赖任何拆分决定，</text>
<text class="t" x="40" y="633">做完系统<tspan class="em">直接变健壮</tspan></text>
<text class="t" x="40" y="655">风险：低</text>

<rect class="warn" x="282" y="518" width="244" height="150" rx="8"/>
<text class="n" x="298" y="538">批 B　解事务耦合</text>
<text class="t" x="298" y="558">B1　pay 独立 DataSource</text>
<text class="t" x="298" y="575">B2–B5　七处逐个改</text>
<text class="t" x="298" y="598">B1 是地基：装上之后</text>
<text class="t" x="298" y="615">剩下四个从「记得改」</text>
<text class="t" x="298" y="632">变成「不改就测试红」</text>
<text class="t" x="298" y="655">风险：<tspan class="em">高</tspan>（动钱）</text>

<rect class="box" x="540" y="518" width="244" height="150" rx="8"/>
<text class="n" x="556" y="538">批 C　结构搬家</text>
<text class="t" x="556" y="558">C1　shop-base 去 MyBatis</text>
<text class="t" x="556" y="575">C2　shop-settle → pay-*</text>
<text class="t" x="556" y="592">C3–C4　双形态 + 产物</text>
<text class="t" x="556" y="616">量过了：零个业务模块</text>
<text class="t" x="556" y="633">import settle —— <tspan class="em">是改包名</tspan></text>
<text class="t" x="556" y="655">风险：低</text>

<rect class="box" x="798" y="518" width="238" height="150" rx="8"/>
<text class="n" x="814" y="538">批 D　切换</text>
<text class="t" x="814" y="558">D1　会话外置（分三批）</text>
<text class="t" x="814" y="575">D2–D4　nginx 逐条切流量</text>
<text class="t" x="814" y="592">D5　主应用去依赖</text>
<text class="t" x="814" y="616">D2–D5 回滚 = 改一行 nginx</text>
<text class="t" x="814" y="639">D6 切库：<tspan class="em">不可回退</tspan>，</text>
<text class="t" x="814" y="655">单独评审</text>

<path class="ar" marker-end="url(#ar)" d="M268 592 L282 592"/>
<path class="ar" marker-end="url(#ar)" d="M526 592 L540 592"/>
<path class="ar" marker-end="url(#ar)" d="M784 592 L798 592"/>

<line x1="24" y1="692" x2="1036" y2="692" stroke="#E6EAF0" stroke-width="1"/>
<text class="b" x="24" y="718">④ 验收：混沌注入，而不是「跑一遍没报错」</text>

<rect class="l3" x="24" y="730" width="1012" height="88" rx="7"/>
<text class="t" x="40" y="752">outboxDispatcher.pause();                    ← 注入：让 L1 失效</text>
<text class="t" x="40" y="770">orderService.markPaid(orderNo, ...);</text>
<text class="t" x="40" y="788">assertThat(billsOf(orderNo)).isEmpty();      ← <tspan class="em">前置断言不能省</tspan>：没有它，pause() 没生效时测试照样绿，</text>
<text class="t" x="40" y="806">invariantJob.run();                             而它证明的是「L1 正常」，不是「L3 能兜底」</text>

<text class="l" x="24" y="846">每条不变式的扫描测试都要断言<tspan class="em">扫描行数 &gt; 0</tspan> —— 「差异 0 条」与「一行都没扫到」在结果上一模一样，而后者才是最该红的那种。</text>
<text class="l" x="24" y="866">自动修复要分清方向：I1 可以自动补生成结算单（幂等）；I2「有结算单但没有已支付子单」<tspan class="em">绝不能自动删</tspan> —— 删账不可逆。</text>
</svg>
