<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分域架构</title>
<desc>三个区：用户侧（积分流水是真源，EARN 行是批次、USE 行是一次兑付，账户余额由流水重算派生）、商家侧（资金流水一本账）、平台（积分资金池与账期单）。钱的闭环是：商家发分扣的费用金进池 → 用户在别家花分时池子付给收单方 → 账期单结算后回池。积分发出后与发放商家脱钩，所以没有「按发放方分摊」这一环。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#F7F9FB;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs>

<rect x="16" y="30" width="200" height="140" rx="8" fill="none" stroke="#D8DEE6" stroke-dasharray="4 3"/>
<text class="g" x="28" y="48">用户侧</text>
<rect x="34" y="60" width="164" height="44" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="116" y="79" text-anchor="middle">积分流水</text>
<text class="s" x="116" y="94" text-anchor="middle">真源 · EARN 行即批次</text>
<rect x="34" y="122" width="164" height="38" rx="6" fill="#F3F5F7" stroke="#C6CDD6"/>
<text class="n" x="116" y="138" text-anchor="middle">积分账户</text>
<text class="s" x="116" y="152" text-anchor="middle">余额（派生）</text>
<line class="ar" x1="116" y1="104" x2="116" y2="119" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text class="l" x="124" y="116" text-anchor="start">重算</text>

<rect x="250" y="30" width="200" height="86" rx="8" fill="none" stroke="#D8DEE6" stroke-dasharray="4 3"/>
<text class="g" x="262" y="48">同一张流水表 · USE 行</text>
<rect x="268" y="60" width="164" height="44" rx="6" fill="#FDF3E3" stroke="#D9B87C"/>
<text class="n" x="350" y="79" text-anchor="middle">USE 流水</text>
<text class="s" x="350" y="94" text-anchor="middle">一次使用一条 · 记收单方</text>

<rect x="250" y="212" width="200" height="86" rx="8" fill="none" stroke="#D8DEE6" stroke-dasharray="4 3"/>
<text class="g" x="262" y="230">商家侧</text>
<rect x="268" y="242" width="164" height="44" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="350" y="261" text-anchor="middle">资金流水</text>
<text class="s" x="350" y="276" text-anchor="middle">发分付费 · 收单进账</text>

<rect x="484" y="30" width="200" height="268" rx="8" fill="none" stroke="#D8DEE6" stroke-dasharray="4 3"/>
<text class="g" x="496" y="48">平台</text>
<rect x="502" y="60" width="164" height="48" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="584" y="80" text-anchor="middle">积分资金池</text>
<text class="s" x="584" y="95" text-anchor="middle">余额 == 流通积分对应的钱</text>
<rect x="502" y="242" width="164" height="44" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="584" y="261" text-anchor="middle">账期单</text>
<text class="s" x="584" y="276" text-anchor="middle">每商家每期每市场一张</text>

<line class="ar" x1="198" y1="82" x2="265" y2="82" marker-end="url(#a)"/>
<line class="ar" x1="350" y1="104" x2="350" y2="239" marker-end="url(#a)"/>
<path class="ar" d="M300 242 L300 182 L530 182 L530 111" marker-end="url(#a)"/>
<path class="ar" d="M616 108 L616 204 L400 204 L400 239" marker-end="url(#a)"/>
<line class="ar" x1="432" y1="264" x2="499" y2="264" marker-end="url(#a)"/>
<path class="ar" d="M666 250 L676 250 L676 84 L669 84" marker-end="url(#a)"/>

<text class="l" x="231" y="76" text-anchor="middle">扣批次</text>
<text class="l" x="358" y="144" text-anchor="start">兑付成立</text>
<text class="l" x="412" y="178" text-anchor="middle">发分扣的费用金</text>
<text class="l" x="508" y="200" text-anchor="middle">用户花分时付给收单方</text>
<text class="l" x="466" y="258" text-anchor="middle">计提</text>
<text class="l" x="676" y="170" text-anchor="middle" transform="rotate(-90 676 170)">结算回池</text>
</svg>
