<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="服务业三轨：预约轨占位、工单轨执行、订单延迟诞生于到店，经核销耗卡回到基础流"><rect width="960" height="500" fill="#FFFFFF"/><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D3040"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8342B"/></marker><marker id="a-jade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#256C5C"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55636F"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="28" y="40" width="904" height="116" rx="8" fill="none" stroke="#256C5C" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/><text x="38" y="58" font-size="11" fill="#256C5C" font-weight="600">服务业工作流 · 预约轨</text><rect x="60" y="72" width="140" height="46" rx="6" fill="#E4F0EB" stroke="#256C5C" stroke-width="1.4"/><text x="130.0" y="99.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">建预约 PENDING</text><text x="130.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">tryBook 占位·可无订单可无会员</text><rect x="280" y="72" width="140" height="46" rx="6" fill="#E4F0EB" stroke="#256C5C" stroke-width="1.4"/><text x="350.0" y="99.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">确认 CONFIRMED</text><rect x="500" y="72" width="150" height="46" rx="6" fill="#E4F0EB" stroke="#256C5C" stroke-width="1.4"/><text x="575.0" y="99.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">到店 CHECKED_IN</text><text x="575.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">爽约→NO_SHOW·按规则</text><line x1="202" y1="95" x2="258" y2="95" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><line x1="422" y1="95" x2="478" y2="95" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><rect x="28" y="186" width="904" height="112" rx="8" fill="none" stroke="#256C5C" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/><text x="38" y="204" font-size="11" fill="#256C5C" font-weight="600">服务业工作流 · 工单轨</text><rect x="500" y="216" width="140" height="46" rx="6" fill="#E4F0EB" stroke="#256C5C" stroke-width="1.4"/><text x="570.0" y="243.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">开工单 CREATED</text><rect x="672" y="216" width="110" height="46" rx="6" fill="#E4F0EB" stroke="#256C5C" stroke-width="1.4"/><text x="727.0" y="243.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">服务 SERVING</text><text x="727.0" y="277" text-anchor="middle" font-size="10.5" fill="#55636F">换人=改行+留痕</text><rect x="812" y="216" width="110" height="46" rx="6" fill="#E4F0EB" stroke="#256C5C" stroke-width="1.4"/><text x="867.0" y="243.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">完成·核销</text><line x1="575" y1="120" x2="575" y2="214" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><line x1="642" y1="239" x2="670" y2="239" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><line x1="784" y1="239" x2="812" y2="239" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><rect x="28" y="330" width="904" height="124" rx="8" fill="none" stroke="#1D3040" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/><text x="38" y="348" font-size="11" fill="#1D3040" font-weight="600">基础订单流 · 订单轨（同一条）</text><rect x="280" y="364" width="160" height="52" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="360.0" y="386.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">place</text><text x="360.0" y="402.5" text-anchor="middle" font-size="10.5" fill="#FFFFFF">订单在这里才诞生</text><rect x="560" y="364" width="190" height="52" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="655.0" y="386.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">markPaid(TIMES_CARD…)</text><text x="655.0" y="402.5" text-anchor="middle" font-size="10.5" fill="#FFFFFF">payAmount=0·assetDeduct</text><rect x="812" y="364" width="110" height="52" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="867.0" y="386.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">结算·提成</text><text x="867.0" y="402.5" text-anchor="middle" font-size="10.5" fill="#FFFFFF">基数=原价快照</text><line x1="442" y1="390" x2="558" y2="390" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="752" y1="390" x2="810" y2="390" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="150" y1="120" x2="300" y2="362" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><text x="150" y="300" text-anchor="start" font-size="10.5" fill="#256C5C">①线上付：预约时 place</text><line x1="545" y1="264" x2="420" y2="362" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><text x="430" y="318" text-anchor="start" font-size="10.5" fill="#256C5C">②到店付/耗卡：此时才 place —— 避免幽灵订单</text><line x1="858" y1="264" x2="700" y2="362" stroke="#256C5C" stroke-width="1.5" marker-end="url(#a-jade)"/><text x="940" y="330" text-anchor="end" font-size="10.5" fill="#256C5C">③ verify + deductAsset(基座流水) + markPaid</text><line x1="600" y1="362" x2="350" y2="122" stroke="#1D3040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-ink)"/><text x="470" y="270" text-anchor="start" font-size="10.5" fill="#1D3040">onPaid → CONFIRMED</text><text x="60" y="482" text-anchor="start" font-size="10.5" fill="#55636F">逆向：onRefunded → 提成倒扣 + 资产冲正（先于退款存在性检查）；疗程 = 卖卡 1 单 + 每次到店各 1 单（订单 ≡ 一次消费）。</text></g></svg>