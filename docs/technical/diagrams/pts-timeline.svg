<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分三个时点</title>
<desc>下单抵扣 → 支付成功 → 分岔为「发放积分（可见不可用）」与「计提扣减（商家看到实收）」，两条在售后期汇合；期内退款走情形 A，期满则积分转可用且货款解冻分账，最后进入账期末结算。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:11px;fill:#5A6472}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs>

<rect x="14" y="112" width="104" height="46" rx="6" fill="#EDEFF2" stroke="#B3B9C2"/>
<text class="n" x="66" y="132" text-anchor="middle">下单</text>
<text class="s" x="66" y="147" text-anchor="middle">抵扣扣减</text>

<rect x="150" y="112" width="104" height="46" rx="6" fill="#EDEFF2" stroke="#B3B9C2"/>
<text class="n" x="202" y="139" text-anchor="middle">支付成功</text>

<rect x="286" y="52" width="122" height="52" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="347" y="74" text-anchor="middle">发放积分</text>
<text class="s" x="347" y="90" text-anchor="middle">可见不可用</text>

<rect x="286" y="166" width="122" height="52" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="347" y="188" text-anchor="middle">计提扣减</text>
<text class="s" x="347" y="204" text-anchor="middle">商家看到实收</text>

<path d="M494 135 L444 105 L394 135 L444 165 Z" fill="#FDF3E3" stroke="#D9B87C"/>
<text class="n" x="444" y="139" text-anchor="middle">售后期</text>

<rect x="530" y="34" width="156" height="62" rx="6" fill="#F7ECEC" stroke="#D0A6A6"/>
<text class="n" x="608" y="54" text-anchor="middle">撤销待生效分</text>
<text class="s" x="608" y="70" text-anchor="middle">退还费用金</text>
<text class="s" x="608" y="86" text-anchor="middle">情形 A</text>

<rect x="530" y="152" width="156" height="52" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="608" y="173" text-anchor="middle">积分转可用</text>
<text class="s" x="608" y="189" text-anchor="middle">货款解冻分账</text>

<rect x="530" y="236" width="156" height="40" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="608" y="261" text-anchor="middle">账期末结算</text>

<line class="ar" x1="118" y1="135" x2="147" y2="135" marker-end="url(#a)"/>
<path class="ar" d="M254 135 L270 135 L270 78 L283 78" marker-end="url(#a)"/>
<path class="ar" d="M254 135 L270 135 L270 192 L283 192" marker-end="url(#a)"/>
<path class="ar" d="M408 78 L424 78 L424 108" marker-end="url(#a)"/>
<path class="ar" d="M408 192 L424 192 L424 162" marker-end="url(#a)"/>
<path class="ar" d="M494 135 L512 135 L512 65 L527 65" marker-end="url(#a)"/>
<path class="ar" d="M494 135 L512 135 L512 178 L527 178" marker-end="url(#a)"/>
<line class="ar" x1="608" y1="204" x2="608" y2="233" marker-end="url(#a)"/>
<text class="l" x="512" y="112" text-anchor="start">期内退款</text>
<text class="l" x="512" y="160" text-anchor="start">期满</text>
</svg>
