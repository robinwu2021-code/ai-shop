<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
<title id="title">SHR-02b共用资源仲裁处理路径提案</title>
<desc id="desc">三行业先提交持久意图，资源域接受命令，在事务外取得来源冻结决策，本地事务更新归属头与规范资源容量，通过同事务Outbox和原号查询推动行业恢复。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526581"/></marker></defs>
<rect width="1040" height="580" rx="14" fill="#f6f8fc"/>
<g font-family="system-ui, sans-serif" fill="#1c2c43">
<text x="32" y="40" font-size="23" font-weight="700">SHR-02b · 完整组合仲裁与原号恢复</text>
<text x="32" y="68" font-size="14" fill="#5f6f86">下一阶段设计提案，未实现 · 资源容量归merchant，业务单据归各行业</text>
<g font-size="17" text-anchor="middle">
<rect x="32" y="96" width="300" height="64" rx="9" fill="#e5edff" stroke="#7799cf"/><text x="182" y="123">零售：服务预约 / 体验</text><text x="182" y="145" font-size="13">订单与履约仍由核心拥有</text>
<rect x="370" y="96" width="300" height="64" rx="9" fill="#e5edff" stroke="#7799cf"/><text x="520" y="123">餐饮：桌位 / 包间 / 服务员</text><text x="520" y="145" font-size="13">桌台、台账、菜品仍由餐饮拥有</text>
<rect x="708" y="96" width="300" height="64" rx="9" fill="#e5edff" stroke="#7799cf"/><text x="858" y="123">美业：技师 / 床位 / 设备</text><text x="858" y="145" font-size="13">预约、任务、来源恢复仍由美业拥有</text>
</g>
<path d="M182 160 V181 H858 V160 M520 160 V202" stroke="#526581" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="204" width="440" height="62" rx="9" fill="#fff" stroke="#8b9db6"/>
<text x="520" y="229" text-anchor="middle" font-size="17">行业持久意图 → 本域ACCEPTED命令</text>
<text x="520" y="251" text-anchor="middle" font-size="13">commandNo / 冻结载荷 / 来源与版本，先提交再拿资源锁</text>
<rect x="32" y="291" width="230" height="90" rx="9" fill="#fff4dc" stroke="#caa65a"/>
<text x="147" y="319" text-anchor="middle" font-size="16">来源冻结决策</text><text x="147" y="343" text-anchor="middle" font-size="13">绑定命令、计划hash与修订</text><text x="147" y="365" text-anchor="middle" font-size="13">资源本地事务外取得</text>
<path d="M300 235 H147 V289" stroke="#526581" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M262 335 H299" stroke="#526581" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="300" y="291" width="708" height="122" rx="9" fill="#e8f4ed" stroke="#67967a"/>
<text x="322" y="319" font-size="18" font-weight="600">merchant本地原子事务</text>
<text x="322" y="346" font-size="15">归属头 → 人员 / 资源根 → hold / bucket / unit → occupation / block</text>
<text x="322" y="373" font-size="14">完整组合全成全败 · 净量替换 · 交接不双扣 · 计数与结果同事务</text>
<text x="322" y="396" font-size="13" fill="#4a6857">事务内不调用Core / Pay；命令结果与Outbox一并提交</text>
<path d="M654 413 V441" stroke="#526581" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="300" y="443" width="708" height="71" rx="9" fill="#fff" stroke="#8b9db6"/>
<text x="654" y="470" text-anchor="middle" font-size="17">原号查询 / 幂等事件 → 行业最终确认或异常协调</text>
<text x="654" y="494" text-anchor="middle" font-size="13">响应丢失先查询；未知来源不盲放；已有未来预约不删改</text>
<text x="32" y="550" font-size="14" fill="#5f6f86">容量读模型可匿名展示busy；通知 / 打印失败不重做资源占用。P3审批、P4排程及旧slot迁移另验。</text>
</g></svg>
