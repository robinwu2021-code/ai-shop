  <path d="M580.0,390 L580.0,367.5 L580.0,367.5 L580.0,345" fill="none" stroke="#475569" marker-end="url(#tri)"/>
  <path d="M805.0,290 L805.0,272.5 L805.0,272.5 L805.0,255" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M805.0,430 L805.0,407.5 L805.0,407.5 L805.0,385" fill="none" stroke="#475569" marker-end="url(#tri)"/>
  <path d="M1050.0,290 L1050.0,272.5 L1050.0,272.5 L1050.0,255" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
