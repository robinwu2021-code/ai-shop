  <path d="M455,105.5 L467.5,105.5 L467.5,105.5 L480,105.5" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M680,105.5 L692.5,105.5 L692.5,105.5 L705,105.5" fill="none" stroke="#475569" marker-end="url(#arr)"/>
