  <path d="M480,275.2 L467.5,275.2 L467.5,247.0 L455,247.0" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M680,306.2 L692,306.2 L692,318.5 L705,318.5" fill="none" stroke="#475569" marker-end="url(#arr)"/>
