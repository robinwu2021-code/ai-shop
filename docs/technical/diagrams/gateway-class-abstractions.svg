  <text x="130.0" y="205" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«interface»</text>
  <text x="130.0" y="223" text-anchor="middle" font-weight="600" fill="#1e3a8a">ResourceProvider</text>
  <line x1="30" y1="232" x2="230" y2="232" stroke="#3b82f6"/>
