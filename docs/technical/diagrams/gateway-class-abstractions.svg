  <text x="805.0" y="305" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«abstract»</text>
  <text x="805.0" y="323" text-anchor="middle" font-weight="600" fill="#1e3a8a">AbstractAccessDecider</text>
