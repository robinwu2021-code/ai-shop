<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12.5">
  <title>网关层类图四：一条固定流程，四组基类</title>
  <desc>网关的请求流程固定为五步：定位、认证、上下文、判定、调用。每一步背后是一组可继承的类。定位由链接来源接口的若干实现提供数据；认证由令牌认证过滤器基类及三端子类完成；端基类描述一端的全部差别并选用认证器、端专属过滤器与判定器，三端各有一个子类；判定由判定基类固定流程，三端子类只回答有没有某个权限码；调用由调用器基类固定流程，本地入口与微服务转发是它的两个子类。安全框架适配器按端基类产出的描述装出过滤器链。</desc>
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#0f172a">网关层类图四：一条固定流程，四组基类</text>
  <text x="24" y="50" fill="#64748b" font-size="12">蓝 = 网关层新增；白 = 现有类；灰 = 框架自带；虚线框 = 预留、未实现。空心三角 = 继承或实现（虚线为实现接口）；箭头 = 使用</text>
