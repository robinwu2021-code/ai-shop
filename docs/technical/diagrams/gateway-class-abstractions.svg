  <path d="M1170,595.5 L1186,595.5 L1186,337.5 L1170,337.5" fill="none" stroke="#475569" marker-end="url(#tri)"/>
  <path d="M130.0,131 L130.0,160.5 L130.0,160.5 L130.0,190" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M355.0,131 L355.0,160.5 L355.0,160.5 L355.0,190" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M580.0,131 L580.0,160.5 L580.0,160.5 L580.0,190" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arr)"/>
