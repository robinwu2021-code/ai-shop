<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="922" viewBox="0 0 1320 922" role="img" aria-labelledby="title desc">
<title id="title">应退权益义务状态迁移</title>
<desc id="desc">应退权益义务状态迁移。每行是一条有向关系；同名框代表同一对象或状态，箭头上的文字表示分支条件。起点 → PENDING（创建应退权益义务）；PENDING → PROCESSING（短事务领取）；PROCESSING → SUCCEEDED（原权益权威确认）；PROCESSING → UNKNOWN（超时或无法确认）；UNKNOWN → PROCESSING（原业务号恢复）；PROCESSING → PROCESSING（租约到期后恢复）；起点 → NOT_REQUIRED（原影响集或政策证明无需返还）；SUCCEEDED → 终点（完成）；NOT_REQUIRED → 终点（无需返还）</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="30" y="42" font-size="26" font-family="Arial, sans-serif" fill="#0f172a">应退权益义务状态迁移</text>
<text x="30" y="74" font-size="16" font-family="Arial, sans-serif" fill="#475569">逐条展开有向关系；同名框是同一对象或状态。分支与恢复回路按箭头条件读取。</text>
<text x="16" y="139" font-size="13" fill="#64748b">01</text>
<rect x="48" y="106" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="133" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">起点</text>
<rect x="818" y="106" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="133" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PENDING</text>
<path d="M 504 148 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="118" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">创建应退权益义务</text>
<text x="16" y="227" font-size="13" fill="#64748b">02</text>
<rect x="48" y="194" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="221" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PENDING</text>
<rect x="818" y="194" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="221" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PROCESSING</text>
<path d="M 504 236 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="206" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">短事务领取</text>
<text x="16" y="315" font-size="13" fill="#64748b">03</text>
<rect x="48" y="282" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="309" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PROCESSING</text>
<rect x="818" y="282" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="309" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">SUCCEEDED</text>
<path d="M 504 324 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="294" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">原权益权威确认</text>
<text x="16" y="403" font-size="13" fill="#64748b">04</text>
<rect x="48" y="370" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="397" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PROCESSING</text>
<rect x="818" y="370" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="397" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">UNKNOWN</text>
<path d="M 504 412 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="382" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">超时或无法确认</text>
<text x="16" y="491" font-size="13" fill="#64748b">05</text>
<rect x="48" y="458" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="485" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">UNKNOWN</text>
<rect x="818" y="458" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="485" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PROCESSING</text>
<path d="M 504 500 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="470" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">原业务号恢复</text>
<text x="16" y="579" font-size="13" fill="#64748b">06</text>
<rect x="48" y="546" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="573" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PROCESSING</text>
<rect x="818" y="546" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="573" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">PROCESSING</text>
<path d="M 504 588 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="558" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">租约到期后恢复</text>
<text x="16" y="667" font-size="13" fill="#64748b">07</text>
<rect x="48" y="634" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="661" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">起点</text>
<rect x="818" y="634" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="661" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">NOT_REQUIRED</text>
<path d="M 504 676 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="646" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">原影响集或政策证明无需返还</text>
<text x="16" y="755" font-size="13" fill="#64748b">08</text>
<rect x="48" y="722" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="749" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">SUCCEEDED</text>
<rect x="818" y="722" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="749" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">终点</text>
<path d="M 504 764 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="734" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">完成</text>
<text x="16" y="843" font-size="13" fill="#64748b">09</text>
<rect x="48" y="810" width="450" height="66" rx="8" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="62" y="837" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">NOT_REQUIRED</text>
<rect x="818" y="810" width="450" height="66" rx="8" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="832" y="837" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">终点</text>
<path d="M 504 852 H 810" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="657" y="822" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#334155">无需返还</text>
</svg>
