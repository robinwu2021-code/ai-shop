<svg xmlns="http://www.w3.org/2000/svg" width="680" height="216" viewBox="0 0 680 216" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>会员 表关系</title><desc>8 张表，箭头由引用方指向被引用方。</desc>
