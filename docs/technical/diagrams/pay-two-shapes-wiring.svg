<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="820" viewBox="0 0 1060 820" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>支付双形态的装配差异：内嵌与独立之间只差打包和一个开关</title>
<desc>形态 A 内嵌与形态 B 独立部署的装配对照。两种形态共用同一份 pay-domain、pay-store、pay-web 代码；差异只允许出现在 Maven 打包与 shop.pay.mode 一个开关上。关键规矩：内嵌形态下 pay 也用独立的 DataSource 与 TransactionManager（即使指向同一个库），让跨域事务在物理上写不出来，这样两种形态语义相同。形态 B 下主应用只留 pay-api，若保留 pay-web 则 nginx 少配一条规则会静默走到连不上 pay 库的那份，返回空列表而不是 404。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C97B7B" stroke-width="1.6" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.em{font-weight:700;fill:#161A21}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.l{font-size:9.5px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.unit{fill:#FBFCFD;stroke:#B9C2CE;stroke-width:1.6}
.pay{fill:#EEF4FC;stroke:#7FA2CC;stroke-width:1.5}
.same{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.warn{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.3}
.stop{fill:#FBF0F0;stroke:#C97B7B;stroke-width:1.4}
.infra{fill:#F5F6F8;stroke:#C6CDD8;stroke-width:1.2}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.cut{stroke:#C97B7B;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.zt{font-size:10px;fill:#A6AEBB;letter-spacing:.1em}
</style></defs>

<text class="b" x="24" y="26">形态 A · 内嵌（默认，今天生产的样子）</text>
<text class="b" x="552" y="26">形态 B · 独立</text>

<rect class="unit" x="24" y="38" width="490" height="326" rx="8"/>
<text class="n" x="40" y="60">ai-shop.jar　:8081</text>
<text class="t" x="40" y="76">shop.pay.mode = embedded（或不配）</text>

<rect class="box" x="40" y="88" width="458" height="42" rx="6"/>
<text class="n" x="54" y="107">业务域　core · merchant · settle · channel …</text>
<text class="t" x="54" y="123">注入的是 PayPort，不知道钱在哪跑</text>

<rect class="pay" x="40" y="138" width="458" height="34" rx="6"/>
<text class="n" x="54" y="159">LocalPayAdapter　implements PayPort</text>

<rect class="same" x="40" y="180" width="458" height="52" rx="6"/>
<text class="n" x="54" y="200">pay-web · pay-domain · pay-store · pay-job</text>
<text class="t" x="54" y="219">与右边<tspan class="em">逐字节相同</tspan>的代码</text>

<rect class="warn" x="40" y="240" width="458" height="58" rx="6"/>
<text class="n" x="54" y="260">payDataSource + payTxManager</text>
<text class="t" x="54" y="278">独立数据源与事务管理器，URL 却指向主库 ——</text>
<text class="t" x="54" y="293">于是跨域事务在这里<tspan class="em">写不出来</tspan>，与右边语义相同</text>

<rect class="box" x="40" y="306" width="458" height="42" rx="6"/>
<text class="t" x="54" y="325">classpath：MyBatis（业务域用）+ Spring Data JDBC（pay 用）</text>
<text class="t" x="54" y="341">两者共存没有问题，只是两个 starter</text>

<rect class="unit" x="552" y="38" width="230" height="326" rx="8"/>
<text class="n" x="568" y="60">ai-shop.jar　:8081</text>
<text class="t" x="568" y="76">shop.pay.mode = remote</text>

<rect class="box" x="566" y="88" width="202" height="42" rx="6"/>
<text class="n" x="580" y="107">业务域</text>
<text class="t" x="580" y="123">一行都没有改</text>

<rect class="pay" x="566" y="138" width="202" height="34" rx="6"/>
<text class="n" x="580" y="159">RemotePayClient</text>

<rect class="stop" x="566" y="180" width="202" height="118" rx="6"/>
<text class="n" x="580" y="200">只留 pay-api</text>
<text class="t" x="580" y="219">pay-web 不在这里 ——</text>
<text class="t" x="580" y="236">留着的话同一路径</text>
<text class="t" x="580" y="253">两个进程都有控制器，</text>
<text class="t" x="580" y="270">nginx 少配一条就走到</text>
<text class="t" x="580" y="287">连不上 pay 库的那份</text>

<rect class="box" x="566" y="306" width="202" height="42" rx="6"/>
<text class="t" x="580" y="325">classpath：只有</text>
<text class="t" x="580" y="341">MyBatis</text>

<rect class="unit" x="806" y="38" width="230" height="326" rx="8"/>
<text class="n" x="822" y="60">pay-svc.jar　:8083</text>
<text class="t" x="822" y="76">自己的进程 · 自己的库</text>

<rect class="box" x="820" y="88" width="202" height="42" rx="6"/>
<text class="n" x="834" y="107">自己的四条鉴权链</text>
<text class="t" x="834" y="123">shop-base-auth 共用一份</text>

<rect class="same" x="820" y="138" width="202" height="160" rx="6"/>
<text class="n" x="834" y="158">pay-web</text>
<text class="n" x="834" y="178">pay-domain</text>
<text class="n" x="834" y="198">pay-store</text>
<text class="n" x="834" y="218">pay-job</text>
<text class="t" x="834" y="242">与左边同一份代码，</text>
<text class="t" x="834" y="259">不是「另一个实现」</text>
<text class="t" x="834" y="282">payDataSource → pay 库</text>

<rect class="box" x="820" y="306" width="202" height="42" rx="6"/>
<text class="t" x="834" y="325">classpath：只有</text>
<text class="t" x="834" y="341">Spring Data JDBC</text>

<path class="ar" marker-end="url(#ar)" d="M768 155 L820 155"/>
<text class="l" x="772" y="147">HTTP</text>

<line x1="24" y1="386" x2="1036" y2="386" stroke="#E6EAF0" stroke-width="1"/>
<text class="b" x="24" y="412">差异只允许出现在这两处 —— 别处出现就是两套代码</text>

<rect class="box" x="24" y="424" width="500" height="76" rx="7"/>
<text class="n" x="40" y="444">① Maven 打包</text>
<text class="t" x="40" y="463">pay-svc 这个产物包含什么。持久层的归属由它决定，不由运行时开关决定 ——</text>
<text class="t" x="40" y="480">AOT 的判据本来就是「进没进 classpath」，不是「用没用到」</text>

<rect class="box" x="536" y="424" width="500" height="76" rx="7"/>
<text class="n" x="552" y="444">② 一个开关　shop.pay.mode</text>
<text class="t" x="552" y="463">配在主应用侧，管两件事：装 Local 还是 Remote 的 PayPort，装不装 pay-web。</text>
<text class="t" x="552" y="480">matchIfMissing=true —— 不配就是内嵌，也就是生产今天的样子</text>

<rect class="warn" x="24" y="514" width="1012" height="62" rx="7"/>
<text class="n" x="40" y="534">ArchUnit：pay/** 里不许读 shop.pay.mode</text>
<text class="t" x="40" y="553">只要有一处业务代码知道「我现在是哪种形态」，那就不是两种形态，而是两套代码 ——</text>
<text class="t" x="40" y="569">而两套代码里一定有一套没人测。</text>

<line x1="24" y1="598" x2="1036" y2="598" stroke="#E6EAF0" stroke-width="1"/>
<text class="b" x="24" y="624">最要紧的一条测试：断言我们「做不到」某件事</text>

<rect class="stop" x="24" y="636" width="1012" height="96" rx="7"/>
<text class="n" x="40" y="656">负面对照 —— 形态 A 下跨域事务必须写不出来</text>
<text class="t" x="40" y="676">在一个 @Transactional 里先写业务表、再写 pay 表，然后抛异常 —— 断言业务表回滚了而 pay 表没有。</text>
<text class="t" x="40" y="696">没有这一条，「内嵌也按跨进程写」就只是一句话。某天有人给 payDataSource 加上 @Primary 或共用事务管理器，</text>
<text class="t" x="40" y="716">测试全绿、形态 A 一切正常，直到切 B 那天才发现代码里到处是跨域事务 —— 而那时症状是「下单成功、支付单没落」。</text>

<text class="l" x="24" y="762">先切流量、后去依赖：第 7 步之前主应用还带着完整的 pay，是个能立即接管的热备，回滚就是改一行 nginx。</text>
<text class="l" x="24" y="782">切库（第 8 步）是第一个不可轻易回退的步骤 —— 单独评审。</text>
<text class="l" x="24" y="802">前置条件：token-store 从 memory 切到 db。默认是进程内内存，pay-svc 独立后一个令牌也验不了。</text>
</svg>
