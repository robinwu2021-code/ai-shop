<svg viewBox="0 0 960 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="组合总图：零售直连、餐饮台账轨在上、服务业双轨在下，同一条基础订单流经 A1 至 A5 五个挂接点连接全部行业"><rect width="960" height="636" fill="#FFFFFF"/><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D3040"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8342B"/></marker><marker id="a-jade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#256C5C"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55636F"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="28" y="40" width="904" height="132" rx="8" fill="none" stroke="#A8342B" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/><text x="38" y="58" font-size="11" fill="#A8342B" font-weight="600">餐饮工作流（台账轨）</text><rect x="60" y="74" width="100" height="44" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="110.0" y="100.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">开台</text><rect x="255" y="74" width="110" height="44" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="310.0" y="100.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">点单·加菜</text><rect x="400" y="74" width="100" height="44" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="450.0" y="100.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">制作</text><rect x="545" y="74" width="110" height="44" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="600.0" y="100.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight