<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>支付服务领域模型：调用方 · 收单聚合 · 路由快照 · 通道能力 · 结果入口 · 资金路径 · 流水</title>
<desc>调用方经能力矩阵进入应用服务；收单单是聚合根，建单选方式时把商家域给出的收款路由冻结成快照；通道调用只拿快照构造的账户上下文；所有结果来源汇入唯一的结果入口；资金路径策略把结果翻译成复式凭证，再被对账与结算消费。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.key{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.new{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.2}
.old{fill:#F5F6F8;stroke:#D8DEE6;stroke-width:1.2}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
</style></defs>

<text class="b" x="26" y="22">① 谁在调用</text>
<rect class="new" x="26" y="30" width="200" height="44" rx="7"/><text class="n" x="38" y="49">PayCaller</text><text class="t" x="38" y="65">类型 · 身份 · 商家/门店范围 · 操作人</text>
<rect class="new" x="250" y="30" width="200" height="44" rx="7"/><text class="n" x="262" y="49">CallerPolicy</text><text class="t" x="262" y="65">CapabilityMatrix：类型 × 动作</text>
<rect class="new" x="474" y="30" width="400" height="44" rx="7"/><text class="n" x="486" y="49">PaymentService · RefundService · CheckoutService</text><text class="t" x="486" y="65">每个方法第一行 callerPolicy.check(...)</text>
<path class="ar" d="M226 52 H244" marker-end="url(#ar)"/>
<path class="ar" d="M450 52 H468" marker-end="url(#ar)"/>

<text class="b" x="26" y="112">② 收单聚合 —— 钱去哪在选方式时冻结</text>
<rect class="old" x="26" y="122" width="200" height="150" rx="7"/>
<text class="n" x="38" y="142">商家域（shop-merchant）</text>
<text class="t" x="38" y="162">MchPaymentMerchant</text>
<text class="t" x="38" y="177">= 收款账户，pay_merchant_no</text>
<text class="t" x="38" y="197">MerchantQueryPort</text>
<text class="t" x="38" y="212">collectableRoutesOf()</text>
<text class="t" x="38" y="232">→ PaymentRoute 候选</text>
<text class="t" x="38" y="252">每门店每通道至多一条 ACTIVE</text>

<rect class="key" x="250" y="122" width="360" height="170" rx="7"/>
<text class="n" x="262" y="142">PayOrder（聚合根 · pay_order）</text>
<text class="t" x="262" y="158">PayOrderStateMachine：CREATED → … → SUCCEEDED → REFUNDED</text>
<rect class="box" x="262" y="166" width="336" height="44" rx="6"/>
<text class="n" x="274" y="184">PaymentRoute 快照（冻结，之后只认它）</text>
<text class="t" x="274" y="200">payMerchantNo · accountVersion · fundsPath · 密钥版本</text>
<rect class="box" x="262" y="220" width="160" height="60" rx="6"/>
<text class="n" x="274" y="238">StlPayment 1..n</text><text class="t" x="274" y="254">每次选方式一条通道尝试</text><text class="t" x="274" y="268">（现有表，加 pay_order_no）</text>
<rect class="box" x="438" y="220" width="160" height="60" rx="6"/>
<text class="n" x="450" y="238">PayRefund 0..n</text><text class="t" x="450" y="254">无路由字段，只用原单快照</text><text class="t" x="450" y="268">命中规则 → PayApproval ×2</text>

<rect class="new" x="634" y="122" width="240" height="170" rx="7"/>
<text class="n" x="646" y="142">通道层（pay-channel）</text>
<text class="t" x="646" y="162">ChannelContextFactory.from(route)</text>
<text class="t" x="646" y="177">  ← ChannelCredentialVault（信封加密）</text>
<text class="t" x="646" y="197">→ ChannelAccountContext</text>
<text class="t" x="646" y="217">ChannelRouter → 能力接口：</text>
<text class="t" x="646" y="232">Acquiring · Confirmable · CardPresent</text>
<text class="t" x="646" y="247">CustomerCode · StatementSource · Payout</text>
<text class="t" x="646" y="267">NewebPay · LinePay · PayBy（无状态）</text>

<path class="ar" d="M674 74 V100 H430 V116" marker-end="url(#ar)"/>
<path class="ar" d="M226 188 H256" marker-end="url(#ar)"/>
<path class="ar" d="M610 200 H628" marker-end="url(#ar)"/>

<text class="b" x="26" y="318">③ 结果 —— 只有一个入口能把单子推到成功</text>
<rect class="box" x="26" y="328" width="200" height="54" rx="7"/><text class="n" x="38" y="348">五个结果来源</text><text class="t" x="38" y="365">回调 · 查单 · LINE Pay confirm</text><text class="t" x="38" y="378">终端上报 · 对账补单</text>
<rect class="key" x="250" y="328" width="360" height="54" rx="7"/><text class="n" x="262" y="348">PaymentOutcomeService · RefundOutcomeService</text><text class="t" x="262" y="366">幂等 outTradeNo · 同事务：状态迁移 + 记账 + Outbox 事件</text>
<path class="ar" d="M226 355 H244" marker-end="url(#ar)"/>
<path class="ar" d="M754 292 V355 H616" marker-end="url(#ar)"/>
<text class="t" x="762" y="328">通道回调 / 查单结果</text>

<text class="b" x="26" y="410">④ 资金路径 —— DIRECT / AGGREGATED 的差异只在这里</text>
<rect class="key" x="250" y="418" width="360" height="56" rx="7"/>
<text class="n" x="262" y="436">FundsPathStrategy</text>
<rect class="box" x="262" y="444" width="164" height="24" rx="5"/><text class="t" x="270" y="460">Direct：备查账 + 平台费应收</text>
<rect class="box" x="434" y="444" width="164" height="24" rx="5"/><text class="t" x="442" y="460">Aggregated：平台余额 + 出款</text>
<path class="ar" d="M430 382 V412" marker-end="url(#ar)"/>

<text class="b" x="26" y="502">⑤ 记录与消费</text>
<rect class="new" x="26" y="510" width="270" height="54" rx="7"/><text class="n" x="38" y="530">LedgerVoucher → PayLedgerEntry</text><text class="t" x="38" y="547">复式 · 借贷平衡 · 只增不改 · 按来源切</text>
<rect class="old" x="316" y="510" width="270" height="54" rx="7"/><text class="n" x="328" y="530">对账 ReconAxis</text><text class="t" x="328" y="547">+ ChannelStatementAxis · TerminalBatchAxis</text>
<rect class="old" x="606" y="510" width="268" height="54" rx="7"/><text class="n" x="618" y="530">结算</text><text class="t" x="618" y="547">DirectSettlement / SettleService → Payout</text>
<path class="ar" d="M330 474 V490 H160 V504" marker-end="url(#ar)"/>
<path class="ar" d="M530 474 V490 H740 V504" marker-end="url(#ar)"/>
<path class="ar" d="M296 537 H310" marker-end="url(#ar)"/>

<text class="t" x="26" y="588">图例：</text>
<rect class="new" x="66" y="578" width="16" height="12" rx="3"/><text class="t" x="88" y="588">新增</text>
<rect class="key" x="126" y="578" width="16" height="12" rx="3"/><text class="t" x="148" y="588">核心约束所在</text>
<rect class="old" x="226" y="578" width="16" height="12" rx="3"/><text class="t" x="248" y="588">现有，扩展</text>
</svg>
