<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="785" viewBox="0 0 1640 785"><title>退款责任解除与到期</title><desc>退款责任解除、到期准备/划拨确认及区间顺延；积分未上线，直接采用最新逻辑，不含旧业务数据搬迁。</desc>
<defs><marker id="point" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="money" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c2410c"/></marker><marker id="dep" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b"/></marker><marker id="real" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="white" stroke="#475569"/></marker><marker id="diamond" markerWidth="15" markerHeight="10" refX="14" refY="5" orient="auto-start-reverse"><path d="M0 5L7 0L14 5L7 10Z" fill="#475569"/></marker></defs>
<rect width="1640" height="785" fill="#f8fafc"/>
<text x="35" y="48" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#172554" font-weight="650" text-anchor="start">退款责任解除与到期</text>
<text x="35" y="80" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526277" font-weight="400" text-anchor="start">v3 设计契约 · pay-domain内业务模块 · payTxManager · 实现与验收状态见 TDD</text>
<text x="35" y="138" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">关闭后才能回流</text>
<rect x="35.0" y="150" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="35.0" y="150" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="51.0" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">RECEIVE退款预留</text>
<text x="51.0" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">仍须保留的积分</text>
<rect x="565.6666666666667" y="150" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="565.6666666666667" y="150" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="581.6666666666667" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">权威责任解除</text>
<text x="581.6666666666667" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">窗口结束/无活动售后</text>
<text x="581.6666666666667" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">所有资金结果明确</text>
<path d="M523.6666666666667,235 L565.6666666666667,235" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1096.3333333333335" y="150" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="1096.3333333333335" y="150" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="1112.3333333333335" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">RECEIVE可回流</text>
<text x="1112.3333333333335" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">剩余预留→自由</text>
<text x="1112.3333333333335" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">释放对应B额度</text>
<path d="M1054.3333333333335,235 L1096.3333333333335,235" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="355" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">结算终局不等于退款责任解除。关闭与prepare锁同头寸；额外补偿需重新审批备款。</text>
<text x="35" y="423" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">到期与收入划拨</text>
<rect x="35.0" y="435" width="356.0" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="35.0" y="435" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="51.0" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">USER.A 到期</text>
<text x="51.0" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">区间并集顺延后判断</text>
<text x="51.0" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">P和其他H不动</text>
<rect x="433.0" y="435" width="356.0" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="433.0" y="435" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="449.0" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">到期准备H</text>
<text x="449.0" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">C保持实款备付</text>
<text x="449.0" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">revision防重复周期</text>
<path d="M391.0,520 L433.0,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="831.0" y="435" width="356.0" height="170" rx="12" fill="white" stroke="#c2410c" stroke-width="1.8"/>
<rect x="831.0" y="435" width="6" height="170" rx="3" fill="#c2410c"/>
<text x="847.0" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#c2410c" font-weight="650" text-anchor="start">专项收入划拨</text>
<text x="847.0" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">未知/失败保持准备</text>
<text x="847.0" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">原意图查询或重试</text>
<path d="M789.0,520 L831.0,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1229.0" y="435" width="356.0" height="170" rx="12" fill="white" stroke="#c2410c" stroke-width="1.8"/>
<rect x="1229.0" y="435" width="6" height="170" rx="3" fill="#c2410c"/>
<text x="1245.0" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#c2410c" font-weight="650" text-anchor="start">明确成功后清零</text>
<text x="1245.0" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">H→RECEIVE自由</text>
<text x="1245.0" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">C减少并转平台收入</text>
<path d="M1187.0,520 L1229.0,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="640" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">GRANT/HOLD续期，REVOKE/EXPIRE不续。冻结、暂停不阻断已有退款/付款收尾。</text>
<text x="35" y="761" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#be123c" font-weight="400" text-anchor="start">资金证据不明确时保留原意图/占用；不假记到账、不改同一幂等请求金额。</text>
</svg>
