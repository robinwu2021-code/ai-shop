<svg viewBox="0 0 960 466" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="餐饮双轨：台账轨驱动开台点单制作结账，经四个同步点与基础订单流交互"><rect width="960" height="466" fill="#FFFFFF"/><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D3040"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8342B"/></marker><marker id="a-jade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#256C5C"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55636F"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><rect x="28" y="44" width="904" height="140" rx="8" fill="none" stroke="#A8342B" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/><text x="38" y="62" font-size="11" fill="#A8342B" font-weight="600">餐饮工作流 · 台账轨（行业包）</text><rect x="60" y="80" width="120" height="46" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="120.0" y="107.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">开台 OPEN</text><text x="120.0" y="141" text-anchor="middle" font-size="10.5" fill="#55636F">占桌台资源</text><rect x="240" y="80" width="150" height="46" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="315.0" y="107.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">点单·加菜 ×N轮</text><text x="315.0" y="141" text-anchor="middle" font-size="10.5" fill="#55636F">台账购物车（一桌多人）</text><rect x="450" y="80" width="170" height="46" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="535.0" y="107.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">制作 QUEUED→SERVED</text><text x="535.0" y="141" text-anchor="middle" font-size="10.5" fill="#55636F">制作行状态，永不进订单状态机</text><rect x="660" y="80" width="120" height="46" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="720.0" y="107.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">结账 SETTLING</text><text x="720.0" y="141" text-anchor="middle" font-size="10.5" fill="#55636F">此后不许加菜</text><rect x="820" y="80" width="90" height="46" rx="6" fill="#FBEDEB" stroke="#A8342B" stroke-width="1.4"/><text x="865.0" y="99.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">结台</text><text x="865.0" y="115.5" text-anchor="middle" font-size="10.5" fill="#55636F">CLOSED</text><line x1="182" y1="103" x2="208" y2="103" stroke="#A8342B" stroke-width="1.5" marker-end="url(#a-seal)"/><line x1="392" y1="103" x2="448" y2="103" stroke="#A8342B" stroke-width="1.5" marker-end="url(#a-seal)"/><line x1="622" y1="103" x2="648" y2="103" stroke="#A8342B" stroke-width="1.5" marker-end="url(#a-seal)"/><line x1="782" y1="103" x2="808" y2="103" stroke="#A8342B" stroke-width="1.5" marker-end="url(#a-seal)"/><rect x="28" y="270" width="904" height="150" rx="8" fill="none" stroke="#1D3040" stroke-width="1" stroke-dasharray="2 4" opacity="0.55"/><text x="38" y="288" font-size="11" fill="#1D3040" font-weight="600">基础订单流 · 订单轨（基座，全行业同一条）</text><rect x="225" y="306" width="200" height="50" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="325.0" y="327.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">place 每轮一张单</text><text x="325.0" y="343.5" text-anchor="middle" font-size="10.5" fill="#FFFFFF">WAIT_OFFLINE_PAY / WAIT_PAY</text><rect x="560" y="306" width="160" height="50" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="640.0" y="327.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">ord_payment ×N 笔</text><text x="640.0" y="343.5" text-anchor="middle" font-size="10.5" fill="#FFFFFF">现金+微信+储值</text><rect x="760" y="306" width="150" height="50" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="835.0" y="327.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">settle → 逐单</text><text x="835.0" y="343.5" text-anchor="middle" font-size="10.5" fill="#FFFFFF">markPaid(MIXED)</text><line x1="427" y1="331" x2="558" y2="331" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><text x="492.5" y="325.0" text-anchor="middle" font-size="10.5" fill="#1D3040">足额校验：少一分不结</text><line x1="722" y1="331" x2="758" y2="331" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="315" y1="128" x2="315" y2="304" stroke="#A8342B" stroke-width="1.5" marker-end="url(#a-seal)"/><text x="325" y="220" text-anchor="start" font-size="10.5" fill="#A8342B">① 下达 → place（永不改旧单）</text><line x1="390" y1="304" x2="505" y2="130" stroke="#1D3040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-ink)"/><text x="475" y="248" text-anchor="start" font-size="10.5" fill="#1D3040">② onPaid 入厨（先付）｜后付：下达即入厨</text><line x1="720" y1="128" x2="640" y2="304" stroke="#A8342B" stroke-width="1.5" marker-end="url(#a-seal)"/><text x="700" y="220" text-anchor="start" font-size="10.5" fill="#A8342B">③ 结账收款</text><line x1="835" y1="304" x2="862" y2="128" stroke="#1D3040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-ink)"/><text x="930" y="240" text-anchor="end" font-size="10.5" fill="#1D3040">④ onPaid → 结台·释放桌台</text><text x="60" y="448" text-anchor="start" font-size="10.5" fill="#55636F">逆向：退菜按「钱收没收」分叉 —— 已收走售后 refundLine（含加料金额）；未收 cancel+重下。超时取消按门店配置，台账未结不取消。</text></g></svg>