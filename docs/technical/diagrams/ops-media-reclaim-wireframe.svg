.dgr{fill:#C0524F}
.tagT{font-size:8.5px;font-weight:600;fill:#fff}
.note{font-size:9.5px;fill:#8A94A2}
.thumb{fill:#E4E8ED;stroke:#CFD6DE;stroke-width:1}
</style></defs>

