<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>运营端「存储空间治理」线框：门店占用、待回收明细、批量条与强确认</title>
<desc>三个页签。门店占用按待回收体积倒序，因为这一页的目的就是找出最该清的店。待回收明细每行给缩略图与可回收理由，理由是扫描时算出来的真实数据而不是推断：从未被引用的说明它从没被用过，被替换的说明它原来挂在哪个商品的哪个字段上、什么时候失去引用。默认一张都不勾选，证件默认不出现在清单里，确认弹窗要照抄本次删除的张数。</desc>
