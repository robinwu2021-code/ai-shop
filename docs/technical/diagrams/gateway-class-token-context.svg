  <path d="M482.0,321 L482.0,365 L597.0,365 L597.0,390" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M501.0,321 L501.0,358 L816.0,358 L816.0,390" fill="none" stroke="#475569" marker-end="url(#arr)"/>
