<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12.5">
  <title>网关层类图二：令牌管理、身份还原、上下文</title>
  <desc>令牌存储是一个接口，有数据库、Redis、Ehcache、内存四个实现，由路由存储按令牌前缀分到三端各自的池；三端由 Realm 枚举区分。数据库实现使用会话档位、会话数据访问和身份加载接口。运营端的身份与权限码由两个解析接口现算并带缓存，B 端的门店上下文由身份解析接口算出。请求内的上下文有：登录人、门店上下文、请求来源信息、数据域，以及网关新增的请求交换对象；出站时由它们组成签名上下文。</desc>
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="930" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#0f172a">网关层类图二：令牌管理、身份还原、上下文</text>
  <text x="24" y="50" fill="#64748b" font-size="12">蓝 = 网关层新增；白 = 现有类；灰 = 框架自带；虚线框 = 预留、未实现。空心三角 = 继承或实现（虚线为实现接口）；箭头 = 使用</text>
