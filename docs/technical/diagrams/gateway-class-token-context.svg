  <path d="M425.0,270 L425.0,245 L530.0,245 L530.0,205" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M635.0,270 L635.0,245 L590.0,245 L590.0,205" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
