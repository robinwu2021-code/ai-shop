<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc"><title id="title">餐饮项目双部署边界</title><desc id="desc">各终端访问同一餐饮业务，集成模式使用宿主本地适配，独立模式使用远程适配，共享商品交易支付库存能力。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#536478"/></marker></defs><rect width="1040" height="390" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" fill="#172b4d"><text x="520" y="34" font-size="22">同一餐饮业务代码，两种部署装配</text><rect x="40" y="70" width="960" height="48" rx="8" fill="#dbeafe"/><text x="520" y="100" font-size="17">收银 · 服务员 · 厨房 · 商家运营 · 老板App · 平台运营 · 顾客/点餐机</text><rect x="40" y="155" width="450" height="100" rx="8" fill="#dcfce7"/><text x="265" y="184" font-size="18">集成部署：宿主应用＋Food Core</text><text x="265" y="213" font-size="16">餐饮业务＋持久化＋宿主本地适配器</text><text x="265" y="238" font-size="14">遵循模块接口与真实事务边界</text><rect x="550" y="155" width="450" height="100" rx="8" fill="#dcfce7"/><text x="775" y="184" font-size="18">独立部署：Food Server</text><text x="775" y="213" font-size="16">同一餐饮业务＋持久化＋远程适配器</text><text x="775" y="238" font-size="14">远程鉴权、幂等与事件恢复</text><rect x="40" y="305" width="960" height="52" rx="8" fill="#e2e8f0"/><text x="520" y="337" font-size="17">共享基础能力：商品 / 报价 / 交易订单 / 支付退款 / 库存 / 身份 / 打印</text></g><g stroke="#536478" stroke-width="2" marker-end="url(#a)"><path d="M265 118V153"/><path d="M775 118V153"/><path d="M265 255V303"/><path d="M775 255V303"/></g></svg>