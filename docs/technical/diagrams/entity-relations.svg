<svg xmlns="http://www.w3.org/2000/svg" width="832" height="600" viewBox="-12 0 832 600" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>实体关系：主体 · 商户 · 门店 · 员工，及归属与关联</title>
<desc>四个核心实体。实线=归属（不可改），虚线=关联（可改）。钱与信用挂主体，货与人挂门店，权益边界是主体。</desc>
<defs>
<marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="er2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C98B3E" stroke-width="1.5" stroke-linecap="round"/></marker>
<style>
.h{font-size:11px;fill:#8A94A2;letter-spacing:.14em}
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.tb{font-size:10px;fill:#7A8493;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.t{font-size:10px;fill:#5A6472}
.core{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.6;rx:8}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2;rx:7}
.new{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.2;rx:7}
.own{stroke:#8A94A2;stroke-width:1.4;fill:none}
.rel{stroke:#C98B3E;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
.lbl{font-size:10px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
.lblr{font-size:10px;fill:#B8791F;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
</style></defs>

<rect x="24" y="24" width="240" height="52" class="box"/>
<text class="n" x="36" y="45">商家账号（B 端独立池）</text>
<text class="tb" x="36" y="62">usr_merchant_staff</text>
<text class="t" x="192" y="62">与 C 端不关联</text>

<rect x="300" y="24" width="240" height="52" class="core"/>
<text class="n" x="316" y="45">主体（一张营业执照）</text>
<text class="tb" x="316" y="62">usr_merchant</text>
<text class="t" x="450" y="62">钱 · 信用 · 资质</text>
<path class="rel" d="M264 50 L300 50" marker-end="url(#er2)"/>
<text class="lblr" x="556" y="45">一个商家账号可参与多个主体</text>
<text class="lblr" x="556" y="60">is_owner/角色，多对多</text>

<text class="h" x="24" y="112">主体之下 —— 绿色框之间的橙色虚线都是「可改」</text>

<rect x="24" y="126" width="176" height="60" class="box"/>
<text class="n" x="36" y="146">商户（收款号）</text>
<text class="tb" x="36" y="162">usr_merchant_payment</text>
<text class="t" x="36" y="178">每通道一条 · sub_mchid</text>

<rect x="216" y="126" width="176" height="60" class="core"/>
<text class="n" x="228" y="146">门店</text>
<text class="tb" x="228" y="162">usr_store</text>
<text class="t" x="228" y="178">顾客感知 · 可切换主体</text>

<rect x="408" y="126" width="176" height="60" class="core"/>
<text class="n" x="420" y="146">员工</text>
<text class="tb" x="420" y="162">usr_merchant_staff</text>
<text class="t" x="420" y="178">独立登录（不关联 C 端）</text>

<rect x="600" y="126" width="196" height="60" class="box"/>
<text class="n" x="612" y="146">商品目录</text>
<text class="tb" x="612" y="162">prd_goods · prd_sku</text>
<text class="t" x="612" y="178">录一次，各店选卖不卖</text>

<path class="own" d="M380 76 L112 126" marker-end="url(#er)"/>
<path class="rel" d="M395 76 L304 126" marker-end="url(#er2)"/>
<path class="own" d="M425 76 L496 126" marker-end="url(#er)"/>
<path class="own" d="M440 76 L690 126" marker-end="url(#er)"/>

<text class="h" x="24" y="228">关联 —— 可改，这是多门店的关键</text>

<path class="rel" d="M112 186 L112 214 L304 214 L304 186" marker-end="url(#er2)"/>
<text class="lblr" x="140" y="210">门店 → 商户号：这家店的钱走哪个口子，可换</text>

<rect x="216" y="248" width="176" height="56" class="new"/>
<text class="n" x="228" y="268">员工在各店的角色</text>
<text class="tb" x="228" y="284">usr_staff_store</text>
<text class="t" x="228" y="298">每店一个角色：MANAGER / CLERK</text>

<rect x="408" y="248" width="176" height="56" class="new"/>
<text class="n" x="420" y="268">门店选品</text>
<text class="tb" x="420" y="284">prd_store_goods</text>
<text class="t" x="420" y="298">这家店卖不卖这款</text>

<rect x="600" y="248" width="196" height="56" class="new"/>
<text class="n" x="612" y="268">门店库存</text>
<text class="tb" x="612" y="284">prd_store_stock</text>
<text class="t" x="612" y="298">这规格有几件</text>

<path class="rel" d="M470 186 L470 232 L304 232 L304 248" marker-end="url(#er2)"/>
<text class="lblr" x="330" y="228">授权</text>
<path class="rel" d="M690 186 L690 240 L496 240 L496 248" marker-end="url(#er2)"/>
<text class="lblr" x="512" y="236">选品</text>

<text class="h" x="24" y="344">门店承载的其余关系</text>
<rect x="24" y="356" width="176" height="46" class="box"/>
<text class="n" x="36" y="375">订单（历史快照）</text>
<text class="tb" x="36" y="392">ord_sub_order</text>
<rect x="216" y="356" width="176" height="46" class="box"/>
<text class="n" x="228" y="375">自提点</text>
<text class="tb" x="228" y="392">cmt_pickup_point</text>
<rect x="408" y="356" width="176" height="46" class="new"/>
<text class="n" x="420" y="375">分享与曝光</text>
<text class="tb" x="420" y="392">mkt_share_* · exposure</text>
<rect x="600" y="356" width="196" height="46" class="new"/>
<text class="n" x="612" y="375">顾客关系与动态</text>
<text class="tb" x="612" y="392">usr_store_follow · feed</text>

<path class="own" d="M280 304 L112 356" marker-end="url(#er)"/>
<path class="own" d="M300 304 L300 356" marker-end="url(#er)"/>
<path class="own" d="M320 304 L490 356" marker-end="url(#er)"/>
<path class="own" d="M340 304 L690 356" marker-end="url(#er)"/>
<text class="lbl" x="120" y="330">store_no</text>

<text class="h" x="24" y="440">权益 —— 边界是主体，门店只能收窄</text>
<rect x="24" y="452" width="240" height="46" class="box"/>
<text class="n" x="36" y="471">优惠券</text>
<text class="tb" x="36" y="488">mkt_coupon（+ store_scope）</text>
<rect x="280" y="452" width="240" height="46" class="box"/>
<text class="n" x="292" y="471">积分账户</text>
<text class="tb" x="292" y="488">pts_*（挂 merchant_no）</text>
<rect x="536" y="452" width="260" height="46" class="box"/>
<text class="n" x="548" y="471">客流归因</text>
<text class="tb" x="548" y="488">mkt_attribution → 费率分档</text>

<path class="own" d="M310 76 L4 90 L4 475 L24 475" marker-end="url(#er)" stroke-dasharray="2 3"/>

<rect x="24" y="516" width="772" height="62" class="box" fill="#F7F8FA"/>
<text class="n" x="36" y="536">怎么读这张图</text>
<text class="t" x="36" y="554">实线＝归属（不可改）　橙色虚线＝关联（可改：账号↔主体、门店↔主体、门店↔收款号、员工↔门店、门店↔商品）　长虚线＝权益跳过门店</text>
<text class="t" x="36" y="570">判据：通道或税务认的 → 主体　|　顾客感知的 → 门店　|　同一个人在不同店可以是不同角色 → 身份挂主体，权限挂门店</text>
</svg>
