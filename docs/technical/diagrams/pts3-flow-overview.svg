<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1140" viewBox="0 0 1660 1140"><title>完整积分流转总览</title><desc>五种持有方、用户与门店分格、接收户两格，展示返分、两种兑付、退款、责任解除及回流；细分资金动作见图册。</desc>
