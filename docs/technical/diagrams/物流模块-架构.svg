<text class="lw" x="842.0" y="588.0">⑥ 揽收后换 token · 查状态</text>
<path class="ar" d="M1134.0 408.0 L1134.0 464.0" marker-end="url(#ar)"/>
<text class="l" x="1140.0" y="442.0">三节点消息</text>
<text class="b" x="24.0" y="724.0">图上看不出来的三件事</text>
<text class="note" x="24.0" y="746.0">1. 运单不再是「读时补齐」：以前商家发货只写订单表，物流去扫订单表补出运单，补的时候还用订单状态覆盖运单状态 —— 已签收的单被打回运输中，</text>
<text class="note" x="24.0" y="764.0">   每 30 分钟重查一次快递100。现在发货即登记，订单状态不再写运单状态（状态机只进不退）。</text>
<text class="note" x="24.0" y="782.0">2. 快递100 只出现在两条线上：④ 订阅（我们调它，每单一次）与 ⑤ 推送（它调我们）。主动查询的实现还在，但默认没有任何界面被允许用它。</text>
<text class="note" x="24.0" y="800.0">3. 微信能力分在两边：查询插件（换 token、查状态）进物流；发货上报与确认收货提醒是微信支付的合规义务（自提、虚拟商品也要报），</text>
<text class="note" x="24.0" y="818.0">   留在交易域 —— 物流只给它一个「签收了」的事实（⑦）。所以 WxConfirmReceiveService 在左边，不在右边。</text>
</svg>
