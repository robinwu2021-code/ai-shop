<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="836" viewBox="0 0 1240 836" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>物流模块整体架构：交易域与物流模块之间只有 spi 契约与 outbox 事件两种连线</title>
<desc>左边是交易域（发货、订单详情、自动确认收货、微信发货上报与确认收货提醒），中间是 shop-base/spi/logistics 的契约与 sys_outbox，右边是新的 backend/logistics 模块（logistics-domain 放运单、状态机、策略与推送接收；logistics-channel 放快递100 与微信的适配），最右是外部服务商。发货走事件进物流，物流只在登记那一刻经 ShipmentSourcePort 反向取一次快照（橙色，预算 1 条）；签收等事实经 LogisticsEvents 出物流，由交易域消费去调微信确认收货提醒。快递100 只做订阅，轨迹由它推送到 /callback/logistics/kuaidi100；微信只在揽收之后换 token、在买家打开物流页或运单沉默时查状态。定时作业只剩每小时一次的补偿作业。</desc>
