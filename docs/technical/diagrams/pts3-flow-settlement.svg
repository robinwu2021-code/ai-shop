<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="785" viewBox="0 0 1640 785"><title>下单核销与两种商家兑付</title><desc>完整核销头寸状态及用户/门店/接收户积分移动，随单与定期付款来源互斥。</desc>
