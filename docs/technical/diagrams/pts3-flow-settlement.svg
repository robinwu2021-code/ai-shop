<text x="581.6666666666667" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">IN_STATEMENT</text>
<text x="581.6666666666667" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">固定候选ID/金额</text>
<text x="581.6666666666667" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">同账期修订重算</text>
