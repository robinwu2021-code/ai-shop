<text x="35" y="640" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">直连无定期转账能力拒签；抵销不是现金到账。确认前退款修订，确认未付先反转；PAYING先查结果。</text>
<text x="35" y="761" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#be123c" font-weight="400" text-anchor="start">资金证据不明确时保留原意图/占用；不假记到账、不改同一幂等请求金额。</text>
