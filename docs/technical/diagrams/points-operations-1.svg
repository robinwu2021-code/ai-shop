<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1950" viewBox="0 0 1000 1950" role="img" font-family="system-ui,-apple-system,PingFang SC,sans-serif"><title>积分流程</title><desc>按箭头追踪门店参与、原资金及售后责任；回边表示恢复或重新接线，不创建新的资金请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#8295a7"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M500 93 V140" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 198 V245" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 303 V350" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 260 H886 V470 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 377 H132 V587 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 513 V560" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 618 V665" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 587 H940 V797 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 828 V875" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 933 V980" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1038 V1085" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 599 H868 V1229 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1248 V1295" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 1322 H832 V1112 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 1124 H60 V1439 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1458 V1505" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1563 V1610" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 1649 H886 V1544 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1668 V1715" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 482 H850 V1847 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 389 H168 V1859 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="230" y="35" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="69" text-anchor="middle" font-size="15" fill="#161a21">UI 积分运营工作区</text><rect x="230" y="140" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="174" text-anchor="middle" font-size="15" fill="#161a21">HTTP Ops Controller：功能权限与登录操作人</text><rect x="230" y="245" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="279" text-anchor="middle" font-size="15" fill="#161a21">Scope 应用门面：数据域校验</text><rect x="230" y="350" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="384" text-anchor="middle" font-size="15" fill="#161a21">Store 门店目录解析归属并匹配授权商家</text><rect x="230" y="455" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="489" text-anchor="middle" font-size="15" fill="#161a21">All 要求平台 ALL 范围</text><rect x="230" y="560" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="594" text-anchor="middle" font-size="15" fill="#161a21">Audit 幂等操作日志：原始请求、操作人、服务端时间</text><rect x="230" y="665" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="699" text-anchor="middle" font-size="15" fill="#161a21">Config 类型 / 规则 / 协议 / 开关</text><rect x="230" y="770" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="804" text-anchor="middle" font-size="15" fill="#161a21">Maker 资金申请或周期计划版本</text><rect x="230" y="875" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="909" text-anchor="middle" font-size="15" fill="#161a21">Request 周期申请保留该配置版本真实制单人</text><rect x="230" y="980" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1014" text-anchor="middle" font-size="15" fill="#161a21">Checker 不同操作人复核</text><rect x="230" y="1085" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1119" text-anchor="middle" font-size="15" fill="#161a21">Kernel 积分内核与短 pay 事务</text><rect x="230" y="1190" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1224" text-anchor="middle" font-size="15" fill="#161a21">Statement 按门店、原路由组与 revision 操作账单</text><rect x="230" y="1295" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1329" text-anchor="middle" font-size="15" fill="#161a21">Permission PREPARE_PAYOUT：付款执行权限</text><rect x="230" y="1400" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1434" text-anchor="middle" font-size="15" fill="#161a21">Intent 提交原始资金意图</text><rect x="230" y="1505" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1539" text-anchor="middle" font-size="15" fill="#161a21">Executor 事务外执行或查询原号</text><rect x="230" y="1610" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1644" text-anchor="middle" font-size="15" fill="#161a21">Unknown 资金结果</text><rect x="230" y="1715" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1749" text-anchor="middle" font-size="15" fill="#161a21">Confirm 短 pay 事务确认、流水与审计</text><rect x="230" y="1820" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1854" text-anchor="middle" font-size="15" fill="#161a21">Query 只读 DTO：四池、预留、锁定、独立 R</text><text x="510" y="328" font-size="12" fill="#35495c">逐店操作</text><text x="785" y="256" font-size="12" fill="#35495c">全量资金或用户数据</text><text x="510" y="1063" font-size="12" fill="#35495c">通过</text><text x="785" y="1318" font-size="12" fill="#35495c">授权通过</text><text x="785" y="1645" font-size="12" fill="#35495c">UNKNOWN</text><text x="510" y="1693" font-size="12" fill="#35495c">可信明确结果</text></svg>