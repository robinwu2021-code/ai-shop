<svg xmlns="http://www.w3.org/2000/svg" width="680" height="312" viewBox="0 0 680 312" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>数据库域总览</title><desc>按被引用次数分为三条带，箭头表示下层依赖上层。域之间存在环，故不画成有向无环图。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-weight:500;fill:#161A21}.s{font-size:11px;fill:#5A6472}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#F7F9FB;stroke-width:3.5;stroke-linejoin:round}.b{font-size:11px;fill:#5A6472;letter-spacing:.1em}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs><line x1="36" y1="26" x2="644" y2="26" stroke="#D8DEE6"/>
<text class="b" x="36" y="40">基础 · 被引用最多</text>
<rect x="105" y="50" width="150" height="46" rx="6" fill="#EDEFF2" stroke="#B3B9C2"/>
<text class="n" x="180" y="70" text-anchor="middle" font-size="13">用户与商家</text>
<text class="s" x="180" y="85" text-anchor="middle">usr_* · 4 表</text>
<rect x="265" y="50" width="150" height="46" rx="6" fill="#EDEFF2" stroke="#B3B9C2"/>
<text class="n" x="340" y="70" text-anchor="middle" font-size="13">社区与自提点</text>
<text class="s" x="340" y="85" text-anchor="middle">cmt_* · 2 表</text>
<rect x="425" y="50" width="150" height="46" rx="6" fill="#EDEFF2" stroke="#B3B9C2"/>
<text class="n" x="500" y="70" text-anchor="middle" font-size="13">交易</text>
<text class="s" x="500" y="85" text-anchor="middle">ord_* · 5 表</text>
<line class="ar" x1="340" y1="124" x2="340" y2="104" marker-end="url(#a)"/>
<text class="l" x="348" y="118">依赖</text>
<line x1="36" y1="124" x2="644" y2="124" stroke="#D8DEE6"/>
<text class="b" x="36" y="138">主数据与交易</text>
<rect x="185" y="148" width="150" height="46" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="260" y="168" text-anchor="middle" font-size="13">商品与类目</text>
<text class="s" x="260" y="183" text-anchor="middle">prd_* · 8 表</text>
<rect x="345" y="148" width="150" height="46" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="420" y="168" text-anchor="middle" font-size="13">营销与团购</text>
<text class="s" x="420" y="183" text-anchor="middle">mkt_* · 11 表</text>
<line class="ar" x1="340" y1="222" x2="340" y2="202" marker-end="url(#a)"/>
<text class="l" x="348" y="216">依赖</text>
<line x1="36" y1="222" x2="644" y2="222" stroke="#D8DEE6"/>
<text class="b" x="36" y="236">派生与记账</text>
<rect x="37" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="76" y="266" text-anchor="middle" font-size="13">购物车</text>
<text class="s" x="76" y="281" text-anchor="middle">trd_* · 1…</text>
<rect x="125" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="164" y="266" text-anchor="middle" font-size="13">履约</text>
<text class="s" x="164" y="281" text-anchor="middle">ful_* · 3…</text>
<rect x="213" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="252" y="266" text-anchor="middle" font-size="13">积分</text>
<text class="s" x="252" y="281" text-anchor="middle">pts_* · 2…</text>
<rect x="301" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="340" y="266" text-anchor="middle" font-size="13">结算</text>
<text class="s" x="340" y="281" text-anchor="middle">stl_* · 4…</text>
<rect x="389" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="428" y="266" text-anchor="middle" font-size="13">评价</text>
<text class="s" x="428" y="281" text-anchor="middle">rvw_* · 3…</text>
<rect x="477" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="516" y="266" text-anchor="middle" font-size="11">消息与客服</text>
<text class="s" x="516" y="281" text-anchor="middle">msg_* · 3…</text>
<rect x="565" y="246" width="78" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="604" y="266" text-anchor="middle" font-size="13">系统</text>
<text class="s" x="604" y="281" text-anchor="middle">sys_* · 1…</text></svg>