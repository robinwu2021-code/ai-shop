<text x="921" y="549" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">统一积分过账与资金适配</text>
<text x="921" y="575" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">PointsPostingService写账</text>
<text x="921" y="598" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">PointsFundsGateway / Adapter</text>
<text x="921" y="621" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">只依赖pay资金与通道接口</text>
<path d="M1120,415 L1120,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<path d="M905,610 L850,610" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="795" y="713" width="101.19999999999999" height="26" rx="4" fill="#f8fafc"/>
<text x="800" y="730" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#2563eb" font-weight="400" text-anchor="start">共用pay事务</text>
<rect x="430" y="770" width="905" height="115" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="430" y="770" width="6" height="115" rx="3" fill="#7c3aed"/>
<text x="446" y="799" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">本地事务提交边界</text>
<text x="446" y="825" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">结算状态与积分账务必要变更一起提交 / 回滚；跨域结果通过pay Outbox发布。</text>
<rect x="1410" y="520" width="260" height="170" rx="12" fill="white" stroke="#c2410c" stroke-width="1.8"/>
<rect x="1410" y="520" width="6" height="170" rx="3" fill="#c2410c"/>
