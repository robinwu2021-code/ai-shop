<text x="446" y="290" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">结算单、分账、付款结果</text>
<text x="446" y="313" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">短事务准备及结果确认</text>
<text x="446" y="336" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不直接写pts表</text>
<rect x="905" y="235" width="430" height="180" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
