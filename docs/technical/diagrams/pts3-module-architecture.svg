<text x="1426" y="575" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">意图提交后执行</text>
<text x="1426" y="598" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">幂等submit / query</text>
<text x="1426" y="621" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">证据确认后本地过账</text>
<path d="M1335,605 L1410,605" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#money)"/>
<rect x="30" y="770" width="320" height="150" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="30" y="770" width="6" height="150" rx="3" fill="#2563eb"/>
<text x="46" y="799" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">宿主入口与任务</text>
<text x="46" y="825" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">shop-app Controller / 门面</text>
<text x="46" y="848" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">job-worker只负责触发</text>
<text x="46" y="871" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">沿用既有pay部署装配</text>
<text x="35" y="975" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="19" fill="#172554" font-weight="650" text-anchor="start">同pay短事务：准备付款意图 → 提交；事务外调用资金通道；同pay短事务：确认结算与积分结果。</text>
<text x="35" y="1015" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#172554" font-weight="400" text-anchor="start">订单事务与pay事务仍隔离：取消、退款与事实补偿保留跨域幂等协议；不新增积分JAR、连接池或事务管理器。</text>
<text x="35" y="1060" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">模块独立体现在业务职责、对象、接口和统一写账入口。图中类与路径均为目标设计。</text>
</svg>
