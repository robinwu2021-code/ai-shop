<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120"><title>积分业务模块架构 · 集成pay</title><desc>积分是pay-domain中的业务模块，与结算共享pay事务；订单经SPI和可靠事件跨域，外部资金调用在已提交的付款意图之后执行。</desc>
