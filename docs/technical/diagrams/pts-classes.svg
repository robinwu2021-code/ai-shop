<svg xmlns="http://www.w3.org/2000/svg" width="700" height="392" viewBox="0 0 700 392" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分域类图</title>
<desc>PointsService 是入口，向下依赖 FeeService（发分即计提）、RedeemService（抵扣与兑付）与 Capability（开关判断）；FeeService 与 RedeemService 都作用在 PoolService 上——前者把费用金打进池子，后者让池子付给收单方。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.t{font-size:12.5px;font-weight:600;fill:#161A21}.m{font-size:10.5px;fill:#313A46}
.c{font-size:10px;fill:#7A8492}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs>

<rect x="220" y="14" width="260" height="132" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="t" x="350" y="34" text-anchor="middle">PointsService</text>
<line x1="220" y1="42" x2="480" y2="42" stroke="#8FB3C9"/>
<text class="m" x="232" y="58">grantOnPay(subOrder)　　　<tspan class="c">支付后发放</tspan></text>
<text class="m" x="232" y="74">deductOnPlace(order, use)　<tspan class="c">下单抵扣</tspan></text>
<text class="m" x="232" y="90">activateExpired()　　　　　<tspan class="c">售后期满转可用</tspan></text>
<text class="m" x="232" y="106">settleAllocOnActivate(so)　<tspan class="c">兑付成立</tspan></text>
<text class="m" x="232" y="122">reverse(subOrder, kind)　　<tspan class="c">取消或退款</tspan></text>
<text class="m" x="232" y="138">expireDaily() / reconcileDaily()</text>

<rect x="14" y="204" width="200" height="88" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="t" x="114" y="224" text-anchor="middle">FeeService</text>
<line x1="14" y1="232" x2="214" y2="232" stroke="#8FB3C9"/>
<text class="m" x="26" y="248">accrue(so)　<tspan class="c">支付时计提</tspan></text>
<text class="m" x="26" y="264">charge(no)　<tspan class="c">解冻时实扣</tspan></text>
<text class="m" x="26" y="280">refund(so)　<tspan class="c">退款时退还</tspan></text>

<rect x="250" y="204" width="200" height="88" rx="6" fill="#FDF3E3" stroke="#D9B87C"/>
<text class="t" x="350" y="224" text-anchor="middle">RedeemService</text>
<line x1="250" y1="232" x2="450" y2="232" stroke="#D9B87C"/>
<text class="m" x="262" y="248">deduct(user, pts)　<tspan class="c">FIFO 扣批次</tspan></text>
<text class="m" x="262" y="264">confirm(useNo)　　<tspan class="c">兑付成立</tspan></text>
<text class="m" x="262" y="280">reverse(useNo)　　<tspan class="c">反向记账</tspan></text>

<rect x="486" y="204" width="200" height="60" rx="6" fill="#F3F5F7" stroke="#C6CDD6"/>
<text class="t" x="586" y="224" text-anchor="middle">Capability</text>
<line x1="486" y1="232" x2="686" y2="232" stroke="#C6CDD6"/>
<text class="m" x="498" y="250">canPoints(ctx)　<tspan class="c">四级串联</tspan></text>

<rect x="180" y="332" width="240" height="46" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="t" x="300" y="352" text-anchor="middle">PoolService</text>
<text class="m" x="300" y="369" text-anchor="middle">in / out / balance(market)</text>

<path class="ar" d="M280 146 L280 176 L114 176 L114 201" marker-end="url(#a)"/>
<text class="l" x="176" y="172" text-anchor="middle">发分即计提</text>
<path class="ar" d="M350 146 L350 201" marker-end="url(#a)"/>
<text class="l" x="360" y="170" text-anchor="start">抵扣与兑付</text>
<path class="ar" d="M430 146 L430 176 L586 176 L586 201" marker-end="url(#a)"/>
<text class="l" x="586" y="172" text-anchor="middle">开关判断</text>
<path class="ar" d="M114 292 L114 355 L177 355" marker-end="url(#a)"/>
<text class="l" x="150" y="348" text-anchor="middle">费用金进池</text>
<path class="ar" d="M350 292 L350 329" marker-end="url(#a)"/>
<text class="l" x="426" y="312" text-anchor="middle">池子付给收单方</text>
</svg>
