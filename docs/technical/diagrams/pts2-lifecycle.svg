<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分生命周期：发放侧与核销侧</title>
<desc>发放侧：支付成功后发放进入待生效，发放子单结算终局后转为可用，闲置满期清零转平台收入；退款时从待生效或可用收回，钱回池子未分配。核销侧：下单占用，收单子单结算时先进入兑付中，补差成功后已兑付，失败回到占用；占用状态下可释放回可用，已兑付后退款退回可用。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.da{stroke:#8A94A2;stroke-width:1.2;fill:none;stroke-dasharray:4 3}</style></defs>
<rect width="780" height="400" fill="#FFFFFF"/>

<text class="g" x="16" y="24">发放侧（发放头寸 · 每支付子单一行）</text>
<rect x="16" y="40" width="120" height="52" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="76" y="62" text-anchor="middle">支付成功</text>
<text class="s" x="76" y="80" text-anchor="middle">池子 U → C</text>
<rect x="196" y="40" width="120" height="52" rx="6" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="256" y="62" text-anchor="middle">P 待生效</text>
<text class="s" x="256" y="80" text-anchor="middle">可见不可用</text>
<rect x="416" y="40" width="120" height="52" rx="6" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="476" y="62" text-anchor="middle">A 可用</text>
<text class="s" x="476" y="80" text-anchor="middle">能抵扣</text>
<rect x="636" y="40" width="128" height="52" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="700" y="62" text-anchor="middle">到期清零</text>
<text class="s" x="700" y="80" text-anchor="middle">C → 平台收入</text>
<path class="ar" d="M136 66 L194 66" marker-end="url(#a)"/>
<text class="l" x="165" y="58" text-anchor="middle">GRANT</text>
<path class="ar" d="M316 66 L414 66" marker-end="url(#a)"/>
<text class="l" x="365" y="58" text-anchor="middle">结算终局</text>
<path class="ar" d="M536 66 L634 66" marker-end="url(#a)"/>
<text class="l" x="585" y="58" text-anchor="middle">闲置满期</text>
<rect x="296" y="126" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="426" y="146" text-anchor="middle">REVOKE 收回（按累计退款比例）</text>
<text class="s" x="426" y="162" text-anchor="middle">C → U；A 不够时差额从退款现金扣，不许负</text>
<path class="da" d="M256 92 L330 124" marker-end="url(#a)"/>
<path class="da" d="M476 92 L470 124" marker-end="url(#a)"/>

<line x1="16" y1="198" x2="764" y2="198" stroke="#E3E7EC"/>

<text class="g" x="16" y="224">核销侧（占用头寸 · 每用分子单一行）</text>
<rect x="16" y="240" width="120" height="52" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="76" y="262" text-anchor="middle">下单</text>
<text class="s" x="76" y="280" text-anchor="middle">A → H</text>
<rect x="196" y="240" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="256" y="262" text-anchor="middle">HELD 占用</text>
<text class="s" x="256" y="280" text-anchor="middle">钱仍在 C</text>
<rect x="416" y="240" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#C8A86B"/>
<text class="n" x="476" y="262" text-anchor="middle">REDEEMING</text>
<text class="s" x="476" y="280" text-anchor="middle">补差在途，不可释放</text>
<rect x="636" y="240" width="128" height="52" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="700" y="262" text-anchor="middle">REDEEMED</text>
<text class="s" x="700" y="280" text-anchor="middle">C → 收单方</text>
<path class="ar" d="M136 266 L194 266" marker-end="url(#a)"/>
<text class="l" x="165" y="258" text-anchor="middle">HOLD</text>
<path class="ar" d="M316 258 L414 258" marker-end="url(#a)"/>
<text class="l" x="365" y="250" text-anchor="middle">beginRedeem</text>
<path class="ar" d="M414 278 L318 278" marker-end="url(#a)"/>
<text class="l" x="365" y="294" text-anchor="middle">补差失败</text>
<path class="ar" d="M536 266 L634 266" marker-end="url(#a)"/>
<text class="l" x="585" y="258" text-anchor="middle">补差成功</text>

<rect x="176" y="326" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="256" y="346" text-anchor="middle">RELEASE 释放</text>
<text class="s" x="256" y="362" text-anchor="middle">取消 / 兑付前退款：H → A</text>
<rect x="590" y="326" width="174" height="44" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="677" y="346" text-anchor="middle">RETURN 退回</text>
<text class="s" x="677" y="362" text-anchor="middle">兑付后退款：A +，钱回 C 或 R</text>
<path class="da" d="M256 292 L256 324" marker-end="url(#a)"/>
<path class="da" d="M700 292 L690 324" marker-end="url(#a)"/>
<text class="s" x="16" y="392">两侧挂在同一个结算终局事件上：作为收单方兑付、作为发放方转正 —— 月末不必区分「账单晚了」还是「积分晚了」。</text>
</svg>
