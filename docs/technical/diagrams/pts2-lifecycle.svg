<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分生命周期：发放侧与两种核销结算</title>
<desc>发放侧：支付成功后发放户转入 C 端待生效，结算终局后转可用，闲置满期回接收户。核销侧随单结算：下单占用，支付时兑付转到接收户、钱进待付，分账补差前进入付款中，成功后已付款，失败回到已兑付。核销侧定期结算：支付时进入门店户待确认，终局后待结算，出单锁定，B 端确认后转接收户，打款后已付款。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs>
<rect width="800" height="470" fill="#FFFFFF"/>

<text class="g" x="16" y="24">发放侧（发放头寸）</text>
<rect x="16" y="38" width="130" height="50" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="81" y="59" text-anchor="middle">支付成功</text>
<text class="s" x="81" y="76" text-anchor="middle">发放户 → C 端</text>
<rect x="216" y="38" width="130" height="50" rx="6" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="281" y="59" text-anchor="middle">待生效</text>
<text class="s" x="281" y="76" text-anchor="middle">可见不可用</text>
<rect x="436" y="38" width="130" height="50" rx="6" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="501" y="59" text-anchor="middle">可用</text>
<text class="s" x="501" y="76" text-anchor="middle">能抵扣</text>
<rect x="656" y="38" width="128" height="50" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="720" y="59" text-anchor="middle">到期</text>
<text class="s" x="720" y="76" text-anchor="middle">→ 接收户，钱转收入</text>
<path class="ar" d="M146 63 L214 63" marker-end="url(#a)"/>
<path class="ar" d="M346 63 L434 63" marker-end="url(#a)"/>
<text class="l" x="390" y="55" text-anchor="middle">结算终局</text>
<path class="ar" d="M566 63 L654 63" marker-end="url(#a)"/>
<text class="l" x="610" y="55" text-anchor="middle">闲置满期</text>
<text class="s" x="216" y="108">退款：按累计比例收回到发放户；可用不够的差额从退款现金扣，不许负余额</text>

<line x1="16" y1="124" x2="784" y2="124" stroke="#E3E7EC"/>

<text class="g" x="16" y="148">核销侧 · 随单结算（默认）</text>
<rect x="16" y="162" width="130" height="50" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="81" y="183" text-anchor="middle">HELD 占用</text>
<text class="s" x="81" y="200" text-anchor="middle">下单：可用 → 占用</text>
<rect x="216" y="162" width="150" height="50" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="291" y="183" text-anchor="middle">TRANSFERRED</text>
<text class="s" x="291" y="200" text-anchor="middle">支付：→ 接收户，C → D</text>
<rect x="446" y="162" width="130" height="50" rx="6" fill="#FFFFFF" stroke="#C8A86B"/>
<text class="n" x="511" y="183" text-anchor="middle">PAYING</text>
<text class="s" x="511" y="200" text-anchor="middle">补差在途</text>
<rect x="656" y="162" width="128" height="50" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="720" y="183" text-anchor="middle">PAID</text>
<text class="s" x="720" y="200" text-anchor="middle">D → 商家</text>
<path class="ar" d="M146 187 L214 187" marker-end="url(#a)"/>
<text class="l" x="180" y="179" text-anchor="middle">支付</text>
<path class="ar" d="M366 179 L444 179" marker-end="url(#a)"/>
<text class="l" x="405" y="171" text-anchor="middle">beginPayout</text>
<path class="ar" d="M444 199 L368 199" marker-end="url(#a)"/>
<text class="l" x="405" y="215" text-anchor="middle">补差失败</text>
<path class="ar" d="M576 187 L654 187" marker-end="url(#a)"/>
<text class="l" x="615" y="179" text-anchor="middle">补差成功</text>

<line x1="16" y1="236" x2="784" y2="236" stroke="#F0F2F5"/>
<text class="g" x="16" y="260">核销侧 · 定期结算（协议约定）</text>
<rect x="16" y="274" width="130" height="50" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="81" y="295" text-anchor="middle">HELD 占用</text>
<text class="s" x="81" y="312" text-anchor="middle">同上</text>
<rect x="196" y="274" width="130" height="50" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="261" y="295" text-anchor="middle">IN_STORE</text>
<text class="s" x="261" y="312" text-anchor="middle">门店户「待确认」</text>
<rect x="376" y="274" width="130" height="50" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="441" y="295" text-anchor="middle">SETTLEABLE</text>
<text class="s" x="441" y="312" text-anchor="middle">门店户「待结算」</text>
<rect x="556" y="274" width="104" height="50" rx="6" fill="#FFFFFF" stroke="#C8A86B"/>
<text class="n" x="608" y="295" text-anchor="middle">IN_STATEMENT</text>
<text class="s" x="608" y="312" text-anchor="middle">出单锁定</text>
<rect x="690" y="274" width="94" height="50" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="737" y="295" text-anchor="middle">SETTLED</text>
<text class="s" x="737" y="312" text-anchor="middle">→ 接收户</text>
<path class="ar" d="M146 299 L194 299" marker-end="url(#a)"/>
<text class="l" x="170" y="291" text-anchor="middle">支付</text>
<path class="ar" d="M326 299 L374 299" marker-end="url(#a)"/>
<text class="l" x="350" y="291" text-anchor="middle">终局</text>
<path class="ar" d="M506 299 L554 299" marker-end="url(#a)"/>
<text class="l" x="530" y="291" text-anchor="middle">账期</text>
<path class="ar" d="M660 299 L688 299" marker-end="url(#a)"/>
<text class="s" x="376" y="346">IN_STATEMENT → SETTLED：B 端确认（或超期自动确认）→ 门店户 → 接收户，C → D</text>
<text class="s" x="376" y="362">之后平台打款：D → 商家</text>

<line x1="16" y1="384" x2="784" y2="384" stroke="#E3E7EC"/>
<text class="s" x="16" y="406">退款按积分所在位置处理：占用（未支付）→ 释放；已兑付未付款 / 在门店户 → 反转回 C 端，钱 D → C；</text>
<text class="s" x="16" y="424">已付款 → 退回 C 端，补差回退成功钱回 C，失败记待追回 R（定期结算的下期结算单冲减）。</text>
<text class="s" x="16" y="450">核销头寸在支付时落定结算方式，之后协议变更不影响这一单。</text>
</svg>
