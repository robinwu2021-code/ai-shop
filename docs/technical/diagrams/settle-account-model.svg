<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>账户抽象：哪些是真账户，哪些只是账本</title>
<desc>平台侧只有积分是真正持有余额的账户；结算相关的都是账本（记账实体），真实资金账户全在持牌机构侧。门店经收款商户号映射到结算账户，三个维度各归各。</desc>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.l{font-size:9.5px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.real{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.5}
.ledger{fill:#FBFCFD;stroke:#B9C2CE;stroke-width:1.4}
.pts{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.5}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.zone{fill:none;stroke:#DDE2E9;stroke-width:1.2;stroke-dasharray:5 4}
.zt{font-size:10px;fill:#A6AEBB;letter-spacing:.1em}
</style></defs>

<text class="b" x="24" y="26">① 真实资金账户 —— 全在持牌机构侧，平台不持有</text>
<rect class="zone" x="14" y="36" width="932" height="150" rx="10"/>
<text class="zt" x="26" y="54">微信支付账户体系</text>

<rect class="box real" x="30" y="66" width="196" height="52" rx="7"/>
<text class="n" x="44" y="87">平台商户号</text>
<text class="t" x="44" y="104">自营收款 · 第三方待分账</text>

<rect class="box real" x="290" y="66" width="230" height="52" rx="7"/>
<text class="n" x="304" y="87">二级商户号 sub_mchid</text>
<text class="t" x="304" y="104">一店一个（V14 起按门店进件）</text>

<rect class="box real" x="584" y="66" width="180" height="52" rx="7"/>
<text class="n" x="598" y="87">平台对公账户</text>
<text class="t" x="598" y="104">银行 · 仅自营可提</text>

<rect class="box real" x="790" y="66" width="150" height="52" rx="7"/>
<text class="n" x="804" y="87">商家结算账户</text>
<text class="t" x="804" y="104">对公 / 个人卡</text>

<path class="ar" marker-end="url(#am)" d="M226 92 L286 92"/>
<text class="l" x="232" y="82">分账</text>
<path class="ar" marker-end="url(#am)" d="M520 92 L580 92"/>
<text class="l" x="516" y="140">提现（自营合法）</text>
<path class="ar" marker-end="url(#am)" d="M520 104 L560 150 L790 150 L790 122"/>
<text class="l" x="620" y="166">解冻后商家自行提现</text>

<text class="t" x="30" y="176">⚠️ 第三方模式下，平台商户号里属于商家的钱 **不得** 提现到平台对公账户（§5.14 红线，系统挡不住，属财务纪律）</text>

<text class="b" x="24" y="218">② 平台侧账本 —— 只记账，不持有资金</text>
<rect class="zone" x="14" y="228" width="580" height="176" rx="10"/>

<rect class="box ledger" x="30" y="256" width="170" height="60" rx="7"/>
<text class="n" x="44" y="277">stl_bill</text>
<text class="t" x="44" y="294">结算单 / 应付账款</text>
<text class="t" x="44" y="308">自营与第三方共用一张表</text>

<rect class="box ledger" x="216" y="256" width="160" height="60" rx="7"/>
<text class="n" x="230" y="277">stl_split_log</text>
<text class="t" x="230" y="294">分账指令与回执</text>
<text class="t" x="230" y="308">provider_no 勾对通道</text>

<rect class="box ledger" x="392" y="256" width="186" height="60" rx="7"/>
<text class="n" x="406" y="277">stl_purchase_invoice</text>
<text class="t" x="406" y="294">进项票登记（自营）</text>
<text class="t" x="406" y="308">三流一致的比对依据</text>

<text class="t" x="30" y="342">这三张表都是**账本**：它们记录「谁该收多少、走到哪一步、凭证在不在」，</text>
<text class="t" x="30" y="358">但**不存在余额**。要问「钱在哪」，答案永远在上面那一排真实账户里。</text>
<text class="t" x="30" y="380">→ 所以第三方模式不需要「商家余额表」，也不需要「提现单」（§3.1）。</text>

<text class="b" x="616" y="218">③ 唯一持有余额的地方：积分</text>
<rect class="zone" x="608" y="228" width="338" height="176" rx="10"/>

<rect class="box pts" x="624" y="256" width="150" height="60" rx="7"/>
<text class="n" x="638" y="277">pts_user_account</text>
<text class="t" x="638" y="294">用户积分余额</text>
<text class="t" x="638" y="308">锁行 + 派生余额</text>

<rect class="box pts" x="790" y="256" width="140" height="60" rx="7"/>
<text class="n" x="804" y="277">stl_points_pool</text>
<text class="t" x="804" y="294">平台积分资金池</text>
<text class="t" x="804" y="308">出资方按 pool_type 分</text>

<text class="t" x="624" y="342">积分是平台**真正记余额**的东西，与结算的账本性质不同。</text>
<text class="t" x="624" y="358">自营：抵扣即平台少收，无资金动作。</text>
<text class="t" x="624" y="380">第三方：需补差把差额打进二级商户，商家仍收全额。</text>

<text class="b" x="24" y="436">④ 三个维度各归各 —— 门店到账户的映射链（V14 已实现）</text>

<rect class="box" x="30" y="452" width="150" height="46" rx="7"/>
<text class="n" x="44" y="472">mch_store</text><text class="t" x="44" y="489">门店 · 统计维度</text>

<rect class="box" x="244" y="452" width="220" height="46" rx="7"/>
<text class="n" x="258" y="472">mch_payment_merchant</text><text class="t" x="258" y="489">收款商户号 · 结算维度</text>

<rect class="box" x="528" y="452" width="170" height="46" rx="7"/>
<text class="n" x="542" y="472">mch_entity</text><text class="t" x="542" y="489">主体 · 合规维度</text>

<rect class="box" x="762" y="452" width="178" height="46" rx="7"/>
<text class="n" x="776" y="472">结算账户</text><text class="t" x="776" y="489">钱最终落到的银行卡</text>

<path class="ar" marker-end="url(#am)" d="M180 475 L240 475"/>
<text class="l" x="182" y="466">pay_merchant_no</text>
<path class="ar" marker-end="url(#am)" d="M464 475 L524 475"/>
<text class="l" x="466" y="466">entity_no</text>
<path class="ar" marker-end="url(#am)" d="M698 475 L758 475"/>

<text class="t" x="30" y="524">两家店配同一个收款号 = 合并结算；配不同的 = 分开结算。**这是配置的结果，不需要开关**（V14）。</text>
<text class="t" x="30" y="544">而「什么时候分账」是另一个正交的轴（settle_mode），没有任何配置能推导出来，必须显式存 —— 两者不矛盾。</text>
</svg>
