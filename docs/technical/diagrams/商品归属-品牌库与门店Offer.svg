<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>商品归属：品牌库与门店 Offer（ADR-030）</title>
  <desc>品牌/连锁级商品库以引用式供门店选品；可售单元是门店 Offer，价/存/上架都在这一层。</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arwDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#ffffff; stroke:#475569; stroke-width:1.5; rx:8; }
    .brand { fill:#eef2ff; stroke:#4f46e5; stroke-width:1.5; }
    .offer { fill:#ecfdf5; stroke:#059669; stroke-width:2; }
    .store { fill:#fff7ed; stroke:#ea580c; stroke-width:1.5; }
    .dead  { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:4 3; }
    .side  { fill:#f8fafc; stroke:#64748b; stroke-width:1.2; }
    .t     { font-size:13.5px; fill:#0f172a; font-weight:600; }
    .s     { font-size:11.5px; fill:#475569; }
    .m     { font-size:11px; fill:#64748b; font-style:italic; }
    .lbl   { font-size:11.5px; fill:#334155; font-weight:600; }
    .ln    { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arw); }
    .lnDim { stroke:#94a3b8; stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#arwDim); }
    .hd    { font-size:15px; fill:#0f172a; font-weight:700; }
  </style>

  <text class="hd" x="24" y="30">商品归属：品牌库与门店 Offer（ADR-030）</text>
  <text class="s" x="24" y="50">可售单元 = 门店 Offer。「这家店卖什么、什么价、多少货、上没上架」一张表答完。</text>

  <!-- 品牌 -->
  <rect class="box brand" x="24" y="76" width="250" height="68" rx="8"/>
  <text class="t" x="38" y="99">品牌 / 连锁　mch_brand</text>
  <text class="s" x="38" y="118">在主体之上，可跨法人（加盟）</text>
  <text class="s" x="38" y="134">hq_entity_no = 总部主体（谁能写库）</text>

  <!-- 品牌库 -->
  <rect class="box brand" x="24" y="176" width="250" height="92" rx="8"/>
  <text class="t" x="38" y="199">品牌商品库　prd_brand_spu</text>
  <text class="s" x="38" y="218">类目 / 标题 / 图 / 规格组(optionCode)</text>
  <text class="s" x="38" y="235">物理上没有价、库存、上架列</text>
  <text class="m" x="38" y="256">总部在 B 端 app 维护</text>

  <line class="ln" x1="149" y1="144" x2="149" y2="174"/>

  <!-- 引用箭头 -->
  <path class="ln" d="M274,222 L392,222"/>
  <text class="lbl" x="282" y="214">引用式（不拷贝）</text>
  <text class="m" x="282" y="240">改库 → 门店展示跟变</text>
  <text class="m" x="282" y="255">价/存/上架 永不跟</text>

  <!-- 门店 Offer -->
  <rect class="box offer" x="392" y="160" width="300" height="124" rx="8"/>
  <text class="t" x="408" y="184">门店商品 Offer　prd_goods</text>
  <text class="s" x="408" y="204">goods_no（不换名：259 文件 + 订单引用）</text>
  <text class="s" x="408" y="221">store_no　← 归属改到这里</text>
  <text class="s" x="408" y="238">brand_spu_no：空=自建 / 非空=引用库</text>
  <text class="s" x="408" y="255">overrides：被门店改写的字段不再跟库</text>
  <text class="s" x="408" y="272">on_sale · platform_suspended</text>

  <!-- sku -->
  <rect class="box offer" x="392" y="312" width="300" height="60" rx="8"/>
  <text class="t" x="408" y="335">prd_sku(goods_no)</text>
  <text class="s" x="408" y="354">价 · 库存 —— 就在这一层，没有第二层覆盖</text>
  <line class="ln" x1="542" y1="284" x2="542" y2="310"/>

  <!-- 门店 -->
  <rect class="box store" x="392" y="76" width="300" height="60" rx="8"/>
  <text class="t" x="408" y="99">门店　mch_store</text>
  <text class="s" x="408" y="118">经营范围在门店（ADR-009 / ADR-013 / V381）</text>
  <line class="ln" x1="542" y1="136" x2="542" y2="158"/>

  <!-- 主体：结算键 -->
  <rect class="box side" x="736" y="160" width="200" height="104" rx="8"/>
  <text class="t" x="750" y="183">经营主体　mch_entity</text>
  <text class="s" x="750" y="202">进件 / 分账 / 结算 / 积分</text>
  <text class="s" x="750" y="219">通道按营业执照发号</text>
  <text class="s" x="750" y="238">← Offer.entity_no 冗余作结算键</text>
  <text class="m" x="750" y="257">ADR-011 硬约束，未变</text>
  <path class="lnDim" d="M692,212 L734,212"/>

  <!-- 可见性 -->
  <rect class="box store" x="392" y="408" width="300" height="86" rx="8"/>
  <text class="t" x="408" y="431">买家可见性　GoodsVisibility</text>
  <text class="s" x="408" y="450">servingStores(communityNo) ← ReachRule</text>
  <text class="s" x="408" y="467">= Offer.store_no 在不在里面</text>
  <text class="m" x="408" y="487">三方现算 → 一次交集；ReachRule 零改动</text>
  <line class="ln" x1="542" y1="372" x2="542" y2="406"/>

  <!-- 平台标准品库：另一层 -->
  <rect class="box side" x="24" y="312" width="250" height="86" rx="8"/>
  <text class="t" x="38" y="335">平台标准品库　prd_spu_std</text>
  <text class="s" x="38" y="354">311 条 · 运营维护 · 全平台共享</text>
  <text class="s" x="38" y="371">复制 + 溯源（std_no），与库不同层</text>
  <text class="m" x="38" y="391">保留，不废弃</text>
  <path class="lnDim" d="M274,350 L390,342"/>
  <text class="m" x="286" y="336">复制式取用（原样保留）</text>

  <!-- 被吸收的三张表 -->
  <rect class="box dead" x="24" y="436" width="340" height="140" rx="8"/>
  <text class="t" x="38" y="459" fill="#64748b">被吸收并删除的三张表</text>
  <text class="s" x="38" y="480">prd_store_goods（62）→ on_sale 落到 Offer 自身</text>
  <text class="s" x="38" y="499">prd_store_price（1）　→ 价就是 prd_sku.price</text>
  <text class="s" x="38" y="518">prd_store_stock（2）　→ 存就是 prd_sku.stock</text>
  <text class="m" x="38" y="541">Offer 已是门店级，不需要覆盖层</text>
  <text class="m" x="38" y="560">连带消掉「价回退 vs 存归零」两个相反缺省</text>

  <!-- 两条建品路径 -->
  <rect class="box side" x="736" y="312" width="200" height="110" rx="8"/>
  <text class="t" x="750" y="335">两条建品路径</text>
  <text class="s" x="750" y="356">① 门店自建</text>
  <text class="s" x="750" y="373">　 brand_spu_no = NULL</text>
  <text class="s" x="750" y="394">② 从品牌库选品</text>
  <text class="s" x="750" y="411">　 唯一: (store_no, brand_spu_no)</text>
  <path class="lnDim" d="M734,340 L694,250"/>

  <!-- 脚注 -->
  <text class="s" x="24" y="612">ADR-030 只推翻 ADR-011 的「商品挂主体 + 门店投影」这一层实现；它的钱 / 主体边界原样保留。</text>
  <text class="s" x="24" y="632">分期：P1 建品牌与库（纯新增）→ P2 prd_goods 加列并回填（双读期）→ P3 读写切到 Offer → P4 删上面三张表。</text>
  <text class="m" x="24" y="656">另有 P0（独立于本重构，可先发）：重复聚落致买家看不到商品 —— 建聚落处查重复用 + nearby 折叠同名同址。</text>
  <text class="m" x="24" y="676">图随 TDD-商品归属重构-品牌库与门店Offer.md 维护；表行数为 2026-10-08 线上实测值。</text>
</svg>
