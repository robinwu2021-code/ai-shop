<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>支付服务完整架构：接入端 · 接入层 · 应用层 · 领域核心 · 渠道层 · 支付库 · 核心系统</title>
<desc>七类来源经各自入口进入：面向人与第三方的入口在支付系统的 pay-portal 模块，内部调用在 pay-svc，渠道回调走统一回调地址。应用层统一按调用方判权；领域核心管进件与商户、支付单与交易、流水与审批；渠道层按支付类型拆能力接口，所有 HTTP 调用经记录型客户端落库。支付库保存订单、流水、调用与回调记录。核心系统只经 Port 与事件交互。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12px;font-weight:600;fill:#161A21}
.t{font-size:10px;fill:#5A6472}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.1em}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.key{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.new{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.2}
.old{fill:#F5F6F8;stroke:#D8DEE6;stroke-width:1.2}
.db{fill:#F3F6FB;stroke:#9DB2D0;stroke-width:1.2}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.band{stroke:#EDEFF2;stroke-width:1}
</style></defs>

<text class="b" x="26" y="22">① 接入端</text>
<rect class="box" x="26" y="30" width="112" height="40" rx="7"/><text class="n" x="36" y="48">支付运营端</text><text class="t" x="36" y="62">运营会话 · pay:*</text>
<rect class="box" x="146" y="30" width="112" height="40" rx="7"/><text class="n" x="156" y="48">第三方</text><text class="t" x="156" y="62">AppId + 密钥签名</text>
<rect class="box" x="266" y="30" width="112" height="40" rx="7"/><text class="n" x="276" y="48">刷卡机</text><text class="t" x="276" y="62">设备密钥</text>
<rect class="box" x="386" y="30" width="112" height="40" rx="7"/><text class="n" x="396" y="48">商家端</text><text class="t" x="396" y="62">商家会话</text>
<rect class="box" x="506" y="30" width="112" height="40" rx="7"/><text class="n" x="516" y="48">扫码 H5</text><text class="t" x="516" y="62">收银令牌</text>
<rect class="box" x="626" y="30" width="112" height="40" rx="7"/><text class="n" x="636" y="48">内部系统</text><text class="t" x="636" y="62">服务凭据</text>
<rect class="box" x="746" y="30" width="108" height="40" rx="7"/><text class="n" x="756" y="48">渠道</text><text class="t" x="756" y="62">异步通知</text>
<line class="band" x1="26" y1="80" x2="854" y2="80"/>

<text class="b" x="26" y="98">② 接入层</text>
<rect class="new" x="26" y="106" width="592" height="48" rx="7"/>
<text class="n" x="38" y="125">pay-portal（支付系统的接入层模块，新）</text>
<text class="t" x="38" y="142">/pay-ops/v1 · /open/pay/v1 · /terminal/pay/v1 · /biz/pay · /checkout/v1 — 鉴权 · 判权 · 限流 · 幂等 · 审计</text>
<rect class="old" x="626" y="106" width="112" height="48" rx="7"/><text class="n" x="636" y="125">pay-svc</text><text class="t" x="636" y="142">/internal/pay/v1</text>
<rect class="key" x="746" y="106" width="108" height="48" rx="7"/><text class="n" x="756" y="125">统一回调</text><text class="t" x="756" y="142">/pay/callback/…</text>
<path class="ar" d="M322 70 V100" marker-end="url(#ar)"/>
<path class="ar" d="M682 70 V100" marker-end="url(#ar)"/>
<path class="ar" d="M800 70 V100" marker-end="url(#ar)"/>
<line class="band" x1="26" y1="164" x2="854" y2="164"/>

<text class="b" x="26" y="182">③ 应用层 —— 内外同一套</text>
<rect class="new" x="26" y="190" width="828" height="40" rx="7"/>
<text class="n" x="38" y="208">PaymentService · RefundService · OnboardingService · PayMerchantService · CheckoutService · PayOpsQueryService</text>
<text class="t" x="38" y="222">CallerPolicy 能力矩阵 · 结果唯一入口 PaymentOutcomeService / RefundOutcomeService / OnboardingOutcomeService</text>
<path class="ar" d="M322 154 V184" marker-end="url(#ar)"/>
<path class="ar" d="M682 154 V184" marker-end="url(#ar)"/>
<path class="ar" d="M800 154 V184" marker-end="url(#ar)"/>
<line class="band" x1="26" y1="240" x2="854" y2="240"/>

<text class="b" x="26" y="258">④ 领域核心（pay-domain，无面向人的 controller）</text>
<rect class="key" x="26" y="266" width="200" height="74" rx="7"/><text class="n" x="38" y="284">进件与收款商户</text><text class="t" x="38" y="299">进件单（多版本）→ 收款商户</text><text class="t" x="38" y="313">门店 × 渠道绑定 · 凭据 · 产品</text><text class="t" x="38" y="327">PayMerchantQueryPort 唯一解析口</text>
<rect class="key" x="236" y="266" width="200" height="74" rx="7"/><text class="n" x="248" y="284">支付单 · 交易 · 退款</text><text class="t" x="248" y="299">pay_order → stl_payment 尝试</text><text class="t" x="248" y="313">路由快照冻结 · 关单 · 关单后支付</text><text class="t" x="248" y="327">退款唯一执行路径 + 复核</text>
<rect class="new" x="446" y="266" width="200" height="74" rx="7"/><text class="n" x="458" y="284">流水 · 资金路径</text><text class="t" x="458" y="299">复式、只增不改</text><text class="t" x="458" y="313">FundsPathStrategy</text><text class="t" x="458" y="327">DIRECT / AGGREGATED</text>
<rect class="old" x="656" y="266" width="198" height="74" rx="7"/><text class="n" x="668" y="284">对账 · 结算 · 其他</text><text class="t" x="668" y="299">渠道对账单 · 资金 · 终端日结</text><text class="t" x="668" y="313">核对结算 / 出款结算</text><text class="t" x="668" y="327">审批 · 终端 · 接入方</text>
<line class="band" x1="26" y1="350" x2="854" y2="350"/>

<text class="b" x="26" y="368">⑤ 渠道层（pay-channel）</text>
<rect class="new" x="26" y="376" width="200" height="74" rx="7"/><text class="n" x="38" y="394">账户上下文</text><text class="t" x="38" y="409">ChannelContextFactory</text><text class="t" x="38" y="423">← 冻结路由 + 凭据保险库</text><text class="t" x="38" y="437">网关无状态、不持密钥</text>
<rect class="new" x="236" y="376" width="300" height="74" rx="7"/><text class="n" x="248" y="394">按支付类型拆的能力接口</text><text class="t" x="248" y="409">线上 Online · 线下 Offline · 刷卡 Card</text><text class="t" x="248" y="423">交易 · 进件 · 对账单 · 出款 · CN 分账</text><text class="t" x="248" y="437">返回带类型的 PayInstruction</text>
<rect class="key" x="546" y="376" width="308" height="74" rx="7"/><text class="n" x="558" y="394">RecordingChannelClient（记录型 HTTP 客户端）</text><text class="t" x="558" y="409">每次调用落请求 / 响应 / 状态码 / 耗时 / 单号</text><text class="t" x="558" y="423">网关只能注入它，无法绕过</text><text class="t" x="558" y="437">蓝新 · LINE Pay · PayBy · 微信 · 支付宝</text>
<path class="ar" d="M226 413 H230" marker-end="url(#ar)"/>
<path class="ar" d="M536 413 H540" marker-end="url(#ar)"/>
<line class="band" x1="26" y1="460" x2="854" y2="460"/>

<text class="b" x="26" y="478">⑥ 支付库（pay_ / stl_ / sys_pay_ 前缀，阶段 2 整组迁出）</text>
<rect class="db" x="26" y="486" width="200" height="74" rx="7"/><text class="n" x="38" y="504">渠道与商户</text><text class="t" x="38" y="519">sys_market · sys_pay_channel*</text><text class="t" x="38" y="533">pay_channel_product</text><text class="t" x="38" y="547">pay_onboarding* · pay_merchant*</text>
<rect class="db" x="236" y="486" width="200" height="74" rx="7"/><text class="n" x="248" y="504">订单与流水</text><text class="t" x="248" y="519">pay_order · stl_payment</text><text class="t" x="248" y="533">pay_refund · pay_approval</text><text class="t" x="248" y="547">pay_ledger_entry</text>
<rect class="db" x="446" y="486" width="200" height="74" rx="7"/><text class="n" x="458" y="504">调用与回调记录</text><text class="t" x="458" y="519">pay_channel_call_log</text><text class="t" x="458" y="533">pay_callback_log</text><text class="t" x="458" y="547">pay_raw_payload（加密原文）</text>
<rect class="db" x="656" y="486" width="198" height="74" rx="7"/><text class="n" x="668" y="504">对账结算与接入</text><text class="t" x="668" y="519">stl_bill · stl_payout · 对账单</text><text class="t" x="668" y="533">pay_app* · pay_terminal*</text><text class="t" x="668" y="547">pay_fee_receivable</text>
<line class="band" x1="26" y1="570" x2="854" y2="570"/>

<text class="b" x="26" y="588">⑦ 核心系统（只经 Port 与事件交互，不互读表）</text>
<rect class="old" x="26" y="596" width="828" height="56" rx="7"/>
<text class="n" x="38" y="615">主体 mch_entity · 门店 mch_store · 业务订单 · 售后</text>
<text class="t" x="38" y="632">支付 → 核心：MerchantQueryPort（主体 / 门店资料，落快照）· 事件 PaymentSucceeded / RefundSucceeded / PaymentClosed</text>
<text class="t" x="38" y="646">核心 → 支付：PayMerchantQueryPort（能否收款、可用渠道与方式）· PaymentAppService（建支付单、发起退款）</text>

<text class="t" x="26" y="680">图例：</text>
<rect class="new" x="62" y="670" width="16" height="12" rx="3"/><text class="t" x="84" y="680">新增</text>
<rect class="key" x="118" y="670" width="16" height="12" rx="3"/><text class="t" x="140" y="680">核心约束</text>
<rect class="old" x="200" y="670" width="16" height="12" rx="3"/><text class="t" x="222" y="680">现有，改造</text>
<rect class="db" x="284" y="670" width="16" height="12" rx="3"/><text class="t" x="306" y="680">数据表</text>
</svg>
