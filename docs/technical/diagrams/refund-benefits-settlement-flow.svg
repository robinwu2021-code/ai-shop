<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2418" viewBox="0 0 1320 2418" role="img" aria-labelledby="title desc">
<title id="title">M1 全子单退款与消费者结清流程</title>
<desc id="desc">M1 全子单退款与消费者结清流程。每行是一条有向关系；同名框代表同一对象或状态，箭头上的文字表示分支条件。申请全子单退款 → 完整数量和金额合法？（校验）；完整数量和金额合法？ → 拒绝，保留原状态（否）；完整数量和金额合法？ → 商家审批或既有合法例外（是）；商家审批或既有合法例外 → 退货退款？（判定）；退货退款？ → WAIT_RETURN 等待寄回（是）；WAIT_RETURN 等待寄回 → RETURNING 等待商家收妥（寄回）；RETURNING 等待商家收妥 → REFUNDING 冻结原退款执行（收妥）；退货退款？ → 货物在途？（否）；货物在途？ → WAIT_RECEIPT 等待确认（是）；WAIT_RECEIPT 等待确认 → REFUNDING 冻结原退款执行（商家明确确认）；货物在途？ → REFUNDING 冻结原退款执行（否）；REFUNDING 冻结原退款执行 → 实际应退现金大于零？（判定）；实际应退现金大于零？ → 按原指令执行或查询现金退款（是）；按原指令执行或查询现金退款 → REFUNDING 冻结原退款执行（未知或失败）；按原指令执行或查询现金退款 → 持久化资金成功与业务退款账（核验成功）；实际应退现金大于零？ → 核验既有积分或零现金完成凭据（否）；核验既有积分或零现金完成凭据 → 持久化资金成功与业务退款账（核验完成）；持久化资金成功与业务退款账 → 同事务保存权益义务与独立库存任务（持久化）；同事务保存权益义务与独立库存任务 → 应退消费者权益已结清？（判定）；应退消费者权益已结清？ → 保持 REFUNDING，仅恢复原权益（否）；保持 REFUNDING，仅恢复原权益 → 应退消费者权益已结清？（重新核验）；应退消费者权益已结清？ → A13 REFUND_SUCCEEDED（是，非零现金）；应退消费者权益已结清？ → A22 BENEFITS_SETTLED（是，零现金）；A13 REFUND_SUCCEEDED → 售后 REFUNDED，重新判定子单终态（结清）；A22 BENEFITS_SETTLED → 售后 REFUNDED，重新判定子单终态（结清）；同事务保存权益义务与独立库存任务 → 独立库存恢复，不阻断消费者结清（独立任务）</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
