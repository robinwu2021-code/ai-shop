<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13">
  <title>网关层模块、三端权限库与微服务集成</title>
  <desc>上半部分：网关层五个模块。三个出口模块（C 端、B 端、运营端）各带自己的配置和自己的权限库，都依赖网关公共模块与权限模块；启动模块 shop-app 只负责装配。下半部分：一个微服务接入网关的三件套（契约、出口件、远程适配）加一段配置，网关侧由出站签名把进程凭据与签名上下文带给微服务，微服务侧由守卫验签后取得操作人、范围与功能点。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#0f172a">网关层：独立模块 · 三端独立配置与权限库 · 微服务集成</text>
  <text x="24" y="52" fill="#64748b">箭头 = 依赖或调用方向；圆柱 = 数据库；蓝 = 网关层新模块；粉 = 进程外服务</text>

  <!-- ===== upper: modules ===== -->
  <text x="24" y="82" font-weight="600" fill="#334155">一、模块与数据</text>

  <rect x="24" y="94" width="1072" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="40" y="119" fill="#334155">shop-app：只做启动与装配 —— 选哪几个出口、哪些业务模块与行业、哪些微服务</text>

  <g fill="#dbeafe" stroke="#3b82f6">
    <rect x="24" y="160" width="340" height="96" rx="6"/>
    <rect x="390" y="160" width="340" height="96" rx="6"/>
    <rect x="756" y="160" width="340" height="96" rx="6"/>
  </g>
  <g fill="#1e3a8a">
    <text x="40" y="184" font-weight="600">shop-gateway-mp　C 端出口</text>
    <text x="40" y="206" font-size="12">/mp 认证链 · C 端入口组合</text>
    <text x="40" y="226" font-size="12">配置 shop.gateway.mp.*</text>
    <text x="40" y="246" font-size="12">数据源 → C 端权限库</text>
    <text x="406" y="184" font-weight="600">shop-gateway-biz　B 端出口</text>
    <text x="406" y="206" font-size="12">/biz 认证链 · 门店上下文 · 功能矩阵</text>
    <text x="406" y="226" font-size="12">配置 shop.gateway.biz.*</text>
    <text x="406" y="246" font-size="12">数据源 → B 端权限库</text>
    <text x="772" y="184" font-weight="600">shop-gateway-ops　运营端出口</text>
    <text x="772" y="206" font-size="12">/ops 认证链 · 菜单 · 角色配置</text>
    <text x="772" y="226" font-size="12">配置 shop.gateway.ops.*</text>
    <text x="772" y="246" font-size="12">数据源 → 运营端权限库</text>
  </g>
  <g stroke="#475569" marker-end="url(#a)">
    <line x1="194" y1="134" x2="194" y2="158"/><line x1="560" y1="134" x2="560" y2="158"/><line x1="926" y1="134" x2="926" y2="158"/>
    <line x1="194" y1="256" x2="194" y2="280"/><line x1="560" y1="256" x2="560" y2="280"/><line x1="926" y1="256" x2="926" y2="280"/>
  </g>

  <g fill="#eff6ff" stroke="#3b82f6">
    <rect x="24" y="282" width="524" height="56" rx="6"/>
    <rect x="572" y="282" width="524" height="56" rx="6"/>
  </g>
  <g fill="#1e3a8a">
    <text x="40" y="305" font-weight="600">shop-gateway-core　网关公共</text>
    <text x="40" y="325" font-size="12">认证链骨架 · 统一鉴权 · 功能点登记聚合 · 集成登记 · 统一错误出口</text>
    <text x="588" y="305" font-weight="600">shop-gateway-iam　用户 · 角色 · 资源/菜单</text>
    <text x="588" y="325" font-size="12">三端同一套模型与代码，各用各的数据源；这些表只有它能读写</text>
  </g>

  <!-- dbs -->
  <g fill="#fef9c3" stroke="#ca8a04">
    <path d="M620,366 v34 a50,9 0 0 0 100,0 v-34 a50,9 0 0 0 -100,0 a50,9 0 0 0 100,0"/>
    <path d="M784,366 v34 a50,9 0 0 0 100,0 v-34 a50,9 0 0 0 -100,0 a50,9 0 0 0 100,0"/>
    <path d="M948,366 v34 a50,9 0 0 0 100,0 v-34 a50,9 0 0 0 -100,0 a50,9 0 0 0 100,0"/>
  </g>
  <g fill="#713f12" text-anchor="middle" font-size="12">
    <text x="670" y="394">C 端权限库</text>
    <text x="834" y="394">B 端权限库</text>
    <text x="998" y="394">运营端权限库</text>
  </g>
  <g stroke="#475569" marker-end="url(#a)">
    <line x1="670" y1="338" x2="670" y2="356"/><line x1="834" y1="338" x2="834" y2="356"/><line x1="998" y1="338" x2="998" y2="356"/>
  </g>
  <rect x="24" y="360" width="524" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="40" y="381" fill="#14532d" font-weight="600">业务各层与 shop-bridge（桥接下沉后的新模块）</text>
  <text x="40" y="400" fill="#14532d" font-size="12">业务库不再存放账号、角色、菜单；要用户信息走目录接口</text>
  <line x1="286" y1="338" x2="286" y2="358" stroke="#475569" marker-end="url(#a)"/>

  <!-- ===== lower: integration ===== -->
  <line x1="24" y1="436" x2="1096" y2="436" stroke="#e2e8f0"/>
  <text x="24" y="462" font-weight="600" fill="#334155">二、接入一个微服务：三件套 + 一段配置</text>

  <rect x="24" y="478" width="560" height="196" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="40" y="500" font-weight="600" fill="#1e3a8a">网关进程内</text>
  <g fill="#ffffff" stroke="#3b82f6">
    <rect x="40" y="512" width="160" height="62" rx="6"/>
    <rect x="224" y="512" width="160" height="62" rx="6"/>
    <rect x="408" y="512" width="160" height="62" rx="6"/>
  </g>
  <g fill="#1e3a8a">
    <text x="52" y="534" font-weight="600">出口件  svc-web</text>
    <text x="52" y="554" font-size="12">按端分包的入口</text>
    <text x="52" y="568" font-size="12">+ 功能点登记</text>
    <text x="236" y="534" font-weight="600">契约  svc-api</text>
    <text x="236" y="554" font-size="12">接口 · 数据结构</text>
    <text x="236" y="568" font-size="12">· 下游功能点码</text>
    <text x="420" y="534" font-weight="600">远程适配  svc-channel</text>
    <text x="420" y="554" font-size="12">契约的远程实现</text>
    <text x="420" y="568" font-size="12">用 svc-client 建客户端</text>
  </g>
  <g stroke="#475569" marker-end="url(#a)">
    <line x1="200" y1="543" x2="222" y2="543"/>
    <line x1="408" y1="543" x2="386" y2="543"/>
  </g>
  <rect x="40" y="590" width="528" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="52" y="612" fill="#1e3a8a">出站签名（svc-client 一处）：进程凭据 + 签名上下文</text>
  <text x="40" y="648" font-size="12" fill="#1e3a8a">配置：shop.services.targets.&lt;服务&gt;（地址、凭据、超时）</text>
  <text x="40" y="666" font-size="12" fill="#1e3a8a">　　　shop.gateway.integrations.&lt;服务&gt;（开关、同进程或远程）</text>

  <rect x="700" y="478" width="396" height="196" rx="8" fill="#fdf2f8" stroke="#be185d"/>
  <text x="716" y="500" font-weight="600" fill="#831843">微服务进程（支付 / 库存 / 工单 / appops …）</text>
  <rect x="716" y="512" width="364" height="62" rx="6" fill="#ffffff" stroke="#be185d"/>
  <text x="728" y="534" font-weight="600" fill="#831843">守卫  svc-guard</text>
  <text x="728" y="554" font-size="12" fill="#831843">验进程凭据与签名；不依赖 Spring Security</text>
  <text x="728" y="568" font-size="12" fill="#831843">给出操作人、主体与门店范围、功能点</text>
  <rect x="716" y="590" width="364" height="34" rx="6" fill="#fce7f3" stroke="#be185d"/>
  <text x="728" y="612" fill="#831843">/internal 入口 → 领域服务（不认终端令牌，不建角色表）</text>
  <line x1="898" y1="574" x2="898" y2="588" stroke="#475569" marker-end="url(#a)"/>

  <line x1="568" y1="607" x2="698" y2="543" stroke="#475569" marker-end="url(#a)"/>
  <text x="596" y="556" font-size="12" fill="#475569">HTTP</text>
  <text x="596" y="634" font-size="11" fill="#475569">上下文：操作人、范围、</text>
  <text x="596" y="650" font-size="11" fill="#475569">已判定的下游功能点</text>
</svg>
