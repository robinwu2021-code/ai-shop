<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>资源占用优化的四级台阶，以及单实例形态对 native 这一级的影响</title>
<desc>GraalVM 原生镜像不是一个开关而是一段路：先量基线，再调运行期参数，再上 Spring AOT（仍是 JVM），通过四条红线后才做 native。本项目实际只起一个进程同时装 api / ops / worker 三个面，这让 AOT 那一级更简单（只有一种 profile 组合、一份产物），却让 native 那一级更不划算：收益按实例数摊、成本按代码量算，而且没有灰度路径。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.l{font-size:9.5px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.unit{fill:#FBFCFD;stroke:#B9C2CE;stroke-width:1.6}
.key{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.warn{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.6}
.stop{fill:#FCF3F3;stroke:#D89A9A;stroke-width:1.6}
.infra{fill:#F5F6F8;stroke:#C6CDD8;stroke-width:1.2}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.axis{stroke:#C6CDD8;stroke-width:1.1;fill:none}
.zone{fill:none;stroke:#DDE2E9;stroke-width:1.2;stroke-dasharray:5 4}
.zt{font-size:10px;fill:#A6AEBB;letter-spacing:.1em}
.tag{font-size:9.5px;font-weight:600;fill:#5A6472}
</style></defs>

<!-- ① 四级台阶 -->
<text class="b" x="24" y="26">① 四级台阶 —— 每一级独立可交付、独立可回退。建议做到 ②，③④ 有条件才走</text>

<path class="axis" marker-end="url(#ar)" d="M18 300 L18 66"/>
<text class="zt" x="12" y="290" transform="rotate(-90 12 290)">资源收益 →</text>
<text class="zt" x="24" y="322">工作量 · 风险 →</text>
<path class="axis" marker-end="url(#ar)" d="M18 306 L940 306"/>

<!-- 阶段 0 -->
<rect class="box" x="34" y="222" width="172" height="76" rx="7"/>
<text class="n" x="48" y="244">⓪ 基线</text>
<text class="t" x="48" y="262">量清楚现在到底占多少</text>
<text class="t" x="48" y="278">RSS · 堆上限 · 启动 · GC</text>
<text class="tag" x="48" y="292">1 天 · 无风险</text>

<!-- 阶段 1 -->
<rect class="key" x="218" y="182" width="172" height="76" rx="7"/>
<text class="n" x="232" y="204">① 堆上限（保 G1）</text>
<text class="t" x="232" y="222">别再用「机器的 25%」当上限</text>
<text class="t" x="232" y="238">定时任务同进程，不能换 SerialGC</text>
<text class="tag" x="232" y="252">1 天 · 近零风险 · 先拿</text>

<!-- 阶段 2 -->
<rect class="key" x="402" y="142" width="172" height="76" rx="7"/>
<text class="n" x="416" y="164">② Spring AOT + CDS ✅</text>
<text class="t" x="416" y="182">仍然是 JVM，可一键关掉</text>
<text class="t" x="416" y="198">启动即停机窗口，砍它最直接</text>
<text class="tag" x="416" y="212">3–5 天 · 低风险 · 建议停在这里</text>

<!-- 阶段 3：闸门 -->
<rect class="warn" x="586" y="102" width="172" height="76" rx="7"/>
<text class="n" x="600" y="124">③ native spike ⛔</text>
<text class="t" x="600" y="142">四条红线判据，全绿才继续</text>
<text class="t" x="600" y="158">不绿就停在 ②，不硬推</text>
<text class="tag" x="600" y="172">3–5 天 · 闸门</text>

<!-- 阶段 4 -->
<rect class="stop" x="770" y="62" width="172" height="76" rx="7"/>
<text class="n" x="784" y="84">④ native 产物 ⚠️</text>
<text class="t" x="784" y="102">唯一实例 · 一次性全量切换</text>
<text class="t" x="784" y="118">没有灰度路径，回滚即全站</text>
<text class="tag" x="784" y="132">2–4 周 · 高 · 暂列观察项</text>

<path class="ar" marker-end="url(#ar)" d="M206 254 L218 240"/>
<path class="ar" marker-end="url(#ar)" d="M390 214 L402 200"/>
<path class="ar" marker-end="url(#ar)" d="M574 174 L586 160"/>
<path class="ar" marker-end="url(#ar)" d="M758 134 L770 120"/>

<!-- ② 单实例改变了什么 -->
<text class="b" x="24" y="356">② 「一个进程装全部三个面」改变了什么 —— 一处变好，两处变坏</text>

<rect class="zone" x="24" y="368" width="918" height="128" rx="8"/>

<rect class="key" x="44" y="386" width="286" height="92" rx="7"/>
<text class="n" x="58" y="408">✅ AOT 那一级反而更简单</text>
<text class="t" x="58" y="426">profile 组合只有一种，产物只有一份</text>
<text class="t" x="58" y="442">不用为三份部署各构建各验证一次</text>
<text class="tag" x="58" y="464">构建时间与构建机内存 ÷3</text>

<rect class="warn" x="346" y="386" width="286" height="92" rx="7"/>
<text class="n" x="360" y="408">⚠️ 收益 ÷N，成本不变</text>
<text class="t" x="360" y="426">成本按代码量算：548 处 lambdaQuery</text>
<text class="t" x="360" y="442">+ 105 个实体 + 跟着 MP 升级重验</text>
<text class="tag" x="360" y="464">收益按实例数摊 —— 只剩一个 JVM 可省</text>

<rect class="stop" x="648" y="386" width="274" height="92" rx="7"/>
<text class="n" x="662" y="408">⚠️ 没有灰度路径了</text>
<text class="t" x="662" y="426">原本可以 worker → ops → api 逐份验</text>
<text class="t" x="662" y="442">现在唯一实例，切换即全站切换</text>
<text class="tag" x="662" y="464">出问题的回滚代价 = 整站回滚</text>

<!-- ③ 四条红线 -->
<text class="b" x="24" y="530">③ 阶段 ③ 的四条红线 —— 任何一条不过，native 计划就停在阶段 ②</text>

<rect class="box" x="24" y="542" width="218" height="58" rx="7"/>
<text class="n" x="38" y="562">R1 · lambda 条件</text>
<text class="t" x="38" y="580">548 处 lambdaQuery 要能解出</text>
<text class="t" x="38" y="594">列名，且过滤条件不能少</text>

<rect class="box" x="254" y="542" width="218" height="58" rx="7"/>
<text class="n" x="268" y="562">R2 · 实体反射</text>
<text class="t" x="268" y="580">105 个实体抽样 CRUD，结果</text>
<text class="t" x="268" y="594">与 JVM 版逐字段一致</text>

<rect class="box" x="484" y="542" width="218" height="58" rx="7"/>
<text class="n" x="498" y="562">R3 · Flyway 迁移</text>
<text class="t" x="498" y="580">native 下能跑通，或明确改由</text>
<text class="t" x="498" y="594">独立任务执行</text>

<rect class="box" x="714" y="542" width="218" height="58" rx="7"/>
<text class="n" x="728" y="562">R4 · Ehcache 会话</text>
<text class="t" x="728" y="580">单实例靠它「重启不掉线」，</text>
<text class="t" x="728" y="594">而它同样零原生元数据</text>
</svg>
