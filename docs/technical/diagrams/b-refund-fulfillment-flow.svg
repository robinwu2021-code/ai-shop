<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
  <title id="title">B 端退款与履约信息流</title>
  <desc id="desc">买家申请进入售后状态机，分发商家待办和消息；商家审核按物流阶段驱动退款；履约方式变更经后端校验后同步订单与两端展示。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53657f"/></marker>
    <style>.box{fill:#f5f8ff;stroke:#8093b1;stroke-width:1.5;rx:9}.warm{fill:#fff4e8;stroke:#d79857}.green{fill:#ecf8f2;stroke:#6baf8e}.line{fill:none;stroke:#53657f;stroke-width:2;marker-end:url(#arrow)}.label{font:16px sans-serif;fill:#1d3049;text-anchor:middle}.small{font:13px sans-serif;fill:#495b70;text-anchor:middle}</style>
  </defs>
  <rect class="box" x="20" y="35" width="150" height="70"/><text class="label" x="95" y="65">C 端退款申请</text><text class="small" x="95" y="88">申请类型与原因</text>
  <rect class="box" x="225" y="35" width="170" height="70"/><text class="label" x="310" y="65">售后状态机</text><text class="small" x="310" y="88">货物与资金分开判断</text>
  <rect class="box warm" x="455" y="35" width="170" height="70"/><text class="label" x="540" y="65">B 端待办与消息</text><text class="small" x="540" y="88">直接定位售后单</text>
  <rect class="box green" x="690" y="35" width="170" height="70"/><text class="label" x="775" y="65">商家审核</text><text class="small" x="775" y="88">按物流阶段处置</text>
  <path class="line" d="M170 70 H224"/><path class="line" d="M395 70 H454"/><path class="line" d="M625 70 H689"/>
  <rect class="box green" x="455" y="145" width="170" height="70"/><text class="label" x="540" y="175">退款执行与回执</text><text class="small" x="540" y="198">成功后才标已退款</text>
  <path class="line" d="M775 105 V128 H540 V144"/>
  <rect class="box" x="20" y="250" width="190" height="60"/><text class="label" x="115" y="278">B 端履约方式变更</text><text class="small" x="115" y="299">自送 / 快递 / 运单</text>
  <rect class="box" x="310" y="250" width="220" height="60"/><text class="label" x="420" y="278">后端资格与费用校验</text><text class="small" x="420" y="299">订单事实、版本和留痕</text>
  <rect class="box" x="630" y="250" width="230" height="60"/><text class="label" x="745" y="278">B/C 展示与物流绑定</text><text class="small" x="745" y="299">旧运单回调不可覆盖</text>
  <path class="line" d="M210 280 H309"/><path class="line" d="M530 280 H629"/>
</svg>
