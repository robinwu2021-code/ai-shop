<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>产品架构：角色 · 端 · 能力 · 支撑</title>
<desc>四层。角色决定看到什么，端决定能做多少，能力按域划分，支撑层是三端共用的底座。增值服务与增长是本轮新增。</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.5" stroke-linecap="round"/></marker>
<style>
.h{font-size:11px;fill:#8A94A2;letter-spacing:.14em}
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.s{font-size:10.5px;fill:#5A6472}
.t{font-size:10px;fill:#5A6472}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2;rx:7}
.role{fill:#F4F6F9;stroke:#C3CBD6;stroke-width:1.2;rx:13}
.new{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.3}
.core{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.base{fill:#F7F8FA;stroke:#D8DEE6;stroke-width:1.2;rx:7}
.ar{stroke:#8A94A2;stroke-width:1.2;fill:none}
.sep{stroke:#EDEFF2;stroke-width:1}
</style></defs>

<text class="h" x="24" y="26">① 角色 —— 决定看到什么</text>
<rect class="role" x="24" y="34" width="104" height="30"/><text class="n" x="42" y="54">消费者</text>
<rect class="role" x="146" y="34" width="86" height="30"/><text class="n" x="164" y="54">老板</text>
<rect class="role" x="250" y="34" width="86" height="30"/><text class="n" x="268" y="54">店长</text>
<rect class="role" x="354" y="34" width="86" height="30"/><text class="n" x="372" y="54">店员</text>
<rect class="role" x="458" y="34" width="104" height="30"/><text class="n" x="476" y="54">平台运营</text>
<text class="t" x="580" y="47">老板/店长/店员 = 同一套员工体系</text>
<text class="t" x="580" y="60">权限随「当前门店」变</text>

<line class="sep" x1="24" y1="82" x2="796" y2="82"/>

<text class="h" x="24" y="104">② 端 —— 决定能做多少</text>
<rect class="box" x="24" y="112" width="176" height="46"/>
<text class="n" x="36" y="131">C 端</text><text class="s" x="36" y="147">小程序 · App · H5</text>
<rect class="box" x="216" y="112" width="230" height="46"/>
<text class="n" x="228" y="131">B 端</text>
<text class="s" x="228" y="147">小程序＝单商户 · App＝多商户可切</text>
<rect class="box" x="462" y="112" width="150" height="46"/>
<text class="n" x="474" y="131">平台端</text><text class="s" x="474" y="147">Web 后台</text>
<rect class="base" x="628" y="112" width="168" height="46"/>
<text class="n" x="640" y="131">后端不按端分叉</text>
<text class="t" x="640" y="147">接口一律给全，端上决定展示</text>

<line class="sep" x1="24" y1="176" x2="796" y2="176"/>

<text class="h" x="24" y="198">③ 业务能力 —— 按域划分</text>

<rect class="box" x="24" y="206" width="176" height="86"/>
<text class="n" x="36" y="225">交易与履约</text>
<text class="t" x="36" y="242">逛货 · 下单 · 支付</text>
<text class="t" x="36" y="257">自提 · 配送 · 核销</text>
<text class="t" x="36" y="272">售后 · 评价</text>
<text class="t" x="36" y="287">团购 · 求团 · 报价</text>

<rect class="box core" x="216" y="206" width="176" height="86"/>
<text class="n" x="228" y="225">商家经营</text>
<text class="t" x="228" y="242">入驻 · 进件 · 结算</text>
<text class="t" x="228" y="257">商品 · 库存 · 选品</text>
<text class="t" x="228" y="272">订单 · 履约台</text>
<text class="t" x="228" y="287">营销 · 券 · 积分</text>

<rect class="box new" x="408" y="206" width="176" height="86"/>
<text class="n" x="420" y="225">增值服务（新）</text>
<text class="t" x="420" y="242">多门店 · 门店切换</text>
<text class="t" x="420" y="257">子账号 · 逐店角色</text>
<text class="t" x="420" y="272">跨店总览与对比</text>
<text class="t" x="420" y="287">Plan：试用/降级/额度</text>

<rect class="box new" x="600" y="206" width="196" height="86"/>
<text class="n" x="612" y="225">增长（新）</text>
<text class="t" x="612" y="242">分享 → 记录 → 曝光位</text>
<text class="t" x="612" y="257">「我常逛的店」动态流</text>
<text class="t" x="612" y="272">归因 · 客流分档费率</text>
<text class="t" x="612" y="287">开城：入驻驱动</text>

<rect class="box" x="24" y="304" width="368" height="42"/>
<text class="n" x="36" y="322">平台治理</text>
<text class="t" x="36" y="338">商家审核 · 商品审核 · 工单 · 风控 · 审计留痕 · 主数据维护</text>
<rect class="box" x="408" y="304" width="388" height="42"/>
<text class="n" x="420" y="322">运营与商业化</text>
<text class="t" x="420" y="338">行业准入 · Plan 档位 · 到期降级看板 · 曝光位干预 · 升档信号识别</text>

<line class="sep" x1="24" y1="366" x2="796" y2="366"/>

<text class="h" x="24" y="388">④ 平台支撑 —— 三端共用的底座</text>

<rect class="base" x="24" y="396" width="182" height="72"/>
<text class="n" x="36" y="415">主数据</text>
<text class="t" x="36" y="432">行业 · 主体类型 · 支付渠道</text>
<text class="t" x="36" y="447">表管能力，类型管取值</text>
<text class="t" x="36" y="462">GET /common/master-data</text>

<rect class="base" x="222" y="396" width="182" height="72"/>
<text class="n" x="234" y="415">身份与作用域</text>
<text class="t" x="234" y="432">账号池：C 端 / 员工 / 运营</text>
<text class="t" x="234" y="447">三级：主体 → 门店 → 当前店</text>
<text class="t" x="234" y="462">越权防线第一道</text>

<rect class="base" x="420" y="396" width="182" height="72"/>
<text class="n" x="432" y="415">支付与资金</text>
<text class="t" x="432" y="432">进件 · 分账 · 补差 · 退款</text>
<text class="t" x="432" y="447">通道能力表驱动</text>
<text class="t" x="432" y="462">ADR-002</text>

<rect class="base" x="618" y="396" width="178" height="72"/>
<text class="n" x="630" y="415">区域与可达性</text>
<text class="t" x="630" y="432">社区 · 片区 · 城市</text>
<text class="t" x="630" y="447">四形态服务范围</text>
<text class="t" x="630" y="462">ADR-009（待修订）</text>

<rect class="base" x="24" y="482" width="772" height="52"/>
<text class="n" x="36" y="501">贯穿全局的三条原则</text>
<text class="t" x="36" y="519">钱与信用挂主体 · 货与人挂门店 · 权益边界是主体（门店可收窄）　|　零佣金对所有 Plan 一视同仁　|　降级降能力不降生意（未完成的单照常核销）</text>

<path class="ar" d="M76 64 L76 112" marker-end="url(#pa)"/>
<path class="ar" d="M290 64 L300 112" marker-end="url(#pa)"/>
<path class="ar" d="M510 64 L520 112" marker-end="url(#pa)"/>
<path class="ar" d="M112 158 L112 206" marker-end="url(#pa)"/>
<path class="ar" d="M320 158 L304 206" marker-end="url(#pa)"/>
<path class="ar" d="M360 158 L470 206" marker-end="url(#pa)"/>
<path class="ar" d="M537 158 L680 206" marker-end="url(#pa)"/>
</svg>
