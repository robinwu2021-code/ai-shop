<svg viewBox="0 0 960 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="零售即基础订单流本体：下单、支付、履约、完成、结算，售后为独立状态机"><rect width="960" height="258" fill="#FFFFFF"/><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D3040"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8342B"/></marker><marker id="a-jade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#256C5C"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55636F"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><text x="40" y="36" text-anchor="start" font-size="13" fill="#1D3040">零售 = 基础订单流 + ∅（工作流缺席，基础流独立完整）</text><rect x="40" y="70" width="150" height="48" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="115.0" y="98.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">下单 place</text><text x="115.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">WAIT_PAY</text><text x="115" y="148" text-anchor="middle" font-size="10.5" fill="#55636F">收银台: WAIT_OFFLINE_PAY</text><rect x="225" y="70" width="150" height="48" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="300.0" y="98.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">支付 markPaid</text><text x="300.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">PAID</text><text x="300" y="148" text-anchor="middle" font-size="10.5" fill="#55636F">ord_payment 可多笔(MIXED)</text><rect x="410" y="70" width="150" height="48" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="485.0" y="98.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">履约</text><text x="485.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">自提/快递/自送/核销</text><text x="485" y="148" text-anchor="middle" font-size="10.5" fill="#55636F">SERVICE_LIKE 直落 FULFILLING</text><rect x="595" y="70" width="150" height="48" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="670.0" y="98.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">完成</text><text x="670.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">COMPLETED</text><rect x="780" y="70" width="150" height="48" rx="6" fill="#1D3040" stroke="#1D3040" stroke-width="1.4"/><text x="855.0" y="98.5" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">结算</text><text x="855.0" y="133" text-anchor="middle" font-size="10.5" fill="#55636F">对账 / 分账</text><line x1="192" y1="94" x2="223" y2="94" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="377" y1="94" x2="408" y2="94" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="562" y1="94" x2="593" y2="94" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><line x1="747" y1="94" x2="778" y2="94" stroke="#1D3040" stroke-width="1.5" marker-end="url(#a-ink)"/><rect x="320" y="190" width="330" height="44" rx="6" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="1.4"/><text x="485.0" y="208.5" text-anchor="middle" font-size="13" fill="#1D3040" font-weight="600">售后 · 独立状态机</text><text x="485.0" y="224.5" text-anchor="middle" font-size="10.5" fill="#55636F">APPLIED→REFUNDING→…→ARBITRATING</text><line x1="300" y1="120" x2="410" y2="188" stroke="#55636F" stroke-width="1.5" marker-end="url(#a-gray)"/><text x="255" y="182" text-anchor="end" font-size="10.5" fill="#55636F">申请退款（按商品售后策略分流）</text><line x1="655" y1="120" x2="600" y2="188" stroke="#55636F" stroke-width="1.5" marker-end="url(#a-gray)"/></g></svg>