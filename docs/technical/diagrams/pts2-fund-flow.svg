<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分与资金流转</title>
<desc>上半部分是积分流转：平台发放户发放到 C 端户，C 端用积分支付时转到门店户，门店户兑付后转到平台接收户，补充资金时接收户的分流转回发放户；到期的分从 C 端户直接回接收户。随单结算时积分在门店户不停留。下半部分是平台积分专户的四格：未分配对应发放户，已承诺对应 C 端户与门店户，待付商家是已兑付未付款，待追回是已付款应收回。真钱只在补充时进入，在付给商家、到期转收入、提取时离开。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.da{stroke:#8A94A2;stroke-width:1.2;fill:none;stroke-dasharray:4 3}</style></defs>
<rect width="800" height="520" fill="#FFFFFF"/>

<text class="g" x="16" y="24">积分流转（以积分计 · 每笔转出 = 转入）</text>

<rect x="16" y="56" width="150" height="64" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="91" y="82" text-anchor="middle">平台发放户</text>
<text class="s" x="91" y="100" text-anchor="middle">可发 · 扣不动即停发</text>
<rect x="226" y="56" width="150" height="64" rx="6" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="301" y="82" text-anchor="middle">C 端户</text>
<text class="s" x="301" y="100" text-anchor="middle">待生效 · 可用 · 占用</text>
<rect x="436" y="56" width="150" height="64" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="511" y="82" text-anchor="middle">门店户</text>
<text class="s" x="511" y="100" text-anchor="middle">待确认 · 待结算</text>
<rect x="634" y="56" width="150" height="64" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="709" y="82" text-anchor="middle">平台接收户</text>
<text class="s" x="709" y="100" text-anchor="middle">兑付回收 · 到期回收</text>

<path class="ar" d="M166 88 L224 88" marker-end="url(#a)"/>
<text class="l" x="195" y="80" text-anchor="middle">发放</text>
<path class="ar" d="M376 88 L434 88" marker-end="url(#a)"/>
<text class="l" x="405" y="80" text-anchor="middle">积分支付</text>
<path class="ar" d="M586 88 L632 88" marker-end="url(#a)"/>
<text class="l" x="609" y="80" text-anchor="middle">兑付</text>
<path class="da" d="M301 120 C 301 150, 709 150, 709 122" marker-end="url(#a)"/>
<text class="l" x="505" y="152" text-anchor="middle">到期</text>
<path class="ar" d="M709 56 C 709 30, 91 30, 91 54" marker-end="url(#a)"/>
<text class="l" x="400" y="38" text-anchor="middle">补充时流转（必须同时进等额的钱）</text>

<rect x="436" y="170" width="348" height="48" rx="6" fill="#FFFFFF" stroke="#E3E7EC"/>
<text class="s" x="448" y="190">随单结算（默认）：支付时 C 端 → 门店 → 接收户一步完成</text>
<text class="s" x="448" y="208">定期结算：停在门店户，积分账期出单、B 端确认后转接收户</text>

<line x1="16" y1="240" x2="784" y2="240" stroke="#E3E7EC"/>
<text class="g" x="16" y="264">平台积分专户（钱 · 平台账户内专项）</text>

<rect x="16" y="282" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="91" y="308" text-anchor="middle">U 未分配</text>
<text class="s" x="91" y="326" text-anchor="middle">== m(发放户)</text>
<rect x="226" y="282" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#B49CCB"/>
<text class="n" x="301" y="308" text-anchor="middle">C 已承诺</text>
<text class="s" x="301" y="326" text-anchor="middle">C + R == m(C 端 + 门店)</text>
<rect x="436" y="282" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#C8A86B"/>
<text class="n" x="511" y="308" text-anchor="middle">D 待付商家</text>
<text class="s" x="511" y="326" text-anchor="middle">已兑付、未付款</text>
<rect x="226" y="380" width="150" height="56" rx="6" fill="#FFFFFF" stroke="#D08C8C"/>
<text class="n" x="301" y="404" text-anchor="middle">R 待追回</text>
<text class="s" x="301" y="422" text-anchor="middle">已付款、应收回未收回</text>

<path class="ar" d="M166 310 L224 310" marker-end="url(#a)"/>
<text class="l" x="195" y="302" text-anchor="middle">发放</text>
<path class="ar" d="M224 334 L168 334" marker-end="url(#a)"/>
<text class="l" x="195" y="350" text-anchor="middle">收回</text>
<path class="ar" d="M376 316 L434 316" marker-end="url(#a)"/>
<text class="l" x="405" y="308" text-anchor="middle">兑付</text>
<path class="da" d="M301 352 L301 378"/>

<rect x="634" y="282" width="150" height="40" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="709" y="306" text-anchor="middle">商家</text>
<rect x="634" y="348" width="150" height="40" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="709" y="372" text-anchor="middle">平台收入</text>
<rect x="16" y="380" width="150" height="56" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="91" y="404" text-anchor="middle">平台账户</text>
<text class="s" x="91" y="422" text-anchor="middle">佣金收入</text>

<path class="ar" d="M586 302 L632 302" marker-end="url(#a)"/>
<text class="l" x="609" y="294" text-anchor="middle">付款</text>
<path class="ar" d="M350 352 L350 368 L632 368" marker-end="url(#a)"/>
<text class="l" x="500" y="384" text-anchor="middle">到期（转平台收入）</text>
<path class="ar" d="M70 380 L70 354" marker-end="url(#a)"/>
<text class="l" x="58" y="370" text-anchor="end">补充</text>
<path class="ar" d="M112 354 L112 378" marker-end="url(#a)"/>
<text class="l" x="122" y="370">提取</text>

<text class="s" x="16" y="470">真钱进专户只有「补充」（退款收回、追回是把出去的钱收回来）；离开专户只有付给商家、到期转收入、提取。</text>
<text class="s" x="16" y="490">付给商家：随单结算在分账时逐单补差（直连）或回补平台货款（归集）；定期结算按门店积分结算单打款。</text>
<text class="s" x="16" y="510">外部对账每日校验：平台账户实际余额 ≥ U + C + D。</text>
</svg>
