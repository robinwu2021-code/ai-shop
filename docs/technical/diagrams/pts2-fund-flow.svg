<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分资金流（平台出资预存池）</title>
<desc>平台账户经补充进入积分池的未分配格；发放时未分配挪到已承诺；已承诺在兑付时付给收单商家（直连补差）或回补平台经营账户（归集），到期时转平台收入；退款收回时已承诺回到未分配；补差回退失败记入待追回。已承诺加待追回恒等于用户三格积分折算的金额。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.da{stroke:#8A94A2;stroke-width:1.2;fill:none;stroke-dasharray:4 3}</style></defs>
<rect width="760" height="430" fill="#FFFFFF"/>

<text class="g" x="16" y="26">资金来源</text>
<text class="g" x="232" y="26">积分池（平台账户内专项 · 每个积分种类一个）</text>
<text class="g" x="600" y="26">资金去向</text>

<!-- 平台账户 -->
<rect x="16" y="138" width="150" height="64" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="91" y="164" text-anchor="middle">平台账户</text>
<text class="s" x="91" y="182" text-anchor="middle">佣金收入</text>

<!-- 池子框 -->
<rect x="226" y="40" width="322" height="236" rx="10" fill="#F7F9FB" stroke="#C9D1DB"/>
<rect x="245" y="72" width="110" height="92" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="300" y="104" text-anchor="middle">U 未分配</text>
<text class="s" x="300" y="124" text-anchor="middle">补进来、未承诺</text>
<text class="s" x="300" y="140" text-anchor="middle">≥ 0，不够即停发</text>
<rect x="420" y="72" width="110" height="92" rx="6" fill="#FFFFFF" stroke="#C8A86B"/>
<text class="n" x="475" y="104" text-anchor="middle">C 已承诺</text>
<text class="s" x="475" y="124" text-anchor="middle">已发积分对应的钱</text>
<text class="s" x="475" y="140" text-anchor="middle">（含待生效）</text>
<rect x="420" y="196" width="110" height="60" rx="6" fill="#FFFFFF" stroke="#D08C8C"/>
<text class="n" x="475" y="222" text-anchor="middle">R 待追回</text>
<text class="s" x="475" y="240" text-anchor="middle">补差回退失败</text>

<!-- 平台账户 ↔ U -->
<path class="ar" d="M166 156 L243 104" marker-end="url(#a)"/>
<text class="l" x="182" y="118">补充 TOPUP</text>
<path class="ar" d="M245 140 L168 186" marker-end="url(#a)"/>
<text class="l" x="176" y="214">提取 WITHDRAW</text>

<!-- U ↔ C -->
<path class="ar" d="M355 98 L418 98" marker-end="url(#a)"/>
<text class="l" x="387" y="90" text-anchor="middle">发放</text>
<path class="ar" d="M420 140 L357 140" marker-end="url(#a)"/>
<text class="l" x="387" y="156" text-anchor="middle">收回</text>

<!-- 去向 -->
<rect x="600" y="48" width="150" height="56" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="675" y="72" text-anchor="middle">平台收入</text>
<text class="s" x="675" y="90" text-anchor="middle">到期，按日划拨</text>
<rect x="600" y="124" width="150" height="56" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="675" y="148" text-anchor="middle">平台经营账户</text>
<text class="s" x="675" y="166" text-anchor="middle">归集：补少收的货款</text>
<rect x="600" y="200" width="150" height="56" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="675" y="224" text-anchor="middle">收单商家</text>
<text class="s" x="675" y="242" text-anchor="middle">直连：分账前补差</text>

<path class="ar" d="M530 86 L598 76" marker-end="url(#a)"/>
<text class="l" x="564" y="70" text-anchor="middle">到期</text>
<path class="ar" d="M530 118 L598 148" marker-end="url(#a)"/>
<text class="l" x="566" y="124" text-anchor="middle">兑付</text>
<path class="ar" d="M530 152 L598 214" marker-end="url(#a)"/>
<text class="l" x="556" y="190" text-anchor="middle">兑付</text>
<path class="da" d="M600 240 L532 230" marker-end="url(#a)"/>
<text class="l" x="566" y="262" text-anchor="middle">回退失败</text>

<!-- 用户账户 -->
<rect x="226" y="330" width="322" height="70" rx="8" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="387" y="356" text-anchor="middle">用户积分账户（用户 × 种类）</text>
<text class="s" x="387" y="378" text-anchor="middle">P 待生效 · A 可用 · H 占用 —— 三格之间挪动不碰池子</text>
<path class="da" d="M475 256 L475 328"/>
<text class="l" x="486" y="300">C + R == m(P + A + H)</text>
<text class="s" x="16" y="416">新钱进池只有「补充」；离池只有兑付、到期、提取。外部对账每日校验：平台账户余额 ≥ U + C + 其他待付。</text>
</svg>
