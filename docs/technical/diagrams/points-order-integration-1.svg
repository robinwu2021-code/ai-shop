<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1635" viewBox="0 0 1000 1635" role="img" font-family="system-ui,-apple-system,PingFang SC,sans-serif"><title>积分流程</title><desc>按箭头追踪门店参与、原资金及售后责任；回边表示恢复或重新接线，不创建新的资金请求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#8295a7"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M500 93 V140" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 198 V245" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 303 V350" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 408 V455" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 513 V560" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 618 V665" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 723 V770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 167 H940 V902 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 914 H78 V809 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 785 H904 V50 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 482 H114 V1007 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 1019 H868 V1019 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1038 V1085" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 1007 H832 V1217 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1248 V1295" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M500 1353 V1400" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 1322 H96 V1532 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 1544 H886 V1019 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M230 1415 H132 V785 H230" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M770 1112 H850 V797 H770" fill="none" stroke="#8295a7" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="230" y="35" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="69" text-anchor="middle" font-size="15" fill="#161a21">A 门店默认 DETACHED</text><rect x="230" y="140" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="174" text-anchor="middle" font-size="15" fill="#161a21">B ACTIVE</text><rect x="230" y="245" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="279" text-anchor="middle" font-size="15" fill="#161a21">C 源事务冻结门店与规则</text><rect x="230" y="350" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="384" text-anchor="middle" font-size="15" fill="#161a21">D pay 预占并确认金额</text><rect x="230" y="455" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="489" text-anchor="middle" font-size="15" fill="#161a21">E 原现金支付证据</text><rect x="230" y="560" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="594" text-anchor="middle" font-size="15" fill="#161a21">F 源 PAID 与返分事实</text><rect x="230" y="665" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="699" text-anchor="middle" font-size="15" fill="#161a21">G 核销或完成事实</text><rect x="230" y="770" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="804" text-anchor="middle" font-size="15" fill="#161a21">H 售后窗口及所有资金义务关闭</text><rect x="230" y="875" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="909" text-anchor="middle" font-size="15" fill="#161a21">I DRAINING</text><rect x="230" y="980" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1014" text-anchor="middle" font-size="15" fill="#161a21">J 原号退款准备及净现金意图</text><rect x="230" y="1085" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1119" text-anchor="middle" font-size="15" fill="#161a21">K 积分确认及源提交</text><rect x="230" y="1190" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1224" text-anchor="middle" font-size="15" fill="#161a21">L 必要补收回退</text><rect x="230" y="1295" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1329" text-anchor="middle" font-size="15" fill="#161a21">M 原售后 REFUNDING 待人工</text><rect x="230" y="1400" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1434" text-anchor="middle" font-size="15" fill="#161a21">N 源 CLOSED 与绑定 ABORTED</text><rect x="230" y="1505" width="540" height="58" rx="8" fill="#eaf1f6" stroke="#8fb3c9"/><text x="500" y="1539" text-anchor="middle" font-size="15" fill="#161a21">O 关闭原尝试并创建新尝试</text><text x="510" y="118" font-size="12" fill="#35495c">运营版本化接入</text><text x="785" y="163" font-size="12" fill="#35495c">停新增</text><text x="785" y="781" font-size="12" fill="#35495c">源与 pay 均证明清偿</text><text x="785" y="1015" font-size="12" fill="#35495c">未知</text><text x="510" y="1063" font-size="12" fill="#35495c">成功并核验</text><text x="785" y="1003" font-size="12" fill="#35495c">明确失败</text><text x="510" y="1378" font-size="12" fill="#35495c">关闭</text><text x="5" y="1318" font-size="12" fill="#35495c">重试</text></svg>