<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>两种结算模式的资金路径</title>
<desc>模式一「平台代收」与模式二「直连分账」的差别只在分账时机，不在资金去向：两者的钱全程都在微信收付通的账户体系内，平台从不经手。</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.l{font-size:9.5px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.hold{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.4}
.mch{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.zone{fill:none;stroke:#DDE2E9;stroke-width:1.2;stroke-dasharray:5 4}
.zt{font-size:10px;fill:#A6AEBB;letter-spacing:.1em}
</style></defs>

<rect class="zone" x="14" y="34" width="912" height="150" rx="10"/>
<text class="zt" x="26" y="52">模式一 · 平台代收（前期统一用这个）</text>

<rect class="box" x="30" y="70" width="120" height="46" rx="7"/>
<text class="n" x="44" y="90">用户付款</text><text class="t" x="44" y="107">下单即全额</text>

<rect class="box hold" x="222" y="70" width="200" height="46" rx="7"/>
<text class="n" x="236" y="90">平台商户号 · 冻结</text><text class="t" x="236" y="107">钱在微信账户体系内，平台不经手</text>

<rect class="box" x="494" y="70" width="150" height="46" rx="7"/>
<text class="n" x="508" y="90">售后期届满</text><text class="t" x="508" y="107">或确认收货</text>

<rect class="box mch" x="716" y="70" width="190" height="46" rx="7"/>
<text class="n" x="730" y="90">商家二级商户号</text><text class="t" x="730" y="107">分账到账，商家自行提现</text>

<path class="ar" marker-end="url(#a2)" d="M150 93 L218 93"/>
<path class="ar" marker-end="url(#a2)" d="M422 93 L490 93"/>
<path class="ar" marker-end="url(#a2)" d="M644 93 L712 93"/>
<text class="l" x="452" y="140">冻结期 = 风控窗口</text>
<text class="l" x="662" y="140">下发分账指令</text>
<text class="t" x="30" y="166">平台掌握结算节奏：出了纠纷，钱还没走，退款直接原路退。代价是商家现金流慢。</text>

<rect class="zone" x="14" y="216" width="912" height="130" rx="10"/>
<text class="zt" x="26" y="234">模式二 · 直连分账（成熟店/即时零售）</text>

<rect class="box" x="30" y="252" width="120" height="46" rx="7"/>
<text class="n" x="44" y="272">用户付款</text><text class="t" x="44" y="289">下单即全额</text>

<rect class="box" x="222" y="252" width="200" height="46" rx="7"/>
<text class="n" x="236" y="272">收付通合单支付</text><text class="t" x="236" y="289">支付那一刻就按比例拆开</text>

<rect class="box mch" x="494" y="252" width="190" height="46" rx="7"/>
<text class="n" x="508" y="272">商家二级商户号</text><text class="t" x="508" y="289">实时到账</text>

<rect class="box" x="756" y="252" width="150" height="46" rx="7"/>
<text class="n" x="770" y="272">平台佣金</text><text class="t" x="770" y="289">同时入账</text>

<path class="ar" marker-end="url(#a2)" d="M150 275 L218 275"/>
<path class="ar" marker-end="url(#a2)" d="M422 275 L490 275"/>
<path class="ar" marker-end="url(#a2)" d="M684 275 L752 275"/>
<text class="t" x="30" y="328">商家到账快。代价是退款要从商家账户回退分账，商家余额不足时会失败。</text>

<text class="b" x="24" y="378">两种模式的差别只在「什么时候下发分账」，不在「钱去哪」</text>
<text class="t" x="24" y="400">两者的资金全程都在微信收付通的账户体系内，**平台从不经手**——这是合规的分界线。</text>
<text class="t" x="24" y="418">若把钱真的打进平台对公账户再转给商家，那是「二清」，无支付牌照不可做。见方案 §一。</text>
</svg>
