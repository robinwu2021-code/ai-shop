<svg xmlns="http://www.w3.org/2000/svg" width="700" height="366" viewBox="0 0 700 366" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分抵扣的补差资金流</title>
<desc>商品 100 元、积分抵 30 元的一笔单：用户支付 70 元进二级商户账户（冻结）；平台在分账前调补差接口补入 30 元，账户合计 100 元；售后期结束后以 100 元为基数分账，平台分走佣金 2 元；商家最终可提现 98 元。商家账单只显示「订单 100 − 佣金 2 = 实收 98」，看不到补差这一步。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.amt{font-size:13px;font-weight:600;fill:#161A21;font-variant-numeric:tabular-nums}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#F7F9FB;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs>

<text class="g" x="24" y="26">来源</text>
<text class="g" x="266" y="26">二级商户账户（冻结中）</text>
<text class="g" x="556" y="26">结果</text>

<rect x="16" y="40" width="150" height="48" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="91" y="60" text-anchor="middle">用户支付</text>
<text class="amt" x="91" y="78" text-anchor="middle">70 元</text>

<rect x="16" y="112" width="150" height="48" rx="6" fill="#FDF3E3" stroke="#D9B87C"/>
<text class="n" x="91" y="132" text-anchor="middle">平台补差</text>
<text class="amt" x="91" y="150" text-anchor="middle">30 元</text>
<text class="s" x="91" y="176" text-anchor="middle">积分抵掉的部分</text>

<rect x="252" y="40" width="180" height="132" rx="8" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="s" x="342" y="64" text-anchor="middle">入账合计</text>
<text class="amt" x="342" y="94" text-anchor="middle" font-size="26">100 元</text>
<line x1="272" y1="112" x2="412" y2="112" stroke="#8FC2BA"/>
<text class="s" x="342" y="132" text-anchor="middle">= 订单金额</text>
<text class="s" x="342" y="150" text-anchor="middle">分账基数按它算</text>

<rect x="252" y="216" width="180" height="44" rx="6" fill="#F3F5F7" stroke="#C6CDD6"/>
<text class="n" x="342" y="236" text-anchor="middle">解冻并分账</text>
<text class="s" x="342" y="251" text-anchor="middle">售后期结束</text>

<rect x="516" y="60" width="168" height="52" rx="6" fill="#F3F5F7" stroke="#C6CDD6"/>
<text class="n" x="600" y="81" text-anchor="middle">平台分走佣金</text>
<text class="amt" x="600" y="99" text-anchor="middle">2 元</text>

<rect x="516" y="196" width="168" height="84" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="600" y="220" text-anchor="middle">商家可提现</text>
<text class="amt" x="600" y="244" text-anchor="middle" font-size="22">98 元</text>
<text class="s" x="600" y="266" text-anchor="middle">订单 100 − 佣金 2</text>

<line class="ar" x1="166" y1="64" x2="249" y2="80" marker-end="url(#a)"/>
<line class="ar" x1="166" y1="136" x2="249" y2="120" marker-end="url(#a)"/>
<line class="ar" x1="342" y1="172" x2="342" y2="213" marker-end="url(#a)"/>
<path class="ar" d="M432 228 L474 228 L474 96 L513 96" marker-end="url(#a)"/>
<line class="ar" x1="432" y1="238" x2="513" y2="238" marker-end="url(#a)"/>

<text class="l" x="196" y="60">实付</text>
<text class="l" x="196" y="146">分账前补入</text>
<text class="l" x="480" y="160" text-anchor="start">佣金</text>

<line x1="16" y1="304" x2="684" y2="304" stroke="#D8DEE6"/>
<text class="s" x="16" y="326">商家账单上只有：订单 100 − 佣金 2 = 实收 98。补差这一步对他不可见。</text>
<text class="s" x="16" y="346">退款时三件事各自回退：退用户 70 · 补差回退 30 · 分账回退 2。</text>
</svg>
