<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12.5">
  <title>商户退款的调用链：从 URL 到支付服务</title>
  <desc>商户 App 发起 POST /biz/payment/refund。请求经 nginx 进入 B 端出口的认证链：路由匹配、令牌认证、门店上下文、链级判权、透传判断，然后进入本地入口，由方法注解判定当前门店是否有退款权限。入口调支付桥接，出站时带进程凭据、调用方凭据、来源与签名上下文，到达支付服务的内部入口。支付服务的守卫验来源与签名，随后按调用方类型与动作的矩阵、门店范围、操作人三项判定，再执行退款业务规则。蓝色是方案新增的环节，其余是现有代码。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1160" height="820" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#0f172a">商户退款调用链：POST /biz/payment/refund</text>
  <text x="24" y="50" fill="#64748b">蓝底 = 方案新增；白底 = 现有代码原样沿用；右栏 = 支付服务进程（独立部署形态）</text>

  <!-- lanes -->
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="24" y="66" width="150" height="736" rx="8"/>
    <rect x="186" y="66" width="560" height="736" rx="8"/>
    <rect x="758" y="66" width="378" height="736" rx="8"/>
  </g>
  <g font-weight="600" fill="#334155">
    <text x="36" y="88">商户 App / nginx</text>
    <text x="198" y="88">ai-shop 进程 · 网关层 B 端出口 → 桥接</text>
    <text x="770" y="88">pay-svc 进程</text>
  </g>

  <!-- left -->
  <rect x="34" y="104" width="130" height="92" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="42" y="122" fill="#334155" font-weight="600">请求</text>
  <text x="42" y="140" fill="#334155" font-size="11.5">Bearer btk_…</text>
  <text x="42" y="156" fill="#334155" font-size="11.5">X-Store-No: S001</text>
  <text x="42" y="172" fill="#334155" font-size="11.5">订单号、金额、原因</text>
  <text x="42" y="188" fill="#334155" font-size="11.5">退款幂等号</text>
  <rect x="34" y="212" width="130" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="42" y="232" fill="#334155" font-weight="600">nginx</text>
  <text x="42" y="250" fill="#334155" font-size="11.5">/biz → api 进程</text>
  <line x1="99" y1="196" x2="99" y2="210" stroke="#475569" marker-end="url(#a)"/>
  <line x1="164" y1="237" x2="196" y2="131" stroke="#475569" marker-end="url(#a)"/>

  <!-- middle steps -->
  <g>
    <rect x="198" y="104" width="536" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="198" y="146" width="536" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="198" y="188" width="536" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="198" y="246" width="536" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="198" y="304" width="536" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="198" y="346" width="536" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="198" y="388" width="536" height="66" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="198" y="462" width="536" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="198" y="520" width="536" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="198" y="578" width="536" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  </g>
  <g fill="#1e293b">
    <text x="208" y="126"><tspan font-weight="600">1 选链</tspan>　securityMatcher("/biz/**") 选中 merchantChain</text>
    <text x="208" y="210"><tspan font-weight="600">3 令牌认证</tspan>　MerchantTokenAuthFilter：查 mch_session，只认商户端令牌</text>
    <text x="208" y="228" font-size="11.5" fill="#475569">结果：登录人进 SecurityContext；查不到会话打「已过期」标记</text>
    <text x="208" y="268"><tspan font-weight="600">4 门店上下文</tspan>　ClientVersionGateFilter → BizContextFilter</text>
    <text x="208" y="286" font-size="11.5" fill="#475569">读 X-Store-No，算出主体、可用门店、当前门店的权限码集合</text>
    <text x="208" y="410"><tspan font-weight="600">7 方法判权</tspan>　BizPaymentController.requestRefund</text>
    <text x="208" y="428" font-size="11.5" fill="#475569">@PreAuthorize("@perm.canBiz('mch:pay:refund')")：按当前门店的角色判</text>
    <text x="208" y="446" font-size="11.5" fill="#475569">不是商户 → 403；角色不够 → 70006，并指出缺的是哪项权限</text>
    <text x="208" y="484"><tspan font-weight="600">8 入口</tspan>　门店取自上下文 BizContext.requireStoreNo()，不取请求体</text>
    <text x="208" y="502" font-size="11.5" fill="#475569">调 BizPaymentAppService.requestRefund(门店, 订单号, 金额, 原因, 幂等号)</text>
    <text x="208" y="542"><tspan font-weight="600">9 桥接</tspan>　RemoteBizPaymentAppService：补上操作人 = 当前商户账号</text>
    <text x="208" y="560" font-size="11.5" fill="#475569">经契约接口 PayBizInternalApi 发出；同进程部署时直接调 PayBizFacade</text>
  </g>
  <g fill="#1e3a8a">
    <text x="208" y="168"><tspan font-weight="600">2 路由匹配</tspan>　GatewayRouteFilter：不是透传路由 → 记为本地入口</text>
    <text x="208" y="326"><tspan font-weight="600">5 链级判权</tspan>　GatewayAuthorizationManager：本地入口要求已登录，否则 401</text>
    <text x="208" y="368"><tspan font-weight="600">6 透传判断</tspan>　GatewayProxyFilter：不是透传路由 → 放给 Spring MVC</text>
    <text x="208" y="600"><tspan font-weight="600">10 出站签名</tspan>　SignedContextInterceptor（现有三组头之外新增）</text>
    <text x="208" y="618" font-size="11.5">操作人、门店 S001、下游动作 REQUEST_REFUND、请求号、时间、请求体摘要</text>
  </g>
  <text x="198" y="654" font-size="11.5" fill="#475569">出站时现有的三组头：X-Internal-Token（进程令牌）、X-Internal-Caller + X-Internal-Credential（调用方凭据）、</text>
  <text x="198" y="672" font-size="11.5" fill="#475569">X-Call-Source（上游接口、端、IP、登录人、请求号）</text>

  <!-- arrows down middle -->
  <g stroke="#475569" marker-end="url(#a)">
    <line x1="466" y1="138" x2="466" y2="144"/><line x1="466" y1="180" x2="466" y2="186"/>
    <line x1="466" y1="238" x2="466" y2="244"/><line x1="466" y1="296" x2="466" y2="302"/>
    <line x1="466" y1="338" x2="466" y2="344"/><line x1="466" y1="380" x2="466" y2="386"/>
    <line x1="466" y1="454" x2="466" y2="460"/><line x1="466" y1="512" x2="466" y2="518"/>
    <line x1="466" y1="570" x2="466" y2="576"/>
  </g>

  <!-- right -->
  <g>
    <rect x="770" y="104" width="354" height="66" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="770" y="178" width="354" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="770" y="236" width="354" height="66" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="770" y="310" width="354" height="100" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="770" y="418" width="354" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="770" y="476" width="354" height="66" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  </g>
  <g fill="#1e293b">
    <text x="780" y="126"><tspan font-weight="600">11 守卫</tspan>　GuardFilter → InternalGuard</text>
    <text x="780" y="144" font-size="11.5" fill="#475569">来源 IP 白名单；记调用方与来源</text>
    <text x="780" y="162" font-size="11.5" fill="#475569">调用方凭据校验是开关，默认关</text>
    <text x="780" y="258"><tspan font-weight="600">13 内部入口</tspan>　InternalPayBizEndpoint</text>
    <text x="780" y="276" font-size="11.5" fill="#475569">→ PayBizFacade.requestRefund</text>
    <text x="780" y="294" font-size="11.5" fill="#475569">造出调用身份：商户类型、本店、操作人</text>
    <text x="780" y="332"><tspan font-weight="600">14 支付自己的判定</tspan>　MatrixCallerPolicy</text>
    <text x="780" y="350" font-size="11.5" fill="#475569">· 调用方类型 × 动作 的矩阵允许</text>
    <text x="780" y="368" font-size="11.5" fill="#475569">· 订单所属门店在调用身份的范围内</text>
    <text x="780" y="386" font-size="11.5" fill="#475569">· 退款必须有操作人</text>
    <text x="780" y="402" font-size="11.5" fill="#475569">任一不过 → PAY_FORBIDDEN</text>
    <text x="780" y="498"><tspan font-weight="600">16 退款业务</tspan>　RefundServiceImpl</text>
    <text x="780" y="516" font-size="11.5" fill="#475569">可退余额、复核规则、执行器</text>
    <text x="780" y="534" font-size="11.5" fill="#475569">命中复核 → 状态「待平台复核」</text>
  </g>
  <g fill="#1e3a8a">
    <text x="780" y="200"><tspan font-weight="600">12 验签</tspan>　验签名、时间窗、请求体摘要</text>
    <text x="780" y="218" font-size="11.5">门店与操作人以签名里的为准</text>
    <text x="780" y="440"><tspan font-weight="600">15 取交集</tspan>　动作须在签名带来的动作集合里</text>
    <text x="780" y="458" font-size="11.5">网关没判过的动作，支付不执行</text>
  </g>
  <g stroke="#475569" marker-end="url(#a)">
    <line x1="947" y1="170" x2="947" y2="176"/><line x1="947" y1="228" x2="947" y2="234"/>
    <line x1="947" y1="302" x2="947" y2="308"/><line x1="947" y1="410" x2="947" y2="416"/>
    <line x1="947" y1="468" x2="947" y2="474"/>
  </g>
  <path d="M734,603 L752,603 L752,137 L768,137" fill="none" stroke="#475569" marker-end="url(#a)"/>
  <text x="640" y="700" font-size="11.5" fill="#475569">POST /internal/pay/v1/biz/stores/S001/refunds</text>

  <!-- return -->
  <rect x="198" y="722" width="926" height="66" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="208" y="744" fill="#1e293b"><tspan font-weight="600">17 返回</tspan>　支付以 PortResult 回结果或业务拒绝 → 桥接还原成业务异常或结果，写审计 BIZ_PAY_REFUND</text>
  <text x="208" y="762" font-size="11.5" fill="#475569">成功：入口返回值由 ApiResponseWrapper 包成统一包体。失败：GlobalExceptionHandler 输出统一错误。</text>
  <text x="208" y="780" font-size="11.5" fill="#475569">支付的原始错误体不直接给终端。</text>
  <path d="M947,542 L947,720" fill="none" stroke="#475569" marker-end="url(#a)"/>
</svg>
