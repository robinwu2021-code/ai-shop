<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1890" viewBox="0 0 1320 1890" role="img" aria-labelledby="title desc">
<title id="title">退款与结算 hold 恢复路径</title>
<desc id="desc">退款与结算 hold 恢复路径。每行是一条有向关系；同名框代表同一对象或状态，箭头上的文字表示分支条件。原售后单与冻结退款命令 → 结算路径（判定）；结算路径 → 创建 PENDING hold 并阻断放款（未付款）；结算路径 → 创建 hold 并保留原付款事实（已付款）；结算路径 → 持久化原账户及回退指令（已分账）；持久化原账户及回退指令 → 事务外提交一次分账回退（原指令）；事务外提交一次分账回退 → 保持 hold；后续只查原指令（结果未知）；保持 hold；后续只查原指令 → 只记录实际 reversed_minor（确认成功）；事务外提交一次分账回退 → 只记录实际 reversed_minor（确认成功）；创建 PENDING hold 并阻断放款 → 现金和积分退款均确认（等待退款）；创建 hold 并保留原付款事实 → 现金和积分退款均确认（等待退款）；只记录实际 reversed_minor → 现金和积分退款均确认（等待退款）；现金和积分退款均确认 → 结算路径（确认后）（判定）；结算路径（确认后） → 按原始基数扣应付；剩余金额重新对账（未付款）；结算路径（确认后） → 保留 PAID / paid_at / payment_ref；记录供应商待追偿（已付款）；结算路径（确认后） → 追加商品退款进度；不重复记银行回退（已分账）；按原始基数扣应付；剩余金额重新对账 → hold CONFIRMED（确认）；保留 PAID / paid_at / payment_ref；记录供应商待追偿 → hold CONFIRMED（确认）；追加商品退款进度；不重复记银行回退 → hold CONFIRMED（确认）；只记录实际 reversed_minor → 保留实际银行回退；结算转 MANUAL（现金明确失败且积分已安全中止）；保留实际银行回退；结算转 MANUAL → hold CANCELLED；释放原退款容量（取消）</desc>
