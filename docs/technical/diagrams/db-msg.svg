<svg xmlns="http://www.w3.org/2000/svg" width="680" height="100" viewBox="0 0 680 100" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>消息与客服 表关系</title><desc>3 张表，箭头由引用方指向被引用方。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-weight:500;fill:#161A21}.s{font-size:11px;fill:#5A6472}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#F7F9FB;stroke-width:3.5;stroke-linejoin:round}.b{font-size:11px;fill:#5A6472;letter-spacing:.1em}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}</style></defs>
<rect x="63" y="30" width="170" height="44" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="148" y="50" text-anchor="middle" font-size="13">msg_message</text>
<text class="s" x="148" y="65" text-anchor="middle">站内消息</text>
<rect x="255" y="30" width="170" height="44" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="340" y="50" text-anchor="middle" font-size="13">msg_subscribe</text>
<text class="s" x="340" y="65" text-anchor="middle">订阅消息授权</text>
<rect x="447" y="30" width="170" height="44" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="532" y="50" text-anchor="middle" font-size="13">msg_ticket</text>
<text class="s" x="532" y="65" text-anchor="middle">客服工单</text>
</svg>