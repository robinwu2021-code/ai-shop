<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分域模块与包依赖</title>
<desc>交易域只经 shop-base 的三条积分端口调用支付域；端口实现在 pay.points.port，转给应用服务；结算实现直接调用积分域内的结算钩子，方向只有结算到积分；应用服务编排闸门、策略、凭证工厂与过账服务，过账服务是唯一调用存储写方法的地方，存储实现才能用 Mapper。运营与 B、C 端控制器经 payclient 应用服务进入积分应用服务。积分域向外只依赖通知端口与市场主数据。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.da{stroke:#8A94A2;stroke-width:1.2;fill:none;stroke-dasharray:4 3}</style></defs>
<rect width="780" height="460" fill="#FFFFFF"/>

<!-- 左列：调用方 -->
<text class="g" x="16" y="24">调用方</text>
<rect x="16" y="40" width="160" height="56" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="96" y="64" text-anchor="middle">shop-app</text>
<text class="s" x="96" y="82" text-anchor="middle">Controller → payclient</text>
<rect x="16" y="150" width="160" height="56" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="96" y="174" text-anchor="middle">shop-core · trade</text>
<text class="s" x="96" y="192" text-anchor="middle">下单 / 支付 / 售后</text>
<rect x="16" y="252" width="160" height="56" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="96" y="276" text-anchor="middle">shop-core · product</text>
<text class="s" x="96" y="294" text-anchor="middle">PointsRulePort 实现</text>
<path class="ar" d="M96 206 L96 250" marker-end="url(#a)"/>
<text class="l" x="104" y="232">取返分规则</text>

<!-- spi -->
<text class="g" x="212" y="140">shop-base · spi.points</text>
<rect x="212" y="150" width="150" height="88" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="287" y="174" text-anchor="middle">PointsEarnPort</text>
<text class="n" x="287" y="196" text-anchor="middle">PointsRedeemPort</text>
<text class="n" x="287" y="218" text-anchor="middle">PointsRefundPort</text>
<path class="ar" d="M176 178 L210 178" marker-end="url(#a)"/>

<!-- pay-domain -->
<rect x="398" y="12" width="366" height="404" rx="10" fill="#F7F9FB" stroke="#C9D1DB"/>
<text class="g" x="412" y="32">pay-domain</text>
<rect x="414" y="44" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="489" y="64" text-anchor="middle">pay.impl · settle</text>
<text class="s" x="489" y="80" text-anchor="middle">SettleServiceImpl</text>
<rect x="600" y="44" width="150" height="44" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="675" y="64" text-anchor="middle">points.port</text>
<text class="s" x="675" y="80" text-anchor="middle">三个 Port 实现</text>
<rect x="470" y="124" width="224" height="52" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="582" y="146" text-anchor="middle">points.app</text>
<text class="s" x="582" y="164" text-anchor="middle">应用服务 · PointsSettlementHook</text>
<rect x="414" y="212" width="104" height="44" rx="6" fill="#FFFFFF" stroke="#9CC193"/>
<text class="n" x="466" y="232" text-anchor="middle">policy</text>
<text class="s" x="466" y="248" text-anchor="middle">规则与闸门</text>
<rect x="530" y="212" width="104" height="44" rx="6" fill="#FFFFFF" stroke="#9CC193"/>
<text class="n" x="582" y="232" text-anchor="middle">voucher</text>
<text class="s" x="582" y="248" text-anchor="middle">凭证模板</text>
<rect x="646" y="212" width="104" height="44" rx="6" fill="#FFFFFF" stroke="#D08C8C"/>
<text class="n" x="698" y="232" text-anchor="middle">posting</text>
<text class="s" x="698" y="248" text-anchor="middle">唯一写入口</text>
<rect x="470" y="290" width="164" height="40" rx="6" fill="#FFFFFF" stroke="#9CC193"/>
<text class="n" x="552" y="315" text-anchor="middle">model（纯 Java）</text>
<rect x="646" y="290" width="104" height="40" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="698" y="315" text-anchor="middle">store</text>
<rect x="646" y="356" width="104" height="44" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="698" y="376" text-anchor="middle">store.impl</text>
<text class="s" x="698" y="392" text-anchor="middle">→ mapper.points</text>
<rect x="414" y="356" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="514" y="376" text-anchor="middle">MarketService · 对账轴</text>
<text class="s" x="514" y="392" text-anchor="middle">同模块复用</text>

<path class="da" d="M362 172 L598 72" marker-end="url(#a)"/>
<text class="l" x="384" y="158">实现</text>
<path class="ar" d="M675 88 L640 122" marker-end="url(#a)"/>
<path class="ar" d="M510 88 L540 122" marker-end="url(#a)"/>
<text class="l" x="470" y="110">钩子（单向）</text>
<path class="ar" d="M176 64 L468 140" marker-end="url(#a)"/>
<text class="l" x="300" y="96">payclient → app</text>
<path class="ar" d="M520 176 L478 210" marker-end="url(#a)"/>
<path class="ar" d="M582 176 L582 210" marker-end="url(#a)"/>
<path class="ar" d="M650 176 L690 210" marker-end="url(#a)"/>
<path class="ar" d="M466 256 L520 288" marker-end="url(#a)"/>
<path class="ar" d="M582 256 L566 288" marker-end="url(#a)"/>
<path class="ar" d="M698 256 L698 288" marker-end="url(#a)"/>
<path class="ar" d="M698 330 L698 354" marker-end="url(#a)"/>

<!-- 向外 -->
<rect x="212" y="300" width="150" height="56" rx="6" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="287" y="324" text-anchor="middle">spi.notify</text>
<text class="s" x="287" y="342" text-anchor="middle">OpsAlertPort · 到期提醒</text>
<path class="ar" d="M470 166 L364 316" marker-end="url(#a)"/>
<text class="l" x="372" y="262">告警 / 提醒</text>
<text class="s" x="16" y="446">实线 = 调用，虚线 = 实现。store 的写方法只允许 posting 调（ArchUnit A3）；points 不依赖 settle（A5）；model 不依赖框架（A1）。</text>
</svg>
