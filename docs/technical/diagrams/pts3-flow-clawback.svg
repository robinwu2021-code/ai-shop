<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1070" viewBox="0 0 1640 1070"><title>购物返分收回与现金不足处理</title><desc>退款两侧分开：抵扣退回见退款图，本图是购物返分收回、补收及承担差额。</desc>
<defs><marker id="point" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="money" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c2410c"/></marker><marker id="dep" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b"/></marker><marker id="real" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="white" stroke="#475569"/></marker><marker id="diamond" markerWidth="15" markerHeight="10" refX="14" refY="5" orient="auto-start-reverse"><path d="M0 5L7 0L14 5L7 10Z" fill="#475569"/></marker></defs>
<rect width="1640" height="1070" fill="#f8fafc"/>
<text x="35" y="48" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#172554" font-weight="650" text-anchor="start">购物返分收回与现金不足处理</text>
<text x="35" y="80" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526277" font-weight="400" text-anchor="start">v3 目标设计 · pay-domain内独立业务模块 · payTxManager · 尚未按此设计实现</text>
<text x="35" y="138" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">实际可收回积分</text>
<rect x="35.0" y="150" width="356.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35.0" y="150" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="51.0" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">逐行累计计算</text>
<text x="51.0" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">按发放行及迟到基线</text>
<text x="51.0" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">仅商品退款，不含运费</text>
<rect x="433.0" y="150" width="356.0" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="433.0" y="150" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="449.0" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">prepare锁P/A</text>
<text x="449.0" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">移到退款H记原来源</text>
<text x="449.0" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">固定结果与hash</text>
<path d="M391.0,235 L433.0,235" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="831.0" y="150" width="356.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="831.0" y="150" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="847.0" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">现金退款结果明确</text>
<text x="847.0" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">未知保持准备重试</text>
<text x="847.0" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不提前给可用退分</text>
<path d="M789.0,235 L831.0,235" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1229.0" y="150" width="356.0" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="1229.0" y="150" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="1245.0" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">实际H→ISSUE</text>
<text x="1245.0" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">C→U</text>
<text x="1245.0" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">用户不出现负余额</text>
<path d="M1187.0,235 L1229.0,235" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="355" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">迟到发放例：原100、先退50、再发50，后退25只收25；最后商品全退补齐尾差。</text>
<text x="35" y="423" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">已花掉不足部分</text>
<rect x="35.0" y="435" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35.0" y="435" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="51.0" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">现金补收上限</text>
<text x="51.0" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不超过本次可退现金</text>
<text x="51.0" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不支持回平台则为0</text>
<rect x="565.6666666666667" y="435" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#c2410c" stroke-width="1.8"/>
<rect x="565.6666666666667" y="435" width="6" height="170" rx="3" fill="#c2410c"/>
<text x="581.6666666666667" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#c2410c" font-weight="650" text-anchor="start">真实回平台确认</text>
<text x="581.6666666666667" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">未到不补U</text>
<text x="581.6666666666667" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">直连留商家不算回款</text>
<path d="M523.6666666666667,520 L565.6666666666667,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1096.3333333333335" y="435" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="1096.3333333333335" y="435" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="1112.3333333333335" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">自由回流或备款发行</text>
<text x="1112.3333333333335" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">自由分优先，不足MINT</text>
<text x="1112.3333333333335" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">ISSUE/U等额补足</text>
<path d="M1054.3333333333335,520 L1096.3333333333335,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="640" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">现金退款与补收可分阶段。每腿有独立证据和幂等结果，晚到补收只处理一次。</text>
<text x="35" y="708" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">剩余差额</text>
<rect x="35.0" y="720" width="754.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35.0" y="720" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="51.0" y="749" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">无法实际收回</text>
<text x="51.0" y="775" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">余额不足/补收不支持</text>
<rect x="831.0" y="720" width="754.0" height="170" rx="12" fill="white" stroke="#be123c" stroke-width="1.8"/>
<rect x="831.0" y="720" width="6" height="170" rx="3" fill="#be123c"/>
<text x="847.0" y="749" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#be123c" font-weight="650" text-anchor="start">平台承担 waived</text>
<text x="847.0" y="775" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不增U，不发行</text>
<text x="847.0" y="798" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不假记已收回</text>
<path d="M789.0,805 L831.0,805" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="925" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">积分退款形式本期下线；运营调账也不能绕过发放预算或凭空增加可用积分。</text>
<text x="35" y="1046" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#be123c" font-weight="400" text-anchor="start">资金证据不明确时保留原意图/占用；不假记到账、不改同一幂等请求金额。</text>
</svg>
