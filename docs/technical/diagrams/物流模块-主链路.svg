<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>物流主链路：一张运单从发货到确认收货，每一步谁调谁、为什么</title>
<desc>六条泳道从左到右是：交易域、sys_outbox、物流模块、快递100、微信、买家。从上到下是一张微信支付快递单的完整生命周期：发货发事件、物流登记并向快递100 订阅一次、交易域上传发货信息给微信并通知物流、快递100 推送揽收后物流才去微信换 token、微信自己给买家推三节点消息、快递100 推送签收后物流写签收时间并发事件、交易域据此调微信确认收货提醒、买家打开物流页时按 10 分钟缓存查一次微信状态、买家确认收货后微信推结算事件给交易域。右下角是补偿作业：只处理 24 小时没有任何推送的在途运单。线下付款单在第 ⑥ ⑨ 步改走自有订阅消息，不调任何微信物流接口。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C9752F" stroke-width="1.5" stroke-linecap="round"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4E9A6B" stroke-width="1.5" stroke-linecap="round"/></marker>
<style>
.n{font-size:12px;font-weight:650;fill:#161A21}
.sm{font-size:10px;fill:#5A6472}
.mt{font-size:9.5px;fill:#6B7484;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.b{font-size:10.5px;fill:#8A94A2;letter-spacing:.1em;font-weight:600}
.l{font-size:9px;fill:#5A6472;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.lw{font-size:9px;fill:#B5651F;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
.port{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.7}
.router{fill:#FDF6EC;stroke:#D9994A;stroke-width:1.7}
.impl{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.caller{fill:#F7F8FA;stroke:#C4CBD5;stroke-width:1.2}
.data{fill:#EEF4FC;stroke:#8FADD4;stroke-width:1.3}
.job{fill:#FBF4F6;stroke:#C98FA6;stroke-width:1.3}
.ext{fill:#F5F3FB;stroke:#A99BD0;stroke-width:1.3}
.ar{stroke:#8A94A2;stroke-width:1.2;fill:none}
.arw{stroke:#C9752F;stroke-width:1.5;fill:none}
.arg{stroke:#4E9A6B;stroke-width:1.5;fill:none}
.dash{stroke-dasharray:4 3}
.zone{fill:none;stroke:#DDE2E9;stroke-width:1.1;stroke-dasharray:5 4}
.zone2{fill:#FCFCFD;stroke:#C9D2DD;stroke-width:1.2}
.zt{font-size:9.5px;fill:#A6AEBB;letter-spacing:.08em}
.ztb{font-size:10px;fill:#5A6472;letter-spacing:.06em;font-weight:700}
.life{stroke:#E3E7ED;stroke-width:1.2;stroke-dasharray:3 4}
.num{font-size:9px;font-weight:700;fill:#fff}
.dot{fill:#8A94A2}.dotw{fill:#C9752F}.dotg{fill:#4E9A6B}
.note{font-size:10px;fill:#3D4552}
</style></defs>
<rect x="0" y="0" width="1240" height="980" fill="#fff"/>
<text class="b" x="24.0" y="26.0">物流主链路 · 一张微信支付快递单的一生（线下付款单的差别见右侧注）</text>
<text class="sm" x="24.0" y="43.0">实线箭头 = 同步调用　虚线 = 经 sys_outbox 的事件（提交后执行，失败退避重试）　绿 = 微信　橙 = 快递100　编号 = 时间顺序</text>
<rect class="zone2" x="48" y="58" width="124" height="30" rx="5"/>
<text class="n" x="110.0" y="78.0" text-anchor="middle">交易域</text>
<line class="life" x1="110" y1="88" x2="110" y2="900"/>
<rect class="zone2" x="223" y="58" width="124" height="30" rx="5"/>
<text class="n" x="285.0" y="78.0" text-anchor="middle">sys_outbox</text>
<line class="life" x1="285" y1="88" x2="285" y2="900"/>
<rect class="port" x="408" y="58" width="124" height="30" rx="5"/>
<text class="n" x="470.0" y="78.0" text-anchor="middle">物流模块</text>
<line class="life" x1="470" y1="88" x2="470" y2="900"/>
<rect class="zone2" x="603" y="58" width="124" height="30" rx="5"/>
<text class="n" x="665.0" y="78.0" text-anchor="middle">快递100</text>
<line class="life" x1="665" y1="88" x2="665" y2="900"/>
<rect class="zone2" x="768" y="58" width="124" height="30" rx="5"/>
<text class="n" x="830.0" y="78.0" text-anchor="middle">微信</text>
<line class="life" x1="830" y1="88" x2="830" y2="900"/>
<rect class="zone2" x="913" y="58" width="124" height="30" rx="5"/>
<text class="n" x="975.0" y="78.0" text-anchor="middle">买家</text>
<line class="life" x1="975" y1="88" x2="975" y2="900"/>
<path class="ar dash" d="M114.0 118.0 L279.0 118.0" marker-end="url(#ar)"/>
<circle class="dot" cx="124" cy="118" r="8"/>
<text class="num" x="124" y="121.2" text-anchor="middle">1</text>
<text class="l" x="136.0" y="111.0">商家发货 → SubOrderShipped</text>
<path class="ar dash" d="M289.0 158.0 L464.0 158.0" marker-end="url(#ar)"/>
<circle class="dot" cx="299" cy="158" r="8"/>
<text class="num" x="299" y="161.2" text-anchor="middle">2</text>
<text class="l" x="311.0" y="151.0">登记运单</text>
<text class="mt" x="311.0" y="173.0">只带业务键（outbox 不清理）</text>
<path class="arw" d="M466.0 198.0 L116.0 198.0" marker-end="url(#arw)"/>
<circle class="dotw" cx="456" cy="198" r="8"/>
<text class="num" x="456" y="201.2" text-anchor="middle">3</text>
<text class="l" x="136.0" y="191.0">ShipmentSourcePort.sourceOf —— 唯一一次读交易域</text>
<rect class="impl" x="372.0" y="208" width="196" height="34.5" rx="5"/>
<text class="mt" x="380.0" y="222.0">INSERT lgs_waybill · profile=WX</text>
<text class="mt" x="380.0" y="235.0">UK(biz_type,biz_ref) 幂等</text>
<path class="arw" d="M474.0 262.0 L659.0 262.0" marker-end="url(#arw)"/>
<circle class="dotw" cx="484" cy="262" r="8"/>
<text class="num" x="484" y="265.2" text-anchor="middle">4</text>
<text class="l" x="496.0" y="255.0">订阅（/poll · 每单一次）</text>
<text class="mt" x="496.0" y="277.0">200 / 501 = DONE；600/601/700 = FATAL</text>
<path class="arg" d="M114.0 312.0 L824.0 312.0" marker-end="url(#arg)"/>
<circle class="dotg" cx="124" cy="312" r="8"/>
<text class="num" x="124" y="315.2" text-anchor="middle">5</text>
<text class="l" x="136.0" y="305.0">upload_shipping_info（已有）</text>
<path class="ar dash" d="M114.0 342.0 L464.0 342.0" marker-end="url(#ar)"/>
<circle class="dot" cx="124" cy="342" r="8"/>
<text class="num" x="124" y="345.2" text-anchor="middle">5′</text>
<text class="l" x="136.0" y="335.0">WxShippingUploaded → wx_uploaded_at</text>
<path class="arw" d="M661.0 388.0 L476.0 388.0" marker-end="url(#arw)"/>
<circle class="dotw" cx="651" cy="388" r="8"/>
<text class="num" x="651" y="391.2" text-anchor="middle">6</text>
<text class="l" x="496.0" y="381.0">推送「已揽收」</text>
<text class="mt" x="496.0" y="403.0">验签 · 落节点 · COLLECTED</text>
<path class="arg" d="M474.0 432.0 L824.0 432.0" marker-end="url(#arg)"/>
<circle class="dotg" cx="484" cy="432" r="8"/>
<text class="num" x="484" y="435.2" text-anchor="middle">7</text>
<text class="l" x="496.0" y="425.0">trace_waybill → waybill_token（前置满足才调）</text>
<text class="mt" x="496.0" y="447.0">已上传 ∧ 已揽收；9300559 → 保持 WAITING，等下一条推送</text>
<path class="arg" d="M834.0 484.0 L969.0 484.0" marker-end="url(#arg)"/>
<circle class="dotg" cx="844" cy="484" r="8"/>
<text class="num" x="844" y="487.2" text-anchor="middle">8</text>
<text class="l" x="856.0" y="477.0">已揽件 / 派件中 / 已签收 三节点消息</text>
<text class="mt" x="856.0" y="499.0">微信自己推，不经我们</text>
<path class="arw" d="M661.0 530.0 L476.0 530.0" marker-end="url(#arw)"/>
<circle class="dotw" cx="651" cy="530" r="8"/>
<text class="num" x="651" y="533.2" text-anchor="middle">9</text>
<text class="l" x="496.0" y="523.0">推送「已签收」</text>
<rect class="impl" x="372.0" y="540" width="196" height="20.0" rx="5"/>
<text class="mt" x="380.0" y="554.0">signed_at 只写一次 · 清手机号</text>
<path class="ar dash" d="M466.0 578.0 L291.0 578.0" marker-end="url(#ar)"/>
<circle class="dot" cx="456" cy="578" r="8"/>
<text class="num" x="456" y="581.2" text-anchor="middle">10</text>
<text class="l" x="311.0" y="571.0">WaybillSigned</text>
<path class="ar dash" d="M281.0 608.0 L116.0 608.0" marker-end="url(#ar)"/>
<circle class="dot" cx="271" cy="608" r="8"/>
<text class="num" x="271" y="611.2" text-anchor="middle">11</text>
<text class="l" x="136.0" y="601.0">消费</text>
<path class="arg" d="M114.0 638.0 L824.0 638.0" marker-end="url(#arg)"/>
<circle class="dotg" cx="124" cy="638" r="8"/>
<text class="num" x="124" y="641.2" text-anchor="middle">12</text>
<text class="l" x="136.0" y="631.0">notify_confirm_receive（每个支付单一次）</text>
<path class="ar" d="M971.0 684.0 L476.0 684.0" marker-end="url(#ar)"/>
<circle class="dot" cx="961" cy="684" r="8"/>
<text class="num" x="961" y="687.2" text-anchor="middle">13</text>
<text class="l" x="496.0" y="677.0">打开物流页 GET /mp/order/{no}/trace</text>
<path class="arg" d="M474.0 714.0 L824.0 714.0" marker-end="url(#arg)"/>
<circle class="dotg" cx="484" cy="714" r="8"/>
<text class="num" x="484" y="717.2" text-anchor="middle">14</text>
<text class="l" x="496.0" y="707.0">query_trace（距上次 ≥ 10 分钟才调）</text>
<text class="mt" x="496.0" y="729.0">返回 4/6 = 签收 → 同第 9 步</text>
<path class="arg" d="M826.0 766.0 L116.0 766.0" marker-end="url(#arg)"/>
<circle class="dotg" cx="816" cy="766" r="8"/>
<text class="num" x="816" y="769.2" text-anchor="middle">15</text>
<text class="l" x="136.0" y="759.0">结算事件（买家确认收货）→ 子单完成</text>
<text class="mt" x="136.0" y="781.0">批 B 已上线</text>
<rect class="job" x="15.0" y="798" width="190" height="47.0" rx="5"/>
<text class="mt" x="23.0" y="812.0">OrderAutoReceiptJob（每天）</text>
<text class="mt" x="23.0" y="825.0">没人点确认收货时：</text>
<text class="mt" x="23.0" y="837.5">签收 7 天 / 发货 15 天 先到者</text>
<rect class="router" x="1060" y="470" width="166" height="168" rx="5"/>
<text class="n" x="1069.0" y="486.0">线下付款单（SELF）</text>
<text class="mt" x="1069.0" y="500.0">登记时 profile=SELF</text>
<text class="mt" x="1069.0" y="512.5">第 5 · 7 · 12 · 14 步</text>
<text class="mt" x="1069.0" y="525.0">都不发生</text>
<text class="mt" x="1069.0" y="537.5">第 8 步改为：</text>
<text class="mt" x="1069.0" y="550.0">自有订阅消息</text>
<text class="mt" x="1069.0" y="562.5">（发货 / 派件 / 签收）</text>
<text class="mt" x="1069.0" y="575.0">轨迹页用自建地图</text>
<text class="mt" x="1069.0" y="587.5">数据来自第 6 · 9 步推送</text>
<rect class="job" x="1060" y="656" width="166" height="142" rx="5"/>
<text class="n" x="1069.0" y="672.0">logistics-compensate</text>
<text class="mt" x="1069.0" y="686.0">每小时 · 唯一的物流作业</text>
<text class="mt" x="1069.0" y="698.5">只扫：非终态 ∧</text>
<text class="mt" x="1069.0" y="711.0">24h 没有任何推送</text>
<text class="mt" x="1069.0" y="723.5">有 token → query_trace</text>
<text class="mt" x="1069.0" y="736.0">没 token → 计入</text>
<text class="mt" x="1069.0" y="748.5">「无法探测」</text>
<text class="mt" x="1069.0" y="761.0">不扫正常推送中的单</text>
<text class="b" x="24.0" y="908.0">图上看不出来的：</text>
<text class="note" x="24.0" y="928.0">第 7 步要等两个前提 —— 第 5′ 步（已上传微信）与第 6 步（已揽收）。两者先后不定，所以两个事件到达时都要判一次；只在一边判就会漏。</text>
<text class="note" x="24.0" y="946.0">第 9 步与第 14 步都能写签收：谁先到谁写，另一个到了是空操作。正常情况推送先到；推送沉默时由补偿作业去问微信。</text>
</svg>
