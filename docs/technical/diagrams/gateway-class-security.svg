<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="12.5">
  <title>网关层类图一：请求管线、安全框架接入、资源索引</title>
  <desc>网关层的请求管线由五个环节组成：路由定位过滤器、令牌认证过滤器及其三端子类、B 端门店上下文过滤器、判权管理器、透传过滤器。链骨架构建器按顺序把它们装进一条 Spring Security 过滤器链。安全框架经适配器接口接入，目前只有 Spring Security 一个实现，其他权限框架实现同一接口即可。判权逻辑放在与框架无关的判定接口后面，它读资源索引的一行并调用现有的权限检查器。资源索引由构建器在启动时扫描本地入口与透传路由生成。</desc>
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#475569"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#475569" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#0f172a">网关层类图一：请求管线、安全框架接入、资源索引</text>
  <text x="24" y="50" fill="#64748b" font-size="12">蓝 = 网关层新增；白 = 现有类；灰 = 框架自带；虚线框 = 预留、未实现。空心三角 = 继承或实现（虚线为实现接口）；箭头 = 使用</text>
  <path d="M785.0,190 L785.0,167.5 L785.0,167.5 L785.0,145" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M1060.0,190 L1060.0,112.5 L910,112.5" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M660,215.5 L625.0,215.5 L625.0,174.3 L590,174.3" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="629.0" y="190.9" font-size="11" fill="#475569">调用</text>
  <path d="M300,135.5 L275.0,135.5 L275.0,111.0 L250,111.0" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="256" y="140" font-size="11" fill="#475569">产出</text>
  <path d="M365.0,470 L365.0,447.5 L365.0,447.5 L365.0,425" fill="none" stroke="#475569" marker-end="url(#tri)"/>
  <path d="M797.4,396 L797.4,423.0 L797.5,423.0 L797.5,450" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M329.0,191 L329.0,290 L135.0,290 L135.0,330" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M387.0,191 L387.0,290 L365.0,290 L365.0,330" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M445.0,191 L445.0,290 L590.0,290 L590.0,330" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M503.0,191 L503.0,290 L825.0,290 L825.0,330" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M561.0,191 L561.0,290 L1065.0,290 L1065.0,330" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M93.0,396 L93.0,493.0 L90.0,493.0 L90.0,590" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="100" y="500" font-size="11" fill="#475569">查</text>
  <path d="M270,609.8 L290.0,609.8 L290.0,612.0 L310,612.0" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M435.0,700 L435.0,720.0 L435.0,720.0 L435.0,740" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M150.0,700 L150.0,678.0 L150.0,678.0 L150.0,656" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="154.0" y="674.0" font-size="11" fill="#475569">产出</text>
  <path d="M150.0,766 L150.0,788.0 L150.0,788.0 L150.0,810" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M270,752.8 L290,752.8 L290,862.5 L310,862.5" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="262" y="792" font-size="11" fill="#475569">收集</text>
  <path d="M940,382.8 L915,382.8 L915,622.5 L890,622.5" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="880" y="520" font-size="11" fill="#475569">委托</text>
  <path d="M765.0,700 L765.0,677.5 L765.0,677.5 L765.0,655" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M890,740.0 L915.0,740.0 L915.0,724.3 L940,724.3" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <path d="M1055.0,700 L1055.0,662.5 L1055.0,662.5 L1055.0,625" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="1059.0" y="658.5" font-size="11" fill="#475569">读权限码</text>
  <path d="M640,622.5 L600.0,622.5 L600.0,612.0 L560,612.0" fill="none" stroke="#475569" marker-end="url(#arr)"/>
  <text x="604.0" y="613.2" font-size="11" fill="#475569">读</text>
  <rect x="40" y="90" width="210" height="42" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="145.0" y="105" text-anchor="middle" font-size="10.5" fill="#475569">«Spring Security»</text>
  <text x="145.0" y="123" text-anchor="middle" font-weight="600" fill="#475569">SecurityFilterChain</text>
  <rect x="300" y="80" width="290" height="111" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="445.0" y="99" text-anchor="middle" font-weight="600" fill="#1e3a8a">GatewayChainBuilder</text>
  <line x1="300" y1="108" x2="590" y2="108" stroke="#3b82f6"/>
  <text x="308" y="123" font-size="11" fill="#1e3a8a">+ chain(http, realm, prefix)</text>
  <text x="308" y="138" font-size="11" fill="#1e3a8a">+ publicPaths(paths)</text>
  <text x="308" y="153" font-size="11" fill="#1e3a8a">+ authentication(filter)</text>
  <text x="308" y="168" font-size="11" fill="#1e3a8a">+ afterAuthentication(filters…)</text>
  <text x="308" y="183" font-size="11" fill="#1e3a8a">+ build(): SecurityFilterChain</text>
  <rect x="660" y="80" width="250" height="65" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="785.0" y="95" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«interface»</text>
  <text x="785.0" y="113" text-anchor="middle" font-weight="600" fill="#1e3a8a">GatewaySecurityAdapter</text>
  <line x1="660" y1="122" x2="910" y2="122" stroke="#3b82f6"/>
  <text x="668" y="137" font-size="11" fill="#1e3a8a">+ install(end, pipeline)</text>
  <rect x="660" y="190" width="250" height="51" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="785.0" y="209" text-anchor="middle" font-weight="600" fill="#1e3a8a">SpringSecurityAdapter</text>
  <line x1="660" y1="218" x2="910" y2="218" stroke="#3b82f6"/>
  <text x="668" y="233" font-size="11" fill="#1e3a8a">每端生成一条过滤器链</text>
  <rect x="950" y="190" width="220" height="51" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1060.0" y="209" text-anchor="middle" font-weight="600" fill="#64748b">其他权限框架的适配器</text>
  <line x1="950" y1="218" x2="1170" y2="218" stroke="#94a3b8"/>
  <text x="958" y="233" font-size="11" fill="#64748b">预留：实现同一接口即可接入</text>
  <rect x="30" y="330" width="210" height="66" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135.0" y="349" text-anchor="middle" font-weight="600" fill="#1e3a8a">GatewayRouteFilter</text>
  <line x1="30" y1="358" x2="240" y2="358" stroke="#3b82f6"/>
  <text x="38" y="373" font-size="11" fill="#1e3a8a">① 查资源索引定位</text>
  <text x="38" y="388" font-size="11" fill="#1e3a8a">查不到 → 404</text>
  <rect x="260" y="330" width="210" height="95" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="365.0" y="345" text-anchor="middle" font-size="10.5" fill="#1e293b">«abstract»</text>
  <text x="365.0" y="363" text-anchor="middle" font-weight="600" fill="#1e293b">AbstractTokenAuthFilter</text>
  <line x1="260" y1="372" x2="470" y2="372" stroke="#64748b"/>
  <text x="268" y="387" font-size="11" fill="#1e293b">② 取令牌 → 查会话</text>
  <text x="268" y="402" font-size="11" fill="#1e293b"># authenticate(user)</text>
  <text x="268" y="417" font-size="11" fill="#1e293b"># clientCode(req)</text>
  <rect x="490" y="330" width="200" height="66" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="590.0" y="349" text-anchor="middle" font-weight="600" fill="#1e293b">BizContextFilter</text>
  <line x1="490" y1="358" x2="690" y2="358" stroke="#64748b"/>
  <text x="498" y="373" font-size="11" fill="#1e293b">③ 仅 B 端</text>
  <text x="498" y="388" font-size="11" fill="#1e293b">X-Store-No → BizContext</text>
  <rect x="710" y="330" width="230" height="66" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="825.0" y="349" text-anchor="middle" font-weight="600" fill="#1e3a8a">GatewayAuthorizationManager</text>
  <line x1="710" y1="358" x2="940" y2="358" stroke="#3b82f6"/>
  <text x="718" y="373" font-size="11" fill="#1e3a8a">④ 提前判权</text>
  <text x="718" y="388" font-size="11" fill="#1e3a8a">+ authorize(auth, ctx)</text>
  <rect x="960" y="330" width="210" height="66" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1065.0" y="349" text-anchor="middle" font-weight="600" fill="#1e3a8a">GatewayInvokeFilter</text>
  <line x1="960" y1="358" x2="1170" y2="358" stroke="#3b82f6"/>
  <text x="968" y="373" font-size="11" fill="#1e3a8a">⑤ 调用：按位置选调用器</text>
  <text x="968" y="388" font-size="11" fill="#1e3a8a">本地入口或微服务</text>
  <rect x="260" y="470" width="210" height="81" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="365.0" y="489" text-anchor="middle" font-weight="600" fill="#1e293b">三端子类</text>
  <line x1="260" y1="498" x2="470" y2="498" stroke="#64748b"/>
  <text x="268" y="513" font-size="11" fill="#1e293b">ConsumerTokenAuthFilter</text>
  <text x="268" y="528" font-size="11" fill="#1e293b">MerchantTokenAuthFilter</text>
  <text x="268" y="543" font-size="11" fill="#1e293b">OperatorTokenAuthFilter</text>
  <rect x="700" y="450" width="195" height="42" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="797.5" y="465" text-anchor="middle" font-size="10.5" fill="#475569">«Spring Security»</text>
  <text x="797.5" y="483" text-anchor="middle" font-weight="600" fill="#475569">AuthorizationManager</text>
  <rect x="30" y="590" width="240" height="66" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150.0" y="609" text-anchor="middle" font-weight="600" fill="#1e3a8a">ResourceIndex</text>
  <line x1="30" y1="618" x2="270" y2="618" stroke="#3b82f6"/>
  <text x="38" y="633" font-size="11" fill="#1e3a8a">+ locate(method, path): ApiResource</text>
  <text x="38" y="648" font-size="11" fill="#1e3a8a">启动后不变，放在本地内存</text>
  <rect x="310" y="590" width="250" height="110" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="435.0" y="605" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«record»</text>
  <text x="435.0" y="623" text-anchor="middle" font-weight="600" fill="#1e3a8a">ApiResource</text>
  <line x1="310" y1="632" x2="560" y2="632" stroke="#3b82f6"/>
  <text x="318" y="647" font-size="11" fill="#1e3a8a">method, pattern</text>
  <text x="318" y="662" font-size="11" fill="#1e3a8a">location: LOCAL 或 服务名</text>
  <text x="318" y="677" font-size="11" fill="#1e3a8a">access: PUBLIC / LOGIN / POINT / DEFER</text>
  <text x="318" y="692" font-size="11" fill="#1e3a8a">rule: PermRule</text>
  <rect x="310" y="740" width="250" height="66" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="435.0" y="759" text-anchor="middle" font-weight="600" fill="#1e3a8a">PermRule</text>
  <line x1="310" y1="768" x2="560" y2="768" stroke="#3b82f6"/>
  <text x="318" y="783" font-size="11" fill="#1e3a8a">权限码的与或式</text>
  <text x="318" y="798" font-size="11" fill="#1e3a8a">+ test(has): boolean</text>
  <rect x="30" y="700" width="240" height="66" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150.0" y="719" text-anchor="middle" font-weight="600" fill="#1e3a8a">ResourceIndexBuilder</text>
  <line x1="30" y1="728" x2="270" y2="728" stroke="#3b82f6"/>
  <text x="38" y="743" font-size="11" fill="#1e3a8a">+ build(): ResourceIndex</text>
  <text x="38" y="758" font-size="11" fill="#1e3a8a">扫本地入口 + 并入透传路由</text>
  <rect x="30" y="810" width="240" height="51" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150.0" y="829" text-anchor="middle" font-weight="600" fill="#1e3a8a">PermRuleParser</text>
  <line x1="30" y1="838" x2="270" y2="838" stroke="#3b82f6"/>
  <text x="38" y="853" font-size="11" fill="#1e3a8a">解析 @PreAuthorize 的表达式</text>
  <rect x="310" y="830" width="250" height="65" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="435.0" y="845" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«interface»</text>
  <text x="435.0" y="863" text-anchor="middle" font-weight="600" fill="#1e3a8a">GatewayRouteProvider</text>
  <line x1="310" y1="872" x2="560" y2="872" stroke="#3b82f6"/>
  <text x="318" y="887" font-size="11" fill="#1e3a8a">+ routes(): List&lt;GatewayRoute&gt;</text>
  <rect x="640" y="590" width="250" height="65" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="765.0" y="605" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«interface»</text>
  <text x="765.0" y="623" text-anchor="middle" font-weight="600" fill="#1e3a8a">AccessDecider</text>
  <line x1="640" y1="632" x2="890" y2="632" stroke="#3b82f6"/>
  <text x="648" y="647" font-size="11" fill="#1e3a8a">+ decide(user, resource): Decision</text>
  <rect x="640" y="700" width="250" height="80" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="765.0" y="715" text-anchor="middle" font-size="10.5" fill="#1e3a8a">«abstract»</text>
  <text x="765.0" y="733" text-anchor="middle" font-weight="600" fill="#1e3a8a">AbstractAccessDecider</text>
  <line x1="640" y1="742" x2="890" y2="742" stroke="#3b82f6"/>
  <text x="648" y="757" font-size="11" fill="#1e3a8a">流程固定：公开 → 登录 → 权限式</text>
  <text x="648" y="772" font-size="11" fill="#1e3a8a"># has(code)　三端子类各自实现</text>
  <rect x="940" y="700" width="230" height="81" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="1055.0" y="719" text-anchor="middle" font-weight="600" fill="#1e293b">PermChecker（bean: perm）</text>
  <line x1="940" y1="728" x2="1170" y2="728" stroke="#64748b"/>
  <text x="948" y="743" font-size="11" fill="#1e293b">+ can(code)</text>
  <text x="948" y="758" font-size="11" fill="#1e293b">+ canBiz(code)</text>
  <text x="948" y="773" font-size="11" fill="#1e293b">+ canAnyBiz(codes…)</text>
  <rect x="940" y="560" width="230" height="65" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="1055.0" y="575" text-anchor="middle" font-size="10.5" fill="#1e293b">«record · 实现 neargo PermissionCarrier»</text>
  <text x="1055.0" y="593" text-anchor="middle" font-weight="600" fill="#1e293b">LoginUser</text>
  <line x1="940" y1="602" x2="1170" y2="602" stroke="#64748b"/>
  <text x="948" y="617" font-size="11" fill="#1e293b">roles, perms, dataScope</text>
  <text x="40" y="283" font-size="11" fill="#475569">按顺序装配 ①–⑤</text>
  <text x="640" y="812" font-size="11" fill="#475569">方法上的 @PreAuthorize 仍由 Spring 方法安全执行，</text>
  <text x="640" y="828" font-size="11" fill="#475569">调用的是同一个 PermChecker。</text>
</svg>
