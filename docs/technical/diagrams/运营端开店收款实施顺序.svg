<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="240" viewBox="0 0 1220 240" role="img" aria-labelledby="title desc">
  <title id="title">运营端开店收款实施顺序</title>
  <desc id="desc">依次为系统维护、套餐维护、代客创建门店、进件、开通支付，最后使用同一间门店验收代客购买套餐及权益。ai-shop 承担宿主及商城，独立 near-pay 承担支付进件与开通。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <rect width="1220" height="240" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" text-anchor="middle">
    <text x="610" y="33" font-size="19" font-weight="600" fill="#0f172a">运营先维护，再用同一间普通门店完成办理与验收</text>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="20" y="67" width="180" height="104" rx="12"/>
      <rect x="220" y="67" width="180" height="104" rx="12"/>
      <rect x="420" y="67" width="180" height="104" rx="12"/>
      <rect x="620" y="67" width="180" height="104" rx="12"/>
      <rect x="820" y="67" width="180" height="104" rx="12"/>
      <rect x="1020" y="67" width="180" height="104" rx="12"/>
    </g>
    <g font-size="17" font-weight="600" fill="#0f172a">
      <text x="110" y="100">1 系统维护</text><text x="310" y="100">2 套餐维护</text>
      <text x="510" y="100">3 代客创建门店</text><text x="710" y="100">4 进件</text>
      <text x="910" y="100">5 开通支付</text><text x="1110" y="100">6 购买套餐验收</text>
    </g>
    <g font-size="13" fill="#475569">
      <text x="110" y="127">市场 / 行业 / 权限 / 环境</text><text x="110" y="150">两系统按职责维护</text>
      <text x="310" y="127">FREE / 付费方案 / SKU</text><text x="310" y="150">ai-shop</text>
      <text x="510" y="127">STORE_V1 + FREE</text><text x="510" y="150">ai-shop</text>
      <text x="710" y="127">来源 / 材料 / 审核 / 送件</text><text x="710" y="150">ai-shop → near-pay</text>
      <text x="910" y="127">账户 / 凭据 / 产品 / 绑定</text><text x="910" y="150">独立 near-pay</text>
      <text x="1110" y="127">平台实收 → 门店权益</text><text x="1110" y="150">ai-shop</text>
    </g>
    <text x="610" y="211" font-size="14" fill="#475569">门店经营收款与平台套餐收款分别验收；办理顺序不增加套餐购买的收款开户前置。</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M202 119 H216"/><path d="M402 119 H416"/><path d="M602 119 H616"/><path d="M802 119 H816"/><path d="M1002 119 H1016"/>
  </g>
</svg>
