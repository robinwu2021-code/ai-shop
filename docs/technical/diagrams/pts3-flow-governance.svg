<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1070" viewBox="0 0 1640 1070"><title>运营调账停发及可靠恢复</title><desc>运营调整、门禁无动作分支、事件重复/乱序/崩溃以及未知资金恢复。</desc>
<defs><marker id="point" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker><marker id="money" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#c2410c"/></marker><marker id="dep" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b"/></marker><marker id="real" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="white" stroke="#475569"/></marker><marker id="diamond" markerWidth="15" markerHeight="10" refX="14" refY="5" orient="auto-start-reverse"><path d="M0 5L7 0L14 5L7 10Z" fill="#475569"/></marker></defs>
<rect width="1640" height="1070" fill="#f8fafc"/>
<text x="35" y="48" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="29" fill="#172554" font-weight="650" text-anchor="start">运营调账停发及可靠恢复</text>
<text x="35" y="80" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526277" font-weight="400" text-anchor="start">v3 设计契约 · pay-domain内业务模块 · payTxManager · 实现与验收状态见 TDD</text>
<text x="35" y="138" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">运营调账</text>
<rect x="35.0" y="150" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35.0" y="150" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="51.0" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">双人审批与审计</text>
<text x="51.0" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">审批人与提交人不同</text>
<rect x="565.6666666666667" y="150" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="565.6666666666667" y="150" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="581.6666666666667" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">正调账</text>
<text x="581.6666666666667" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">ISSUE→USER.A</text>
<text x="581.6666666666667" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">U→C</text>
<rect x="1096.3333333333335" y="150" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="1096.3333333333335" y="150" width="6" height="170" rx="3" fill="#2563eb"/>
<text x="1112.3333333333335" y="179" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#2563eb" font-weight="650" text-anchor="start">负调账</text>
<text x="1112.3333333333335" y="205" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">USER.A→ISSUE</text>
<text x="1112.3333333333335" y="228" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">C→U，不能扣负</text>
<text x="35" y="355" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">正负调账是独立分支，分别双人审批；正向需已有U，不是无资金赠分。冻结不取消已有责任。</text>
<text x="35" y="423" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">门禁与失败</text>
<rect x="35.0" y="435" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35.0" y="435" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="51.0" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">种类/协议/能力</text>
<text x="51.0" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">发放不要求协议</text>
<text x="51.0" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">核销必须签协议</text>
<rect x="565.6666666666667" y="435" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#be123c" stroke-width="1.8"/>
<rect x="565.6666666666667" y="435" width="6" height="170" rx="3" fill="#be123c"/>
<text x="581.6666666666667" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#be123c" font-weight="650" text-anchor="start">不足或暂停</text>
<text x="581.6666666666667" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">返分记SKIPPED</text>
<text x="581.6666666666667" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">hold原子返回无抵扣</text>
<path d="M523.6666666666667,520 L565.6666666666667,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1096.3333333333335" y="435" width="488.6666666666667" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="1096.3333333333335" y="435" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="1112.3333333333335" y="464" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">展示实际应付</text>
<text x="1112.3333333333335" y="490" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">金额按实际hold结果</text>
<text x="1112.3333333333335" y="513" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不得静默提高支付额</text>
<path d="M1054.3333333333335,520 L1096.3333333333335,520" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="640" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">线下不发/不抵；不足只影响新的承诺，退款、释放、追回等资金收尾继续运行。</text>
<text x="35" y="708" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="22" fill="#172554" font-weight="650" text-anchor="start">事件与资金恢复</text>
<rect x="35.0" y="720" width="356.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="35.0" y="720" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="51.0" y="749" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">源事务Outbox</text>
<text x="51.0" y="775" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">订单/支付各自落事件</text>
<rect x="433.0" y="720" width="356.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="433.0" y="720" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="449.0" y="749" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">积分Inbox＋过账</text>
<text x="449.0" y="775" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">同payTx提交</text>
<text x="449.0" y="798" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">重复hash冲突拒绝</text>
<path d="M391.0,805 L433.0,805" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="831.0" y="720" width="356.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="831.0" y="720" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="847.0" y="749" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">UNKNOWN 查询</text>
<text x="847.0" y="775" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">付款/退款结果不明</text>
<text x="847.0" y="798" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">不重付不提前撤销</text>
<path d="M789.0,805 L831.0,805" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<rect x="1229.0" y="720" width="356.0" height="170" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="1229.0" y="720" width="6" height="170" rx="3" fill="#7c3aed"/>
<text x="1245.0" y="749" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#7c3aed" font-weight="650" text-anchor="start">事实巡检补偿</text>
<text x="1245.0" y="775" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">漏发/已付仍H/无单占用</text>
<text x="1245.0" y="798" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#526277" font-weight="400" text-anchor="start">按原命令重放</text>
<path d="M1187.0,805 L1229.0,805" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#point)"/>
<text x="35" y="925" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#526277" font-weight="400" text-anchor="start">订单与pay跨域不共享事务，结算与积分在pay内经Hook同步。对账核源事实与外部证据。</text>
<text x="35" y="1046" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#be123c" font-weight="400" text-anchor="start">资金证据不明确时保留原意图/占用；不假记到账、不改同一幂等请求金额。</text>
</svg>
