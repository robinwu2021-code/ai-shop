<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>支付服务架构：六类接入端 · 接入 · 应用 · 收款账户决策 · 通道 · 资金后台</title>
<desc>六层。第三方、内部系统、自研刷卡机、商户端、运营端、扫码 H5 各走自己的入口与凭证；退款由商户侧发起、运营端只复核；解析成统一的调用方，过能力矩阵后进同一个应用服务；收款账户决策层按市场、支付方式、商户进件选出唯一的收款账户，并把资金模式冻结到收单单上；通道层的每个调用都带着那个账户的密钥；资金后台按资金模式分两条结算路径。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.t{font-size:10.5px;fill:#5A6472}
.b{font-size:11px;fill:#8A94A2;letter-spacing:.12em}
.box{fill:#fff;stroke:#D8DEE6;stroke-width:1.2}
.key{fill:#F2F8F4;stroke:#7FB894;stroke-width:1.4}
.new{fill:#FDF6EC;stroke:#E0B27A;stroke-width:1.2}
.old{fill:#F5F6F8;stroke:#D8DEE6;stroke-width:1.2}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.band{stroke:#EDEFF2;stroke-width:1}
</style></defs>

<text class="b" x="26" y="24">① 六类接入端</text>
<rect class="box" x="26" y="32" width="133" height="44" rx="7"/><text class="n" x="37" y="51">第三方系统</text><text class="t" x="37" y="67">AppId + 密钥签名</text>
<rect class="box" x="165" y="32" width="133" height="44" rx="7"/><text class="n" x="176" y="51">内部系统</text><text class="t" x="176" y="67">商城 · 餐饮 · 储值</text>
<rect class="box" x="304" y="32" width="133" height="44" rx="7"/><text class="n" x="315" y="51">刷卡机（自研）</text><text class="t" x="315" y="67">终端号 + 设备密钥</text>
<rect class="box" x="443" y="32" width="133" height="44" rx="7"/><text class="n" x="454" y="51">商户端</text><text class="t" x="454" y="67">发起退款 · 本店报表</text>
<rect class="box" x="582" y="32" width="133" height="44" rx="7"/><text class="n" x="593" y="51">运营端</text><text class="t" x="593" y="67">复核 · 出款 · 配规则</text>
<rect class="box" x="721" y="32" width="133" height="44" rx="7"/><text class="n" x="732" y="51">扫码 H5</text><text class="t" x="732" y="67">统一支付落地页</text>
<line class="band" x1="26" y1="88" x2="854" y2="88"/>

<text class="b" x="26" y="106">② 接入层 —— 一个入口只认一种凭证</text>
<rect class="new" x="26" y="114" width="133" height="44" rx="7"/><text class="n" x="37" y="133">/open/pay/v1</text><text class="t" x="37" y="149">验签 · nonce · 幂等</text>
<rect class="old" x="165" y="114" width="133" height="44" rx="7"/><text class="n" x="176" y="133">/internal/pay</text><text class="t" x="176" y="149">服务令牌 / 内嵌</text>
<rect class="new" x="304" y="114" width="133" height="44" rx="7"/><text class="n" x="315" y="133">/terminal/pay/v1</text><text class="t" x="315" y="149">设备签名 · 店长码</text>
<rect class="new" x="443" y="114" width="133" height="44" rx="7"/><text class="n" x="454" y="133">/merchant/pay</text><text class="t" x="454" y="149">商户会话 · 权限码</text>
<rect class="new" x="582" y="114" width="133" height="44" rx="7"/><text class="n" x="593" y="133">/ops/pay</text><text class="t" x="593" y="149">权限码 · 两人复核</text>
<rect class="new" x="721" y="114" width="133" height="44" rx="7"/><text class="n" x="732" y="133">/checkout/v1</text><text class="t" x="732" y="149">公开 · 一次性令牌</text>
<line class="band" x1="26" y1="170" x2="854" y2="170"/>

<text class="b" x="102" y="186">③ 应用层</text>
<rect class="new" x="26" y="196" width="828" height="44" rx="7"/><text class="n" x="40" y="215">PaymentAppService + CallerPolicy</text><text class="t" x="40" y="231">类型 × 动作 × 商户/门店范围 → 建单 · 查单 · 关单 · 撤销 · 退款申请 →（命中复核规则）两人复核 → 发往通道；每张单记来源</text>
<line class="band" x1="26" y1="252" x2="854" y2="252"/>

<text class="b" x="26" y="270">④ 收款账户决策 —— 本次架构的核心</text>
<rect class="key" x="26" y="278" width="828" height="58" rx="7"/>
<text class="n" x="40" y="298">CollectionAccountResolver：市场 + 支付方式 + 商户/门店 → 唯一可收款的收款账户（mch_payment_merchant）</text>
<text class="t" x="40" y="316">账户携带：通道 · 资金模式 DIRECT / PLATFORM · 密钥引用 · 进件状态。选中后把 账户号 + 资金模式 + 密钥版本 冻结到收单单</text>
<text class="t" x="40" y="330">退款、查单、对账永远用收单单上冻结的那个账户 —— 商户换了模式也不影响在途单</text>
<line class="band" x1="26" y1="348" x2="854" y2="348"/>

<text class="b" x="26" y="366">⑤ 通道层 —— 每次调用都带账户上下文，网关本身无状态</text>
<rect class="new" x="26" y="374" width="196" height="54" rx="7"/><text class="n" x="40" y="394">TW · 蓝新 NewebPay</text><text class="t" x="40" y="410">仅 DIRECT · 商户自己的</text><text class="t" x="40" y="423">商店代号 + HashKey/IV</text>
<rect class="new" x="234" y="374" width="196" height="54" rx="7"/><text class="n" x="248" y="394">TW · LINE Pay 直连</text><text class="t" x="248" y="410">仅 DIRECT · 商户自己的</text><text class="t" x="248" y="423">ChannelId + ChannelSecret</text>
<rect class="new" x="442" y="374" width="196" height="54" rx="7"/><text class="n" x="456" y="394">AE · PayBy</text><text class="t" x="456" y="410">DIRECT：商户自签 Partner-Id</text><text class="t" x="456" y="423">PLATFORM：平台账户 + 子商户</text>
<rect class="old" x="650" y="374" width="204" height="54" rx="7"/><text class="n" x="664" y="394">CN · 微信 / 支付宝</text><text class="t" x="664" y="410">现有收付通，补差 + 分账</text><text class="t" x="664" y="423">行为不变</text>
<line class="band" x1="26" y1="440" x2="854" y2="440"/>

<text class="b" x="26" y="458">⑥ 资金后台 —— 按资金模式分两条结算路径</text>
<rect class="key" x="26" y="466" width="300" height="62" rx="7"/><text class="n" x="40" y="486">DIRECT：钱直入商户</text><text class="t" x="40" y="503">核对型结算单（应收 vs 通道实际撥款）</text><text class="t" x="40" y="518">+ 平台费应收单（向商户收平台费）</text>
<rect class="key" x="342" y="466" width="250" height="62" rx="7"/><text class="n" x="356" y="486">PLATFORM：平台代收</text><text class="t" x="356" y="503">出款型结算单：净额 = 毛额 − 退款</text><text class="t" x="356" y="518">− 通道费 − 平台费 → 出款到商户 IBAN</text>
<rect class="new" x="608" y="466" width="246" height="62" rx="7"/><text class="n" x="622" y="486">流水 + 四层对账</text><text class="t" x="622" y="503">只增不改，可按来源切；交易 / 资金</text><text class="t" x="622" y="518">/ 商户 / 终端日结；StatementAppService</text>

<path class="ar" d="M92 158 V190" marker-end="url(#ar)"/>
<path class="ar" d="M231 158 V190" marker-end="url(#ar)"/>
<path class="ar" d="M370 158 V190" marker-end="url(#ar)"/>
<path class="ar" d="M509 158 V190" marker-end="url(#ar)"/>
<path class="ar" d="M648 158 V190" marker-end="url(#ar)"/>
<path class="ar" d="M787 158 V190" marker-end="url(#ar)"/>
<path class="ar" d="M286 240 V272" marker-end="url(#ar)"/>
<path class="ar" d="M440 336 V368" marker-end="url(#ar)"/>
<text class="t" x="26" y="556">图例：</text>
<rect class="new" x="66" y="546" width="16" height="12" rx="3"/><text class="t" x="88" y="556">新增</text>
<rect class="key" x="126" y="546" width="16" height="12" rx="3"/><text class="t" x="148" y="556">关键决策 / 资金分叉</text>
<rect class="old" x="258" y="546" width="16" height="12" rx="3"/><text class="t" x="280" y="556">现有，复用</text>
<text class="t" x="26" y="582">TW 只有 DIRECT：蓝新、LINE Pay 的钱都不经过平台。AE 的 PayBy 由商户进件结果决定 DIRECT 或 PLATFORM，同一时刻只有一个能收款。</text>
</svg>
