<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分域对象模型</title>
<desc>上层是主数据与规则：区域、积分种类、受理协议，以及闸门、返分、抵扣、退款比例、到期、结算单策略，它们只计算不写库。中层是凭证工厂产出构造即校验守恒的凭证，交给唯一写入口过账服务。下层是领域对象：积分户（发放户、C 端户、门店户、接收户、发行登记）与积分流水；平台积分专户四格与专户流水；发放与核销头寸；门店积分结算单与待追回。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.da{stroke:#8A94A2;stroke-width:1.2;fill:none;stroke-dasharray:4 3}</style></defs>
<rect width="800" height="470" fill="#FFFFFF"/>

<text class="g" x="16" y="24">主数据</text>
<rect x="16" y="38" width="160" height="40" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="96" y="63" text-anchor="middle">区域（币种 · 时区）</text>
<rect x="16" y="90" width="160" height="40" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="96" y="115" text-anchor="middle">积分种类（比例锁定）</text>
<rect x="16" y="142" width="160" height="56" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="96" y="165" text-anchor="middle">受理协议</text>
<text class="s" x="96" y="183" text-anchor="middle">随单 / 定期 · 全额兑付</text>

<text class="g" x="210" y="24">规则与闸门（只算，不写库）</text>
<rect x="210" y="38" width="574" height="40" rx="8" fill="#F7F9FB" stroke="#C9D1DB"/>
<text class="n" x="272" y="63" text-anchor="middle">Gate</text>
<text class="n" x="350" y="63" text-anchor="middle">Earn</text>
<text class="n" x="432" y="63" text-anchor="middle">Redeem</text>
<text class="n" x="530" y="63" text-anchor="middle">RefundRatio</text>
<text class="n" x="630" y="63" text-anchor="middle">Expiry</text>
<text class="n" x="724" y="63" text-anchor="middle">Statement</text>

<rect x="210" y="126" width="170" height="72" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="295" y="152" text-anchor="middle">VoucherFactory</text>
<text class="s" x="295" y="170" text-anchor="middle">19 种凭证模板</text>
<rect x="420" y="126" width="170" height="72" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="505" y="148" text-anchor="middle">Voucher</text>
<text class="s" x="505" y="166" text-anchor="middle">积分守恒 · 资金对应</text>
<text class="s" x="505" y="182" text-anchor="middle">biz_ref 幂等</text>
<rect x="630" y="126" width="154" height="72" rx="6" fill="#FBEDED" stroke="#D08C8C"/>
<text class="n" x="707" y="152" text-anchor="middle">PostingService</text>
<text class="s" x="707" y="170" text-anchor="middle">唯一写入口</text>
<text class="s" x="707" y="186" text-anchor="middle">条件更新，0 行即回滚</text>
<path class="ar" d="M497 78 L320 124" marker-end="url(#a)"/>
<path class="ar" d="M380 162 L418 162" marker-end="url(#a)"/>
<path class="ar" d="M590 162 L628 162" marker-end="url(#a)"/>
<path class="da" d="M176 120 L208 150" marker-end="url(#a)"/>
<path class="da" d="M176 170 L208 166" marker-end="url(#a)"/>

<text class="g" x="16" y="244">领域对象（分别交付，同一入口写）</text>
<rect x="16" y="258" width="250" height="140" rx="8" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="141" y="282" text-anchor="middle">积分户 + 积分流水</text>
<text class="s" x="141" y="304" text-anchor="middle">平台发放户 · 平台接收户 · 发行登记</text>
<text class="s" x="141" y="322" text-anchor="middle">C 端户：待生效 / 可用 / 占用</text>
<text class="s" x="141" y="340" text-anchor="middle">门店户：待确认 / 待结算</text>
<text class="s" x="141" y="366" text-anchor="middle">所有户合计恒为 0</text>
<text class="s" x="141" y="384" text-anchor="middle">流水只增不改</text>
<rect x="282" y="258" width="236" height="140" rx="8" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="400" y="282" text-anchor="middle">平台积分专户 + 专户流水</text>
<text class="s" x="400" y="304" text-anchor="middle">U 未分配 · C 已承诺</text>
<text class="s" x="400" y="322" text-anchor="middle">D 待付商家 · R 待追回</text>
<text class="s" x="400" y="348" text-anchor="middle">U == m(发放户)</text>
<text class="s" x="400" y="366" text-anchor="middle">C + R == m(C 端 + 门店)</text>
<text class="s" x="400" y="384" text-anchor="middle">划拨单按日汇总真钱动作</text>
<rect x="534" y="258" width="250" height="140" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="659" y="282" text-anchor="middle">头寸 · 结算单 · 待追回</text>
<text class="s" x="659" y="304" text-anchor="middle">发放头寸：发 / 转正 / 收回 / 停发</text>
<text class="s" x="659" y="322" text-anchor="middle">核销头寸：占 / 兑付 / 付款 / 反转 / 退回</text>
<text class="s" x="659" y="348" text-anchor="middle">门店积分结算单：出单 → 确认 → 打款</text>
<text class="s" x="659" y="366" text-anchor="middle">待追回：按商家，下期冲减</text>
<path class="ar" d="M670 198 L160 256" marker-end="url(#a)"/>
<path class="ar" d="M690 198 L420 256" marker-end="url(#a)"/>
<path class="ar" d="M710 198 L670 256" marker-end="url(#a)"/>
<text class="s" x="16" y="430">一张凭证在一个事务里同时改头寸、积分户、专户：顺序固定为 头寸 → 用户 / 门店户 → 平台户 → 专户（最热的放最后）。</text>
<text class="s" x="16" y="450">核销头寸在支付时落定结算方式；协议之后再变，只影响将来的订单。</text>
</svg>
