<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>积分域对象模型</title>
<desc>上层是规则与闸门（闸门、返分、抵扣、退款比例、到期），它们只计算不写库；中层是凭证工厂产出已校验平衡的凭证，交给唯一写入口过账服务；下层是三个领域对象：用户积分账户与积分流水、资金池与池子流水、发放与占用头寸。左侧积分种类绑定区域与币种，为凭证提供兑换比例。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>.n{font-size:12.5px;font-weight:500;fill:#161A21}.s{font-size:10.5px;fill:#5A6472}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.da{stroke:#8A94A2;stroke-width:1.2;fill:none;stroke-dasharray:4 3}</style></defs>
<rect width="780" height="440" fill="#FFFFFF"/>

<!-- 左：种类 -->
<text class="g" x="16" y="24">主数据</text>
<rect x="16" y="40" width="150" height="56" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="91" y="64" text-anchor="middle">区域 Market</text>
<text class="s" x="91" y="82" text-anchor="middle">币种 · 小数位 · 时区</text>
<rect x="16" y="130" width="150" height="72" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="91" y="154" text-anchor="middle">积分种类 PointType</text>
<text class="s" x="91" y="172" text-anchor="middle">兑换比例（生效后锁定）</text>
<text class="s" x="91" y="188" text-anchor="middle">抵扣比例 · 闲置天数</text>
<path class="ar" d="M91 96 L91 128" marker-end="url(#a)"/>

<!-- 上：规则 -->
<text class="g" x="210" y="24">规则与闸门（只算，不写库）</text>
<rect x="210" y="40" width="554" height="56" rx="8" fill="#F7F9FB" stroke="#C9D1DB"/>
<text class="n" x="290" y="73" text-anchor="middle">PointsGate</text>
<text class="n" x="398" y="73" text-anchor="middle">EarnPolicy</text>
<text class="n" x="508" y="73" text-anchor="middle">RedeemPolicy</text>
<text class="n" x="628" y="73" text-anchor="middle">RefundRatioPolicy</text>
<text class="n" x="728" y="73" text-anchor="middle">Expiry</text>

<!-- 中：凭证 -->
<rect x="210" y="130" width="170" height="72" rx="6" fill="#FFFFFF" stroke="#8FB3C9"/>
<text class="n" x="295" y="156" text-anchor="middle">VoucherFactory</text>
<text class="s" x="295" y="174" text-anchor="middle">13 种凭证模板</text>
<rect x="420" y="130" width="150" height="72" rx="6" fill="#FFF7E8" stroke="#C8A86B"/>
<text class="n" x="495" y="156" text-anchor="middle">Voucher</text>
<text class="s" x="495" y="174" text-anchor="middle">构造即校验平衡</text>
<text class="s" x="495" y="190" text-anchor="middle">biz_ref 幂等</text>
<rect x="610" y="130" width="154" height="72" rx="6" fill="#FBEDED" stroke="#D08C8C"/>
<text class="n" x="687" y="156" text-anchor="middle">PostingService</text>
<text class="s" x="687" y="174" text-anchor="middle">唯一写入口</text>
<text class="s" x="687" y="190" text-anchor="middle">条件更新，0 行即回滚</text>
<path class="ar" d="M487 96 L320 128" marker-end="url(#a)"/>
<text class="l" x="420" y="114">算出数量</text>
<path class="ar" d="M380 166 L418 166" marker-end="url(#a)"/>
<path class="ar" d="M570 166 L608 166" marker-end="url(#a)"/>
<path class="da" d="M166 166 L208 166" marker-end="url(#a)"/>
<text class="l" x="187" y="158" text-anchor="middle">比例</text>

<!-- 下：三个对象 -->
<text class="g" x="16" y="262">三个领域对象（分别交付，同一入口写）</text>
<rect x="16" y="278" width="236" height="110" rx="8" fill="#F3EEF8" stroke="#B49CCB"/>
<text class="n" x="134" y="302" text-anchor="middle">积分账户 PointsAccount</text>
<text class="s" x="134" y="320" text-anchor="middle">用户 × 种类：P · A · H · 到期</text>
<line x1="32" y1="334" x2="236" y2="334" stroke="#D9CFE5"/>
<text class="n" x="134" y="356" text-anchor="middle">积分流水 LedgerEntry</text>
<text class="s" x="134" y="374" text-anchor="middle">只增不改 · 给用户与客服</text>
<rect x="272" y="278" width="236" height="110" rx="8" fill="#EEF5EC" stroke="#9CC193"/>
<text class="n" x="390" y="302" text-anchor="middle">资金池 FundPool</text>
<text class="s" x="390" y="320" text-anchor="middle">一种类一个：U · C · R</text>
<line x1="288" y1="334" x2="492" y2="334" stroke="#CFE3CA"/>
<text class="n" x="390" y="356" text-anchor="middle">池子流水 PoolFlow</text>
<text class="s" x="390" y="374" text-anchor="middle">只增不改 · 给财务与对账</text>
<rect x="528" y="278" width="236" height="110" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text class="n" x="646" y="302" text-anchor="middle">头寸 Position</text>
<text class="s" x="646" y="320" text-anchor="middle">按子单的累计计数器</text>
<line x1="544" y1="334" x2="748" y2="334" stroke="#E3E7EC"/>
<text class="s" x="646" y="356" text-anchor="middle">发放：发 / 转正 / 收回</text>
<text class="s" x="646" y="374" text-anchor="middle">占用：占 / 释放 / 兑付 / 退回</text>
<path class="ar" d="M650 202 L160 276" marker-end="url(#a)"/>
<path class="ar" d="M672 202 L410 276" marker-end="url(#a)"/>
<path class="ar" d="M690 202 L660 276" marker-end="url(#a)"/>
<text class="s" x="16" y="424">一张凭证在一个事务里同时改三者：顺序固定为 头寸 → 账户 → 池子（池子行最热，放最后）。</text>
</svg>
