<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>平台模式与自营模式的资金流差异</title>
<desc>同一笔 100 元订单在两种模式下的走向。平台模式：消费者付款经收付通直接进商家名下的二级商户号，平台按费率分走佣金，平台账上只认这笔服务费；对应微信「电商平台」类目，需 EDI 许可证，平台承担平台责任。自营模式：消费者付款进平台自己的商户号，全额记为平台销售收入，平台再按采购价结算给商家；对应「商家自营」类目，只需平台自己持有食品经营许可证等资质，但平台承担销售者责任、并按全额计税开票。两种模式的差别不在代码链路，而在钱先落到谁名下——这决定了资质、责任与税务口径。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.n{font-size:12.5px;font-weight:500;fill:#161A21}
.s{font-size:10.5px;fill:#5A6472}
.h{font-size:13.5px;font-weight:600;fill:#161A21}
.g{font-size:11px;fill:#7A8492;letter-spacing:.1em}
.k{font-size:10.5px;fill:#7A8492}
.v{font-size:11px;fill:#161A21}
.a{stroke:#8A94A2;stroke-width:1.3;fill:none}
</style></defs>

<rect x="0" y="0" width="720" height="404" fill="#FCFDFE"/>

<rect x="16" y="16" width="336" height="372" rx="10" fill="#FFFFFF" stroke="#C9D4DE"/>
<rect x="368" y="16" width="336" height="372" rx="10" fill="#FFFFFF" stroke="#D9C9A8"/>

<text class="h" x="40" y="46">A · 平台模式（目标态）</text>
<text class="k" x="40" y="64">与现有代码一致 · 要 EDI · 约 3 个月</text>
<text class="h" x="392" y="46">B · 自营模式（过桥）</text>
<text class="k" x="392" y="64">改业务口径 · 不改链路 · 数周</text>

<rect x="84" y="82" width="200" height="38" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="184" y="106" text-anchor="middle">消费者付款 100 元</text>
<rect x="436" y="82" width="200" height="38" rx="6" fill="#EAF1F6" stroke="#8FB3C9"/>
<text class="n" x="536" y="106" text-anchor="middle">消费者付款 100 元</text>

<path class="a" d="M184 120L184 146" marker-end="url(#ar)"/>
<path class="a" d="M536 120L536 146" marker-end="url(#ar)"/>

<rect x="84" y="146" width="200" height="52" rx="6" fill="#E6F2F0" stroke="#8FC2BA"/>
<text class="n" x="184" y="168" text-anchor="middle">收付通二级商户号</text>
<text class="s" x="184" y="186" text-anchor="middle">开在商家营业执照名下</text>

<rect x="436" y="146" width="200" height="52" rx="6" fill="#FDF3E3" stroke="#D9B87C"/>
<text class="n" x="536" y="168" text-anchor="middle">平台自己的商户号</text>
<text class="s" x="536" y="186" text-anchor="middle">100 元全额是平台收入</text>

<path class="a" d="M184 198L184 224" marker-end="url(#ar)"/>
<path class="a" d="M536 198L536 224" marker-end="url(#ar)"/>

<rect x="84" y="224" width="200" height="52" rx="6" fill="#F4F6F8" stroke="#C9D4DE"/>
<text class="n" x="184" y="246" text-anchor="middle">分账：平台抽走佣金</text>
<text class="s" x="184" y="264" text-anchor="middle">平台账上只有这笔服务费</text>

<rect x="436" y="224" width="200" height="52" rx="6" fill="#F4F6F8" stroke="#C9D4DE"/>
<text class="n" x="536" y="246" text-anchor="middle">按采购价结算给商家</text>
<text class="s" x="536" y="264" text-anchor="middle">商家是供应商，不是卖方</text>

<line x1="40" y1="296" x2="328" y2="296" stroke="#E2E8ED"/>
<line x1="392" y1="296" x2="680" y2="296" stroke="#E2E8ED"/>

<text class="k" x="40" y="318">类目</text><text class="v" x="104" y="318">电商平台</text>
<text class="k" x="40" y="340">资质</text><text class="v" x="104" y="340">EDI 许可证（平台持有）</text>
<text class="k" x="40" y="362">责任</text><text class="v" x="104" y="362">平台责任</text>
<text class="k" x="40" y="384">计税</text><text class="v" x="104" y="384">按技术服务费</text>

<text class="k" x="392" y="318">类目</text><text class="v" x="456" y="318">商家自营 + 生活服务</text>
<text class="k" x="392" y="340">资质</text><text class="v" x="456" y="340">食品经营许可证（平台持有）</text>
<text class="k" x="392" y="362">责任</text><text class="v" x="456" y="362">销售者责任</text>
<text class="k" x="392" y="384">计税</text><text class="v" x="456" y="384">按全额销售收入</text>
</svg>
