<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>从配规格到出库：七段流程与每段落下的行</title><desc>七个步骤自左向右：平台配类目与规格库、商家建 SPU、勾档位生成 SKU 矩阵、填价与外部身份、投影建账、入库过账并上架、下单预留与支付出库。每个步骤下方标出它在库里落下哪几张表的行，以及执行者是运营、商家还是系统。</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}
.bk{fill:#FFFFFF;stroke:#6E86A8;stroke-width:1.9}
.bn{fill:#FFFDF6;stroke:#D9C89A;stroke-width:1.3}
.drop{fill:#F7F9FC;stroke:#DDE3EB;stroke-width:1;stroke-dasharray:4 3}
.num{font-size:11px;font-weight:700;fill:#8FA0B5}
.n{font-size:12px;font-weight:600;fill:#161A21}
.s{font-size:10px;fill:#5A6472}
.who{font-size:9.5px;font-weight:700;fill:#3E5877}
.t{font-size:11px;font-weight:700;fill:#3A4351;letter-spacing:.05em}
.band{font-size:10.5px;fill:#7B8695}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.sep{stroke:#E6EAEF;stroke-width:1}
</style></defs>

<text class="t" x="20" y="30">七段流程　·　框内是做什么，虚线框是这一步在库里落下哪几行</text>

<rect class="bx" x="20" y="46" width="120" height="104" rx="7"/>
<text class="num" x="32" y="66">01</text><text class="who" x="128" y="66" text-anchor="end">运营</text>
<text class="n" x="32" y="88">配类目</text><text class="n" x="32" y="106">与规格库</text>
<text class="s" x="32" y="126">销售规格 / 商品</text><text class="s" x="32" y="140">参数分开配</text>

<rect class="bx" x="160" y="46" width="120" height="104" rx="7"/>
<text class="num" x="172" y="66">02</text><text class="who" x="268" y="66" text-anchor="end">商家</text>
<text class="n" x="172" y="88">建 SPU</text>
<text class="s" x="172" y="110">标题 · 图 · 类目</text><text class="s" x="172" y="126">履约方式</text>

<rect class="bk" x="300" y="46" width="120" height="104" rx="7"/>
<text class="num" x="312" y="66">03</text><text class="who" x="408" y="66" text-anchor="end">商家＋系统</text>
<text class="n" x="312" y="88">勾档位</text><text class="n" x="312" y="106">生成 SKU 矩阵</text>
<text class="s" x="312" y="126">不勾 = 长度 1</text><text class="s" x="312" y="140">的 SKU 列表</text>

<rect class="bx" x="440" y="46" width="120" height="104" rx="7"/>
<text class="num" x="452" y="66">04</text><text class="who" x="548" y="66" text-anchor="end">商家</text>
<text class="n" x="452" y="88">填价与</text><text class="n" x="452" y="106">外部身份</text>
<text class="s" x="452" y="126">条码 · 货号</text><text class="s" x="452" y="140">计量单位</text>

<rect class="bn" x="580" y="46" width="120" height="104" rx="7"/>
<text class="num" x="592" y="66">05</text><text class="who" x="688" y="66" text-anchor="end">系统</text>
<text class="n" x="592" y="88">投影建账</text>
<text class="s" x="592" y="110">物料 + 库位</text><text class="s" x="592" y="126">余额起始为 0</text>

<rect class="bn" x="720" y="46" width="110" height="104" rx="7"/>
<text class="num" x="732" y="66">06</text><text class="who" x="818" y="66" text-anchor="end">商家</text>
<text class="n" x="732" y="88">入库过账</text><text class="n" x="732" y="106">并上架</text>
<text class="s" x="732" y="126">有货才谈</text><text class="s" x="732" y="140">得上可售</text>

<rect class="bn" x="850" y="46" width="94" height="104" rx="7"/>
<text class="num" x="862" y="66">07</text><text class="who" x="932" y="66" text-anchor="end">系统</text>
<text class="n" x="862" y="88">预留</text><text class="n" x="862" y="106">→ 出库</text>
<text class="s" x="862" y="126">付款才</text><text class="s" x="862" y="140">开出库单</text>

<path class="ar" marker-end="url(#pa)" d="M140 98 L160 98"/>
<path class="ar" marker-end="url(#pa)" d="M280 98 L300 98"/>
<path class="ar" marker-end="url(#pa)" d="M420 98 L440 98"/>
<path class="ar" marker-end="url(#pa)" d="M560 98 L580 98"/>
<path class="ar" marker-end="url(#pa)" d="M700 98 L720 98"/>
<path class="ar" marker-end="url(#pa)" d="M830 98 L850 98"/>

<rect class="drop" x="20" y="176" width="120" height="76" rx="6"/>
<text class="s" x="30" y="198">prd_category_spec</text><text class="s" x="30" y="214">prd_spec_dim</text><text class="s" x="30" y="230">prd_spec_value</text>
<rect class="drop" x="160" y="176" width="120" height="76" rx="6"/>
<text class="s" x="170" y="198">prd_goods</text><text class="s" x="170" y="220">一行</text>
<rect class="drop" x="300" y="176" width="120" height="76" rx="6"/>
<text class="s" x="310" y="198">prd_sku</text><text class="s" x="310" y="220">n 行（笛卡尔积）</text><text class="s" x="310" y="240">option_value_nos</text>
<rect class="drop" x="440" y="176" width="120" height="76" rx="6"/>
<text class="s" x="450" y="198">prd_sku 同几行</text><text class="s" x="450" y="220">barcode / 货号</text><text class="s" x="450" y="240">sale_unit</text>
<rect class="drop" x="580" y="176" width="120" height="76" rx="6"/>
<text class="s" x="590" y="198">inv_item</text><text class="s" x="590" y="218">inv_item_ref</text><text class="s" x="590" y="238">inv_stock_balance=0</text>
<rect class="drop" x="720" y="176" width="110" height="76" rx="6"/>
<text class="s" x="730" y="198">inv_inbound_order</text><text class="s" x="730" y="218">inv_ledger ＋</text><text class="s" x="730" y="238">prd_store_goods</text>
<rect class="drop" x="850" y="176" width="94" height="76" rx="6"/>
<text class="s" x="860" y="198">inv_reservation</text><text class="s" x="860" y="218">inv_outbound_</text><text class="s" x="860" y="234">order</text><text class="s" x="860" y="250">inv_ledger −</text>

<line class="sep" x1="20" y1="282" x2="944" y2="282"/>
<text class="band" x="20" y="306">03 是唯一会「凭空长出很多行」的一步：3 档 × 2 档 = 6 个 SKU，就是 6 个价、6 条外部身份、6 行余额、6 条要盘的账。</text>
<text class="band" x="20" y="328">05 之前商品是「能卖的东西」，05 之后它同时是「要管的账」。两件事从这一步起分开，也从这一步起必须对得上。</text>
<text class="band" x="20" y="350">06 的顺序不能反：先入库再上架。反过来是「上架了但一件都没有」，买家点进来只能看到售罄。</text>
<text class="band" x="20" y="372">07 预留不写流水、不动实存 —— 没付钱的单不该进销量，也不该让别人的可售数量白白少掉太久（靠 expires_at 兜底）。</text>
<text class="band" x="20" y="398">删档位是这条链上最危险的动作：对应物料上若还有余额，必须先出库或转移，否则那批货在账上凭空消失。见文档「改规格会发生什么」。</text>
</svg>
