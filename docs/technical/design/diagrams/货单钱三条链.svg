<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>货流 · 单流 · 钱流：三条链与四个交汇点</title><desc>横轴是时间的八个节点（进货→上架→下单→支付→履约→完成→分账到账→提现开票），三条泳道分别是库存、订单、资金。竖直虚线是三条链必须对齐的四个交汇点。底部是退款：三条链同时回退但方向不同，其中「退货退款要把货加回库存」目前没有实现。</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}
.bn{fill:#FFFDF6;stroke:#D9C89A;stroke-width:1.3;stroke-dasharray:5 3}
.bw{fill:#FDF6F4;stroke:#D9A6A6;stroke-width:1.4}
.lane{fill:#F7F9FC;stroke:none}
.n{font-size:12px;font-weight:600;fill:#161A21}
.s{font-size:10px;fill:#5A6472}
.w{font-size:10px;fill:#8A4A3C}
.hd{font-size:11px;font-weight:600;fill:#3A4351}
.ln{font-size:12.5px;font-weight:700;fill:#3A4351}
.band{font-size:11.5px;fill:#7B8695;letter-spacing:.08em}
.join{stroke:#B39A6A;stroke-width:1.2;stroke-dasharray:4 4;fill:none}
.jt{font-size:10px;fill:#8A7434;font-weight:600}
.sep{stroke:#E6EAEF;stroke-width:1}
.ar{stroke:#8A94A2;stroke-width:1.2;fill:none}
</style></defs>

<text class="band" x="20" y="24">横轴 = 时间的八个节点　·　竖直虚线 = 三条链必须对齐的四个交汇点</text>

<text class="hd" x="100" y="44">① 进货</text>
<text class="hd" x="206" y="44">② 上架定价</text>
<text class="hd" x="312" y="44">③ 下单</text>
<text class="hd" x="418" y="44">④ 支付成功</text>
<text class="hd" x="524" y="44">⑤ 履约中</text>
<text class="hd" x="630" y="44">⑥ 完成</text>
<text class="hd" x="736" y="44">⑦ 分账到账</text>
<text class="hd" x="842" y="44">⑧ 提现开票</text>

<line class="join" x1="306" y1="52" x2="306" y2="316"/>
<line class="join" x1="412" y1="52" x2="412" y2="316"/>
<line class="join" x1="730" y1="52" x2="730" y2="316"/>
<text class="jt" x="310" y="64">J1</text>
<text class="jt" x="416" y="64">J2</text>
<text class="jt" x="734" y="64">J3</text>

<rect class="lane" x="16" y="60" width="928" height="72" rx="6"/>
<text class="ln" x="26" y="90">货流</text><text class="s" x="26" y="108">prd_stock_</text><text class="s" x="26" y="122">ledger</text>
<rect class="bn" x="100" y="68" width="96" height="56" rx="6"/>
<text class="n" x="108" y="90">PURCHASE</text><text class="s" x="108" y="108">＋N · 进货单</text>
<rect class="bx" x="312" y="68" width="96" height="56" rx="6"/>
<text class="n" x="320" y="90">锁定</text><text class="s" x="320" y="108">预占，不进流水</text>
<rect class="bx" x="418" y="68" width="96" height="56" rx="6"/>
<text class="n" x="426" y="90">SALE</text><text class="s" x="426" y="108">−N · 真扣</text>

<rect class="lane" x="16" y="142" width="928" height="72" rx="6"/>
<text class="ln" x="26" y="172">单流</text><text class="s" x="26" y="190">ord_order</text><text class="s" x="26" y="204">6 状态 × 7 履约</text>
<rect class="bx" x="312" y="150" width="96" height="56" rx="6"/>
<text class="n" x="320" y="172">WAIT_PAY</text><text class="s" x="320" y="190">钱还没到</text>
<rect class="bx" x="418" y="150" width="96" height="56" rx="6"/>
<text class="n" x="426" y="172">WAIT_FULFILL</text><text class="s" x="426" y="190">服务类直接 FULFILLING</text>
<rect class="bx" x="524" y="150" width="96" height="56" rx="6"/>
<text class="n" x="532" y="172">FULFILLING</text><text class="s" x="532" y="190">发货/核销/上门</text>
<rect class="bx" x="630" y="150" width="96" height="56" rx="6"/>
<text class="n" x="638" y="172">COMPLETED</text><text class="s" x="638" y="190">交接完成</text>

<rect class="lane" x="16" y="224" width="928" height="72" rx="6"/>
<text class="ln" x="26" y="254">钱流</text><text class="s" x="26" y="272">stl_payment</text><text class="s" x="26" y="286">stl_bill</text>
<rect class="bx" x="418" y="232" width="96" height="56" rx="6"/>
<text class="n" x="426" y="254">收款 + 计提</text><text class="s" x="426" y="272">PAID · accrued_at</text>
<rect class="bx" x="736" y="232" width="96" height="56" rx="6"/>
<text class="n" x="744" y="254">分账 SPLIT</text><text class="s" x="744" y="272">split_at · 售后期后</text>
<rect class="bx" x="842" y="232" width="96" height="56" rx="6"/>
<text class="n" x="850" y="254">提现 / 开票</text><text class="s" x="850" y="272">stl_withdraw</text>

<text class="s" x="100" y="312">J1 单流开始，货只是预占，钱未动　·　J2 钱开始＋货真扣＋单转态＋计提，一个事务四件事　·　J3 售后期过了才分账，账面与资金两个时点</text>

<line class="sep" x1="16" y1="336" x2="944" y2="336"/>
<text class="band" x="20" y="358">退款：三条链同时回退，但方向不同 —— 这是最容易做错的一处</text>

<rect class="bx" x="100" y="374" width="250" height="62" rx="6"/>
<text class="n" x="112" y="398">钱：回退分账 → 退款</text>
<text class="s" x="112" y="418">顺序不能反：先退钱后收不回分账，只能人工追</text>

<rect class="bw" x="366" y="374" width="290" height="62" rx="6"/>
<text class="n" x="378" y="398">货：只有 RETURN_REFUND 才 ＋N</text>
<text class="w" x="378" y="418">⚠ 事件发了没人听，退货后库存不回补</text>

<rect class="bx" x="672" y="374" width="266" height="62" rx="6"/>
<text class="n" x="684" y="398">单：子单 → REFUNDED</text>
<text class="s" x="684" y="418">ord_after_sale.type 已分三种</text>

<text class="s" x="100" y="466">REFUND_ONLY（仅退款）不回补是对的 —— 货没回来；RETURN_REFUND（退货退款）不回补是错的 —— 货回来了，而库里当它卖掉了，</text>
<text class="s" x="100" y="484">于是这一件会被再卖一次。判据早就在 ord_after_sale.type 里，缺的只是 product 域的一个监听器。</text>
<text class="s" x="100" y="508">EXCHANGE（换货）是第三种：货回来一件、又出去一件，两行流水，净变动为零 —— 但两行都要有，否则查不出换过货。</text>
</svg>
