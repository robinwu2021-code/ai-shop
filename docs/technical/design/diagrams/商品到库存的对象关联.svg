<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>从类目规格到库存台账：对象关联与基数</title><desc>四段自左向右：平台配置的类目与规格库、商家维护的 SPU 与 SKU、进销存的物料与库位主数据、以及库存余额与单据台账。跨段只有一处连接——SKU 通过外部引用投影成物料，此后领域内不再出现 sku_no。库存挂在物料与库位的组合上，不挂在 SPU 上。</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6E86A8" stroke-width="1.6" stroke-linecap="round"/></marker>
<style>
.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}
.bk{fill:#FFFFFF;stroke:#6E86A8;stroke-width:1.9}
.bn{fill:#FFFDF6;stroke:#D9C89A;stroke-width:1.3}
.zone{fill:#F7F9FC;stroke:none}
.zonen{fill:#FCFAF3;stroke:none}
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.nb{font-size:13px;font-weight:700;fill:#16324F}
.s{font-size:10.5px;fill:#5A6472}
.t{font-size:11px;font-weight:700;fill:#3A4351;letter-spacing:.05em}
.band{font-size:10.5px;fill:#7B8695}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.ark{stroke:#6E86A8;stroke-width:1.7;fill:none}
.l{font-size:10px;fill:#5A6472;paint-order:stroke;stroke:#F7F9FC;stroke-width:3.5;stroke-linejoin:round}
.lk{font-size:10px;font-weight:700;fill:#3E5877;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.sep{stroke:#E6EAEF;stroke-width:1}
</style></defs>

<rect class="zone" x="14" y="46" width="212" height="352" rx="8"/>
<rect class="zone" x="240" y="46" width="226" height="352" rx="8"/>
<rect class="zonen" x="480" y="46" width="212" height="352" rx="8"/>
<rect class="zonen" x="706" y="46" width="240" height="352" rx="8"/>

<text class="t" x="20" y="36">① 平台配置</text>
<text class="t" x="246" y="36">② 商品域 · 商家维护</text>
<text class="t" x="486" y="36">③ 进销存 · 主数据</text>
<text class="t" x="712" y="36">④ 进销存 · 台账</text>

<rect class="bx" x="26" y="62" width="188" height="54" rx="7"/>
<text class="n" x="38" y="84">prd_category</text><text class="s" x="38" y="103">平台类目树</text>
<rect class="bx" x="26" y="146" width="188" height="62" rx="7"/>
<text class="n" x="38" y="168">prd_category_spec</text><text class="s" x="38" y="187">这一类该按什么分</text><text class="s" x="38" y="202">usage_type = SALE | PROP</text>
<rect class="bx" x="26" y="238" width="188" height="70" rx="7"/>
<text class="n" x="38" y="260">prd_spec_dim / _value</text><text class="s" x="38" y="279">维度与档位</text><text class="s" x="38" y="294">value_no 稳定，叫法可改</text>

<rect class="bx" x="252" y="62" width="202" height="54" rx="7"/>
<text class="n" x="264" y="84">prd_goods　SPU</text><text class="s" x="264" y="103">标题 · 图 · 类目 · 履约</text>
<rect class="bk" x="252" y="146" width="202" height="92" rx="7"/>
<text class="nb" x="264" y="168">prd_sku　SKU</text>
<text class="s" x="264" y="187">option_value_nos 档位组合</text>
<text class="s" x="264" y="203">price · barcode</text>
<text class="s" x="264" y="219">merchant_sku_code · sale_unit</text>
<rect class="bx" x="252" y="262" width="202" height="46" rx="7"/>
<text class="n" x="264" y="284">prd_store_goods / _price</text><text class="s" x="264" y="300">上架与门店价</text>

<rect class="bn" x="492" y="62" width="188" height="54" rx="7"/>
<text class="n" x="504" y="84">inv_item_ref</text><text class="s" x="504" y="103">AISHOP=sku_no · BARCODE · ERP</text>
<rect class="bn" x="492" y="146" width="188" height="70" rx="7"/>
<text class="nb" x="504" y="168">inv_item　物料（SKU）</text><text class="s" x="504" y="187">item_id 本域生成</text><text class="s" x="504" y="203">base_uom 有流水后锁死</text>
<rect class="bn" x="492" y="238" width="188" height="70" rx="7"/>
<text class="n" x="504" y="260">inv_location　库位</text><text class="s" x="504" y="279">STORE / WAREHOUSE</text><text class="s" x="504" y="294">TRANSIT / VIRTUAL</text>

<rect class="bn" x="718" y="62" width="216" height="76" rx="7"/>
<text class="nb" x="730" y="84">inv_stock_balance</text>
<text class="s" x="730" y="103">(owner, item, location)</text>
<text class="s" x="730" y="120">on_hand · reserved</text>
<rect class="bn" x="718" y="160" width="216" height="76" rx="7"/>
<text class="n" x="730" y="182">inv_inbound_line</text><text class="n" x="730" y="200">inv_outbound_line</text>
<text class="s" x="730" y="220">过账那一刻才动余额</text>
<rect class="bn" x="718" y="258" width="216" height="50" rx="7"/>
<text class="n" x="730" y="280">inv_ledger　流水</text><text class="s" x="730" y="298">与余额变动 1:1，不可变</text>

<path class="ar" marker-end="url(#pa)" d="M120 116 L120 146"/>
<text class="l" x="128" y="136">1─n</text>
<path class="ar" marker-end="url(#pa)" d="M120 208 L120 238"/>
<text class="l" x="128" y="228">n─1</text>
<path class="ar" marker-end="url(#pa)" d="M214 88 L252 88"/>
<text class="l" x="216" y="80">1─n</text>
<path class="ar" marker-end="url(#pa)" d="M353 116 L353 146"/>
<text class="l" x="361" y="136">1─n</text>
<path class="ar" marker-end="url(#pa)" d="M353 238 L353 262"/>
<path class="ar" marker-end="url(#pa)" d="M226 274 L226 132 L240 132" opacity="0"/>
<path class="ark" marker-end="url(#pk)" d="M454 180 L492 180"/>
<text class="lk" x="456" y="172">1─1</text>
<path class="ar" marker-end="url(#pa)" d="M586 116 L586 146"/>
<text class="l" x="594" y="136">n─1</text>
<path class="ar" marker-end="url(#pa)" d="M680 176 L700 176 L700 100 L718 100"/>
<path class="ar" marker-end="url(#pa)" d="M680 268 L700 268 L700 112 L718 112"/>
<text class="l" x="690" y="146">组合键</text>
<path class="ar" marker-end="url(#pa)" d="M826 160 L826 138"/>
<text class="l" x="834" y="154">过账</text>
<path class="ar" marker-end="url(#pa)" d="M940 100 L950 100 L950 283 L934 283" opacity="0"/>
<path class="ar" marker-end="url(#pa)" d="M826 236 L826 258"/>
<text class="l" x="834" y="252">1:1</text>

<line class="sep" x1="14" y1="416" x2="946" y2="416"/>
<text class="band" x="20" y="438">跨段只有一处连接：SKU 经 inv_item_ref 投影成物料，此后领域内不再出现 sku_no。库存挂在（物料 × 库位）上 —— SPU 没有「还剩多少」这个概念。</text>
<text class="band" x="20" y="458">usage_type=PROP 的商品参数不进 SKU 组合：买家不用挑，它不影响价也不影响库存。</text>
</svg>
