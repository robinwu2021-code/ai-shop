<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img"><title>餐饮完整渠道目录捕获（分批实施方案）</title><rect width="1120" height="400" fill="#ffffff" /><text x="30" y="38" fill="#111827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" text-anchor="start">完整餐牌目录：先核验原事实，再生成可售目录</text><text x="30" y="66" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start">保持原商品、价格、税、库存、餐牌的所有权；v1/v2兼容，v3按后续批次实施</text><rect x="30" y="105" width="190" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" /><text x="44" y="135" fill="#111827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="start">原来源</text><text x="44" y="166" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">当前餐牌与渠道绑定</text><text x="44" y="191" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">原商品价格、税、图片</text><path d="M224 168 H243 l-5 -5 m5 5 l-5 5" stroke="#64748b" fill="none" stroke-width="1.8" /><rect x="248" y="105" width="190" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" /><text x="262" y="135" fill="#111827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="start">价格政策</text><text x="262" y="166" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">覆盖价优先／原基准价</text><text x="262" y="191" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">不重复定价，不做汇兑</text><path d="M442 168 H461 l-5 -5 m5 5 l-5 5" stroke="#64748b" fill="none" stroke-width="1.8" /><rect x="466" y="105" width="190" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" /><text x="480" y="135" fill="#111827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="start">餐饮规则</text><text x="480" y="166" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">原营业日历 ∩ 餐牌时段</text><text x="480" y="191" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">规格／配料／套餐可行性</text><path d="M660 168 H679 l-5 -5 m5 5 l-5 5" stroke="#64748b" fill="none" stroke-width="1.8" /><rect x="684" y="105" width="190" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" /><text x="698" y="135" fill="#111827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="start">完整目录 v3</text><text x="698" y="166" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">原身份＋价税＋有效区间</text><text x="698" y="191" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">整体校验后冻结与稳定摘要</text><path d="M878 168 H897 l-5 -5 m5 5 l-5 5" stroke="#64748b" fill="none" stroke-width="1.8" /><rect x="902" y="105" width="190" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" /><text x="916" y="135" fill="#111827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" text-anchor="start">通用渠道内核</text><text x="916" y="166" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">原预览／提交／worker</text><text x="916" y="191" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="start">网关显式支持，否则拒绝</text><rect x="30" y="264" width="1062" height="90" rx="9" fill="#eff6ff" stroke="#bfdbfe" /><text x="46" y="290" fill="#1e3a8a" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" text-anchor="start">两个有效期分开处理</text><text x="46" y="316" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start">证据最多30秒：本次读取是否仍可被接纳。  可售窗口建议7天：平台何时允许售卖。</text><text x="46" y="339" fill="#334155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start">缺失／过期／规则不能表达 → 整体拒绝；不补0、不降级、不启用真实平台。</text></svg>