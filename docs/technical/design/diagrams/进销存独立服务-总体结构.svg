<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>进销存独立服务：宿主 → 服务 → 库存库</title><desc>左列是调用方（宿主系统的后端），中列是独立服务的模块，右列是唯一的库存库。人不直接调用库存服务：宿主后端判权限后，以系统凭证加操作人调用。实线是 ShareHub 接入（M0 ~ M6），虚线是商城切流（M8）。事件由宿主按游标拉取，不由服务主动推送。</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker><marker id="pd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B39A6A" stroke-width="1.4" stroke-linecap="round"/></marker><style>.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}.bn{fill:#FFFDF6;stroke:#D9C89A;stroke-width:1.4;stroke-dasharray:5 3}.bg{fill:#F3F6FA;stroke:#C8D0DA;stroke-width:1.2}.bk{fill:#FFF5F3;stroke:#E2B7AE;stroke-width:1.2}.n{font-size:13.5px;font-weight:600;fill:#161A21}.s{font-size:11px;fill:#5A6472}.band{font-size:11.5px;fill:#7B8695;letter-spacing:.08em}.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}.lw{font-size:10.5px;fill:#8A7434;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.ard{stroke:#B39A6A;stroke-width:1.3;fill:none;stroke-dasharray:5 3}.tag{font-size:10px;fill:#8A7434;font-weight:600}</style></defs>
<text class="band" x="30" y="30">宿主系统（调用方）</text>
<text class="band" x="330" y="30">独立库存服务 inventory（不依赖 ai-shop）</text>
<text class="band" x="720" y="30">数据</text>
<rect class="bx" x="30" y="50" width="230" height="92" rx="8"/>
<text class="n" x="46" y="76">ShareHub 后端（BFF）</text>
<text class="s" x="46" y="98">运营人员、商家门户都经它</text>
<text class="s" x="46" y="116">判权限与数据范围 · 透传操作人</text>
<text class="s" x="46" y="134">inventory-client + 幂等任务</text>
<rect class="bn" x="30" y="170" width="230" height="74" rx="8"/>
<text class="n" x="46" y="196">ai-shop shop-app（M8）</text>
<text class="s" x="46" y="216">invbridge 改调客户端</text>
<text class="s" x="46" y="234">预留 · 销售确认 · 退货</text>
<rect class="bg" x="30" y="282" width="230" height="74" rx="8"/>
<text class="n" x="46" y="308">人（仓管 / 运维 / 商家）</text>
<text class="s" x="46" y="328">只用宿主自己的界面</text>
<text class="s" x="46" y="346">不直连库存服务</text>
<rect class="bx" x="320" y="50" width="340" height="56" rx="8"/>
<text class="n" x="336" y="74">inventory-svc</text>
<text class="s" x="336" y="94">/api/inventory/v1 · 健康检查</text>
<rect class="bx" x="320" y="124" width="160" height="70" rx="8"/>
<text class="n" x="336" y="150">inventory-guard</text>
<text class="s" x="336" y="170">凭证 → 系统 · 业主 · 操作人</text>
<text class="s" x="336" y="186">每系统一把凭证</text>
<rect class="bx" x="500" y="124" width="160" height="70" rx="8"/>
<text class="n" x="516" y="150">inventory-domain</text>
<text class="s" x="516" y="170">SN · 单据 · 出库池 · 档案</text>
<text class="s" x="516" y="186">盘点 · 过账 · 持久化 · 迁移</text>
<rect class="bg" x="320" y="212" width="340" height="56" rx="8"/>
<text class="n" x="336" y="236">inventory-api · inventory-client</text>
<text class="s" x="336" y="256">契约与客户端单独发布，宿主只依赖这两个</text>
<rect class="bx" x="720" y="124" width="150" height="70" rx="8"/>
<text class="n" x="736" y="150">库存库</text>
<text class="s" x="736" y="170">唯一的库</text>
<text class="s" x="736" y="186">inv_flyway_history</text>
<rect class="bx" x="720" y="230" width="150" height="70" rx="8"/>
<text class="n" x="736" y="256">事件订阅游标</text>
<text class="s" x="736" y="276">宿主拉取 · 确认</text>
<text class="s" x="736" y="292">可重放</text>
<path class="ar" d="M260 96 L318 82" marker-end="url(#pa)"/><text class="l" x="262" y="80">凭证 + 操作人</text>
<path class="ard" d="M260 206 L318 98" marker-end="url(#pd)"/><text class="lw" x="264" y="170">M8</text>
<path class="ar" d="M145 282 L145 144" marker-end="url(#pa)"/><text class="l" x="150" y="268">经宿主界面</text>
<path class="ar" d="M400 106 L400 122" marker-end="url(#pa)"/>
<path class="ar" d="M480 159 L498 159" marker-end="url(#pa)"/>
<path class="ar" d="M660 159 L718 159" marker-end="url(#pa)"/>
<path class="ar" d="M795 194 L795 228" marker-end="url(#pa)"/>
<path class="ar" d="M720 270 Q500 330 262 120" marker-end="url(#pa)"/><text class="l" x="440" y="318">事件（宿主拉取）</text>
<text class="tag" x="30" y="400">不在服务里：质检（宿主做，入库只带放行凭证）· 运营界面 · 人员账号与角色 · 出库后的位置跟踪</text>
<text class="s" x="30" y="424">虚线 = M8 商城切流；实线 = ShareHub 接入</text>
</svg>
