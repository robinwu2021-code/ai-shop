<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>四族单据如何改变库存：入库单 · 出库单 · 盘点单 · 调拨单</title><desc>入库单与出库单是直接改变余额的两族；盘点单与调拨单不直接改余额，它们通过生成入库单/出库单来改。调拨经过 TRANSIT 在途库位，因此发出到收到之间总量仍然守恒。所有余额变动一律同时写一行不可变流水。</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6E86A8" stroke-width="1.6" stroke-linecap="round"/></marker>
<style>
.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}
.bk{fill:#FFFFFF;stroke:#6E86A8;stroke-width:1.9}
.bn{fill:#FFFDF6;stroke:#D9C89A;stroke-width:1.3}
.bt{fill:#F5F7FA;stroke:#B9C2CE;stroke-width:1.2;stroke-dasharray:5 3}
.n{font-size:12.5px;font-weight:600;fill:#161A21}
.nb{font-size:13.5px;font-weight:700;fill:#16324F}
.s{font-size:10.5px;fill:#5A6472}
.band{font-size:11px;fill:#7B8695;letter-spacing:.06em}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.ark{stroke:#6E86A8;stroke-width:1.7;fill:none}
.l{font-size:10px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.lk{font-size:10px;font-weight:600;fill:#3E5877;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.sep{stroke:#E6EAEF;stroke-width:1}
</style></defs>

<text class="band" x="30" y="24">① 只有这两族直接改余额　　② 另两族通过生成它们来改　　③ 每一次余额变动同时写一行流水</text>

<rect class="bk" x="30" y="44" width="250" height="88" rx="8"/>
<text class="nb" x="44" y="68">入库单　InboundOrder</text>
<text class="s" x="44" y="90">采购 · 退货 · 调拨入 · 盘盈 · 其他</text>
<text class="s" x="44" y="108">行带单价 → 结转成本</text>
<text class="s" x="44" y="124">方向恒为 ＋</text>

<rect class="bk" x="30" y="150" width="250" height="88" rx="8"/>
<text class="nb" x="44" y="174">出库单　OutboundOrder</text>
<text class="s" x="44" y="196">销售 · 调拨出 · 报损 · 盘亏 · 领用</text>
<text class="s" x="44" y="214">行带成本快照，不带售价</text>
<text class="s" x="44" y="230">方向恒为 −</text>

<rect class="bn" x="30" y="262" width="250" height="72" rx="8"/>
<text class="n" x="44" y="286">盘点单　StockCount</text>
<text class="s" x="44" y="306">锁账面数 → 录实盘 → 过账</text>
<text class="s" x="44" y="324">盈生成入库单，亏生成出库单</text>

<rect class="bn" x="30" y="352" width="250" height="72" rx="8"/>
<text class="n" x="44" y="376">调拨单　TransferOrder</text>
<text class="s" x="44" y="396">发出生成出库单，收到生成入库单</text>
<text class="s" x="44" y="414">中间停在 TRANSIT 库位</text>

<rect class="bk" x="380" y="96" width="240" height="96" rx="8"/>
<text class="nb" x="394" y="120">StockBalance　库存</text>
<text class="s" x="394" y="142">(owner, item, location)</text>
<text class="s" x="394" y="160">on_hand · reserved</text>
<text class="s" x="394" y="178">available = on_hand − reserved</text>

<rect class="bt" x="380" y="230" width="240" height="70" rx="8"/>
<text class="n" x="394" y="254">TRANSIT　在途库位</text>
<text class="s" x="394" y="274">调拨发出到收到之间货停在这里</text>
<text class="s" x="394" y="292">于是 Σ on_hand 任意时刻守恒</text>

<rect class="bn" x="700" y="96" width="230" height="96" rx="8"/>
<text class="nb" x="714" y="120">流水　Ledger</text>
<text class="s" x="714" y="142">id 单调递增，兼作增量游标</text>
<text class="s" x="714" y="160">qty_delta · balance_after</text>
<text class="s" x="714" y="178">不可变；作废写反向行</text>

<path class="ark" marker-end="url(#pk)" d="M280 88 L330 88 L330 130 L380 130"/>
<text class="lk" x="292" y="80">过账 ＋</text>
<path class="ark" marker-end="url(#pk)" d="M280 194 L330 194 L330 158 L380 158"/>
<text class="lk" x="292" y="212">过账 −</text>
<path class="ar" marker-end="url(#pa)" d="M280 292 L340 292 L340 210 L300 210"/>
<text class="l" x="348" y="330">生成单据，不直接改余额</text>
<path class="ar" marker-end="url(#pa)" d="M280 388 L352 388 L352 216 L300 216"/>
<path class="ar" marker-end="url(#pa)" d="M500 192 L500 230"/>
<text class="l" x="510" y="216">调拨的一出一入</text>
<path class="ark" marker-end="url(#pk)" d="M620 144 L700 144"/>
<text class="lk" x="628" y="136">1:1</text>

<line class="sep" x1="30" y1="444" x2="930" y2="444"/>
<text class="s" x="30" y="462">销售出库单由预留 commit 时系统自动开（operator=SYSTEM）—— 「直接扣库存」在这个模型里不存在，一切变动都有单。</text>
</svg>
