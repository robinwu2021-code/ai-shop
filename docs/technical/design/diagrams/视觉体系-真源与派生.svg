<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif">
  <title>视觉体系：一个真源，四条派生链</title>
  <desc>品牌参数（主色 #e1251b 与弧线 + HX 几何）集中在 brand/build.py 一处。它向下派生四条链：色 token 链（tokens.css/ts/json 到 shared/design/tokens.ts 再到 base.css，供 c-app 与 b-app）、运营端链（ops-web/app/globals.css）、图标链（Android / iOS / favicon）、对外物料链（官网 site/ 与 PPT、包装、名片）。图上看不出的是方向性：所有箭头单向向下，任何一端都不许反向自己定义色值。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b8f9c"/>
    </marker>
  </defs>

  <rect width="980" height="470" fill="#ffffff"/>

  <!-- 真源 -->
  <rect x="330" y="24" width="320" height="76" rx="12" fill="#e1251b"/>
  <text x="490" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">真源 · brand/build.py</text>
  <text x="490" y="78" text-anchor="middle" font-size="12.5" fill="#ffffff" opacity="0.88">主色 #e1251b ｜ 弧线母题 ｜ H/X 几何参数</text>
  <text x="490" y="118" text-anchor="middle" font-size="11.5" fill="#8b8f9c">改这里，重跑，四条链全部重生成</text>

  <!-- 汇流线 -->
  <path d="M490 100 L490 132" stroke="#8b8f9c" stroke-width="1.4" fill="none"/>
  <path d="M132 132 H848" stroke="#8b8f9c" stroke-width="1.4" fill="none"/>
  <path d="M132 132 V160" stroke="#8b8f9c" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M370 132 V160" stroke="#8b8f9c" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M610 132 V160" stroke="#8b8f9c" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M848 132 V160" stroke="#8b8f9c" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <!-- 链 1 · 色 token -->
  <rect x="24" y="162" width="216" height="286" rx="12" fill="#f7f8fa" stroke="#dee0e6"/>
  <text x="132" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#e1251b" letter-spacing="1.2">链 1 · 色 TOKEN</text>
  <rect x="42" y="200" width="180" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="132" y="220" text-anchor="middle" font-size="12.5" fill="#1b1f27">brand/tokens.css</text>
  <text x="132" y="237" text-anchor="middle" font-size="11" fill="#61656f">.ts / .json</text>
  <path d="M132 246 V266" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="42" y="268" width="180" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="132" y="288" text-anchor="middle" font-size="12.5" fill="#1b1f27">shared/design</text>
  <text x="132" y="305" text-anchor="middle" font-size="11" fill="#61656f">tokens.ts · brand 皮肤</text>
  <path d="M132 314 V334" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="42" y="336" width="180" height="42" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="132" y="362" text-anchor="middle" font-size="12.5" fill="#1b1f27">ui/styles/base.css</text>
  <path d="M132 378 V398" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="42" y="400" width="180" height="34" rx="9" fill="#fdeceb" stroke="#f0c3bf"/>
  <text x="132" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b31710">c-app · b-app</text>

  <!-- 链 2 · 运营端 -->
  <rect x="262" y="162" width="216" height="286" rx="12" fill="#f7f8fa" stroke="#dee0e6"/>
  <text x="370" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#e1251b" letter-spacing="1.2">链 2 · 运营端</text>
  <rect x="280" y="200" width="180" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="370" y="220" text-anchor="middle" font-size="12.5" fill="#1b1f27">ops-web</text>
  <text x="370" y="237" text-anchor="middle" font-size="11" fill="#61656f">app/globals.css</text>
  <path d="M370 246 V266" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="280" y="268" width="180" height="60" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="370" y="290" text-anchor="middle" font-size="12" fill="#1b1f27">品牌红只进标识位</text>
  <text x="370" y="308" text-anchor="middle" font-size="11" fill="#61656f">--primary 保持近黑</text>
  <text x="370" y="322" text-anchor="middle" font-size="10.5" fill="#8f221b">防：主按钮与删除同色</text>
  <path d="M370 328 V398" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="280" y="400" width="180" height="34" rx="9" fill="#fdeceb" stroke="#f0c3bf"/>
  <text x="370" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b31710">运营后台</text>

  <!-- 链 3 · 图标 -->
  <rect x="500" y="162" width="216" height="286" rx="12" fill="#f7f8fa" stroke="#dee0e6"/>
  <text x="608" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#e1251b" letter-spacing="1.2">链 3 · 图标制版</text>
  <rect x="518" y="200" width="180" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="608" y="220" text-anchor="middle" font-size="12.5" fill="#1b1f27">brand/logo/*.svg</text>
  <text x="608" y="237" text-anchor="middle" font-size="11" fill="#61656f">1024 母版 + 自适应层</text>
  <path d="M608 246 V266" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="518" y="268" width="180" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="608" y="288" text-anchor="middle" font-size="12.5" fill="#1b1f27">Android res/</text>
  <text x="608" y="305" text-anchor="middle" font-size="11" fill="#61656f">consumer · merchant</text>
  <path d="M608 314 V334" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="518" y="336" width="180" height="42" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="608" y="362" text-anchor="middle" font-size="12.5" fill="#1b1f27">iOS AppIcon · favicon</text>
  <path d="M608 378 V398" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="518" y="400" width="180" height="34" rx="9" fill="#fdeceb" stroke="#f0c3bf"/>
  <text x="608" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b31710">应用商店上架</text>

  <!-- 链 4 · 对外 -->
  <rect x="738" y="162" width="218" height="286" rx="12" fill="#f7f8fa" stroke="#dee0e6"/>
  <text x="847" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#e1251b" letter-spacing="1.2">链 4 · 对外物料</text>
  <rect x="756" y="200" width="182" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="847" y="220" text-anchor="middle" font-size="12.5" fill="#1b1f27">site/ 官网</text>
  <text x="847" y="237" text-anchor="middle" font-size="11" fill="#61656f">hxmall.top</text>
  <path d="M847 246 V266" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="756" y="268" width="182" height="46" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="847" y="288" text-anchor="middle" font-size="12.5" fill="#1b1f27">PPT · 包装 · 单据</text>
  <text x="847" y="305" text-anchor="middle" font-size="11" fill="#61656f">文字转轮廓后交付</text>
  <path d="M847 314 V334" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="756" y="336" width="182" height="42" rx="9" fill="#ffffff" stroke="#d2d5dd"/>
  <text x="847" y="362" text-anchor="middle" font-size="12.5" fill="#1b1f27">商标申报黑白稿</text>
  <path d="M847 378 V398" stroke="#8b8f9c" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="756" y="400" width="182" height="34" rx="9" fill="#fdeceb" stroke="#f0c3bf"/>
  <text x="847" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b31710">法务 · 渠道</text>

  <text x="490" y="462" text-anchor="middle" font-size="11" fill="#8b8f9c">箭头全部单向：任何一端都不许自己定义色值或几何，只许消费上游</text>
</svg>
