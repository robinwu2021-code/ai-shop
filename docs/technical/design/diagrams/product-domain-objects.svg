<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>商品域对象分层与引用关系</title><desc>四层：基础数据 / 商品主数据 / 门店投影与可见性 / 交易侧引用。箭头由引用方指向被引用方。</desc>
<defs>
<marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker>
<style>
.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}
.bd{fill:#F3F6FA;stroke:#C8D0DA;stroke-width:1.2;stroke-dasharray:4 3}
.n{font-size:13.5px;font-weight:600;fill:#161A21}
.s{font-size:11px;fill:#5A6472}
.band{font-size:11.5px;fill:#7B8695;letter-spacing:.08em}
.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}
.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}
.ard{stroke:#A9B2BE;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.sep{stroke:#E6EAEF;stroke-width:1}
</style></defs>

<text class="band" x="30" y="26">① 基础数据 · 平台 / 运营维护，跨商家共用</text>
<line class="sep" x1="30" y1="36" x2="930" y2="36"/>

<rect class="bx" x="30" y="48" width="170" height="60" rx="8"/>
<text class="n" x="42" y="70">prd_category</text><text class="s" x="42" y="90">三级类目树 · 归类与准入</text>
<rect class="bd" x="216" y="48" width="170" height="60" rx="8"/>
<text class="n" x="228" y="70">CATEGORY_TYPE</text><text class="s" x="228" y="90">五品类枚举 · 硬编码</text>
<rect class="bx" x="402" y="48" width="170" height="60" rx="8"/>
<text class="n" x="414" y="70">prd_spec_template</text><text class="s" x="414" y="90">PLATFORM + MERCHANT</text>
<rect class="bx" x="588" y="48" width="170" height="60" rx="8"/>
<text class="n" x="600" y="70">sys_auth_code</text><text class="s" x="600" y="90">授权码 · 发证的那一半</text>
<rect class="bd" x="774" y="44" width="156" height="68" rx="8"/>
<text class="n" x="786" y="66">sys_channel_</text><text class="n" x="786" y="82">category_rule</text><text class="s" x="786" y="100">端可售规则</text>

<text class="band" x="30" y="150">② 商品主数据 · 商家维护，归属键 entity_no（挂主体，不挂门店）</text>
<line class="sep" x1="30" y1="160" x2="930" y2="160"/>

<rect class="bx" x="216" y="200" width="250" height="72" rx="8"/>
<text class="n" x="230" y="224">prd_goods（SPU）</text>
<text class="s" x="230" y="244">title / type / categoryNo / images</text>
<text class="s" x="230" y="262">specGroups(JSON) · on_sale · audit_status</text>

<rect class="bx" x="530" y="200" width="250" height="72" rx="8"/>
<text class="n" x="544" y="224">prd_sku</text>
<text class="s" x="544" y="244">(entity_no, sku_no, market) 唯一</text>
<text class="s" x="544" y="262">price · stock · presale_quota</text>

<text class="band" x="30" y="316">③ 门店投影与可见性 · 「有行即按店算，无行的店视为 0 / 未上架」</text>
<line class="sep" x1="30" y1="326" x2="930" y2="326"/>

<rect class="bx" x="30" y="366" width="170" height="64" rx="8"/>
<text class="n" x="42" y="390">prd_community_pool</text><text class="s" x="42" y="410">社区可见性 · 不存价</text>

<rect class="bx" x="216" y="366" width="250" height="64" rx="8"/>
<text class="n" x="230" y="390">prd_store_goods</text>
<text class="s" x="230" y="410">门店上架 · platform_suspended</text>

<rect class="bx" x="530" y="366" width="250" height="64" rx="8"/>
<text class="n" x="544" y="390">prd_store_stock</text>
<text class="s" x="544" y="410">门店库存 · (store_no, sku_no) 唯一</text>

<text class="band" x="30" y="474">④ 交易侧引用 · 跨域，只读快照 / 库存锁</text>
<line class="sep" x1="30" y1="484" x2="930" y2="484"/>

<rect class="bx" x="30" y="510" width="170" height="64" rx="8"/>
<text class="n" x="42" y="534">trd_cart_item</text><text class="s" x="42" y="554">只存号，读时实时算价</text>

<rect class="bx" x="216" y="510" width="250" height="64" rx="8"/>
<text class="n" x="230" y="534">ord_item</text>
<text class="s" x="230" y="554">下单那刻的标题/规格/价快照</text>

<rect class="bx" x="530" y="510" width="250" height="64" rx="8"/>
<text class="n" x="544" y="534">prd_stock_lock</text>
<text class="s" x="544" y="554">lock_no = 订单号 · presale 标记</text>

<path class="ar" d="M115 108 L115 172 L258 172 L258 200" marker-end="url(#pa)"/>
<text class="l" x="124" y="186">category_no</text>
<path class="ar" d="M301 108 L301 200" marker-end="url(#pa)"/>
<text class="l" x="308" y="192">type</text>
<path class="ar" d="M487 108 L487 182 L420 182 L420 200" marker-end="url(#pa)"/>
<text class="l" x="430" y="178">spec_groups 内嵌 code</text>
<path class="ard" d="M666 112 L666 132 L490 132 L490 224 L466 224" marker-end="url(#pa)"/>
<text class="l" x="560" y="128">上架校验：required_code × category_codes</text>

<path class="ar" d="M466 236 L530 236" marker-end="url(#pa)"/>
<text class="l" x="476" y="230">1:N</text>
<path class="ar" d="M341 272 L341 366" marker-end="url(#pa)"/>
<text class="l" x="348" y="352">上架投影</text>
<path class="ar" d="M655 272 L655 366" marker-end="url(#pa)"/>
<text class="l" x="662" y="352">库存投影</text>
<path class="ar" d="M258 272 L258 340 L115 340 L115 366" marker-end="url(#pa)"/>
<text class="l" x="124" y="336">上架 = 进池</text>

<path class="ar" d="M440 510 L498 510 L498 260 L466 260" marker-end="url(#pa)"/>
<text class="l" x="504" y="466">goods_no / sku_no</text>
<path class="ar" d="M780 542 L830 542 L830 236 L780 236" marker-end="url(#pa)"/>
<text class="l" x="836" y="400">sku_no</text>
<path class="ar" d="M30 542 L18 542 L18 254 L216 254" marker-end="url(#pa)"/>
</svg>
