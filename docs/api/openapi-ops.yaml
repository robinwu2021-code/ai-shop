        - "name"
        - "rewardType"
        - "couponNo"
        - "inviterCount"
        - "inviteeCount"
        - "enabled"
        - "invitedCount"
        - "convertedCount"
        - "createdAt"
      additionalProperties: false
    RiskType: 
      type: "string"
