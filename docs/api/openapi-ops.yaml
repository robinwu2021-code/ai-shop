    PlatformSlotType: 
      type: "string"
      enum: 
        - "FLASH"
        - "SECKILL"
        - "FULL_REDUCE"
        - "GIFT"
        - "NEWCOMER"
      description: "平台营销场次的类型。\n\n<p>此前叫 `CampaignType`，与 shared 的 `CampaignType`（店铺级活动）**同名不同义**。 当时的处理是写一段注释说明「别对齐」—— 那不够：读代码的人没有义务先知道 自己在哪一层。规范定的是「一个词只能指一个领域概念」，由更窄的一方加限定词， 所以这里改名为 `PlatformSlotType`（见 docs/requirements/项目词典.md §D2）。\n\n⚠️ 它与后端的 `mkt_campaign` 是两个不同的领域对象：   · 后端 / b-app 的 `Campaign` 是**店铺级活动**（`entity_no NOT NULL`，不跨店），     取值 COUPON / FULL_CUT / FLASH / BUY_GIFT，由商家自己建   · 这里的 `Campaign` 是**平台投放的营销场次**（带 `position`，秒杀场按位置分组做     重叠校验），由运营建，后端还没有这个对象\n\n枚举对账工具会报这几个值「后端没有」——那是对的，但结论不是「改名对齐」， 而是「这块后端还没实现」。真按后端那套改，等于把两个概念合并成一个。"
    PlatformSlotStatus: 
      type: "string"
      enum: 
        - "DRAFT"
        - "SCHEDULED"
        - "RUNNING"
        - "ENDED"
    PlatformSlot: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        campaignNo: 
          type: "string"
          description: "活动单号"
        name: 
          type: "string"
          description: "活动名"
        type: 
          "$ref": "#/definitions/PlatformSlotType"
          description: "活动类型"
        status: 
          "$ref": "#/definitions/PlatformSlotStatus"
          description: "活动状态"
        startAt: 
          type: "string"
          description: "开始时间"
        endAt: 
          type: "string"
          description: "结束时间。须晚于 startAt"
        position: 
          type: "string"
          description: "投放位置：秒杀场次的重叠校验按位置分组（跨位置可并行）"
        skuCount: 
          type: "number"
          description: "参与商品数"
        createdAt: 
          type: "string"
          description: "创建时间"
      required: 
        - "campaignNo"
        - "name"
        - "type"
        - "status"
        - "startAt"
        - "endAt"
        - "position"
        - "skuCount"
        - "createdAt"
      additionalProperties: false
      description: "平台投放的营销场次。\n\n⚠️ **后端还没有这个对象，当前没有任何页面在用它**。 它连同  {@link  PlatformSlotType }  /  {@link  PlatformSlotStatus }  一起留在这里， 是因为这块 UI 已经设计完了（位置、场次重叠校验），等产品决定要不要建后端对象。\n\n「营销活动 · 活动」那个 tab 现在渲染的是  {@link  MerchantCampaign }  —— 商家自建的店铺活动，那是 `/ops/campaigns` 真正返回的东西。 两者曾经共用这一个类型，表现是**类型列一半中文一半原始枚举码**： `FLASH` 恰好两套都有所以译得出来，`FULL_CUT`/`COUPON`/`BUY_GIFT` 译不出来。"
    MerchantCampaign: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        campaignNo: 
          type: "string"
          description: "活动号。跨端唯一，平台治理与商家自己看到的是同一个"
        merchantNo: 
          type: "string"
          description: "所属商家（主体号）。平台视角要按它归堆"
        name: 
          type: "string"
          description: "活动名，商家自己填的。C 端会原样展示，平台治理时也按它认人"
        type: 
          "$ref": "#/definitions/MerchantCampaignType"
          description: "COUPON / FULL_CUT / FLASH / BUY_GIFT —— 商家能建的四种"
        status: 
          type: "string"
          description: "RUNNING / ENDED / PAUSED"
        startAt: 
          type: "number"
          description: "开始时间（毫秒时间戳）"
        endAt: 
          type: "number"
          description: "结束时间（毫秒时间戳）"
        goodsNos: 
          anyOf: 
            - type: "array"
              items: 
                type: "string"
            - type: "null"
          description: "参与的商品号。**列表上只显示条数**，明细进详情看"
      required: 
        - "campaignNo"
        - "merchantNo"
        - "name"
        - "type"
        - "status"
        - "startAt"
        - "endAt"
      additionalProperties: false
      description: "**商家自建的店铺活动**（`GET /ops/campaigns` 真正返回的东西）。\n\n<p>平台对它只有治理权：看得见、能停、能归档，**不能建也不能改内容** —— 那是商家自己的经营决定（矩阵 §2.3「平台停券与停活动」）。\n\n<p>字段对齐后端 `CampaignVO`。与  {@link  PlatformSlot }  是两个领域对象， 曾经被一根 HTTP 路径连着，见 `docs/technical/运营端营销列表契约错配.md`。"
    MerchantCampaignType: 
      type: "string"
      enum: 
        - "COUPON"
        - "FULL_CUT"
        - "FLASH"
        - "BUY_GIFT"
      description: "商家能建的活动类型。与 shared 的 `CampaignType` 同源（b-app 建的就是它）"
    SlotKind: 
