      description: "平台开票抬头（P0-11）。**供应商照着它给平台开票** —— 缺公司全称或税号，票就开不出来。\n\n<p>五个字段都是字符串，后端存成一条扁平 JSON 配置（`finance.invoice-title`）；\n**默认值是五项全空而不是编一份假的** —— 空着能让人立刻发现「还没配」。"
    TaxRule: 
