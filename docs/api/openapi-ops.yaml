          description: "当前欠款（分），恒 >= 0。0 = 没有欠款"
        txns: 
          type: "array"
          items: 
            "$ref": "#/definitions/DebtTxn"
          description: "流水，时间倒序。**余额从流水推得出来**，两者对不上时信流水"
      required: 
        - "entityNo"
        - "balanceMinor"
        - "txns"
      additionalProperties: false
      description: "商家欠款：退款追不回来时先记在账上，从后续货款里扣。\n\n⚠️ **与保证金方向相反**：保证金是商家的钱（平台代管、将来要退还）， 欠款是商家欠平台的。两者不能合成一个数看。"
    DebtTxn: 
      type: "object"
      properties: 
        txnNo: 
          type: "string"
          description: "流水号"
        txnType: 
          "$ref": "#/definitions/DebtTxnType"
          description: "这一笔是怎么来的"
        amountMinor: 
          type: "number"
          description: "**有符号**：产生为正、偿还为负。靠 txnType 推方向等于把方向表达两遍"
        balanceAfterMinor: 
          type: "number"
          description: "变动后余额。对账时逐笔回放用"
        sourceType: 
          type: 
            - "string"
            - "null"
          description: "源单类型，如 REFUND。空 = 存量数据"
        sourceNo: 
          type: 
            - "string"
            - "null"
          description: "源单号。**指不出源头的欠款没法向商家解释**"
        batchNo: 
          type: 
            - "string"
            - "null"
          description: "OFFSET 时记从哪一批扣的"
        reason: 
          type: 
            - "string"
            - "null"
          description: "记这一笔的理由，**给人看的原话**"
        at: 
          type: "number"
          description: "发生时刻（毫秒）"
      required: 
        - "txnNo"
        - "txnType"
        - "amountMinor"
        - "balanceAfterMinor"
        - "sourceType"
        - "sourceNo"
        - "batchNo"
        - "reason"
        - "at"
      additionalProperties: false
    DebtTxnType: 
      type: "string"
      enum: 
        - "INCUR"
        - "OFFSET"
        - "DEPOSIT"
        - "WRITE_OFF"
      description: "欠款流水类型。<b>方向不由它推</b> —— amountMinor 自带符号，靠类型再推一次方向等于把同一件事表达两遍， 而两处迟早会不一致。"
    Staff: 
      type: "object"
      properties: 
        staffNo: 
          type: "string"
          description: "员工单号"
        username: 
          type: "string"
          description: "登录名"
        name: 
          type: "string"
          description: "姓名"
        roles: 
          type: "array"
          items: 
            type: "string"
          description: "角色（**可多个**）。权限码取所有角色的并集。\n\n<p>2026-08-12 从单值 `role` 换成数组：库早就支持多角色 （`sys_role_member` 唯一键含 role_code、`Perms.of` 取并集）， 是写接口把它压成了单值。"
        merchantNo: 
          type: "string"
          description: "数据域（P-1.1.3）。只对**受限角色**有意义： 社区运营 → communityNo、商家运营 → merchantNo。 给全量角色（超管等）配数据域是配置错误 —— 会让人以为它被限制了，实际没有。"
        communityNo: 
          type: "string"
          description: "社区运营的社区数据域"
        pickupNo: 
          type: "string"
          description: "自提点数据域"
        enabled: 
          type: "boolean"
          description: "是否启用。停用后立即无法登录，历史操作留痕保留"
        mustChangePassword: 
          type: "boolean"
          description: "首登必须改密。 建号时后端生成的一次性初始密码只是「拿到账号」的凭据，不是长期口令。"
        lastLoginAt: 
          type: "string"
          description: "最近登录时间。从未登录为空"
        createdAt: 
          type: "string"
          description: "建档时间"
      required: 
        - "staffNo"
        - "username"
        - "name"
        - "roles"
        - "enabled"
        - "createdAt"
      additionalProperties: false
    RoleDef: 
      type: "object"
      properties: 
        roleCode: 
          type: "string"
          description: "角色码。自定义角色不在 `Role` 联合类型里，所以是 string"
        name: 
          type: "string"
          description: "角色展示名"
        endCode: 
          type: "string"
          description: "端。运营端固定 OPS"
        builtin: 
          type: "boolean"
          description: "内置角色：是 `Perms.java` 的镜像，改了会与回落表分叉 —— 渲染但禁用"
        pointCount: 
          type: "number"
          description: "已授予的功能点数"
        staffCount: 
          type: "number"
          description: "持有该角色的账号数。\n**删角色前唯一能看出「会影响谁」的信息** —— 后端也拦（10441），但那是拦在点下去之后。"
      required: 
        - "roleCode"
        - "name"
        - "endCode"
        - "builtin"
        - "pointCount"
        - "staffCount"
      additionalProperties: false
      description: "角色定义（`GET /ops/perm/roles`）。\n\n**2026-08-12 换形**：原来带 `perms: string[]`（权限码集合）， 现在授权的单位是**功能点**（`sys_role_point`）—— 与后端存的东西一致。\n\n为什么不继续用权限码：库里存功能点，界面勾权限码的话，保存时要把码反向 翻译成功能点集合，而一个码对应多个功能点，反向只能「全给」。\n**那就是翻译层**，而这个仓库里绝大多数跨端缺陷都出自翻译层两边各写一套。"
    AuditLog: 
      type: "object"
      properties: 
        logNo: 
          type: "string"
          description: "日志单号"
        at: 
          type: "string"
          description: "操作时间"
        operator: 
          type: "string"
          description: "操作人（STAFF 账号）"
        action: 
          type: "string"
          description: "动作描述，如「授予角色权限」「停用员工」"
        target: 
          type: "string"
          description: "操作对象，如员工号 / 角色名"
        detail: 
          type: "string"
          description: "详细内容，含变更前后值"
        critical: 
          type: "boolean"
          description: "是否涉及高危权限（矩阵 §2.3 的那批码）"
        ip: 
          type: "string"
          description: "操作者 IP。后端拿不到（非请求线程）时为空，不是所有旧数据都有"
        clientType: 
          type: "string"
          description: "操作端，如 WEB_OPS。同上，可能没有"
        before: 
          type: "string"
          description: "变更前结构化快照（JSON 字符串）。只有员工与权限域的部分动作有，其余为空——不伪造"
        after: 
          type: "string"
          description: "变更后结构化快照，同上"
      required: 
        - "logNo"
        - "at"
        - "operator"
        - "action"
        - "target"
        - "detail"
        - "critical"
      additionalProperties: false
      description: "审计日志（P-1.1.4）。只读不可删（合规）。"
    AttrSource: 
      type: "string"
      enum: 
        - "STORE_CODE"
        - "INVITER"
        - "CHANNEL"
      description: "归因来源。优先级是**全序**，不是三个独立开关。"
    ConflictPolicy: 
      type: "string"
      enum: 
        - "KEEP_FIRST"
        - "OVERWRITE"
        - "ASK_USER"
      description: "店铺码归因冲突处置（P-9.1.5，矩阵 **B1 未拍板**）： 用户已归属 A 店，又扫了 B 店的码，算谁的？"
    NewUserFactor: 
      type: "string"
      enum: 
        - "DEVICE"
        - "PHONE"
      description: "新客判定因子（P-9.2.3）。至少选一个 —— 一个都不选等于所有人都是新客。"
    AttributionRule: 
      type: "object"
      properties: 
        priority: 
          type: "array"
          items: 
            "$ref": "#/definitions/AttrSource"
          description: "全序优先级，高→低。不重不漏，否则冲突时会随机裁决"
        windowDays: 
          type: "number"
          description: "归因窗口期（天），1–90"
        conflictPolicy: 
          "$ref": "#/definitions/ConflictPolicy"
          description: "归因冲突处置策略（矩阵 B1 未拍板，故可配）"
        newUserFactors: 
          type: "array"
          items: 
            "$ref": "#/definitions/NewUserFactor"
          description: "新客判定因子。**至少选一个** —— 一个都不选等于所有人都是新客"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "priority"
        - "windowDays"
        - "conflictPolicy"
        - "newUserFactors"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
    AttributionTrace: 
      type: "object"
      properties: 
        traceNo: 
          type: "string"
          description: "归因链路单号"
        userNo: 
          type: "string"
          description: "被归因的用户号。**后端下发的是它**（`MktAttributionLog.userNo`）。"
        userNickname: 
          type: "string"
          description: "用户昵称。**后端目前不下发** —— 它要连 usr_account 才拿得到。 页面回落显示 userNo：空着一列比显示用户号更难查。"
        source: 
          "$ref": "#/definitions/AttrSource"
          description: "归因来源"
        sourceRef: 
          type: "string"
          description: "归因载体：店铺码 / 邀请人昵称 / 渠道名"
        attributedAt: 
          type: "string"
          description: "归因发生时间"
        orderNo: 
          type: "string"
          description: "首单订单号；还没下单则为空"
        conflictWith: 
          type: "string"
          description: "与之冲突的另一次归因（B1 的现实场景）"
        riskSignals: 
          type: "array"
          items: 
            type: "string"
          description: "命中的风控信号。**可选：后端目前一条都不下发。**\n\n<p>归因链路是从 `mkt_attribution_log` 拼的，那张表没有风控信号 —— 也就是说这一列在真实后端上永远是空的（mock 里有「同设备」「同 IP」这类样例， 所以开发时看着是有的）。\n\n<p>声明成必填的代价是**整页崩**：页面 `t.riskSignals.length` 打在 undefined 上， TypeError 直接把 /growth?tab=traces 变成白屏，而这一页在生产上是点得到的。 改成可选只是让它不撒谎，**风控信号本身仍然是个没做的功能**。"
      required: 
        - "traceNo"
        - "userNo"
        - "source"
        - "sourceRef"
        - "attributedAt"
      additionalProperties: false
      description: "一条归因链路（P-9.1.3）。风控从这里看\"这个人是怎么被带进来的\"。"
    RewardType: 
      type: "string"
      const: "COUPON"
      description: "邀请有礼（P-9.2.1）。 ⚠️ 奖励**只能是券**：ADR-004 去团长化后不存在现金激励 —— 一旦发现金，职业薅羊毛立刻回来，且归因作弊有了直接变现路径。"
    FissionCampaign: 
      type: "object"
      properties: 
        fissionNo: 
          type: "string"
          description: "活动单号"
        name: 
          type: "string"
          description: "活动名"
        rewardType: 
          "$ref": "#/definitions/RewardType"
          description: "奖励类型。**只能是券** —— 发现金会让职业薅羊毛立刻回来"
        couponNo: 
          type: "string"
          description: "奖励券模板号（对应营销域的 Coupon）"
        inviterCount: 
          type: "number"
          description: "邀请人得几张"
        inviteeCount: 
          type: "number"
          description: "被邀请人得几张"
        enabled: 
          type: "boolean"
          description: "是否启用"
        invitedCount: 
          type: "number"
          description: "累计邀请人数"
        convertedCount: 
          type: "number"
          description: "其中转化（完成首单）的人数"
        createdAt: 
          type: "string"
          description: "创建时间"
      required: 
        - "fissionNo"
        - "name"
        - "rewardType"
        - "couponNo"
        - "inviterCount"
        - "inviteeCount"
        - "enabled"
        - "invitedCount"
        - "convertedCount"
        - "createdAt"
      additionalProperties: false
    RiskType: 
      type: "string"
      enum: 
        - "FAKE_ORDER"
        - "ABNORMAL_FISSION"
        - "MALICIOUS_REFUND"
    RiskStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "CONFIRMED"
        - "DISMISSED"
    RiskEvent: 
      type: "object"
      properties: 
        eventNo: 
          type: "string"
          description: "风险事件单号"
        type: 
          "$ref": "#/definitions/RiskType"
          description: "风险类型。**三类同表用 type 区分** —— 拆表就看不出「同时命中几类」"
        subject: 
          type: "string"
          description: "主体：用户昵称 / 商家名 / 设备号"
        subjectType: 
          "$ref": "#/definitions/SubjectType"
          description: "主体类型，决定 `subject` 是昵称、店名还是设备号"
        signals: 
          type: "array"
          items: 
            type: "string"
          description: "命中的信号。**不给分值** —— 分值口径要等有真实样本后由风控定， 现在编一个看起来很准的分数，只会让人照着它做决定。"
        refs: 
          type: "array"
          items: 
            type: "string"
          description: "关联证据：订单号 / 归因链路号"
        status: 
          "$ref": "#/definitions/RiskStatus"
          description: "处置状态"
        createdAt: 
          type: "string"
          description: "事件产生时间"
        verdict: 
          type: "string"
          description: "处置结论"
      required: 
        - "eventNo"
        - "type"
        - "subject"
        - "subjectType"
        - "signals"
        - "refs"
        - "status"
        - "createdAt"
      additionalProperties: false
    SubjectType: 
      type: "string"
      enum: 
        - "USER"
        - "MERCHANT"
        - "DEVICE"
    BlacklistAppealStatus: 
      type: "string"
      enum: 
        - "NONE"
        - "PENDING"
        - "UPHELD"
        - "REJECTED"
      description: "黑名单申诉状态。 ⚠️ 刻意不叫 `AppealStatus` —— 评价域（P-13.1.3 恶意差评申诉）已经有一个同名类型， 两者是完全不同的东西（一个是商家申诉差评，一个是被拉黑者申诉解禁）。 同名会在 `lib/types` 的总出口上直接冲突，也会让读代码的人以为它们是一回事。"
    BlacklistEntry: 
      type: "object"
      properties: 
        blackNo: 
          type: "string"
          description: "黑名单单号"
        subjectType: 
          "$ref": "#/definitions/SubjectType"
          description: "主体类型"
        subject: 
          type: "string"
          description: "主体标识：用户昵称 / 商家名 / 设备号"
        reason: 
          type: "string"
          description: "拉黑原因，必填"
        until: 
          type: "string"
          description: "到期时间，必填 —— 无期限拉黑没有申诉出口，是产品事故不是风控严格"
        appealStatus: 
          "$ref": "#/definitions/BlacklistAppealStatus"
          description: "申诉状态。**与评价域的 `AppealStatus` 是两回事**，勿混用"
        appealReason: 
          type: "string"
          description: "被拉黑者提交的申诉理由"
        appealVerdict: 
          type: "string"
          description: "申诉裁决说明"
        active: 
          type: "boolean"
          description: "是否生效中。到期或申诉通过后置 false，记录保留"
        createdAt: 
          type: "string"
          description: "拉黑时间"
      required: 
        - "blackNo"
        - "subjectType"
        - "subject"
        - "reason"
        - "until"
        - "appealStatus"
        - "active"
        - "createdAt"
      additionalProperties: false
    RiskRule: 
      type: "object"
      properties: 
        type: 
          "$ref": "#/definitions/RiskType"
          description: "适用的风险类型，一类一条"
        threshold: 
          type: "number"
          description: "触发阈值（如同设备下单数、同 IP 邀请数、30 天退款次数），必须 > 0"
        autoBlock: 
          type: "boolean"
          description: "命中后是否自动拦截；false = 只记事件等人工"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
      required: 
        - "type"
        - "threshold"
        - "autoBlock"
        - "updatedAt"
      additionalProperties: false
      description: "拦截规则（P-16.2.5）：各类型的触发阈值 + 是否自动拦截。"
    MsgChannel: 
      type: "string"
      enum: 
        - "SMS"
        - "MAIL"
        - "WXSUB"
        - "PUSH"
        - "INAPP"
      description: "模板所属通道。**与后端 `SysNotifyLog` 的四个常量 + INAPP 一致**。\n\n<p>旧值 `SUBSCRIBE/PUSH/INBOX` 来自 V20 的建表注释，而代码与种子（V141） 用的一直是这一套 —— 两套名字并存时，模板列表的通道列会显示成空白。"
    MsgTemplate: 
      type: "object"
      properties: 
        templateNo: 
          type: "string"
          description: "模板单号"
        name: 
          type: "string"
          description: "模板名"
        channel: 
          "$ref": "#/definitions/MsgChannel"
          description: "触达渠道"
        lang: 
          type: "string"
          description: "语言（zh-CN / en / ar）。\n\n<p>同一个 templateNo 每种语言一行（V145）——**列表上必须显示它**， 否则运营看到的是两条一模一样的模板，改了其中一条还发现\"没生效\"。"
        content: 
          type: "string"
          description: "模板正文，含 {占位符}。**模拟发送靠它展示「会发出什么」并做预览**"
        providerTemplateId: 
          type: 
            - "string"
            - "null"
          description: "渠道侧模板 ID（阿里云 `SMS_xxx` / 微信模板号）。站内信为空。\n\n<p>后端 `TemplateVO` 一直有这个字段，端上类型此前漏了 —— 于是页面拿不到它， 而它正是运营核对「我们发的是哪个报备模板」的唯一凭据。"
        enabled: 
          type: "boolean"
          description: "是否启用。停用后引用它的推送任务发不出去"
        sentCount: 
          type: "number"
          description: "近 30 天发送量"
      required: 
        - "templateNo"
        - "name"
        - "channel"
        - "content"
        - "enabled"
        - "sentCount"
      additionalProperties: false
      description: "订阅消息模板（P-14.1.1）。"
    NotifyQuota: 
      type: "object"
      properties: 
        dailyPerUser: 
          type: "number"
          description: "单用户单日消息上限"
        minIntervalHours: 
          type: "number"
          description: "同一模板对同一用户的最小间隔（小时）"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "dailyPerUser"
        - "minIntervalHours"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "触达频控（P-14.1.4）。 两个上限都必须 > 0 —— 0 等于没有频控，但界面上看着像配了，比不配更危险。"
    TicketStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "ASSIGNED"
        - "RESOLVED"
        - "CLOSED"
    Ticket: 
      type: "object"
      properties: 
        ticketNo: 
          type: "string"
          description: "工单号"
        title: 
          type: "string"
          description: "工单标题"
        userNickname: 
          type: "string"
          description: "提单用户昵称"
        orderNo: 
          type: "string"
          description: "关联订单，可空"
        status: 
          "$ref": "#/definitions/TicketStatus"
          description: "工单状态。允许的流转见 `TICKET_TRANSITIONS`"
        assignee: 
          type: "string"
          description: "处理人（员工登录名）；未分派为空"
        proxyActions: 
          type: "array"
          items: 
            type: "string"
          description: "代客操作留痕（P-14.2.3）：谁、对什么、做了什么。\n\n**可选，不要去掉 `?`。** 后端 `TicketVO` 目前不下发这个字段 （`MessageVOs.java` 里只有 ticketNo/subject/content/orderNo/status/reply/createdAt/repliedAt）， 只有 mock 有。声明成必填数组 + `page.tsx` 直接 `.length` = 真接口下抛 TypeError。 与 `Merchant.qualifications` 同一形状，由 `ops-contract-fields` 守卫抓出。"
        createdAt: 
          type: "string"
          description: "提单时间"
        reply: 
          type: "string"
          description: "客服回复正文。**用户在 C 端工单详情页看的就是这个字段**。\n\n此前它在三层上各缺一处：后端 `notify_ticket` 建表就留了 `reply`/`replied_at`/`replied_by` 且注释写明「代客操作要能追到人」，但没有任何代码写过它们； 契约里也从没定义过「回复」这个动作（只有分派、关闭、代客留痕）。 于是用户提单后反复点开详情，看到的永远是空的，而且不报任何错。"
        repliedAt: 
          type: "string"
          description: "回复时间；未回复为空"
        repliedBy: 
          type: "string"
          description: "回复人（员工登录名）。回复署的是平台的名，必须能追到人"
      required: 
        - "ticketNo"
        - "title"
        - "userNickname"
        - "status"
        - "createdAt"
      additionalProperties: false
      description: "客服工单（P-14.2.1）。"
    FaqEntry: 
      type: "object"
      properties: 
        faqNo: 
          type: "string"
          description: "条目单号"
        question: 
          type: "string"
          description: "问题"
        answer: 
          type: "string"
          description: "答案正文"
        category: 
          type: "string"
          description: "所属分类，用于帮助中心分组"
        published: 
          type: "boolean"
          description: "是否已发布。未发布的用户看不到"
        views: 
          type: "number"
          description: "浏览量，用来发现「大家其实在问什么」"
      required: 
        - "faqNo"
        - "question"
        - "answer"
        - "category"
        - "published"
        - "views"
      additionalProperties: false
      description: "帮助中心条目（P-14.2.4）。"
    NotifyChannel: 
      type: "string"
      enum: 
        - "SMS"
        - "MAIL"
        - "WXSUB"
        - "PUSH"
      description: "外发渠道。**与后端 `SysNotifyLog` 的四个常量逐字一致**。\n\n<p>WXSUB = 微信小程序订阅消息（服务通知），target 是掩码后的 openid； PUSH = App 推送（个推/uni-push，ADR-018），target 是掩码后的 clientId。\n\n<p><b>站内信（INAPP）不在这里</b>：它不进 `sys_notify_log`， 它自己就是一张可查的表（`notify_message`）。混进来会让人以为能在发送记录里查到它。"
    NotifyChannelHealth: 
      type: "object"
      properties: 
        channel: 
          "$ref": "#/definitions/NotifyChannel"
          description: "通道"
        stub: 
          type: "boolean"
          description: "走桩：不真发，只记日志"
        enabled: 
          type: "boolean"
          description: "真实通道已启用（!stub）"
        credentials: 
          type: "array"
          items: 
            type: "object"
            properties: 
              envVar: 
                type: "string"
              present: 
                type: "boolean"
              required: 
                type: "boolean"
            required: 
              - "envVar"
              - "present"
              - "required"
            additionalProperties: false
          description: "这条通道的凭据配没配全。**没配全就发不出**，而症状是「发送成功」后没人收到"
        params: 
          type: "array"
          items: 
            type: "object"
            properties: 
              key: 
                type: "string"
              value: 
                type: "string"
            required: 
              - "key"
              - "value"
            additionalProperties: false
          description: "非密业务参数，可回显（模板号、endpoint 这类本就印在短信里的东西）"
        todaySent: 
          type: "number"
          description: "今天发了多少条"
        todayFailed: 
          type: "number"
          description: "今天失败多少条"
      required: 
        - "channel"
        - "stub"
        - "enabled"
        - "credentials"
        - "params"
        - "todaySent"
        - "todayFailed"
      additionalProperties: false
      description: "通道体检（TDD-运营端触达中心 §4.1）。\n\n<p><b>凭据只有「配没配」，没有值</b>：一个能在 Web 上读出生产短信密钥的接口， 泄漏一次就是全平台可群发。要改密钥去改环境变量并重启，不在这个页面上改。"
    WxTemplates: 
      type: "object"
      properties: 
        orderArrived: 
          type: "string"
          description: "「订单已送达」用的微信模板 id"
        refunded: 
          type: "string"
          description: "「退款成功」用的微信模板 id"
      required: 
        - "orderArrived"
        - "refunded"
      additionalProperties: false
      description: "微信订阅消息的模板号映射。**唯一一项开放到运营端的通道参数**（模板号不是凭据）。"
    InboxMessageType: 
      type: "string"
      enum: 
        - "TRADE"
        - "MARKETING"
        - "SYSTEM"
      description: "与后端 MsgMessage 的三个常量逐字一致 —— 内联在 interface 里的话对登记表不可见（规范 §D5）"
    InboxMessage: 
      type: "object"
      properties: 
        messageNo: 
          type: "string"
          description: "消息号"
        type: 
          "$ref": "#/definitions/InboxMessageType"
          description: "类型"
        title: 
          type: "string"
          description: "标题"
        body: 
          type: "string"
          description: "正文"
        link: 
          type: 
            - "string"
            - "null"
          description: "点开跳哪儿。空 = 只是一条通知，点不动"
        read: 
          type: "boolean"
          description: "已读"
        at: 
          type: "number"
          description: "发生时刻"
      required: 
        - "messageNo"
        - "type"
        - "title"
        - "body"
        - "read"
        - "at"
      additionalProperties: false
      description: "运营自己的通知收件箱（顶栏铃铛）。 与 NotifyLog 是两回事：这个是**发给运营的待办**（新工单/待审核/告警）， 那个是**平台发给用户**的触达留痕。"
    InAppLog: 
      type: "object"
      properties: 
        messageNo: 
          type: "string"
          description: "消息号"
        receiverType: 
          type: "string"
          description: "USER / STAFF / OPS"
        receiverNo: 
          type: "string"
          description: "收件人编号。**不掩码**：它是平台内部标识（userNo），不是手机号邮箱"
        type: 
          "$ref": "#/definitions/InboxMessageType"
          description: "类型"
        title: 
          type: "string"
          description: "标题"
        templateNo: 
          type: 
            - "string"
            - "null"
          description: "模板号"
        read: 
          type: "boolean"
          description: "已读"
        at: 
          type: "number"
          description: "发生时刻"
      required: 
        - "messageNo"
        - "receiverType"
        - "receiverNo"
        - "type"
        - "title"
        - "read"
        - "at"
      additionalProperties: false
      description: "站内信的平台侧记录（发送记录页第二个 tab）。\n\n<p><b>没有 status</b>：站内信入库即到达，不存在「发送中/失败」—— 这正是它与 NotifyLog 不能合成一张表的原因。"
    NotifyStatus: 
      type: "string"
      enum: 
        - "SENT"
        - "FAILED"
      description: "发送结果。**失败也记**——只记成功的话，这张表回答不了「他为什么没收到」。"
    SceneChannelCell: 
      type: "object"
      properties: 
        scene: 
          type: "string"
          description: "场景码（订单已支付、售后已受理…）"
        audience: 
          type: "string"
          description: "受众：买家 / 商家 / 运营"
        channel: 
          type: "string"
          description: "通道"
        enabled: 
          type: "boolean"
          description: "启用中"
        pushLevel: 
          type: "string"
          description: "推送等级（App 推送用；其它通道为空）"
        locked: 
          type: "boolean"
          description: "**恒锁定的格子**。站内信（INAPP）是事实记录，运营不可关 —— 后端会拒掉这一格的关闭请求，前端被绕过也兜得住，界面只是别让人白点。"
