        - "categoryNo"
        - "categoryName"
        - "parentName"
        - "dimCount"
        - "dims"
      additionalProperties: false
      description: "类目 × 规格总览的一行（规格库 V195，`GET /ops/category-specs`）。\n\n**一条规格都没绑的类目也会返回**：这张表真正要回答的是「哪些类目还没配」—— 只列已配的，缺口就永远看不见，而缺口的代价是那一类商家建品只能手打， 手打的选项没有 code，跨店聚合就此断掉。"
    CategorySpecDim: 
      type: "object"
      properties: 
        dimNo: 
          type: "string"
          description: "规格维度号"
        code: 
          type: "string"
          description: "语义码 COLOR / WEIGHT。值编号与 optionCode 都以它为前缀"
        name: 
          type: "string"
          description: "名称"
        valueType: 
          type: "string"
          description: "ENUM 枚举 / QUANT 数值+单位"
        unit: 
          type: 
            - "string"
            - "null"
          description: "单位"
        usage: 
          type: "string"
          description: "SALE 进 SKU 笛卡尔积 / PROP 只是描述，不生成规格"
        universal: 
          type: "boolean"
          description: "通用维度：值的含义跨类目一致（颜色、重量）。与只在本类目成立的专用维度相对"
        primary: 
          type: "boolean"
          description: "主维度：商家建品选完类目，自动预填的就是它。每个类目至多一个"
        valueCount: 
          type: "number"
          description: "有几个取值"
        values: 
          type: "array"
          items: 
            "$ref": "#/definitions/CategorySpecValue"
          description: "取值列表"
      required: 
        - "dimNo"
        - "code"
        - "name"
        - "valueType"
        - "usage"
        - "universal"
        - "primary"
        - "valueCount"
        - "values"
      additionalProperties: false
      description: "类目下的一个规格维度。"
    CategorySpecValue: 
      type: "object"
      properties: 
        valueNo: 
          type: "string"
          description: "规格取值号"
        code: 
          type: "string"
          description: "码值"
        label: 
          type: "string"
          description: "该类目下的展示文案，可能被类目级换名换过（500g → 约1斤）"
        numericValue: 
          type: 
            - "number"
            - "null"
          description: "归一量：500g / 半斤 / 0.5kg 都是 500。排序与同规格比价靠它"
        numericUnit: 
          type: 
            - "string"
            - "null"
          description: "归一量的单位。与 numericValue 一起才有意义"
      required: 
        - "valueNo"
        - "code"
        - "label"
      additionalProperties: false
      description: "维度下的一个取值。"
    GoodsAudit: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号。审核动作打在它上面"
        title: 
          type: "string"
          description: "标题。审核先看它 —— 违规多半从标题就能看出来"
        subtitle: 
          type: "string"
          description: "副标题/卖点"
        cover: 
          type: "string"
          description: "封面图。图文不符是驳回的主因之一，所以要能看到图"
        type: 
          type: "string"
          description: "商品形态 NORMAL/FRESH/SERVICE/VIRTUAL/CARD"
        categoryNo: 
          type: "string"
          description: "平台类目。**当前恒为空** —— 商品编辑页还没有选类目这一步"
        merchant: 
          type: "object"
          properties: 
            merchantNo: 
              type: "string"
            name: 
              type: "string"
          required: 
            - "merchantNo"
            - "name"
          additionalProperties: false
          description: "归属商家（后端下发的是一个 brief 对象，不是裸的 merchantNo）—— 审核时要看得到是谁上的架：同一个商家反复交同类违规品是有信号的。"
        status: 
          type: "string"
          description: "商品状态。**字段名是 `status` 不是 `auditStatus`** —— 后端 `GoodsVO` 里它同时承载审核态与上下架态：AUDITING / ON_SALE / OFF_SALE / REJECTED。"
      required: 
        - "goodsNo"
        - "title"
        - "type"
      additionalProperties: false
      description: "待审商品（后端 `prd_goods`，**goods 粒度不是 sku 粒度**）。\n\n<p>与本文件里 `Sku` 的差别：审核判的是「这件商品能不能卖」—— 标题、图、类目、资质都在 goods 上；sku 只是规格与价格。 拿 sku 粒度去审，同一件商品会被审好几遍。"
    GoodsDraftPreview: 
      type: "object"
      properties: 
        changes: 
          type: "array"
          items: 
            type: "object"
            properties: 
              field: 
                type: "string"
              label: 
                type: "string"
              before: 
                type: 
                  - "string"
                  - "null"
              after: 
                type: 
                  - "string"
                  - "null"
            required: 
              - "field"
              - "label"
              - "before"
              - "after"
            additionalProperties: false
          description: "逐字段差异。label 是服务端给的中文名，界面只排版不加工"
        blocked: 
          type: "array"
          items: 
            type: "string"
          description: "引用了已停用/已合并规格档的档位 —— 非空时「通过」会在换版时失败（80017）"
        stale: 
          type: "boolean"
          description: "草稿基版过期（商家确认后会重新基线）。审核侧只作提示，不拦动作"
        baseVersion: 
          type: "number"
          description: "差异所基于的线上 version（商家确认发布用；审核侧不消费）"
      required: 
        - "changes"
        - "blocked"
        - "stale"
        - "baseVersion"
      additionalProperties: false
      description: "待审草稿的字段级差异（双版本，`GET /ops/goods/{goodsNo}/draft-preview`）。\n\n<p>审核开着时，队列里那件 AUDITING 商品**线上照卖旧版**，详情给的也是旧版 —— 没有这份 diff，审核员批准的是一个自己从没看过的版本。与商家发布确认页 出自服务端**同一段代码**，两边看到的不可能不一致。\n\n<p>接口对无草稿的商品返回 `null`（新建提审等老链路审的是内容本身）—— 常态不是错误。"
    GoodsDetail: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        title: 
          type: "string"
          description: "标题（按当前语言拍平后的那一份）"
        subtitle: 
          type: "string"
          description: "副标题 / 卖点"
        cover: 
          type: "string"
          description: "封面图"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "详情图。后端必发（可能是空数组）"
        type: 
          type: "string"
          description: "商品形态 NORMAL/FRESH/SERVICE/VIRTUAL/CARD"
        categoryNo: 
          type: "string"
          description: "平台类目"
        merchant: 
          type: "object"
          properties: 
            merchantNo: 
              type: "string"
            name: 
              type: "string"
          required: 
            - "merchantNo"
            - "name"
          additionalProperties: false
          description: "归属商家 brief —— 审核要看得到是谁上的架"
        titleI18n: 
          "$ref": "#/definitions/Partial%3CRecord%3C(%22zh%22%7C%22en%22%7C%22ar%22)%2Cstring%3E%3E"
          description: "三语标题原文（`prd_goods.title_i18n`）。 运营审文案看的是它，而不是拍平后的 `title` —— 拍平那份看不出缺译。"
        subtitleI18n: 
          "$ref": "#/definitions/Partial%3CRecord%3C(%22zh%22%7C%22en%22%7C%22ar%22)%2Cstring%3E%3E"
          description: "三语副标题原文，同  {@link  titleI18n }"
        specGroups: 
          type: "array"
          items: 
            type: "object"
            properties: 
              name: 
                type: "string"
              options: 
                type: "array"
                items: 
                  type: "string"
            required: 
              - "name"
              - "options"
            additionalProperties: false
          description: "规格组（如「重量」→「500g / 1kg」）。后端必发"
        skus: 
          type: "array"
          items: 
            "$ref": "#/definitions/GoodsDetailSku"
          description: "SKU 矩阵。后端必发"
        fulfillments: 
          type: "array"
          items: 
            type: "string"
          description: "支持的履约方式（自提 / 配送 …）。后端必发"
        price: 
          type: "number"
          description: "展示价 = 最低 SKU 价（分）"
        status: 
          type: "string"
          description: "商品状态：AUDITING / ON_SALE / OFF_SALE / REJECTED"
        auditReason: 
          type: 
            - "string"
            - "null"
          description: "最近一次驳回 / 强制下架的原因。\n**它是商家能看到的那半边** —— 审计日志只有运营看得到， 没有它商家面对 REJECTED 只能猜要改什么。过审时清空。"
      required: 
        - "goodsNo"
        - "title"
        - "images"
        - "type"
        - "specGroups"
        - "skus"
        - "fulfillments"
      additionalProperties: false
      description: "商品详情（后端 `GoodsVO`，`GET /ops/goods/{goodsNo}`）。\n\n<p>**只声明运营端抽屉真的会读的字段** —— 后端那份 VO 是 C 端契约， 有近三十个字段（评分、销量、拼团配置、称重克重…），照抄一遍等于在前端 维护一份\"我们从不显示\"的清单，而它每次后端调整都会假性变更。\n\n<p>与  {@link  ProductGoods }  的关系：那是**列表行**（一次给一页，字段窄）， 这是**单条详情**（一次一件，字段全）。两者故意不是同一个类型： 列表塞进详情的字段会让分页响应大一个量级。"
    "Partial<Record<(\"zh\"|\"en\"|\"ar\"),string>>": 
      type: "object"
      properties: 
        zh: 
          type: "string"
        en: 
          type: "string"
        ar: 
          type: "string"
      additionalProperties: false
    GoodsDetailSku: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "规格单号"
