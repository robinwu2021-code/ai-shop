        blockedAt: 
          type: 
            - "number"
            - "null"
          description: "挂起时刻。与 blockExpireAt 一起才看得出「还剩多久自动放行」"
        blockExpireAt: 
          type: 
            - "number"
            - "null"
          description: "挂起时限。超时自动放行并告警 —— 没有时限的挂起等于永久冻结"
        decidedBy: 
          type: 
            - "string"
            - "null"
          description: "人工放行者；**SYSTEM_TIMEOUT = 超时自动放行**，要单独看"
        decideRemark: 
          type: 
            - "string"
            - "null"
