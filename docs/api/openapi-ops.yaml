    InvDocKind: 
      type: "string"
      enum: 
        - "IN"
        - "OUT"
      description: "台账方向。IN 入库 / OUT 出库 —— 与 shared 的 StockDocKind 同义，归一属另一批"
    InvLedgerPage: 
      type: "object"
