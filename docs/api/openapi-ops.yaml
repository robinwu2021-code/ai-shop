      additionalProperties: false
    SplitLog: 
      type: "object"
      properties: 
        settleNo: 
          type: "string"
          description: "所属结算单"
        subOrderNo: 
          type: "string"
          description: "对应的子订单"
        splitAction: 
          type: "string"
          description: "SPLIT / REVERSE / SUBSIDY / SUBSIDY_RETURN"
        amountMinor: 
          type: "number"
          description: "该指令的金额。**补差与分账口径不同**"
        result: 
          type: "string"
          description: "SUCCESS / FAIL"
        requestNo: 
          type: "string"
          description: "平台侧幂等号"
        providerNo: 
          type: 
            - "string"
            - "null"
