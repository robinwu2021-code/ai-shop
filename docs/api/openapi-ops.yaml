        goodsCount: 
          type: "number"
          description: "这个类目下有几件商品"
        onSaleCount: 
          type: "number"
          description: "其中在架几件。**归档前要看** —— 在架的会一起下架"
        activeChildren: 
          type: "number"
          description: "还开着的子类目数。**大于 0 时后端仍会拒** —— 会冒出渲染不出来的孤儿节点"
      required: 
        - "goodsCount"
        - "onSaleCount"
        - "activeChildren"
      additionalProperties: false
      description: "停用一个类目的影响面（`GET /ops/categories/{no}/archive-impact`）。\n\n**有在售商品不再是拦截**：运营停一个类目多半是政策要求（这一类这期不做、 资质链路没接上），拦住他并不能让那批商品消失。界面把后果说清楚，由他决定。"
    CategorySpec: 
      type: "object"
