        name: 
          type: "string"
          description: "维度名（「颜色」「净重」）"
        valueType: 
          type: "string"
          description: "ENUM 枚举 / QUANT 数值+单位。QUANT 的值必须有归一量"
        unit: 
          type: 
            - "string"
            - "null"
          description: "单位。QUANT 型必填，ENUM 型为空"
        usageType: 
          type: "string"
          description: "SALE 进 SKU 笛卡尔积 / PROP 只是描述"
        universal: 
          type: "boolean"
          description: "通用维度：所有类目都能用"
        scope: 
