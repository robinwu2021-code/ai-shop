        - "NEGATIVE"
        - "ZERO_ON_SALE"
        - "STALE"
      description: "不健康库存的类型。**它决定这一行怎么念，也决定该找谁**"
    InvBalanceRow: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "物料号（进销存自己的编号）"
        name: 
          type: "string"
          description: "维度名（「颜色」「净重」）"
        specText: 
          type: "string"
          description: "规格描述。人读的，不参与匹配"
        baseUom: 
          type: "string"
          description: "基本计量单位。**所有数量以它为准**"
        onHand: 
          type: "number"
          description: "实存"
        reserved: 
          type: "number"
          description: "预留：下了单还没付钱的量"
        available: 
          type: "number"
          description: "可用 = 实存 − 预留"
        safetyStock: 
          type: 
            - "number"
            - "null"
          description: "安全库存。低于它算缺货，0 = 不设"
        lastMovedAt: 
          type: 
            - "string"
            - "null"
