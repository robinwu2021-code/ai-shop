        - "entityNo"
        - "payChannel"
        - "settleCycle"
        - "periodFrom"
        - "dueAt"
        - "releasedAt"
        - "freezeExpireAt"
        - "status"
        - "billCount"
        - "grossMinor"
        - "netMinor"
        - "reconScope"
        - "blockedReason"
        - "blockedAt"
        - "blockExpireAt"
        - "decidedBy"
        - "decideRemark"
