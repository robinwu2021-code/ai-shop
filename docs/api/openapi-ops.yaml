        - "appSecret"
      additionalProperties: false
      description: "签发的返回。**`appSecret` 这辈子只出现这一次**"
    SettleStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "SPLITTING"
        - "SPLIT"
        - "SPLIT_CONFIRMED"
        - "OFFLINE_SETTLED"
        - "RETRYING"
        - "MANUAL"
        - "REVERSED"
        - "PENDING_RECON"
        - "CONFIRMED"
        - "PAID"
      description: "⚠️ **`SPLIT` 曾经同时表示「指令已发出」与「钱已到」**，而底下调的是桩实现 —— 账面显示已分账而一分钱没动。2026-08-26 拆开，到账另立 `SPLIT_CONFIRMED`。\n\n⚠️ 说明写在这里而不是夹在值之间：`enum-registry` 的扫描正则只认 「值行 + 行尾注释」，**整行注释会把 union 打断** —— 打断之后这个枚举在登记表里会被报成「代码里已不存在」。"
    PointsOverview: 
      type: "object"
      properties: 
        circulatingPoints: 
          type: "number"
          description: "流通中的积分（用户可用 + 待生效）"
        poolBalanceMinor: 
          type: "number"
          description: "池子余额（分）。与上一个数对不上就是失衡"
        periodRedeemMinor: 
          type: "number"
          description: "本期兑付（分）：补给商家的钱"
        byChannel: 
          type: "array"
          items: 
            "$ref": "#/definitions/PoolByChannel"
          description: "按通道分的账本。**不能只看总数** —— 账面是一个池子，钱实际分散在两个通道账户； 一个溢一个空的时候，总数仍然是平的。"
      required: 
        - "circulatingPoints"
        - "poolBalanceMinor"
        - "periodRedeemMinor"
        - "byChannel"
      additionalProperties: false
      description: "积分资金总览。\n\n**三个数摆在一起是刻意的** —— 恒等式是「流通中的积分 == 池子里的钱」， 分开看的话，失衡要等到有人主动比对才会发现。"
