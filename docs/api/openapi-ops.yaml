openapi: "3.1.0"
info: 
  title: "ai-shop 平台运营端（ops-web）"
  version: "0.1.0"
  description: "由 ops-web 的契约自动生成，请勿手改（cd ops-web && npm run gen:api）。\n\n口径：响应包 {code,msg,data}，分页 {records,total,page,size}，camelCase，\n业务单号 xxxNo，时间 xxxAt，枚举大写下划线，金额为最小货币单位整数。\n禁止 delete*，软删除用 archive*/unarchive*。\n\n鉴权：STAFF 池 Bearer + RBAC + 数据域（矩阵 §2.3）。\n越权拦截以后端为准 —— 前端只做展示裁剪。"
servers: 
  - url: "http://localhost:8080"
    description: "本地后端"
components: 
  securitySchemes: 
    bearerAuth: 
      type: "http"
      scheme: "bearer"
      description: "STAFF 池 Bearer，含角色与数据域声明"
  schemas: 
    Archivable: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
      additionalProperties: false
      description: "可归档主数据的公共字段（G1 软删除）。"
    DataScope: 
      type: "object"
      properties: 
        tenantNo: 
          type: "string"
          description: "租户，MVP 恒为 MAIN（预留多租户，见矩阵 P-17.1.6）"
        merchantNo: 
          type: "string"
          description: "限定到某商家（商家运营 BD 角色）"
        communityNo: 
          type: "string"
          description: "限定到某社区（社区运营角色）"
        pickupNo: 
          type: "string"
          description: "限定到某自提点"
      required: 
        - "tenantNo"
      additionalProperties: false
      description: "平台端数据域：所有列表查询由后端按此裁剪，前端只做展示。"
    MerchantTier: 
      type: "string"
      enum: 
        - "SMALL"
        - "MEDIUM"
        - "LARGE"
      description: "商家**分层**（规模）。对应 `mch_entity.tier`，与 shared 的 `MerchantTier` 同名同值。\n\n⚠️ 这里此前是 `PERSONAL | INDIVIDUAL | COMPANY` —— 那是**主体类型**的旧取值 （权威码见 shared 的 `MerchantSubject`：MICRO / INDIVIDUAL / ENTERPRISE）。 名字对得上后端字段，取值却来自另一个概念，于是这一列**永远显示不出东西**： 后端下发的 tier 要么是 null（一期没启用分层），要么是 SMALL， 而 SMALL 不在这个联合类型里，i18n 也查不到词条。\n\n<p>如果运营界面真正想看的是**主体类型**（小微/个体户/企业），那要后端在 ops 商家 VO 里补一个字段 —— `mch_entity` 上没有 subject 列， 它在申请单与进件表上。这是另一件事，不能靠改端上的类型变出来。"
    MerchantStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "SUSPENDED"
        - "FROZEN"
      description: "商家的**经营状态**。取值与后端 `mch_entity.status` 一致。\n\n⚠️ 它**不是入驻审核状态** —— 审核状态在申请单上（ {@link  ApplyStatus } ， PENDING/REVIEWING/APPROVED/REJECTED），后端刻意分成两张表： `mch_entity_apply` 记「这次申请审到哪了」，`mch_entity` 记「这家店现在能不能做生意」。\n\n这里曾经把两者揉成一个字段（DRAFT/SUBMITTED/REVIEWING/APPROVED/REJECTED/SUSPENDED）， 于是一家已经在正常经营、又提交了第二张执照的商家，status 该填什么无解 —— 而这正是「一人多主体」的常见情形。"
    Merchant: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        merchantNo: 
          type: "string"
          description: "商家单号"
        name: 
          type: "string"
          description: "店铺名"
        tier: 
          "$ref": "#/definitions/MerchantTier"
          description: "商家分层，为引入大商家预留"
        status: 
          "$ref": "#/definitions/MerchantStatus"
          description: "**经营状态**（不是审核状态 —— 审核在申请单上）。合法迁移见 `MERCHANT_TRANSITIONS`"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "服务的社区。**是列表不是单个** —— 一家店可以服务多个社区 （后端 `mch_entity_community`，服务范围三档见 ADR-009）。 此前这里是单个 `communityNo`，多社区商家只会显示其中一个。"
        contactName: 
          type: "string"
          description: "联系人姓名"
        contactPhone: 
          type: "string"
          description: "展示一律脱敏（中间四位掩码），完整号码不下发前端"
        categoryCodes: 
          type: "array"
          items: 
            type: "string"
          description: "经营类目编码，审核通过后即类目授权范围（P-11.1.3）"
        verified: 
          type: "boolean"
          description: "认证标（P-11.1.2）"
        qualifications: 
          type: "array"
          items: 
            type: "string"
          description: "已上传并通过的资质名。授权需要资质的类目码时要对照它"
        breachCount: 
          type: "number"
          description: "信用档案：毁约次数（P-11.1.5 / ADR-003）"
        settleAccountReady: 
          type: "boolean"
          description: "分账接收方报备状态（P-12.1.1，ADR-002）"
        createdAt: 
          type: "string"
          description: "入驻申请提交时间"
        auditRemark: 
          type: "string"
          description: "最近一次审核意见（驳回原因/补交项）"
        asPickupPoint: 
          type: "boolean"
          description: "申请人是否愿意承接自提点（ADR-005）。\n\n**只是意愿，通过审核不会自动建点** —— 自提点的服务费口径是逐点线下谈的， 没有一个默认值能覆盖。放在审核页上是为了让运营**看见有人在等**： 不显示的话，申请人勾了这一项、通过后什么也没发生，而中间没有任何一处会报错。"
      required: 
        - "merchantNo"
        - "name"
        - "tier"
        - "status"
        - "communityNos"
        - "contactName"
        - "contactPhone"
        - "categoryCodes"
        - "verified"
        - "qualifications"
        - "breachCount"
        - "settleAccountReady"
        - "createdAt"
      additionalProperties: false
    AuthCode: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "授权码，如 `FRESH_VEG`。**按码授权而不是按类目节点** —— 类目树会重构，能不能卖菜不会"
        name: 
          type: "string"
          description: "授权码展示名"
        requiredQualification: 
          type: "string"
          description: "需要的资质名。为空表示无门槛类目"
      required: 
        - "code"
        - "name"
      additionalProperties: false
      description: "类目授权码。\n\n它与类目树是**多对一**：`CAT111 叶菜`、`CAT112 根茎菜` 都要 `FRESH_VEG`。 按码授权而不是按类目节点授权，是因为类目树会重构，而\"能不能卖菜\"这件事不会。"
    ViolationType: 
      type: "string"
      enum: 
        - "FAKE_GOODS"
        - "BREACH"
        - "PRICE_FRAUD"
        - "SERVICE"
      description: "违规类型。分开是因为**处置尺度不同**，笼统记成\"违规\"之后没法按类型统计。"
    ViolationAction: 
      type: "string"
      enum: 
        - "WARN"
        - "LIMIT"
        - "SUSPEND"
      description: "处置动作。SUSPEND 会真的把商家状态推到 SUSPENDED。"
    Violation: 
      type: "object"
      properties: 
        violationNo: 
          type: "string"
          description: "违规记录单号"
        merchantNo: 
          type: "string"
          description: "涉事商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        type: 
          "$ref": "#/definitions/ViolationType"
          description: "违规类型。**只有 `BREACH` 计入 breachCount**"
        action: 
          "$ref": "#/definitions/ViolationAction"
          description: "处置动作。`SUSPEND` 会真的把商家状态推到 SUSPENDED"
        detail: 
          type: "string"
          description: "事实描述与证据出处。必填 —— 没有事实的处置在申诉时站不住"
        operator: 
          type: "string"
          description: "处置人（STAFF 账号）"
        at: 
          type: "string"
          description: "处置时间"
      required: 
        - "violationNo"
        - "merchantNo"
        - "merchantName"
        - "type"
        - "action"
        - "detail"
        - "operator"
        - "at"
      additionalProperties: false
    ApplyStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "REVIEWING"
        - "APPROVED"
        - "REJECTED"
      description: "入驻申请状态。\n\n**它不是商家的状态** —— 申请与主体是两个东西：通过之前商家<b>还不存在</b>。 曾经把审核建模成「商家的一个状态」，于是驳回的申请会在商家表里留下一行 从没开过张的「僵尸商家」，出现在每一处按主体聚合的地方（结算、积分、报表）。"
    MerchantApply: 
      type: "object"
      properties: 
        applyNo: 
          type: "string"
          description: "申请单号。审核动作都打在它上面，不是商家号"
        merchantNo: 
          type: "string"
          description: "通过后生成的主体号。**未通过时为空** —— 商家在通过之前根本不存在"
        name: 
          type: "string"
          description: "拟用店铺名。**存快照** —— 后来改名不该让历史申请跟着变"
        subject: 
          type: "string"
          description: "法律形态 MICRO / INDIVIDUAL / ENTERPRISE"
        contactName: 
          type: "string"
          description: "联系人姓名。审核要打电话找人"
        contactPhone: 
          type: "string"
          description: "联系手机号（申请人自己填的，不一定是登录号）。**通过后它就是商家账号的登录号**"
        category: 
          type: "string"
          description: "主营类目"
        desc: 
          type: "string"
          description: "店铺简介。通过后会写进主体档案，C 端门店页读的就是它"
        industry: 
          type: "string"
          description: "行业。**决定这家店能不能以小微进件** —— 审核页要看得到它， 否则运营批了一个行业不允许小微的小微商家，通道那边才会拒。"
        serviceScope: 
          type: "string"
          description: "期望服务范围。**商家可以留空，但通过时必须确定** —— 空的后果是商家上着架却对谁都不可见，且没有任何报错。"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "覆盖的小区。scope=COMMUNITY 时**空 = 通过之后对谁都不可见**"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "已传的资质图。个体户/企业必传，小微免 —— 缺它正是驳回的主因"
        asPickupPoint: 
          type: "boolean"
          description: "是否愿意承接自提点（ADR-005）。**只是意愿，不代表点已建立**"
        status: 
          "$ref": "#/definitions/ApplyStatus"
          description: "审核状态"
        rejectReason: 
          type: "string"
          description: "驳回原因。**驳回必写** —— 不写对方只能猜着改"
        createdAt: 
          type: "number"
          description: "提交时间"
        auditedAt: 
          type: "number"
          description: "审核完成时间。待审期间为空"
      required: 
        - "applyNo"
        - "name"
        - "subject"
        - "contactName"
        - "contactPhone"
        - "category"
        - "desc"
        - "asPickupPoint"
        - "status"
        - "createdAt"
      additionalProperties: false
      description: "入驻申请单（后端 `mch_entity_apply`）。"
    FulfillmentType: 
      type: "string"
      enum: 
        - "STORE_PICKUP"
        - "NEIGHBOR_PICKUP"
        - "MERCHANT_DELIVERY"
        - "EXPRESS"
        - "STORE_VERIFY"
      description: "履约方式。**取值与后端 `ord_sub_order.fulfillment` 一致**。\n\n⚠️ 这里曾经写成 `PICKUP_STORE` / `PICKUP_NEIGHBOR` —— 同一个概念、词序反了， 于是按它筛后端一条也匹配不上。ops-web 只跑 mock，所以从没被真实响应打脸过。"
    TrafficSource: 
      type: "string"
      enum: 
        - "MERCHANT_OWNED"
        - "PLATFORM"
        - "INVITE"
        - "CHANNEL"
      description: "流量来源（矩阵 P-12.1.7 按 trafficSource 分档计费）。"
    OrderStatus: 
      type: "string"
      enum: 
        - "WAIT_PAY"
        - "PAID"
        - "SHIPPED"
        - "ARRIVED"
        - "COMPLETED"
        - "CANCELLED"
        - "REFUNDED"
      description: "订单状态。**取值与后端下发的展示状态一致**（`OrderStatusView`）。\n\n⚠️ 这里曾经是另一套：`PENDING_PAY` / `PREPARING` / `DELIVERING` / `AFTER_SALE`。 同一条订单，运营端叫一个名字、C/B 端叫另一个、库里又是第三个 —— 而 ops-web 只跑 mock，所以三套并存了很久没人发现。\n\n后端的口径：库里存 WAIT_FULFILL / FULFILLING（粗，三种履约一视同仁）， 下发时按履约方式展开成下面这些词。运营端按它筛、按它判断可迁移。"
    OrderItem: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "SKU 单号"
        title: 
          type: "string"
          description: "下单时的商品标题快照"
        qty: 
          type: "number"
          description: "件数"
        price: 
          type: "number"
          description: "最小货币单位（分）"
      required: 
        - "skuNo"
        - "title"
        - "qty"
        - "price"
      additionalProperties: false
    Order: 
      type: "object"
      properties: 
        orderNo: 
          type: "string"
          description: "子订单号。**列表展示的就是子订单** —— 分账、售后、结算都以它为单位"
        parentNo: 
          type: "string"
          description: "父单号（同一次结算拆出的子订单共享）"
        status: 
          "$ref": "#/definitions/OrderStatus"
          description: "订单状态。允许的流转见 `ORDER_TRANSITIONS`"
        merchantNo: 
          type: "string"
          description: "归属商家。一个子订单只属于一个商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        communityNo: 
          type: "string"
          description: "归属社区。运营按社区做数据域隔离"
        communityName: 
          type: "string"
          description: "社区名快照"
        pickupNo: 
          type: "string"
          description: "自提点编号；配送/快递单为空"
        fulfillType: 
          "$ref": "#/definitions/FulfillmentType"
          description: "履约方式"
        trafficSource: 
          "$ref": "#/definitions/TrafficSource"
          description: "流量来源。**决定平台费率档**（P-12.1.7）"
        buyerNickname: 
          type: "string"
          description: "买家昵称"
        items: 
          type: "array"
          items: 
            "$ref": "#/definitions/OrderItem"
          description: "订单行"
        payAmount: 
          type: "number"
          description: "实付，最小货币单位（分）"
        createdAt: 
          type: "string"
          description: "下单时间（ISO 8601 字符串）"
        paidAt: 
          type: 
            - "string"
            - "null"
          description: "支付时间。未支付为 null"
        statusAt: 
          type: "string"
          description: "进入**当前状态**的时刻。异常单的\"卡了多久\"从这里算，不是从 createdAt 算"
      required: 
        - "orderNo"
        - "parentNo"
        - "status"
        - "merchantNo"
        - "merchantName"
        - "communityNo"
        - "communityName"
        - "fulfillType"
        - "trafficSource"
        - "buyerNickname"
        - "items"
        - "payAmount"
        - "createdAt"
      additionalProperties: false
    ExceptionKind: 
      type: "string"
      enum: 
        - "STUCK"
        - "PAY_TIMEOUT"
      description: "异常单的成因。\n\n⚠️ 异常单**不是一张表**，而是对订单表的一个视图 —— 一旦落成记录就会过期： 订单已经推进了，异常记录还挂在那里，运营会去处理一个不存在的问题。 所以 `OrderException` 由 `orders` 实时算出来，不存。"
    OrderException: 
      type: "object"
      properties: 
        order: 
          "$ref": "#/definitions/Order"
          description: "关联的订单快照。异常单是**实时算出来的视图**，不落表"
        kind: 
          "$ref": "#/definitions/ExceptionKind"
          description: "异常成因"
        stuckMinutes: 
          type: "number"
          description: "已经卡了多少分钟（从进入当前状态算起，mock 用 createdAt/paidAt 近似）"
        thresholdMinutes: 
          type: "number"
          description: "该状态允许卡多久（分钟），用于在界面上说明\"为什么它算异常\""
      required: 
        - "order"
        - "kind"
        - "stuckMinutes"
        - "thresholdMinutes"
      additionalProperties: false
    OrderIntervention: 
      type: "object"
      properties: 
        orderNo: 
          type: "string"
          description: "被干预的订单"
        from: 
          "$ref": "#/definitions/OrderStatus"
          description: "原状态"
        to: 
          "$ref": "#/definitions/OrderStatus"
          description: "改为的状态。**必须是 `ORDER_TRANSITIONS` 允许的迁移**"
        remark: 
          type: "string"
          description: "干预原因，必填 —— 改状态这件事必须说清楚为什么"
        operator: 
          type: "string"
          description: "操作人（STAFF 账号）"
        at: 
          type: "string"
          description: "操作时间"
      required: 
        - "orderNo"
        - "from"
        - "to"
        - "remark"
        - "operator"
        - "at"
      additionalProperties: false
      description: "人工干预的留痕。改状态这件事必须留下是谁、为什么。"
    PayChannel: 
      type: "string"
      enum: 
        - "WECHAT"
        - "ALIPAY"
        - "BALANCE"
      description: "支付渠道。一期只接微信支付，枚举先留出位置（改枚举比改结构便宜）。"
    ReconDiffType: 
      type: "string"
      enum: 
        - "CHANNEL_ONLY"
        - "PLATFORM_ONLY"
        - "AMOUNT_DIFF"
      description: "对账差异类型。\n\n⚠️ 这三类的**处置方式完全不同**，所以必须分开而不是笼统叫\"异常\"：\n- `CHANNEL_ONLY`：渠道有、平台无 —— 用户付了钱但订单没落库，要**补单或退款**\n- `PLATFORM_ONLY`：平台有、渠道无 —— 平台记了收款但渠道查无此笔，多半是误记，要**冲正**\n- `AMOUNT_DIFF`：两边都有但金额不符 —— 要人去查是折扣算错还是重复扣款"
    ReconStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "RESOLVED"
        - "IGNORED"
    ReconDiff: 
      type: "object"
      properties: 
        diffNo: 
          type: "string"
          description: "差异单号"
        billDate: 
          type: "string"
          description: "对账日期（渠道账单的账期），YYYY-MM-DD"
        channel: 
          "$ref": "#/definitions/PayChannel"
          description: "支付渠道"
        channelTxnNo: 
          type: 
            - "string"
            - "null"
          description: "渠道流水号；PLATFORM_ONLY 时为空（渠道根本没有这笔）"
        orderNo: 
          type: 
            - "string"
            - "null"
          description: "平台订单号；CHANNEL_ONLY 时为空（平台没落库）"
        type: 
          "$ref": "#/definitions/ReconDiffType"
          description: "差异类型。**三类的处置方式完全不同**，见上方注释"
        channelAmount: 
          type: "number"
          description: "渠道侧金额，最小货币单位（分）。PLATFORM_ONLY 为 0"
