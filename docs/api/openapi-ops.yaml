        usageType: 
          type: 
            - "string"
            - "null"
          description: "`SALE` 进 SKU 笛卡尔积 / `PROP` 只是描述"
        primary: 
          type: "boolean"
          description: "主维度：建品选完类目自动预填的就是它"
        required: 
          type: "boolean"
          description: "必填：不选它就建不了品"
        valueNos: 
          type: "array"
          items: 
            type: "string"
          description: "这一类目开放的取值；空 = 不裁剪"
        labels: 
          "$ref": "#/definitions/Record%3Cstring%2Cstring%3E"
          description: "valueNo → 类目内换名（500g 在蔬菜下叫「约1斤」）"
      required: 
        - "dimNo"
        - "primary"
        - "required"
        - "valueNos"
        - "labels"
      additionalProperties: false
      description: "类目绑定的整份替换体。顺序即排序，主维度只能有一个"
    "Record<string,string>": 
      type: "object"
      additionalProperties: 
        type: "string"
    CategoryArchiveImpact: 
