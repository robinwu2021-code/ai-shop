        - "invoiceNo"
        - "merchantNo"
        - "merchantName"
        - "period"
        - "amount"
        - "settledAmount"
        - "titleType"
        - "title"
        - "status"
        - "appliedAt"
      additionalProperties: false
    TaxRule: 
      type: "object"
      properties: 
        threshold: 
          type: "number"
          description: "起征点（分）：单期收入低于它不代扣"
        rate: 
          type: "number"
          description: "代扣税率（万分比）"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "threshold"
        - "rate"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "个税代扣规则（P-12.2.3）。\n\n只对**个人主体**商家生效：个体户与企业自行申报，平台不代扣。 起征点以下不扣 —— 不设起征点会给每一笔几块钱的提现都产生一条扣税记录。"
    Staff: 
      type: "object"
      properties: 
        staffNo: 
          type: "string"
          description: "员工单号"
        username: 
          type: "string"
          description: "登录名"
        name: 
          type: "string"
          description: "姓名"
        role: 
          "$ref": "#/definitions/Role"
          description: "角色。决定权限码集合，见 `RoleDef`"
