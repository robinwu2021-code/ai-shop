        - "pickupCount"
        - "createdAt"
      additionalProperties: false
    PickupPointType: 
      type: "string"
      enum: 
        - "STORE"
        - "NEIGHBOR"
        - "PLATFORM"
      description: "自提点类型。**与 shared 的 `PickupPointType` 同名同值** —— 此前这里叫 `PickupType`，是同一个概念的第二个名字。 一个领域概念只能有一个词（见 docs/requirements/项目词典.md）。"
    PickupFeeMode: 
      type: "string"
      enum: 
        - "NONE"
        - "PER_ITEM"
        - "RATE"
      description: "计费口径。**目前只有 PLATFORM 点有值** —— STORE 与 NEIGHBOR 恒为 NONE。\n\n⚠️ 这与需求矩阵里「常驻点收履约服务费」看起来矛盾，其实是同一件未决事情的两个阶段：\n**B9（履约服务费口径：按单/按件/保底）在待完成清单里明确标着「未定」**， 所以 STORE 的费率还没开启；PLATFORM 点是线下逐点协商的，先落了字段。 B9 定了之后，STORE 才会有 PER_ITEM 或 RATE。"
    PickupStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "SUSPENDED"
        - "MIGRATING"
      description: "MIGRATING = 迁移中（P-2.2.2）：不再接新单，存量单仍在本点核销完。"
    PickupDraft: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "归属社区。必须真的存在，否则这个点对谁都不可见而列表看着正常"
        name: 
          type: "string"
          description: "自提点名称"
        type: 
          "$ref": "#/definitions/PickupPointType"
          description: "三类的报酬与归属规则完全不同"
        ownerRef: 
          type: "string"
          description: "承接方。**多态**：STORE 传门店号、NEIGHBOR 传用户号、PLATFORM 传空。 传错会让「这个点属于谁」永久错位，而它决定核销权限与出货门店。"
        address: 
          type: "string"
          description: "自提点地址"
        openHours: 
          type: "string"
          description: "可取货时段"
        arrivalDesc: 
          type: "string"
          description: "到货说明（运营排车依据）"
        serviceFeeRate: 
          type: "number"
          description: "履约服务费费率，万分比。**NEIGHBOR 必须为 0**"
        serviceFeePerItemMinor: 
          type: "number"
          description: "按件履约服务费（分）。**NEIGHBOR 必须为 0**"
      required: 
        - "communityNo"
        - "name"
        - "type"
        - "address"
      additionalProperties: false
      description: "新建自提点的入参。三类的必填项完全不同 —— 见各字段说明"
    PickupPoint: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        pickupNo: 
          type: "string"
          description: "自提点单号"
        name: 
          type: "string"
          description: "自提点名称"
        type: 
          "$ref": "#/definitions/PickupPointType"
          description: "自提点类型（ADR-005）。三类的报酬、脱敏、作用域规则完全不同。\n\n⚠️ 这里此前只有 STORE|NEIGHBOR 两类，而后端还有 **PLATFORM**（平台提供、 线下协商费率）—— 少一类的后果是平台点在列表里渲染成 undefined 或被当成常驻点， 而它的费率规则与常驻点完全不同。"
        feeMode: 
          "$ref": "#/definitions/PickupFeeMode"
          description: "计费口径。目前只有 PLATFORM 有值，见 `PickupFeeMode` 的说明"
        status: 
          "$ref": "#/definitions/PickupStatus"
          description: "自提点状态。`MIGRATING` = 不再接新单，存量单仍在本点核销完"
        communityNo: 
          type: "string"
          description: "归属社区"
        communityName: 
          type: "string"
          description: "社区名快照"
        storeNo: 
          type: "string"
          description: "承接**门店**；NEIGHBOR 点为空（承接方是 C 端用户，不是商家）。\n\n此前叫 `merchantNo` 且装的是主体号。自提点归属改到门店之后（后端 V16）， 名字与内容就对不上了 —— 一并改名，而不是让下一个人以为它还是主体号。"
        merchantName: 
          type: "string"
          description: "承接商家名快照；NEIGHBOR 点为空。名字仍挂在主体上，不是门店名"
        address: 
          type: "string"
          description: "自提点地址。NEIGHBOR 点**成团前只到楼栋**，付款后才给完整门牌"
        openHours: 
          type: "string"
          description: "营业/可取货时段，形如 \"09:00-21:00\""
        arriveTime: 
          type: "string"
          description: "到货时间（运营排车依据）"
        serviceFeeRate: 
          type: "number"
          description: "履约服务费费率，万分比（P-2.2.4）。**NEIGHBOR 恒为 0**（库上有 CHECK 约束兜底）。\n\n目前有值的只有 PLATFORM 点（线下逐点协商）；STORE 要等 B9 定口径。 存费率不存金额：口径（按单/按件/保底）未定，等定了只改结算不改主数据。"
        serviceFeePerItemMinor: 
          type: "number"
          description: "按件履约服务费（分）。与 serviceFeeRate 二选一，由 feeMode 决定用哪个"
        acceptCount30d: 
          type: "number"
          description: "近 30 天承接次数（P-2.2.5 职业化风控依据）"
        createdAt: 
          type: "string"
          description: "建档时间"
      required: 
        - "pickupNo"
        - "name"
        - "type"
        - "feeMode"
        - "status"
        - "communityNo"
        - "communityName"
        - "address"
        - "openHours"
        - "arriveTime"
        - "serviceFeeRate"
        - "serviceFeePerItemMinor"
        - "acceptCount30d"
        - "createdAt"
      additionalProperties: false
