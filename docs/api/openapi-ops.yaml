          type: "string"
          description: "结算单号"
        merchantNo: 
          type: "string"
          description: "结算对象商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        period: 
          type: "string"
          description: "结算周期，如 2026-08-上"
        orderCount: 
          type: "number"
          description: "本期结算的子订单笔数"
        grossAmount: 
          type: "number"
          description: "应结总额（分）= 子订单实付合计"
        platformFee: 
          type: "number"
          description: "平台佣金（分）。按「分账内扣」实现（12.1.6 口径待定）"
        serviceFee: 
          type: "number"
          description: "自提点履约服务费（分，R15）"
        netAmount: 
          type: "number"
          description: "实付商家（分）"
        status: 
          "$ref": "#/definitions/SettleStatus"
          description: "结算状态。允许的流转见 `SETTLE_TRANSITIONS`"
        retryCount: 
          type: "number"
          description: "分账指令重试次数（上限见 lib/constants.ts）"
        failReason: 
          type: "string"
          description: "失败原因。`status=FAILED` 时有值，人工介入据此判断"
        frozenAt: 
          type: "string"
          description: "冻结开始时间：超过 freezeDays 未成功就解冻回平台"
        createdAt: 
          type: "string"
          description: "结算单生成时间"
      required: 
        - "settleNo"
        - "merchantNo"
        - "merchantName"
        - "period"
        - "orderCount"
        - "grossAmount"
        - "platformFee"
        - "serviceFee"
        - "netAmount"
        - "status"
        - "retryCount"
        - "frozenAt"
        - "createdAt"
      additionalProperties: false
      description: "结算单：一个商家一个周期一张。 ⚠️ **对账恒等式**：gross = platformFee + serviceFee + net。 这三个数分别来自三处（费率表、自提点配置、余数），不校验就会出现\"分完了还差几分钱\"。"
    SplitRecord: 
      type: "object"
      properties: 
        splitNo: 
          type: "string"
          description: "分账明细单号"
        settleNo: 
          type: "string"
          description: "所属结算单"
        orderNo: 
          type: "string"
          description: "对应的子订单。**一条明细 = 一个子订单**"
        merchantName: 
          type: "string"
          description: "商家名快照"
        trafficSource: 
          "$ref": "#/definitions/TrafficSource"
          description: "该订单的流量来源，决定适用哪一档费率（R16）"
        grossAmount: 
          type: "number"
          description: "该订单实付金额（分）"
        feeRate: 
          type: "number"
          description: "本条实际适用的平台佣金费率（万分比），来自费率表"
        platformFee: 
          type: "number"
          description: "本条的平台佣金（分）"
        pickupNo: 
          type: "string"
          description: "履约自提点。非自提单为空"
        serviceFee: 
          type: "number"
          description: "自提点履约服务费（分）；非自提单为 0"
        netAmount: 
          type: "number"
          description: "实付商家（分）。**恒等式**：grossAmount = platformFee + serviceFee + netAmount"
      required: 
        - "splitNo"
        - "settleNo"
        - "orderNo"
        - "merchantName"
        - "trafficSource"
        - "grossAmount"
        - "feeRate"
        - "platformFee"
        - "serviceFee"
        - "netAmount"
      additionalProperties: false
      description: "分账明细：一条 = 一个子订单。费率按 trafficSource 分档（R16）。"
    FeeRule: 
      type: "object"
      properties: 
        byTrafficSource: 
          "$ref": "#/definitions/Record%3CTrafficSource%2Cnumber%3E"
          description: "按流量来源分档的平台佣金费率（R16）。 ⚠️ `MERCHANT_OWNED`（商家自带客流）**建议 0** —— 商家自己把客人带来的单还抽佣， 商家就会把客人带去别处成交（ADR-004 的增长模型立不住）。口径未定，故可配。"
        pickupServiceFeeRate: 
          type: "number"
          description: "自提点履约服务费默认费率（R15）；自提点自己配了就用它自己的"
        freezeDays: 
          type: "number"
          description: "超时兜底天数（12.1.4）：冻结超过它仍未分账成功，解冻回平台"
        updatedAt: 
          type: "string"
          description: "最后修改时间。**改费率不影响已生成的结算单**"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "byTrafficSource"
        - "pickupServiceFeeRate"
        - "freezeDays"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "费率配置（P-12.1.7 / 12.1.8 / 12.1.4）。全部万分比。"
    "Record<TrafficSource,number>": 
      type: "object"
      properties: 
        MERCHANT_OWNED: 
          type: "number"
        PLATFORM: 
          type: "number"
        INVITE: 
          type: "number"
        CHANNEL: 
          type: "number"
      required: 
        - "MERCHANT_OWNED"
        - "PLATFORM"
        - "INVITE"
        - "CHANNEL"
      additionalProperties: false
    WithdrawStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "APPROVED"
        - "REJECTED"
        - "PAID"
        - "FAILED"
      description: "提现状态。\n\n⚠️ `APPROVED → PAID` **不由运营点** —— 打款结果来自渠道回执。 让人手动置为\"已打款\"，就等于允许在钱没到账时把单子做平。"
    Withdrawal: 
      type: "object"
      properties: 
        withdrawNo: 
          type: "string"
          description: "提现单号"
        merchantNo: 
          type: "string"
          description: "申请商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        amount: 
          type: "number"
          description: "申请金额（分）"
        availableBalance: 
          type: "number"
          description: "申请时的可提余额（分）。快照，不是实时值 —— 审批看的是申请那一刻的口径"
        bankAccountMasked: 
          type: "string"
          description: "收款账户，展示一律脱敏"
        status: 
          "$ref": "#/definitions/WithdrawStatus"
          description: "提现状态。**`APPROVED → PAID` 由渠道回执驱动，运营点不了**"
        appliedAt: 
          type: "string"
          description: "申请时间"
        decidedAt: 
          type: 
            - "string"
            - "null"
          description: "审批时间。未审为 null"
        decidedBy: 
          type: 
            - "string"
            - "null"
          description: "审批人（STAFF 账号）。未审为 null"
        remark: 
          type: 
            - "string"
            - "null"
          description: "驳回原因 / 大额复核说明。原样回商家 B 端"
      required: 
        - "withdrawNo"
        - "merchantNo"
        - "merchantName"
        - "amount"
        - "availableBalance"
        - "bankAccountMasked"
        - "status"
        - "appliedAt"
      additionalProperties: false
    InvoiceTitleType: 
      type: "string"
      enum: 
        - "COMPANY"
        - "PERSONAL"
      description: "抬头类型。企业抬头必须有税号，个人抬头没有 —— 这是两条不同的校验路径。"
    InvoiceStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "ISSUED"
        - "REJECTED"
    InvoiceRequest: 
      type: "object"
      properties: 
        invoiceNo: 
          type: "string"
