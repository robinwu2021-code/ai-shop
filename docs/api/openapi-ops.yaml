          type: "string"
          description: "发票代码，票面左上那一串"
        invoiceNumber: 
          type: "string"
          description: "发票号码，票面右上那一串。**与 invoiceNo 不是一回事**"
        invoiceType: 
          type: "string"
          description: "票种：专票 / 普票 / 电子票"
        titleName: 
