        - "unpaidMinutes"
        - "remindBeforeMinutes"
        - "autoRefundOnLateCallback"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "关单策略（P-4.2.3）。\n\n⚠️ 这份配置与掉单**直接因果**：关单时限设得越短，\"用户正在付款、订单已被关掉\" 的窗口就越大，而那正是 CHANNEL_ONLY 差异的主要来源。所以两者放同一页。"
