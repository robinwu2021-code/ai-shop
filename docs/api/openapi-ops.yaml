          description: "专题号"
        title: 
          type: "string"
          description: "标题"
        subtitle: 
          type: "string"
          description: "一句话说明，如「7 点前送到」。空 = 不展示副标题"
        cover: 
          type: "string"
          description: "封面图"
        sort: 
          type: "number"
          description: "首页排序，小的在前"
        startAt: 
