openapi: "3.1.0"
info: 
  title: "ai-shop 平台运营端（ops-web）"
  version: "0.1.0"
  description: "由 ops-web 的契约自动生成，请勿手改（cd ops-web && npm run gen:api）。\n\n口径：响应包 {code,msg,data}，分页 {records,total,page,size}，camelCase，\n业务单号 xxxNo，时间 xxxAt，枚举大写下划线，金额为最小货币单位整数。\n禁止 delete*，软删除用 archive*/unarchive*。\n\n鉴权：STAFF 池 Bearer + RBAC + 数据域（矩阵 §2.3）。\n越权拦截以后端为准 —— 前端只做展示裁剪。"
servers: 
  - url: "http://localhost:8080"
    description: "本地后端"
components: 
  securitySchemes: 
    bearerAuth: 
      type: "http"
      scheme: "bearer"
      description: "STAFF 池 Bearer，含角色与数据域声明"
  schemas: 
    Archivable: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
      additionalProperties: false
      description: "可归档主数据的公共字段（G1 软删除）。"
    DataScope: 
      type: "object"
      properties: 
        tenantNo: 
          type: "string"
          description: "租户，MVP 恒为 MAIN（预留多租户，见矩阵 P-17.1.6）"
        merchantNo: 
          type: "string"
          description: "限定到某商家（商家运营 BD 角色）"
        communityNo: 
          type: "string"
          description: "限定到某社区（社区运营角色）"
        pickupNo: 
          type: "string"
          description: "限定到某自提点"
      required: 
        - "tenantNo"
      additionalProperties: false
      description: "平台端数据域：所有列表查询由后端按此裁剪，前端只做展示。"
    MerchantTier: 
      type: "string"
      enum: 
        - "SMALL"
        - "MEDIUM"
        - "LARGE"
      description: "商家**分层**（规模）。对应 `mch_entity.tier`，与 shared 的 `MerchantTier` 同名同值。\n\n⚠️ 这里此前是 `PERSONAL | INDIVIDUAL | COMPANY` —— 那是**主体类型**的旧取值 （权威码见 shared 的 `MerchantSubject`：NATURAL_PERSON / INDIVIDUAL / ENTERPRISE）。 名字对得上后端字段，取值却来自另一个概念，于是这一列**永远显示不出东西**： 后端下发的 tier 要么是 null（一期没启用分层），要么是 SMALL， 而 SMALL 不在这个联合类型里，i18n 也查不到词条。\n\n<p>如果运营界面真正想看的是**主体类型**（小微/个体户/企业），那要后端在 ops 商家 VO 里补一个字段 —— `mch_entity` 上没有 subject 列， 它在申请单与进件表上。这是另一件事，不能靠改端上的类型变出来。"
    MerchantStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "SUSPENDED"
        - "FROZEN"
      description: "商家的**经营状态**。取值与后端 `mch_entity.status` 一致。\n\n⚠️ 它**不是入驻审核状态** —— 审核状态在申请单上（ {@link  ApplyStatus } ， PENDING/REVIEWING/APPROVED/REJECTED），后端刻意分成两张表： `mch_entity_apply` 记「这次申请审到哪了」，`mch_entity` 记「这家店现在能不能做生意」。\n\n这里曾经把两者揉成一个字段（DRAFT/SUBMITTED/REVIEWING/APPROVED/REJECTED/SUSPENDED）， 于是一家已经在正常经营、又提交了第二张执照的商家，status 该填什么无解 —— 而这正是「一人多主体」的常见情形。"
    AuthCodeSetResult: 
      type: "object"
      properties: 
        codes: 
          type: "array"
          items: 
            type: "string"
          description: "改完之后持有的码（全量）"
        revoked: 
          type: "array"
          items: 
            type: "string"
          description: "这次撤掉的码。空数组 = 只加不减"
        affected: 
          type: "number"
          description: "因撤码而下次上架会被拒的在架商品数"
      required: 
        - "codes"
        - "revoked"
        - "affected"
      additionalProperties: false
      description: "改授权码的结果。\n\n<p>`affected` 是**代价**，不是统计：撤掉一个码，那些在架商品下次上架就会被拒。 运营按下确认之前看不见它的话，一次「顺手收紧」会在几天后变成商家的 「我的货怎么上不去了」，而两件事没人会联系起来。"
    Merchant: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        merchantNo: 
          type: "string"
          description: "商家单号"
        name: 
          type: "string"
          description: "店铺名"
        tier: 
          "$ref": "#/definitions/MerchantTier"
          description: "商家分层，为引入大商家预留"
        status: 
          "$ref": "#/definitions/MerchantStatus"
          description: "**经营状态**（不是审核状态 —— 审核在申请单上）。合法迁移见 `MERCHANT_TRANSITIONS`"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "服务的社区。**是列表不是单个** —— 一家店可以服务多个社区 （后端 `mch_entity_community`，服务范围三档见 ADR-009）。 此前这里是单个 `communityNo`，多社区商家只会显示其中一个。"
        contactName: 
          type: "string"
          description: "联系人姓名"
        contactPhone: 
          type: "string"
          description: "展示一律脱敏（中间四位掩码），完整号码不下发前端"
        categoryCodes: 
          type: "array"
          items: 
            type: "string"
          description: "经营类目编码，审核通过后即类目授权范围（P-11.1.3）"
        verified: 
          type: "boolean"
          description: "认证标（P-11.1.2）"
        qualifications: 
          type: "array"
          items: 
            type: "string"
          description: "已登记的结构化资质名。授权需要资质的类目码时要对照它。\n\n**必须是可选的。** 后端 `MerchantProfileVO` 曾经完全没有这个字段， 而这里声明成必填 `string[]` —— 类型检查过得去，真接口下 `m.qualifications.length` 直接抛 TypeError。只有 mock 有这个字段，所以一直没暴露。 「契约有、后端不发」是字段问题，不是类型问题：**别把 `?` 去掉**。"
        breachCount: 
          type: "number"
          description: "信用档案：毁约次数（P-11.1.5 / ADR-003）"
        settleAccountReady: 
          type: "boolean"
          description: "分账接收方报备状态（P-12.1.1，ADR-002）"
        createdAt: 
          type: "string"
          description: "入驻申请提交时间"
        auditRemark: 
          type: "string"
          description: "最近一次审核意见（驳回原因/补交项）"
        asPickupPoint: 
          type: "boolean"
          description: "申请人是否愿意承接自提点（ADR-005）。\n\n**只是意愿，通过审核不会自动建点** —— 自提点的服务费口径是逐点线下谈的， 没有一个默认值能覆盖。放在审核页上是为了让运营**看见有人在等**： 不显示的话，申请人勾了这一项、通过后什么也没发生，而中间没有任何一处会报错。"
        legalForm: 
          anyOf: 
            - "$ref": "#/definitions/LegalForm"
            - type: "null"
          description: "主体档位。**准入档位完全由它决定** —— 保证金、限额、禁售品类都按它取策略。\n\n此前档案里没有它：运营看得到「这家被限额 500」，看不到「因为它是无照自然人」， 于是只会来问为什么。"
        fundsMode: 
          "$ref": "#/definitions/FundsMode"
          description: "资金路径（轴②）：钱先进谁的账户。\n\n**与经营模式（`StoreMode.businessMode`，轴③）是两件事** —— 这个说钱先进谁的账户，那个说谁是销售主体。两者正交： 「直连 + 自营」（钱进商家户却说平台是卖方）是非法组合，要拦。\n\n而「要不要给积分补差」判的是**这一列** —— 钱在商家账户才需要补进去。"
        agriProducer: 
          type: "boolean"
          description: "农业生产者。**无照主体走归集的唯一例外** —— 平台可自开农产品收购发票，成本有合法凭证。"
      required: 
        - "merchantNo"
        - "name"
        - "tier"
        - "status"
        - "communityNos"
        - "contactName"
        - "contactPhone"
        - "categoryCodes"
        - "verified"
        - "breachCount"
        - "settleAccountReady"
        - "createdAt"
      additionalProperties: false
    LegalForm: 
      type: "string"
      enum: 
        - "NATURAL_PERSON"
        - "INDIVIDUAL"
        - "ENTERPRISE"
      description: "主体档位 —— 与后端 `mch_entity.legal_form` 同一套取值。\n\n**三档锁定，不再增删**：S1/S2/S3 是对这三个值的读法，不是新枚举。\n\nV87 起 `MICRO` 改名 `NATURAL_PERSON` —— 那是通道发明的收款档位，不是法律形态， 且与法规「小微企业（有照）」重名含义相反。通道档留在 `mch_payment_merchant` 上。"
    FundsMode: 
      type: "string"
      enum: 
        - "AGGREGATED"
        - "DIRECT"
      description: "资金路径。**能走哪条由商户类型决定，不是平台自选**（ADR-017 §3.2）： 自然人开不出票 → 平台按全额确认收入而成本不可税前扣除 → 禁归集； 自产农产品例外。"
    QualificationType: 
      type: "string"
      enum: 
        - "BUSINESS_LICENSE"
        - "FOOD_PERMIT"
        - "FOOD_WORKSHOP"
        - "OTHER"
      description: "资质证件类型。与后端 MchQualification 的四个常量逐字一致"
    QualificationItem: 
      type: "object"
      properties: 
        type: 
          "$ref": "#/definitions/QualificationType"
          description: "资质类型，如营业执照 / 食品经营许可证"
        code: 
          type: "string"
          description: "证照编号，与证面一致"
        imageUrl: 
          type: "string"
          description: "图片地址"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "到期时刻"
        issuer: 
          type: "string"
          description: "发证机关"
      required: 
        - "type"
        - "code"
        - "imageUrl"
        - "expireAt"
      additionalProperties: false
      description: "申请单上提交的一条结构化资质。`expireAt` 为 null = 长期有效"
    Qualification: 
      type: "object"
      properties: 
        qualNo: 
          type: "string"
          description: "资质记录号"
        entityNo: 
          type: "string"
          description: "所属商家"
        qualType: 
          type: "string"
          description: "证件类型"
        qualName: 
          type: "string"
          description: "证件名。**要与 sys_auth_code.required_qualification 同一套字面量** —— 类目授权按名字比对"
        qualNumber: 
          type: "string"
          description: "证件编号，证上印的那一串"
        imageUrl: 
          type: "string"
          description: "图片地址"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "null = 长期有效。与「已过期」是两回事，扫描任务不碰它"
        status: 
          type: "string"
          description: "VALID / EXPIRED / REVOKED"
      required: 
        - "qualNo"
        - "entityNo"
        - "qualType"
        - "qualName"
        - "status"
      additionalProperties: false
      description: "主体档案上**已登记**的一条资质（mch_qualification）。上架闸门读的就是它"
    AuthCode: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "授权码，如 `FRESH_VEG`。**按码授权而不是按类目节点** —— 类目树会重构，能不能卖菜不会"
        name: 
          type: "string"
          description: "授权码展示名"
        requiredQualification: 
          type: "string"
          description: "需要的资质名。为空表示无门槛类目"
        qualType: 
          type: 
            - "string"
            - "null"
          description: "这个门槛要哪一类证（`BUSINESS_LICENSE` / `FOOD_PERMIT` / …），与 `Qualification.qualType` 同值域；空 = 无需证件。\n\n**有了它，「这家店传了什么证」与「该授哪些码」才对得上** —— 在它之前 只能靠人对着两张表比对文案，而没人比过：线上一条资质、一条授权都没有。"
      required: 
        - "code"
        - "name"
      additionalProperties: false
      description: "类目授权码。\n\n它与类目树是**多对一**：`CAT111 叶菜`、`CAT112 根茎菜` 都要 `FRESH_VEG`。 按码授权而不是按类目节点授权，是因为类目树会重构，而\"能不能卖菜\"这件事不会。"
    ViolationType: 
      type: "string"
      enum: 
        - "FAKE_GOODS"
        - "BREACH"
        - "PRICE_FRAUD"
        - "SERVICE"
      description: "违规类型。分开是因为**处置尺度不同**，笼统记成\"违规\"之后没法按类型统计。"
    ViolationAction: 
      type: "string"
      enum: 
        - "WARN"
        - "LIMIT"
        - "SUSPEND"
        - "STORE_OFFLINE"
      description: "处置动作。**两个动作有真副作用**，不是记一笔就完： `SUSPEND` 把整个商家推到 SUSPENDED，`STORE_OFFLINE` 把**指定的那一家门店** 压到 SUSPENDED 并撤下它的货架行。\n\n门店级独立成一个 action 而不是「SUSPEND + 可选 storeNo」：后者的语义 由一个可空字段决定，读处置记录的人分不出「封了整个商家」和「只压了一家店」。"
    Violation: 
      type: "object"
      properties: 
        violationNo: 
          type: "string"
          description: "违规记录单号"
        merchantNo: 
          type: "string"
          description: "涉事商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        type: 
          "$ref": "#/definitions/ViolationType"
          description: "违规类型。**只有 `BREACH` 计入 breachCount**"
        action: 
          "$ref": "#/definitions/ViolationAction"
          description: "处置动作。`SUSPEND` 会真的把商家状态推到 SUSPENDED"
        storeNo: 
          type: 
            - "string"
            - "null"
          description: "门店级处置的对象门店。**`STORE_OFFLINE` 必有、其余动作必空** —— 主体级处置带上门店号会让人以为只压了那一家。"
        detail: 
          type: "string"
          description: "事实描述与证据出处。必填 —— 没有事实的处置在申诉时站不住"
        operator: 
          type: "string"
          description: "处置人（STAFF 账号）"
        at: 
          type: "string"
          description: "处置时间"
      required: 
        - "violationNo"
        - "merchantNo"
        - "merchantName"
        - "type"
        - "action"
        - "detail"
        - "operator"
        - "at"
      additionalProperties: false
    ApplyStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "REVIEWING"
        - "APPROVED"
        - "REJECTED"
      description: "入驻申请状态。\n\n**它不是商家的状态** —— 申请与主体是两个东西：通过之前商家<b>还不存在</b>。 曾经把审核建模成「商家的一个状态」，于是驳回的申请会在商家表里留下一行 从没开过张的「僵尸商家」，出现在每一处按主体聚合的地方（结算、积分、报表）。"
    MerchantApply: 
      type: "object"
      properties: 
        applyNo: 
          type: "string"
          description: "申请单号。审核动作都打在它上面，不是商家号"
        merchantNo: 
          type: "string"
          description: "通过后生成的主体号。**未通过时为空** —— 商家在通过之前根本不存在"
        name: 
          type: "string"
          description: "拟用店铺名。**存快照** —— 后来改名不该让历史申请跟着变"
        subject: 
          type: "string"
          description: "法律形态 NATURAL_PERSON / INDIVIDUAL / ENTERPRISE"
        contactName: 
          type: "string"
          description: "联系人姓名。审核要打电话找人"
        contactPhone: 
          type: "string"
          description: "联系手机号（申请人自己填的，不一定是登录号）。**通过后它就是商家账号的登录号**"
        category: 
          type: "string"
          description: "主营类目。**商家自己的说法**（「食品」），不是权威码"
        categoryCodes: 
          type: "array"
          items: 
            type: "string"
          description: "审核通过时授予的经营类目码 —— **平台的裁定**，与 `category` 并存。\n\n<p>两者分开是为了留痕：追溯时要的恰恰是这两者的差 （「他说卖食品，我们批的是预包装食品」）。"
        desc: 
          type: "string"
          description: "店铺简介。通过后会写进主体档案，C 端门店页读的就是它"
        industry: 
          type: "string"
          description: "行业。**决定这家店能不能以小微进件** —— 审核页要看得到它， 否则运营批了一个行业不允许小微的小微商家，通道那边才会拒。"
        serviceScope: 
          type: "string"
          description: "期望服务范围。**商家可以留空，但通过时必须确定** —— 空的后果是商家上着架却对谁都不可见，且没有任何报错。"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "覆盖的小区。scope=COMMUNITY 时**空 = 通过之后对谁都不可见**"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "已传的资质图。个体户/企业必传，自然人免 —— 缺它正是驳回的主因"
        qualificationItems: 
          type: "array"
          items: 
            "$ref": "#/definitions/QualificationItem"
          description: "结构化资质（V79）。**审核台看的是这一份** —— 上面的 licenses 只有图片 URL，审核员看不出「这是执照还是食品证」「什么时候过期」。 而通过之后转存进 mch_qualification 的正是它。"
        asPickupPoint: 
          type: "boolean"
          description: "是否愿意承接自提点（ADR-005）。**只是意愿，不代表点已建立**"
        status: 
          "$ref": "#/definitions/ApplyStatus"
          description: "审核状态"
        rejectReason: 
          type: "string"
          description: "驳回原因。**驳回必写** —— 不写对方只能猜着改"
        createdAt: 
          type: "number"
          description: "提交时间"
        auditedAt: 
          type: "number"
          description: "审核完成时间。待审期间为空"
      required: 
        - "applyNo"
        - "name"
        - "subject"
        - "contactName"
        - "contactPhone"
        - "category"
        - "desc"
        - "asPickupPoint"
        - "status"
        - "createdAt"
      additionalProperties: false
      description: "入驻申请单（后端 `mch_entity_apply`）。"
    StoreFulfillmentRow: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号"
        storeName: 
          type: 
            - "string"
            - "null"
          description: "门店名"
        storeStatus: 
          type: "string"
          description: "门店状态"
        channels: 
          type: "array"
          items: 
            type: "object"
            properties: 
              channel: 
                type: "string"
              enabled: 
                type: "boolean"
              denied: 
                type: "boolean"
                description: "准入矩阵不允许（按主体类型）"
              templateNo: 
                type: 
                  - "string"
                  - "null"
                description: "仅 EXPRESS：运费模板号"
              locked: 
                type: "boolean"
                description: "运营锁路（P2）：买家侧不可选、商家侧置灰。解锁只能运营"
              scopeMode: 
                type: "string"
                description: "ALL / SUBSET（P2 范围子集）"
              areaNos: 
                type: "array"
                items: 
                  type: "string"
            required: 
              - "channel"
              - "enabled"
              - "denied"
            additionalProperties: false
          description: "这家店开了哪几条履约渠道"
      required: 
        - "storeNo"
        - "storeName"
        - "storeStatus"
        - "channels"
      additionalProperties: false
      description: "门店送货方式（方案 v4，P0 只读）：每店四路开关的快照。 channel 值域 = STORE_PICKUP / NEIGHBOR_PICKUP / MERCHANT_DELIVERY / EXPRESS。"
    StoreMode: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号"
        storeName: 
          type: "string"
          description: "门店名，展示用"
        merchantNo: 
          type: "string"
          description: "所属商家主体"
        businessMode: 
          anyOf: 
            - "$ref": "#/definitions/BusinessMode"
            - type: "null"
          description: "自营 / 第三方；空 = 尚未设置"
        payMerchantNo: 
          type: 
            - "string"
            - "null"
          description: "该店实际可用的收款号（本店专属号优先，回落到主体默认号）。**空 = 不能切第三方**"
      required: 
        - "storeNo"
        - "storeName"
        - "merchantNo"
        - "businessMode"
        - "payMerchantNo"
      additionalProperties: false
    BusinessMode: 
      type: "string"
      enum: 
        - "SELF_OPERATED"
        - "THIRD_PARTY"
      description: "经营模式。与  {@link  FeeRuleVersion }  一起构成费率的第一个维度。\n\n自营：平台是销售主体，这个费率是**进销差价（毛利）**。 第三方：平台是撮合方，这个费率是**服务收入（佣金）**。 算法一样，记账口径不同 —— 口径由结算单上的 `businessMode` 快照决定。"
    ModeRisk: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家主体号"
        merchantName: 
          type: "string"
          description: "商家名"
        legalForm: 
          type: "string"
          description: "主体档位（免执照的那一档）"
        storeNo: 
          type: "string"
          description: "门店号"
        storeName: 
          type: "string"
          description: "门店名"
        businessMode: 
          type: "string"
          description: "销售主体是谁：自营 / 第三方"
        settledBills: 
          type: "number"
          description: "已产生的自营结算单数。**0 表示「查过了，没有」** —— 与「还没查」在界面上要分开"
        settledMinor: 
          type: "number"
          description: "累计商家实得（分）。**这就是不可税前扣除的成本规模**"
      required: 
        - "merchantNo"
        - "merchantName"
        - "legalForm"
        - "storeNo"
        - "storeName"
        - "businessMode"
        - "settledBills"
        - "settledMinor"
      additionalProperties: false
      description: "无营业执照的主体 × 自营门店 —— **税务敞口清单**。\n\n自营下平台是销售主体，列支成本要进项发票，而无照主体开不出票 —— 这笔支出**不得在企业所得税前扣除**，不是「多交一点税」， 是账面上凭空多出等额利润。\n\n而这个组合**是默认会发生的**：`mch_store.business_mode` 默认就是自营， 且后端没有任何一处校验「无照不得自营」。所以这份清单不是异常报表， 是**现状盘点**。"
    AdmissionPolicy: 
      type: "object"
      properties: 
        legalForm: 
          "$ref": "#/definitions/LegalForm"
          description: "主体档位，三档锁定"
        requiredDepositMinor: 
          type: "number"
          description: "应缴保证金（分）；0 = 免缴"
        singleOrderLimitMinor: 
          type: "number"
          description: "单笔限额（分）；0 = 不限"
        dailyAmountLimitMinor: 
          type: "number"
          description: "日累计限额（分）；0 = 不限"
        banQualifiedCategory: 
          type: "number"
          description: "1 = 禁止经营任何「需资质」品类"
        bannedCategoryCodes: 
          type: 
            - "string"
            - "null"
          description: "额外禁售类目编码，JSON 数组字符串；空 = 无额外禁售"
        enabled: 
          type: "number"
          description: "1 = 该档位的限制生效；0 = 该档位不做任何限制"
        remark: 
          type: 
            - "string"
            - "null"
          description: "为什么这么定 —— 回查时这句话比数字更有用"
      required: 
        - "legalForm"
        - "requiredDepositMinor"
        - "singleOrderLimitMinor"
        - "dailyAmountLimitMinor"
        - "banQualifiedCategory"
        - "enabled"
      additionalProperties: false
    MerchantDeposit: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家主体"
        paidMinor: 
          type: "number"
          description: "实缴（分）"
        frozenMinor: 
          type: "number"
          description: "理赔冻结中（分）"
        availableMinor: 
          type: "number"
          description: "可用（分）= 实缴 − 冻结。**判够不够用它，不用实缴**"
        requiredMinor: 
          type: "number"
          description: "本档位应缴（分）；0 = 免缴"
        sufficient: 
          type: "boolean"
          description: "可用是否已达应缴。不足则该商家不能上架"
        singleOrderLimitMinor: 
          type: "number"
          description: "单笔限额（分）；0 = 不限"
        dailyAmountLimitMinor: 
          type: "number"
          description: "日累计限额（分）；0 = 不限"
      required: 
        - "merchantNo"
        - "paidMinor"
        - "frozenMinor"
        - "availableMinor"
        - "requiredMinor"
        - "sufficient"
        - "singleOrderLimitMinor"
        - "dailyAmountLimitMinor"
      additionalProperties: false
      description: "商家保证金账户。**可用余额 = 实缴 − 冻结**，判「够不够」用可用而非实缴。"
    PayQuota: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "空串 = 主体级默认收款号"
        payChannel: 
          type: 
            - "string"
            - "null"
          description: "WECHAT / ALIPAY"
        applyStatus: 
          type: 
            - "string"
            - "null"
          description: "进件状态；未 ACTIVE 时额度设了也不生效"
        limitMinor: 
          type: "number"
          description: "上限（分）；**0 = 未设置，不拦**，不是「额度为零」"
        usedMinor: 
          type: "number"
          description: "已用（分）。支付累加出来的事实，运营改不了"
      required: 
        - "storeNo"
        - "limitMinor"
        - "usedMinor"
      additionalProperties: false
      description: "一个收款号的额度。主体级一条 + 每个已进件门店一条。\n\n<p>**空列表 ≠ 额度为零**：空表示这家还没进过件，界面上必须画成两样东西 —— 读成「额度为零」的运营会去调大额度，而实际该做的是先走进件。"
    DepositTxnType: 
      type: "string"
      enum: 
        - "PAY"
        - "REFUND"
        - "FREEZE"
        - "UNFREEZE"
        - "DEDUCT"
    DepositTxn: 
      type: "object"
      properties: 
        txnNo: 
          type: "string"
          description: "流水号"
        txnType: 
          "$ref": "#/definitions/DepositTxnType"
          description: "变动类型"
        amountMinor: 
          type: "number"
          description: "有符号：扣划为负"
        balanceAfterMinor: 
          type: "number"
          description: "变动后实缴余额（分），对账用"
        reason: 
          type: 
            - "string"
            - "null"
          description: "变动原因"
        operator: 
          type: 
            - "string"
            - "null"
          description: "操作人"
        createdAt: 
          type: 
            - "string"
            - "null"
          description: "发生时间"
      required: 
        - "txnNo"
        - "txnType"
        - "amountMinor"
        - "balanceAfterMinor"
      additionalProperties: false
      description: "保证金流水。**只有余额字段的账户是不可审计的** —— 说不清这笔钱什么时候少的、谁扣的。"
    MerchantStaffRow: 
      type: "object"
      properties: 
        mchAccountNo: 
          type: "string"
          description: "商家账号号"
        displayName: 
          type: 
            - "string"
            - "null"
          description: "姓名（老板自己写的）。认人靠它；可能为空"
        loginPhone: 
          type: "string"
          description: "登录手机号。**它就是这个员工的登录用户名**（手机号 + 验证码，没有密码）"
        isOwner: 
          type: "boolean"
          description: "老板。**不受门店授权限制**，所以 roles 为空不代表他没权限"
        status: 
          type: "string"
          description: "ACTIVE / DISABLED"
        roles: 
          type: "array"
          items: 
            type: "object"
            properties: 
              storeNo: 
                type: "string"
              storeName: 
                type: "string"
              role: 
                type: "string"
            required: 
              - "storeNo"
              - "storeName"
              - "role"
            additionalProperties: false
          description: "他在各门店的角色。一人一店可多角色，权限取并集"
      required: 
        - "mchAccountNo"
        - "loginPhone"
        - "isOwner"
        - "status"
        - "roles"
      additionalProperties: false
      description: "商家的一个员工，以及他在各门店的角色（**运营端只读**）。\n\n为什么运营要看得到：客服接到「我们店的配送员看不到订单」时， 在此之前只能让老板自己截图 —— 而问题往往正是「他以为授了、其实没授」， 截图里看不出这一点。\n\n平台**不能改**这些授权：谁能进这家店是商家的雇佣关系。"
    PlanStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "GRACE"
        - "EXPIRED"
      description: "订阅状态。\n\n`GRACE`（宽限期，7 天）**能力全保留** —— 到期当天就压店的话， 一次忘记续费等于让他的店在客户面前消失，而他往往正在门店里忙。 宽限期是给「人」的缓冲，不是给系统的。"
    PlanQuotaSource: 
      type: "string"
      enum: 
        - "PLAN"
        - "OVERRIDE"
        - "CONFIG"
      description: "生效额度的来源。运营必须看得出这个数是哪来的 —— 否则「这家怎么是 5 家？」只能靠翻审计日志回答。"
    MerchantPlanRow: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家主体号"
        merchantName: 
          type: "string"
          description: "商家名"
        planCode: 
          type: "string"
          description: "档位码。**文案用 name/planName，不要按 code 自己映射** —— 运营改了名端上不会跟着变"
        storeQuota: 
          type: "number"
          description: "生效额度（覆盖值优先于快照）。与 storeUsed 一起显示成 2/3"
        staffQuota: 
          type: "number"
          description: "员工数配额"
        storeUsed: 
          type: "number"
          description: "已用门店数。**只数 ACTIVE**，与建店时那道额度闸同一口径"
        staffUsed: 
          type: "number"
          description: "已用员工数"
        crossStoreStats: 
          type: "boolean"
          description: "这一档给不给跨店统计"
        status: 
          "$ref": "#/definitions/PlanStatus"
          description: "状态"
        startAt: 
          type: 
            - "number"
            - "null"
          description: "生效时刻"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "到期时刻"
        grantedBy: 
          type: 
            - "string"
            - "null"
          description: "PLATFORM（运营授予）/ SELF（一期没有这条路）"
        trialUsed: 
          type: "boolean"
          description: "试用额度用过了"
        downgradedAt: 
          type: 
            - "number"
            - "null"
          description: "降级发生的时间。非空 = 已经压过店了（扫描靠它保证幂等）"
        quotaSource: 
          "$ref": "#/definitions/PlanQuotaSource"
          description: "生效额度是哪来的。**运营必须看得出来** —— 否则「这家怎么是 5 家」只能翻审计日志"
      required: 
        - "merchantNo"
        - "merchantName"
        - "planCode"
        - "storeQuota"
        - "staffQuota"
        - "storeUsed"
        - "staffUsed"
        - "crossStoreStats"
        - "status"
        - "trialUsed"
        - "quotaSource"
      additionalProperties: false
      description: "到期看板的一行（`GET /ops/merchant-plans`）。"
    PlanDef: 
      type: "object"
      properties: 
        planCode: 
          type: "string"
          description: "档位码。**文案用 name/planName，不要按 code 自己映射** —— 运营改了名端上不会跟着变"
        name: 
          type: "string"
          description: "名称"
        storeQuota: 
          type: "number"
          description: "门店数配额"
        staffQuota: 
          type: "number"
          description: "员工数配额"
        crossStoreStats: 
          type: "boolean"
          description: "这一档给不给跨店统计"
        trialDays: 
          type: "number"
          description: "试用天数。0 = 这一档不提供试用"
        enabled: 
          type: "boolean"
          description: "启用中"
        subscriberCount: 
          type: "number"
          description: "当前有几家在用这一档。\n\n**改定义的人必须看得到这个数** —— 它是「只影响之后新订阅的人」那句话的具体量。 不给这个数，改档位的人只能凭感觉判断影响面。"
      required: 
        - "planCode"
        - "name"
        - "storeQuota"
        - "staffQuota"
        - "crossStoreStats"
        - "trialDays"
        - "enabled"
        - "subscriberCount"
      additionalProperties: false
      description: "档位定义（`GET /ops/plan-defs`）。"
    PlanUpgradeSignal: 
      type: "object"
      properties: 
        ownerUserNo: 
          type: "string"
          description: "店主的用户号。要联系他升档时用"
        entityNos: 
          type: "array"
          items: 
            type: "string"
          description: "命中的商家号"
        entityNames: 
          type: "array"
          items: 
            type: "string"
          description: "命中的商家名"
        entityCount: 
          type: "number"
          description: "命中几家"
      required: 
        - "ownerUserNo"
        - "entityNos"
        - "entityNames"
        - "entityCount"
      additionalProperties: false
      description: "升档信号的一行（`GET /ops/merchant-plans/upgrade-signals`）。\n\n**按 owner 分组而不是按主体**：「同一个人开了两个主体」正是要找的人 —— 他已经在多店经营，只是绕过了额度。主体表上没有联系电话（那在申请单上）， 所以这里只给 owner 号，销售拿它去后台查人。"
    OnboardingStatus: 
      type: "string"
      enum: 
        - "NONE"
        - "APPLYING"
        - "ACTIVE"
        - "REJECTED"
        - "FROZEN"
      description: "进件（收款开户）状态：占位 / 审核中 / 已开通 / 被拒 / 冻结。"
    OnboardingRow: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
        merchantName: 
          type: "string"
          description: "商家名，展示用"
        storeNo: 
          type: "string"
          description: "为哪家门店进的件；**空串 = 主体级默认号**"
        payChannel: 
          type: "string"
          description: "WECHAT / ALIPAY"
        applyStatus: 
          "$ref": "#/definitions/OnboardingStatus"
        rejectReason: 
          type: 
            - "string"
            - "null"
          description: "被拒原因，原样给商家看；null = 没被拒"
        settleAccountType: 
          type: 
            - "string"
            - "null"
          description: "PERSONAL_BANK / CORPORATE_BANK；null = 还没填"
        settleAccountMasked: 
          type: 
            - "string"
            - "null"
          description: "结算账号掩码 —— 真实账号只在后端"
        subMchid: 
          type: 
            - "string"
            - "null"
          description: "通道侧二级商户号；null = 还没开出来"
        payMerchantNo: 
          type: 
            - "string"
            - "null"
          description: "进件成功才生成的收款号业务键；**空/null = 还收不了钱**"
        appliedAt: 
          type: 
            - "number"
            - "null"
          description: "提交进件的时间（毫秒）；null = 还没提交（占位记录）"
        ageMs: 
          type: 
            - "number"
            - "null"
          description: "从提交到现在的停留时长（毫秒）；null = 还没提交。越大越该有人去问"
        canReceiveMoney: 
          type: "boolean"
          description: "applyStatus === \"ACTIVE\""
      required: 
        - "merchantNo"
        - "merchantName"
        - "storeNo"
        - "payChannel"
        - "applyStatus"
        - "rejectReason"
        - "settleAccountType"
        - "settleAccountMasked"
        - "subMchid"
        - "payMerchantNo"
        - "appliedAt"
        - "ageMs"
        - "canReceiveMoney"
      additionalProperties: false
      description: "进件看板的一行（`GET /ops/onboarding`）。**每主体每通道一条**。\n\n它补的是入驻审核与收款进件两条链之间的盲区：审核通过 = 能上架卖货， 进件通过 = 能收钱。审核过了但进件没走完的商家「货照上、单照来、钱收不到」， 此前运营端没有一个跨商家的地方能看见 —— 这份看板就是那个地方。"
    FulfillmentType: 
      type: "string"
      enum: 
        - "STORE_PICKUP"
        - "NEIGHBOR_PICKUP"
        - "MERCHANT_DELIVERY"
        - "EXPRESS"
        - "STORE_VERIFY"
        - "APPOINTMENT"
      description: "履约方式。**取值与后端 `ord_sub_order.fulfillment` 一致**。\n\n⚠️ 这里曾经写成 `PICKUP_STORE` / `PICKUP_NEIGHBOR` —— 同一个概念、词序反了， 于是按它筛后端一条也匹配不上。ops-web 只跑 mock，所以从没被真实响应打脸过。"
    TrafficSource: 
      type: "string"
      enum: 
        - "MERCHANT_OWNED"
        - "PLATFORM"
        - "INVITE"
        - "CHANNEL"
      description: "流量来源（矩阵 P-12.1.7 按 trafficSource 分档计费）。"
    OrderStatus: 
      type: "string"
      enum: 
        - "WAIT_PAY"
        - "WAIT_OFFLINE_PAY"
        - "PAID"
        - "FULFILLING"
        - "COMPLETED"
        - "CANCELLED"
        - "REFUNDED"
      description: "订单状态。**抽象状态，与履约方式无关**，三端同一套。\n\n⚠️ 这里曾经是另一套：`PENDING_PAY` / `PREPARING` / `DELIVERING` / `AFTER_SALE`。 同一条订单，运营端叫一个名字、C/B 端叫另一个、库里又是第三个 —— 而 ops-web 只跑 mock，所以三套并存了很久没人发现。\n\n⚠️ 后来又有过 `SHIPPED` / `ARRIVED` 两个值。它们**不是状态**， 是「状态 × 履约方式」的组合冒充状态 —— 代价是每加一种履约就要加一批状态。 现在下发抽象状态 + 履约方式，显示成什么由展示层决定 （见《订单状态-统一整理》与 shared 的 `orderView`）。"
    OrderItem: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "SKU 单号"
        title: 
          type: "string"
          description: "下单时的商品标题快照"
        qty: 
          type: "number"
          description: "件数"
        price: 
          type: "number"
          description: "最小货币单位（分）"
      required: 
        - "skuNo"
        - "title"
        - "qty"
        - "price"
      additionalProperties: false
    Order: 
      type: "object"
      properties: 
        orderNo: 
          type: "string"
          description: "子订单号。**列表展示的就是子订单** —— 分账、售后、结算都以它为单位"
        parentNo: 
          type: "string"
          description: "父单号（同一次结算拆出的子订单共享）"
        status: 
          "$ref": "#/definitions/OrderStatus"
          description: "订单状态。允许的流转见 `ORDER_TRANSITIONS`"
        merchantNo: 
          type: "string"
          description: "归属商家。一个子订单只属于一个商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        communityNo: 
          type: "string"
          description: "归属社区。运营按社区做数据域隔离"
        communityName: 
          type: "string"
          description: "社区名快照"
        pickupNo: 
          type: "string"
          description: "自提点编号；配送/快递单为空"
        fulfillType: 
          "$ref": "#/definitions/FulfillmentType"
          description: "履约方式"
        trafficSource: 
          "$ref": "#/definitions/TrafficSource"
          description: "流量来源。**决定平台费率档**（P-12.1.7）"
        buyerNickname: 
          type: "string"
          description: "买家昵称"
        items: 
          type: "array"
          items: 
            "$ref": "#/definitions/OrderItem"
          description: "订单行"
        payAmount: 
          type: "number"
          description: "实付，最小货币单位（分）"
        createdAt: 
          type: "string"
          description: "下单时间（ISO 8601 字符串）"
        paidAt: 
          type: 
            - "string"
            - "null"
          description: "支付时间。未支付为 null"
        statusAt: 
          type: "string"
          description: "进入**当前状态**的时刻。异常单的\"卡了多久\"从这里算，不是从 createdAt 算"
      required: 
        - "orderNo"
        - "parentNo"
        - "status"
        - "merchantNo"
        - "merchantName"
        - "communityNo"
        - "communityName"
        - "fulfillType"
        - "trafficSource"
        - "buyerNickname"
        - "items"
        - "payAmount"
        - "createdAt"
      additionalProperties: false
    ExceptionKind: 
      type: "string"
      enum: 
        - "STUCK"
        - "PAY_TIMEOUT"
      description: "异常单的成因。\n\n⚠️ 异常单**不是一张表**，而是对订单表的一个视图 —— 一旦落成记录就会过期： 订单已经推进了，异常记录还挂在那里，运营会去处理一个不存在的问题。 所以 `OrderException` 由 `orders` 实时算出来，不存。"
    OrderException: 
      type: "object"
      properties: 
        order: 
          "$ref": "#/definitions/Order"
          description: "关联的订单快照。异常单是**实时算出来的视图**，不落表"
        kind: 
          "$ref": "#/definitions/ExceptionKind"
          description: "异常成因"
        stuckMinutes: 
          type: "number"
          description: "已经卡了多少分钟（从进入当前状态算起，mock 用 createdAt/paidAt 近似）"
        thresholdMinutes: 
          type: "number"
          description: "该状态允许卡多久（分钟），用于在界面上说明\"为什么它算异常\""
      required: 
        - "order"
        - "kind"
        - "stuckMinutes"
        - "thresholdMinutes"
      additionalProperties: false
    OrderIntervention: 
      type: "object"
      properties: 
        orderNo: 
          type: "string"
          description: "被干预的订单"
        from: 
          "$ref": "#/definitions/OrderStatus"
          description: "原状态"
        to: 
          "$ref": "#/definitions/OrderStatus"
          description: "改为的状态。**必须是 `ORDER_TRANSITIONS` 允许的迁移**"
        remark: 
          type: "string"
          description: "干预原因，必填 —— 改状态这件事必须说清楚为什么"
        operator: 
          type: "string"
          description: "操作人（STAFF 账号）"
        at: 
          type: "string"
          description: "操作时间"
      required: 
        - "orderNo"
        - "from"
        - "to"
        - "remark"
        - "operator"
        - "at"
      additionalProperties: false
      description: "人工干预的留痕。改状态这件事必须留下是谁、为什么。"
    PayChannel: 
      type: "string"
      enum: 
        - "WECHAT"
        - "ALIPAY"
        - "BALANCE"
      description: "支付渠道。一期只接微信支付，枚举先留出位置（改枚举比改结构便宜）。"
    ReconDiffType: 
      type: "string"
      enum: 
        - "CHANNEL_ONLY"
        - "PLATFORM_ONLY"
        - "AMOUNT_DIFF"
      description: "对账差异类型。\n\n⚠️ 这三类的**处置方式完全不同**，所以必须分开而不是笼统叫\"异常\"：\n- `CHANNEL_ONLY`：渠道有、平台无 —— 用户付了钱但订单没落库，要**补单或退款**\n- `PLATFORM_ONLY`：平台有、渠道无 —— 平台记了收款但渠道查无此笔，多半是误记，要**冲正**\n- `AMOUNT_DIFF`：两边都有但金额不符 —— 要人去查是折扣算错还是重复扣款"
    ReconStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "RESOLVED"
        - "IGNORED"
    ReconDiff: 
      type: "object"
      properties: 
        diffNo: 
          type: "string"
          description: "差异单号"
        billDate: 
          type: "string"
          description: "对账日期（渠道账单的账期），YYYY-MM-DD"
        channel: 
          "$ref": "#/definitions/PayChannel"
          description: "支付渠道"
        channelTxnNo: 
          type: 
            - "string"
            - "null"
          description: "渠道流水号；PLATFORM_ONLY 时为空（渠道根本没有这笔）"
        orderNo: 
          type: 
            - "string"
            - "null"
          description: "平台订单号；CHANNEL_ONLY 时为空（平台没落库）"
        type: 
          "$ref": "#/definitions/ReconDiffType"
          description: "差异类型。**三类的处置方式完全不同**，见上方注释"
        channelAmount: 
          type: "number"
          description: "渠道侧金额，最小货币单位（分）。PLATFORM_ONLY 为 0"
        platformAmount: 
          type: "number"
          description: "平台侧金额（分）。CHANNEL_ONLY 为 0"
        status: 
          "$ref": "#/definitions/ReconStatus"
          description: "处置状态"
        resolution: 
          type: 
            - "string"
            - "null"
          description: "处置结论。RESOLVED / IGNORED 必填 —— 没有结论的\"已处理\"等于没处理"
        recoveredOrderNo: 
          type: 
            - "string"
            - "null"
          description: "处置产生的补单号（仅 CHANNEL_ONLY 走补单时有）"
        createdAt: 
          type: "string"
          description: "差异产生时间"
        resolvedAt: 
          type: 
            - "string"
            - "null"
          description: "处置时间。未处置为 null"
        resolvedBy: 
          type: 
            - "string"
            - "null"
          description: "处置人（STAFF 账号）。未处置为 null"
      required: 
        - "diffNo"
        - "billDate"
        - "channel"
        - "type"
        - "channelAmount"
        - "platformAmount"
        - "status"
        - "createdAt"
      additionalProperties: false
    RecoverAction: 
      type: "string"
      enum: 
        - "CREATE_ORDER"
        - "REFUND"
      description: "掉单补偿的处置方式（P-4.2.2）。"
    CloseRule: 
      type: "object"
      properties: 
        unpaidMinutes: 
          type: "number"
          description: "未支付订单多少分钟后自动关单"
        remindBeforeMinutes: 
          type: "number"
          description: "关单前多少分钟提醒用户（0 = 不提醒）"
        autoRefundOnLateCallback: 
          type: "boolean"
          description: "关单后仍收到渠道支付回调时是否自动退款。 关掉它意味着这笔钱要人工处理 —— 但至少不会静默退掉一笔本可以补单的钱。"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "unpaidMinutes"
        - "remindBeforeMinutes"
        - "autoRefundOnLateCallback"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "关单策略（P-4.2.3）。\n\n⚠️ 这份配置与掉单**直接因果**：关单时限设得越短，\"用户正在付款、订单已被关掉\" 的窗口就越大，而那正是 CHANNEL_ONLY 差异的主要来源。所以两者放同一页。"
    FunnelStep: 
      type: "string"
      enum: 
        - "SCAN"
        - "ENTER_STORE"
        - "REGISTER"
        - "FIRST_ORDER"
      description: "增长漏斗的四段。扫码 → 进店 → 注册 → 首单"
    LoginResp: 
      type: "object"
      properties: 
        username: 
          type: "string"
          description: "登录名"
        role: 
          "$ref": "#/definitions/Role"
          description: "角色。**权限判定以后端为准**，前端只做菜单裁剪"
        token: 
          type: "string"
          description: "访问令牌。STAFF 池，与 C 端、B 端账号不通用"
        perms: 
          type: "array"
          items: 
            type: "string"
          description: "**后端下发的权限码**（`staff.perms`）。判权以它为准。\n\n`[\"*\"]` = 超管通配。前端的 UI 码要先经 `UI_PERM_MAP` 翻译成后端码 再来这里查 —— 两边的粒度不同（前端 45 个、后端 14 个）， 直接比会全判 false。"
        merchantNo: 
          type: "string"
          description: "商家运营（BD）等受限角色的数据域；平台全量角色为空"
        communityNo: 
          type: "string"
          description: "受限角色的社区数据域"
      required: 
        - "username"
        - "role"
        - "token"
        - "perms"
      additionalProperties: false
    Role: 
      type: "string"
      enum: 
        - "SUPER_ADMIN"
        - "PRODUCT_OPS"
        - "CAMPAIGN_OPS"
        - "COMMUNITY_OPS"
        - "MERCHANT_BD"
        - "AUDITOR"
        - "CS"
        - "FINANCE"
        - "RISK"
        - "ANALYST"
        - "TECH_OPS"
    DashboardKpi: 
      type: "object"
      properties: 
        gmv: 
          type: "number"
          description: "成交额（最小货币单位整数）"
        orderCount: 
          type: "number"
          description: "订单数"
        avgOrderValue: 
          type: "number"
          description: "客单价"
        pendingMerchantAudit: 
          type: "number"
          description: "待审商家数（P-11.1.1 提审队列）"
        pendingAfterSale: 
          type: "number"
          description: "待处理售后（P-6.1.1 工单池）"
        redeemRate: 
          type: "number"
          description: "今日核销率（P-5.1.3 核销监控），0–1"
      required: 
        - "gmv"
        - "orderCount"
        - "avgOrderValue"
        - "pendingMerchantAudit"
        - "pendingAfterSale"
        - "redeemRate"
      additionalProperties: false
      description: "KPI 卡（金额为最小货币单位整数）。"
    TrendPoint: 
      type: "object"
      properties: 
        date: 
          type: "string"
          description: "日期 YYYY-MM-DD"
        gmv: 
          type: "number"
          description: "当日成交额（最小货币单位整数）"
        orderCount: 
          type: "number"
          description: "当日订单数"
      required: 
        - "date"
        - "gmv"
        - "orderCount"
      additionalProperties: false
    FunnelRow: 
      type: "object"
      properties: 
        step: 
          "$ref": "#/definitions/FunnelStep"
          description: "漏斗环节：扫码 → 进店 → 注册 → 首单"
        count: 
          type: "number"
          description: "该环节人数"
      required: 
        - "step"
        - "count"
      additionalProperties: false
      description: "获客漏斗的一行（P-16.1.4 扫码→进店→注册→首单）。 ⚠️ 此前 interface 与环节枚举撞名叫 FunnelStep，字段写成 `step: FunnelStep` —— 自我引用"
    MerchantRankRow: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家主体号"
        merchantName: 
          type: "string"
          description: "商家名。**必须有** —— 只给编号的话运营还要再查一次「这家是谁」"
        gmv: 
          type: "number"
          description: "成交额（最小货币单位整数）"
        orderCount: 
          type: "number"
          description: "订单数"
        avgOrderValue: 
          type: "number"
          description: "客单价（最小货币单位整数）"
        afterSaleCount: 
          type: "number"
          description: "售后单数"
        afterSaleRate: 
          type: "number"
          description: "售后率 0–1。与 GMV 并列才看得出「卖得多」是不是「赔得也多」"
      required: 
        - "merchantNo"
        - "merchantName"
        - "gmv"
        - "orderCount"
        - "avgOrderValue"
        - "afterSaleCount"
        - "afterSaleRate"
      additionalProperties: false
      description: "商家经营排行的一行（P-16.1.2 / P-16.1.3）—— 大盘之下的第一层下钻。\n\n大盘回答「平台整体怎么样」，运营下一句必然是「哪几家在拉高、哪几家在拖后腿」。"
    MenuFunction: 
      type: "object"
      properties: 
        functionCode: 
          type: "string"
          description: "功能点编码，菜单树的一级节点"
        name: 
          type: "string"
          description: "菜单显示名"
        icon: 
          type: 
            - "string"
            - "null"
          description: "图标名；为空由前端按 functionCode 兜底"
        href: 
          type: 
            - "string"
            - "null"
          description: "一级节点自身的落地路径；为空表示它只是个分组"
        sort: 
          type: "number"
          description: "同级排序，小的在前"
        points: 
          type: "array"
          items: 
            "$ref": "#/definitions/MenuPoint"
          description: "这个功能点下的二级菜单/按钮"
      required: 
        - "functionCode"
        - "name"
        - "sort"
        - "points"
      additionalProperties: false
      description: "服务端下发的菜单分区（`GET /ops/menu`）。"
    MenuPoint: 
      type: "object"
      properties: 
        pointCode: 
          type: "string"
          description: "功能点下的点编码，菜单树的二级节点"
        name: 
          type: "string"
          description: "菜单显示名"
        groupName: 
          type: 
            - "string"
            - "null"
          description: "侧栏里的分组标题；为空表示不分组"
        href: 
          type: 
            - "string"
            - "null"
          description: "落地路径；为空表示还没有页面"
        uiPermCode: 
          type: 
            - "string"
            - "null"
          description: "前端页面自己判的码。与 permCode 不同：**它管的是能不能看见按钮，不是能不能调接口**"
        permCode: 
          type: 
            - "string"
            - "null"
          description: "后端权限码。**null = 不受权限约束** —— 与 NOT_IMPLEMENTED 是两回事"
        backendStatus: 
          type: "string"
          description: "IMPLEMENTED / NOT_IMPLEMENTED / UNMAPPED"
        uiReady: 
          type: "boolean"
          description: "后端通了但前端页面还没做完"
        matrixCode: 
          type: 
            - "string"
            - "null"
          description: "对应需求矩阵里的编号（如 `P-11.1`），用于回溯这个菜单项是哪条需求"
        pointType: 
          type: "string"
          description: "MENU 菜单项 / ACTION 页面内按钮级授权（菜单不渲染 ACTION）"
        sort: 
          type: "number"
          description: "同级排序，小的在前"
      required: 
        - "pointCode"
        - "name"
        - "backendStatus"
        - "uiReady"
        - "pointType"
        - "sort"
      additionalProperties: false
    CommunityApplyStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "APPROVED"
        - "REJECTED"
      description: "提报单的状态。\n\n与覆盖项的 PENDING **同名不同物**：那个说「这一条覆盖算不算数」， 这个说「这张提报单走到哪了」—— `APPROVED` 意味着平台已经建出了社区。"
    CommunityApply: 
      type: "object"
      properties: 
        applyNo: 
          type: "string"
          description: "提报单业务键。裁决按它定位，**不用自增 id** —— 那个不对外，重建库就变"
        merchantNo: 
          type: "string"
          description: "提报的商家"
        merchantName: 
          type: "string"
          description: "商家名。运营看着一串 M20260811… 判断不了任何事"
        name: 
          type: "string"
          description: "小区名，商家填"
        address: 
          type: "string"
          description: "地址。运营靠它判断这是不是已有社区的另一个叫法 —— 同一个小区两条记录，商家会分不清该勾哪个"
        regionCode: 
          type: "string"
          description: "商家选的区划，**只是建议**：最终以裁决时填的为准"
        regionPath: 
          type: "string"
          description: "区划整条路径名。「北山街道」全国有好几个，光末级判断不了是不是同一个地方"
        note: 
          type: "string"
          description: "商家的补充说明：为什么要开这个点"
        kind: 
          "$ref": "#/definitions/SettlementKind"
          description: "ESTATE 小区 / VILLAGE 村。裁决的人要一眼看出这是哪种聚落"
        originCode: 
          type: "string"
          description: "关联的官方村码；非空 = 从词典选的，重复开通会被后端拦"
        located: 
          type: "boolean"
          description: "带没带定位。**没带的要显眼** —— 通过后聚落没有坐标， 买家用定位永远找不到它，运营得先补坐标再通过。"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "商家提报时带的坐标（gcj02，E6）。**要看得见具体值** —— 只给一个「有/无」，落点偏到隔壁区也照样显示「有定位」，判不出对错。"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6（gcj02）"
        fallbackLatE6: 
          type: 
            - "number"
            - "null"
          description: "官方村码在区划表里的坐标（高德批量补录）。没带定位时后端通过这条提报会自动用它兜底 —— 两个都空，才是真的「通过后无坐标、买家搜不到」。"
        fallbackLngE6: 
          type: 
            - "number"
            - "null"
          description: "兜底经度：商家没选点时用提交那一刻的位置。**多半不在那个小区里**，裁决要留意"
        status: 
          "$ref": "#/definitions/CommunityApplyStatus"
          description: "待审 / 已建社区 / 已驳回。**只有 PENDING 能裁**：裁完就是终态，再裁一次意味着同一条提报有两个结论"
        communityNo: 
          type: "string"
          description: "通过后建出来的社区号；待审与驳回时为空"
        reason: 
          type: "string"
          description: "驳回原因。**原样出现在商家 B 端**，所以驳回必须填"
        submittedAt: 
          type: "number"
          description: "提报时间"
      required: 
        - "applyNo"
        - "merchantNo"
        - "merchantName"
        - "name"
        - "status"
        - "submittedAt"
      additionalProperties: false
      description: "商家提报的新社区（ADR-013 阶段三）。\n\n**它不是社区**：审过之后平台才建出来，`communityNo` 这时才有值。 待审的小区不在任何选点列表里 —— 进了主表就会出现在用户面前，而点进去什么都没有。"
    SettlementKind: 
      type: "string"
      enum: 
        - "ESTATE"
        - "VILLAGE"
      description: "聚落类型。裁决的人要一眼看出这是小区还是村 —— 两者的重复判据不一样"
    Community: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        communityNo: 
          type: "string"
          description: "社区单号。平台端数据域裁剪的主键之一"
        name: 
          type: "string"
          description: "社区名（小区名）"
        city: 
          type: "string"
          description: "所属城市"
        grid: 
          type: "string"
          description: "网格：城市与社区之间的运营划分单位"
        opened: 
          type: "boolean"
          description: "开城开关（P-2.1.2）：关掉后 C 端不再展示该社区，已有订单不受影响"
        fenceRadius: 
          type: "number"
          description: "覆盖围栏半径，米（P-2.1.3）"
        pickupCount: 
          type: "number"
          description: "本社区的自提点数量（列表直接给，避免逐行再查一次）"
        createdAt: 
          type: "string"
          description: "建档时间"
        regionCode: 
          type: "string"
          description: "所属行政区划码（`sys_region.region_code`），空 = 尚未归属。\n\n挂上之后「按区/按街道覆盖」才能命中这个社区（ADR-013）。\n**空着不代表配错了** —— 平台不按名字猜归属：猜错不报错，只会让这个社区 悄悄出现在别人的经营范围里。"
        regionPath: 
          type: "string"
          description: "从省到自身的中文路径，如「浙江省 / 杭州市 / 西湖区 / 北山街道」。\n\n**后端拼好给的**：只给一个 330106002 的话，端上要么显示一串数字， 要么自己按码长切片再逐级查 —— 而国标编码规则不是端该知道的事。"
      required: 
        - "communityNo"
        - "name"
        - "city"
        - "grid"
        - "opened"
        - "fenceRadius"
        - "pickupCount"
        - "createdAt"
      additionalProperties: false
    NearbyCommunity: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "社区号"
        name: 
          type: "string"
          description: "名称"
        latE6: 
          type: "number"
          description: "纬度 ×1e6（gcj02）"
        lngE6: 
          type: "number"
          description: "经度 ×1e6（gcj02）"
        distanceM: 
          type: "number"
          description: "距提报坐标的直线距离（米）"
        regionPath: 
          type: "string"
          description: "「广东省 / 深圳市 / 龙华区 / 福城街道」"
      required: 
        - "communityNo"
        - "name"
        - "latE6"
        - "lngE6"
        - "distanceM"
        - "regionPath"
      additionalProperties: false
      description: "附近已开通的聚落。裁决查重用：名字不同、位置只差 50 米的两条，靠文字比对看不出来"
    CommunityDuplicate: 
      type: "object"
      properties: 
        left: 
          "$ref": "#/definitions/Community"
          description: "疑似重复的一方"
        right: 
          "$ref": "#/definitions/Community"
          description: "另一方"
        reason: 
          "$ref": "#/definitions/DuplicateReason"
          description: "原因"
        distanceM: 
          type: 
            - "number"
            - "null"
          description: "两点直线距离（米）。有一方没坐标时为空"
      required: 
        - "left"
        - "right"
        - "reason"
      additionalProperties: false
      description: "疑似重复的一对聚落。\n\n`reason` 是**判据不是结论**：SAME_NAME 归一名相同、NEARBY 坐标很近且名字相似。 两条都可能是误报（同一条街道里真有「一期」「二期」两个小区）， 所以界面上给的是「合并」按钮而不是自动合并 —— 合并会改一批商家的可见范围， 错了要一条条捞回来。"
    DuplicateReason: 
      type: "string"
      enum: 
        - "SAME_NAME"
        - "NEARBY"
      description: "判重的依据。SAME_NAME 同名 / NEARBY 坐标相近 —— 运营据此决定合不合"
    RegionSuggestion: 
      type: "object"
      properties: 
        regionCode: 
          type: "string"
          description: "国标区划码"
        level: 
          type: "string"
          description: "层级"
        name: 
          type: "string"
          description: "名称"
        path: 
          type: "string"
          description: "「广东省 / 深圳市 / 龙华区 / 福城街道」"
        source: 
          "$ref": "#/definitions/RegionMatchSource"
          description: "来源"
        detail: 
          type: "string"
          description: "依据：匹配到的地址片段，或「茜坑社区 · 320 米」"
      required: 
        - "regionCode"
        - "level"
        - "name"
        - "path"
        - "source"
        - "detail"
      additionalProperties: false
    RegionMatchSource: 
      type: "string"
      enum: 
        - "ADDRESS"
        - "COORDS"
      description: "行政区划是怎么定出来的。ADDRESS 靠地址串匹配 / COORDS 靠坐标反查"
    Region: 
      type: "object"
      properties: 
        regionCode: 
          type: "string"
          description: "统计用区划代码：省 2 位 / 市 4 位 / 区县 6 位 / 街道 9 位"
        parentCode: 
          type: "string"
          description: "上级区划码。省级为空 —— 逐级选择器据此判断自己是不是在顶层"
        level: 
          type: "string"
          description: "PROVINCE / CITY / DISTRICT / STREET / VILLAGE（村委会·居委会，第五级）"
        name: 
          type: "string"
          description: "本级名称，**不含上级**（「西湖区」不是「杭州市 / 西湖区」）。要整条路径的地方自己拼，见 CommunityApply.regionPath"
        enabled: 
          type: "boolean"
          description: "开城开关：停用只影响新的选择，存量商家不动"
        hasChild: 
          type: "boolean"
          description: "下面还有没有下级。**据此决定还要不要再选一层**，而不是点进去才发现是空的"
      required: 
        - "regionCode"
        - "level"
        - "name"
        - "enabled"
        - "hasChild"
      additionalProperties: false
    PickupPointType: 
      type: "string"
      enum: 
        - "STORE"
        - "NEIGHBOR"
        - "PLATFORM"
      description: "自提点类型。**与 shared 的 `PickupPointType` 同名同值** —— 此前这里叫 `PickupType`，是同一个概念的第二个名字。 一个领域概念只能有一个词（见 docs/requirements/项目词典.md）。"
    PickupFeeMode: 
      type: "string"
      enum: 
        - "NONE"
        - "PER_ITEM"
        - "RATE"
      description: "计费口径。**目前只有 PLATFORM 点有值** —— STORE 与 NEIGHBOR 恒为 NONE。\n\n⚠️ 这与需求矩阵里「常驻点收履约服务费」看起来矛盾，其实是同一件未决事情的两个阶段：\n**B9（履约服务费口径：按单/按件/保底）在待完成清单里明确标着「未定」**， 所以 STORE 的费率还没开启；PLATFORM 点是线下逐点协商的，先落了字段。 B9 定了之后，STORE 才会有 PER_ITEM 或 RATE。"
    PickupStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "SUSPENDED"
        - "MIGRATING"
        - "PENDING"
        - "REJECTED"
      description: "PENDING/REJECTED（P1）：商家自建点的审核态 —— 先审后用，地址要印在买家取货页上"
    PickupDraft: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "归属社区。必须真的存在，否则这个点对谁都不可见而列表看着正常"
        name: 
          type: "string"
          description: "自提点名称"
        type: 
          "$ref": "#/definitions/PickupPointType"
          description: "三类的报酬与归属规则完全不同"
        ownerRef: 
          type: "string"
          description: "承接方。**多态**：STORE 传门店号、NEIGHBOR 传用户号、PLATFORM 传空。 传错会让「这个点属于谁」永久错位，而它决定核销权限与出货门店。"
        address: 
          type: "string"
          description: "自提点地址"
        openHours: 
          type: "string"
          description: "可取货时段"
        arrivalDesc: 
          type: "string"
          description: "到货说明（运营排车依据）"
        serviceFeeRate: 
          type: "number"
          description: "履约服务费费率，万分比。**NEIGHBOR 必须为 0**"
        serviceFeePerItemMinor: 
          type: "number"
          description: "按件履约服务费（分）。**NEIGHBOR 必须为 0**"
      required: 
        - "communityNo"
        - "name"
        - "type"
        - "address"
      additionalProperties: false
      description: "新建自提点的入参。三类的必填项完全不同 —— 见各字段说明"
    PickupPoint: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        pickupNo: 
          type: "string"
          description: "自提点单号"
        name: 
          type: "string"
          description: "自提点名称"
        type: 
          "$ref": "#/definitions/PickupPointType"
          description: "自提点类型（ADR-005）。三类的报酬、脱敏、作用域规则完全不同。\n\n⚠️ 这里此前只有 STORE|NEIGHBOR 两类，而后端还有 **PLATFORM**（平台提供、 线下协商费率）—— 少一类的后果是平台点在列表里渲染成 undefined 或被当成常驻点， 而它的费率规则与常驻点完全不同。"
        feeMode: 
          "$ref": "#/definitions/PickupFeeMode"
          description: "计费口径。目前只有 PLATFORM 有值，见 `PickupFeeMode` 的说明"
        status: 
          "$ref": "#/definitions/PickupStatus"
          description: "自提点状态。`MIGRATING` = 不再接新单，存量单仍在本点核销完；`PENDING` = 商家自建待核实"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "坐标（E6）。审自建点时要看：没坐标的点买家用定位找不到"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6（gcj02）"
        rejectReason: 
          type: 
            - "string"
            - "null"
          description: "驳回理由，只有 REJECTED 有值"
        communityNo: 
          type: "string"
          description: "归属社区"
        communityName: 
          type: "string"
          description: "社区名快照"
        storeNo: 
          type: "string"
          description: "承接**门店**；NEIGHBOR 点为空（承接方是 C 端用户，不是商家）。\n\n此前叫 `merchantNo` 且装的是主体号。自提点归属改到门店之后（后端 V16）， 名字与内容就对不上了 —— 一并改名，而不是让下一个人以为它还是主体号。"
        merchantName: 
          type: "string"
          description: "承接商家名快照；NEIGHBOR 点为空。名字仍挂在主体上，不是门店名"
        address: 
          type: "string"
          description: "自提点地址。NEIGHBOR 点**成团前只到楼栋**，付款后才给完整门牌"
        openHours: 
          type: "string"
          description: "营业/可取货时段，形如 \"09:00-21:00\""
        arriveTime: 
          type: "string"
          description: "到货时间（运营排车依据）"
        serviceFeeRate: 
          type: "number"
          description: "履约服务费费率，万分比（P-2.2.4）。**NEIGHBOR 恒为 0**（库上有 CHECK 约束兜底）。\n\n目前有值的只有 PLATFORM 点（线下逐点协商）；STORE 要等 B9 定口径。 存费率不存金额：口径（按单/按件/保底）未定，等定了只改结算不改主数据。"
        serviceFeePerItemMinor: 
          type: "number"
          description: "按件履约服务费（分）。与 serviceFeeRate 二选一，由 feeMode 决定用哪个"
        acceptCount30d: 
          type: "number"
          description: "近 30 天承接次数（P-2.2.5 职业化风控依据）"
        createdAt: 
          type: "string"
          description: "建档时间"
      required: 
        - "pickupNo"
        - "name"
        - "type"
        - "feeMode"
        - "status"
        - "communityNo"
        - "communityName"
        - "address"
        - "openHours"
        - "arriveTime"
        - "serviceFeeRate"
        - "serviceFeePerItemMinor"
        - "acceptCount30d"
        - "createdAt"
      additionalProperties: false
    BatchStatus: 
      type: "string"
      enum: 
        - "PLANNED"
        - "DISPATCHED"
        - "ARRIVED"
        - "SIGNED"
    ArrivalBatch: 
      type: "object"
      properties: 
        batchNo: 
          type: "string"
          description: "批次单号"
        status: 
          "$ref": "#/definitions/BatchStatus"
          description: "批次状态。**有序推进不允许跳步**，见 `BATCH_TRANSITIONS`"
        communityNo: 
          type: "string"
          description: "目的社区"
        communityName: 
          type: "string"
          description: "社区名快照"
        pickupNo: 
          type: "string"
          description: "目的自提点"
        pickupName: 
          type: "string"
          description: "自提点名称快照"
        planArriveAt: 
          type: "string"
          description: "计划到货时间"
        vehicle: 
          type: "string"
          description: "车次/司机标识；一期人肉填，二期接运力系统"
        itemCount: 
          type: "number"
          description: "本批件数"
        merchantCount: 
          type: "number"
          description: "涉及的商家数（跨商家拆单后，一个批次会混装多家的货）"
      required: 
        - "batchNo"
        - "status"
        - "communityNo"
        - "communityName"
        - "pickupNo"
        - "pickupName"
        - "planArriveAt"
        - "vehicle"
        - "itemCount"
        - "merchantCount"
      additionalProperties: false
      description: "到货批次与配车（P-5.1.1）。"
    SortingRow: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "自提点单号"
        pickupName: 
          type: "string"
          description: "自提点名称"
        skuNo: 
          type: "string"
          description: "SKU 单号"
        title: 
          type: "string"
          description: "商品标题"
        merchantName: 
          type: "string"
          description: "供货商家名。一个批次会混装多家的货"
        qty: 
          type: "number"
          description: "应分拣数量"
        shortQty: 
          type: "number"
          description: "缺货标记回传（P-5.1.2 / B-10.3.4）：自提点上报的缺件数"
      required: 
        - "pickupNo"
        - "pickupName"
        - "skuNo"
        - "title"
        - "merchantName"
        - "qty"
        - "shortQty"
      additionalProperties: false
      description: "按自提点汇总的分拣行（P-5.1.2）。只列**已签收**批次的货。"
    RedeemStat: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "自提点单号"
        pickupName: 
          type: "string"
          description: "自提点名称"
        communityName: 
          type: "string"
          description: "所属社区名"
        pending: 
          type: "number"
          description: "待核销单数（已到货、还没人来取）"
        redeemed: 
          type: "number"
          description: "已核销单数"
        overdue: 
          type: "number"
          description: "逾期未取单数"
        rate: 
          type: "number"
          description: "已核销 /（已核销 + 待核销 + 逾期），0–1"
      required: 
        - "pickupNo"
        - "pickupName"
        - "communityName"
        - "pending"
        - "redeemed"
        - "overdue"
        - "rate"
      additionalProperties: false
      description: "核销监控（P-5.1.3）：一行 = 一个自提点当日的履约健康度。"
    OverdueAction: 
      type: "string"
      enum: 
        - "POSTPONE"
        - "VOID"
      description: "逾期处置方式（P-5.1.4）。"
    OverdueRule: 
      type: "object"
      properties: 
        action: 
          "$ref": "#/definitions/OverdueAction"
          description: "逾期处置方式：顺延 or 作废"
        graceHours: 
          type: "number"
          description: "宽限小时数。**到点即作废会直接产生客诉**，所以 VOID 也必须留宽限期（≥1）。 校验在 mock/后端两侧都有，不只是表单提示。"
        maxPostpone: 
          type: "number"
          description: "顺延次数上限（action=POSTPONE 时有意义）"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "action"
        - "graceHours"
        - "maxPostpone"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
    Carrier: 
      type: "string"
      enum: 
        - "SF"
        - "JD"
        - "YTO"
      description: "承运商。一期只接这三家，改枚举比改结构便宜。"
    ShipmentStatus: 
      type: "string"
      enum: 
        - "CREATED"
        - "PICKED_UP"
        - "IN_TRANSIT"
        - "DELIVERED"
        - "EXCEPTION"
      description: "快递状态。\n\n`EXCEPTION` 不是终态：快递可能\"疑难件\"之后又派送成功。把它做成终态， 运营就得手工把单子拉回来，而那本该是承运商回传的事。"
    ShipmentTrace: 
      type: "object"
      properties: 
        at: 
          type: "string"
          description: "轨迹时间"
        text: 
          type: "string"
          description: "轨迹节点描述，原样来自承运商"
        location: 
          type: "string"
          description: "所在城市/网点"
      required: 
        - "at"
        - "text"
      additionalProperties: false
    Shipment: 
      type: "object"
      properties: 
        shipmentNo: 
          type: "string"
          description: "运单记录单号（平台侧主键，不是快递单号）"
        orderNo: 
          type: "string"
          description: "关联的子订单"
        carrier: 
          "$ref": "#/definitions/Carrier"
          description: "承运商"
        waybillNo: 
          type: "string"
          description: "承运商的快递单号"
        status: 
          "$ref": "#/definitions/ShipmentStatus"
          description: "快递状态。**`EXCEPTION` 不是终态**，疑难件可能之后又派送成功"
        receiver: 
          type: "string"
          description: "收件人姓名"
        region: 
          type: "string"
          description: "收件地区（省/市），超区判断看的就是它"
        createdAt: 
          type: "string"
          description: "建单时间"
        updatedAt: 
          type: "string"
          description: "最后一次轨迹更新时间"
        traces: 
          type: "array"
          items: 
            "$ref": "#/definitions/ShipmentTrace"
          description: "轨迹节点，按时间正序"
      required: 
        - "shipmentNo"
        - "orderNo"
        - "carrier"
        - "waybillNo"
        - "status"
        - "receiver"
        - "region"
        - "createdAt"
        - "updatedAt"
        - "traces"
      additionalProperties: false
    FreightTemplate: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        templateNo: 
          type: "string"
          description: "模板单号"
        name: 
          type: "string"
          description: "模板名"
        firstWeightGram: 
          type: "number"
          description: "首重（克）"
        firstFee: 
          type: "number"
          description: "首重费（分）"
        addWeightGram: 
          type: "number"
          description: "续重单位（克）"
        addFee: 
          type: "number"
          description: "每个续重单位的费用（分）"
        freeThreshold: 
          type: "number"
          description: "满多少分免邮；0 = 不免邮"
        isDefault: 
          type: "boolean"
          description: "默认模板不可删：删掉之后新商家没有模板可用"
        outOfRange: 
          type: "array"
          items: 
            "$ref": "#/definitions/OutOfRangeRule"
          description: "超区规则"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "templateNo"
        - "name"
        - "firstWeightGram"
        - "firstFee"
        - "addWeightGram"
        - "addFee"
        - "freeThreshold"
        - "isDefault"
        - "outOfRange"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "运费模板。\n\n重量一律用**克**、金额一律用**分** —— 两个都是整数，避免 0.1kg + 0.2kg 这类浮点误差 在算钱的地方冒出来。"
    OutOfRangeRule: 
      type: "object"
      properties: 
        region: 
          type: "string"
          description: "省或直辖市名"
        action: 
          "$ref": "#/definitions/OutOfRangeAction"
          description: "处置方式：不配送 or 加价配送"
        surcharge: 
          type: "number"
          description: "加价金额（分）。REJECT 时必须为 0 —— 不配送就没有\"加多少钱\"这回事"
      required: 
        - "region"
        - "action"
        - "surcharge"
      additionalProperties: false
    OutOfRangeAction: 
      type: "string"
      enum: 
        - "REJECT"
        - "SURCHARGE"
      description: "超区处置：不配送，或加价配送。"
    CarrierConfig: 
      type: "object"
      properties: 
        carrier: 
          "$ref": "#/definitions/Carrier"
          description: "承运商标识"
        name: 
          type: "string"
          description: "展示名"
        enabled: 
          type: "boolean"
          description: "是否启用。**不能全停，也不能停掉还有在途单的那家** —— 会让快递链路当场断掉"
        priority: 
          type: "number"
          description: "优先级，数字越小越优先。\n**不允许重复** —— 同优先级时选哪家取决于数组顺序，那是隐性行为。"
        accountMasked: 
          type: "string"
          description: "接入账号，展示一律脱敏"
        apiKeyConfigured: 
          type: "boolean"
          description: "密钥是否已配置。 只存布尔而**不存密钥本身** —— 密钥不该出现在前端契约里，哪怕是脱敏的。"
        pickupCutoff: 
          type: "string"
          description: "每日截单时间 HH:mm，过点的单顺延到次日"
        slaHours: 
          type: "number"
          description: "承诺时效（小时）"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "carrier"
        - "name"
        - "enabled"
        - "priority"
        - "accountMasked"
        - "apiKeyConfigured"
        - "pickupCutoff"
        - "slaHours"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "一家承运商的接入配置。\n\n⚠️ 这一页配错的后果不是\"显示不对\"，而是**订单发不出去**： 全停、启用没配密钥的、或者停掉还有在途单的那家，都会让快递链路当场断掉。 所以规则全部落在 mock 层，页面写不出违规配置。"
    StoreAuditKind: 
      type: "string"
      enum: 
        - "BANNER"
        - "NOTICE"
        - "SERVICE_AREA"
      description: "待审内容的种类。\n\n前两种审的是**单据自己带的 content**（店招图 / 公告文本）； `SERVICE_AREA` 审的是**另一张表里的一行** —— 商家框的区、街道覆盖（ADR-013 阶段三）。 它进同一个队列是有意的：运营的工作台上不该有两个长得一样、入口不同的待审列表。"
    StoreAuditStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "PASSED"
        - "REJECTED"
    SectionLayout: 
      type: "string"
      enum: 
        - "GRID"
        - "LIST"
        - "FEATURE"
      description: "店铺装修区块的排布方式"
    StorePageAudit: 
      type: "object"
      properties: 
        auditNo: 
          type: "string"
          description: "审核单号"
        merchantNo: 
          type: "string"
          description: "提审商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        storeName: 
          type: 
            - "string"
            - "null"
          description: "这条内容发给哪家店。存量单（后端 V214 之前）没记，为空。\n\n多店商家只看商家名判断不了「南门店今天停电」该不该放行 —— 而通过之后正是写回那家店。"
        kind: 
          "$ref": "#/definitions/StoreAuditKind"
          description: "待审内容类型：店招图 / 公告文本"
        content: 
          type: "string"
          description: "待审内容：店招图 URL、公告文本，或 `DISTRICT:330106` 这样的覆盖项定位串"
        display: 
          type: "string"
          description: "人话版的 content。`SERVICE_AREA` 时是「浙江省 / 杭州市 / 西湖区」，其余与 content 相同。\n\n**列表与详情一律显示它**：让运营对着 `DISTRICT:330106` 判断 「这家菜摊该不该覆盖整个西湖区」，等于让他去别处查一次再回来。"
        status: 
          "$ref": "#/definitions/StoreAuditStatus"
          description: "审核状态"
        hits: 
          type: "array"
          items: 
            type: "string"
          description: "机审命中的敏感词/风险项，随数据下发。 人审要看到「机器为什么标它」，否则只能凭感觉判，同一类内容两个人两个结论。"
        submittedAt: 
          type: "string"
          description: "提审时间"
        reason: 
          type: "string"
          description: "驳回原因：**原样出现在商家 B 端**，所以驳回必须填"
      required: 
        - "auditNo"
        - "merchantNo"
        - "merchantName"
        - "kind"
        - "content"
        - "status"
        - "hits"
        - "submittedAt"
      additionalProperties: false
    StoreQrcode: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "归属商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        communityName: 
          type: "string"
          description: "所属社区名，BD 按社区领码地推"
        code: 
          type: "string"
          description: "码值（C 端扫码进店的深链参数），导出时给 BD 去印刷"
        size: 
          type: 
            - "string"
            - "null"
          description: "最近一次印刷的尺寸规格，如 \"10x10cm\"；**从没印过是 null**（尺寸属于那一次印刷，不是门店属性）"
        printed: 
          type: 
            - "number"
            - "null"
          description: "累计已印数量，用于对账印刷成本。\n\n⚠️ **null = 还没人登记，不是「印了 0 张」**。两者在界面上必须分开显示 —— 混成一个数之后，运营没法知道该去催谁登记。"
        scanCount: 
          type: "number"
          description: "区间内扫码次数。**这个 0 是真的 0**（埋点一直在记），与 printed 的 null 不同"
      required: 
        - "merchantNo"
        - "merchantName"
        - "communityName"
        - "code"
        - "size"
        - "printed"
        - "scanCount"
      additionalProperties: false
      description: "店铺码批量生成与导出（P-10.1.3，供 BD 地推）。"
    StoreAcquisition: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "归属商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        scan: 
          type: "number"
          description: "扫码次数（PV）。同一个人扫三次算三次"
        scanUv: 
          type: "number"
          description: "扫码人数（UV）。匿名访客按设备号去重 —— 他还没有账号"
        enter: 
          type: "number"
          description: "进店人数：归因到本店的去重用户数"
        register: 
          type: "number"
          description: "**首次归因人数**（后端 `decision=CREATED`）。\n\n⚠️ **不等于「平台新注册」**：一个注册了很久的老用户，第一次扫这家店的码 也会计入。字段名沿用 `register` 是为了不动既有契约，口径以这句为准。"
        firstOrder: 
          type: "number"
          description: "其中已产生首单的人数"
        convRate: 
          type: "number"
          description: "首单转化率 = firstOrder / **scanUv**，0–1。\n\n分母用 UV 不用 PV：同一个人扫三次不该把转化率摊薄成三分之一。"
      required: 
        - "merchantNo"
        - "merchantName"
        - "scan"
        - "scanUv"
        - "enter"
        - "register"
        - "firstOrder"
        - "convRate"
      additionalProperties: false
      description: "门店获客效果（P-10.1.4）：扫码 → 进店 → 注册 → 首单。"
    SectionKey: 
      type: "string"
      enum: 
        - "BANNER"
        - "NOTICE"
        - "HOT"
        - "CATEGORY"
        - "COUPON"
        - "GROUP"
      description: "店铺主页板块。\n\n`BANNER`（店招）是 `required` 的：关掉之后店铺页没有头部，等于一张裸列表。 其余板块商家可以按模板取舍。"
    TemplateSection: 
      type: "object"
      properties: 
        key: 
          "$ref": "#/definitions/SectionKey"
          description: "板块标识"
        enabled: 
          type: "boolean"
          description: "是否启用。`required=true` 的板块不能停用"
        required: 
          type: "boolean"
          description: "必选板块不能停用"
      required: 
        - "key"
        - "enabled"
        - "required"
      additionalProperties: false
    StoreTemplate: 
      type: "object"
      properties: 
        templateNo: 
          type: "string"
          description: "模板单号"
        name: 
          type: "string"
          description: "模板名"
        layout: 
          "$ref": "#/definitions/SectionLayout"
          description: "商品区排布"
        sections: 
          type: "array"
          items: 
            "$ref": "#/definitions/TemplateSection"
          description: "板块开关列表"
        enabled: 
          type: "boolean"
          description: "是否可选用。**停用前要看 `usedByCount`** —— 正在被使用的模板停不得"
        isDefault: 
          type: "boolean"
          description: "默认模板：新店开出来就用它，所以停用不了"
        usedByCount: 
          type: "number"
          description: "正在使用该模板的店铺数（只读）"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "templateNo"
        - "name"
        - "layout"
        - "sections"
        - "enabled"
        - "isDefault"
        - "usedByCount"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "店铺主页模板。\n\n⚠️ `usedByCount` 是**只读的引用计数**，不是配置项 —— 它存在的唯一理由是 拦住\"停用一个正在被 12 家店用着的模板\"这件事。"
    StoreGovernStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "READONLY"
        - "SUSPENDED"
      description: "门店经营状态。三档**不是同一个人在管**，所以不能压成一个 `enabled` 布尔：\n\n- `ACTIVE`    正常营业；\n- `READONLY`  商家自助停用（自己关的，自己能开回来）；\n- `SUSPENDED` 平台强制下线 —— **只有平台解得开**，商家侧的启停对它一律拒绝。\n\n压成布尔的后果是运营看不出「这家店是自己歇业还是被我们压下去的」， 而这两件事该做的动作完全相反。"
    StoreGovern: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号"
        name: 
          type: "string"
          description: "门店名"
        address: 
          type: "string"
          description: "门店地址"
        merchantNo: 
          type: "string"
          description: "所属商家主体"
        merchantName: 
          type: "string"
          description: "商家名快照"
        isDefault: 
          type: "boolean"
          description: "是否主体的默认门店。默认店承接「没指定门店」的那些流量"
        status: 
          "$ref": "#/definitions/StoreGovernStatus"
          description: "经营状态，见  {@link  StoreGovernStatus }"
        businessMode: 
          "$ref": "#/definitions/BusinessMode"
          description: "自营 / 第三方。决定这家店的钱怎么走、票怎么开"
        payMerchantNo: 
          type: 
            - "string"
            - "null"
          description: "本店专属收款商户号。\n**`null` 不是「没配」，是「用主体默认收款号」** —— 显示成空白会被读成前者。"
        announcement: 
          type: "string"
          description: "门店公告（走 P-10.1 的机审 + 人审）"
        openHours: 
          type: "string"
          description: "营业时间，展示串"
        deliveryRadiusM: 
          type: "number"
          description: "配送半径（米）"
        deliveryMinOrderMinor: 
          type: "number"
          description: "起送价（分）"
        deliveryFeeMinor: 
          type: "number"
          description: "配送费（分）"
        deliveryFreeThresholdMinor: 
          type: "number"
          description: "免配送费门槛（分）"
      required: 
        - "storeNo"
        - "name"
        - "address"
        - "merchantNo"
        - "merchantName"
        - "isDefault"
        - "status"
        - "businessMode"
        - "payMerchantNo"
        - "announcement"
        - "openHours"
        - "deliveryRadiusM"
        - "deliveryMinOrderMinor"
        - "deliveryFeeMinor"
        - "deliveryFreeThresholdMinor"
      additionalProperties: false
      description: "平台视角的门店档案（后端 `mch_store`，`GET /ops/stores`）。\n\n**只读为主**：门店资料、价格、库存运营一律不改 —— 平台的边界是「裁、定、兜」， 不替商家运营。这份类型里唯一会被写回的是 `status`（解除强制下线）。\n\n与  {@link  StoreMode  }  的关系：那份是「准入与保证金」页里**只关心经营模式与收款号** 的窄投影，这份是门店档案的全貌。两者共用 storeNo，故意不合并 —— 合并会让那一页凭空多出十个它不该关心的字段。"
    StoreStats: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号"
        merchantNo: 
          type: "string"
          description: "所属商家主体"
        todayOrders: 
          type: "number"
          description: "今日订单数"
        todayGmvMinor: 
          type: "number"
          description: "今日 GMV（分）"
        monthOrders: 
          type: "number"
          description: "本月订单数"
        monthGmvMinor: 
          type: "number"
          description: "本月 GMV（分）"
        ownedTrafficRate: 
          type: "number"
          description: "自带客流占比，0–1。**直接对应这家店少付的佣金**（ADR-004）"
        toShip: 
          type: "number"
          description: "待发货"
        toDeliver: 
          type: "number"
          description: "待自送"
        toStock: 
          type: "number"
          description: "缺货待补。运营看它判断「这家店是不是没人管了」"
      required: 
        - "storeNo"
        - "merchantNo"
        - "todayOrders"
        - "todayGmvMinor"
        - "monthOrders"
        - "monthGmvMinor"
        - "ownedTrafficRate"
        - "toShip"
        - "toDeliver"
        - "toStock"
      additionalProperties: false
      description: "门店经营状况（`GET /ops/stores/{storeNo}/stats`）。\n\n后端复用商家自己在 B 端看的那套统计，不另存计数器 —— 另存的迟早出现「总览说 3 单、点进去只有 2 单」。\n\n待办只有**门店维度**三项：核销与分拣是自提点维度且不限商家， 摆进门店页会被读成「这家店的活」。"
    CouponType: 
      type: "string"
      enum: 
        - "FULL_CUT"
        - "DISCOUNT"
        - "NEWCOMER"
        - "TARGETED"
    CouponBuildableType: 
      type: "string"
      enum: 
        - "FULL_CUT"
        - "DISCOUNT"
      description: "建券表单能建的类型子集。NEWCOMER/TARGETED 不在这里——`discountFor` 从未处理过 它们，没有折扣算法撑着，建券表单不给选，避免看着能建、保存必炸。"
    CouponStatus: 
      type: "string"
      enum: 
        - "DRAFT"
        - "ACTIVE"
        - "PAUSED"
        - "ENDED"
      description: "DRAFT 可改可删；ACTIVE ⇄ PAUSED 之间可来回；ENDED 是终态（券已发出去的仍然有效）。"
    Coupon: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        couponNo: 
          type: "string"
          description: "券模板单号"
        name: 
          type: "string"
          description: "券名，展示给用户"
        type: 
          "$ref": "#/definitions/CouponType"
          description: "券类型，决定 `value` 的口径"
        status: 
          "$ref": "#/definitions/CouponStatus"
          description: "券状态。允许的流转见 `COUPON_TRANSITIONS`；**ENDED 不影响已发出的券**"
        value: 
          type: "number"
          description: "面额（满减/新人/定向）或折扣万分比（DISCOUNT，如 8500 = 85 折）"
        threshold: 
          type: "number"
          description: "使用门槛，0 表示无门槛"
        validFrom: 
          type: "number"
          description: "生效开始时间（毫秒时间戳，后端全域口径）"
        validTo: 
          type: "number"
          description: "生效结束时间（毫秒时间戳）"
        budget: 
          type: "number"
          description: "预算（分）。**已发放金额不得超过它** —— 这是唯一挡住\"发着发着超支\"的地方， 且必须在服务端校验：客服也持有发券权限（矩阵 §2.3 补偿券）。\n\n`0` = 不限。存量券全是这样：加预算列的迁移不改变已在跑的券的行为。\n\n服务端的校验在领券那条 UPDATE 里与张数一起判（原子）， 见 `CouponMappers.tryReceive`。⚠️ 折扣券挡不住 —— 它的实际支出 取决于用券那一单的金额，发放时算不出来。"
        issuedAmount: 
          type: "number"
          description: "已发放金额（分）= 已领张数 × 面额。折扣券算不出来，恒为 0"
        issued: 
          type: "number"
          description: "已发放张数"
        redeemed: 
          type: "number"
          description: "已核销张数（P-7.1.4 效果）"
        createdAt: 
          type: "number"
          description: "创建时间（毫秒时间戳）"
        totalCount: 
          type: "number"
          description: "发行量。**建券时敞口 = totalCount × 单张最大优惠**（TDD-营销预算前置）， 是预算前置校验的另一半——只有它和面额/封顶一起，敞口才算得出来。"
        perUserLimit: 
          type: "number"
          description: "每人限领张数"
        maxDiscountMinor: 
          type: "number"
          description: "折扣券封顶（分）。仅 `type=DISCOUNT` 有意义，其余类型恒为 0。\n**建券时必填 >0**——0 = 不封顶已取消，敞口在建券那一刻就必须算得出来。 与 `value`（折扣万分比）分开：一个决定打几折，一个决定最多减多少。"
      required: 
        - "couponNo"
        - "name"
        - "type"
        - "status"
        - "value"
        - "threshold"
        - "validFrom"
        - "validTo"
        - "budget"
        - "issuedAmount"
        - "issued"
        - "redeemed"
        - "createdAt"
        - "totalCount"
        - "perUserLimit"
        - "maxDiscountMinor"
      additionalProperties: false
    CouponSaveReq: 
      type: "object"
      properties: 
        couponNo: 
          type: "string"
          description: "为空 = 新建"
        name: 
          type: "string"
          description: "名称"
        type: 
          "$ref": "#/definitions/CouponBuildableType"
          description: "类型"
        faceMinor: 
          type: "number"
          description: "FULL_CUT 必填"
        discountRate: 
          type: "number"
          description: "DISCOUNT 必填，万分比"
        maxDiscountMinor: 
          type: "number"
          description: "DISCOUNT 必填 >0 —— 取消「0=不封顶」"
        threshold: 
          type: "number"
          description: "用券门槛（分）。0 = 无门槛"
        totalCount: 
          type: "number"
          description: "总发行量。空 = 不限量"
        perUserLimit: 
          type: "number"
          description: "每人最多领几张"
        budget: 
          type: "number"
          description: "0 或不填 = 不限；非零时必须 ≥ 敞口，否则服务端拒绝"
        validFrom: 
          type: "number"
          description: "生效时刻"
        validTo: 
          type: "number"
          description: "失效时刻"
      required: 
        - "name"
        - "type"
        - "totalCount"
        - "validFrom"
        - "validTo"
      additionalProperties: false
