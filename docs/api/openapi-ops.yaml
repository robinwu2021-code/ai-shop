        merchantNo: 
          type: "string"
          description: "申请商家"
        merchantName: 
          type: "string"
          description: "商家名快照"
        period: 
          type: "string"
          description: "开票周期，与结算周期同口径"
        amount: 
          type: "number"
          description: "申请开票金额（分）"
        settledAmount: 
          type: "number"
          description: "该周期已结算金额（分）。开票金额不能超过它 —— 超了就是虚开"
        titleType: 
          "$ref": "#/definitions/InvoiceTitleType"
          description: "抬头类型。企业抬头必须有税号，个人抬头没有 —— 两条不同的校验路径"
        title: 
          type: "string"
          description: "发票抬头（公司全称或个人姓名）"
        taxNo: 
          type: 
            - "string"
            - "null"
          description: "纳税人识别号。企业抬头必填"
        status: 
          "$ref": "#/definitions/InvoiceStatus"
          description: "开票状态"
        serialNo: 
          type: 
            - "string"
            - "null"
          description: "开票后的发票流水号"
        appliedAt: 
          type: "string"
          description: "申请时间"
        decidedAt: 
          type: 
            - "string"
            - "null"
          description: "处理时间。未处理为 null"
        remark: 
          type: 
            - "string"
            - "null"
          description: "驳回原因。原样回商家 B 端"
