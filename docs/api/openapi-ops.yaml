        provider: 
          type: "string"
          description: "ALI / SMTP / WECHAT / GETUI / FCM / APNS / INTERNAL"
        scope: 
          type: "string"
          description: "接入范围 PLATFORM / MERCHANT / TEST"
        ownerNo: 
          type: "string"
          description: "scope=MERCHANT 的商家号；平台/测试为空串"
        enabled: 
          type: "boolean"
          description: "软开关（运营即时启停）"
        status: 
          type: "string"
          description: "读时派生 UNCONFIGURED / STUB / READY / DISABLED / DEGRADED"
        priority: 
          type: "number"
          description: "同类型同供应商多实例的选择优先级，小者先"
        credRef: 
          type: 
            - "string"
            - "null"
          description: "凭据引用（env 前缀），不含密钥明文；可空"
        configJson: 
          type: "string"
          description: "非密参数（签名/模板号/topic），JSON 串"
        missingCreds: 
          type: "array"
