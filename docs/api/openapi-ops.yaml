      description: "某一个商家的一行库存余额（`BalanceVO`）。健康度页点进某一行时看的东西。\n\n<p>与  {@link  InvHealthRow }  **不是同一件事**：那边是「不知道该看谁」时的平台级扫描， 这边必须先知道看哪个商家。两者共用过同一个路径名，代价是运营端照着名字接错。"
    InvLedgerRow: 
      type: "object"
      properties: 
        id: 
          type: "number"
