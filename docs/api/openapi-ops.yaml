    GoodsSkuRow: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "SKU 号"
        optionValues: 
          type: "array"
          items: 
            type: "string"
          description: "这条 SKU 的规格取值组合"
        spec: 
          type: "string"
          description: "规格描述，人读的"
        prices: 
          "$ref": "#/definitions/Partial%3CRecord%3CMarket%2Cnumber%3E%3E"
          description: "按市场分别定价（分）。缺某个市场 = 没这个市场的价，不是 0 元"
        stock: 
          type: "number"
          description: "可售库存"
