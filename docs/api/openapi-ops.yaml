          type: "string"
          description: "数据域（P-1.1.3）。只对**受限角色**有意义： 社区运营 → communityNo、商家运营 → merchantNo。 给全量角色（超管等）配数据域是配置错误 —— 会让人以为它被限制了，实际没有。"
        communityNo: 
          type: "string"
          description: "社区运营的社区数据域"
        pickupNo: 
          type: "string"
          description: "自提点数据域"
        enabled: 
          type: "boolean"
          description: "是否启用。停用后立即无法登录，历史操作留痕保留"
        lastLoginAt: 
          type: "string"
          description: "最近登录时间。从未登录为空"
        createdAt: 
          type: "string"
          description: "建档时间"
