        - "earnDeny"
        - "redeemDeny"
        - "offlineRedeem"
      additionalProperties: false
      description: "积分的**端策略**。存的是**禁用名单，不是允许名单** —— `X-Client` 头今天还没有哪个端全量在发，用允许名单会让开关一上线就把全站积分静默关掉。\n\n⚠️ 它**不是合规硬闸**：端标识来自客户端、可伪造，只能用于平台策略。"
    InvHealthRow: 
      type: "object"
