          description: "回答正文。未回答为 null"
        answeredBy: 
          type: 
            - "string"
            - "null"
          description: "回答人（STAFF 或商家）。未回答为 null"
        answeredAt: 
          type: 
            - "string"
            - "null"
          description: "回答时间。未回答为 null"
        status: 
          "$ref": "#/definitions/QuestionStatus"
          description: "问答状态"
        createdAt: 
          type: "string"
          description: "提问时间"
        hideReason: 
          type: 
            - "string"
            - "null"
          description: "隐藏原因。隐藏也要写清为什么，否则用户来问时没人说得清"
      required: 
        - "questionNo"
        - "skuNo"
        - "skuTitle"
        - "content"
        - "askedBy"
        - "status"
        - "createdAt"
      additionalProperties: false
    AppearanceConfig: 
      type: "object"
      properties: 
        defaultSkin: 
          "$ref": "#/definitions/ThemeKey"
          description: "C 端默认皮肤下发（C-TH-05）。取值必须是 `C_END_THEMES` 之一（不含运营端专有的 business），与 packages/shared 的 SKINS 同源"
        festivalSkin: 
          "$ref": "#/definitions/ThemeKey"
          description: "节日皮肤：留空表示不启用"
        festivalFrom: 
          type: "string"
          description: "节日皮肤生效开始时间。启用节日皮肤时必填"
        festivalTo: 
          type: "string"
          description: "节日皮肤生效结束时间"
        fallbackLang: 
          type: "string"
          description: "语言回落规则（R9）：缺译时回落到哪个语言"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "defaultSkin"
        - "fallbackLang"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "全局外观与语言（P-17.1.1 / 17.1.2）。"
    ThemeKey: 
      type: "string"
      enum: 
        - "mono"
        - "business"
        - "fresh"
        - "promo"
        - "blue"
    MarketConfig: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "市场编码，如 `CN` / `SG`"
        name: 
          type: "string"
          description: "市场展示名"
        currency: 
          type: "string"
          description: "结算与展示货币，如 `CNY`"
        timezone: 
          type: "string"
          description: "时区标识，如 `Asia/Shanghai`。截单时间按它切分自然日"
        rate: 
          type: "number"
          description: "对基准货币的汇率。 ⚠️ 基准货币（CNY）恒为 1 且**不可改** —— 改了整套价格换算的原点就没了。"
        enabled: 
          type: "boolean"
          description: "是否开放该市场。关掉后该市场的商品不再售卖"
      required: 
        - "code"
        - "name"
        - "currency"
        - "timezone"
        - "rate"
        - "enabled"
      additionalProperties: false
      description: "市场与货币（P-17.1.3）。"
    RuleTexts: 
      type: "object"
      properties: 
        refund: 
          type: "string"
          description: "退款规则文案，C 端售后页展示"
        pickup: 
          type: "string"
          description: "自提规则文案，C 端下单与取货页展示"
        weighDiff: 
          type: "string"
          description: "称重差价规则文案，生鲜订单展示"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "refund"
        - "pickup"
        - "weighDiff"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "规则文案（P-17.1.4）。这三条是 C 端要展示给用户看的，不能为空。"
    FeatureFlag: 
      type: "object"
      properties: 
        key: 
          type: "string"
          description: "开关标识，代码里读的就是它"
        name: 
          type: "string"
          description: "开关展示名"
        enabled: 
          type: "boolean"
          description: "总开关。关掉时 `rolloutPercent` 不生效"
        rolloutPercent: 
          type: "number"
          description: "灰度比例 0–100"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
      required: 
        - "key"
        - "name"
        - "enabled"
        - "rolloutPercent"
        - "updatedAt"
      additionalProperties: false
      description: "开关与灰度（P-17.1.5）。"
    Industry: 
      type: "object"
      properties: 
        industry: 
          type: "string"
          description: "行业码，入驻申请回传的就是它"
        name: 
          type: "string"
          description: "展示名。三端都取服务端的，不各自维护翻译"
        sort: 
          type: "number"
          description: "排序"
        enabled: 
          type: "boolean"
          description: "是否启用。关掉后入驻表单里不再出现这个行业"
        wechatMicroAllowed: 
          type: "boolean"
          description: "微信是否允许该行业以小微进件"
        alipayMicroAllowed: 
          type: "boolean"
          description: "支付宝是否允许"
        pointsForced: 
          type: "boolean"
          description: "是否**强制开启积分**（商家不可自行关闭）。 它是 `mch_entity.points_forced` 的来源 —— 高毛利行业平台会要求让利。"
        remark: 
          type: "string"
          description: "备注：为什么这么配。改白名单是会被商家追问的操作"
      required: 
        - "industry"
        - "name"
        - "sort"
        - "enabled"
        - "wechatMicroAllowed"
        - "alipayMicroAllowed"
        - "pointsForced"
      additionalProperties: false
      description: "行业主数据（后端 `sys_industry`）。**已接真后端。**\n\n<p>它不是一张普通的字典表：**行业决定商家能不能以小微主体进件** —— 微信的小微白名单按行业给，判错一次商家就是进件被拒，而那时他已经开完店、上完架。"
    AuthCodeAdmin: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "授权码，如 `FRESH_VEG`。**建成之后不可改** —— 改它等于换一张证"
        name: 
          type: "string"
          description: "展示名，运营给商家发证时看到的就是它"
        requiredQualification: 
          type: "string"
          description: "需要的资质证件名。空 = 无证件要求（不是「漏填」）"
        sort: 
          type: "number"
          description: "列表里的排序权重，小的在前。同值按 code 兜底，保证顺序稳定"
        enabled: 
          type: "boolean"
          description: "是否可发放。停用**不撤销**存量商家已持有的授权"
        merchantCount: 
          type: "number"
          description: "持有该码的商家数 —— 停之前要知道影响面"
        categoryCount: 
          type: "number"
          description: "引用该码的在用类目数。> 0 时停用会被拒（那些类目会变成永远拒绝所有人）"
      required: 
        - "code"
        - "name"
        - "sort"
        - "enabled"
        - "merchantCount"
        - "categoryCount"
      additionalProperties: false
      description: "授权码字典（运营视图）。\n\n⚠️ 与 `AuthCode`（给商家发证时的可选项，见 types/merchant.ts）**是两个口径**： 那个只给启用的，这个含停用的并带影响面计数。合并的话，停用过的码就再也 恢复不了 —— 页面上根本看不见它。"
    ServiceScopeConfig: 
      type: "object"
      properties: 
        scope: 
          type: "string"
          description: "COMMUNITY / CITY / PLATFORM"
        enabled: 
          type: "boolean"
          description: "这一期是否开放这一档。关掉**不影响已经是这一档的存量商家**，只是不能再选"
        merchantCount: 
          type: "number"
          description: "当前在用的商家数。不带计数的开关是盲操作"
      required: 
        - "scope"
        - "enabled"
        - "merchantCount"
      additionalProperties: false
      description: "经营范围档位的启用状态（ADR-009 三档）。\n\n档位本身是枚举，永远是那三个；这里配的是**这一期开放哪几档**。 一期自营模式关掉了 PLATFORM —— 没有虚拟商品/卡券/自营快递品支撑它。"
    MediaOverview: 
      type: "object"
      properties: 
        totalBytes: 
          type: "number"
          description: "合计字节数"
        totalCount: 
          type: "number"
          description: "总发行量。空 = 不限量"
        activeBytes: 
          type: "number"
          description: "在用的字节数"
        activeCount: 
          type: "number"
          description: "在用的对象数"
        reclaimableBytes: 
          type: "number"
          description: "可回收的字节数"
        reclaimableCount: 
          type: "number"
          description: "可回收的对象数"
        abnormal: 
          type: "boolean"
          description: "可回收占比 > 50%。多半是有图片列没登记进 MediaRefSource —— 先查，别照删"
      required: 
        - "totalBytes"
        - "totalCount"
        - "activeBytes"
        - "activeCount"
        - "reclaimableBytes"
        - "reclaimableCount"
        - "abnormal"
      additionalProperties: false
      description: "顶部四张卡。`abnormal` 为真时页面置顶红条并禁用批量回收。"
    MediaStoreUsage: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "`_ENTITY` = 主体级（证件，以及门店维度出现之前的存量图）"
        entityNo: 
          type: "string"
          description: "所属商家"
        count: 
          type: "number"
          description: "数量"
        activeBytes: 
          type: "number"
          description: "在用的字节数"
        reclaimableBytes: 
          type: "number"
          description: "可回收的字节数"
      required: 
        - "storeNo"
        - "entityNo"
        - "count"
        - "activeBytes"
        - "reclaimableBytes"
      additionalProperties: false
    MediaReclaimable: 
      type: "object"
      properties: 
        assetKey: 
          type: "string"
          description: "对象存储里的键。**删的就是它** —— 删错一张图，引用它的页面从此是破图"
        entityNo: 
          type: "string"
          description: "上传方商家"
        storeNo: 
          type: "string"
          description: "上传方门店"
        bizType: 
          "$ref": "#/definitions/MediaBizType"
          description: "这张图当初是为什么传的。运营靠它判断能不能删"
        bytes: 
          type: "number"
          description: "占用字节数。回收的价值全在这个数上"
        width: 
          type: 
            - "number"
            - "null"
          description: "像素宽"
        height: 
          type: 
            - "number"
            - "null"
          description: "像素高"
        uploadedBy: 
          type: 
            - "string"
            - "null"
          description: "上传人"
        createdAt: 
          type: 
            - "string"
            - "null"
          description: "上传时刻"
        markedAt: 
          type: 
            - "string"
            - "null"
          description: "被标记为可回收的时刻。**与 createdAt 分开**：刚失去引用就删，容易删掉正在编辑的东西"
        reason: 
          type: "string"
          description: "「从未被引用」或「曾被『商品 G0012 · 主图』引用，… 后失去引用」"
        status: 
          type: "string"
          description: "状态"
      required: 
        - "assetKey"
        - "entityNo"
        - "storeNo"
        - "bizType"
        - "bytes"
        - "reason"
        - "status"
      additionalProperties: false
      description: "待回收的一行。`reason` 是这一列的全部意义 —— 运营靠它判断「这张能不能删」。"
    MediaBizType: 
      type: "string"
      enum: 
        - "GOODS"
        - "QUAL"
        - "AFTERSALE"
      description: "这张图当初是为什么传的。运营靠它判断「这张能不能删」"
    MediaPurgeBatch: 
      type: "object"
      properties: 
        batchNo: 
          type: "string"
          description: "批次号"
        operator: 
          type: "string"
          description: "发起人账号"
        operatorName: 
          type: 
            - "string"
            - "null"
          description: "发起时的显示名快照 —— 人离职改名之后这条记录还得说得清是谁"
        status: 
          "$ref": "#/definitions/MediaPurgeStatus"
          description: "状态"
        totalCount: 
          type: "number"
          description: "这一批有多少张"
        totalBytes: 
          type: "number"
          description: "这一批合计多少字节"
        purgedCount: 
          type: "number"
          description: "真删掉了多少张"
        failedCount: 
          type: "number"
          description: "删失败多少张。**多半是已经不在了** —— 所以整批的结局是 PARTIAL 而不是 FAILED"
        startedAt: 
          type: 
            - "string"
            - "null"
          description: "开始时刻"
        finishedAt: 
          type: 
            - "string"
            - "null"
          description: "结束时刻。空 = 还在跑"
        createdAt: 
          type: 
            - "string"
            - "null"
          description: "上传时刻"
      required: 
        - "batchNo"
        - "operator"
        - "status"
        - "totalCount"
        - "totalBytes"
        - "purgedCount"
        - "failedCount"
      additionalProperties: false
    MediaPurgeStatus: 
      type: "string"
      enum: 
        - "QUEUED"
        - "RUNNING"
        - "DONE"
        - "PARTIAL"
      description: "清理批次的状态。**PARTIAL 不是失败** —— 部分对象删成功、部分没删掉 （多半是已经不在了），归进 DONE 会让人以为清干净了，归进失败会让人重跑一遍。"
    MediaBatchDetail: 
      type: "object"
      properties: 
        batch: 
          "$ref": "#/definitions/MediaPurgeBatch"
          description: "批次本身"
        items: 
          type: "array"
          items: 
            "$ref": "#/definitions/MediaReclaimable"
          description: "这一批里的每一张"
      required: 
        - "batch"
        - "items"
      additionalProperties: false
    MediaScanResult: 
      type: "object"
      properties: 
        total: 
          type: "number"
          description: "扫到多少张"
        referenced: 
          type: "number"
          description: "其中仍被引用的"
        marked: 
          type: "number"
          description: "本轮标记为可回收的"
        rescued: 
          type: "number"
          description: "本轮被救回的（重新有引用了）"
        abnormal: 
          type: "boolean"
          description: "异常对象数"
      required: 
        - "total"
        - "referenced"
        - "marked"
        - "rescued"
        - "abnormal"
      additionalProperties: false
    MediaPurgePreview: 
      type: "object"
      properties: 
        count: 
          type: "number"
          description: "数量"
        bytes: 
          type: "number"
          description: "占用字节数"
        sample: 
          type: "array"
          items: 
            type: "string"
          description: "抽样：**先给人看几张再让他按** —— 清理不可逆"
      required: 
        - "count"
        - "bytes"
        - "sample"
      additionalProperties: false
    MediaBackfillResult: 
      type: "object"
      properties: 
        scanned: 
          type: "number"
          description: "扫了多少个对象"
        inserted: 
          type: "number"
          description: "补录了多少条"
        skipped: 
          type: "number"
          description: "跳过多少个"
      required: 
        - "scanned"
        - "inserted"
        - "skipped"
      additionalProperties: false
    MediaReclaimableQuery: 
      type: "object"
      properties: 
        entityNo: 
          type: "string"
          description: "所属商家"
        storeNo: 
          type: "string"
          description: "门店号"
        includeQual: 
          type: "boolean"
          description: "把资质影像也算进来。**默认不算** —— 证照删了商家要重新上传，代价比省下的空间大"
        neverUsed: 
          type: "boolean"
          description: "true 只看「从未被引用」，false 只看「被替换掉的」，不传都要"
        page: 
          type: "number"
          description: "页码"
        size: 
          type: "number"
          description: "每页条数"
      additionalProperties: false
      description: "待回收清单的筛选。`includeQual` 默认 false —— 证件留存期是法务口径。"
    JobStatus: 
      type: "string"
      enum: 
        - "SUCCESS"
        - "FAILED"
        - "SKIPPED"
        - "UNREACHABLE"
        - "TIMEOUT"
        - "RUNNING"
      description: "一轮执行的结局。**分组比取值本身重要** —— 它决定页面上要提示人做什么。"
    JobRow: 
      type: "object"
      properties: 
        jobName: 
          type: "string"
          description: "任务的锁名（与 shedlock 同一个键）。**页面不显示它**，显示 displayName"
        displayName: 
          type: "string"
          description: "给人看的中文名。**页面显示这个，不显示 jobName** —— 运营看不懂锁名"
        description: 
          type: 
            - "string"
            - "null"
          description: "这个任务做什么，运营看的一句话"
        ownerModule: 
          type: 
            - "string"
            - "null"
          description: "归哪个模块。出问题时据此找人"
        cron: 
          type: "string"
          description: "排期表达式"
        enabled: 
          type: "boolean"
          description: "开着没有。关掉的任务不会被调度器捡起来"
        missing: 
          type: "boolean"
          description: "代码里已经没有这个任务了。**不删行是有意的**：静默消失比留着危险"
        manualTrigger: 
          type: "boolean"
          description: "页面上显不显示「立即执行」。秒级任务给 false —— 它们本来就一直在跑"
        lastRunAt: 
          type: 
            - "string"
            - "null"
          description: "`null` = **从未执行**。这是今天 17 个任务的普遍状态，要显示成一句话而不是空白"
        lastStatus: 
          anyOf: 
            - "$ref": "#/definitions/JobStatus"
            - type: "null"
          description: "上一轮的结局"
        durationMs: 
          type: 
            - "number"
            - "null"
          description: "耗时（毫秒）"
        detail: 
          type: 
            - "string"
            - "null"
          description: "业务写的一句人话：「关闭 12 单，释放库存 34 件」。运营唯一能看懂的东西"
        error: 
          type: 
            - "string"
            - "null"
          description: "错误信息。**与 detail 分开**：detail 是业务说的话，这里是异常"
        consecutiveFailures: 
          type: "number"
          description: "**只统计 FAILED**；SKIPPED / TIMEOUT / UNREACHABLE 都不算 —— 否则告警会在一切正常时响"
        runCount: 
          type: "number"
          description: "累计执行轮次"
        nextRunAt: 
          type: 
            - "string"
            - "null"
          description: "下一次预计执行时刻。任务停用或已消失时为空"
        running: 
          type: "boolean"
          description: "此刻正在跑"
        triggerPending: 
          type: "boolean"
          description: "点过「立即执行」但调度器还没捡起来。没有这一格的话，点完页面毫无反应"
        updatedBy: 
          type: 
            - "string"
            - "null"
          description: "上次改配置的人"
      required: 
        - "jobName"
        - "displayName"
        - "description"
        - "ownerModule"
        - "cron"
        - "enabled"
        - "missing"
        - "manualTrigger"
        - "lastRunAt"
        - "lastStatus"
        - "durationMs"
        - "detail"
        - "error"
        - "consecutiveFailures"
        - "runCount"
        - "nextRunAt"
        - "running"
        - "triggerPending"
        - "updatedBy"
      additionalProperties: false
      description: "列表里的一行：**任务定义 + 当前状态**，后端已经合好。\n\n前端不该发两次请求再自己 join —— 那样「有定义但从没跑过」这种状态要靠前端拼， 而它恰恰是今天最常见的状态。"
    JobLogRow: 
      type: "object"
      properties: 
        runId: 
          type: "string"
          description: "这一轮的编号"
        jobName: 
          type: "string"
          description: "任务的锁名（与 shedlock 同一个键）。**页面不显示它**，显示 displayName"
        triggerType: 
          "$ref": "#/definitions/JobTriggerType"
          description: "这一轮是被什么触发的。**排障第一个看它** —— 定时跑失败和人手动补跑失败要找的人不同"
        bizDate: 
          type: 
            - "string"
            - "null"
          description: "业务日期。**补数跑的是历史某一天，与执行时刻不是一回事**"
        startedAt: 
          type: "string"
          description: "开始时刻"
        finishedAt: 
          type: 
            - "string"
            - "null"
          description: "结束时刻。空 = 还没回（可能仍在跑，也可能超时了）"
        durationMs: 
          type: 
            - "number"
            - "null"
          description: "耗时（毫秒）"
        status: 
          "$ref": "#/definitions/JobStatus"
          description: "这一轮的结局"
        detail: 
          type: 
            - "string"
            - "null"
          description: "业务写的一句人话：「关闭 12 单，释放库存 34 件」"
        error: 
          type: 
            - "string"
            - "null"
          description: "错误信息。**与 detail 分开**：detail 是业务说的话，这里是异常"
        workerInstance: 
          type: 
            - "string"
            - "null"
          description: "哪个实例跑的。**多实例抢锁时排障靠它** —— 只有一台在跑不等于只有一台部署"
        httpStatus: 
          type: 
            - "number"
            - "null"
          description: "调用业务系统时的 HTTP 状态。UNREACHABLE 时看它区分「没连上」与「连上了但报错」"
      required: 
        - "runId"
        - "jobName"
        - "triggerType"
        - "bizDate"
        - "startedAt"
        - "finishedAt"
        - "durationMs"
        - "status"
        - "detail"
        - "error"
        - "workerInstance"
        - "httpStatus"
      additionalProperties: false
      description: "执行日志一行。"
    JobTriggerType: 
      type: "string"
      enum: 
        - "CRON"
        - "MANUAL"
        - "RETRY"
        - "BACKFILL"
      description: "这一轮是被什么触发的。**排障时第一个要看的就是它** —— 同一个任务，定时跑失败和人手动补跑失败，要找的人不是同一个。"
    OpsMember: 
      type: "object"
      properties: 
        memberNo: 
          type: "string"
          description: "会员号（某商家下的一条会员关系）"
        personNo: 
          type: "string"
          description: "平台人档号。**一份人档串起几家商家的会员关系** —— 跨商家查同一个人靠它"
        phoneTail: 
          type: 
            - "string"
            - "null"
          description: "手机号后四位。**只有后四位** —— 要完整号得走 revealMemberPhone：单独权限码、必填理由、每次留痕"
        entityNo: 
          type: "string"
          description: "所属商家"
        entityName: 
          type: "string"
          description: "商家名"
        status: 
          type: "string"
          description: "状态"
        source: 
          type: "string"
          description: "这个会员是怎么来的"
        level: 
          type: 
            - "string"
            - "null"
          description: "会员等级。空 = 商家没开分层"
        orderCount: 
          type: "number"
          description: "累计下单数"
        totalSpentMinor: 
          type: "number"
          description: "累计消费（分）"
        reachOptOut: 
          type: "boolean"
          description: "已退订。**退订的人不进任何受众** —— 运营排查「怎么没收到」第一个看它"
        joinedAt: 
          type: "number"
          description: "成为会员的时刻"
      required: 
        - "memberNo"
        - "personNo"
        - "phoneTail"
        - "entityNo"
        - "entityName"
        - "status"
        - "source"
        - "level"
        - "orderCount"
        - "totalSpentMinor"
        - "reachOptOut"
        - "joinedAt"
      additionalProperties: false
      description: "运营侧看到的一条会员（P8）。"
    OpsPerson: 
      type: "object"
      properties: 
        personNo: 
          type: "string"
          description: "平台人档号"
        phoneTail: 
          type: 
            - "string"
            - "null"
          description: "手机号后四位。**永远不给完整号**"
        userNo: 
          type: 
            - "string"
            - "null"
          description: "用户号"
        memberships: 
          type: "array"
          items: 
            "$ref": "#/definitions/OpsMember"
          description: "他在各商家的会员关系。**一份人档串起几家** —— 这正是人档存在的理由"
        merges: 
          type: "array"
          items: 
            type: "string"
          description: "合并过的人档号。合并不可逆，留痕是唯一的回溯手段"
      required: 
        - "personNo"
        - "phoneTail"
        - "userNo"
        - "memberships"
        - "merges"
      additionalProperties: false
      description: "人档：一份人档串起几家商家的会员关系 —— 这正是它存在的理由"
    ReachStat: 
      type: "object"
      properties: 
        entityNo: 
          type: "string"
          description: "所属商家"
        entityName: 
          type: "string"
          description: "商家名"
        sent: 
          type: "number"
          description: "发出多少条"
        members: 
          type: "number"
          description: "覆盖多少会员"
        optOut: 
          type: "number"
          description: "其中退订多少人"
        optOutRate: 
          type: "number"
          description: "退订率。**这条线唯一的健康指标** —— 发得多不是成绩，发到有人关掉才是问题"
      required: 
        - "entityNo"
        - "entityName"
        - "sent"
        - "members"
        - "optOut"
        - "optOutRate"
      additionalProperties: false
      description: "触达健康度。"
    OpsPromoCoupon: 
      type: "object"
      properties: 
        couponNo: 
          type: "string"
          description: "券模板号"
        entityNo: 
          type: "string"
          description: "所属商家"
        entityName: 
          type: "string"
          description: "商家名"
        title: 
          type: "string"
          description: "券名"
        benefitMode: 
          type: "string"
          description: "`CASH` 减固定金额 / `PERCENT` 打折 / `GIFT` 换赠品 / `TIMES` 次卡"
        benefitValue: 
          type: "number"
          description: "优惠力度。含义**跟着 benefitMode 变**：CASH 是分、PERCENT 是万分比、TIMES 是次数"
        benefitCapMinor: 
          type: 
            - "number"
            - "null"
          description: "折扣券封顶（分）。空 = 不封顶 —— 与 UNLIMITED 一起出现时敞口无上限"
        totalCount: 
          type: 
            - "number"
            - "null"
          description: "总发行量。空 = 不限量"
        receivedCount: 
          type: "number"
          description: "已领取数"
        budgetMinor: 
          type: 
            - "number"
            - "null"
          description: "预算上限（分）。空 = 不限"
        maxExposureMinor: 
          type: 
            - "number"
            - "null"
          description: "最大敞口 = 限量 × 单张优惠。**这一页真正要看的数** —— 不限量时它算不出来"
        status: 
          type: "string"
          description: "状态"
        flags: 
          type: "array"
          items: 
            type: "string"
          description: "风险标记。商家自己看不出来 —— 他只看得到他那一张，跨商家排在一起才看得见"
      required: 
        - "couponNo"
        - "entityNo"
        - "entityName"
        - "title"
        - "benefitMode"
        - "benefitValue"
        - "benefitCapMinor"
        - "totalCount"
        - "receivedCount"
        - "budgetMinor"
        - "maxExposureMinor"
        - "status"
        - "flags"
      additionalProperties: false
      description: "运营看到的一张券（新模型）。"
    OpsPromoActivity: 
      type: "object"
      properties: 
        activityNo: 
          type: "string"
          description: "活动号"
        entityNo: 
          type: "string"
          description: "所属商家"
        entityName: 
          type: "string"
          description: "商家名"
        name: 
          type: "string"
          description: "活动名"
        triggerType: 
          type: "string"
          description: "触发条件：满额 / 满件 / 命中商品 / 无条件"
        benefitType: 
          type: "string"
          description: "优惠方式：减钱 / 改单价 / 送商品 / 发券"
        scheduleType: 
          type: "string"
          description: "排期：短期 / 长期 / 周期"
        quota: 
          type: 
            - "number"
            - "null"
          description: "限量。空 = 不限量"
        quotaUsed: 
          type: "number"
          description: "已用掉的限量"
        budgetMinor: 
          type: 
            - "number"
            - "null"
          description: "预算上限（分）。空 = 不限"
        budgetUsedMinor: 
          type: "number"
          description: "已花掉的预算（分）"
        audienceCount: 
          type: "number"
          description: "定向人数。**0 表示对所有人生效**，不是「谁也不发」"
        status: 
          type: "string"
          description: "状态"
        endedReason: 
          type: 
            - "string"
            - "null"
          description: "为什么停的：到期 / 限量用尽 / 预算用尽 / 人工停。商家问「怎么停了」要有答案"
        flags: 
          type: "array"
          items: 
            type: "string"
          description: "风险标记。商家自己看不出来 —— 他只看得到他那一张，跨商家排在一起才看得见"
      required: 
        - "activityNo"
        - "entityNo"
        - "entityName"
        - "name"
        - "triggerType"
        - "benefitType"
        - "scheduleType"
        - "quota"
        - "quotaUsed"
        - "budgetMinor"
        - "budgetUsedMinor"
        - "audienceCount"
        - "status"
        - "endedReason"
        - "flags"
      additionalProperties: false
      description: "运营看到的一场活动（新模型）。`audienceCount === 0` 表示对所有人生效"
