          description: "标题"
        titleI18n: 
          "$ref": "#/definitions/Record%3Cstring%2Cstring%3E"
          description: "标题的多语言版本"
        subtitle: 
          type: "string"
          description: "副标题"
        cover: 
          type: "string"
          description: "封面图"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "图集"
        specGroups: 
