        - "credentialId"
        - "appKey"
        - "name"
        - "scopes"
        - "status"
      additionalProperties: false
      description: "一把开放对接的钥匙。**没有 secret 字段，一个都没有。**\n\n库里存的是哈希，明文只在签发那一刻的响应里出现一次。列表若带上它， 会让人以为丢了还能回来找 —— 而实际上只能吊销重发。"
    InvCredentialIssued: 
      type: "object"
      properties: 
        credentialId: 
          type: "string"
          description: "凭据号"
        appKey: 
          type: "string"
          description: "开放接口的调用方标识"
        appSecret: 
          type: "string"
          description: "密钥。**只在签发那一次返回**，之后取不回来"
      required: 
