          type: "string"
          description: "黑名单单号"
        subjectType: 
          "$ref": "#/definitions/SubjectType"
          description: "主体类型"
        subject: 
          type: "string"
          description: "主体标识：用户昵称 / 商家名 / 设备号"
        reason: 
          type: "string"
          description: "拉黑原因，必填"
        until: 
