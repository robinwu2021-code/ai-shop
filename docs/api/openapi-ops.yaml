        entityNo: 
          type: "string"
          description: "哪家商家的票"
        merchantName: 
          type: "string"
          description: "商家名"
        storeNo: 
          type: "string"
          description: "门店号"
        itemId: 
          type: "string"
          description: "物料号（进销存自己的编号）"
        itemName: 
          type: "string"
          description: "货品名"
        specText: 
          type: "string"
          description: "规格描述。人读的，不参与匹配"
        onHand: 
          type: "number"
          description: "实存"
        reserved: 
          type: "number"
          description: "预留：下了单还没付钱的量"
        available: 
          type: "number"
          description: "可用 = 实存 − 预留"
        idleDays: 
          type: "number"
