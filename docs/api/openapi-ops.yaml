                  type: "number"
              required: 
                - "scanned"
                - "resolved"
                - "opened"
                - "deferred"
              additionalProperties: false
            - type: "null"
          description: "结论"
        coverage: 
          type: "object"
          properties: 
            complete: 
              type: "boolean"
            note: 
              type: "string"
          required: 
            - "complete"
            - "note"
          additionalProperties: false
          description: "覆盖率"
        error: 
          type: 
            - "string"
            - "null"
          description: "错误信息"
      required: 
        - "axis"
        - "coverage"
      additionalProperties: false
      description: "一条对账轴的一轮结果。\n\n⚠️ **`coverage.note` 必须显示** —— 四条轴今天都只有 A 侧（我方自查）， 渠道账单、分账查询、银行流水三种外部数据都还没接。 不说的话，「今天没有差异」对四条轴都是假话。\n\n`error` 非空 = **这条轴今天没跑成**。它与「零差异」在页面上长得一样、 含义却完全相反，所以要单独标出来。"
    PayChannelRateVersion: 
