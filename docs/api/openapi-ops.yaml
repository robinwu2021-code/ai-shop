        - "period"
        - "invoiceCode"
        - "invoiceNumber"
        - "invoiceType"
        - "titleName"
        - "titleTaxNo"
        - "amountMinor"
        - "taxAmountMinor"
        - "taxRate"
        - "status"
        - "titleMatched"
        - "settleNos"
      additionalProperties: false
      description: "进项票（供应商开给平台的）。自营链路专用 —— **票到才付款**。\n\n`titleMatched` 是后端算好的：抬头与主体名对不上时不给核验通过， 而这一条**在界面上必须显示原因** —— 财务看到「不能核验」而不知道为什么， 只会去问开票的人，而对方也不知道。"
    BuyerInvoiceRequest: 
      type: "object"
      properties: 
        requestNo: 
          type: "string"
          description: "开票申请号"
        orderNo: 
          type: "string"
          description: "针对哪一单"
        titleType: 
          type: "string"
          description: "PERSONAL / COMPANY"
        title: 
          type: "string"
          description: "抬头"
        taxNo: 
          type: 
            - "string"
            - "null"
          description: "税号。单位抬头必填"
        email: 
          type: 
            - "string"
            - "null"
          description: "发到哪个邮箱。电子票唯一的交付方式"
        amountMinor: 
          type: "number"
          description: "价税合计（分）"
        status: 
          type: "string"
          description: "PENDING / ISSUED / REJECTED"
        invoiceNo: 
          type: 
            - "string"
            - "null"
          description: "已开出的发票号"
        issuedAt: 
          type: 
            - "number"
            - "null"
          description: "开出来的时刻。空 = 还没开"
        rejectReason: 
          type: 
            - "string"
            - "null"
          description: "驳回原因。**要原样回商家** —— 只说「不通过」他不知道该补什么"
        createdAt: 
          type: 
            - "number"
            - "null"
          description: "申请时刻"
      required: 
        - "requestNo"
        - "orderNo"
        - "titleType"
        - "title"
        - "amountMinor"
        - "status"
      additionalProperties: false
      description: "买家的开票申请（`/ops/invoice-requests`）。\n\n⚠️ **这个域里有三张不同的「票」，名字很近，别混：**\n\n| 类型 | 谁开给谁 | 决定什么 | 端点 | |---|---|---|---| |  {@link  PurchaseInvoice }  进项票 | 供应商 → 平台 | 平台能不能付款（票到付款）| `/ops/purchase-invoices` | |  {@link  InvoiceRequest }  商家开票申请 | 平台 → 商家 | 商家的服务费发票 | `/ops/finance/invoices` | | 本类型 买家开票申请 | 平台 → 买家 | 买家能不能报销 | `/ops/invoice-requests` |\n\n前两个此前已有类型，本类型是补的 —— 它按订单走（`orderNo`），前两个按主体/账期走。"
    ReconCoverage: 
      type: "object"
      properties: 
        channelBillConnected: 
          type: "boolean"
