        - "enabled"
        - "markets"
        - "currency"
        - "settleCycle"
        - "supportsSubsidy"
        - "currentRate"
        - "rates"
      additionalProperties: false
      description: "一个支付通道的设置与费率。"
    SettleBatch: 
      type: "object"
