        - "scene"
        - "audience"
        - "channel"
        - "enabled"
        - "pushLevel"
        - "locked"
      additionalProperties: false
      description: "场景 × 受众 × 通道 的一格（P-14.1）。\n\n<p>「哪个事件走哪些通道」以前**硬编码在编排里** —— 后端把它做成了可配置， 而运营端此前没有入口，于是这份配置存在、能改，却没人看得见。"
    NotifyChannelRow: 
      type: "object"
