        slotNo: 
          type: "string"
          description: "内容位单号"
        title: 
          type: "string"
          description: "内容位标题"
        kind: 
          "$ref": "#/definitions/SlotKind"
          description: "内容位形态：首页楼层 / 轮播 / 频道"
        sort: 
