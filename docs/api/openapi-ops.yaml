          description: "票面抬头"
        titleTaxNo: 
          type: "string"
          description: "票面税号"
        amountMinor: 
          type: "number"
          description: "价税合计（分）"
        taxAmountMinor: 
          type: "number"
          description: "其中税额（分）"
        taxRate: 
          type: "number"
          description: "万分比"
        invoiceDate: 
          type: 
            - "number"
            - "null"
          description: "开票日期"
        imageUrl: 
          type: 
            - "string"
            - "null"
          description: "票面影像。核验要看原件"
        status: 
          type: "string"
          description: "PENDING / SUBMITTED / VERIFIED / REJECTED"
        rejectReason: 
          type: 
            - "string"
            - "null"
          description: "驳回原因。**要原样回商家** —— 只说「不通过」他不知道该补什么"
        titleMatched: 
          type: "boolean"
          description: "抬头与主体名是否一致。**后端算，端上不重算** —— 两处判会走岔"
        settleNos: 
          type: "array"
          items: 
            type: "string"
          description: "这张票覆盖了哪些结算单"
      required: 
