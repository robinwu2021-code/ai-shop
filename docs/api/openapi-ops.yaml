        categoryNo: 
          type: "string"
          description: "类目号"
        categoryName: 
          type: "string"
          description: "类目名"
        parentName: 
          type: "string"
          description: "一级类目名，用来分组"
        categoryType: 
          anyOf: 
            - "$ref": "#/definitions/CategoryTemplate"
            - type: "null"
