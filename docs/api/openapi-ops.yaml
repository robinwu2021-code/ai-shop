        createdAt: 
          type: "number"
          description: "指令时刻（毫秒）"
      required: 
        - "settleNo"
        - "subOrderNo"
        - "splitAction"
        - "amountMinor"
        - "result"
        - "requestNo"
        - "createdAt"
      additionalProperties: false
      description: "分账指令流水（后端 `stl_split_log`）。\n\n<b>结算单说的是「该给多少」，这里说的是「发了几条指令、成没成、失败在哪」</b>—— 出问题时要看的是后者。失败的记录也在这里。"
    SplitRecord: 
      type: "object"
      properties: 
        splitNo: 
          type: "string"
          description: "分账明细单号"
        settleNo: 
          type: "string"
          description: "所属结算单"
        orderNo: 
          type: "string"
          description: "对应的子订单。**一条明细 = 一个子订单**"
        merchantName: 
          type: "string"
          description: "商家名快照"
        trafficSource: 
          "$ref": "#/definitions/TrafficSource"
          description: "该订单的流量来源，决定适用哪一档费率（R16）"
        grossAmount: 
          type: "number"
          description: "该订单实付金额（分）"
        feeRate: 
          type: "number"
          description: "本条实际适用的平台佣金费率（万分比），来自费率表"
        platformFee: 
          type: "number"
          description: "本条的平台佣金（分）"
        pickupNo: 
          type: "string"
          description: "履约自提点。非自提单为空"
        serviceFee: 
          type: "number"
          description: "自提点履约服务费（分）；非自提单为 0"
        netAmount: 
          type: "number"
          description: "实付商家（分）。**恒等式**：grossAmount = platformFee + serviceFee + netAmount"
      required: 
        - "splitNo"
        - "settleNo"
        - "orderNo"
        - "merchantName"
        - "trafficSource"
        - "grossAmount"
        - "feeRate"
        - "platformFee"
        - "serviceFee"
        - "netAmount"
      additionalProperties: false
      description: "分账明细：一条 = 一个子订单。费率按 trafficSource 分档（R16）。"
    FeeTrafficSource: 
      type: "string"
      enum: 
        - "MERCHANT_OWNED"
        - "PLATFORM"
      description: "费率适用的流量来源。\n\n**只有两档**，比订单上的 `TrafficSource`（还有 INVITE / CHANNEL）窄 —— 后端的费率表只认这两个。写成独立类型而不是在接口里内联字面量联合， 是因为内联的枚举不会被登记表扫到，等于绕过了枚举雷达（规范 §D5）。"
    FeeRuleVersion: 
      type: "object"
      properties: 
        ruleNo: 
          type: "string"
          description: "规则版本号"
        businessMode: 
          "$ref": "#/definitions/BusinessMode"
          description: "经营模式，费率的第一个维度"
        trafficSource: 
          "$ref": "#/definitions/FeeTrafficSource"
          description: "适用的流量来源，费率的第二个维度"
        rateBp: 
          type: "number"
          description: "万分比。500 = 5%"
        effectiveFrom: 
          type: "number"
          description: "生效时刻（毫秒）。**填未来时刻 = 预约生效**"
        enabled: 
          type: "number"
          description: "1 = 该版本生效；0 = 已停用（回退到上一版）"
        remark: 
          type: 
            - "string"
            - "null"
          description: "为什么调这一次 —— 回查时这句话比数字更有用"
        createdAt: 
          type: "string"
          description: "创建时间"
        createdBy: 
          type: "string"
          description: "创建人"
      required: 
        - "ruleNo"
        - "businessMode"
        - "trafficSource"
        - "rateBp"
        - "effectiveFrom"
        - "enabled"
      additionalProperties: false
      description: "费率的一个版本（后端 `stl_fee_rule`）。\n\n⚠️ 这里与旧的 `FeeRule` 形状完全不同，是有意的。旧那个是一维（只按流量来源）、 单值、原地改；**后端从未实现过它**（守卫清单里 `fee-rule` 一直挂在「整域未开工」）。 真正落地的是二维 + 版本化：\n\n- **二维**：经营模式 × 流量来源。两者正交 —— 只按经营模式分档，   等哪天想给自营也区分客流就要改表结构，而费率表最不该改结构（历史行要一直可读）。\n- **版本化**：调费率是**插新版本**，旧版本永久保留。原地改只能回答「现在是多少」，   而真正会被问到的是「上个月那批单当时按什么费率算的」。"
    EffectiveFeeRates: 
      "$ref": "#/definitions/Record%3Cstring%2Cnumber%3E"
      description: "某时刻实际生效的费率表，键为 `${businessMode}|${trafficSource}`。"
    "Record<string,number>": 
