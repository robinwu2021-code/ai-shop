          type: "string"
          description: "被拉黑者提交的申诉理由"
        appealVerdict: 
          type: "string"
          description: "申诉裁决说明"
        active: 
          type: "boolean"
          description: "是否生效中。到期或申诉通过后置 false，记录保留"
        createdAt: 
          type: "string"
          description: "拉黑时间"
      required: 
        - "blackNo"
        - "subjectType"
        - "subject"
        - "reason"
        - "until"
        - "appealStatus"
        - "active"
        - "createdAt"
      additionalProperties: false
    RiskRule: 
      type: "object"
      properties: 
        type: 
          "$ref": "#/definitions/RiskType"
          description: "适用的风险类型，一类一条"
        threshold: 
          type: "number"
          description: "触发阈值（如同设备下单数、同 IP 邀请数、30 天退款次数），必须 > 0"
        autoBlock: 
          type: "boolean"
          description: "命中后是否自动拦截；false = 只记事件等人工"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
      required: 
        - "type"
        - "threshold"
        - "autoBlock"
        - "updatedAt"
      additionalProperties: false
      description: "拦截规则（P-16.2.5）：各类型的触发阈值 + 是否自动拦截。"
    MsgChannel: 
      type: "string"
      enum: 
        - "SUBSCRIBE"
        - "PUSH"
        - "INBOX"
    PushStatus: 
      type: "string"
      enum: 
        - "DRAFT"
        - "SCHEDULED"
        - "SENT"
        - "CANCELLED"
    MsgTemplate: 
      type: "object"
      properties: 
        templateNo: 
          type: "string"
          description: "模板单号"
        name: 
          type: "string"
          description: "模板名"
        channel: 
          "$ref": "#/definitions/MsgChannel"
          description: "触达渠道：订阅消息 / App 推送 / 站内信"
        content: 
          type: "string"
          description: "模板正文，含 {占位符}"
        enabled: 
          type: "boolean"
          description: "是否启用。停用后引用它的推送任务发不出去"
        sentCount: 
          type: "number"
          description: "近 30 天发送量"
      required: 
        - "templateNo"
        - "name"
        - "channel"
        - "content"
        - "enabled"
        - "sentCount"
      additionalProperties: false
      description: "订阅消息模板（P-14.1.1）。"
    PushTask: 
      type: "object"
      properties: 
        taskNo: 
          type: "string"
          description: "任务单号"
        name: 
          type: "string"
          description: "任务名"
        templateNo: 
          type: "string"
          description: "使用的消息模板"
        audience: 
          type: "string"
          description: "人群描述，如「近 7 日未下单的老客」"
        estimatedReach: 
          type: "number"
          description: "预估触达数。为 0 说明人群是空的，发了等于白发"
        status: 
          "$ref": "#/definitions/PushStatus"
          description: "任务状态"
        scheduledAt: 
          type: "string"
          description: "计划发送时间。`status=SCHEDULED` 时有值"
        createdAt: 
          type: "string"
          description: "创建时间"
      required: 
        - "taskNo"
        - "name"
        - "templateNo"
        - "audience"
        - "estimatedReach"
        - "status"
        - "createdAt"
      additionalProperties: false
      description: "推送任务（P-14.1.2）。"
    NotifyQuota: 
      type: "object"
      properties: 
        dailyPerUser: 
          type: "number"
          description: "单用户单日消息上限"
        minIntervalHours: 
          type: "number"
          description: "同一模板对同一用户的最小间隔（小时）"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "dailyPerUser"
        - "minIntervalHours"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "触达频控（P-14.1.4）。 两个上限都必须 > 0 —— 0 等于没有频控，但界面上看着像配了，比不配更危险。"
    TicketStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "ASSIGNED"
        - "RESOLVED"
        - "CLOSED"
    Ticket: 
      type: "object"
      properties: 
        ticketNo: 
          type: "string"
          description: "工单号"
        title: 
          type: "string"
          description: "工单标题"
        userNickname: 
          type: "string"
          description: "提单用户昵称"
        orderNo: 
          type: "string"
          description: "关联订单，可空"
        status: 
          "$ref": "#/definitions/TicketStatus"
          description: "工单状态。允许的流转见 `TICKET_TRANSITIONS`"
        assignee: 
          type: "string"
          description: "处理人（员工登录名）；未分派为空"
        proxyActions: 
          type: "array"
          items: 
            type: "string"
          description: "代客操作留痕（P-14.2.3）：谁、对什么、做了什么"
        createdAt: 
          type: "string"
          description: "提单时间"
        reply: 
          type: "string"
          description: "客服回复正文。**用户在 C 端工单详情页看的就是这个字段**。\n\n此前它在三层上各缺一处：后端 `msg_ticket` 建表就留了 `reply`/`replied_at`/`replied_by` 且注释写明「代客操作要能追到人」，但没有任何代码写过它们； 契约里也从没定义过「回复」这个动作（只有分派、关闭、代客留痕）。 于是用户提单后反复点开详情，看到的永远是空的，而且不报任何错。"
        repliedAt: 
          type: "string"
          description: "回复时间；未回复为空"
        repliedBy: 
          type: "string"
          description: "回复人（员工登录名）。回复署的是平台的名，必须能追到人"
      required: 
        - "ticketNo"
        - "title"
        - "userNickname"
        - "status"
        - "proxyActions"
        - "createdAt"
      additionalProperties: false
      description: "客服工单（P-14.2.1）。"
    FaqEntry: 
      type: "object"
      properties: 
        faqNo: 
          type: "string"
          description: "条目单号"
        question: 
          type: "string"
          description: "问题"
        answer: 
          type: "string"
          description: "答案正文"
        category: 
          type: "string"
          description: "所属分类，用于帮助中心分组"
        published: 
          type: "boolean"
          description: "是否已发布。未发布的用户看不到"
        views: 
          type: "number"
          description: "浏览量，用来发现「大家其实在问什么」"
      required: 
        - "faqNo"
        - "question"
        - "answer"
        - "category"
        - "published"
        - "views"
      additionalProperties: false
      description: "帮助中心条目（P-14.2.4）。"
    MaterialKind: 
      type: "string"
      enum: 
        - "COPY"
        - "IMAGE"
        - "POSTER"
        - "VIDEO"
    MaterialScope: 
      type: "string"
      enum: 
        - "ALL"
        - "COMMUNITY"
        - "MERCHANT"
      description: "可见范围（P-15.1.3 / 15.1.4）：一份素材投给谁，和素材本身是一件事。"
    Material: 
      type: "object"
      properties: 
        materialNo: 
          type: "string"
          description: "素材单号"
        title: 
          type: "string"
          description: "素材标题，供商家在素材中心检索"
        kind: 
          "$ref": "#/definitions/MaterialKind"
          description: "素材形态"
        content: 
          type: "string"
          description: "文案正文 / 图片或视频 URL（mock 阶段是 URL 字段，接后端换对象存储）"
        scope: 
          "$ref": "#/definitions/MaterialScope"
          description: "可见范围。**投给谁和素材本身是一件事**"
        scopeRefs: 
          type: "array"
          items: 
            type: "string"
          description: "scope=COMMUNITY 时的社区列表；=MERCHANT 时的商家列表。ALL 时为空"
        langs: 
          type: "array"
          items: 
            type: "string"
          description: "适用语言，空 = 不限"
        published: 
          type: "boolean"
          description: "是否已发布。未发布的素材商家看不到"
        downloads: 
          type: "number"
          description: "被下载次数，衡量素材有没有人用"
        createdAt: 
          type: "string"
          description: "创建时间"
      required: 
        - "materialNo"
        - "title"
        - "kind"
        - "content"
        - "scope"
        - "scopeRefs"
        - "langs"
        - "published"
        - "downloads"
        - "createdAt"
      additionalProperties: false
    PostAuthorType: 
      type: "string"
      enum: 
        - "USER"
        - "MERCHANT"
    PostStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "PASSED"
        - "REJECTED"
        - "OFFLINE"
      description: "种草内容状态。\n\n⚠️ `PASSED → OFFLINE` 是**单独一条路**，而不是\"改回待审\"： 内容已经露出过、被人看过、可能已经被引用，把它退回待审等于假装没发生过。 下架同样要写原因。"
    Post: 
      type: "object"
      properties: 
        postNo: 
          type: "string"
          description: "内容单号"
        authorType: 
          "$ref": "#/definitions/PostAuthorType"
          description: "作者类型：普通用户 or 商家。商家发的内容审核标准更严"
        authorName: 
          type: "string"
          description: "作者昵称/店名"
        title: 
          type: "string"
          description: "内容标题"
        content: 
          type: "string"
          description: "正文"
        communityNo: 
          type: "string"
          description: "归属社区。内容只在本社区露出"
        communityName: 
          type: "string"
          description: "社区名快照"
        skuNo: 
          type: 
            - "string"
            - "null"
          description: "关联商品；纯分享贴可以没有"
        riskHits: 
          type: "array"
          items: 
            type: "string"
          description: "命中的风险词。 ⚠️ 命中的内容**不进批量通过** —— 批量 + 风险内容 = 事故，必须逐条看。"
        status: 
          "$ref": "#/definitions/PostStatus"
          description: "审核状态。允许的流转见 `POST_TRANSITIONS`（`PASSED → OFFLINE` 是单独一条路）"
        auditRemark: 
          type: 
            - "string"
            - "null"
          description: "审核意见 / 下架原因。原样回作者"
        likeCount: 
          type: "number"
          description: "点赞数"
        createdAt: 
          type: "string"
          description: "发布时间"
        decidedAt: 
          type: 
            - "string"
            - "null"
          description: "审核完成时间。未审为 null"
        decidedBy: 
          type: 
            - "string"
            - "null"
          description: "审核人（STAFF 账号）。未审为 null"
      required: 
        - "postNo"
        - "authorType"
        - "authorName"
        - "title"
        - "content"
        - "communityNo"
        - "communityName"
        - "riskHits"
        - "status"
        - "likeCount"
        - "createdAt"
      additionalProperties: false
    RankingKind: 
      type: "string"
      enum: 
        - "SALES"
        - "RATING"
        - "NEW"
        - "MANUAL"
      description: "榜单口径。\n\n`MANUAL` 与其余三类是两种东西：前三类由数据算出来，`MANUAL` 由人指定。 混在一个结构里但**校验路径完全不同** —— 算出来的榜带 `manualSkus` 就是调用方理解错了。"
    Ranking: 
      type: "object"
      properties: 
        rankNo: 
          type: "string"
          description: "榜单单号"
        name: 
          type: "string"
          description: "榜单名，如「本周热销」"
        kind: 
          "$ref": "#/definitions/RankingKind"
          description: "榜单口径。**`MANUAL` 与其余三类校验路径完全不同**"
        size: 
          type: "number"
          description: "取前 N 名"
        manualSkus: 
          type: "array"
          items: 
            type: "string"
          description: "仅 MANUAL：人工指定的商品，顺序即榜位"
        enabled: 
          type: "boolean"
          description: "是否启用。停用后 C 端不再展示该榜"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "rankNo"
        - "name"
        - "kind"
        - "size"
        - "manualSkus"
        - "enabled"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
    QuestionStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "ANSWERED"
        - "OFFLINE"
    Question: 
      type: "object"
      properties: 
        questionNo: 
          type: "string"
          description: "提问单号"
        skuNo: 
          type: "string"
          description: "被提问的商品"
        skuTitle: 
          type: "string"
          description: "商品标题快照"
        content: 
          type: "string"
          description: "提问正文"
        askedBy: 
          type: "string"
          description: "提问人昵称"
        answer: 
          type: 
            - "string"
            - "null"
          description: "回答正文。未回答为 null"
        answeredBy: 
          type: 
            - "string"
            - "null"
          description: "回答人（STAFF 或商家）。未回答为 null"
        answeredAt: 
          type: 
            - "string"
            - "null"
          description: "回答时间。未回答为 null"
        status: 
          "$ref": "#/definitions/QuestionStatus"
          description: "问答状态"
        createdAt: 
          type: "string"
          description: "提问时间"
        hideReason: 
          type: 
            - "string"
            - "null"
          description: "隐藏原因。隐藏也要写清为什么，否则用户来问时没人说得清"
      required: 
        - "questionNo"
        - "skuNo"
        - "skuTitle"
        - "content"
        - "askedBy"
        - "status"
        - "createdAt"
      additionalProperties: false
    AppearanceConfig: 
      type: "object"
      properties: 
        defaultSkin: 
          "$ref": "#/definitions/ThemeKey"
          description: "C 端默认皮肤下发（C-TH-05）。取值必须是 `C_END_THEMES` 之一（不含运营端专有的 business），与 packages/shared 的 SKINS 同源"
        festivalSkin: 
          "$ref": "#/definitions/ThemeKey"
          description: "节日皮肤：留空表示不启用"
        festivalFrom: 
          type: "string"
          description: "节日皮肤生效开始时间。启用节日皮肤时必填"
        festivalTo: 
          type: "string"
          description: "节日皮肤生效结束时间"
        fallbackLang: 
          type: "string"
          description: "语言回落规则（R9）：缺译时回落到哪个语言"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "defaultSkin"
        - "fallbackLang"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "全局外观与语言（P-17.1.1 / 17.1.2）。"
    ThemeKey: 
      type: "string"
      enum: 
        - "mono"
        - "business"
        - "fresh"
        - "promo"
        - "blue"
    MarketConfig: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "市场编码，如 `CN` / `SG`"
        name: 
          type: "string"
          description: "市场展示名"
        currency: 
          type: "string"
          description: "结算与展示货币，如 `CNY`"
        timezone: 
          type: "string"
          description: "时区标识，如 `Asia/Shanghai`。截单时间按它切分自然日"
        rate: 
          type: "number"
          description: "对基准货币的汇率。 ⚠️ 基准货币（CNY）恒为 1 且**不可改** —— 改了整套价格换算的原点就没了。"
        enabled: 
          type: "boolean"
          description: "是否开放该市场。关掉后该市场的商品不再售卖"
      required: 
        - "code"
        - "name"
        - "currency"
        - "timezone"
        - "rate"
        - "enabled"
      additionalProperties: false
      description: "市场与货币（P-17.1.3）。"
    RuleTexts: 
      type: "object"
      properties: 
        refund: 
          type: "string"
          description: "退款规则文案，C 端售后页展示"
        pickup: 
          type: "string"
          description: "自提规则文案，C 端下单与取货页展示"
        weighDiff: 
          type: "string"
          description: "称重差价规则文案，生鲜订单展示"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
        updatedBy: 
          type: "string"
          description: "最后修改人（STAFF 账号）"
      required: 
        - "refund"
        - "pickup"
        - "weighDiff"
        - "updatedAt"
        - "updatedBy"
      additionalProperties: false
      description: "规则文案（P-17.1.4）。这三条是 C 端要展示给用户看的，不能为空。"
    FeatureFlag: 
      type: "object"
      properties: 
        key: 
          type: "string"
          description: "开关标识，代码里读的就是它"
        name: 
          type: "string"
          description: "开关展示名"
        enabled: 
          type: "boolean"
          description: "总开关。关掉时 `rolloutPercent` 不生效"
        rolloutPercent: 
          type: "number"
          description: "灰度比例 0–100"
        updatedAt: 
          type: "string"
          description: "最后修改时间"
      required: 
        - "key"
        - "name"
        - "enabled"
        - "rolloutPercent"
        - "updatedAt"
      additionalProperties: false
      description: "开关与灰度（P-17.1.5）。"
    Industry: 
      type: "object"
      properties: 
        industry: 
          type: "string"
          description: "行业码，入驻申请回传的就是它"
        name: 
          type: "string"
          description: "展示名。三端都取服务端的，不各自维护翻译"
        sort: 
          type: "number"
          description: "排序"
        enabled: 
          type: "boolean"
          description: "是否启用。关掉后入驻表单里不再出现这个行业"
        wechatMicroAllowed: 
          type: "boolean"
          description: "微信是否允许该行业以小微进件"
        alipayMicroAllowed: 
          type: "boolean"
          description: "支付宝是否允许"
        pointsForced: 
          type: "boolean"
          description: "是否**强制开启积分**（商家不可自行关闭）。 它是 `mch_entity.points_forced` 的来源 —— 高毛利行业平台会要求让利。"
        remark: 
          type: "string"
          description: "备注：为什么这么配。改白名单是会被商家追问的操作"
      required: 
        - "industry"
        - "name"
        - "sort"
        - "enabled"
        - "wechatMicroAllowed"
        - "alipayMicroAllowed"
        - "pointsForced"
      additionalProperties: false
      description: "行业主数据（后端 `sys_industry`）。**已接真后端。**\n\n<p>它不是一张普通的字典表：**行业决定商家能不能以小微主体进件** —— 微信的小微白名单按行业给，判错一次商家就是进件被拒，而那时他已经开完店、上完架。"
security: 
  - bearerAuth: []
paths: 
  "/ops/after-sales": 
    get: 
      operationId: "listAfterSales"
      summary: "listAfterSales"
      tags: 
        - "aftersale"
      responses: 
        "200": 
          description: "成功"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    type: "object"
                    properties: 
                      records: 
                        type: "array"
                        items: 
                          "$ref": "#/components/schemas/AfterSale"
                      total: 
                        type: "integer"
                      page: 
                        type: "integer"
                      size: 
                        type: "integer"
                    required: 
                      - "records"
                      - "total"
                      - "page"
                      - "size"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      description: "查询参数见 lib/api/query.ts 中对应的 *Q 类型。"
  "/ops/after-sales/{no}/status": 
    post: 
      operationId: "setAfterSaleStatus"
      summary: "状态推进，非法迁移抛错（驳回不是终点，用户可上升平台）"
      tags: 
        - "aftersale"
      responses: 
        "200": 
          description: "成功"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/AfterSale"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      parameters: 
        - name: "no"
          in: "path"
          required: true
          schema: 
          type: "string"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              type: "object"
        description: "请求体字段见对应契约方法的入参。"
  "/ops/after-sales/{asNo}/decide": 
    post: 
      operationId: "decideAfterSale"
      summary: "平台介入裁决（P-6.1.3 + 6.1.4）"
      tags: 
        - "aftersale"
      responses: 
        "200": 
          description: "成功"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
