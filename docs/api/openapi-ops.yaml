        - "entries"
      additionalProperties: false
      description: "台账一页。**后端返回的是分页对象，不是裸数组** —— `nextCursor` 由服务端给，前端不要拿「最后一行的 id」自己推： 那样在同一毫秒有多笔时会漏行，而漏的那几行不会有任何报错。"
    InvReconReport: 
      type: "object"
      properties: 
        scannedSkus: 
          type: "number"
          description: "扫了多少个 SKU"
        moved: 
          type: "number"
          description: "本轮搬动了多少条"
        skipped: 
          type: "number"
          description: "跳过多少个"
        pending: 
          type: "number"
          description: "扫到了但**还没搬**的。**它必须是 0 才准切真相源** —— 没搬的那些在进销存侧余额是 0，切过去就是「全都卖不了」。\n\n这一列原本不存在：`moveOne` 只算不写时故意不把没搬过的算成差异， `doRun` 又把它们计成既不 moved 也不 skipped，于是它们在报告里一个字都不出现， 而 `clean` 只看 diffs —— 闸门守着一个它没在看的东西。"
        clean: 
          type: "boolean"
          description: "没有差异**且**没有待搬的。两者缺一都不算干净"
        diffs: 
          type: "array"
          items: 
            "$ref": "#/definitions/InvReconDiff"
          description: "对不上的行"
      required: 
        - "scannedSkus"
        - "moved"
        - "skipped"
        - "pending"
        - "clean"
        - "diffs"
      additionalProperties: false
    InvReconDiff: 
      type: "object"
      properties: 
        entityNo: 
          type: "string"
          description: "哪家商家的票"
        storeNo: 
          type: "string"
          description: "门店号"
        skuNo: 
          type: "string"
          description: "商城侧的 SKU 号"
        platformQty: 
          type: "number"
          description: "平台侧的实存（prd_sku / prd_store_stock）"
        inventoryQty: 
          type: "number"
          description: "进销存侧的实存（inv_stock_balance）"
        platformHeld: 
          type: "number"
          description: "平台侧的预留（`locked_stock`）。\n\n**实存一样、预留不一样也是差异** —— 只比实存的话， 「已被下单占住的货」在两边对不上会被报成干净， 而切过去那些货就重新变成可售了。"
        inventoryHeld: 
          type: "number"
          description: "进销存侧的预留"
      required: 
        - "entityNo"
        - "skuNo"
        - "platformQty"
        - "inventoryQty"
        - "platformHeld"
        - "inventoryHeld"
      additionalProperties: false
    InvCredential: 
      type: "object"
      properties: 
        credentialId: 
          type: "string"
          description: "凭据号"
        appKey: 
          type: "string"
          description: "开放接口的调用方标识"
        name: 
          type: "string"
          description: "给人看的：这把钥匙给了谁"
        scopes: 
          type: "string"
          description: "逗号分隔：read / stock:sync"
        status: 
          type: "string"
          description: "ACTIVE / REVOKED。**吊销不删行** —— 「什么时候停的」要查得到"
        expiresAt: 
          type: 
            - "string"
            - "null"
          description: "空 = 不过期"
        lastUsedAt: 
          type: 
            - "string"
            - "null"
          description: "发现「这把钥匙半年没人用了」的唯一依据"
        createdAt: 
          type: 
            - "string"
            - "null"
          description: "申请时刻"
