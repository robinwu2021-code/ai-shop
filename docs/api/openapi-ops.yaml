        - "categoryName"
        - "parentName"
        - "earnMode"
        - "earnValue"
      additionalProperties: false
      description: "类目 × 积分发放规则。**平台按类目统一管理，商家不参与配置** —— 依据是实测：线上 199 件商品里，用商品级配置配了积分的是 0 件。\n\n`earnValue` 是**整数**：FIXED 存分、RATIO 存万分比（千分之一 = 10）。 不用浮点 —— 金额与比例一旦用 double，对账时的分位差没人说得清。"
    ClientPointsPolicy: 
      type: "object"
      properties: 
        earnDeny: 
          type: "array"
          items: 
            type: "string"
          description: "这些端不发放积分"
        redeemDeny: 
          type: "array"
          items: 
            type: "string"
          description: "这些端不能用积分抵扣"
        offlineRedeem: 
          type: "boolean"
          description: "当面付能不能用积分抵扣。**默认开** —— 成本本来就在商家，线下反而比线上简单"
