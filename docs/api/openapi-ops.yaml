          description: "规格维度名，如「重量」「香型」"
        options: 
          type: "array"
          items: 
            "$ref": "#/definitions/SpecTemplateOption"
          description: "选项。整体替换，不做逐项 diff"
        createdAt: 
          type: "string"
          description: "创建时刻"
