    Community: 
      type: "object"
      properties: 
        archivedAt: 
          type: 
            - "string"
            - "null"
          description: "归档时间。**软删除标记** —— 有值即视为已删除，列表默认不返回。 契约禁止 `delete*`，一律 `archive*` / `unarchive*`（工程约定 §10.6）。"
        communityNo: 
          type: "string"
          description: "社区单号。平台端数据域裁剪的主键之一"
        name: 
          type: "string"
          description: "社区名（小区名）"
        city: 
          type: "string"
