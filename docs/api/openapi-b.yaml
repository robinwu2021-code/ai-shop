        - "pickupNo"
        - "pickupName"
        - "pendingVerify"
        - "arrivedBatches"
        - "serviceFeeMinor"
      additionalProperties: false
      description: "自提点履约总览（后端 `GET /biz/pickup/overview`）。 承接方最关心的三个数：还有几单没人来取、今天到了几批、这些活挣了多少服务费。"
    RateCard: 
      type: "object"
      properties: 
        merchantOwnedRate: 
          type: "number"
          description: "自带客流费率（万分比）。商家自己带来的客人，平台抽成低"
        platformRate: 
          type: "number"
          description: "平台客流费率（万分比）。平台分发带来的订单"
        note: 
          type: "string"
          description: "费率说明文案。**须写明「以下单时快照为准，调整不影响历史订单」**"
      required: 
        - "merchantOwnedRate"
        - "platformRate"
        - "note"
