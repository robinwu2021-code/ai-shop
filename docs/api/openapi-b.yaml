      operationId: "mPointsToggle"
      summary: "开/关本店积分"
      tags: 
        - "points"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/MerchantPointAccount"
                required: 
                  - "code"
                  - "msg"
                  - "data"
