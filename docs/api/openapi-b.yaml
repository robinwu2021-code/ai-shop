      description: "费率卡（后端 `GET /biz/settle/rate-card`）。\n\n⚠️ 费率是**万分比整数**（后端 `platformRate / 100.0` 才是百分数）—— 直接当百分数显示会把 2% 显示成 200%。 语义同样要照搬：**费率以下单时快照为准，调整不影响历史订单** —— 不写清楚的话，商家会以为平台调价能追溯到已成交的单。"
    Category: 
      type: "object"
      properties: 
        categoryNo: 
          type: "string"
          description: "类目单号"
        parentNo: 
          type: 
            - "string"
            - "null"
          description: "上级类目单号。一级类目为空"
        level: 
          type: "number"
          description: "1–3。**三级封顶**"
        name: 
          type: "string"
          description: "类目名（后端按 Accept-Language 下发已本地化文案）"
        icon: 
          type: "string"
          description: "类目图标 URL。运营没配就是空串，端上按占位渲染"
        sort: 
          type: "number"
          description: "同级内的展示顺序，小的在前。运营在后台拖动排序改的就是它"
