# 自动生成，请勿手改（npm run gen:api）
openapi: "3.1.0"
info: 
  title: "ai-shop B 端 BFF"
  version: "0.1.0"
  license: 
    name: "UNLICENSED"
  description: "由 b-app/src/api/endpoints.ts + api/requests.ts + packages/shared/types 自动生成，请勿手改。\n生成命令：cd b-app && npm run gen:api\n\n口径：响应包 {code,msg,data}，分页 {records,total,page,size}，camelCase，单号 xxxNo，时间 xxxAt（UTC 毫秒），枚举大写下划线，金额为最小货币单位整数。"
servers: 
  - url: "http://localhost:8080"
    description: "本地后端"
components: 
  securitySchemes: 
    bearerAuth: 
      type: "http"
      scheme: "bearer"
  schemas: 
    CategoryType: 
      type: "string"
      enum: 
        - "GOODS"
        - "FRESH"
        - "SERVICE"
        - "VIRTUAL"
        - "CARD"
    FulfillmentType: 
      type: "string"
      enum: 
        - "PICKUP"
        - "NEIGHBOR_PICKUP"
        - "DELIVERY"
        - "EXPRESS"
        - "STORE_VERIFY"
        - "APPOINTMENT"
        - "INSTANT"
    Lang: 
      type: "string"
      enum: 
        - "zh-CN"
        - "en"
        - "ar"
    CurrencyCode: 
      type: "string"
      enum: 
        - "CNY"
        - "USD"
        - "AED"
    MarketId: 
      type: "string"
      enum: 
        - "CN"
        - "AE"
        - "US"
    ServiceScope: 
      type: "string"
      enum: 
        - "COMMUNITY"
        - "CITY"
        - "PLATFORM"
    I18nText: 
      "$ref": "#/components/schemas/Record_Lang_string"
      description: "多语言文案（mock 内部用；对外契约由后端按 Accept-Language 返回已本地化的 string）"
    PageQuery: 
      type: "object"
      properties: 
        page: 
          type: "number"
          description: "页码，从 1 起。不传按 1 处理"
        size: 
          type: "number"
          description: "每页条数。不传按各接口默认值（通常 10 或 20）"
      additionalProperties: false
    User: 
      type: "object"
      properties: 
        cUserNo: 
          type: "string"
          description: "C 端用户单号。前缀 `cUser` 是有意的：B 端商家、平台 STAFF 是**另外两个账号池**，单号不通用"
        nickname: 
          type: "string"
          description: "昵称。微信授权取来的，用户可改"
        avatar: 
          type: "string"
          description: "头像 URL"
        phone: 
          type: "string"
          description: "手机号。已脱敏（中间四位星号），完整号码不下发到端上"
        communityNo: 
          type: "string"
          description: "当前绑定的社区。未绑定时为空 —— 首页的商品可见范围依赖它"
        pickupNo: 
          type: "string"
          description: "默认自提点。下单时预选，用户可改"
        merchantNo: 
          type: "string"
          description: "常去的店。与 communityNo 正交 —— 可以在 A 社区却常买 B 店（ADR-004 §5.1）"
      required: 
        - "cUserNo"
        - "nickname"
        - "avatar"
        - "phone"
      additionalProperties: false
    Community: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "社区单号"
        name: 
          type: "string"
          description: "社区名（小区名）"
        address: 
          type: "string"
          description: "社区地址"
        cityCode: 
          type: "string"
          description: "所属城市。全市范围的商家靠它判定可达"
        distance: 
          type: "number"
          description: "米"
        pickups: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Pickup"
          description: "本社区可用的自提点"
      required: 
        - "communityNo"
        - "name"
        - "address"
        - "cityCode"
        - "distance"
        - "pickups"
      additionalProperties: false
    Pickup: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "自提点单号"
        name: 
          type: "string"
          description: "自提点名称（通常是承接店铺的店名）"
        address: 
          type: "string"
          description: "自提点地址"
        distance: 
          type: "number"
          description: "距当前社区的距离（米），服务端算好下发"
        hostMerchantNo: 
          type: "string"
          description: "承接这个自提点的商家（ADR-005：PickupPoint.type=STORE，承接方是入驻商家而非团长）"
        hostName: 
          type: "string"
          description: "承接商家的店名"
        hostAvatar: 
          type: "string"
          description: "承接商家的头像/门头图"
        openHours: 
          type: "string"
          description: "营业时间文案，如 `08:00-21:00`。展示用，不参与计算"
        arrivalDesc: 
          type: "string"
          description: "到货时间说明，如「次日 18:00 后到」。影响用户选不选这个点"
      required: 
        - "pickupNo"
        - "name"
        - "address"
        - "distance"
        - "hostMerchantNo"
        - "hostName"
        - "hostAvatar"
        - "openHours"
        - "arrivalDesc"
      additionalProperties: false
    PointRecordType: 
      type: "string"
      enum: 
        - "EARN"
        - "USE"
        - "REFUND"
        - "EXPIRE"
        - "RECEIVE"
        - "SETTLE"
    PointRecord: 
      type: "object"
      properties: 
        recordNo: 
          type: "string"
          description: "流水单号。积分是平台负债，每一笔变动都要可追溯（ADR-006）"
        type: 
          "$ref": "#/components/schemas/PointRecordType"
          description: "变动类型，决定这笔是增是减"
        points: 
          type: "number"
          description: "变动量，正=增加 负=减少"
        title: 
          type: "string"
          description: "流水标题，如「订单消费获得」「过期作废」。展示用"
        orderNo: 
          type: "string"
          description: "关联订单。消费/退款类必有，过期/结算类为空"
        at: 
          type: "number"
          description: "发生时间"
        balanceAfter: 
          type: "number"
          description: "变动后余额，用于对账 —— 只存变动量的话，一条记录出错后面全错"
      required: 
        - "recordNo"
        - "type"
        - "points"
        - "title"
        - "at"
        - "balanceAfter"
      additionalProperties: false
    PointAccount: 
      type: "object"
      properties: 
        balance: 
          type: "number"
          description: "当前可用余额。**只含能花的分**，待生效的在 pendingBalance"
        pendingBalance: 
          type: "number"
          description: "待生效积分：已发放但未过售后期，**不计入 balance**。\n\n两个数必须分开展示（「可用 400 / 待生效 100」）。合成一个的话， 用户看到「我有 500 分」却只能用 400，没有任何办法解释这个差额。"
        pendingActivateAt: 
          type: "number"
          description: "最近一批待生效积分的可用时间。`pendingBalance=0` 时为空"
        totalEarned: 
          type: "number"
          description: "累计获得（含已用、已过期），只增不减"
        totalUsed: 
          type: "number"
          description: "累计已抵扣"
        expiringSoon: 
          type: "number"
          description: "30 天内将过期的积分"
        expiringAt: 
          type: "number"
          description: "最近一批积分的过期时间。`expiringSoon=0` 时为空"
      required: 
        - "balance"
        - "pendingBalance"
        - "totalEarned"
        - "totalUsed"
        - "expiringSoon"
      additionalProperties: false
      description: "用户积分账户。**单位是积分个数** —— 商家侧是钱，用  {@link  MerchantPointAccount }"
    MerchantPointsRecord: 
      type: "object"
      properties: 
        settleNo: 
          type: "string"
          description: "结算单号"
        subOrderNo: 
          type: "string"
          description: "关联子单，商家据此对到具体订单"
        points: 
          type: "number"
          description: "本单发放的积分数"
        feeMinor: 
          type: "number"
          description: "本单的发分服务费（分）。**这是商家唯一感知到的积分成本**"
        period: 
          type: "string"
          description: "账期 `YYYYMM`"
        at: 
          type: "number"
          description: "计提时间（支付成功时），不是分账时间 —— 两者相差一个售后期"
      required: 
        - "settleNo"
        - "subOrderNo"
        - "points"
        - "feeMinor"
        - "period"
        - "at"
      additionalProperties: false
      description: "商家的一条发分服务费记录：一单一条，来自 `stl_bill.points_fee_minor`"
    PointsDeductible: 
      type: "object"
      properties: 
        maxPoints: 
          type: "number"
          description: "本单最多可抵扣的积分数。已扣掉四级开关与上限，端上直接用"
        maxAmountMinor: 
          type: "number"
          description: "对应金额（分）"
        balance: 
          type: "number"
          description: "用户当前可用余额，用于展示「你有 X 分」"
        disabledReason: 
          type: "string"
          description: "不可用时的原因，直接展示。可用时为空"
      required: 
        - "maxPoints"
        - "maxAmountMinor"
        - "balance"
      additionalProperties: false
      description: "结算页的积分试算结果。**服务端算**，端上只负责显示。\n\n端上自己算的话，下单时服务端会再算一遍 —— 两处算法只要有一点不同 （券后金额口径、运费是否参与、开关判断顺序），用户就会看到 「结算页说能抵 30，下单后只抵了 25」，而这个差额没人解释得清。"
    MerchantPointAccount: 
      type: "object"
      properties: 
        periodExpenseMinor: 
          type: "number"
          description: "本期发分服务费支出（分）。**商家唯一感知到的积分成本**"
        period: 
          type: "string"
          description: "当前账期标识，如 `2026-08`"
        enabled: 
          type: "boolean"
          description: "本店积分是否生效 —— 全局 AND 社区 AND 主体非小微 AND 本店开关"
        disabledReason: 
          type: "string"
          description: "不生效的原因，直接展示给商家。\n\n小微主体要说「升级为个体工商户后可开启」，不能说「本店未开启积分」—— 后者会让商家去开一个他根本开不了的开关。"
        forced: 
          type: "boolean"
          description: "平台按行业强制开，商家不可自行关闭"
      required: 
        - "periodExpenseMinor"
        - "period"
        - "enabled"
        - "forced"
      additionalProperties: false
      description: "商家的积分成本视图。**单位是钱，不是分**。\n\n商家只感知**一件事**：开了积分，每笔订单要付一笔发分服务费。 他**看不到**用户抵了多少分、平台补了多少、资金池 —— 对他而言订单就是全额， 收到的是「订单金额 − 各项费用」（V34）。\n\n所以这里没有 income/net：商家侧不存在「积分兑付进账」这个概念。"
    MessageType: 
      type: "string"
      enum: 
        - "TRADE"
        - "MARKETING"
        - "SYSTEM"
      description: "站内消息。 三类分开是因为**用户对它们的期待完全不同**：交易类必须看到（到货了要去取）， 活动类可以错过，系统类是通知。混在一个列表里，交易消息会被活动消息淹没。"
    Message: 
      type: "object"
      properties: 
        messageNo: 
          type: "string"
          description: "消息单号"
        type: 
          "$ref": "#/components/schemas/MessageType"
          description: "消息分类，决定它落在哪个 tab"
        title: 
          type: "string"
          description: "标题（列表页展示）"
        body: 
          type: "string"
          description: "正文"
        link: 
          type: "string"
          description: "点进去要跳哪（订单详情/商品/团），已是完整页面路径带参"
        read: 
          type: "boolean"
          description: "是否已读。未读数按 type 分别统计"
        at: 
          type: "number"
          description: "消息产生时间"
      required: 
        - "messageNo"
        - "type"
        - "title"
        - "body"
        - "read"
        - "at"
      additionalProperties: false
    Address: 
      type: "object"
      properties: 
        addressId: 
          type: "string"
          description: "地址 ID。这里是 `Id` 不是 `No` —— 它不是业务单号，是用户地址簿里的一条本地记录， 不跨端流转、不出现在订单快照里（下单时地址是**整体快照**进订单的）"
        name: 
          type: "string"
          description: "收货人姓名"
        phone: 
          type: "string"
          description: "收货人手机号"
        region: 
          type: "string"
          description: "省市区"
        detail: 
          type: "string"
          description: "详细地址（街道门牌）"
        isDefault: 
          type: "boolean"
          description: "是否默认地址。整个地址簿至多一条为 true"
        tag: 
          type: "string"
          description: "标签：家 / 公司 / 其他"
      required: 
        - "addressId"
        - "name"
        - "phone"
        - "region"
        - "detail"
        - "isDefault"
      additionalProperties: false
    AfterSaleReason: 
      type: "string"
      enum: 
        - "MISSING"
        - "DAMAGED"
        - "QUALITY"
        - "WRONG_ITEM"
        - "NOT_ARRIVED"
        - "OTHER"
    MerchantSubject: 
      type: "string"
      enum: 
        - "MICRO"
        - "INDIVIDUAL"
        - "ENTERPRISE"
      description: "商家主体类型 —— **权威口径取通道侧**（ADR-010）。\n\n主体类型的唯一硬约束来自支付通道：能不能进件、要什么资质、钱打到个人还是对公。 展示名反而可以随便改。让权威贴着约束走，映射就只需要一个方向。\n\n规则（要不要执照、受不受行业白名单限制、结算账户形态）在 `sys_merchant_subject` 表里，随通道调整；**这里只管取值域**。 端上取 `GET /common/master-data`，不要在页面里写死。\n\n<p><b>不叫 `SubjectType`</b>：那个名字在平台端已经是**风控主体** （DEVICE/MERCHANT/USER）。两个不同的概念同名，读代码的人迟早会把 一个当成另一个 —— 类型对齐守卫正是为此存在的。"
    MerchantType: 
      "$ref": "#/components/schemas/MerchantSubject"
      deprecated: "用 {@link MerchantSubject }。旧取值 `PLATFORM/COMPANY/INDIVIDUAL` 已废弃 ——\n其中 `PLATFORM`（平台自营）**不是一种主体类型**：平台自营的主体也是个企业，\n「自营」是归属标记，混进主体枚举里让这一列同时承担了两件事。\n一期没有真实的自营商家，暂不为它单开字段。"
    MerchantBrief: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号。贯穿商品/订单/评价/结算，是多商家模型的主线（ADR-001）"
        name: 
          type: "string"
          description: "店铺名"
        logo: 
          type: "string"
          description: "店铺 logo URL"
        rating: 
          type: "number"
          description: "综合评分，0–5，保留一位小数"
        verified: 
          type: "boolean"
          description: "是否通过资质认证"
        breachCount: 
          type: "number"
          description: "选定报价后不履约的次数。>0 会在报价卡上公示 —— 事后信用替代事前审核"
      required: 
        - "merchantNo"
        - "name"
        - "logo"
        - "rating"
        - "verified"
        - "breachCount"
      additionalProperties: false
      description: "商品卡/详情上挂的商家简要信息"
    VisitedMerchant: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号。贯穿商品/订单/评价/结算，是多商家模型的主线（ADR-001）"
        name: 
          type: "string"
          description: "店铺名"
        logo: 
          type: "string"
          description: "店铺 logo URL"
        rating: 
          type: "number"
          description: "综合评分，0–5，保留一位小数"
        verified: 
          type: "boolean"
          description: "是否通过资质认证"
        breachCount: 
          type: "number"
          description: "选定报价后不履约的次数。>0 会在报价卡上公示 —— 事后信用替代事前审核"
        type: 
          "$ref": "#/components/schemas/MerchantType"
          description: "商家类型：平台自营 / 企业 / 个体"
        desc: 
          type: "string"
          description: "店铺简介"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "经营范围 —— 邻里购物的核心约束：**商家是有服务半径的**。 隔壁区的生鲜店对我没有意义，它送不到我的自提点。见 SERVICE_SCOPE。"
        serviceCommunityNos: 
          type: "array"
          items: 
            type: "string"
          description: "覆盖哪些社区。**仅 scope=COMMUNITY 时有意义**，其余情况忽略"
        serviceCityCode: 
          type: "string"
          description: "覆盖哪个城市。**仅 scope=CITY 时有意义**"
        distance: 
          type: "number"
          description: "距当前社区的距离（米）。由服务端按用户当前社区算好下发，端上不自己算"
        salesCount: 
          type: "number"
          description: "累计订单量（评分权重之一）"
        ratingCount: 
          type: "number"
          description: "参与评分的评价条数"
        goodsCount: 
          type: "number"
          description: "在售商品数"
        address: 
          type: "string"
          description: "店铺地址。纯线上商家可能没有"
        openHours: 
          type: "string"
          description: "营业时间文案"
        joinedAt: 
          type: "number"
          description: "入驻时间"
        tags: 
          type: "array"
          items: 
            type: "string"
          description: "店铺标签，如「生鲜」「次日达」。展示用，不参与筛选"
        scores: 
          type: "object"
          properties: 
            goods: 
              type: "number"
            service: 
              type: "number"
            speed: 
              type: "number"
          required: 
            - "goods"
            - "service"
            - "speed"
          additionalProperties: false
          description: "分维度评分：商品/服务/时效"
        orderCount: 
          type: "number"
          description: "在该商家的下单次数"
        lastOrderAt: 
          type: "number"
          description: "最近一次下单时间"
      required: 
        - "breachCount"
        - "desc"
        - "goodsCount"
        - "joinedAt"
        - "lastOrderAt"
        - "logo"
        - "merchantNo"
        - "name"
        - "orderCount"
        - "rating"
        - "ratingCount"
        - "salesCount"
        - "scores"
        - "serviceCommunityNos"
        - "serviceScope"
        - "tags"
        - "type"
        - "verified"
      additionalProperties: false
      description: "消费过的商家（「我买过的」列表用）"
    Merchant: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号。贯穿商品/订单/评价/结算，是多商家模型的主线（ADR-001）"
        name: 
          type: "string"
          description: "店铺名"
        logo: 
          type: "string"
          description: "店铺 logo URL"
        rating: 
          type: "number"
          description: "综合评分，0–5，保留一位小数"
        verified: 
          type: "boolean"
          description: "是否通过资质认证"
        breachCount: 
          type: "number"
          description: "选定报价后不履约的次数。>0 会在报价卡上公示 —— 事后信用替代事前审核"
        type: 
          "$ref": "#/components/schemas/MerchantType"
          description: "商家类型：平台自营 / 企业 / 个体"
        desc: 
          type: "string"
          description: "店铺简介"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "经营范围 —— 邻里购物的核心约束：**商家是有服务半径的**。 隔壁区的生鲜店对我没有意义，它送不到我的自提点。见 SERVICE_SCOPE。"
        serviceCommunityNos: 
          type: "array"
          items: 
            type: "string"
          description: "覆盖哪些社区。**仅 scope=COMMUNITY 时有意义**，其余情况忽略"
        serviceCityCode: 
          type: "string"
          description: "覆盖哪个城市。**仅 scope=CITY 时有意义**"
        distance: 
          type: "number"
          description: "距当前社区的距离（米）。由服务端按用户当前社区算好下发，端上不自己算"
        salesCount: 
          type: "number"
          description: "累计订单量（评分权重之一）"
        ratingCount: 
          type: "number"
