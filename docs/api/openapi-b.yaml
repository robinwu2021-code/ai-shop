            - "PERMANENT"
            - "GROUP_INSTANCE"
          description: "常驻 | 团粒度（一团一销）"
        groupNo: 
          type: "string"
          description: "type=NEIGHBOR 时必填：这个点只服务这一个团"
        name: 
          type: "string"
          description: "自提点名称"
        address: 
          type: "string"
          description: "展示地址。**成团前只到楼栋，付款后才给完整门牌**（B13）—— 未成团的团不该暴露发起人住址。"
        timeSlot: 
          type: "string"
          description: "约定取货时段。邻居家不能一直堆着货（B15）"
        feeMode: 
          type: "string"
          enum: 
            - "NONE"
            - "PER_ITEM"
            - "RATE"
          description: "计费口径。**必须显式标出用哪一种** —— 库里按件与按率两列长期并存， 没有判别列的话结算侧只能猜，猜错就是给自提点少付或多付钱。 之所以两种都留：费率是**线下逐点协商**的，有的点谈成按件、有的谈成按成交额抽成， 硬统一成一种会让运营在谈判里没有筹码。"
        serviceFeePerItemMinor: 
          type: "number"
          description: "feeMode=PER_ITEM 时的按件服务费。STORE 与 NEIGHBOR 恒为 0"
        serviceFeeRate: 
          type: "number"
          description: "feeMode=RATE 时的费率（万分比）。STORE 与 NEIGHBOR 恒为 0"
      required: 
        - "pickupNo"
        - "type"
        - "ownerType"
        - "ownerNo"
        - "scope"
        - "name"
        - "address"
        - "feeMode"
        - "serviceFeePerItemMinor"
        - "serviceFeeRate"
      additionalProperties: false
      description: "自提点实体。\n\n取代了原先的 `Merchant.isPickupPoint` 布尔字段 —— 那个表达不了「承接方是用户」： 邻里自提是送到**团发起人家里**，承接的是邻居本人，不是商家。"
    PickingRow: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        skuNo: 
          type: "string"
          description: "SKU 单号。分拣按 SKU 汇总，不是按商品"
        title: 
          type: "string"
          description: "商品标题"
        cover: 
          type: "string"
          description: "封面图，照着点数时用来认货"
        spec: 
          type: "string"
          description: "规格文案"
        totalQty: 
          type: "number"
          description: "该 SKU 在本自提点的总件数（含赠品）"
        buyers: 
          type: "array"
          items: 
            type: "object"
            properties: 
              nickname: 
                type: "string"
              qty: 
                type: "number"
              orderNo: 
                type: "string"
            required: 
              - "nickname"
              - "qty"
              - "orderNo"
            additionalProperties: false
          description: "谁要几件"
      required: 
        - "goodsNo"
        - "skuNo"
        - "title"
        - "cover"
        - "spec"
        - "totalQty"
        - "buyers"
      additionalProperties: false
      description: "分拣单的一行：按商品汇总，团长照着这个点数"
    GrantType: 
      type: "string"
      enum: 
        - "WX_MINI"
        - "WX_PHONE"
        - "WX_OPEN"
        - "PHONE_OTP"
        - "APPLE"
      description: "登录方式。 · WX_MINI  小程序静默登录（只拿 openid，拿不到手机号） · WX_PHONE 小程序一键取手机号（推荐：一次授权直接拿到号，省掉短信） · WX_OPEN  App 微信开放平台 · APPLE    Apple 登录（iOS 上架硬要求） · PHONE_OTP 手机号 + 短信验证码（全端兜底，也是商家账号的主标识）"
    LoginReq: 
      type: "object"
      properties: 
        grantType: 
          "$ref": "#/components/schemas/GrantType"
          description: "登录方式，决定 principal / credential 各放什么"
        principal: 
          type: "string"
          description: "凭证主体：`WX_*` 放 wx.login 的 code；`PHONE_OTP` 放手机号；`APPLE` 放 identityToken"
        credential: 
          type: "string"
          description: "凭证副本：仅 `PHONE_OTP` 需要，放短信验证码"
        inviterNo: 
          type: "string"
          description: "邀请人。从邀请链接进入时带上，用于拉新归因"
        merchantNo: 
          type: "string"
          description: "从店铺码/店铺分享进入时带上，用于进店归因与费率分档（ADR-004 §5.4）"
        agreed: 
          type: "boolean"
          description: "是否已勾选同意用户协议与隐私政策 —— 注册的合规前置，服务端要留痕"
      required: 
        - "grantType"
        - "principal"
      additionalProperties: false
    LoginResp: 
      type: "object"
      properties: 
        token: 
          type: "string"
          description: "访问令牌。后续请求放 `Authorization: Bearer <token>`"
        user: 
          "$ref": "#/components/schemas/User"
          description: "登录用户档案"
      required: 
        - "token"
        - "user"
      additionalProperties: false
    MerchantStatus: 
      type: "string"
      enum: 
        - "NONE"
        - "APPLYING"
        - "REVIEWING"
        - "REJECTED"
        - "ACTIVE"
        - "SUSPENDED"
      description: "商家在 B 端的**综合状态**：既要表达「还没入驻成功」，也要表达「已经在经营」。\n\n⚠️ 它是一个**展示用的合并视图**，底下是两条互不相干的生命周期：   · 审核（`MerchantApplyStatus`）—— 商家还不存在时的事，归 `usr_merchant_apply`   · 经营（ACTIVE / SUSPENDED）—— 商家已存在之后的事，归 `usr_merchant.status`\n\nB 端首页要在一个地方回答「我现在能不能做生意」，所以合并； 但**库里绝不能合并** —— 一旦合并，「驳回一份申请」和「封禁一家店」就共用取值， 而这两件事的操作人、审计口径、可逆性全都不同。"
    MerchantTier: 
      type: "string"
      enum: 
        - "SMALL"
        - "MEDIUM"
        - "LARGE"
      description: "商家分层。为「流量起来后引入大商家」预留，一期只用 SMALL（ADR-004 §7）"
    MerchantProfile: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号"
        name: 
          type: "string"
          description: "店铺名"
        logo: 
          type: "string"
          description: "店铺 logo"
        status: 
          "$ref": "#/components/schemas/MerchantStatus"
          description: "入驻审核状态。非 ACTIVE 时 B 端只能看到入驻流程页"
        subject: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型"
        tier: 
          "$ref": "#/components/schemas/MerchantTier"
          description: "商家分层。一期恒为 SMALL"
        phone: 
          type: "string"
          description: "登录手机号，也是商家账号的主标识"
        isPickupPoint: 
          type: "boolean"
          description: "是否承接自提点 —— 决定 B 端是否出现「履约台」入口（ADR-005）"
        pickupNo: 
          type: "string"
          description: "承接的自提点单号。`isPickupPoint=true` 时有值"
        rejectReason: 
          type: "string"
          description: "驳回原因，status=REJECTED 时有值"
        loginBy: 
          "$ref": "#/components/schemas/GrantType"
          description: "本次会话的登录方式。第三方登录且 phone 为空时，要引导补绑手机号"
      required: 
        - "merchantNo"
        - "name"
        - "logo"
        - "status"
        - "subject"
        - "tier"
        - "phone"
        - "isPickupPoint"
      additionalProperties: false
      description: "登录后的商家会话"
    MerchantLoginResp: 
      type: "object"
      properties: 
        token: 
          type: "string"
          description: "访问令牌。**商家池与 C 端用户池是两套账号**，token 不通用"
        merchant: 
          "$ref": "#/components/schemas/MerchantProfile"
          description: "商家档案"
      required: 
        - "token"
        - "merchant"
      additionalProperties: false
    MerchantApplyReq: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "拟用店铺名"
        subject: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型。个人 → 个体户 → 企业，门槛前低后高"
        contactName: 
          type: "string"
          description: "联系人姓名。审核要打电话找人，只有号码没有姓名不合适"
        contactPhone: 
          type: "string"
          description: "联系手机号"
        category: 
          type: "string"
          description: "主营类目"
        desc: 
          type: "string"
          description: "店铺简介"
        asPickupPoint: 
          type: "boolean"
          description: "承接自提点：小店既是供给方也是取货点（ADR-005 type=STORE）"
        serviceScope: 
          type: "string"
          enum: 
            - "COMMUNITY"
            - "CITY"
            - "PLATFORM"
          description: "期望经营范围（ADR-009）。申请时可空，<b>审核通过时必须确定</b> —— 否则商家上着架却对谁都不可见，且没有任何报错。"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "期望覆盖的社区。scope=COMMUNITY 时审核通过必须非空"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "资质图片（营业执照/身份证）。**选填** —— 一期 EDI 不强制。\n\n与下面的结算账户一样，属于**分账主体开户**而不是入驻申请本身（ADR-002）： `usr_merchant_payment` 是独立一张表、有自己的 `apply_status`，就是这个道理。 申请时能传就传，通过后在 B 端补也行 —— 逼一个还没通过审核的人先传营业执照， 只会把人挡在门外。"
        settleAccountType: 
          type: "string"
          enum: 
            - "PERSONAL_OPENID"
            - "MERCHANT_ID"
          description: "结算账户类型。真实账号由后端持有，C 端与 B 端都不回显（ADR-002 §5）。**选填**，同上"
        industry: 
          type: "string"
          description: "行业（`sys_industry.industry`）。\n\n**它决定这家店能不能以小微主体进件** —— 微信的小微白名单是按行业给的， 也是 `points_forced` 默认值的来源。\n\n后端一直在收、库里一直有这一列，但契约没登记、端也没传， 于是 `mch_entity.industry` 恒空：进件时才发现主体类型选错了， 而那时商家已经开完店、上完架。"
      required: 
        - "name"
        - "subject"
        - "contactName"
        - "contactPhone"
        - "category"
        - "desc"
      additionalProperties: false
    MasterData: 
      type: "object"
      properties: 
        industries: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MasterDataIndustry"
          description: "可选行业。**决定能不能以小微主体进件**，也是 points_forced 默认值的来源"
        subjects: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MasterDataSubject"
          description: "可选主体类型（法律形态）。决定资质要求与结算账户形态"
        channels: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MasterDataChannel"
          description: "可用支付通道与其能力位"
      required: 
        - "industries"
        - "subjects"
        - "channels"
      additionalProperties: false
      description: "平台主数据快照（`GET /common/master-data`）。\n\n合成一个响应而不是三条接口，是因为它们在**同一屏上被同时用到**： 「选行业 → 据此过滤可选主体 → 主体决定要不要传营业执照」。 分三次请求会出现「行业回来了、主体还没回来」的中间态， 而那个中间态里表单不知道该不该禁用某个选项。"
    MasterDataIndustry: 
      type: "object"
      properties: 
        industry: 
          type: "string"
          description: "行业码（`sys_industry.industry`），提交申请时回传的就是它"
        name: 
          type: "string"
          description: "展示名。**取服务端的**，不要在端上再维护一份翻译"
        microAllowed: 
          type: "boolean"
          description: "该行业能否以小微主体进件。**false 时小微选项要禁用**，不是提交后才报错"
      required: 
        - "industry"
        - "name"
        - "microAllowed"
      additionalProperties: false
    MasterDataSubject: 
      type: "object"
      properties: 
        subjectType: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型码"
        name: 
          type: "string"
          description: "展示名"
        needLicense: 
          type: "boolean"
          description: "要不要传营业执照"
        industryGated: 
          type: "boolean"
          description: "是否受行业白名单管控（小微受管，其余不受）"
        settleAccountType: 
          type: "string"
          enum: 
            - "PERSONAL_OPENID"
            - "MERCHANT_ID"
          description: "该主体默认的结算账户形态：小微打个人，其余打对公"
      required: 
        - "subjectType"
        - "name"
        - "needLicense"
        - "industryGated"
        - "settleAccountType"
      additionalProperties: false
    MasterDataChannel: 
      type: "object"
      properties: 
        payChannel: 
          type: "string"
          description: "通道码（`sys_pay_channel.pay_channel`），如 WECHAT"
        name: 
          type: "string"
          description: "展示名"
        enabled: 
          type: "boolean"
          description: "通道是否可用。关掉时下单页不给这个支付方式，而不是点了才失败"
        payMethods: 
          type: "array"
          items: 
            type: "string"
          description: "该通道支持的支付方式，如 JSAPI / APP / H5"
      required: 
        - "payChannel"
        - "name"
        - "enabled"
        - "payMethods"
      additionalProperties: false
    PaymentApplyment: 
      type: "object"
      properties: 
        payChannel: 
          type: "string"
          description: "通道码，如 WECHAT"
        channelName: 
          type: "string"
          description: "通道展示名。取服务端的，端上不要再维护一份翻译"
        applyStatus: 
          type: "string"
          enum: 
            - "NONE"
            - "APPLYING"
            - "ACTIVE"
            - "REJECTED"
            - "FROZEN"
          description: "NONE / APPLYING / ACTIVE / REJECTED / FROZEN"
        canReceiveMoney: 
          type: "boolean"
          description: "这个通道现在能不能收钱。\n\n**照着它显示，不要自己去比 applyStatus** —— 比错的表现是 「显示能收钱但收不了」，而这种错要到第一笔订单才暴露。"
        payMerchantNo: 
          type: "string"
          description: "收款商户号业务键，通过后才有。门店挂收款号引用的就是它"
        subMchidMasked: 
          type: "string"
          description: "二级商户号掩码。完整号不回显"
        settleAccountType: 
          type: "string"
          enum: 
            - "PERSONAL_OPENID"
            - "MERCHANT_ID"
          description: "结算账户形态：小微打个人（PERSONAL_OPENID），其余打对公（MERCHANT_ID）"
        settleAccountMasked: 
          type: "string"
          description: "结算账号掩码。**明文永不回显**，包括给商家自己（ADR-002 §5）"
        rejectReason: 
          type: "string"
          description: "驳回原因。驳回时必有 —— 没有原因商家只能反复重提"
        missing: 
          type: "array"
          items: 
            type: "string"
          description: "还缺哪些资料（settleAccount / licenses / settleAccountType）。空 = 资料齐了在等通道"
        appliedAt: 
          type: "number"
          description: "提交进件的时间。没提交过为空"
        activatedAt: 
          type: "number"
          description: "通道开户完成的时间 —— 从这一刻起才真的能收钱"
      required: 
        - "payChannel"
        - "channelName"
        - "applyStatus"
        - "canReceiveMoney"
        - "missing"
      additionalProperties: false
      description: "收款进件状态（每通道一条）。\n\n<p><b>它与入驻审核是两件事</b>：入驻过了店就能开、货能上架， 但通道没批就收不了钱。合成一个「入驻进度」，商家问「我能收钱了吗」就没法回答。"
    Store: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号。一旦生成不再变 —— 换主体只换归属，不换它"
        name: 
          type: "string"
          description: "门店名"
        address: 
          type: "string"
          description: "门店地址。顾客据此找到取货点，也是履约范围的锚点"
        isDefault: 
          type: "boolean"
          description: "是否默认店。一个主体**恰好一家** —— 它是「找不到具体门店时去哪」的答案"
        status: 
          type: "string"
          enum: 
            - "ACTIVE"
            - "READONLY"
          description: "ACTIVE 正常营业 / READONLY 已停用（不再接新单，已有单照常履约）"
        payMerchantNo: 
          type: "string"
          description: "这家店用哪个收款号。**空 = 用主体的默认收款号**，不是\"没配\""
        payReady: 
          type: "boolean"
          description: "这家店现在能不能收钱。照它显示，别自己去比状态串"
        staffCount: 
          type: "number"
          description: "授权到这家店的员工数（不含老板）。0 表示只有老板能管这家店"
      required: 
        - "storeNo"
        - "name"
        - "isDefault"
        - "status"
        - "payReady"
        - "staffCount"
      additionalProperties: false
      description: "门店（商家侧管理用）。\n\n<p><b>门店与主体是关联不是归属</b>：换执照店照开。所以 `storeNo` 一旦生成就不再变 —— 评价、订单、顾客的「我常逛的店」都挂在它上面。"
    MerchantStaff: 
      type: "object"
      properties: 
        mchAccountNo: 
          type: "string"
          description: "商家账号号。**不叫 staffNo** —— 那个名字被平台运营占着，两者是不同的人"
        loginPhone: 
          type: "string"
          description: "登录手机号，**已脱敏**。完整号不回显 —— 那等于一份可导出的通讯录"
        isOwner: 
          type: "boolean"
          description: "老板。**不受门店授权限制**，他的店都归他管"
        status: 
          type: "string"
          enum: 
            - "ACTIVE"
            - "DISABLED"
          description: "ACTIVE / DISABLED"
        roles: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/StoreRole"
          description: "他在各门店的角色。老板为空 —— 不是\"没授权\"，是\"不需要授权\""
      required: 
        - "mchAccountNo"
        - "loginPhone"
        - "isOwner"
        - "status"
        - "roles"
      additionalProperties: false
      description: "商家员工（B 端账号 + 他在各门店的角色）。\n\n<p>**逐店授权**：A 店店长可以同时是 B 店店员 —— 老店的店长去新店帮忙， 但新店不归他管，这是小连锁的常态。"
    StoreRole: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "哪家店"
        storeName: 
          type: "string"
          description: "门店名快照，列表直接显示，省一次查询"
        role: 
          type: "string"
          enum: 
            - "MANAGER"
            - "CLERK"
          description: "MANAGER 店长 / CLERK 店员"
      required: 
        - "storeNo"
        - "storeName"
        - "role"
      additionalProperties: false
    GoodsStatus: 
      type: "string"
      enum: 
        - "ON_SALE"
        - "OFF_SALE"
        - "AUDITING"
        - "REJECTED"
      description: "商品在商家侧的状态。C 端只看得到 ON_SALE"
    DeliveryRule: 
      type: "object"
      properties: 
        radius: 
          type: "number"
          description: "配送半径，米"
        minOrderMinor: 
          type: "number"
          description: "起送价，最小货币单位"
        feeMinor: 
          type: "number"
          description: "配送费，最小货币单位"
        freeThresholdMinor: 
          type: "number"
          description: "免配送费门槛，最小货币单位；0 表示不免"
      required: 
        - "radius"
        - "minOrderMinor"
        - "feeMinor"
        - "freeThresholdMinor"
      additionalProperties: false
      description: "商家自送规则（ADR-005 §5：不做骑手系统，只有范围与门槛）"
    SettleBill: 
      type: "object"
      properties: 
        billNo: 
          type: "string"
          description: "结算单号"
        periodStart: 
          type: "number"
          description: "结算周期起（含）"
        periodEnd: 
          type: "number"
          description: "结算周期止（含）"
        payableMinor: 
          type: "number"
          description: "应分金额"
        settledMinor: 
          type: "number"
          description: "已分账金额"
        commissionMinor: 
          type: "number"
          description: "平台佣金"
        fulfillFeeMinor: 
          type: "number"
          description: "自提点履约服务费（承接方收，供货方付；口径待定 B9）"
        status: 
          type: "string"
          enum: 
            - "PENDING"
            - "PARTIAL"
            - "DONE"
            - "EXPIRED"
          description: "结算状态：待结算 / 部分已结 / 已结清 / 已过期"
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "结算币种"
        orderCount: 
          type: "number"
          description: "本期订单笔数"
      required: 
        - "billNo"
        - "periodStart"
        - "periodEnd"
        - "payableMinor"
        - "settledMinor"
        - "commissionMinor"
        - "fulfillFeeMinor"
        - "status"
        - "currency"
        - "orderCount"
      additionalProperties: false
      description: "结算单。分账以子订单为单位（ADR-002 §5）"
    MerchantTodo: 
      type: "object"
      properties: 
        toShip: 
          type: "number"
          description: "待发货单数（EXPRESS 履约）"
        toDeliver: 
          type: "number"
          description: "待自送单数（商家自送履约）"
        toVerify: 
          type: "number"
          description: "待核销单数（自提到货、买家还没来取）"
        toPick: 
          type: "number"
          description: "待分拣单数（到货后按商品汇总点数）"
        afterSale: 
          type: "number"
          description: "待处理售后单数"
        toReply: 
          type: "number"
          description: "待回复的评价数"
        quotable: 
          type: "number"
          description: "可报价的求团需求数"
      required: 
        - "toShip"
        - "toDeliver"
        - "toVerify"
        - "toPick"
        - "afterSale"
        - "toReply"
        - "quotable"
      additionalProperties: false
      description: "工作台待办。**数字即入口** —— 商家打开 App 只想知道「有几件事要我做」"
    MerchantStats: 
      type: "object"
      properties: 
        todayOrders: 
          type: "number"
          description: "今日订单数（自然日，按市场本地时区切分）"
        todayGmvMinor: 
          type: "number"
          description: "今日成交额（最小货币单位）"
        monthOrders: 
          type: "number"
          description: "本月订单数"
        monthGmvMinor: 
          type: "number"
          description: "本月成交额（最小货币单位）"
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "统计口径的币种"
        rating: 
          type: "number"
          description: "店铺综合评分，0–5"
        ratingCount: 
          type: "number"
          description: "参与评分的评价条数"
        ownedTrafficRate: 
          type: "number"
          description: "自带客流占比（trafficSource=MERCHANT_OWNED），决定费率档（ADR-004 §6）"
      required: 
        - "todayOrders"
        - "todayGmvMinor"
        - "monthOrders"
        - "monthGmvMinor"
        - "currency"
        - "rating"
        - "ratingCount"
        - "ownedTrafficRate"
      additionalProperties: false
    StoreProfile: 
      type: "object"
      properties: 
        announcement: 
          type: "string"
          description: "店铺公告：「今日到货」「今天有土鸡蛋」，店主自发（C-ST-04）"
        openHours: 
          type: "string"
          description: "营业时间文案，店主自填"
        address: 
          type: "string"
          description: "店铺地址，店主自填"
        featured: 
          type: "array"
          items: 
            type: "string"
          description: "主推商品，按顺序展示在门店主页首屏"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "经营范围（B 端自选）。**决定这家店的货在 C 端能被谁看到** —— 选错不是展示问题：选大了会卖到送不到的地方（下单后提不了货 → 退款）， 选小了则整片小区的人都搜不到这家店。所以 B 端要给出后果说明，不能只给三个单选。"
        serviceCommunityNos: 
          type: "array"
          items: 
            type: "string"
          description: "scope=COMMUNITY 时覆盖的社区。空表示还没谈下任何小区，此时 C 端一律不可见"
        serviceCityCode: 
          type: "string"
          description: "scope=CITY 时覆盖的城市"
      required: 
        - "announcement"
        - "openHours"
        - "address"
        - "featured"
        - "serviceScope"
        - "serviceCommunityNos"
      additionalProperties: false
      description: "店铺门面（B-11.2 店铺装修 → C 端门店主页的数据源）。 与 Merchant 分开：Merchant 是平台建档的商家主数据（名称/资质/评分，商家改不了）， 这里是**店主自己能改的门面内容**。混在一起的话，改公告要走审核就荒谬了。"
    StoreQrcode: 
      type: "object"
      properties: 
        url: 
          type: "string"
          description: "扫码后进入的落地页地址，带 merchant_no 归因参数"
        printUrl: 
          type: "string"
          description: "可打印版（贴纸尺寸），真实环境由后端生成小程序码"
      required: 
        - "url"
        - "printUrl"
      additionalProperties: false
      description: "店铺码（C-ST-08 扫码进店的商家侧）"
    ShareKit: 
      type: "object"
      properties: 
        text: 
          type: "string"
          description: "分享文案，已按当前语言与市场生成"
        posterUrl: 
          type: "string"
          description: "分享海报图 URL"
      required: 
        - "text"
        - "posterUrl"
      additionalProperties: false
      description: "分享素材（B-11.2.7）。文案与海报由服务端按当前语言与市场生成"
    CampaignType: 
      type: "string"
      enum: 
        - "COUPON"
        - "FULL_CUT"
        - "FLASH"
        - "BUY_GIFT"
      description: "商家营销活动。\n\n为什么统一成一个 `MarketingCampaign` 而不是四张表：券、满减、限时特价、买赠 在数据上只差「触发条件 + 优惠方式」，各建一套的结果是四份几乎一样的增删改查， 以及四份互不知情的叠加规则 —— 而叠加恰恰是最容易算错的地方。"
    CampaignStatus: 
      type: "string"
      enum: 
        - "DRAFT"
        - "RUNNING"
        - "PAUSED"
        - "ENDED"
    MarketingCampaign: 
      type: "object"
      properties: 
        campaignNo: 
          type: "string"
          description: "活动单号"
        merchantNo: 
          type: "string"
          description: "所属商家。活动是店铺级的，不跨店"
        type: 
          "$ref": "#/components/schemas/CampaignType"
          description: "活动类型，决定下面哪几个可选字段有意义"
        name: 
          type: "string"
          description: "活动名，展示给用户"
        status: 
          "$ref": "#/components/schemas/CampaignStatus"
          description: "活动状态"
        startAt: 
          type: "number"
          description: "生效开始时间"
        endAt: 
          type: "number"
          description: "生效结束时间"
        thresholdMinor: 
          type: "number"
          description: "门槛：满多少（最小货币单位）。FLASH / BUY_GIFT 不用"
        discountMinor: 
          type: "number"
          description: "优惠额：COUPON / FULL_CUT 用（最小货币单位）"
        flashPriceMinor: 
          type: "number"
          description: "FLASH：活动价（最小货币单位）"
        buyN: 
          type: "number"
          description: "BUY_GIFT：购买件数门槛 N"
        giftM: 
          type: "number"
          description: "BUY_GIFT：赠送件数 M"
        goodsNos: 
          type: "array"
          items: 
            type: "string"
          description: "参与商品；空 = 全店"
        totalCount: 
          type: "number"
          description: "COUPON：发放总量。**预算上限，防止发穿**"
        takenCount: 
          type: "number"
          description: "COUPON：已被领取的数量"
        usedCount: 
          type: "number"
          description: "已核销/已使用次数，衡量效果"
      required: 
        - "campaignNo"
        - "merchantNo"
        - "type"
        - "name"
        - "status"
        - "startAt"
        - "endAt"
        - "goodsNos"
        - "usedCount"
      additionalProperties: false
    CampaignDraft: 
      type: "object"
      properties: 
        campaignNo: 
          type: "string"
          description: "活动单号。新建时不传，编辑时必传"
        type: 
          "$ref": "#/components/schemas/CampaignType"
          description: "活动类型。**创建后不可改** —— 改类型等于换一套优惠语义，应当新建"
        name: 
          type: "string"
          description: "活动名"
        startAt: 
          type: "number"
          description: "生效开始时间"
        endAt: 
          type: "number"
          description: "生效结束时间。须晚于 startAt"
        thresholdMinor: 
          type: "number"
          description: "门槛：满多少（最小货币单位）。COUPON / FULL_CUT 用"
        discountMinor: 
          type: "number"
          description: "优惠额（最小货币单位）。COUPON / FULL_CUT 用"
        flashPriceMinor: 
          type: "number"
          description: "活动价（最小货币单位）。FLASH 用"
        buyN: 
          type: "number"
          description: "购买件数门槛 N。BUY_GIFT 用"
        giftM: 
          type: "number"
          description: "赠送件数 M。BUY_GIFT 用"
        goodsNos: 
          type: "array"
          items: 
            type: "string"
          description: "参与商品；空数组 = 全店"
        totalCount: 
          type: "number"
          description: "发放总量。COUPON 用，不传表示不限量"
      required: 
        - "type"
        - "name"
        - "startAt"
        - "endAt"
        - "goodsNos"
      additionalProperties: false
      description: "新建/编辑活动的入参"
    StoreHome: 
      type: "object"
      properties: 
        merchant: 
          "$ref": "#/components/schemas/Merchant"
          description: "平台建档的商家主数据（名称/资质/评分），店主改不了"
        store: 
          "$ref": "#/components/schemas/StoreProfile"
          description: "店主自己维护的门面内容（公告/营业时间/地址）"
        goods: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Goods"
          description: "在售商品。首屏展示，分页靠单独的商品列表接口"
        favorited: 
          type: "boolean"
          description: "我是否收藏了这家店"
      required: 
        - "merchant"
        - "store"
        - "goods"
        - "favorited"
      additionalProperties: false
      description: "门店主页数据（C-ST-01）。 ⚠️ 这是**交易页不是介绍页**：登录用户第一屏是「我买过的」，不是店招 Banner。 粮油副食的复购路径必须压到三步 —— 打开 → 常买 → 下单（ADR-004 §3.3）。"
    FrequentItem: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        skuNo: 
          type: "string"
          description: "SKU 单号。常买是按 SKU 记的 —— 买惯了 5 斤装的人不想要 10 斤装"
        title: 
          type: "string"
          description: "商品标题"
        cover: 
          type: "string"
          description: "封面图"
        spec: 
          type: "string"
          description: "规格文案"
        price: 
          type: "number"
          description: "当前价（可能已与上次购买时不同）"
        lastPrice: 
          type: "number"
          description: "上次买的价，用于「涨价了」提示"
        times: 
          type: "number"
          description: "买过几次。列表按它排序，不是按时间"
        lastAt: 
          type: "number"
          description: "上次购买时间"
        invalid: 
          type: "boolean"
          description: "已下架/无库存 —— 一键再来一单时要显式标出，不能静默丢掉"
      required: 
        - "goodsNo"
        - "skuNo"
        - "title"
        - "cover"
        - "spec"
        - "price"
        - "lastPrice"
        - "times"
        - "lastAt"
      additionalProperties: false
      description: "常买清单的一行（C-ST-02）。按购买频次排序，不是按时间"
    ReorderResult: 
      type: "object"
      properties: 
        added: 
          type: "number"
          description: "成功加入购物车的件数"
        dropped: 
          type: "array"
          items: 
            type: "string"
          description: "已失效、没加进购物车的商品名"
        priceUp: 
          type: "array"
          items: 
            type: "string"
          description: "涨价了但仍加入的商品名"
      required: 
        - "added"
        - "dropped"
        - "priceUp"
      additionalProperties: false
      description: "一键再来一单的结果（C-ST-03）。**丢了什么必须说清楚**，静默少加是投诉源头"
    MerchantApplyStatus: 
      type: "object"
      properties: 
        applyNo: 
          type: "string"
          description: "申请单号"
        name: 
          type: "string"
          description: "申请时填的店铺名。**存快照** —— 后来改名不该让历史申请跟着变"
        subject: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型。决定分账主体形态与所需资质（ADR-002 §4）"
        status: 
          type: "string"
          enum: 
            - "PENDING"
            - "REVIEWING"
            - "APPROVED"
            - "REJECTED"
          description: "审核状态。迁移见本类型的注释，APPROVED 为终态"
        rejectReason: 
          type: "string"
          description: "驳回理由。**驳回必须写** —— 不写就等于让人猜着改"
        merchantNo: 
          type: "string"
          description: "通过后生成的商家单号。未通过时为空 —— 商家在通过之前根本不存在"
        createdAt: 
          type: "number"
          description: "提交时间"
        auditedAt: 
          type: "number"
          description: "审核完成时间。PENDING/REVIEWING 期间为空"
        contactName: 
          type: "string"
          description: "联系人姓名"
        contactPhone: 
          type: "string"
          description: "联系手机号。这是申请人自己填的联系号码，**不是登录号**，不脱敏"
        category: 
          type: "string"
          description: "主营类目"
        desc: 
          type: "string"
          description: "店铺简介"
        serviceScope: 
          type: "string"
          enum: 
            - "COMMUNITY"
            - "CITY"
            - "PLATFORM"
          description: "期望经营范围（ADR-009）"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "期望覆盖的社区"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "已传的资质图"
        industry: 
          type: "string"
          description: "申请时选的行业。驳回回填要用它 —— 换个行业可能连主体类型都得跟着换"
        asPickupPoint: 
          type: "boolean"
          description: "是否愿意承接自提点（ADR-005）。\n\n**只是意愿，不代表点已建立** —— 建点要谈服务费口径，一期由运营在通过后另行处理。 所以商家勾了这一项、通过后却还没看到履约台，是正常的中间状态而不是故障。"
      required: 
        - "applyNo"
        - "name"
        - "subject"
        - "status"
        - "createdAt"
        - "contactName"
        - "contactPhone"
        - "category"
        - "desc"
      additionalProperties: false
      description: "入驻申请状态（C 端查自己的进度 / 平台端审核队列共用）。\n\n状态机：`PENDING → REVIEWING → APPROVED | REJECTED`，`REJECTED → PENDING`（补料重提）。\n**APPROVED 是终态** —— 已经建了商家、发了账号，回退没有意义。\n\n⚠️ 这条是**审核**生命周期，与 `Merchant` 上的**经营**状态（ACTIVE/SUSPENDED）无关： 审核发生在商家还不存在的时候，封禁发生在商家已经存在之后。混成一个枚举会让 「驳回一份申请」和「封禁一家店」共用取值，两件事迟早互相踩。"
    MerchantCustomer: 
      type: "object"
      properties: 
        nickname: 
          type: "string"
          description: "客户昵称"
        avatar: 
          type: "string"
          description: "客户头像"
        orderCount: 
          type: "number"
          description: "在本店的累计下单次数"
        totalSpentMinor: 
          type: "number"
          description: "在本店的累计消费额（最小货币单位）"
        lastOrderAt: 
          type: "number"
          description: "最近一次下单时间"
        daysSinceLast: 
          type: "number"
          description: "距上次下单天数"
        silent: 
          type: "boolean"
          description: "沉默客户：曾经常来、最近没来。**这是店主唯一能立刻行动的信号**"
        source: 
          type: "string"
          enum: 
            - "MERCHANT_OWNED"
            - "PLATFORM"
          description: "客流来源：他是你自己带来的，还是平台分配的"
      required: 
        - "nickname"
        - "avatar"
        - "orderCount"
        - "totalSpentMinor"
        - "lastOrderAt"
        - "daysSinceLast"
        - "silent"
        - "source"
      additionalProperties: false
      description: "商家的客户（B-11.2.8）。\n\n这是「商家自带客流」定位下最该给店主看的东西：**谁在买、谁不来了**。 平台电商给商家看的是流量与转化；小店老板要的是「张阿姨上个月每周都来，这半个月没来」。"
    SpecOption: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "来自模板时有值；商家自己输入的没有"
        label: 
          type: "string"
          description: "选项展示文案，如「约5斤」"
      required: 
        - "label"
      additionalProperties: false
      description: "规格选项。\n\n`code` 是**能不能做规格聚合的分水岭**： 三家店卖同一种米，自由输入会写成「5斤」「五斤」「2.5kg」—— 这三个字符串在库里毫无关系，将来想做「按重量筛选 / 同规格比价」全部落空， 而且不可回溯（历史商品已经写死）。所以模板带来的值必须带 code。\n\n自由输入的值只有 label、没有 code：照常展示，但不参与聚合。\n**一期只写入不消费**，聚合搜索是二期 —— 但字段现在就得留位。"
    SpecTemplate: 
      type: "object"
      properties: 
        templateNo: 
          type: "string"
          description: "模板单号"
        scope: 
          type: "string"
          enum: 
            - "PLATFORM"
            - "MERCHANT"
          description: "模板归属：平台统一维护 or 商家自存。商家只能改自己的"
        categoryType: 
          "$ref": "#/components/schemas/CategoryType"
          description: "平台模板按类目推荐；商家模板不限类目"
        name: 
          type: "string"
          description: "规格维度名，如「重量」「香型」"
        options: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecOption"
          description: "该维度的可选项"
        merchantNo: 
          type: "string"
          description: "scope=MERCHANT 时归属的商家"
      required: 
        - "templateNo"
        - "scope"
        - "name"
        - "options"
      additionalProperties: false
      description: "规格模板。两层：   · PLATFORM —— 平台按类目预置，可聚合可筛选   · MERCHANT —— 商家把自己常用的存下来，第二次建品直接套\n\n⚠️ **模板是建议不是强制**：卖手工酱菜的没有匹配模板，硬要他选就只能瞎选。"
    MerchantLoginReqBody: 
      type: "object"
      properties: 
        grantType: 
          "$ref": "#/components/schemas/GrantType"
          description: "登录方式。**商家池与 C 端用户池是两套账号**，同一手机号登两端是两个身份"
        principal: 
          type: "string"
          description: "`WX_MINI`: wx.login code；`PHONE_OTP`: 手机号"
        credential: 
          type: "string"
          description: "`PHONE_OTP`: 验证码"
        agreed: 
          type: "boolean"
          description: "是否勾选了用户协议与隐私政策 —— 注册的合规前置，服务端要留痕。\n\n登录页一直在发（`{ ...req }` 把 `LoginReq.agreed` 带了出去），\n**漏的是这里没声明**，于是生成的 OpenAPI 里没有它，而后端 `LoginReq` 有。 这类漏声明比漏发更难发现：联调时一切正常，直到有人照着 spec 写另一个客户端。"
      required: 
        - "grantType"
        - "principal"
      additionalProperties: false
    MerchantApplyReqBody: 
      "$ref": "#/components/schemas/MerchantApplyReq"
      description: "入驻申请。字段与共享层的 `MerchantApplyReq` 一致，这里只是给契约一个稳定的 DTO 名"
    SaveStoreReqBody: 
      "$ref": "#/components/schemas/StoreProfile"
    ShareKitQuery: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "不传即整店分享素材；传了就是单品的"
      additionalProperties: false
    GoodsListQuery: 
      type: "object"
      properties: 
        page: 
          type: "number"
          description: "页码，从 1 起"
        size: 
          type: "number"
          description: "每页条数"
        status: 
          "$ref": "#/components/schemas/GoodsStatus"
          description: "按商品状态过滤。B 端能看到全部状态，C 端只看得到 ON_SALE"
      additionalProperties: false
    SaveGoodsReqBody: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号。新建时不传，编辑时必传"
        title: 
          type: "string"
          description: "基准语言（zh-CN）的标题。后端按 Accept-Language 下发时的兜底"
        subtitle: 
          type: "string"
          description: "基准语言（zh-CN）的副标题/卖点"
        titleI18n: 
          "$ref": "#/components/schemas/Record_string_string"
          description: "标题的三语原文，键是 Lang。缺译的语言按 R9 回落展示中文"
        subtitleI18n: 
          "$ref": "#/components/schemas/Record_string_string"
          description: "副标题的三语原文，同上"
        type: 
          "$ref": "#/components/schemas/CategoryType"
          description: "商品形态，决定履约与合规（生鲜要截单、服务不发货、iOS 可售规则）"
        categoryNo: 
          type: "string"
          description: "类目单号。选填，决定归类与经营准入 —— 与 `type` 是两个正交维度"
        cover: 
          type: "string"
          description: "封面图 URL（来自 mUploadImage）。漏传的话 C 端列表里是一块留白，且不报错"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "详情轮播图"
        specGroups: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecGroupDraft"
          description: "空数组 = 单规格。非空则 skus 必须是各组选项的笛卡尔积"
        skus: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SkuDraft"
          description: "SKU 列表。单规格商品也有且仅有一条"
      required: 
        - "title"
        - "subtitle"
        - "titleI18n"
        - "subtitleI18n"
        - "type"
        - "specGroups"
        - "skus"
      additionalProperties: false
      description: "保存商品的**线上格式**，与页面用的  {@link  GoodsDraft }  不同形状。\n\n<p>后端要的是「基准语言的那一份 + 三语 map」两个字段，而不是一个三语对象。 此前这里直接 `= GoodsDraft`，于是端上把 `title` 当对象发过去， 后端反序列化直接抛 —— **b-app 保存商品在真实后端上一次都没成功过**， 而 mock 上完全正常，所以没人发现。拍平在 `http.ts` 里做，页面不受影响。"
    SpecGroupDraft: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "规格维度名，如「重量」「香型」"
        options: 
          type: "array"
          items: 
            type: "string"
          description: "该维度的可选值"
        optionCodes: 
          type: "array"
          items: 
            anyOf: 
              - type: "string"
              - not: {}
          description: "与 options 一一对应的模板编码。来自平台模板的有值，手输/改过的为空。\n**一期只存不用** —— 但不存的话，二期做规格聚合要刷全部历史商品。"
        templateNo: 
          type: "string"
          description: "该规格组来自哪个平台模板。手输的为空"
      required: 
        - "name"
        - "options"
      additionalProperties: false
      description: "规格组草稿：一个维度（如「重量」）与它的取值（「5 斤」「10 斤」）"
    SkuDraft: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "已有 SKU 带上原编号，改价改库存不会丢历史订单的引用"
        optionValues: 
          type: "array"
          items: 
            type: "string"
          description: "各规格维度上的取值，顺序与 specGroups 一一对应"
        price: 
          type: "number"
          description: "当前市场的价（最小货币单位）。兼容单市场调用"
        priceByMarket: 
          "$ref": "#/components/schemas/Partial_Record_CurrencyCode_number"
          description: "**按市场分别定价**（B6）。未填的市场不在该市场售卖 —— 汇率换算出的价没有价格心理学（¥29.9 → $4.19 不是任何人会标的价）， 且汇率一动全店价格跟着抖，而商家并没有调价。"
        stock: 
          type: "number"
          description: "可售库存"
      required: 
        - "optionValues"
        - "price"
        - "stock"
      additionalProperties: false
      description: "SKU 草稿。`optionValues` 的顺序与 `specGroups` 一一对应 —— 这是矩阵的坐标，错位就会出现「5 斤卖成 10 斤的价」。"
    ToggleGoodsReq: 
      type: "object"
      properties: 
        onSale: 
          type: "boolean"
          description: "目标状态：true 上架、false 下架。下架后详情页仍可访问但不可下单"
      required: 
        - "onSale"
      additionalProperties: false
    SaveStockReq: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "要改库存的 SKU"
        stock: 
          type: "number"
          description: "改后的库存数。**是绝对值不是增量**"
      required: 
        - "skuNo"
        - "stock"
      additionalProperties: false
    UploadImageReq: 
      type: "object"
      properties: 
        tempPath: 
          type: "string"
          description: "端上的临时文件路径。真实实现走 multipart，这里是 mock 与 H5 的折中"
      required: 
        - "tempPath"
      additionalProperties: false
    RecognizeGoodsReq: 
      type: "object"
      properties: 
        imageUrl: 
          type: "string"
          description: "待识别的商品图 URL（先走 upload/image 拿到）。返回识别出的标题与类目建议"
      required: 
        - "imageUrl"
      additionalProperties: false
    SpecTemplatesQuery: 
      type: "object"
      properties: 
        categoryType: 
          type: "string"
          description: "按类目过滤平台模板；不传则返回全部 + 商家自存"
      additionalProperties: false
    SaveSpecTemplateReq: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "规格维度名，如「重量」"
        options: 
          type: "array"
          items: 
            type: "string"
          description: "可选值列表。存成商家自己的模板（scope=MERCHANT），不影响平台模板"
      required: 
        - "name"
        - "options"
      additionalProperties: false
    OrderListQuery: 
      type: "object"
      properties: 
        page: 
          type: "number"
          description: "页码，从 1 起"
        size: 
          type: "number"
          description: "每页条数"
        status: 
          "$ref": "#/components/schemas/OrderStatus"
          description: "按订单状态过滤，不传为全部"
      additionalProperties: false
    ShipReq: 
      type: "object"
      properties: 
        expressNo: 
          type: "string"
          description: "快递单号。填了即视为已发货，订单流转到 SHIPPED"
      required: 
        - "expressNo"
      additionalProperties: false
    SaveDeliveryRuleReqBody: 
      "$ref": "#/components/schemas/DeliveryRule"
    MarkArrivedReq: 
      type: "object"
      properties: 
        orderNos: 
          type: "array"
          items: 
            type: "string"
          description: "批量：一次到货通常是一整批，逐单调用会让通知发成 N 条"
      required: 
        - "orderNos"
      additionalProperties: false
    VerifyReq: 
      type: "object"
      properties: 
        verifyCode: 
          type: "string"
          description: "取货码。字段名必须是 `verifyCode` —— 后端 `BizPickupController.VerifyReq` 收的是它。 这里曾经写作 `code`：**路径对得上、body 对不上**，守卫只比路径看不出来， 联调时才会以 400 的形式暴露。"
        onBehalf: 
          type: "boolean"
          description: "代客核销（老人没带手机，店主代为确认）。留痕在服务端"
      required: 
        - "verifyCode"
      additionalProperties: false
    VerifyBatchReq: 
      type: "object"
      properties: 
        verifyCodes: 
          type: "array"
          items: 
            type: "string"
          description: "一批取货码。**逐条尝试、不整批回滚** —— 失败的逐条回报（见 `VerifyBatchResult`）， 否则一张废码会让另外几单白扫。"
      required: 
        - "verifyCodes"
      additionalProperties: false
      description: "批量核销（后端已实现 `/biz/pickup/verify/batch`）。高峰期一个个扫码是真实痛点"
    ReportShortageReq: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "出问题的 SKU"
        kind: 
          type: "string"
          enum: 
            - "SHORTAGE"
            - "DAMAGE"
          description: "问题类型：少件 / 破损。两者的售后责任判定不同"
        note: 
          type: "string"
          description: "情况说明。承接方填，供货方与平台据此定责"
      required: 
        - "skuNo"
        - "kind"
        - "note"
      additionalProperties: false
    HandleAfterSaleReq: 
      type: "object"
      properties: 
        remark: 
          type: "string"
          description: "驳回理由，**必填**（后端 `@NotBlank`）：用户拿不到理由只能升级平台， 平台再回头问商家，多绕一圈。 字段名是 `remark` 不是 `reply` —— 后端 `BizAfterSaleController.RejectReq` 收的是它。"
      required: 
        - "remark"
      additionalProperties: false
    CreateGroupReq: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "要开团的商品，必须是本店已上架商品"
      required: 
        - "goodsNo"
      additionalProperties: false
    QuoteReq: 
      type: "object"
      properties: 
        unitPriceMinor: 
          type: "number"
          description: "单价（最小货币单位）。名字带 unit 是有意义的：报的是单价不是总价"
        minQty: 
          type: "number"
          description: "起订量"
        note: 
          type: "string"
          description: "报价说明：规格、材质、是否含安装等，供发起人比价"
        validDays: 
          type: "number"
          description: "报价有效期（天）。后端不传时默认 7 天 —— 报价不能无限期挂着"
      required: 
        - "unitPriceMinor"
        - "minQty"
        - "note"
      additionalProperties: false
      description: "报价。四个字段名全部按后端 `BizQuoteController.QuoteReq` 对齐 —— 此前前端发的是 `{priceMinor, minCount, desc}`，后端收的是 `{unitPriceMinor, minQty, note, validDays}`，**没有一个对得上**，联调必 400。"
    ReplyReviewReq: 
      type: "object"
      properties: 
        reply: 
          type: "string"
          description: "回复内容。公开展示在评价下方，一条评价只能回一次"
      required: 
        - "reply"
      additionalProperties: false
    AppealReviewReq: 
      type: "object"
      properties: 
        reason: 
          type: "string"
          description: "申诉理由。这是**唯一**能把差评送进平台裁决台的入口"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "举证图：聊天记录、物流截图"
      required: 
        - "reason"
      additionalProperties: false
    SaveCampaignReqBody: 
      "$ref": "#/components/schemas/CampaignDraft"
    ToggleCampaignReq: 
      type: "object"
      properties: 
        running: 
          type: "boolean"
          description: "目标状态：true 启动、false 暂停。暂停不影响已领取的券"
      required: 
        - "running"
      additionalProperties: false
    PointsRecordQuery: 
      type: "object"
      properties: 
        period: 
          type: "string"
          description: "账期 `YYYYMM`，不传为当期"
        page: 
          type: "number"
          description: "页码，从 1 起"
        size: 
          type: "number"
          description: "每页条数"
      additionalProperties: false
    TogglePointsReq: 
      type: "object"
      properties: 
        enabled: 
          type: "boolean"
          description: "目标状态。**关闭只影响将来** —— 已发出的分仍有效，已扣的服务费不退"
      required: 
        - "enabled"
      additionalProperties: false
    SubmitPaymentReq: 
      type: "object"
      properties: 
        payChannel: 
          type: "string"
          description: "给哪个通道进件，如 WECHAT"
        settleAccountType: 
          type: "string"
          enum: 
            - "PERSONAL_OPENID"
            - "MERCHANT_ID"
          description: "结算账户形态。不传时后端按法律形态取默认（小微打个人、其余对公）"
        settleAccount: 
          type: "string"
          description: "结算账号明文。见上方说明：**不落库、不进日志、不回显**"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "资质图地址。小微免传，个体户与企业必传"
        contactName: 
          type: "string"
          description: "进件联系人。通道核对资料时联系他，不一定等于登录人"
        contactPhone: 
          type: "string"
          description: "进件联系电话"
      required: 
        - "payChannel"
        - "settleAccount"
      additionalProperties: false
      description: "提交收款进件。"
    StoreEditReq: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "门店名"
        address: 
          type: "string"
          description: "门店地址"
      required: 
        - "name"
      additionalProperties: false
      description: "新建/改名门店。门面其余部分（公告/营业时间/主推）走 SaveStoreReqBody"
    SetActiveReq: 
      type: "object"
      properties: 
        active: 
          type: "boolean"
          description: "true 启用 / false 停用"
      required: 
        - "active"
      additionalProperties: false
      description: "停用/启用（门店与员工共用同一个形状）"
    SetStorePaymentReq: 
      type: "object"
      properties: 
        payMerchantNo: 
          type: "string"
          description: "目标收款商户号。只能是本主体已开通的号；空 = 回到主体默认号"
      additionalProperties: false
      description: "换门店收款号。**不传或传空 = 回到主体默认号**，这是合法操作不是清空错误"
    AddStaffReq: 
      type: "object"
      properties: 
        loginPhone: 
          type: "string"
          description: "员工手机号（11 位）。**它就是登录号** —— 员工用它 + 验证码进 B 端"
      required: 
        - "loginPhone"
      additionalProperties: false
      description: "加员工。只要手机号 —— 不发密码、不建 C 端账号"
    GrantStoreReq: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "授权到哪家店。只能是本主体的门店"
        role: 
          type: "string"
          enum: 
            - "MANAGER"
            - "CLERK"
          description: "MANAGER 店长 / CLERK 店员；**传空 = 收回这家店的授权**"
      required: 
        - "storeNo"
      additionalProperties: false
      description: "授权到店。role 传空 = 收回这家店的授权"
    StaffLoginReq: 
      type: "object"
      properties: 
        phone: 
          type: "string"
          description: "员工的登录手机号（老板在员工管理里加的那个）"
        code: 
          type: "string"
          description: "短信验证码"
      required: 
        - "phone"
        - "code"
      additionalProperties: false
      description: "员工登录。与商家登录同形状，但打的是另一个端点、解析出的是另一套身份"
    Record_Lang_string: 
      type: "object"
      properties: 
        zh-CN: 
          type: "string"
        en: 
          type: "string"
        ar: 
          type: "string"
      required: 
        - "zh-CN"
        - "en"
        - "ar"
      additionalProperties: false
    Record_string_string: 
      type: "object"
      additionalProperties: 
        type: "string"
    Partial_Record_CurrencyCode_number: 
      type: "object"
      properties: 
        CNY: 
          type: "number"
        USD: 
          type: "number"
        AED: 
          type: "number"
      additionalProperties: false
paths: 
  "/biz/auth/otp/send": 
    post: 
      operationId: "mSendOtp"
      summary: "发送验证码"
      tags: 
        - "auth"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/void"
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/biz/auth/login": 
    post: 
      operationId: "mLogin"
      summary: "商家登录"
      tags: 
        - "auth"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/MerchantLoginResp"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/MerchantLoginReqBody"
  "/biz/auth/staff-login": 
    post: 
      operationId: "mStaffLogin"
      summary: "员工登录"
      tags: 
        - "auth"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/MerchantLoginResp"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/StaffLoginReq"
  "/biz/merchant/profile": 
    get: 
      operationId: "mProfile"
      summary: "商家资料"
      tags: 
        - "merchant"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/MerchantProfile"
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/biz/merchant/apply": 
    post: 
      operationId: "mApply"
      summary: "提交入驻申请"
      tags: 
        - "merchant"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/MerchantProfile"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/MerchantApplyReqBody"
    get: 
      operationId: "mApplyDraft"
      summary: "上次入驻申请"
      tags: 
        - "merchant"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/MerchantApplyReq"
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/common/master-data": 
    get: 
      operationId: "mMasterData"
      summary: "平台主数据（行业/主体/通道）"
      tags: 
        - "master-data"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
