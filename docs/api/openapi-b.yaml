        pickupNo: 
          type: "string"
          description: "自提点单号"
        pickupName: 
          type: "string"
          description: "自提点名称"
        pendingVerify: 
          type: "number"
          description: "待核销单数 —— 到货了还没人来取的"
        arrivedBatches: 
          type: "number"
          description: "今日到货批次"
        serviceFeeMinor: 
          type: "number"
          description: "累计履约服务费（最小货币单位）"
