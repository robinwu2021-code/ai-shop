          type: "number"
          description: "综合评分，0–5，保留一位小数。**0 分要配合 `ratingCount` 一起看**"
        ratingCount: 
          type: "number"
          description: "参与评分的评价条数"
        verified: 
          type: "boolean"
          description: "是否通过资质认证"
        breachCount: 
          type: "number"
          description: "选定报价后不履约的次数。>0 会在报价卡上公示 —— 事后信用替代事前审核"
        type: 
          "$ref": "#/components/schemas/MerchantType"
          description: "商家类型：平台自营 / 企业 / 个体"
        desc: 
          type: "string"
          description: "店铺简介"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "经营范围 —— 邻里购物的核心约束：**商家是有服务半径的**。 隔壁区的生鲜店对我没有意义，它送不到我的自提点。见 SERVICE_SCOPE。"
        serviceCommunityNos: 
          type: "array"
          items: 
            type: "string"
          description: "覆盖哪些社区。**仅 scope=COMMUNITY 时有意义**，其余情况忽略"
        serviceCityCode: 
          type: "string"
          description: "覆盖哪个城市。**仅 scope=CITY 时有意义**"
        distance: 
          type: "number"
          description: "距当前社区的距离（米）。由服务端按用户当前社区算好下发，端上不自己算"
        salesCount: 
          type: "number"
          description: "累计订单量（评分权重之一）"
        goodsCount: 
          type: "number"
          description: "在售商品数"
        address: 
          type: "string"
          description: "店铺地址。纯线上商家可能没有"
        openHours: 
          type: "string"
          description: "营业时间文案"
        joinedAt: 
          type: "number"
          description: "入驻时间"
        tags: 
          type: "array"
          items: 
            type: "string"
          description: "店铺标签，如「生鲜」「次日达」。展示用，不参与筛选"
        scores: 
          type: "object"
          properties: 
            goods: 
              type: "number"
            service: 
              type: "number"
            speed: 
              type: "number"
          required: 
            - "goods"
            - "service"
            - "speed"
          additionalProperties: false
          description: "分维度评分：商品/服务/时效"
      required: 
        - "breachCount"
        - "desc"
        - "goodsCount"
        - "joinedAt"
        - "logo"
        - "merchantNo"
        - "name"
        - "rating"
        - "ratingCount"
        - "salesCount"
        - "scores"
        - "serviceCommunityNos"
        - "serviceScope"
        - "tags"
        - "type"
        - "verified"
      additionalProperties: false
    SettleAccountType: 
      type: "string"
      enum: 
        - "PERSONAL_BANK_CARD"
        - "MERCHANT_ID"
      description: "结算账户形态。个人 openid 收款 / 对公商户号收款（ADR-002 §5）"
    PaymentApplyStatus: 
      type: "string"
      enum: 
        - "NONE"
        - "APPLYING"
        - "ACTIVE"
        - "REJECTED"
        - "FROZEN"
      description: "支付**进件**状态（`MerchantPayment.applyStatus`）。\n\n⚠️ 此前叫 `ApplyStatus`，与入驻审核的 `ApplyStatus` 同名不同义 —— `ACTIVE`/`FROZEN` 两个值就是证据：审核不会有这两个态。"
    PlanStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "GRACE"
        - "EXPIRED"
      description: "增值包订阅状态。\n\n`GRACE`（宽限期，7 天）**能力全保留** —— 到期当天就压店的话， 一次忘记续费等于让他的店在客户面前消失，而他往往正在门店里忙。"
    StaffStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "DISABLED"
      description: "员工账号状态"
    StaffRole: 
      type: "string"
      enum: 
        - "MANAGER"
        - "CLERK"
        - "PICKER"
        - "COURIER"
        - "CS"
      description: "门店角色（B 端）。**一人一店可持有多个**，权限取并集。\n\n分界线画在「出错的后果」上，而不是功能重要性 —— 履约被拆成三种活，因为它们面对的对象不同：分拣对货、核销对顾客、发货对收件人。 拆开之后理货员与配送员才装得下。判断依据见 `docs/requirements/三端角色权限功能对齐清单.md` §4。\n\n⚠️ `CS` 与运营端的 `Role.CS` **同名不同义**：这个是商家自己雇的客服（只管自己店）， 那个是平台客服（跨商家、能仲裁）。\n\n老板不在这里 —— 他是 `isOwner`，不需要逐店授权。"
    BizScope: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "当前用户所属的商家主体"
        currentStoreNo: 
          type: "string"
          description: "当前选中的门店。\n\n**切门店后要重新拉这个接口** —— 角色跟着门店走：同一个人可能在 A 店是店长、 B 店是店员，权限跟着变。不重拉的话，界面按上一家店的权限渲染。"
        owner: 
          type: "boolean"
          description: "是不是老板（主体所有者）。老板不受门店角色限制"
        storeNos: 
          type: "array"
          items: 
            type: "string"
          description: "我能管哪些门店。空 = 只能看当前这家"
        pickupNos: 
          type: "array"
          items: 
            type: "string"
          description: "我能核销哪些自提点"
        groupNos: 
          type: "array"
          items: 
            type: "string"
          description: "我发起了哪些团。**第三个作用域**，与门店 / 自提点正交"
        staffRoles: 
          type: "array"
          items: 
            anyOf: 
              - "$ref": "#/components/schemas/StaffRole"
              - type: "string"
                const: "OWNER"
          description: "我在**当前门店**持有的角色（可多个）。老板恒为 `[\"OWNER\"]`"
        categoryCodes: 
          type: "array"
          items: 
            type: "string"
          description: "主体已获批的经营类目码（如 `[\"FRESH_VEG\"]`）。\n\n**与门店货架是两件事**：这是平台批的证（能不能卖这一类）， 货架是商家自己摆的（店里怎么摆）。"
        switches: 
          "$ref": "#/components/schemas/Record_string_boolean"
          description: "平台开关里与商家侧有关的那几个（后端 `/biz/context` 下发）。\n\n<p>`categoryGate`：类目资质校验**是否真的拦人**。\n\n<p>此前这是 `b-app/src/shared/flags.ts` 里的编译期常量，运营改一次开关要重新 打包发版；更糟的是它与后端那份不同步时，症状是「点不动一个其实能按的按钮」 或者「点下去吃一句说不清缘由的报错」—— 两种都难查，因为界面与后端各自看起来都对。\n\n<p>取不到时按 **false（不拦）** 处理：与后端默认值一致，且宁可放行也不要 凭一个拿不到的开关把商家挡在门外。"
        perms: 
          type: "array"
          items: 
            type: "string"
          description: "这些角色合起来的权限码，**已取并集**（老板是 `[\"*\"]`）。\n\n端上照它裁剪入口，**不要自己按角色再推一遍** —— 两处各推一次迟早分岔， 而分岔的表现是「看得见但点了报错」。"
      required: 
        - "merchantNo"
        - "currentStoreNo"
        - "owner"
        - "storeNos"
        - "pickupNos"
        - "groupNos"
        - "staffRoles"
        - "perms"
      additionalProperties: false
      description: "我在**当前门店**能做什么（`GET /biz/context`）。B 端每次会话恢复与切门店后都要重取。"
    SettleBillStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "SPLITTING"
        - "SPLIT"
        - "SPLIT_CONFIRMED"
        - "OFFLINE_SETTLED"
        - "PENDING_RECON"
        - "CONFIRMED"
        - "PAID"
        - "RETRYING"
        - "MANUAL"
        - "REVERSED"
      description: "结算流水状态。**与后端 `StlBill` 逐字一致**。\n\n> 2026-08-11 收敛：这里此前是 `PENDING/PARTIAL/DONE/EXPIRED` —— 一套后端从来没有过的词， > 描述的是「周期账单」而不是「按子单的分账流水」。内联时对所有工具不可见， > 具名化之后才暴露出来（见 enum-registry 里这条的 note）。\n\n- `PENDING` 待分账 · `SPLITTING` 分账中\n- `SPLIT` **指令已发出，等通道确认** · `SPLIT_CONFIRMED` **已到账**（终态）\n- `RETRYING` 失败重试中 · `MANUAL` 转人工（重试用尽，**不会自动再动钱**）\n- `REVERSED` 已回退（退款前必须先回退分账）\n- `OFFLINE_SETTLED` 当面收款，不走分账（钱从没进过平台）\n- 自营轨道：`PENDING_RECON` 待对账 · `CONFIRMED` 已确认应付 · `PAID` 已付款（自营终态）\n\n⚠️ **两条轨道互不相通**：第三方的单不会走到 `PAID`，自营的单不会走到 `SPLIT` —— 它们的钱根本不是同一条路径下去的。此前 shared 这份漏了自营那三个值， 于是 b-app 判 `status === \"PAID\"` 时类型说「不可能」，而后端一直在下发。\n\n⚠️ **`SPLIT` 曾经同时表示「指令已发出」与「钱已到」**，而底下调的是桩实现 —— 账面显示已分账而一分钱没动。2026-08-26 拆开：`SPLIT` 退回「已发出」， 到账另立 `SPLIT_CONFIRMED`，且**只能由通道回执产生**。 端上措辞跟着改：`SPLIT` 不能再叫「已结算」—— 商家拿它去对银行流水，对不上就来找客服，而客服看到的状态也是同一个词。"
    MerchantApplyReviewStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "REVIEWING"
        - "APPROVED"
        - "REJECTED"
      description: "入驻申请的审核状态。与库 `mch_entity_apply.status` 逐字一致。 ⚠️ 与  {@link  MerchantStatus } （B 端「我能不能干活」的合并视图）不是一回事。"
    IncomeSummary: 
      type: "object"
      properties: 
        receivedMinor: 
          type: "number"
          description: "已到账：通道回执确认过的"
        inFlightMinor: 
          type: "number"
          description: "已发起、等通道确认。**此前它混在「已到账」里**，而底下是桩"
        pendingMinor: 
          type: "number"
          description: "待结算"
        offlineMinor: 
          type: "number"
          description: "当面收款：**他早就拿到了**，无需结算"
        inFlightCount: 
          type: "number"
          description: "在途的结算单数。金额之外还要给条数 —— 一笔大的和十笔小的，商家的处理方式不同"
        oldestInFlightAt: 
          type: 
            - "number"
            - "null"
          description: "最早一笔在途的发起时刻。**「卡了多久」是商家真正想问的**"
      required: 
        - "receivedMinor"
        - "inFlightMinor"
        - "pendingMinor"
        - "offlineMinor"
        - "inFlightCount"
      additionalProperties: false
      description: "商家收入按状态汇总。\n\n⚠️ **四个数是四种状态，不是四个口袋** —— 它们加起来等于全部结算单。 结算页此前只显示一个「商家实得」，读起来像已到手：商家拿它去对银行流水， 对不上就来找客服，而客服看到的状态也只有一个词。"
    MerchantCapability: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号"
        merchantName: 
          type: "string"
          description: "商家名，展示用"
        invoiceCapable: 
          type: "boolean"
          description: "能否开票"
        payMethods: 
          type: "array"
          items: 
            type: "string"
          description: "该商家支持的支付方式；**空 = 未配置**（进件还没走完），不是「一种都不支持」"
        quotaExhausted: 
          type: "boolean"
          description: "本期收款额度已用尽 —— 这家的货现在下不了单"
        quotaWouldExceed: 
          type: "boolean"
          description: "加上本车这些货会超额 —— 还没用尽，但这一单过不去"
      required: 
        - "merchantNo"
        - "merchantName"
        - "invoiceCapable"
        - "payMethods"
        - "quotaExhausted"
        - "quotaWouldExceed"
      additionalProperties: false
    MerchantStatus: 
      type: "string"
      enum: 
        - "NONE"
        - "APPLYING"
        - "REVIEWING"
        - "REJECTED"
        - "PENDING_LICENSE"
        - "ACTIVE"
        - "SUSPENDED"
      description: "商家在 B 端的**综合状态**：既要表达「还没入驻成功」，也要表达「已经在经营」。\n\n⚠️ 它是一个**展示用的合并视图**，底下是两条互不相干的生命周期：   · 审核（`MerchantApplyStatus`）—— 商家还不存在时的事，归 `usr_merchant_apply`   · 经营（ACTIVE / SUSPENDED）—— 商家已存在之后的事，归 `usr_merchant.status`\n\nB 端首页要在一个地方回答「我现在能不能做生意」，所以合并； 但**库里绝不能合并** —— 一旦合并，「驳回一份申请」和「封禁一家店」就共用取值， 而这两件事的操作人、审计口径、可逆性全都不同。"
    MerchantTier: 
      type: "string"
      enum: 
        - "SMALL"
        - "MEDIUM"
        - "LARGE"
      description: "商家分层。为「流量起来后引入大商家」预留，一期只用 SMALL（ADR-004 §7）"
    MerchantProfile: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号"
        name: 
          type: "string"
          description: "店铺名"
        logo: 
          type: "string"
          description: "店铺 logo"
        status: 
          "$ref": "#/components/schemas/MerchantStatus"
          description: "入驻审核状态。非 ACTIVE 时 B 端只能看到入驻流程页"
        subject: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型"
        tier: 
          "$ref": "#/components/schemas/MerchantTier"
          description: "商家分层。一期恒为 SMALL"
        phone: 
          type: "string"
          description: "登录手机号，也是商家账号的主标识"
        isPickupPoint: 
          type: "boolean"
          description: "是否承接自提点 —— 决定 B 端是否出现「履约台」入口（ADR-005）"
        pickupNo: 
          type: "string"
          description: "承接的自提点单号。`isPickupPoint=true` 时有值"
        rejectReason: 
          type: "string"
          description: "驳回原因，status=REJECTED 时有值"
        loginBy: 
          "$ref": "#/components/schemas/GrantType"
          description: "本次会话的登录方式。第三方登录且 phone 为空时，要引导补绑手机号"
        fundsMode: 
          "$ref": "#/components/schemas/FundsMode"
          description: "资金路径。**B 端价格字段叫什么由它决定** —— 归集（钱进平台账户）下平台是销售主体、最终售价平台定，商家填的是「期望收购价」； 直连下他自己就是销售主体，那就是「售价」。\n\n判据用它而不是门店的 `businessMode`：与积分能力同一根轴 —— **责任跟着钱走**。\n\n还没进件的申请人为空：那时资金路径尚未确定， 猜一个默认值会让他在入驻页看到一个还轮不到他的字段名。"
      required: 
        - "merchantNo"
        - "name"
        - "logo"
        - "status"
        - "subject"
        - "tier"
        - "phone"
        - "isPickupPoint"
      additionalProperties: false
      description: "登录后的商家会话"
    GrantType: 
      type: "string"
      enum: 
        - "WX_MINI"
        - "WX_PHONE"
        - "WX_OPEN"
        - "PHONE_OTP"
        - "APPLE"
        - "PASSWORD"
      description: "登录方式。 · WX_MINI  小程序静默登录（只拿 openid，拿不到手机号） · WX_PHONE 小程序一键取手机号（推荐：一次授权直接拿到号，省掉短信） · WX_OPEN  App 微信开放平台 · APPLE    Apple 登录（iOS 上架硬要求） · PHONE_OTP 手机号 + 短信验证码（全端兜底，也是商家账号的主标识） · PASSWORD  手机号 + 密码（**只有 B 端有**）。商家一天开好几次 App，   每次等一条短信是实打实的摩擦；而它与其它方式最本质的差别是**不建户** ——   能用密码登录的前提是他已经设过密码，而设密码本身要先登录。"
    MerchantLoginResp: 
      type: "object"
      properties: 
        token: 
          type: "string"
          description: "访问令牌。**商家池与 C 端用户池是两套账号**，token 不通用"
        merchant: 
          "$ref": "#/components/schemas/MerchantProfile"
          description: "商家档案"
      required: 
        - "token"
        - "merchant"
      additionalProperties: false
    QualificationType: 
      type: "string"
      enum: 
        - "BUSINESS_LICENSE"
        - "FOOD_PERMIT"
        - "FOOD_WORKSHOP"
        - "OTHER"
      description: "资质类型码。取值同后端 `mch_qualification.qual_type`。\n\n⚠️ **`BUSINESS_LICENSE` 是入驻校验的判据** —— 需要执照的档位必须含它， 改名会让那条校验静默失效（找不到就当没传，然后放行）。"
    QualificationItem: 
      type: "object"
      properties: 
        type: 
          "$ref": "#/components/schemas/QualificationType"
          description: "资质类型码"
        code: 
          type: "string"
          description: "证照编号"
        imageUrl: 
          type: "string"
          description: "证件照地址"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "有效期截止（毫秒）。**长期有效传 `null`** —— 不要用 0 或一个很大的数字冒充：过期扫描会把前者当成已过期、 后者当成永不过期，两种都错且都不报错。"
        issuer: 
          type: "string"
          description: "发证机关"
      required: 
        - "type"
        - "code"
        - "imageUrl"
        - "expireAt"
      additionalProperties: false
    Qualification: 
      type: "object"
      properties: 
        qualNo: 
          type: "string"
          description: "资质记录号"
        entityNo: 
          type: "string"
          description: "归属主体。端上其实用不到（只会看自己的），但后端在发 —— 声明出来免得契约守卫把它算成缺口"
        qualType: 
          "$ref": "#/components/schemas/QualificationType"
          description: "证件类型。**BUSINESS_LICENSE 是入驻校验的判据**"
        qualName: 
          type: "string"
          description: "证件名，如「食品经营许可证」。上架校验拿它与类目门槛的文案比对"
        qualNumber: 
          type: 
            - "string"
            - "null"
          description: "证件编号，证上印的那一串"
        imageUrl: 
          type: 
            - "string"
            - "null"
          description: "证件照地址"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "有效期截止（毫秒）。**空 = 长期有效**，与「已过期」是两回事"
        status: 
          type: "string"
          description: "VALID / EXPIRED / REVOKED"
      required: 
        - "qualNo"
        - "qualType"
        - "qualName"
        - "status"
      additionalProperties: false
      description: "已登记的一张资质（`mch_qualification`）。\n\n与  {@link  QualificationItem }  的差别：那个是**入驻申请时提交的**（还没入库）， 这个是**已经登记在案的**（有编号、有状态、能被上架校验读到）。"
    QualificationSaveReq: 
      type: "object"
      properties: 
        qualNo: 
          type: "string"
          description: "资质记录号。**为空 = 新增**"
        qualType: 
          "$ref": "#/components/schemas/QualificationType"
          description: "证件类型。**BUSINESS_LICENSE 是入驻校验的判据** —— 需要执照的档位必须含它"
        qualName: 
          type: "string"
          description: "证件名（「食品经营许可证」）。展示用"
        qualNumber: 
          type: "string"
          description: "证件编号，证上印的那一串"
        imageUrl: 
          type: "string"
          description: "图片地址"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "到期时刻（毫秒）。**到期前要提醒** —— 证件过期而没人发现，那家店会在某天突然卖不了货"
        entityNo: 
          type: "string"
          description: "传给哪张证照，可空 = 当前证照。多证照的老板从证照详情页进来时会带上它"
      required: 
        - "qualType"
        - "qualName"
      additionalProperties: false
      description: "传一张证。`qualNo` 为空即新建"
    AuthCodeInfo: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "码值"
        name: 
          type: "string"
          description: "名称"
        requiredQualification: 
          type: 
            - "string"
            - "null"
          description: "给人读的一句话，如「食品经营许可证」。空 = 这一类不需要证"
        qualType: 
          anyOf: 
            - "$ref": "#/components/schemas/QualificationType"
            - type: "null"
          description: "机器判的类型，与  {@link  QualificationType }  同值域。空 = 无需证件"
        categoryNames: 
          type: "array"
          items: 
            type: "string"
          description: "这个码能解锁的类目名。**由应用层拼** —— 商家看的是「食品经营许可证能解锁：肉禽蛋、乳制品」，不是三个码"
      required: 
        - "code"
        - "name"
        - "categoryNames"
      additionalProperties: false
      description: "门槛码字典的一条：这个码要哪一类证、对应哪些类目。\n\n`categoryNames` 由**应用层**拼（商家域不读商品域的类目，见 `CategoryUsagePort` 的说明）—— 商家看的是「食品经营许可证能解锁：肉禽蛋、乳制品、熟食卤味」， 而不是三个码。"
    MyQualifications: 
      type: "object"
      properties: 
        items: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Qualification"
          description: "我已经有的资质"
        grantedCodes: 
          type: "array"
          items: 
            type: "string"
          description: "已获授权的类目码。端上据此把「已解锁 / 待授权」标出来"
        catalog: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/AuthCodeInfo"
          description: "平台的门槛码字典：哪些码要哪一类证"
      required: 
        - "items"
        - "grantedCodes"
        - "catalog"
      additionalProperties: false
      description: "「我的资质」这一页要的三份数据。"
    MerchantApplyReq: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "拟用店铺名"
        subject: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型。个人 → 个体户 → 企业，门槛前低后高"
        contactName: 
          type: "string"
          description: "联系人姓名。审核要打电话找人，只有号码没有姓名不合适"
        contactPhone: 
          type: "string"
          description: "联系手机号"
        category: 
          type: "string"
          description: "主营类目"
        desc: 
          type: "string"
          description: "店铺简介"
        asPickupPoint: 
          type: "boolean"
          description: "承接自提点：小店既是供给方也是取货点（ADR-005 type=STORE）"
        qualificationItems: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/QualificationItem"
          description: "结构化资质。**可选**：老版本端上还在只传 `licenses`， 后端对未传该字段的请求跳过执照校验（见 `OpsServiceImpl.requireLicenseIfNeeded`）—— 校验必须晚于能满足它的 UI 上线，否则拦的不是坏商家，是所有人。"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "期望经营范围（ADR-009）。申请时可空，<b>审核通过时必须确定</b> —— 否则商家上着架却对谁都不可见，且没有任何报错。"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "期望覆盖的社区。scope=COMMUNITY 时审核通过必须非空"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "资质图片（营业执照/身份证）。**选填** —— 一期 EDI 不强制。\n\n与下面的结算账户一样，属于**分账主体开户**而不是入驻申请本身（ADR-002）： `usr_merchant_payment` 是独立一张表、有自己的 `apply_status`，就是这个道理。 申请时能传就传，通过后在 B 端补也行 —— 逼一个还没通过审核的人先传营业执照， 只会把人挡在门外。"
        settleAccountType: 
          "$ref": "#/components/schemas/SettleAccountType"
          description: "结算账户类型。真实账号由后端持有，C 端与 B 端都不回显（ADR-002 §5）。**选填**，同上"
        industry: 
          type: "string"
          description: "行业（`sys_industry.industry`）。\n\n**它决定这家店能不能以小微主体进件** —— 微信的小微白名单是按行业给的， 也是 `points_forced` 默认值的来源。\n\n后端一直在收、库里一直有这一列，但契约没登记、端也没传， 于是 `mch_entity.industry` 恒空：进件时才发现主体类型选错了， 而那时商家已经开完店、上完架。"
      required: 
        - "name"
        - "subject"
        - "contactName"
        - "contactPhone"
        - "category"
        - "desc"
      additionalProperties: false
    MasterData: 
      type: "object"
      properties: 
        industries: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MasterDataIndustry"
          description: "可选行业。**决定能不能以小微主体进件**，也是 points_forced 默认值的来源"
        subjects: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MasterDataSubject"
          description: "可选主体类型（法律形态）。决定资质要求与结算账户形态"
        channels: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MasterDataChannel"
          description: "可用支付通道与其能力位"
        serviceScopes: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/ServiceScope"
          description: "**这一期开放的经营范围档位**（`SERVICE_SCOPE` 的启用子集，运营在后台配）。\n\n端上要照它渲染选项，**不要把三档写死**。写死的后果不是「多了个选项」： 一期自营模式关掉了 `PLATFORM`，而 B 端照样把「全平台发货」摆在那里， 商家点下去得到的是「当前不支持这个经营范围」—— 一个必被拒的选项， 而他无从知道自己该选什么。2026-08-11 的端到端实测撞到过。\n\n拿到 EDI 切平台模式时运营在后台放开，端上不发版就跟着变 —— 这正是它下发而不是写死的理由。"
      required: 
        - "industries"
        - "subjects"
        - "channels"
        - "serviceScopes"
      additionalProperties: false
      description: "平台主数据快照（`GET /common/master-data`）。\n\n合成一个响应而不是三条接口，是因为它们在**同一屏上被同时用到**： 「选行业 → 据此过滤可选主体 → 主体决定要不要传营业执照」。 分三次请求会出现「行业回来了、主体还没回来」的中间态， 而那个中间态里表单不知道该不该禁用某个选项。"
    MasterDataIndustry: 
      type: "object"
      properties: 
        industry: 
          type: "string"
          description: "行业码（`sys_industry.industry`），提交申请时回传的就是它"
        name: 
          type: "string"
          description: "展示名。**取服务端的**，不要在端上再维护一份翻译"
        microAllowed: 
          type: "boolean"
          description: "该行业能否以小微主体进件。**false 时小微选项要禁用**，不是提交后才报错"
      required: 
        - "industry"
        - "name"
        - "microAllowed"
      additionalProperties: false
    MasterDataSubject: 
      type: "object"
      properties: 
        subjectType: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型码"
        name: 
          type: "string"
          description: "展示名"
        needLicense: 
          type: "boolean"
          description: "要不要传营业执照"
        industryGated: 
          type: "boolean"
          description: "是否受行业白名单管控（小微受管，其余不受）"
        settleAccountType: 
          "$ref": "#/components/schemas/SettleAccountType"
          description: "该主体默认的结算账户形态：小微打个人，其余打对公"
      required: 
        - "subjectType"
        - "name"
        - "needLicense"
        - "industryGated"
        - "settleAccountType"
      additionalProperties: false
    MasterDataChannel: 
      type: "object"
      properties: 
        payChannel: 
          type: "string"
          description: "通道码（`sys_pay_channel.pay_channel`），如 WECHAT"
        name: 
          type: "string"
          description: "展示名"
        enabled: 
          type: "boolean"
          description: "通道是否可用。关掉时下单页不给这个支付方式，而不是点了才失败"
        payMethods: 
          type: "array"
          items: 
            type: "string"
          description: "该通道支持的支付方式，如 JSAPI / APP / H5"
      required: 
        - "payChannel"
        - "name"
        - "enabled"
        - "payMethods"
      additionalProperties: false
    PaymentApplyment: 
      type: "object"
      properties: 
        payChannel: 
          type: "string"
          description: "通道码，如 WECHAT"
        channelName: 
          type: "string"
          description: "通道展示名。取服务端的，端上不要再维护一份翻译"
        applyStatus: 
          "$ref": "#/components/schemas/PaymentApplyStatus"
          description: "NONE / APPLYING / ACTIVE / REJECTED / FROZEN"
        canReceiveMoney: 
          type: "boolean"
          description: "这个通道现在能不能收钱。\n\n**照着它显示，不要自己去比 applyStatus** —— 比错的表现是 「显示能收钱但收不了」，而这种错要到第一笔订单才暴露。"
        payMerchantNo: 
          type: "string"
          description: "收款商户号业务键，通过后才有。门店挂收款号引用的就是它"
        subMchidMasked: 
          type: "string"
          description: "二级商户号掩码。完整号不回显"
        settleAccountType: 
          "$ref": "#/components/schemas/SettleAccountType"
          description: "结算账户形态：小微打个人（PERSONAL_BANK_CARD），其余打对公（MERCHANT_ID）"
        settleAccountMasked: 
          type: "string"
          description: "结算账号掩码。**明文永不回显**，包括给商家自己（ADR-002 §5）"
        rejectReason: 
          type: "string"
          description: "驳回原因。驳回时必有 —— 没有原因商家只能反复重提"
        missing: 
          type: "array"
          items: 
            type: "string"
          description: "还缺哪些资料（settleAccount / licenses / settleAccountType）。空 = 资料齐了在等通道"
        submitted: 
          type: "boolean"
          description: "**有没有真的发给通道过。**\n\n<p>没有它，`APPLYING` 同时表示两件相反的事：入驻通过时建的占位（商家还没填过 任何东西）与「已发给通道、在等回执」。都显示成「审核中」的话，新商家读到的是 球在平台，而球其实在他自己脚下 —— 这正是「不能收钱」最常卡死的一步。"
        appliedAt: 
          type: "number"
          description: "提交进件的时间。没提交过为空"
        activatedAt: 
          type: "number"
          description: "通道开户完成的时间 —— 从这一刻起才真的能收钱"
        storeNo: 
          type: "string"
          description: "这条进件是**为哪家门店**做的；空 = 主体级默认号。\n\n多门店商家会有多条「微信 · 已开通」，不显示门店就分不清哪条是哪家店 —— 等于让他猜自己的钱打进了哪张卡。"
      required: 
        - "payChannel"
        - "channelName"
        - "applyStatus"
        - "canReceiveMoney"
        - "missing"
        - "submitted"
      additionalProperties: false
      description: "收款进件状态（每通道一条）。\n\n<p><b>它与入驻审核是两件事</b>：入驻过了店就能开、货能上架， 但通道没批就收不了钱。合成一个「入驻进度」，商家问「我能收钱了吗」就没法回答。"
    Entity: 
      type: "object"
      properties: 
        entityNo: 
          type: "string"
          description: "商家主体号"
        name: 
          type: "string"
          description: "执照上的名称。**待补证照时它是老板随手填的店名**—— 补齐执照、审核通过后被执照上的正式名称覆盖"
        status: 
          "$ref": "#/components/schemas/MerchantStatus"
          description: "ACTIVE 营业中 / PENDING_LICENSE 待补证照 / SUSPENDED、BANNED 已停业。\n**端上照它给下一步**：待补证照给「去补执照」，已停业给客服入口"
        verified: 
          type: "boolean"
          description: "平台已认证。待补证照恒为 false —— 这个标是审核给的，不能自己开店就带上"
        legalForm: 
          type: "string"
          description: "个体户 / 有限公司…… 待补证照时为空，那时还不知道是哪种"
        storeCount: 
          type: "number"
          description: "这张证照下**我能进**的门店数。老板 = 全部；店员 = 只数被授权到的那几家"
        isPrimary: 
          type: "boolean"
          description: "默认证照。不带 `X-Store-No` 时后端解析到的就是它"
        canManage: 
          type: "boolean"
          description: "我是不是这张证照的持有人。**只有持有人能改资料、交执照、挂收款号**"
      required: 
        - "entityNo"
        - "name"
        - "status"
        - "verified"
        - "storeCount"
        - "isPrimary"
        - "canManage"
      additionalProperties: false
      description: "一张**证照**（营业执照）。库里叫 `mch_entity`，**对外一律叫「证照」**—— 老板不认识「主体」「实体」这两个词。"
    EntityStores: 
      type: "object"
      properties: 
        entity: 
          "$ref": "#/components/schemas/Entity"
          description: "所属主体（一张证照）"
        stores: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Store"
          description: "这张证照下我能进的门店"
      required: 
        - "entity"
        - "stores"
      additionalProperties: false
      description: "一张证照 + 它下面我能进的门店。门店选择器按这个分组渲染。\n\n**为什么分组而不是拍平**：两家店同名是常事（「文三路店」在两张执照下各有一家）， 拍平之后点哪个都不知道进了哪张证照，而进错的表现是「商品怎么全没了」。"
    Store: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号。一旦生成不再变 —— 换主体只换归属，不换它"
        name: 
          type: "string"
          description: "门店名"
        address: 
          type: "string"
          description: "门店地址。顾客据此找到取货点，也是履约范围的锚点"
        isDefault: 
          type: "boolean"
          description: "是否默认店。一个主体**恰好一家** —— 它是「找不到具体门店时去哪」的答案"
        status: 
          "$ref": "#/components/schemas/StoreStatus"
          description: "ACTIVE 正常营业 / READONLY 已停用（不再接新单，已有单照常履约）"
        payMerchantNo: 
          type: "string"
          description: "这家店用哪个收款号。**空 = 用主体的默认收款号**，不是\"没配\""
        payReady: 
          type: "boolean"
          description: "这家店现在能不能收钱。照它显示，别自己去比状态串"
        staffCount: 
          type: "number"
          description: "授权到这家店的员工数（不含老板）。0 表示只有老板能管这家店"
        rating: 
          type: "number"
          description: "门店评分 ×10（V155）。与主体评分是两个数：主体分是各店的合成，反过来推不回去"
        ratingCount: 
          type: "number"
          description: "计入门店评分的条数。**0 = 暂无评价**，不是 0 分"
        planSuspended: 
          type: "boolean"
          description: "这家店的只读**是套餐降级压下来的**，不是店主自己停的。\n\n<p>两者的 `status` 一模一样（都是 `READONLY`），而端上要给的下一步完全不同： 降级压的要**补缴/升档**，自己停的**点一下启用就开**。 不分开的表现是店主反复点那个对降级店无效的启用按钮。"
      required: 
        - "storeNo"
        - "name"
        - "isDefault"
        - "status"
        - "payReady"
        - "staffCount"
      additionalProperties: false
    StoreStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "READONLY"
      description: "门店状态。READONLY = 已停用（不再接新单，已有单照常履约）"
    MerchantStaff: 
      type: "object"
      properties: 
        mchAccountNo: 
          type: "string"
          description: "商家账号号。**不叫 staffNo** —— 那个名字被平台运营占着，两者是不同的人"
        displayName: 
          type: "string"
          description: "姓名（老板自己写的，如「小张」）。**认人靠它** —— 一列号码谁也分不清。为空时端上回落 `loginPhone`。"
        loginPhone: 
          type: "string"
          description: "登录手机号，**完整、不脱敏**。\n\n它**就是这个员工的登录用户名**（手机号 + 验证码，没有密码）—— 老板要能核对「他用哪个号登录」、人换号时要能改，脱敏之后这两件事都做不了。"
        isOwner: 
          type: "boolean"
          description: "老板。**不受门店授权限制**，他的店都归他管"
        status: 
          "$ref": "#/components/schemas/StaffStatus"
          description: "ACTIVE / DISABLED"
        roles: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/StoreRole"
          description: "他在各门店的角色。老板为空 —— 不是\"没授权\"，是\"不需要授权\""
      required: 
        - "mchAccountNo"
        - "loginPhone"
        - "isOwner"
        - "status"
        - "roles"
      additionalProperties: false
      description: "商家员工（B 端账号 + 他在各门店的角色）。\n\n<p>**逐店授权**：A 店店长可以同时是 B 店店员 —— 老店的店长去新店帮忙， 但新店不归他管，这是小连锁的常态。"
    StoreRole: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "哪家店"
        storeName: 
          type: "string"
          description: "门店名快照，列表直接显示，省一次查询"
        role: 
          "$ref": "#/components/schemas/StaffRole"
          description: "MANAGER 店长 / CLERK 店员"
      required: 
        - "storeNo"
        - "storeName"
        - "role"
      additionalProperties: false
    StaffLog: 
      type: "object"
      properties: 
        actor: 
          type: "string"
          description: "操作人手机号（脱敏）。取不到当时身份时为空 —— 空就是空，不写「系统」"
        targetName: 
          type: "string"
          description: "被操作员工的手机号（脱敏）"
        action: 
          type: "string"
          description: "STAFF_ADD / STAFF_ENABLE / STAFF_DISABLE / ROLE_GRANT / ROLE_REVOKE"
        storeName: 
          type: "string"
          description: "涉及门店的名字。加人与启停为空"
        role: 
          "$ref": "#/components/schemas/StaffRole"
          description: "涉及的角色码。加人与启停为空"
        detail: 
          type: "string"
          description: "人能读的一句话，直接展示"
        at: 
          type: "number"
          description: "发生时间，毫秒时间戳"
      required: 
        - "action"
        - "at"
      additionalProperties: false
      description: "一条员工与授权的变更记录（B-11.10.3）。\n\n**授权变更是权限扩散的唯一入口** —— 加人、停用、给角色、撤角色。 别的动作都有业务单据兜底，唯独这几个此前做完就没了： 三个月后问「谁把张三提成了店长」，库里只有一行当前状态。"
    MerchantRole: 
      type: "object"
      properties: 
        roleCode: 
          type: "string"
          description: "角色码。预置是 `OWNER`/`MANAGER`… ，自定义是生成的业务键 —— **别拿它给店主看**"
        name: 
          type: "string"
          description: "显示名。预置角色也有 —— 别拿 `MANAGER` 直接给店主看"
        builtin: 
          type: "boolean"
          description: "平台预置：**只读**，要改先「复制为自定义角色」"
        perms: 
          type: "array"
          items: 
            type: "string"
          description: "这个角色带的权限码。老板那行是 `[\"*\"]`（全部），别按长度当权限数"
        permLabels: 
          type: "array"
          items: 
            type: "string"
          description: "与 `perms` 一一对应的中文短说明"
        usedBy: 
          type: "number"
          description: "几个人在用。删除按钮据此禁用，并且要显示出来"
      required: 
        - "roleCode"
        - "name"
        - "builtin"
        - "perms"
        - "permLabels"
        - "usedBy"
      additionalProperties: false
      description: "一个角色：6 个平台预置（只读）+ 商家自定义（V71）。\n\n**权限码的中文说明由后端给**（`permLabels`），前端不抄一份 —— 抄的那份迟早与权限码本身漂开，而漂开的表现是 「界面写着能改库存，实际打不通」。"
    PermOption: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "权限码，如 `biz:stock`。**只用于提交，不展示**"
        label: 
          type: "string"
          description: "中文短说明，兜底用。端上自己有中/英/阿三份文案"
      required: 
        - "code"
        - "label"
      additionalProperties: false
      description: "自定义角色**可以勾的一个权限点**。\n\n为什么不让端上「把预置角色的权限并起来」当选项：那个并集**少一条** —— `biz:finance` 只有老板有，而老板那行是 `*`。于是后端明明收这个码， 界面上却勾不到，看起来像功能没做。"
    SettleBill: 
      type: "object"
      properties: 
        settleNo: 
          type: "string"
          description: "结算单号"
        subOrderNo: 
          type: "string"
          description: "对应的子订单号 —— 分账以它为单位"
        orderNo: 
          type: "string"
          description: "所属主单号"
        merchantNo: 
          type: "string"
          description: "主体号"
        grossMinor: 
          type: "number"
          description: "结算基数（分）= 用户实付 + 平台补贴。**平台出资的优惠要补回给商家**"
        commissionMinor: 
          type: "number"
          description: "平台佣金（分）"
        serviceFeeMinor: 
          type: "number"
          description: "自提点履约服务费（分）。供货方付、承接方收，两个角色都是自己时账面抵消"
        netMinor: 
          type: "number"
          description: "商家实得（分）= 基数 − 佣金 − 服务费"
        trafficSource: 
          type: "string"
          description: "客流来源：MERCHANT_OWNED 自带客流（零佣金）/ PLATFORM"
        commissionRate: 
          type: "number"
          description: "佣金费率快照（万分比）。费率会变，历史账不跟着变"
        status: 
          "$ref": "#/components/schemas/SettleBillStatus"
          description: "PENDING / SPLIT / RETRYING / MANUAL / REVERSED"
        createdAt: 
          type: "number"
          description: "生成时间"
        splitAt: 
          type: "number"
          description: "分账完成时间；没分完为空"
        storeNo: 
          type: "string"
          description: "这笔钱是**哪家店**挣的（统计维度）。空 = 存量主体级流水。\n\n它**不决定钱打给谁** —— 打给谁看 `payMerchantNo`。 两家店可以共用一个收款号（合并结算），也可以各配各的（分开结算）。"
        payMerchantNo: 
          type: "string"
          description: "这笔钱打给**哪个收款号**（结算维度，生成时快照）。空 = 当时进件还没走完"
        settleableAt: 
          type: "number"
          description: "T2 可结算时刻。**空 = 还不可结算**（未履约，或售后未闭环），不是「立刻可结」。\n\n与下面三个一起回答商家问的第一个问题：**「这笔什么时候到」**。 此前这一页只给金额，商家拿它去对银行流水，对不上就来找客服 —— 而客服看到的也只有一个金额。"
        dueAt: 
          type: "number"
          description: "T3 应结日（本批的）。空 = 还没入批"
        batchNo: 
          type: "string"
          description: "归属批次。空 = 还没入批"
        batchStatus: 
          "$ref": "#/components/schemas/SettleBatchStatus"
          description: "本批当前状态。空 = 还没入批。\n\n**单据状态说「钱在哪」，批次状态说「流程走到哪」** —— 两个都要看： 单子还是 PENDING 但批次已 RECONCILED，说明就快放了。"
        batchBlockedReason: 
          type: "string"
          description: "批次被挂起的原因，**直接展示给商家的原话**。空 = 没挂起"
      required: 
        - "settleNo"
        - "subOrderNo"
        - "orderNo"
        - "merchantNo"
        - "grossMinor"
        - "commissionMinor"
        - "serviceFeeMinor"
        - "netMinor"
        - "commissionRate"
        - "status"
        - "createdAt"
      additionalProperties: false
      description: "结算流水。**一个子订单一行**（ADR-002 §5），不是周期账单。\n\n> 2026-08-11 更正：这个类型此前描述的是一套「周期账单」（`billNo` / `periodStart` > / `orderCount` / `settledMinor`），而后端 `/biz/settle/bills` 从来返回的都是 > 按子单一行的分账流水。**字段一个都对不上**，页面靠 mock 才看起来是好的 —— > 连真后端会整片 undefined。与本轮反复撞到的「单看任一端都完整，断在两端之间」同形状。"
    SettleBatchStatus: 
      type: "string"
      enum: 
        - "DRAFT"
        - "COLLECTED"
        - "RECONCILING"
        - "BLOCKED"
        - "RECONCILED"
        - "RELEASED"
      description: "账期批次状态。DRAFT 收单中 · COLLECTED 已截批 · RECONCILING 对账中 · BLOCKED 已挂起 · RECONCILED 待放款 · RELEASED 已放款"
    MySettleBatch: 
      type: "object"
      properties: 
        batchNo: 
          type: "string"
          description: "批次号。**与结算单上的批次号是同一个** —— 商家照着单子来问的就是它"
        payChannel: 
          type: "string"
          description: "支付通道码。**不同通道账期不同，所以不合批**"
        settleCycle: 
          type: "string"
          description: "本批采用的账期规则，如 T+1 / WEEKLY"
        dueAt: 
          type: "number"
          description: "T3 应结日"
        releasedAt: 
          type: "number"
          description: "实际放行时刻。空 = 还没放"
        status: 
          "$ref": "#/components/schemas/SettleBatchStatus"
          description: "本批走到哪一步"
        billCount: 
          type: "number"
          description: "本批装了几笔"
        netMinor: 
          type: "number"
          description: "本批应放款合计（分）"
        blockedReason: 
          type: "string"
          description: "挂起原因，**原话展示**（含具体数字与阈值），不要在端上再拼一遍"
        blockExpireAt: 
          type: "number"
          description: "超时未处置将自动放行的时刻"
      required: 
        - "batchNo"
        - "payChannel"
        - "settleCycle"
        - "dueAt"
        - "status"
        - "billCount"
        - "netMinor"
      additionalProperties: false
      description: "我的账期批次。**商家问的是「这一批什么时候放、卡在哪」**。"
    MyDebt: 
      type: "object"
      properties: 
        balanceMinor: 
          type: "number"
          description: "当前欠款（分）。**0 = 没有欠款，整块不显示** —— 绝大多数商家从没欠过"
        txns: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MyDebtTxn"
          description: "流水，时间倒序。**余额从流水推得出来**，对不上时信流水"
      required: 
        - "balanceMinor"
        - "txns"
      additionalProperties: false
      description: "我的欠款。\n\n⚠️ **与保证金方向相反**：保证金是商家自己的钱，欠款是欠平台的。 端上不要把两者放在一起算成一个「账户余额」。"
    MyDebtTxn: 
      type: "object"
      properties: 
        txnNo: 
          type: "string"
          description: "流水号"
        txnType: 
          "$ref": "#/components/schemas/DebtTxnType"
          description: "INCUR 产生 / OFFSET 货款抵扣 / DEPOSIT 保证金抵扣 / WRITE_OFF 核销"
        amountMinor: 
          type: "number"
          description: "**有符号**：产生为正、偿还为负"
        balanceAfterMinor: 
          type: "number"
          description: "这一笔之后的欠款余额"
        sourceType: 
          type: "string"
          description: "源单类型，如 REFUND"
        sourceNo: 
          type: "string"
          description: "源单号 —— 商家问「为什么欠」，答案在这里"
        batchNo: 
          type: "string"
          description: "从哪一批扣的 —— 商家问「扣哪了」，答案在这里"
        reason: 
          type: "string"
          description: "记这一笔的理由，**给商家看的原话**"
        at: 
          type: "number"
          description: "发生时刻（毫秒）"
      required: 
        - "txnNo"
        - "txnType"
        - "amountMinor"
        - "balanceAfterMinor"
        - "at"
      additionalProperties: false
    DebtTxnType: 
      type: "string"
      enum: 
        - "INCUR"
        - "OFFSET"
        - "DEPOSIT"
        - "WRITE_OFF"
      description: "欠款流水类型。**方向不由它推** —— amountMinor 自带符号。 与 ops-web 的 DebtTxnType 同名同值：两处声明，取值必须一起改。"
    MerchantTodo: 
      type: "object"
      properties: 
        toShip: 
          type: "number"
          description: "待发货单数（EXPRESS 履约）"
        toDeliver: 
          type: "number"
          description: "待自送单数（商家自送履约）"
        toStock: 
          type: "number"
          description: "待备货单数（自提单已付款，货还没送到自提点）。**按门店算**，这是供货方的活。\n\n与  {@link  toPick }  是同一批单的两头，**两个数不相等**： 买家常常选别家的自提点。`toPick` 按自提点算（我要在点上分多少）， 这一个按门店算（我要送出去多少）。"
        toVerify: 
          type: "number"
          description: "待核销单数（自提到货、买家还没来取）"
        toPick: 
          type: "number"
          description: "待分拣单数（到货后按商品汇总点数）"
        afterSale: 
          type: "number"
          description: "待处理售后单数"
        toReply: 
          type: "number"
          description: "待回复的评价数"
        quotable: 
          type: "number"
          description: "可报价的求团需求数"
      required: 
        - "toShip"
        - "toDeliver"
        - "toStock"
        - "toVerify"
        - "toPick"
        - "afterSale"
        - "toReply"
        - "quotable"
      additionalProperties: false
      description: "工作台待办。**数字即入口** —— 商家打开 App 只想知道「有几件事要我做」"
    MerchantStats: 
      type: "object"
      properties: 
        todayOrders: 
          type: "number"
          description: "今日订单数（自然日，按市场本地时区切分）"
        todayGmvMinor: 
          type: "number"
          description: "今日成交额（最小货币单位）"
        monthOrders: 
          type: "number"
          description: "本月订单数"
        monthGmvMinor: 
          type: "number"
          description: "本月成交额（最小货币单位）"
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "统计口径的币种"
        rating: 
          type: "number"
          description: "店铺综合评分，0–5"
        ratingCount: 
          type: "number"
          description: "参与评分的评价条数"
        ownedTrafficRate: 
          type: "number"
          description: "自带客流占比（trafficSource=MERCHANT_OWNED），决定费率档（ADR-004 §6）"
      required: 
        - "todayOrders"
        - "todayGmvMinor"
        - "monthOrders"
        - "monthGmvMinor"
        - "currency"
        - "rating"
        - "ratingCount"
        - "ownedTrafficRate"
      additionalProperties: false
    CrossStoreRow: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号。点进去切门店时用它"
        storeName: 
          type: "string"
          description: "门店名。列表里认店靠它，不要拿门店号显示"
        isDefault: 
          type: "boolean"
          description: "是否默认店。**一个主体恰好一家**，界面上要标出来"
        status: 
          "$ref": "#/components/schemas/StoreStatus"
          description: "ACTIVE 正常营业 / READONLY 已停用。停用的店仍在列表里 —— 看不见会被当成「店被删了」"
        todayOrders: 
          type: "number"
          description: "今日订单数（自然日，按市场本地时区切分）"
        todayGmvMinor: 
          type: "number"
          description: "今日成交额（最小货币单位）"
        monthOrders: 
          type: "number"
          description: "本月订单数"
        monthGmvMinor: 
          type: "number"
          description: "本月成交额（最小货币单位）"
        toShip: 
          type: "number"
          description: "待发货单数（快递）"
        toDeliver: 
          type: "number"
          description: "待自送单数（商家自送）"
        toStock: 
          type: "number"
          description: "待备货单数（自提单已付款、货还没送到自提点）。按**门店**算"
      required: 
        - "storeNo"
        - "storeName"
        - "isDefault"
        - "status"
        - "todayOrders"
        - "todayGmvMinor"
        - "monthOrders"
        - "monthGmvMinor"
        - "toShip"
        - "toDeliver"
        - "toStock"
      additionalProperties: false
      description: "跨店总览的一行 —— 一家门店的今日 / 本月 / 三项待办（B-11.12.5）。\n\n<p>**没有单的门店也占一行（全零），不会从列表里消失**： 一家今天还没开张的店从总览里不见了，店主的第一反应是「我的店呢」。 零是一个答案，缺席不是。"
    CrossStoreOverview: 
      type: "object"
      properties: 
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "统计口径的币种。与 `/biz/dashboard/stats` 同一个字段"
        stores: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/CrossStoreRow"
          description: "按店并列。顺序与门店列表一致（默认店在前），端上不必自己排"
      required: 
        - "currency"
        - "stores"
      additionalProperties: false
      description: "跨店总览（B-11.12.5）· `GET /biz/cross-store/overview`。\n\n<p>**只有门店维度的三项待办**：工作台上的 `toVerify`（待核销）与 `toPick`（待分拣） 后端刻意不给 —— 那两个数是**自提点**维度且不限商家（一个自提点承接多家商家的货， ADR-005）。摆进「门店」这一列，商家会读成「这家店的活」，点进去却是别人的货。\n\n<p>需要 `cross_store_stats` 能力位（PRO / CHAIN）。FREE 档访问会被后端以 `PLAN_CAPABILITY_REQUIRED`(70023) 拒绝 —— 端上要渲染**示例态 + 升档说明**， 不是空白页也不是红色报错。"
    CrossStoreCompareRow: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号"
        storeName: 
          type: "string"
          description: "门店名"
        isDefault: 
          type: "boolean"
          description: "是否默认店"
        status: 
          "$ref": "#/components/schemas/StoreStatus"
          description: "ACTIVE 正常营业 / READONLY 已停用"
        orders: 
          type: "number"
          description: "窗口内订单数（不含已取消）"
        gmvMinor: 
          type: "number"
          description: "窗口内成交额（最小货币单位）"
        buyers: 
          type: "number"
          description: "窗口内下过单的买家数（去重）。复购率的分母"
        repeatBuyers: 
          type: "number"
          description: "其中下过 ≥2 单的买家数"
        repeatRate: 
          type: "number"
          description: "`repeatBuyers / buyers`，0–1。**分母为 0 时是 0**，一家还没开张的店显示 0%"
        rating: 
          type: "number"
          description: "**这家店自己的**评分（V155，ADR-011：评价归门店）。\n\n⚠️ 与顶层的  {@link  CrossStoreCompare#rating  }  是两个数：那个是主体整体分 （C 端商家卡上显示的那个），这个是「楼下那家」的分。两个都要显示 —— 商家问「为什么我的店 4.9 而搜索里是 4.6」时，只有并排看得到才解释得通。"
        ratingCount: 
          type: "number"
          description: "计入这家店评分的条数。**0 = 暂无评价**，按条数判空而不是按分值 —— 老评价没有门店归属，所以老店在第一条新评价到来之前也是 0。"
        outOfStockSkus: 
          type: "number"
          description: "该店可用量（stock − locked）≤ 0 的 SKU 数。\n**只数已启用分店库存的 SKU** —— 一条店级行都没有的 SKU 走主体总量，不算这家店缺货。"
      required: 
        - "storeNo"
        - "storeName"
        - "isDefault"
        - "status"
        - "orders"
        - "gmvMinor"
        - "buyers"
        - "repeatBuyers"
        - "repeatRate"
        - "rating"
        - "ratingCount"
        - "outOfStockSkus"
      additionalProperties: false
      description: "跨店对比的一行 —— 窗口内这家店的销售额 / 订单 / 复购 / 缺货（B-11.12.6）。\n\n<p>⚠️ **这里没有评分**，它在  {@link  CrossStoreCompare#rating  }  上，是主体级的。"
    CrossStoreCompare: 
      type: "object"
      properties: 
        days: 
          type: "number"
          description: "**实际生效**的窗口天数（后端已夹在 1–365）。回显它，端上才知道传 99999 被截成了 365"
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "统计口径的币种"
        rating: 
          type: "number"
          description: "**主体整体评分**（各店的合成，也是 C 端商家卡上显示的那个）。 每家店自己的分在  {@link  CrossStoreCompareRow#rating  }  上（V155 起）。\n\n【历史】V155 之前 `rvw_review` 只有 `entity_no` 没有 `store_no`， 门店维度的评分没有数据源，所以这个数只能放顶层。\n\n<p>渲染成一条「本店铺整体评分」的说明；对比表格里那一列用每行自己的  {@link  CrossStoreCompareRow#rating  } 。**别拿这个数去填表格列** —— 那样三家店会显示同一个数字，而这正是 V155 之前的样子。"
        ratingCount: 
          type: "number"
          description: "计入评分的评价条数。0 = 还没人评过，显示「暂无评价」而不是 0 颗星"
        stores: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/CrossStoreCompareRow"
          description: "按店并列，顺序同门店列表"
      required: 
        - "days"
        - "currency"
        - "rating"
        - "ratingCount"
        - "stores"
      additionalProperties: false
      description: "跨店对比（B-11.12.6）· `GET /biz/cross-store/compare?days=30`。\n\n<p>门禁与  {@link  CrossStoreOverview }  相同（`cross_store_stats` 能力位）。"
    MerchantPlan: 
      type: "object"
      properties: 
        planCode: 
          type: "string"
          description: "档位码。**文案用 `planName`，不要按 code 自己映射** —— 运营改了名端上不会跟着变"
        planName: 
          type: "string"
          description: "档位显示名（「成长版」）"
        status: 
          "$ref": "#/components/schemas/PlanStatus"
          description: "ACTIVE 生效中 / GRACE 宽限期（**能力全保留**，7 天）/ EXPIRED 已过期并降级。\n\n<p>GRACE 要显示成「即将到期，请尽快续费」而**不是**「已失效」： 他的门店、子账号、跨店数据一样都没少，这时候说失效只会让他打客服电话。"
        startAt: 
          type: 
            - "number"
            - "null"
          description: "订阅起始时间（毫秒）。null = 还没有过任何订阅"
        expireAt: 
          type: 
            - "number"
            - "null"
          description: "到期时间（毫秒）。null = 不到期（免费档）"
        storeQuota: 
          type: "number"
          description: "生效门店额度"
        storeUsed: 
          type: "number"
          description: "已用门店数。**后端算，只数营业中的店** —— 端上自己数会与建店那道闸的口径分岔"
        staffQuota: 
          type: "number"
          description: "生效子账号额度"
        staffUsed: 
          type: "number"
          description: "已用子账号数（不含老板本人）"
        crossStoreStats: 
          type: "boolean"
          description: "有没有跨店总览与对比"
        trialUsed: 
          type: "boolean"
          description: "试用是否已用过。**一主体一次，永不回退**"
        trialTier: 
          type: 
            - "string"
            - "null"
          description: "可试用的目标档位码；null = 现在不能试用（已用过 / 已经是付费档 / 平台没配试用）。\n\n<p>端上按它决定要不要显示「免费试用」按钮 —— 不要自己用 `planCode === 'FREE' && !trialUsed` 推：那会漏掉「平台把试用天数配成 0」这种情况。"
        trialDays: 
          type: 
            - "number"
            - "null"
          description: "试用天数，配合 `trialTier` 显示「免费试用 14 天」"
        suspendedStores: 
          type: "array"
          items: 
            type: "string"
          description: "因降级被压成只读的门店名。\n\n<p>**只含平台压的那几家**，商家自己停用的不在里面 —— 页面要写明是「哪几家」：只说「部分门店已停用」，他得自己一家家点开去找。"
        tiers: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/PlanTier"
          description: "三档对比，顺序即展示顺序（后端按 sort 排好）"
      required: 
        - "planCode"
        - "planName"
        - "status"
        - "storeQuota"
        - "storeUsed"
        - "staffQuota"
        - "staffUsed"
        - "crossStoreStats"
        - "trialUsed"
        - "suspendedStores"
        - "tiers"
      additionalProperties: false
      description: "我的增值包（B-11.13，`GET /biz/plan`）。\n\n<p>与运营端那份（`MerchantPlanRow`）刻意是两个类型：运营看的是「这家商家买了什么」， 商家看的是「我有什么、还差什么、能不能试」。挤成一个的结果是商家侧要接一堆 用不上的字段（授予方、降级时间、额度来源），而它们每一个都会被端上误读成给他看的。"
    PlanTier: 
      type: "object"
      properties: 
        planCode: 
          type: "string"
          description: "档位码。**文案用 planName，不要按 code 自己映射** —— 运营改了名端上不会跟着变"
        name: 
          type: "string"
          description: "名称"
        storeQuota: 
          type: "number"
          description: "门店数配额"
        staffQuota: 
          type: "number"
          description: "员工数配额"
        crossStoreStats: 
          type: "boolean"
          description: "这一档给不给跨店统计"
        trialDays: 
          type: "number"
          description: "0 = 这一档不提供试用"
        current: 
          type: "boolean"
          description: "是不是他现在用的那一档"
      required: 
        - "planCode"
        - "name"
        - "storeQuota"
        - "staffQuota"
        - "crossStoreStats"
        - "trialDays"
        - "current"
      additionalProperties: false
      description: "档位对比的一行。"
    MerchantApplyStatus: 
      type: "object"
      properties: 
        applyNo: 
          type: "string"
          description: "申请单号"
        name: 
          type: "string"
          description: "申请时填的店铺名。**存快照** —— 后来改名不该让历史申请跟着变"
        subject: 
          "$ref": "#/components/schemas/MerchantSubject"
          description: "主体类型。决定分账主体形态与所需资质（ADR-002 §4）"
        status: 
          "$ref": "#/components/schemas/MerchantApplyReviewStatus"
          description: "审核状态。迁移见本类型的注释，APPROVED 为终态"
        rejectReason: 
          type: "string"
          description: "驳回理由。**驳回必须写** —— 不写就等于让人猜着改"
        merchantNo: 
          type: "string"
          description: "通过后生成的商家单号。未通过时为空 —— 商家在通过之前根本不存在"
        createdAt: 
          type: "number"
          description: "提交时间"
        auditedAt: 
          type: "number"
          description: "审核完成时间。PENDING/REVIEWING 期间为空"
        contactName: 
          type: "string"
          description: "联系人姓名"
        contactPhone: 
          type: "string"
          description: "联系手机号。这是申请人自己填的联系号码，**不是登录号**，不脱敏"
        category: 
          type: "string"
          description: "主营类目"
        desc: 
          type: "string"
          description: "店铺简介"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "期望经营范围（ADR-009）"
        communityNos: 
          type: "array"
          items: 
            type: "string"
          description: "期望覆盖的社区"
        licenses: 
          type: "array"
          items: 
            type: "string"
          description: "已传的资质图（只有图片 URL，看不出是哪种证、什么时候过期）"
        qualificationItems: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/QualificationItem"
          description: "结构化资质（V79）：**哪张证、证件号、有效期**。\n\n⚠️ 这一段的标题写着「用于驳回后回填」，而此前只回填了  {@link  licenses }  ——只有图片。**证件类型、编号、有效期三项全丢**，商家重提时得逐格再填一遍， 而这正是本段注释想避免的那件事：「把补交变成重来」。\n\n后端 `MerchantApplyVO` 一直在发它（审核台就靠它看类型与有效期）， 端上这里没声明。"
        industry: 
          type: "string"
          description: "申请时选的行业。驳回回填要用它 —— 换个行业可能连主体类型都得跟着换"
        asPickupPoint: 
          type: "boolean"
          description: "是否愿意承接自提点（ADR-005）。\n\n**只是意愿，不代表点已建立** —— 建点要谈服务费口径，一期由运营在通过后另行处理。 所以商家勾了这一项、通过后却还没看到履约台，是正常的中间状态而不是故障。"
      required: 
        - "applyNo"
        - "name"
        - "subject"
        - "status"
        - "createdAt"
        - "contactName"
        - "contactPhone"
        - "category"
        - "desc"
      additionalProperties: false
      description: "入驻申请状态（C 端查自己的进度 / 平台端审核队列共用）。\n\n状态机：`PENDING → REVIEWING → APPROVED | REJECTED`，`REJECTED → PENDING`（补料重提）。\n**APPROVED 是终态** —— 已经建了商家、发了账号，回退没有意义。\n\n⚠️ 这条是**审核**生命周期，与 `Merchant` 上的**经营**状态（ACTIVE/SUSPENDED）无关： 审核发生在商家还不存在的时候，封禁发生在商家已经存在之后。混成一个枚举会让 「驳回一份申请」和「封禁一家店」共用取值，两件事迟早互相踩。"
    MessageType: 
      type: "string"
      enum: 
        - "TRADE"
        - "MARKETING"
        - "SYSTEM"
      description: "站内消息。 三类分开是因为**用户对它们的期待完全不同**：交易类必须看到（到货了要去取）， 活动类可以错过，系统类是通知。混在一个列表里，交易消息会被活动消息淹没。"
    Message: 
      type: "object"
      properties: 
        messageNo: 
          type: "string"
          description: "消息单号"
        type: 
          "$ref": "#/components/schemas/MessageType"
          description: "消息分类，决定它落在哪个 tab"
        title: 
          type: "string"
          description: "标题（列表页展示）"
        body: 
          type: "string"
          description: "正文"
        link: 
          type: "string"
          description: "点进去要跳哪（订单详情/商品/团），已是完整页面路径带参"
        read: 
          type: "boolean"
          description: "是否已读。未读数按 type 分别统计"
        at: 
          type: "number"
          description: "消息产生时间"
      required: 
        - "messageNo"
        - "type"
        - "title"
        - "body"
        - "read"
        - "at"
      additionalProperties: false
    SpecValueAdded: 
      type: "object"
      properties: 
        valueNo: 
          type: "string"
          description: "平台值池里的编号。**有它才参与筛选与跨店比较**"
        code: 
          type: "string"
          description: "码值"
        label: 
          type: "string"
          description: "显示名"
      required: 
        - "valueNo"
        - "code"
        - "label"
      additionalProperties: false
      description: "新加的规格取值（商家自建维度）。同上：命名是为了它能进契约"
    Category: 
      type: "object"
      properties: 
        categoryNo: 
          type: "string"
          description: "类目单号"
        parentNo: 
          type: 
            - "string"
            - "null"
          description: "上级类目单号。一级类目为空"
        level: 
          type: "number"
          description: "1–3。**三级封顶**"
        name: 
          type: "string"
          description: "类目名（后端按 Accept-Language 下发已本地化文案）"
        icon: 
          type: "string"
          description: "类目图标 URL。运营没配就是空串，端上按占位渲染"
        template: 
          type: "string"
          description: "该类目的**品类模板**：`STANDARD` / `FRESH` / `SERVICE` / `VOUCHER`。\n\n<p><b>它就是「品类」，只是另一套码</b>（STANDARD↔NORMAL、VOUCHER↔CARD， 见 `TEMPLATE_TO_TYPE`）。选定类目即可推出品类 —— 让商家把同一件事填两遍， 唯一的产出是两者可能互相矛盾，而矛盾没有任何一处会拦。"
        requiredCode: 
          type: "string"
          description: "经营这个类目要的授权码；**空 = 无门槛**。\n\n<p>与 `BizScope.categoryCodes` 比对，端上就能在选之前说清楚「你还不能卖这一类」—— 不下发的话商家只能靠「选了、保存、被拒」这条路才知道， 而那句报错既说不出缺哪张证，也说不出去哪申请。"
        qualifications: 
          type: "array"
          items: 
            type: "string"
          description: "人读的资质名，如「食品经营许可证」。展示用，判据是 `requiredCode`"
        sort: 
          type: "number"
          description: "同级内的展示顺序，小的在前。运营在后台拖动排序改的就是它"
        children: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Category"
          description: "子类目。叶子是空数组而不是 undefined —— 端上少一次判空"
      required: 
        - "categoryNo"
        - "level"
        - "name"
        - "sort"
        - "children"
      additionalProperties: false
      description: "类目树节点（对齐后端 `CategoryVO`）。\n\n<p>⚠️ **不要把它和 `CategoryType` 搞混** —— 那是五品类枚举 （NORMAL/FRESH/SERVICE/VIRTUAL/CARD），挂在商品上、由平台硬编码，决定履约与合规 （冷链、不发货、iOS 可售规则）。这里的类目树是运营可维护的数据，决定归类与经营准入。 两个维度正交，见 `docs/technical/类目树补齐方案.md`。\n\n<p>这个类型此前声明了一个后端根本不返回的 `type` 字段，并写着「仅两级」—— 而后端一直是三级。没人用它，所以错了很久也没暴露。"
    SpuStd: 
      type: "object"
      properties: 
        stdNo: 
          type: "string"
          description: "标准品号"
        categoryNo: 
          type: "string"
          description: "所属类目。取用后**改不掉**：类目决定形态（生鲜要截单、服务不发货）"
        categoryName: 
          type: "string"
          description: "类目名，展示用"
        title: 
          type: "string"
          description: "标题"
        titleI18n: 
          "$ref": "#/components/schemas/Record_string_string"
          description: "标题的多语言版本"
        subtitle: 
          type: "string"
          description: "副标题"
        cover: 
          type: "string"
          description: "封面图"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "图集"
        specGroups: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecGroup"
          description: "每个选项都带 `optionCode` —— 跨店可比靠的就是它"
        keywords: 
          type: "string"
          description: "别名/品牌/俗称，搜索用。端上可以不展示"
        status: 
          type: "string"
          description: "状态"
        refCount: 
          type: "number"
          description: "被引用次数，只给运营排序用"
        barcode: 
          type: "string"
          description: "商品条码。**空是常态** —— 生鲜、现做熟食、服务本来就没有条码"
        source: 
          type: "string"
          description: "出处：`OPS` 运营手录 / `OFF` 从 Open Food Facts 导入。 众包来的那批全是待审状态，运营靠它把「还没人看过的」与「自己录的」分开审。"
      required: 
        - "stdNo"
        - "categoryNo"
        - "title"
        - "specGroups"
      additionalProperties: false
      description: "平台标准品（TDD-标准品库）：商家引用建品的**模子**。\n\n<p>**无价、无库存、无履约** —— 那些永远是商家的。它存在的理由是 `specGroups` 里的 `optionCode`：没有标准品，三家店各自录「本地菠菜」得到三个毫无关系的商品， 聚合、比价、统计全都无从谈起。\n\n<p>取用时端上只是把字段**填进表单**，商家可以改标题与图；但**类目与 optionCode 由服务端强制以标准品为准** —— 能改掉的话，标准品就退化成一个填表助手。"
    SpecGroup: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "规格维度名，如「重量」「包装」"
        options: 
          type: "array"
          items: 
            type: "string"
          description: "该维度的可选值，如 `[\"约5斤\", \"约10斤\"]`"
        optionCodes: 
          type: "array"
          items: 
            anyOf: 
              - type: "string"
              - not: {}
          description: "与 options 一一对应的模板编码。来自模板的选项有值，自由输入的为空。 一期只写入不消费 —— 但不留位的话，二期做规格聚合要刷全部历史商品。"
        templateNo: 
          type: "string"
          description: "该规格组来自哪个模板（便于「用的人多不多」这类平台侧统计）"
      required: 
        - "name"
        - "options"
      additionalProperties: false
      description: "规格维度，例：{ name: \"重量\", options: [\"约5斤\", \"约10斤\"] }"
    Sku: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "SKU 单号。下单、库存、订单行都指向它，不是指向 goodsNo"
        optionValues: 
          type: "array"
          items: 
            type: "string"
          description: "各规格维度上的取值，顺序与 Goods.specGroups 一一对应。 单规格商品长度为 1；多规格（如 重量 × 包装）长度 >1。"
        spec: 
          type: "string"
          description: "展示用拼接文案（后端下发，端上不自己拼，避免多语言分隔符差异）"
        price: 
          type: "number"
          description: "售价（最小货币单位）"
        originPrice: 
          type: "number"
          description: "划线价（最小货币单位）。为空表示不展示划线价"
        stock: 
          type: "number"
          description: "可售库存。下单时服务端二次校验，端上这个值只用于展示与预校验"
        nominalGram: 
          type: "number"
          description: "FRESH 且按重计价：标称重量（克）"
        costPrice: 
          type: "number"
          description: "成本价（最小货币单位）。**只有商家侧 `/biz/goods/{no}` 下发，C 端恒空。**\n\n进货价是商家的经营秘密，出现在买家端的响应里就等于公开了。 它不参与任何计价，只用来在编辑页实时算毛利。"
        barcode: 
          type: "string"
          description: "商品条码 EAN-13 / UPC（V252）。**只在商家侧下发** —— 它是商家与供应商/ERP 之间的键，对买家没有用处，而条码还能反查到进货渠道。"
        merchantSkuCode: 
          type: "string"
          description: "商家自有货号。他 ERP 里的主键，同样只在商家侧下发"
        saleUnit: 
          type: "string"
          description: "计量单位（件 / 斤 / kg / 份）。**买家侧也要** —— 「5」到底是 5 件还是 5 斤，买家同样需要知道才判断得了贵不贵。"
        priceByMarket: 
          "$ref": "#/components/schemas/Record_string_number"
          description: "各市场价（市场码 → 最小货币单位）。**只有商家侧 `/biz/goods/{no}` 下发，C 端恒空。**\n\n<p>编辑页按市场逐格填，而保存是**整份覆盖** —— 拿不到整张表就只能回填当前 那一格，于是改一次标题，其余市场的价格行就被删了，且不报错： 那两个市场的买家从此看不到这件商品。与 `titleI18n` 是同一个形状的故障。"
        storePrice: 
          type: "number"
          description: "本店单独定的价（最小货币单位）。**只在 B 端下发，空 = 同主体价**，不是 0。\n\n<p>与门店库存回退方向相反：没设过价的店按主体价卖，没设过库存的店按 0 卖 —— 价格视为 0 就是白送。"
      required: 
        - "skuNo"
        - "optionValues"
        - "spec"
        - "price"
        - "stock"
      additionalProperties: false
    CardSpec: 
      type: "object"
      properties: 
        faceValueMinor: 
          type: "number"
          description: "储值卡面值（最小货币单位）；次卡为空"
        timesTotal: 
          type: "number"
          description: "次卡总次数；储值卡为空"
        validDays: 
          type: "number"
          description: "有效期天数"
      required: 
        - "validDays"
      additionalProperties: false
      description: "卡券属性（CARD）"
    Promotion: 
      type: "object"
      properties: 
        type: 
          type: "string"
          const: "BUY_N_GET_M"
          description: "促销类型。目前只有买 N 送 M 一种"
        buyN: 
          type: "number"
          description: "购买件数门槛 N"
        giftM: 
          type: "number"
          description: "赠送件数 M"
        giftGoodsNo: 
          type: "string"
          description: "赠品商品号；不填则赠同款"
        giftTitle: 
          type: "string"
          description: "赠品展示名（后端下发已本地化）"
      required: 
        - "type"
        - "buyN"
        - "giftM"
      additionalProperties: false
      description: "促销：买 N 送 M。 语义：购买数量达到 N 件，赠送 M 件 —— 用户**付 N 件的钱，收到 N+M 件**。 赠品不进计价（价格为 0），只作为订单里的独立行存在，履约时随单发出。"
    VirtualSpec: 
      type: "object"
      properties: 
        deliverDesc: 
          type: "string"
          description: "发放说明，如「支付后 1 分钟内短信发码」"
      required: 
        - "deliverDesc"
      additionalProperties: false
      description: "虚拟商品属性（VIRTUAL）"
    GoodsParam: 
      type: "object"
      properties: 
        dimNo: 
          type: "string"
          description: "所属规格维度（`usage_type=PROP`）"
        name: 
          type: "string"
          description: "维度名（「产地」「保质期」）。**买家页要显示它** —— 只有 dimNo 的话详情页上是一行 `SD_ORIGIN: 本地`。\n\n<p>存在商品身上而不是每次去规格库查：它是**下单那一刻的快照**， 与规格组同一口径 —— 商家事后把本店叫法改了，已卖出的商品不该跟着变。"
        valueNo: 
          type: "string"
          description: "平台值编号。量纲型没有"
        code: 
          type: "string"
          description: "平台值编码，跨店可比"
        label: 
          type: "string"
          description: "展示文案"
      required: 
        - "dimNo"
        - "label"
      additionalProperties: false
      description: "一条商品参数。\n\n<p>`valueNo` 是平台值池里的编号，**有它才参与筛选与跨店比较**； 量纲型（功率、净重）平台不枚举值，那时只有 `label`。"
    Goods: 
      type: "object"
      properties: 
        storeOnSale: 
          type: 
            - "boolean"
            - "null"
          description: "<b>本店</b>上不上架（多门店，B 端列表下发）。\n\n⚠️ **`null` / 缺省 = 未按店管理**（跟随主体级 `onSale`），**不是「未上架」**。 上下架早就按门店落行了，而主体的 `onSale` 是「任一门店在售就为真」的总闸 —— 只看它的话，A 店下架完那件货还写着「在售」，店长会以为没点上。"
        goodsNo: 
          type: "string"
          description: "商品单号"
        title: 
          type: "string"
          description: "商品标题"
        subtitle: 
          type: "string"
          description: "副标题/卖点一句话"
        cover: 
          type: "string"
          description: "封面图 URL。列表页用这一张"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "详情轮播图 URL 列表"
        detailImages: 
          type: "array"
          items: 
            type: "string"
          description: "图文详情区的长图，按顺序全宽竖排。\n\n**与 `images` 分开**：轮播是详情页顶部的方图、可左右滑；这些是正文下方的长图、 竖着一张接一张。合成一个数组之后端上只能靠宽高比猜哪几张该轮播 —— 猜错就是 一张 1:3 的长图被塞进方形轮播里。"
        params: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/GoodsParam"
          description: "**商品参数**（产地 / 保质期 / 材质…）—— 规格库里 `usage_type=PROP` 的那批。\n\n<p>与 `specGroups` 形状相近、语义相反：那个的每一项都会进笛卡尔积生成 SKU， 这个一项也不进。买家不用挑，只是看；筛选靠 `code` / `valueNo`。"
        type: 
          "$ref": "#/components/schemas/CategoryType"
          description: "商品形态，与所属类目的 type 一致。决定详情页用哪套字段"
        categoryNo: 
          type: "string"
          description: "所属类目"
        merchant: 
          "$ref": "#/components/schemas/MerchantBrief"
          description: "所属商家 —— 商品与服务都要展示商家信息"
        rating: 
          type: "number"
          description: "本商品的评分与评价数（区别于商家整体评分）"
        ratingCount: 
          type: "number"
          description: "本商品的评价条数"
        price: 
          type: "number"
          description: "展示价（最小货币单位），取各 SKU 最低价"
        originPrice: 
          type: "number"
          description: "划线价（最小货币单位）"
        fulfillments: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/FulfillmentType"
          description: "支持的履约方式。**数组**：同一商品可以既自提又快递，下单时由用户选"
        specGroups: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecGroup"
          description: "规格维度定义；单规格商品也有一组"
        skus: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Sku"
          description: "SKU 列表。单规格商品也有且仅有一条"
        sales: 
          type: "number"
          description: "累计销量，展示用"
        cutoffAt: 
          type: "number"
          description: "FRESH：预售截单时间戳"
        arrivalDesc: 
          type: "string"
          description: "FRESH：预计到货描述"
        weighed: 
          type: "boolean"
          description: "FRESH：是否按实称多退少补"
        origin: 
          type: "string"
          description: "FRESH：产地"
        durationMin: 
          type: "number"
          description: "SERVICE：服务时长（分钟）"
        storeName: 
          type: "string"
          description: "SERVICE：可核销门店"
        slots: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/AppointmentDaySlots"
          description: "SERVICE + APPOINTMENT：可预约时段。**后端未下发**"
        card: 
          "$ref": "#/components/schemas/CardSpec"
          description: "CARD。**后端未下发**"
        virtual: 
          "$ref": "#/components/schemas/VirtualSpec"
          description: "VIRTUAL。**后端未下发**"
        promotions: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Promotion"
          description: "促销（一期只有买 N 送 M）。**后端未下发**"
        groupBuy: 
          type: "object"
          properties: 
            minCount: 
              type: "number"
            price: 
              type: "number"
          required: 
            - "minCount"
            - "price"
          additionalProperties: false
          description: "商家为本商品开放的拼团档：够 minCount 人享 price。不配则本商品不能发起团"
        points: 
          type: "number"
          description: "本商品每件赠送的积分。**后端未下发**：库里有 `prd_goods.points_config` 这一列， 但全仓没有任何读写。等积分域接上再兑现。"
        limitPerUser: 
          type: "number"
          description: "每人限购，0 = 不限"
        onSale: 
          type: "boolean"
          description: "是否在售。下架后详情页仍可访问（历史订单要点得进去），但不可下单"
        detail: 
          type: "string"
          description: "图文详情正文（纯文本）。空 = 商家没写 —— 端上整段不渲染， 别拿一个空白区块占着详情页。"
        status: 
          "$ref": "#/components/schemas/GoodsStatus"
          description: "状态"
        auditReason: 
          type: "string"
          description: "最近一次驳回 / 平台强制下架的原因（**只在商家侧与运营端下发，C 端恒空**）。\n\n**没有它，商家面对 `REJECTED` 只能猜要改什么** —— 审计日志只有运营看得到。 平台强制下架时后端会带「平台强制下架」前缀，商家据此知道是自己被驳 还是被平台下的。过审时清空。\n\n⚠️ 后端 `GoodsVO` 一直在发它，`MerchantGoodsService` 的注释甚至写着 「它会出现在商家 B 端（`auditReason`）」—— 而端上从没声明这个字段。 那句注释描述的是一件**从未发生过**的事。"
        titleI18n: 
          "$ref": "#/components/schemas/Record_string_string"
          description: "三语标题原文，**只有商家侧 `/biz/goods/{no}` 下发**。\n\n编辑页按语言逐格填，而保存是整份覆盖 —— 拿不到原文就只能回填当前那一格， 于是用中文改一次，英文与阿语就被清空了。**这个故障不报错**： C 端缺译文时回落中文，看起来一切正常。"
        subtitleI18n: 
          "$ref": "#/components/schemas/Record_string_string"
          description: "三语副标题原文，同 `titleI18n`"
        stdNo: 
          type: "string"
          description: "引用的平台标准品；空 = 自建品。**只有商家侧与运营端下发，C 端恒空。**\n\n<p>必须下发：编辑页保存是整份覆盖，拿不到它就等于\n**打开编辑页再保存一次就自动脱离了标准品** —— 商品从此不再被收敛， 而界面上没有任何变化。与 `titleI18n` / `priceByMarket` 是同一个形状的故障。"
        hasDraft: 
          type: "boolean"
          description: "有未发布的修改（双版本草稿，V279）。**只有商家侧 `/biz/goods` 下发**， C 端与运营端恒空 —— 它是商家的编辑态提示，买家与审核队列都不消费它。\n\n<p>判据是**草稿行存在与否**，不比内容：保存的内容与线上相同时后端直接删行， 所以 true 一定意味着「发布会改变线上」。列表页据此挂「有未发布修改」徽标。"
      required: 
        - "goodsNo"
        - "title"
        - "subtitle"
        - "cover"
        - "images"
        - "type"
        - "categoryNo"
        - "merchant"
        - "price"
        - "fulfillments"
        - "specGroups"
        - "skus"
        - "sales"
        - "limitPerUser"
        - "onSale"
      additionalProperties: false
    GoodsStatus: 
      type: "string"
      enum: 
        - "DRAFT"
        - "ON_SALE"
        - "OFF_SALE"
        - "PENDING"
        - "REJECTED"
      description: "商家侧商品状态。\n\n<p><b>DRAFT 与 PENDING 是两件事</b>：草稿是「还没提交，等你」，待审是「已提交，等平台」—— 说错了商家的下一步就错了。也与 OFF_SALE（点一下就能卖）分开。"
    SpecTemplateScope: 
      type: "string"
      enum: 
        - "PLATFORM"
        - "MERCHANT"
      description: "规格模板归属：平台统一维护 / 商家自存"
    SpecOption: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "来自模板时有值；商家自己输入的没有"
        label: 
          type: "string"
          description: "选项展示文案，如「约5斤」"
      required: 
        - "label"
      additionalProperties: false
      description: "规格选项。\n\n`code` 是**能不能做规格聚合的分水岭**： 三家店卖同一种米，自由输入会写成「5斤」「五斤」「2.5kg」—— 这三个字符串在库里毫无关系，将来想做「按重量筛选 / 同规格比价」全部落空， 而且不可回溯（历史商品已经写死）。所以模板带来的值必须带 code。\n\n自由输入的值只有 label、没有 code：照常展示，但不参与聚合。\n**一期只写入不消费**，聚合搜索是二期 —— 但字段现在就得留位。"
    SkuIdentityReport: 
      type: "object"
      properties: 
        total: 
          type: "number"
          description: "数据行数，不含表头"
        willSet: 
          type: "number"
          description: "会真正写下去的行数"
        noChange: 
          type: "number"
          description: "匹配上了但三列都没变的行数"
        problems: 
          type: "array"
          items: 
            type: "object"
            properties: 
              line: 
                type: "number"
              reason: 
                type: "string"
            required: 
              - "line"
              - "reason"
            additionalProperties: false
          description: "有问题的行：认不出货号、值不合法。**要能逐行看** —— 只给个数商家不知道改哪一行"
        samples: 
          type: "array"
          items: 
            type: "object"
            properties: 
              skuNo: 
                type: "string"
              goods: 
                type: "string"
              spec: 
                type: "string"
              barcodeFrom: 
                type: 
                  - "string"
                  - "null"
              barcodeTo: 
                type: 
                  - "string"
                  - "null"
              codeFrom: 
                type: 
                  - "string"
                  - "null"
              codeTo: 
                type: 
                  - "string"
                  - "null"
              unitFrom: 
                type: 
                  - "string"
                  - "null"
              unitTo: 
                type: 
                  - "string"
                  - "null"
            required: 
              - "skuNo"
              - "goods"
              - "spec"
            additionalProperties: false
          description: "前几行的前后对照，让他确认「改的是不是我想的那些」"
      required: 
        - "total"
        - "willSet"
        - "noChange"
        - "problems"
        - "samples"
      additionalProperties: false
      description: "商品编码批量导入的试算 / 结果（P4）。\n\n<p>四个数各回答一件事：**这份表有多少行、会改几行、几行没变化、几行有问题**。 少了「没变化」那一格，商家会把「改了 3 行」读成「另外 197 行失败了」。"
    SpecOverride: 
      type: "object"
      properties: 
        dimNo: 
          type: "string"
          description: "规格维度号"
        enabled: 
          type: "boolean"
          description: "false = 本店不用它。移除掉的在界面上收在下面，能加回来"
        label: 
          type: "string"
          description: "**本店叫法**；空 = 用平台的。只换展示，`dimNo` 一个字不变 —— 所以三家店的同一个规格照样聚得到一起。与「我的类目」的 displayName 同一个模式。"
        values: 
          type: "array"
          items: 
            type: "object"
            properties: 
              code: 
                type: "string"
              enabled: 
                type: "boolean"
            required: 
              - "code"
              - "enabled"
            additionalProperties: false
          description: "用哪几档。商家自己输入的档位也在这里（它已经落进规格库，与平台值同轴）"
      required: 
        - "dimNo"
        - "enabled"
      additionalProperties: false
      description: "商家对平台规格的覆盖：**本店用哪几个、什么顺序、叫什么**。\n\n<p><b>改名只改展示</b>：`dimNo` 一个字不变，所以跨店聚合照常成立。 与「我的类目」的 `displayName` 是同一个模式 —— 那里已经证明过这条边界站得住。\n\n<p>传空数组 = 清掉覆盖、完全跟平台走。**与平台一致的不落行**： 这样运营给类目加了新维度，没动过手的商家会自动获得它。"
    MerchantSpecDim: 
      type: "object"
      properties: 
        dimNo: 
          type: "string"
          description: "规格维度号"
        name: 
          type: "string"
          description: "名称"
        valueCount: 
          type: "number"
          description: "这个维度下的取值数（含平台档位 + 自己加的）"
        usedCount: 
          type: "number"
          description: "用在几件商品上。**按规格组名统计** —— 存量商品的规格快照里只有名字， 没有维度编号（那个字段是后加的），按编号统计的话老商品一件都算不进来， 而「停用它会影响什么」问的恰恰是历史。"
        status: 
          "$ref": "#/components/schemas/SpecTemplateStatus"
          description: "ACTIVE 在用 / ARCHIVED 已归档（不再出现在选择器里，历史商品的快照照旧）"
        dimUsed: 
          type: "number"
          description: "已建 / 上限。摆出来，而不是等他建到第 11 个才被拒"
        dimQuota: 
          type: "number"
          description: "维度配额上限，按档位取"
        valueQuota: 
          type: "number"
          description: "取值配额上限"
        values: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecOption"
          description: "这个维度下的取值"
      required: 
        - "dimNo"
        - "name"
        - "valueCount"
        - "usedCount"
        - "status"
        - "dimUsed"
        - "dimQuota"
        - "valueQuota"
        - "values"
      additionalProperties: false
      description: "「我的规格」里的一条自建维度。\n\n<p>与  {@link  SpecTemplate }  的差别是**视角**：那个回答「建品时能挑什么」， 这个回答「我拥有什么、能改什么、动它会影响多少」。"
    SpecTemplateStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "ARCHIVED"
      description: "规格模板状态。ARCHIVED 归档后不再出现在选择器里，但历史商品的快照照旧"
    SpecTemplate: 
      type: "object"
      properties: 
        templateNo: 
          type: "string"
          description: "模板单号"
        scope: 
          "$ref": "#/components/schemas/SpecTemplateScope"
          description: "模板归属：平台统一维护 or 商家自存。商家只能改自己的"
        categoryType: 
          "$ref": "#/components/schemas/CategoryType"
          description: "平台模板按品类推荐；商家模板不限品类"
        categoryNo: 
          type: "string"
          description: "类目级模板的归属类目；**空 = 品类兜底**。\n\n<p>端上靠它区分两层：类目级排在前面并标出来。不下发的话两批混在一起， 商家分不出哪个是「专门给这一类的」。"
        name: 
          type: "string"
          description: "规格维度名，如「重量」「香型」"
        options: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecOption"
          description: "该维度的可选项"
        merchantNo: 
          type: "string"
          description: "scope=MERCHANT 时归属的商家"
        primary: 
          type: "boolean"
          description: "**主维度**：选完类目该自动建出来的就是这一组（每个类目至多一个，守卫测住）。\n\n<p>不下发的话端上只能靠「数组第一个」猜 —— 后端确实那么排，但那是巧合而非契约： 排序一改端上跟着错，症状是「自动建出来的是包装不是重量」，没有一处会报错。\n\n<p>商家自存模板与品类兜底模板恒为 false：主维度是**类目绑定**上的判据， 那两条路不经过绑定表。"
      required: 
        - "templateNo"
        - "scope"
        - "name"
        - "options"
      additionalProperties: false
    GeoReverseResult: 
      type: "object"
      properties: 
        recommend: 
          type: "string"
          description: "带楼盘/门牌的人话版地址。**端上填这个**"
        address: 
          type: "string"
          description: "地址"
      required: 
        - "recommend"
        - "address"
      additionalProperties: false
      description: "逆地理编码结果（P2）：recommend 是带楼盘/门牌的人话版"
    GeoTip: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "名称"
        address: 
          type: 
            - "string"
            - "null"
          description: "地址"
        adcode: 
          type: 
            - "string"
            - "null"
          description: "国标 6 位区县码，与 sys_region 同口径"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "有些提示（纯地名、公交线）没坐标，这种不值得选"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
        typecode: 
          type: 
            - "string"
            - "null"
          description: "高德 POI 类目码"
      required: 
        - "name"
      additionalProperties: false
      description: "地点输入提示（高德 inputtips 经后端代理）。提报小区时按名搜 POI，选中就带上坐标 —— 否则坐标只能是「提交那一刻商家站的地方」，多半不在那个小区里。 后端没配 Web 服务 key 时返回空数组，端上就当没有这个功能。"
    RegionSearchResult: 
      type: "object"
      properties: 
        regions: 
          type: "array"
          items: 
            type: "object"
            properties: 
              regionCode: 
                type: "string"
              level: 
                type: "string"
              name: 
                type: "string"
              path: 
                type: "string"
            required: 
              - "regionCode"
              - "level"
              - "name"
              - "path"
            additionalProperties: false
          description: "命中的行政区划，带从省到父级的路径"
        communities: 
          type: "array"
          items: 
            type: "object"
            properties: 
              communityNo: 
                type: "string"
              name: 
                type: "string"
              regionCode: 
                type: 
                  - "string"
                  - "null"
              path: 
                type: "string"
              kind: 
                type: 
                  - "string"
                  - "null"
                description: "ESTATE 小区 / VILLAGE 村。判「这一条底下还有没有下一级」用它，名字这时已经是口语名了"
              originCode: 
                type: 
                  - "string"
                  - "null"
                description: "下钻要用它，不是 regionCode（那是它挂的街道/镇）。没有它就是地图开通的小区，没有下一级"
              originName: 
                type: 
                  - "string"
                  - "null"
                description: "原始官方名（如「景滑村委会」），仅供展示/追溯 —— 判城乡用下面的 rural"
              rural: 
                type: "boolean"
                description: "是不是村委会（服务端存的）。判「这一条给不给 ›」用它，不要解析 originName"
              latE6: 
                type: 
                  - "number"
                  - "null"
              lngE6: 
                type: 
                  - "number"
                  - "null"
            required: 
              - "communityNo"
              - "name"
              - "path"
            additionalProperties: false
          description: "命中的社区"
        villages: 
          type: "array"
          items: 
            type: "object"
            properties: 
              regionCode: 
                type: "string"
              name: 
                type: "string"
              streetCode: 
                type: "string"
                description: "它挂的街道码（9 位）。提报要挂到这下面"
              path: 
                type: "string"
              latE6: 
                type: 
                  - "number"
                  - "null"
              lngE6: 
                type: 
                  - "number"
                  - "null"
              rural: 
                type: "boolean"
                description: "是不是村委会（服务端存的）。判「这一条给不给 ›」用它"
            required: 
              - "regionCode"
              - "name"
              - "streetCode"
              - "path"
            additionalProperties: false
          description: "还没开通的**官方村**（第五级名录）。已开通的那些走 `communities`（能直接勾）， 这里只出没开通的 —— 同一个地方不该在两组里各出现一次。 官方村提报即开通，所以端上点一条就能直接用。"
        places: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/GeoTip"
          description: "地图上的地点（v5）。**只在库里没有村/小区命中时才有值** —— 服务端先查库， 库里没有才现问高德；App 不用再自己调原生 SDK 兜底了。"
      required: 
        - "regions"
        - "communities"
      additionalProperties: false
      description: "跨级搜索（P1）：区划命中带从省到父级的路径，聚落命中带所在街道路径"
    AreaLevel: 
      type: "string"
      enum: 
        - "COMMUNITY"
        - "STREET"
        - "DISTRICT"
        - "CITY"
        - "PROVINCE"
    AreaStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "PENDING"
    CommunityApplyStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "APPROVED"
        - "REJECTED"
    RegionNode: 
      type: "object"
      properties: 
        regionCode: 
          type: "string"
          description: "国标码：省 2 位 / 市 4 位 / 区县 6 位"
        parentCode: 
          type: 
            - "string"
            - "null"
          description: "上级码。省级为 null"
        level: 
          type: "string"
          description: "`PROVINCE` | `CITY` | `DISTRICT`。地址簿只到区县，街道与村不下发"
        name: 
          type: "string"
          description: "名称"
        hasChild: 
          type: "boolean"
          description: "还有没有下一级。**区县恒为 false** —— 地址表只有省市区三列， 让人点进街道再挑一个存不下去的东西，比不让他挑更糟。"
      required: 
        - "regionCode"
        - "level"
        - "name"
        - "hasChild"
      additionalProperties: false
      description: "行政区划树上的一个节点（`/mp/regions`）。\n\n与  {@link  RegionOption }  是**两个问题的答案**，不要混用： `RegionOption` 答的是「我能在哪儿取货」（只列有已开通社区的区）， 这个答的是「我家在哪儿」—— 没开通的区也要能选出来，人确实住在那儿。"
    RegionOption: 
      type: "object"
      properties: 
        regionCode: 
          type: "string"
          description: "区县级国标码（6 位）。社区可能挂在街道级，聚合时截到区县"
        name: 
          type: "string"
          description: "区县名，如「西湖区」"
        cityCode: 
          type: "string"
          description: "所属市码（4 位）"
        cityName: 
          type: "string"
          description: "所属市名。同名区县全国很多（如「城关区」），不带市名用户分不清是哪一个"
        communityCount: 
          type: "number"
          description: "该区县下已开通的社区数。「西湖区 · 2 个小区」比光秃秃一个区名有用得多"
      required: 
        - "regionCode"
        - "name"
        - "cityCode"
        - "cityName"
        - "communityCount"
      additionalProperties: false
    Community: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "社区单号"
        name: 
          type: "string"
          description: "社区名（小区名）"
        address: 
          type: "string"
          description: "社区地址"
        cityCode: 
          type: "string"
          description: "所属城市。全市范围的商家靠它判定可达"
        regionCode: 
          type: "string"
          description: "所属街道/镇（9 位区划码）。商家框范围时「按街道看聚落」靠它 —— 不下发的话端上只能拿到一锅平铺清单，街道视图无从分组。"
        kind: 
          type: "string"
          description: "ESTATE 小区 / VILLAGE 村。只是展示标签，不参与匹配"
        distance: 
          type: "number"
          description: "米"
        pickups: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Pickup"
          description: "本社区可用的自提点"
        originCode: 
          type: 
            - "string"
            - "null"
          description: "官方村码，只有 `kind=VILLAGE` 且经官方名录开通的才有。**`regionCode` 是它挂的 街道/镇，不是它自己** —— 经营范围选择器再往下钻一层要用这个码，不能用 regionCode， 否则「牛杜村」会被当成「牛杜镇」去下钻。"
        originName: 
          type: 
            - "string"
            - "null"
          description: "`originCode` 对应的原始官方名（「景滑村委会」，未清理）——仅供展示/追溯， 判「是不是村委会」不要解析它，用下面的 `rural` 字段（服务端存的，不是端上猜的）。"
        rural: 
          type: "boolean"
          description: "是不是村委会（`sys_region.rural`，经 origin_code 反查）。只对 kind=VILLAGE 有意义： 村委会到此为止、不再下钻；居委会/社区还能再挑具体小区。"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "官方村名录批量补录过的坐标，可能为空"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "communityNo"
        - "name"
        - "address"
        - "cityCode"
        - "distance"
        - "pickups"
      additionalProperties: false
    ServiceArea: 
      type: "object"
      properties: 
        level: 
          "$ref": "#/components/schemas/AreaLevel"
          description: "粒度：社区 / 村 / 街道 / 区县 / 城市。**可跨粒度组合** —— 三个小区 + 一个区是四条"
        refCode: 
          type: "string"
          description: "level=COMMUNITY 时是社区号，否则是区划码"
        name: 
          type: "string"
          description: "展示名。区级以上是「浙江省 / 杭州市 / 西湖区」整条路径 —— 光一个「西湖区」全国有好几个，商家分不出删哪条"
        areaNo: 
          type: "string"
          description: "业务键（服务端回填）。范围子集（P2）按它引用；端上新加的项没有，保存后才有"
        status: 
          "$ref": "#/components/schemas/AreaStatus"
          description: "`ACTIVE` 已生效 / `PENDING` 待运营审核。\n\n勾已有社区自助生效；勾区、街道要审 —— 一家菜摊声称覆盖整个西湖区， 影响面差一个量级（ADR-013 §4.2）。**端上必须把待审标出来**： 待审的不参与展开，商家看着它在清单里却一个订单也不来， 而这是他自己永远查不出来的那类故障。"
      required: 
        - "level"
        - "refCode"
        - "name"
      additionalProperties: false
      description: "一条地理覆盖项。名字由后端拼好下发 —— 端上只拿到 330106 的话，要么显示一串数字，要么自己再查一次"
    CommunityApply: 
      type: "object"
      properties: 
        applyNo: 
          type: "string"
          description: "提报单业务键"
        merchantNo: 
          type: "string"
          description: "提报的商家"
        merchantName: 
          type: "string"
          description: "商家名。运营看着一串 M20260811… 判断不了任何事"
        name: 
          type: "string"
          description: "小区名，商家填"
        address: 
          type: "string"
          description: "地址。运营靠它判断这是不是已有社区的另一个叫法 —— 批重了商家会分不清该勾哪个"
        regionCode: 
          type: "string"
          description: "商家选的区划，**只是建议** —— 最终以运营裁决时填的为准"
        regionPath: 
          type: "string"
          description: "区划整条路径名。「北山街道」全国有好几个，光末级判断不了是不是同一个地方"
        note: 
          type: "string"
          description: "补充说明：为什么要开这个点"
        status: 
          "$ref": "#/components/schemas/CommunityApplyStatus"
          description: "待审 / 已建社区 / 已驳回。裁完即终态"
        communityNo: 
          type: "string"
          description: "通过后建出来的社区号；待审与驳回时为空"
        reason: 
          type: "string"
          description: "驳回原因，**原样展示给商家** —— 不给理由他只会原样再提一次"
        submittedAt: 
          type: "number"
          description: "提报时间（毫秒时间戳）"
      required: 
        - "applyNo"
        - "merchantNo"
        - "merchantName"
        - "name"
        - "status"
        - "submittedAt"
