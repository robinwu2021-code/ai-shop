        locked: 
          type: "boolean"
          description: "运营锁路（P2）：置灰不可改，文案「平台已暂停，联系运营」"
        scopeMode: 
          type: "string"
          description: "ALL / SUBSET（P2）：这一路只送经营范围的一个子集"
        areaNos: 
          type: "array"
          items: 
            type: "string"
          description: "SUBSET 时适用的范围项 area_no"
