        - "funder"
        - "merchantNo"
        - "startAt"
        - "endAt"
        - "remain"
        - "received"
        - "status"
        - "scopeDesc"
      additionalProperties: false
      description: "优惠券模板。**字段与后端 `CouponVO` 一一对应**。\n\n这里原先是一个被简化过的形状（`name` / `discountMinor` / `expireAt`）， 与后端一个都对不上，后果不是「少显示一块」而是**领券中心永远是空的**： 页面按 `c.expireAt > now` 过滤，而后端发的是 `endAt` —— `undefined > now` 恒 false，于是商家配好的券一张都露不出来，两边都不报错。\n\n<b>而且那个简化本身是错的</b>：`discountMinor` 一个数表达不了折扣券 —— 折扣券要的是「打几折 + 最多减多少」。后端的形状才是对的，端上跟它。"
    GroupRequestStatus: 
      type: "string"
      enum: 
        - "COLLECTING"
        - "QUOTED"
        - "LOCKED"
        - "CONFIRMED"
        - "CLOSED"
      description: "求团需求单的状态。**取值以库里存的为准**（`mkt_request.status`）。\n\n这里原先是另一套词：OPEN / QUOTING / MATCHED / EXPIRED —— 与后端一个都对不上， 于是页面上 `status === \"MATCHED\"` 恒 false（已选定报价那一块、二次确认按钮 永远不出现），而 `status !== \"MATCHED\"` 恒真（锁价之后「选定」按钮仍然挂着）。 两边各写各的，谁也没报错。\n\n枚举对账守卫当时也是绿的：它拿端上的取值去全后端的大写字面量里搜， 而 MATCHED / OPEN / EXPIRED 恰好在别的域里存在（团购、优惠券…）——\n**同名异义把缺口盖住了**。词袋比对不了「这个字段的取值」。"
    QuoteRevision: 
      type: "object"
      properties: 
        priceMinor: 
          type: "number"
          description: "改价后的单价（最小货币单位）"
        at: 
          type: "number"
          description: "改价时间"
      required: 
        - "priceMinor"
        - "at"
      additionalProperties: false
      description: "一次改价的留痕"
    Quote: 
      type: "object"
      properties: 
        quoteNo: 
          type: "string"
          description: "报价单号"
        merchant: 
          "$ref": "#/components/schemas/MerchantBrief"
          description: "报价商家。`breachCount` 会在报价卡上公示 —— 事后信用替代事前审核"
        priceMinor: 
          type: "number"
          description: "报价单价"
        minCount: 
          type: "number"
          description: "起订量：低于这个数商家不接"
        desc: 
          type: "string"
          description: "报价说明：规格、材质、是否含安装等"
        validUntil: 
          type: "number"
          description: "报价有效期。过期后不可被选定 —— 报价不能无限期挂着"
        createdAt: 
          type: "number"
          description: "报价时间"
        chosen: 
          type: "boolean"
          description: "是否被发起人选定。一个需求单只有一条为 true"
        revisions: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/QuoteRevision"
          description: "改价历史，公示给所有人。空数组 = 从未改过价"
        locked: 
          type: "boolean"
          description: "已锁价：选定后为 true，此后价格不可变"
      required: 
        - "quoteNo"
        - "merchant"
        - "priceMinor"
        - "minCount"
        - "desc"
        - "validUntil"
        - "createdAt"
        - "chosen"
        - "revisions"
        - "locked"
      additionalProperties: false
      description: "商家对某个需求单的报价。一个需求单可多家报价，由发起人挑。\n\n**报价不做事前审核，防加价靠三层机制**（见 docs/technical/ADR/ADR-003）：   1. 锁价 —— 被选定后 `locked`，下单一律用快照价，系统层面加不了价   2. 公示 —— 每次改价都写进 `revisions` 并对所有邻居可见，谁涨价谁被看见   3. 信用 —— 选定后不履约计入商家 `breachCount` 与评分，累计则限制报价资格"
    MerchantBrief: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号。贯穿商品/订单/评价/结算，是多商家模型的主线（ADR-001）"
        selfOperated: 
          type: "boolean"
          description: "这单是不是**平台自营**（销售主体是平台）。\n\n**必须显示出来 —— 电商法 §37 要求平台以显著方式区分标记自营业务， 不得误导消费者。这是法定义务，不是产品选择。**\n\n而它同时是资金模式合法性的一部分：归集路径下平台是销售主体， 页面上却让消费者以为在跟商家交易，四流就不一致了（ADR-017 §3.4）。\n\n⚠️ 自营时**商家信息照常展示**（供货商、产地、门店、评分）—— 要禁的是把销售方指给商家的**表述**，不是商家信息本身。 见 `packages/shared/tests/seller-statement.test.ts` 的禁用词表。"
        name: 
          type: "string"
          description: "店铺名"
        logo: 
          type: "string"
          description: "店铺 logo URL"
        rating: 
          type: "number"
          description: "综合评分，0–5，保留一位小数。**0 分要配合 `ratingCount` 一起看**"
        ratingCount: 
          type: "number"
          description: "计入评分的评价条数。\n\n**没有它就分不清「0 分」和「还没人评过」** —— 而这两件事对买家是相反的信号： 一家 0 分的店是被人打差评打出来的，一家没人评过的店只是新开的。 端上按 `ratingCount === 0` 显示「暂无评价」，不要显示 0 颗星。"
        verified: 
          type: "boolean"
          description: "是否通过资质认证"
        breachCount: 
          type: "number"
          description: "选定报价后不履约的次数。>0 会在报价卡上公示 —— 事后信用替代事前审核"
      required: 
        - "merchantNo"
        - "name"
        - "logo"
        - "rating"
        - "ratingCount"
        - "verified"
        - "breachCount"
      additionalProperties: false
      description: "商品卡/详情上挂的商家简要信息"
    GroupRequest: 
      type: "object"
