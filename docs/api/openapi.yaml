        title: 
          type: "string"
          description: "券名，如「满 50 减 5」"
        type: 
          "$ref": "#/components/schemas/CouponType"
          description: "类型"
        faceMinor: 
          type: "number"
          description: "满减面额（最小货币单位）。`DISCOUNT` 券为 0"
        discountRate: 
          type: "number"
          description: "折扣**万分比**，8500 = 八五折。`FULL_CUT` 券为 0"
        thresholdMinor: 
          type: "number"
          description: "使用门槛（最小货币单位）。0 表示无门槛"
        maxDiscountMinor: 
          type: "number"
          description: "折扣券封顶（最小货币单位）。仅 `DISCOUNT` 有意义"
        funder: 
          "$ref": "#/components/schemas/CouponFunder"
          description: "谁出这笔钱：平台 / 商家。**结算口径不同**"
        merchantNo: 
          type: "string"
          description: "商家券的归属商家；平台券为空"
        startAt: 
          type: "number"
          description: "可领取/可用的时间窗"
        endAt: 
          type: "number"
          description: "结束时刻（毫秒）"
        remain: 
          type: "number"
          description: "剩余可领数量"
        received: 
          type: "boolean"
          description: "当前用户是否已领取。列表页据此显示「领取」还是「去使用」"
        status: 
          "$ref": "#/components/schemas/CouponStatus"
          description: "状态"
        scopeDesc: 
          type: "string"
          description: "适用范围文案，如「仅限张记粮油店」。展示用，实际校验在服务端"
