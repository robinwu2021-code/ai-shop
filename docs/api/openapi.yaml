      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/User"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/BindPhoneReq"
  "/mp/user/phone/wx": 
