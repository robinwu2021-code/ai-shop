    MerchantPointAccount: 
      type: "object"
      properties: 
        periodExpenseMinor: 
          type: "number"
          description: "本期发分服务费支出（分）。**商家唯一感知到的积分成本**"
        period: 
          type: "string"
          description: "当前账期标识，如 `2026-08`"
        enabled: 
          type: "boolean"
          description: "本店积分是否生效 —— 全局 AND 社区 AND 主体非小微 AND 本店开关"
        disabledReason: 
          type: "string"
          description: "不生效的原因，直接展示给商家。\n\n小微主体要说「升级为个体工商户后可开启」，不能说「本店未开启积分」—— 后者会让商家去开一个他根本开不了的开关。"
        forced: 
          type: "boolean"
          description: "平台按行业强制开，商家不可自行关闭"
      required: 
        - "periodExpenseMinor"
        - "period"
        - "enabled"
        - "forced"
      additionalProperties: false
      description: "商家的积分成本视图。**单位是钱，不是分**。\n\n商家只感知**一件事**：开了积分，每笔订单要付一笔发分服务费。 他**看不到**用户抵了多少分、平台补了多少、资金池 —— 对他而言订单就是全额， 收到的是「订单金额 − 各项费用」（V34）。\n\n所以这里没有 income/net：商家侧不存在「积分兑付进账」这个概念。"
    FundsMode: 
      type: "string"
      enum: 
        - "AGGREGATED"
        - "DIRECT"
      description: "资金路径：**钱先进谁的账户**。与 `mch_entity.funds_mode` 同值。\n\n⚠️ **与「经营模式」（谁是销售主体）正交，不要合并** —— 合成一个枚举后，「直连 + 自营」（钱进商家户却说平台是卖方） 这种非法组合在类型上就是可表达的（同 ADR-013 教训）。\n\n结算侧「要不要给积分补差」判的是**这一个**： 钱在商家二级户才需要补进去，钱在平台户是平台自己少收。"
    MerchantSubject: 
      type: "string"
      enum: 
        - "NATURAL_PERSON"
        - "INDIVIDUAL"
        - "ENTERPRISE"
    BizQualification: 
      type: "string"
      enum: 
        - "REGISTERED"
        - "EXEMPT"
        - "UNREGISTERED"
      description: "经营资格（轴①，法定）：**决定能不能交易**，与通道无关。\n\n- `REGISTERED` 已办市场主体登记（有营业执照）\n- `EXEMPT` 依法免登记（电商法 §10 四类情形）—— **是合法经营者，不是无资质**\n- `UNREGISTERED` 应登记而未登记 —— 违法经营，平台不得提供交易能力"
    ExemptType: 
      type: "string"
      enum: 
        - "AGRI"
        - "HANDCRAFT"
        - "SERVICE"
        - "PETTY"
      description: "免登记情形（电商法 §10）。\n\n⚠️ **只有 `PETTY` 受 10 万元/年 约束**，其余三类无金额上限 —— 农户卖 50 万自产柿饼仍然免登记。四类混起来监控会误伤前三类。"
    MerchantType: 
      "$ref": "#/components/schemas/MerchantSubject"
      deprecated: "用 {@link MerchantSubject }。旧取值 `PLATFORM/COMPANY/INDIVIDUAL` 已废弃 ——\n其中 `PLATFORM`（平台自营）**不是一种主体类型**：平台自营的主体也是个企业，\n「自营」是归属标记，混进主体枚举里让这一列同时承担了两件事。\n一期没有真实的自营商家，暂不为它单开字段。"
