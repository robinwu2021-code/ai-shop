# 自动生成，请勿手改（npm run gen:api）
openapi: "3.1.0"
info: 
  title: "ai-shop C 端 BFF"
  version: "0.1.0"
  license: 
    name: "UNLICENSED"
  description: "由 c-app/src/api/endpoints.ts + api/requests.ts + packages/shared/types 自动生成，请勿手改。\n生成命令：cd c-app && npm run gen:api\n\n口径：响应包 {code,msg,data}，分页 {records,total,page,size}，camelCase，单号 xxxNo，时间 xxxAt（UTC 毫秒），枚举大写下划线，金额为最小货币单位整数。禁止 delete*，软删除用 archive*。"
servers: 
  - url: "http://localhost:8080"
    description: "本地后端"
components: 
  securitySchemes: 
    bearerAuth: 
      type: "http"
      scheme: "bearer"
      description: "C 池 Bearer，仅属主鉴权，无 RBAC"
  schemas: 
    CategoryType: 
      type: "string"
      enum: 
        - "NORMAL"
        - "FRESH"
        - "SERVICE"
        - "VIRTUAL"
        - "CARD"
    FulfillmentType: 
      type: "string"
      enum: 
        - "STORE_PICKUP"
        - "NEIGHBOR_PICKUP"
        - "MERCHANT_DELIVERY"
        - "EXPRESS"
        - "STORE_VERIFY"
        - "APPOINTMENT"
        - "INSTANT"
    Lang: 
      type: "string"
      enum: 
        - "zh-CN"
        - "en"
        - "ar"
    CurrencyCode: 
      type: "string"
      enum: 
        - "CNY"
        - "USD"
        - "AED"
    MarketId: 
      type: "string"
      enum: 
        - "CN"
        - "AE"
        - "US"
    ServiceScope: 
      type: "string"
      enum: 
        - "COMMUNITY"
        - "CITY"
        - "PLATFORM"
    FulfillmentReach: 
      type: "string"
      enum: 
        - "PICKUP"
        - "ONSITE"
        - "SHIPPING"
    I18nText: 
      "$ref": "#/components/schemas/Record_Lang_string"
      description: "多语言文案（mock 内部用；对外契约由后端按 Accept-Language 返回已本地化的 string）"
    PageQuery: 
      type: "object"
      properties: 
        page: 
          type: "number"
          description: "页码，从 1 起。不传按 1 处理"
        size: 
          type: "number"
          description: "每页条数。不传按各接口默认值（通常 10 或 20）"
      additionalProperties: false
    TrafficSource: 
      type: "string"
      enum: 
        - "MERCHANT_OWNED"
        - "PLATFORM"
      description: "流量来源。**与 ops-web 的 `TrafficSource` 同名** —— 那边多 INVITE/CHANNEL 两个值（已标 MERGE）"
    PickupRef: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "取货点号"
        name: 
          type: "string"
          description: "名称"
        address: 
          type: 
            - "string"
            - "null"
          description: "地址"
        type: 
          "$ref": "#/components/schemas/PickupPointType"
          description: "类型"
        status: 
          type: "string"
          description: "状态"
      required: 
        - "pickupNo"
        - "name"
        - "type"
        - "status"
      additionalProperties: false
      description: "门店引用的取货点。status 来自 cmt_pickup_point：只有 ACTIVE 参与买家侧"
    PickupPointType: 
      type: "string"
      enum: 
        - "STORE"
        - "NEIGHBOR"
        - "PLATFORM"
      description: "自提点类型。对应 `cmt_pickup_point.type`。\n\n⚠️ 此前只以裸字面量的形式内联在 `PickupPoint.type` 里 —— 值是对的， 但**没有单一声明处**：对账工具扫不到它，各处写的是裸字符串。 `CATEGORY_TYPE` 出事前正是这个状态（见 docs/technical/枚举统一方案.md §2「C 无主」）： 今天没 bug，但下一个人在别处再写一次时，没有任何东西会拦住他写错。"
    FulfillmentImpactItem: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品号"
        title: 
          type: "string"
          description: "标题"
      required: 
        - "goodsNo"
        - "title"
      additionalProperties: false
      description: "关掉某条履约路会影响到的商品（P2 处置前的预览）。\n\n**给它起个名字，不写成内联的 `Array<{ ... }>`**：契约里的匿名结构在规格生成器 那边引用不到，只能落成一个空 object —— 后端照着实现就得自己猜返回什么。"
    PickupCandidate: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "取货点号"
        name: 
          type: "string"
          description: "名称"
        address: 
          type: 
            - "string"
            - "null"
          description: "地址"
        type: 
          "$ref": "#/components/schemas/PickupPointType"
          description: "类型"
        status: 
          type: "string"
          description: "ACTIVE / PENDING / REJECTED …；本店自建的 PENDING 点可引用，别家的不行"
        communityNo: 
          type: "string"
          description: "所在社区号"
        communityName: 
          type: 
            - "string"
            - "null"
          description: "所在社区名"
        ownerStoreNo: 
          type: 
            - "string"
            - "null"
          description: "STORE 点的承接门店；= 本店即「我自建的」"
        rejectReason: 
          type: 
            - "string"
            - "null"
          description: "被驳回的原因。**要原样回商家** —— 不写等于让人猜"
      required: 
        - "pickupNo"
        - "name"
        - "type"
        - "status"
        - "communityNo"
      additionalProperties: false
      description: "门店可引用的取货点候选（P1）：范围内的常驻点 + 本店自建的点"
    Pickup: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "自提点单号"
        name: 
          type: "string"
          description: "自提点名称（通常是承接店铺的店名）"
        address: 
          type: "string"
          description: "自提点地址"
        distance: 
          type: "number"
          description: "距当前社区的距离（米），服务端算好下发"
        hostMerchantNo: 
          type: "string"
          description: "承接这个自提点的商家（ADR-005：PickupPoint.type=STORE，承接方是入驻商家而非团长）"
        hostName: 
          type: "string"
          description: "承接商家的店名"
        hostAvatar: 
          type: "string"
          description: "承接商家的头像/门头图"
        openHours: 
          type: "string"
          description: "营业时间文案，如 `08:00-21:00`。展示用，不参与计算"
        arrivalDesc: 
          type: "string"
          description: "到货时间说明，如「次日 18:00 后到」。影响用户选不选这个点"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "取货点坐标（gcj02，E6）。**可能为空** —— 存量点是手填地址建的。 买家要拿着它导航过去，没有就只能显示地址文本。"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "pickupNo"
        - "name"
        - "address"
        - "distance"
        - "hostMerchantNo"
        - "hostName"
        - "hostAvatar"
        - "openHours"
        - "arrivalDesc"
      additionalProperties: false
    VerifyBatchResult: 
      type: "object"
      properties: 
        successCount: 
          type: "number"
          description: "成功核销的单数"
        failed: 
          type: "array"
          items: 
            type: "object"
            properties: 
              code: 
                type: "string"
              reason: 
                type: "string"
            required: 
              - "code"
              - "reason"
            additionalProperties: false
          description: "失败明细。code 是那张码，reason 是为什么不行"
      required: 
        - "successCount"
        - "failed"
      additionalProperties: false
      description: "批量核销结果。\n**不是整批回滚**：逐条尝试，失败的逐条回报 —— 店主需要知道**哪一单**没成， 而不是「3 成功 2 失败」然后自己一个个找。整批回滚更糟：一张废码会让另外四单白扫。"
    PickupOverview: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "自提点单号"
        pickupName: 
          type: "string"
          description: "自提点名称"
        pendingVerify: 
          type: "number"
          description: "待核销单数 —— 到货了还没人来取的"
        arrivedBatches: 
          type: "number"
          description: "今日到货批次"
        serviceFeeMinor: 
          type: "number"
          description: "累计履约服务费（最小货币单位）"
      required: 
        - "pickupNo"
        - "pickupName"
        - "pendingVerify"
        - "arrivedBatches"
        - "serviceFeeMinor"
      additionalProperties: false
      description: "自提点履约总览（后端 `GET /biz/pickup/overview`）。 承接方最关心的三个数：还有几单没人来取、今天到了几批、这些活挣了多少服务费。"
    RateCard: 
      type: "object"
      properties: 
        merchantOwnedRate: 
          type: "number"
          description: "自带客流费率（万分比）。商家自己带来的客人，平台抽成低"
        platformRate: 
          type: "number"
          description: "平台客流费率（万分比）。平台分发带来的订单"
        note: 
          type: "string"
          description: "费率说明文案。**须写明「以下单时快照为准，调整不影响历史订单」**"
      required: 
        - "merchantOwnedRate"
        - "platformRate"
        - "note"
      additionalProperties: false
      description: "费率卡（后端 `GET /biz/settle/rate-card`）。\n\n⚠️ 费率是**万分比整数**（后端 `platformRate / 100.0` 才是百分数）—— 直接当百分数显示会把 2% 显示成 200%。 语义同样要照搬：**费率以下单时快照为准，调整不影响历史订单** —— 不写清楚的话，商家会以为平台调价能追溯到已成交的单。"
    AppointmentDaySlots: 
      type: "object"
      properties: 
        date: 
          type: "string"
          description: "YYYY-MM-DD（市场本地时区）"
        times: 
          type: "array"
          items: 
            type: "object"
            properties: 
              time: 
                type: "string"
              left: 
                type: "number"
            required: 
              - "time"
              - "left"
            additionalProperties: false
          description: "当天各时段的余量。`time` 形如 `14:00`，`left` 为剩余可约数，0 表示约满"
      required: 
        - "date"
        - "times"
      additionalProperties: false
      description: "预约时段的**按天展示分组**（SERVICE + APPOINTMENT）。\n\n⚠️ <b>与  {@link  AppointmentSlot }  不是一回事</b>，别混：   · 这个是「一天 × 若干时间点」的**展示结构**，给选择器分组用   · 那个是排期的**一行**（有 slotNo，下单占的就是它）\n\n它此前就叫 AppointmentSlot，而唯一的使用处是 `GoodsVO.slots?` —— 一个注释里明写着「后端从不下发」的幽灵字段。真排期落地时把名字让了出来。"
    PickupOwnerType: 
      type: "string"
      enum: 
        - "MERCHANT"
        - "USER"
        - "PLATFORM"
      description: "自提点承接方类型。与  {@link  PickupPointType }  不同：那个说「是什么点」，这个说「谁在承接」"
    PickupScope: 
      type: "string"
      enum: 
        - "PERMANENT"
        - "GROUP_INSTANCE"
      description: "自提点作用域：常驻 / 团粒度（一团一销）"
    PickupFeeMode: 
      type: "string"
      enum: 
        - "NONE"
        - "PER_ITEM"
        - "RATE"
      description: "自提点计费方式。**与 ops-web 的 `PickupFeeMode` 同值** —— 费率线下逐点协商，故两种都留"
    ArrivalIssueKind: 
      type: "string"
      enum: 
        - "SHORTAGE"
        - "DAMAGE"
      description: "到货异常类型：缺件 / 破损。B 端到货登记时上报（ADR-005 履约链路）"
    AppointmentSlot: 
      type: "object"
      properties: 
        slotNo: 
          type: "string"
          description: "时段号。**下单占的是它**"
        storeNo: 
          type: "string"
          description: "门店号"
        startAt: 
          type: "number"
          description: "开始时刻（毫秒）"
        endAt: 
          type: "number"
          description: "结束时刻（毫秒）"
        capacity: 
          type: "number"
          description: "这一档能约几个人"
        booked: 
          type: "number"
          description: "已约人数"
        remaining: 
          type: "number"
          description: "还能核几次"
        status: 
          "$ref": "#/components/schemas/SlotStatus"
          description: "OPEN 可约 / CLOSED 停约。停约**不删行也不赶人**"
      required: 
        - "slotNo"
        - "storeNo"
        - "startAt"
        - "endAt"
        - "capacity"
        - "booked"
        - "remaining"
        - "status"
      additionalProperties: false
    SlotStatus: 
      type: "string"
      enum: 
        - "OPEN"
        - "CLOSED"
      description: "预约时段状态。CLOSED 停约**不删行也不赶人** —— 已约的照常履约"
    PickingRow: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        skuNo: 
          type: "string"
          description: "SKU 单号。分拣按 SKU 汇总，不是按商品"
        title: 
          type: "string"
          description: "商品标题"
        cover: 
          type: "string"
          description: "封面图，照着点数时用来认货"
        spec: 
          type: "string"
          description: "规格文案"
        totalQty: 
          type: "number"
          description: "该 SKU 在本自提点的总件数（含赠品）"
        buyers: 
          type: "array"
          items: 
            type: "object"
            properties: 
              nickname: 
                type: "string"
              qty: 
                type: "number"
              orderNo: 
                type: "string"
            required: 
              - "nickname"
              - "qty"
              - "orderNo"
            additionalProperties: false
          description: "谁要几件"
      required: 
        - "goodsNo"
        - "skuNo"
        - "title"
        - "cover"
        - "spec"
        - "totalQty"
        - "buyers"
      additionalProperties: false
      description: "分拣单的一行：按商品汇总，团长照着这个点数"
    PickupOrder: 
      type: "object"
      properties: 
        subOrderNo: 
          type: "string"
          description: "子单号 —— 履约的最小单位是子单，不是主单"
        verifyCode: 
          type: "string"
          description: "取货码"
        buyerNickname: 
          type: "string"
          description: "买家昵称。认人用；没设昵称时为空"
        buyerPhoneTail: 
          type: "string"
          description: "手机号后四位。认人够用，联系走平台通道（B12）"
        merchantName: 
          type: "string"
          description: "货主商家名。自提点可能替好几家收货"
        status: 
          "$ref": "#/components/schemas/SubOrderStatus"
          description: "子单状态：WAIT_FULFILL / ARRIVED / COMPLETED / …"
        pickupNo: 
          type: "string"
          description: "这单该在哪个自提点取。核销时后端会比对，不是本点直接拒"
        items: 
          type: "array"
          items: 
            type: "object"
            properties: 
              goodsNo: 
                type: "string"
              title: 
                type: "string"
              spec: 
                type: "string"
              qty: 
                type: "number"
            required: 
              - "goodsNo"
              - "title"
              - "qty"
            additionalProperties: false
          description: "这单要交付的东西。分拣与交货时按它点数"
      required: 
        - "subOrderNo"
        - "verifyCode"
        - "status"
        - "items"
      additionalProperties: false
      description: "自提点履约台上的一单（`/biz/pickup/orders`）。\n\n**不是 `Order`**：这里的承接方可能是别家商家的自提点，字段按「履约必需」 裁到最小 —— 认得出人、点得清件数、核得了码，仅此而已（B12）。 端上此前把它当 `Order` 用，于是按 `status === \"ARRIVED\"` 过滤（那是 mock 的口径）， 真实后端返回 `WAIT_FULFILL`，**列表因此永远是空的**。"
    SubOrderStatus: 
      type: "string"
      enum: 
        - "WAIT_PAY"
        - "WAIT_FULFILL"
        - "FULFILLING"
        - "COMPLETED"
        - "CANCELLED"
        - "REFUNDED"
      description: "子单状态（`ord_sub_order.status`）。\n\n**与  {@link  OrderStatus }  不是同一套**：主单管钱（付没付、退没退）， 子单管货（这家商家的这批货履约到哪一步了）。一张主单拆给三家商家时， 三个子单各走各的 —— 把两者合成一个字段，那三家里有一家发了货就说不清了。"
    VerifyResult: 
      type: "object"
      properties: 
        success: 
          type: "boolean"
          description: "**判成功只看它** —— 失败同样是 HTTP 200 + code 0"
        subOrderNo: 
          type: 
            - "string"
            - "null"
          description: "成功或识别到单时给出；码根本不存在时为空"
        reason: 
          type: 
            - "string"
            - "null"
          description: "CODE_NOT_FOUND / ALREADY_VERIFIED / NOT_THIS_PICKUP / NOT_ARRIVED / REFUNDED / NOT_PAID"
      required: 
        - "success"
      additionalProperties: false
      description: "核销结果。\n\n⚠️ **失败也是 HTTP 200 + `code: 0`**，靠 `success` 判 —— 端上不能只看有没有抛异常。 此前 b-app 正是这么写的：任何一次失败（码无效、已核销、不是本点） 都会走进成功分支，界面提示「核销成功」而货其实没核掉。"
    GroupPickupOrder: 
      type: "object"
      properties: 
        subOrderNo: 
          type: "string"
          description: "子订单号（`SUB…`）—— 这条链路上的「一单」就是一张子订单"
        buyerNickname: 
          type: "string"
          description: "买家昵称。自提点认人靠它"
        verifyCode: 
          type: "string"
          description: "核销码。**只有发起人看得到**，参团者看自己那一单即可"
        status: 
          "$ref": "#/components/schemas/OrderStatus"
          description: "状态"
        items: 
          type: "array"
          items: 
            type: "object"
            properties: 
              goodsNo: 
                type: "string"
              title: 
                type: "string"
              spec: 
                type: "string"
              qty: 
                type: "number"
            required: 
              - "goodsNo"
              - "title"
              - "spec"
              - "qty"
            additionalProperties: false
          description: "明细行"
      required: 
        - "subOrderNo"
        - "buyerNickname"
        - "verifyCode"
        - "status"
        - "items"
      additionalProperties: false
      description: "本团待取的一单（发起人视角，C-GB-06 邻里自提）。\n\n**不是 `Order`**。契约此前把这条链路的三个端点都声明成返回 `Order`， 而后端返回的一直是这个形状 —— 页面读 `o.orderNo` 拿到 undefined， 于是 `v-for` 的 key 全是 undefined，核销按钮点谁都一样。 发起人只需要「谁的、几件、核销码」，不需要整张订单。"
    OrderStatus: 
      type: "string"
      enum: 
        - "WAIT_PAY"
        - "WAIT_OFFLINE_PAY"
        - "PAID"
        - "FULFILLING"
        - "COMPLETED"
        - "CANCELLED"
        - "REFUNDED"
    PickupPoint: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "自提点单号"
        type: 
          "$ref": "#/components/schemas/PickupPointType"
          description: "自提点由谁承接。**三档，各自的费用规则完全不同**（2026-08-06 定）：   · STORE    商家自己的门店 —— 商家自行解决，平台不收履约服务费   · NEIGHBOR 团发起人家里 —— **零报酬**（ADR-005），有报酬就是团长招募换个名字   · PLATFORM 平台提供的点 —— 收履约服务费，**费率线下逐点协商，由运营平台录入**"
        ownerType: 
          "$ref": "#/components/schemas/PickupOwnerType"
          description: "承接方所属账号池"
        ownerNo: 
          type: "string"
          description: "承接方单号，按 ownerType 落在 merchantNo 或 cUserNo 上"
        scope: 
          "$ref": "#/components/schemas/PickupScope"
          description: "常驻 | 团粒度（一团一销）"
        groupNo: 
          type: "string"
          description: "type=NEIGHBOR 时必填：这个点只服务这一个团"
        name: 
          type: "string"
          description: "自提点名称"
        address: 
          type: "string"
          description: "展示地址。**成团前只到楼栋，付款后才给完整门牌**（B13）—— 未成团的团不该暴露发起人住址。"
        timeSlot: 
          type: "string"
          description: "约定取货时段。邻居家不能一直堆着货（B15）"
        feeMode: 
          "$ref": "#/components/schemas/PickupFeeMode"
          description: "计费口径。**必须显式标出用哪一种** —— 库里按件与按率两列长期并存， 没有判别列的话结算侧只能猜，猜错就是给自提点少付或多付钱。 之所以两种都留：费率是**线下逐点协商**的，有的点谈成按件、有的谈成按成交额抽成， 硬统一成一种会让运营在谈判里没有筹码。"
        serviceFeePerItemMinor: 
          type: "number"
          description: "feeMode=PER_ITEM 时的按件服务费。STORE 与 NEIGHBOR 恒为 0"
        serviceFeeRate: 
          type: "number"
          description: "feeMode=RATE 时的费率（万分比）。STORE 与 NEIGHBOR 恒为 0"
      required: 
        - "pickupNo"
        - "type"
        - "ownerType"
        - "ownerNo"
        - "scope"
        - "name"
        - "address"
        - "feeMode"
        - "serviceFeePerItemMinor"
        - "serviceFeeRate"
      additionalProperties: false
    Carrier: 
      type: "object"
      properties: 
        carrier: 
          type: "string"
          description: "编号，如 `SF`。**调拨单存的就是它** —— 跨库不能外键，所以存对方的业务键"
        name: 
          type: "string"
          description: "名字。选中后要**一起回传**给发货接口：进销存读不了主库，快照只能由端上带过去"
      required: 
        - "carrier"
        - "name"
      additionalProperties: false
      description: "一家承运方（`CarrierVO`）。**归履约域维护，进销存只读**。"
    StockSummary: 
      type: "object"
      properties: 
        itemCount: 
          type: "number"
          description: "在管货品数"
        shortageCount: 
          type: "number"
          description: "缺货件数（低于安全库存）"
        staleCount: 
          type: "number"
          description: "滞销件数（长期未动销）"
        inTransitCount: 
          type: "number"
          description: "待收货的调拨单数。**按单不按件** —— 收货是按单做的，给件数点不进任何一张单"
        openCountNo: 
          type: 
            - "string"
            - "null"
          description: "还开着的那张盘点单的单号，没有就没有这个字段。\n**给单号不给个数**：工作台的「继续盘点」要带着它跳， 不带的话那一页会开一张**新的**盘点单，而按钮上写着「继续」。"
      required: 
        - "itemCount"
        - "shortageCount"
        - "staleCount"
        - "inTransitCount"
      additionalProperties: false
      description: "库存总览的三个数（`SummaryVO`）。"
    Supplier: 
      type: "object"
      properties: 
        supplierNo: 
          type: "string"
          description: "档案编号 `SUP…`。**进货单存的是它，不是名字** —— 名字会改，指向不会"
        name: 
          type: "string"
          description: "全名。同一商家内唯一（后端 `uk_sup_name`），重名建档会被 10409 拒"
        shortName: 
          type: 
            - "string"
            - "null"
          description: "短名，单据列表上显示它 —— 长名换行会把一行撑成两行"
        contactName: 
          type: 
            - "string"
            - "null"
          description: "联系人。**只作记录**，不发通知：这一版没有给供应商推消息的通道"
        contactPhone: 
          type: 
            - "string"
            - "null"
          description: "联系电话。同上，给人打的，不参与任何自动流程"
        remark: 
          type: 
            - "string"
            - "null"
          description: "备注。**引用平台档案时这一列仍归商家写** —— 那是他自己的话"
        status: 
          type: "string"
          description: "ACTIVE 在用 · ARCHIVED 已停用。**停用不删除** —— 历史单据要指得回去"
        fromPlatform: 
          type: "boolean"
          description: "引用平台档案。**据此把名称与联系方式置灰** —— 不看这一位的话，商家会改了才发现改不动。"
      required: 
        - "supplierNo"
        - "name"
        - "status"
        - "fromPlatform"
      additionalProperties: false
      description: "一家供应商（`SupplierVO`）。进货单指向的那个**稳定对象** —— 在它之前只有一个会漂的名字字符串。"
    StockBalance: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "物料号。**进销存自己的编号**，与商城的 skuNo 靠 inv_item_ref 对上 —— 跨库不能外键"
        skuNo: 
          type: "string"
          description: "平台商品的 SKU 号。**绑码要它** —— 条码的真源是 `prd_sku.barcode`， 那是商品域的列，那边不认识 `itemId`。\n\n空 = 这件物料没有平台映射（独立交付形态下的自有主数据），**绑不了码**。 空时不要拿 `itemId` 顶替：两个域的 ID 长得都像编号，冒充了不会有人报错。"
        name: 
          type: "string"
          description: "货品名"
        specText: 
          type: "string"
          description: "规格描述（「10斤装」）。人读的，不参与匹配"
        baseUom: 
          type: "string"
          description: "基本计量单位（个/斤/箱）。**所有数量都以它为准**，收货填别的单位要先换算"
        onHand: 
          type: "number"
          description: "实存"
        reserved: 
          type: "number"
          description: "预留：别人下了单还没付钱的量"
        available: 
          type: "number"
          description: "可用 = 实存 − 预留。预留是别人下了单还没付钱的量，付了款才真扣"
        safetyStock: 
          type: "number"
          description: "安全库存。低于它算缺货 —— 0 表示不设"
        lastMovedAt: 
          type: "string"
          description: "最后一次动过的时间；滞销判据"
        flags: 
          type: "array"
          items: 
            type: "string"
          description: "SHORTAGE 缺货 · STALE 滞销。**空数组 = 这件没事**"
      required: 
        - "itemId"
        - "name"
        - "onHand"
        - "reserved"
        - "available"
        - "flags"
      additionalProperties: false
      description: "一行库存（`BalanceVO`）。"
    StockItemDetail: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "物料号。**进销存自己的编号**，与商城的 skuNo 靠 inv_item_ref 对上 —— 跨库不能外键"
        name: 
          type: "string"
          description: "货品名"
        specText: 
          type: "string"
          description: "规格描述（「10斤装」）。人读的，不参与匹配"
        baseUom: 
          type: "string"
          description: "基本计量单位（个/斤/箱）。**所有数量都以它为准**，收货填别的单位要先换算"
        barcode: 
          type: "string"
          description: "条码。**一个物料可以有多个**（换包装还是同一件货），这里给主条码"
        itemCode: 
          type: "string"
          description: "商家自己的货号，对接 ERP 用"
        onHand: 
          type: "number"
          description: "实存"
        reserved: 
          type: "number"
          description: "预留：别人下了单还没付钱的量"
        available: 
          type: "number"
          description: "可用 = 实存 − 预留"
        safetyStock: 
          type: "number"
          description: "安全库存的**默认阈值**（物料上那一级）。低于它算缺货。\n\n**`0` 是「不预警」不是「低于 0 才报」** —— 界面上要写成「不预警」， 显示成 0 的话商家会以为是个没设好的数而去改它。"
        byLocation: 
          type: "array"
          items: 
            type: "object"
            properties: 
              locationId: 
                type: "string"
              locationName: 
                type: "string"
              onHand: 
                type: "number"
              safetyStock: 
                type: "number"
            required: 
              - "locationId"
              - "locationName"
              - "onHand"
            additionalProperties: false
          description: "在各库位的分布。总数与上面的 onHand 一致，对不上就是有库位没登记。\n\n`safetyStock` 是**该库位的覆盖值**，`undefined` = 跟随上面那个默认值。 与「显式设成 0」是两件事：后者是这个库位不预警。"
      required: 
        - "itemId"
        - "name"
        - "onHand"
        - "reserved"
        - "available"
        - "safetyStock"
        - "byLocation"
      additionalProperties: false
      description: "某个物料在各库位的分布（`ItemDetailVO`）。"
    StockCrossStoreRow: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "货号，点开一行取分布用的键"
        name: 
          type: "string"
          description: "商品名"
        specText: 
          type: "string"
          description: "规格文案（「500g/袋」这类），同名不同规格靠它分辨"
        baseUom: 
          type: "string"
          description: "基本单位，数量后面跟着显示"
        onHand: 
          type: "number"
          description: "全部库位合计"
        reserved: 
          type: "number"
          description: "已被订单占用的量（合计）—— 在库但不能再卖"
        available: 
          type: "number"
          description: "可卖量合计 = onHand - reserved。**店主真正该看的是这个数**"
        shortageLocations: 
          type: "number"
          description: "**缺货的库位数**，不是缺货的件数。列表按它降序 —— 五家店断了三家的那件货，比某一家店少两袋更值得先看见。"
        byLocation: 
          type: "array"
          items: 
            type: "object"
            properties: 
              locationId: 
                type: "string"
              locationName: 
                type: "string"
              onHand: 
                type: "number"
              safetyStock: 
                type: "number"
            required: 
              - "locationId"
              - "locationName"
              - "onHand"
            additionalProperties: false
          description: "各库位分布，**随列表一起下发**：点开一行不再发第二次请求"
      required: 
        - "itemId"
        - "name"
        - "onHand"
        - "reserved"
        - "available"
        - "shortageLocations"
        - "byLocation"
      additionalProperties: false
      description: "跨店总览的一行（`CrossStoreVO`）：**一件货 × 全部库位**。\n\n与 `StockBalance` 的区别是维度 —— 那一条是「一件货在一个库位」， 多门店商家看到的是同一件货重复 N 行；这一条把 N 行收成一行。"
    StockLedgerRow: 
      type: "object"
      properties: 
        id: 
          type: "number"
          description: "行号。台账不可变，它只用来分页定位"
        itemId: 
          type: "string"
          description: "这一行动的是哪件货。**按单查靠它** —— 只给单号的话那一屏是一列没名字的数"
        itemName: 
          type: "string"
          description: "货品名。台账只存 item_id，名字是 join 出来的 —— 只给单号的话那一屏是一列没名字的数"
        docKind: 
          "$ref": "#/components/schemas/StockDocKind"
          description: "IN 入库 / OUT 出库"
        docNo: 
          type: "string"
          description: "单号"
        reasonCode: 
          type: "string"
          description: "变动原因码。**盘点差异不为 0 时必填** —— 说不出原因的调整事后查不了账"
        qtyDelta: 
          type: "number"
          description: "本行的变动量。**有符号**：入库为正、出库为负"
        balanceAfter: 
          type: "number"
          description: "这一行之后的结存。台账靠它自证连续，断一行就能看出来"
        occurredAt: 
          type: "string"
          description: "业务发生时刻。**不是落库时刻** —— 补录昨天的进货，这里是昨天"
        operator: 
          type: "string"
          description: "经手人"
      required: 
        - "id"
        - "itemId"
        - "itemName"
        - "docKind"
        - "docNo"
        - "reasonCode"
        - "qtyDelta"
        - "balanceAfter"
        - "occurredAt"
      additionalProperties: false
      description: "台账一行（`LedgerVO`）。**不可变** —— 只有查看，没有编辑"
    StockDocKind: 
      type: "string"
      enum: 
        - "IN"
        - "OUT"
      description: "库存台账的方向。IN 入库 / OUT 出库 —— 台账不可变，只有查看没有编辑"
    StockLedgerPage: 
      type: "object"
      properties: 
        entries: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/StockLedgerRow"
          description: "本页的台账行"
        nextCursor: 
          type: 
            - "number"
            - "null"
          description: "下一页游标。**由服务端给**，前端不要自己拿最后一行的 id 推"
      required: 
        - "entries"
      additionalProperties: false
      description: "台账一页（`LedgerPageVO`）。游标由服务端给，前端不要自己拿最后一行的 id 推"
    StockDocument: 
      type: "object"
      properties: 
        kind: 
          type: "string"
          description: "IN 入库 · OUT 出库 · COUNT 盘点 · TRANSFER 调拨"
        docNo: 
          type: "string"
          description: "单号"
        status: 
          type: "string"
          description: "DRAFT / POSTED / VOIDED，调拨还有 SHIPPED / RECEIVED"
        label: 
          type: "string"
          description: "取值域码，用来查文案：`PURCHASE` / `SCRAP` / `RETURN_SUPPLIER` / `COUNT` / `TRANSFER`……\n\n**文案在端上，不在后端。** 此前这些码被后端拼进 `subtitle` 直接下发， 商家看到的是 `SCRAP`；而盘点与调拨那两行是后端硬编码的中文， 阿语商家看到的是中文。两种坏法藏在同一个字段里。"
        subtitle: 
          type: "string"
          description: "**只有自由文本**：供应商名、去向名、订单号、库位名。\n\n再往里塞枚举的话，上面那条修的东西下一轮就长回来了。"
        totalQty: 
          type: "number"
          description: "本单合计数量，按明细行汇总"
        occurredAt: 
          type: "string"
          description: "业务发生时刻。**不是落库时刻** —— 补录昨天的进货，这里是昨天"
        operator: 
          type: "string"
          description: "经手人"
      required: 
        - "kind"
        - "docNo"
        - "status"
        - "totalQty"
        - "occurredAt"
      additionalProperties: false
      description: "单据中心的一行（`DocumentVO`）。四类单据长得不一样，下发的是它们的交集"
    StockMonthly: 
      type: "object"
      properties: 
        month: 
          type: "string"
          description: "月份（`2026-08`）"
        opening: 
          type: "number"
          description: "期初结存"
        purchased: 
          type: "number"
          description: "本月进货"
        sold: 
          type: "number"
          description: "本月销售"
        lost: 
          type: "number"
          description: "本月报损"
        adjusted: 
          type: "number"
          description: "本月盘盈盘亏。**有符号**"
        closing: 
          type: "number"
          description: "期末结存。界面上要能看出 期初 + 进 − 销 − 损 ± 调 = 期末"
        balanced: 
          type: "boolean"
          description: "算式对不对得上。**对不上要显眼**，那说明台账漏了一笔"
        soldCostMinor: 
          type: "number"
          description: "本月销售出库的成本合计（分）。**按每一笔当时的单位成本累加**， 不是「销量 × 当前成本价」—— 后者在进价波动时会把上个月的账算成今天的价。\n\n**这不是毛利。** 毛利 = 收入 − 成本，而收入不在进销存域： 出库单只带成本、不带售价（同一件货不同渠道价不一样，写进来就有了第二个真源）。 要毛利得由知道收入的那一侧拿这个数去减。"
        lostCostMinor: 
          type: "number"
          description: "本月报损 + 盘亏的成本合计（分）—— 「这个月亏了多少钱」那个数"
      required: 
        - "month"
        - "opening"
        - "purchased"
        - "sold"
        - "lost"
        - "adjusted"
        - "closing"
        - "balanced"
        - "soldCostMinor"
        - "lostCostMinor"
      additionalProperties: false
      description: "进销存月报（`MonthlyVO`）。界面上要能看出 期初 + 进 − 销 − 损 ± 调 = 期末"
    StockRank: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "物料号。**进销存自己的编号**，与商城的 skuNo 靠 inv_item_ref 对上 —— 跨库不能外键"
        name: 
          type: "string"
          description: "货品名"
        specText: 
          type: "string"
          description: "规格描述（「10斤装」）。人读的，不参与匹配"
        qty: 
          type: "number"
          description: "数量。⚠️ **两种榜含义不同**：动销榜是销量，滞销榜是库存量"
        costAmountMinor: 
          type: 
            - "number"
            - "null"
          description: "金额（分）。**滞销榜不算这个数，会是 `null`** —— 后端没配 `NON_NULL`，null 是照常下发的，所以类型要允许它。 兜底成 0 会让人以为这批货不值钱，而它恰恰是压着钱的那批。"
      required: 
        - "itemId"
        - "name"
        - "qty"
      additionalProperties: false
      description: "榜单一行（`RankVO`）。"
    StockLocation: 
      type: "object"
      properties: 
        locationId: 
          type: "string"
          description: "库位号"
        name: 
          type: "string"
          description: "货品名"
        kind: 
          type: "string"
          description: "STORE 门店 · WAREHOUSE 仓 · TRANSIT 在途（系统的，不可删）"
        externalRef: 
          type: "string"
          description: "门店库位对应的 storeNo"
        sourceLocationId: 
          type: "string"
          description: "发货源：设了之后这家店下单扣的是源仓的库存。**不允许接力**"
        isDefault: 
          type: "number"
          description: "默认库位。一个主体**恰好一个** —— 它是「没指定库位时进哪儿」的答案"
        status: 
          type: "string"
          description: "状态"
      required: 
        - "locationId"
        - "name"
        - "kind"
      additionalProperties: false
      description: "库位（`InvLocation`）。**仓是一种库位，不是一种门店**"
    StockLineReq: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "物料号。**进销存自己的编号**，与商城的 skuNo 靠 inv_item_ref 对上 —— 跨库不能外键"
        qty: 
          type: "number"
          description: "数量。⚠️ **两种榜含义不同**：动销榜是销量，滞销榜是库存量"
        uom: 
          type: "string"
          description: "本行使用的计量单位，与 baseUom 不同时后端换算"
        unitCostMinor: 
          type: "number"
          description: "单位成本（分）。空 = 沿用上一次的进价"
      required: 
        - "itemId"
        - "qty"
      additionalProperties: false
      description: "单据行（`LineReq`）。`unitCostMinor` 只有入库要"
    StockCountFilled: 
      type: "object"
      properties: 
        itemId: 
          type: "string"
          description: "物料号。**进销存自己的编号**，与商城的 skuNo 靠 inv_item_ref 对上 —— 跨库不能外键"
        countedQty: 
          type: "number"
          description: "实盘数：人数出来多少"
        reasonCode: 
          type: "string"
          description: "变动原因码。**盘点差异不为 0 时必填** —— 说不出原因的调整事后查不了账"
      required: 
        - "itemId"
        - "countedQty"
      additionalProperties: false
      description: "盘点填数（`StockCountService.Filled`）。差异不为 0 时 `reasonCode` 必填"
    StockCount: 
      type: "object"
      properties: 
        countNo: 
          type: "string"
          description: "盘点单号"
        status: 
          type: "string"
          description: "COUNTING 进行中 / POSTED 已过账"
        locationId: 
          type: "string"
          description: "库位号"
        startedAt: 
          type: "string"
          description: "开始盘点的时刻"
        operator: 
          type: "string"
          description: "经手人"
        lines: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/StockCountLine"
          description: "明细行"
      required: 
        - "countNo"
        - "status"
        - "lines"
      additionalProperties: false
      description: "一张盘点单（`CountVO`）。**`bookQty` 是开单那一刻的快照** —— 端上不要拿当前余额去顶替它：盘的过程中照常卖，用当前数算差异， 中间卖掉的量会被算成盘亏，而那是一笔凭空出现的损失。"
    StockCountLine: 
