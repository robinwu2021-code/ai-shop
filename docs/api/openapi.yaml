          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/User"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/WxPhoneReq"
  "/mp/user/phone/capable": 
    get: 
      operationId: "phoneCapable"
      summary: "一键授权当前可不可用（游客可读）"
      tags: 
        - "user"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/PhoneCapable"
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/mp/user/deregister": 
    post: 
      operationId: "deregister"
      summary: "注销账号（匿名化 + 解绑凭证，交易记录留存）"
      tags: 
        - "user"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    description: "无返回体（data 恒为 null）"
                    nullable: true
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/mp/user/community": 
    post: 
      operationId: "bindCommunity"
      summary: "绑定社区自提点"
      tags: 
        - "user"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/User"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/BindCommunityReq"
  "/mp/user/address": 
    get: 
      operationId: "addressList"
      summary: "地址列表"
      tags: 
        - "user"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    type: "array"
                    items: 
                      "$ref": "#/components/schemas/Address"
                required: 
                  - "code"
                  - "msg"
                  - "data"
    post: 
      operationId: "saveAddress"
      summary: "新增/编辑地址"
      tags: 
        - "user"
      security: 
        - bearerAuth: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    type: "array"
                    items: 
                      "$ref": "#/components/schemas/Address"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/SaveAddressReq"
  "/mp/user/address/{addressId}/archive": 
    post: 
      operationId: "removeAddress"
      summary: "删除地址（软删除）"
      tags: 
        - "user"
      security: 
        - bearerAuth: []
      parameters: 
        - name: "addressId"
          in: "path"
          required: true
          schema: 
            type: "string"
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    type: "array"
                    items: 
                      "$ref": "#/components/schemas/Address"
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/mp/user/address/{addressId}/default": 
    post: 
      operationId: "setDefaultAddress"
      summary: "设为默认地址"
      tags: 
        - "user"
      security: 
