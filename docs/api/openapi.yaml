    CommunityApplyReq: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "小区名。**必填** —— 运营要靠它与地址一起判断是不是已有社区的另一个叫法"
        address: 
          type: "string"
          description: "地址。不填也能提，但运营多半会驳回：光一个小区名判断不了是不是重复"
        regionCode: 
          type: "string"
          description: "商家选的区划，只是建议。留空由运营裁决时补"
        note: 
          type: "string"
          description: "补充说明：为什么要开这个点"
        kind: 
          type: "string"
          description: "ESTATE 小区 / VILLAGE 村。不传按 ESTATE —— 聚落模型下两者同一条链路"
        originCode: 
          type: "string"
          description: "提报村时从词典（/biz/regions/villages）选中的官方村码。查重与溯源用"
        latE6: 
          type: "number"
          description: "提报时的定位。**尽量带上** —— 通过后聚落的坐标就是它， 没有坐标的聚落买家用定位永远找不到。拿不到权限时可空，不阻塞提报。"
        lngE6: 
          type: "number"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "name"
      additionalProperties: false
    Region: 
      type: "object"
      properties: 
        regionCode: 
          type: "string"
          description: "统计用区划代码：省 2 / 市 4 / 区县 6 / 街道 9 / 村 12 位。**前缀即层级**，下级码以上级码开头。 商家补录的村是 `街道码 + M + 2 位`，字母保证与官方纯数字码永不冲突"
        parentCode: 
          type: "string"
          description: "上级区划码。省级为空 —— 逐级选择器据此判断自己在不在顶层"
        level: 
          type: "string"
          description: "PROVINCE / CITY / DISTRICT / STREET / VILLAGE（村委会·居委会，第五级）"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "中心点（gcj02，E6）。**可能为空** —— 全国 62 万条村级里只有批量补录命中的那部分有坐标， 端上据此决定是直接用，还是临时去地图上搜一次。"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
        name: 
          type: "string"
          description: "本级名称，**不含上级**（「西湖区」不是「杭州市 / 西湖区」）。要整条路径的地方自己拼"
        enabled: 
          type: "boolean"
          description: "是否启用。B 端只会拿到启用的 —— 停用的区划是运营的维护对象，不该出现在商家的选择器里"
        hasChild: 
          type: "boolean"
          description: "下面还有没有下级。端上据此决定「还要不要再往下选一层」，而不是点进去才发现是空的"
        source: 
          type: "string"
          description: "`OFFICIAL`（官方数据）/ `MERCHANT`（本店补录）。端上据此标出「我加的」"
        pending: 
          type: "boolean"
          description: "本店补录且运营还没确认 —— **只有自己看得见**。\n\n<p>要标出来：不标的话商家不知道这条还没共享， 会以为别的店也能看到他加的这个村。"
        auditStatus: 
          type: "string"
          description: "`PENDING` / `APPROVED` / `REJECTED`。官方数据恒为 APPROVED"
        rejectReason: 
          type: "string"
          description: "驳回理由。**要显示给商家** —— 看不到的话那个村在他那里凭空消失， 他不知道为什么，多半原样再录一遍。"
        rural: 
          type: "boolean"
          description: "只对 level=VILLAGE 有意义：是不是村委会（`sys_region.rural`，服务端存的， 不是端上按名字猜的）。`true` = 到此为止，选择器不再往下钻（自然村数据地图上 本来就搜不全）；`false` = 居委会/社区，或非第五级，底下还能再挑具体小区。"
      required: 
        - "regionCode"
        - "level"
        - "name"
        - "enabled"
        - "hasChild"
      additionalProperties: false
      description: "行政区划的一级（`/biz/regions`）。省 2 / 市 4 / 区 6 / 街道 9 / 村 12 位"
    Review: 
      type: "object"
      properties: 
