    CouponStatus: 
      type: "string"
      enum: 
        - "ACTIVE"
        - "PAUSED"
        - "ENDED"
      description: "券状态。与后端 `MktCoupon` 一致；平台列表要靠它筛出被停的券"
    Coupon: 
      type: "object"
      properties: 
        couponNo: 
          type: "string"
