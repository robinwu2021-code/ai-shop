          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    description: "无返回体（data 恒为 null）"
                    nullable: true
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/mp/user/phone/bind": 
