          type: "string"
          description: "评价单号"
        goodsNo: 
          type: "string"
          description: "被评价的商品"
        merchantNo: 
          type: "string"
          description: "被评价的商家。差评会计入商家评分与申诉流程"
        nickname: 
          type: "string"
          description: "评价人昵称（匿名评价时为「匿名用户」）"
        avatar: 
          type: "string"
          description: "评价人头像"
        rating: 
