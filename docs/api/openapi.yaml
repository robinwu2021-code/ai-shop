        - "appealNo"
        - "reason"
        - "images"
        - "status"
        - "submittedAt"
      additionalProperties: false
      description: "商家对差评的申诉。 这是**唯一**能把差评送进平台裁决台的入口 —— 平台端 P-13.1 的裁决页早就建好了， 但 B 端一直没有申诉入口，那张台子收不到任何单，等于空转。"
    ReviewAppealStatus: 
      type: "string"
      enum: 
        - "PENDING"
        - "UPHELD"
        - "REJECTED"
    StoreFulfillmentChannel: 
      type: "object"
      properties: 
        channel: 
          "$ref": "#/components/schemas/FulfillmentType"
