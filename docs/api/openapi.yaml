          description: "总分，1–5 整数"
        content: 
          type: "string"
          description: "评价正文"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "评价图 URL 列表"
        spec: 
          type: "string"
          description: "购买规格。展示在评价上，让人知道这条评价说的是哪个 SKU"
        createdAt: 
          type: "number"
          description: "评价提交时间"
        likeCount: 
          type: "number"
          description: "点赞数"
        liked: 
          type: "boolean"
          description: "当前用户是否已点赞"
        reply: 
          type: "string"
          description: "商家回复"
        scores: 
          "$ref": "#/components/schemas/ReviewScores"
          description: "三维度评分（B-9.3 / P-13.1.4）。总分 `rating` 仍保留 —— 老数据没有分维度分，列表页也只显示一个星级；维度分用于**评分算法与商家诊断**： 「货好但送得慢」这种问题，只看总分永远看不出来。"
        appeal: 
          "$ref": "#/components/schemas/ReviewAppeal"
          description: "商家申诉（B-9.4）。裁决在平台端 P-13.1"
      required: 
        - "reviewNo"
        - "goodsNo"
        - "merchantNo"
        - "nickname"
        - "avatar"
        - "rating"
        - "content"
        - "images"
        - "spec"
        - "createdAt"
        - "likeCount"
        - "liked"
      additionalProperties: false
    ReviewScores: 
      type: "object"
      properties: 
        goods: 
          type: "number"
          description: "商品本身，1–5"
        fulfillment: 
          type: "number"
          description: "履约：快慢、包装、缺损，1–5"
        service: 
          type: "number"
          description: "服务：沟通、售后态度，1–5"
      required: 
        - "goods"
        - "fulfillment"
        - "service"
      additionalProperties: false
      description: "三维度：商品本身 / 履约（快慢、包装、缺损） / 服务（沟通、售后态度）"
    ReviewAppeal: 
      type: "object"
      properties: 
        appealNo: 
          type: "string"
          description: "申诉单号"
        reason: 
          type: "string"
          description: "申诉理由，商家填写"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "举证图（聊天记录、物流截图）"
        status: 
          "$ref": "#/components/schemas/ReviewAppealStatus"
          description: "裁决状态"
        submittedAt: 
          type: "number"
          description: "申诉提交时间"
        verdict: 
          type: "string"
          description: "裁决说明。**无论成立还是驳回都必须写** —— 商家会看到，「已读不处理」不是一种结果"
