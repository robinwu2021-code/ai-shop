        - "channel"
        - "enabled"
        - "denied"
      additionalProperties: false
      description: "门店送货方式的一行（方案 v4：channel 挂门店，每店每路一行）。\n\n<p>取代商家级 fulfillmentReach 单选。四路可配：STORE_PICKUP / NEIGHBOR_PICKUP / MERCHANT_DELIVERY / EXPRESS —— 服务类两值是商品属性，不出现在这里。"
    StoreFulfillment: 
      type: "object"
      properties: 
        storeNo: 
          type: "string"
          description: "门店号"
        channels: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/StoreFulfillmentChannel"
          description: "固定四行，顺序即开关顺序 —— 服务端补缺，端上不用自己造"
      required: 
        - "storeNo"
        - "channels"
      additionalProperties: false
    StoreCategory: 
      type: "object"
      properties: 
        categoryNo: 
          type: "string"
          description: "平台类目号。**改显示名不动它** —— 跨店聚合与比价都认这个"
        name: 
          type: "string"
          description: "展示名：`displayName` 有就用它，否则是平台类目名。直接照它渲染"
        platformName: 
          type: "string"
          description: "平台类目名。改名时要让商家看得见自己改的是谁"
        displayName: 
          type: "string"
          description: "商家改的名。空 = 用平台名，不是「叫空字符串」"
        sort: 
          type: "number"
          description: "店内展示顺序，小的在前。商家拖出来的顺序"
        goodsCount: 
          type: "number"
          description: "这个货架上有几件商品 —— **撤架之前商家要看得见代价**（有货就撤不掉）"
        onSaleCount: 
          type: "number"
          description: "正在卖的件数。**与 goodsCount 分开**：商家问「这一类卖得怎么样」时要的是它， 问「能不能撤架」时要的是上面那个（含下架与待审的全部）。"
        pendingCount: 
          type: "number"
          description: "待审的件数。它常常是「这一类为什么看起来没货」的答案"
      required: 
        - "categoryNo"
        - "name"
        - "platformName"
        - "sort"
        - "goodsCount"
        - "onSaleCount"
        - "pendingCount"
      additionalProperties: false
      description: "门店经营类目 —— 商家给自己的店摆的<b>货架</b>。\n\n<p>与「主体已获授权的类目」是两件事：那是<b>平台批的证</b>（能不能卖这一类）， 这是<b>商家的货架</b>（店里怎么摆）。责任人不同，所以不合成一个字段。"
    DeliveryRule: 
      type: "object"
      properties: 
        radius: 
          type: "number"
          description: "配送半径，米"
        minOrderMinor: 
          type: "number"
          description: "起送价，最小货币单位"
        feeMinor: 
          type: "number"
          description: "配送费，最小货币单位"
        freeThresholdMinor: 
          type: "number"
          description: "免配送费门槛，最小货币单位；0 表示不免"
      required: 
        - "radius"
        - "minOrderMinor"
        - "feeMinor"
        - "freeThresholdMinor"
      additionalProperties: false
      description: "商家自送规则（ADR-005 §5：不做骑手系统，只有范围与门槛）"
    StoreProfile: 
      type: "object"
      properties: 
        announcement: 
          type: "string"
          description: "店铺公告：「今日到货」「今天有土鸡蛋」，店主自发（C-ST-04）"
        announcementUntil: 
          type: 
            - "number"
            - "null"
          description: "公告失效时刻（epoch 毫秒）。**空 = 长期有效**。\n\n过期由服务端读时判断，端上拿到的 `announcement` 已经是「此刻该显示的」—— 端上不要自己再判一次：两处判断迟早会不一致，而不一致的表现是 「商家看是空的、买家看到的是昨天的货」。"
        announcementRecent: 
          type: "array"
          items: 
            type: "string"
          description: "最近用过的公告，最多 5 条，按最近使用排序。服务端维护，端上只读"
        noticePending: 
          anyOf: 
            - type: "object"
              properties: 
                content: 
                  type: "string"
                submittedAt: 
                  type: "number"
              required: 
                - "content"
                - "submittedAt"
              additionalProperties: false
            - type: "null"
          description: "正卡在人审里的那条公告（机审命中转的），没有就是 null。\n\n**必须读它**：命中期间后端保留旧公告并返回旧资料 —— 端上不看这个字段的话， 会照旧提示「已发布」，而输入框还原成上一条，商家只会以为自己手滑， 反复再发一次，队列里堆出一串同样的单子。"
        openHours: 
          type: "string"
          description: "营业时间文案，店主自填"
        address: 
          type: "string"
          description: "店铺地址。**来自地图选点**（省市区 + 小区/路名），店主可改但一般不用改。 与  {@link  addressDetail }  分开：重新选点只覆盖这一条。"
        addressDetail: 
          type: "string"
          description: "门牌号 / 楼栋（「3 栋 2 单元 501」），店主手填。\n\n为什么单独一格：地图给的地址只到小区门口，而买家照着找门缺的正是这一截； 合成一格的话，商家补完再点一次选点就被整条覆盖 —— 补的那截无声消失， 地址看着还是对的，只是又回到了小区门口。"
        featured: 
          type: "array"
          items: 
            type: "string"
          description: "主推商品，按顺序展示在门店主页首屏"
        serviceScope: 
          "$ref": "#/components/schemas/ServiceScope"
          description: "经营范围（B 端自选）。**决定这家店的货在 C 端能被谁看到** —— 选错不是展示问题：选大了会卖到送不到的地方（下单后提不了货 → 退款）， 选小了则整片小区的人都搜不到这家店。所以 B 端要给出后果说明，不能只给三个单选。"
        serviceCommunityNos: 
          type: "array"
          items: 
            type: "string"
          description: "scope=COMMUNITY 时覆盖的社区。空表示还没谈下任何小区，此时 C 端一律不可见"
        serviceCityCode: 
          type: "string"
          description: "scope=CITY 时覆盖的城市"
        fulfillmentReach: 
          "$ref": "#/components/schemas/FulfillmentReach"
          description: "履约能力（ADR-013 阶段二）。**只说「怎么送到你手上」**，送得到哪儿看  {@link  serviceAreas } 。\n\n与上面两个 `@deprecated` 字段的关系：新旧两套并存期间，端上**只传一套** —— 传了 `serviceAreas` 就走新模型，后端不再看 `serviceScope`。"
        serviceAreas: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/ServiceArea"
          description: "地理覆盖项，可跨粒度组合（三个小区 + 一个区）。\n\n**空的含义由 `fulfillmentReach` 决定**，这是这个字段最容易踩的地方： PICKUP 空 = 谁也看不到（没配自提点就没法履约）； ONSITE / SHIPPING 空 = 不限。同一个空数组两种意思，所以别拿它判「有没有设置过」。"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "门店坐标（gcj02，E6）。地图选点回填；买家侧「门店自取」导航与候选取货点排距离靠它。 不传 = 这次不改；老版本端上不知道这个字段，后端不能把缺省当成清空。"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "announcement"
        - "openHours"
        - "address"
        - "featured"
        - "serviceScope"
        - "serviceCommunityNos"
      additionalProperties: false
      description: "店铺门面（B-11.2 店铺装修 → C 端门店主页的数据源）。 与 Merchant 分开：Merchant 是平台建档的商家主数据（名称/资质/评分，商家改不了）， 这里是**店主自己能改的门面内容**。混在一起的话，改公告要走审核就荒谬了。"
    StoreQrcode: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "商家单号"
        storeCode: 
          type: "string"
          description: "印在贴纸上的短码。**去掉了 0/O/1/I/L**，让人手输时不会认错"
        storeNo: 
          type: 
            - "string"
            - "null"
          description: "这个码属于**哪家门店**（V298 一店一码）。\n\n⚠️ **必须显示出来**：多门店店主看到的只是一串码，看不出它是哪家店的。 印 500 张贴纸之前，这是唯一能发现「贴错店」的机会 —— 贴错之后没有任何症状：码扫得通、页面打得开，只是客流算到了另一家头上。\n\n空 = 主体连门店行都没有的历史数据，不是「属于所有店」。"
        url: 
          type: 
            - "string"
            - "null"
          description: "落地页链接。**未配对外域名时为 null** —— 端上据此不显示链接那一行。\n\n⚠️ 此前后端在两处各写死一个 `https://shop.example.com/s/<code>` 占位域名， 商家复制出去的链接与印出去的贴纸**全都指向一个不存在的地方**， 而这两个功能点在清单上标着「已实现」。不发假链接比发一个点不开的强。"
        imageBase64: 
          type: 
            - "string"
            - "null"
          description: "店铺**小程序码**的 PNG base64（不含 `data:` 前缀）。通道未开启时为 null。\n\n用小程序码而不是 H5 链接：ADR-004 的主获客路径是「码印在包装袋上，老客扫码直达」， 而小程序码**不依赖备案域名**（备案要 7–20 个工作日），扫了直接进门店页。"
        printableHint: 
          type: "string"
          description: "打印建议，服务端给的一句话"
      additionalProperties: false
      description: "店铺码（C-ST-08 扫码进店的商家侧）"
    ShareKit: 
      type: "object"
      properties: 
        text: 
          type: "string"
          description: "分享文案，已按当前语言与市场生成"
        posterUrl: 
          type: "string"
          description: "落地页链接，文案里已经拼过一次；未配对外域名时为空串。真正的海报图走  {@link  Poster }"
      required: 
        - "text"
        - "posterUrl"
      additionalProperties: false
      description: "分享素材（B-11.2.7）。文案由服务端按当前语言与市场生成"
    Poster: 
      type: "object"
      properties: 
        imageBase64: 
          type: 
            - "string"
            - "null"
          description: "PNG 的 base64（不含 data: 前缀）。生不出来（商家异常）时为 null"
      required: 
        - "imageBase64"
      additionalProperties: false
      description: "真海报（B-11.11 补，2026-08-24）：封面图/店名/价格/小程序码合成的一张 PNG， 能直接发朋友圈——`ShareKit.posterUrl` 一期只是落地页链接，不是图。"
    StoreFront: 
      type: "object"
      properties: 
        announcement: 
          type: "string"
          description: "店铺公告：「今日到货」「今天有土鸡蛋」，店主自发（C-ST-04）"
        announcementAt: 
          type: 
            - "number"
            - "null"
          description: "公告最后一次发布的时刻（epoch 毫秒）。没发过、或已过期时为空。\n\n**这一行必须带时间**：一句没有时间的「今天到了新米」，既可能是今早写的， 也可能是上个月忘了撤的 —— 老客分不出来就不会再照着它跑一趟， 而「照着公告来一趟」正是这行字存在的全部理由。"
        openHours: 
          type: "string"
          description: "营业时间文案，店主自填"
        address: 
          type: "string"
          description: "店铺地址，店主自填"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "门店坐标（gcj02，E6）。**可能为空** —— 商家没在地图上标过点。 买家侧据此决定「导航到这里」显不显示：没坐标的导航按钮点了只会打开一片空白。"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "announcement"
        - "openHours"
        - "address"
      additionalProperties: false
    StoreShelf: 
      type: "object"
      properties: 
        categoryNo: 
          type: "string"
          description: "类目号"
        name: 
          type: "string"
          description: "名称"
        count: 
          type: "number"
          description: "这一类下有几件在架。直接显示，省得买家点进去数"
      required: 
        - "categoryNo"
        - "name"
        - "count"
      additionalProperties: false
      description: "店铺页上的一类。`count` 直接显示，省得买家点进去数"
    StoreHome: 
      type: "object"
      properties: 
        merchant: 
          "$ref": "#/components/schemas/MerchantBrief"
          description: "平台建档的商家主数据（名称/资质/评分），店主改不了"
        store: 
          "$ref": "#/components/schemas/StoreFront"
          description: "店主自己维护的门面内容"
        goods: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Goods"
          description: "在售商品。首屏展示，分页靠单独的商品列表接口"
        categories: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/StoreShelf"
          description: "本店货架：**店主自己排的顺序、自己改的名字**（「本地时鲜」而不是「蔬菜」）。\n\n只含真的有在售商品的类目 —— 摆着却一件货都没有的类目，点进去空手而归。 少于两条时端上不画这一行：一个恒真的筛选开关只是占地方。"
        favorited: 
          type: "boolean"
          description: "我是否收藏了这家店"
        closed: 
          type: "boolean"
          description: "已停业（门店非 ACTIVE：商家自助停用或平台强制下线）。\n\n**是标志而不是 404**：扫码进来的老客要知道「店关了」，不是「链接坏了」。 端上据此盖「已停业」并禁掉加购。\n\n⚠️ 后端 `StoreHomeVO` 一直在发这个字段，这里此前没声明 —— 于是**扫码进一家已停业的店，看起来与正常营业毫无区别**， 加购、下单一路走到底，最后在库存或下单闸门上撞一个说不清的错误。"
      required: 
        - "merchant"
        - "store"
        - "goods"
        - "categories"
        - "favorited"
      additionalProperties: false
    FrequentItem: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        skuNo: 
          type: "string"
          description: "SKU 单号。常买是按 SKU 记的 —— 买惯了 5 斤装的人不想要 10 斤装"
        title: 
          type: "string"
          description: "商品标题"
        cover: 
          type: "string"
          description: "封面图"
        spec: 
          type: "string"
          description: "规格文案"
        price: 
          type: "number"
          description: "当前价（可能已与上次购买时不同）"
        lastPrice: 
          type: "number"
          description: "上次买的价，用于「涨价了」提示"
        times: 
          type: "number"
          description: "买过几次。列表按它排序，不是按时间"
        lastAt: 
          type: "number"
          description: "上次购买时间"
        invalid: 
          type: "boolean"
          description: "已下架/无库存 —— 一键再来一单时要显式标出，不能静默丢掉"
      required: 
        - "goodsNo"
        - "skuNo"
        - "title"
        - "cover"
        - "spec"
        - "price"
        - "lastPrice"
        - "times"
        - "lastAt"
      additionalProperties: false
      description: "常买清单的一行（C-ST-02）。按购买频次排序，不是按时间"
    ReorderResult: 
      type: "object"
      properties: 
        added: 
          type: "number"
          description: "成功加入购物车的件数"
        dropped: 
          type: "array"
          items: 
            type: "string"
          description: "已失效、没加进购物车的商品名"
        priceUp: 
          type: "array"
          items: 
            type: "string"
          description: "涨价了但仍加入的商品名"
      required: 
        - "added"
        - "dropped"
        - "priceUp"
      additionalProperties: false
      description: "一键再来一单的结果（C-ST-03）。**丢了什么必须说清楚**，静默少加是投诉源头"
    StoreActivity: 
      type: "object"
      properties: 
        activityNo: 
          type: "string"
          description: "活动号"
        name: 
          type: "string"
          description: "活动名。商家自己起，出现在活动列表与冲突提示里"
        goal: 
          type: 
            - "string"
            - "null"
          description: "`ACQUIRE` 拉新 / `WAKEUP` 唤回 / `CLEAR` 清库存 / `BASKET` 提客单。只影响建的时候的默认值"
        storeNo: 
          type: 
            - "string"
            - "null"
          description: "限定到某一家门店。空 = 主体下所有门店"
        triggerType: 
          type: "string"
          description: "`NONE` / `AMOUNT` 满额 / `QTY` 件数 / `GOODS` 命中商品"
        triggerAmountMinor: 
          type: 
            - "number"
            - "null"
          description: "满额门槛（分）。triggerType=AMOUNT 时用"
        triggerQty: 
          type: 
            - "number"
            - "null"
          description: "满件门槛。triggerType=QTY 时用"
        benefitType: 
          type: "string"
          description: "`CUT` 减钱 / `PRICE` 改单价 / `GIFT` 送商品 / `COUPON` 发券"
        benefitAmountMinor: 
          type: 
            - "number"
            - "null"
          description: "优惠金额（分）。CUT 是减多少，PRICE 是改成多少"
        benefitQty: 
          type: 
            - "number"
            - "null"
          description: "赠品件数。benefitType=GIFT 时用"
        benefitRef: 
          type: 
            - "string"
            - "null"
          description: "赠品商品号或券号，随 benefitType 变"
        scheduleType: 
          type: "string"
          description: "`ONE_OFF` 短期 / `ALWAYS_ON` 长期 / `RECURRING` 周期"
        startAt: 
          type: 
            - "number"
            - "null"
          description: "开始时刻（毫秒）"
        endAt: 
          type: 
            - "number"
            - "null"
          description: "结束时刻（毫秒）"
        scheduleRule: 
          type: 
            - "string"
            - "null"
          description: "RECURRING 的 JSON：`{\"weekdays\":[3],\"from\":\"08:00\",\"to\":\"20:00\"}`"
        quota: 
          type: 
            - "number"
            - "null"
          description: "限量：这个活动最多优惠多少单。空 = 不限量"
        quotaUsed: 
          type: "number"
          description: "已用掉的限量"
        quotaLeft: 
          type: 
            - "number"
            - "null"
          description: "还剩多少 = quota - quotaUsed。不限量时为空"
        budgetMinor: 
          type: 
            - "number"
            - "null"
          description: "预算上限（分）。空 = 不限 —— 用尽后自动停，已享受的不回收"
        budgetUsedMinor: 
          type: "number"
          description: "已花掉的预算（分）"
        maxExposureMinor: 
          type: 
            - "number"
            - "null"
          description: "最大敞口 = 限量 × 单次优惠。建活动页要显示它"
        audiences: 
          type: "array"
          items: 
            type: "object"
            properties: 
              type: 
                type: "string"
              value: 
                type: "string"
            required: 
              - "type"
              - "value"
            additionalProperties: false
          description: "空数组 = **对所有人生效**。老活动迁过来就是这个状态"
        goodsNos: 
          type: "array"
          items: 
            type: "string"
          description: "参与的商品。空 = 全店商品都参与"
        status: 
          type: "string"
          description: "`DRAFT` / `RUNNING` / `PAUSED` / `ENDED`"
        endedReason: 
          type: 
            - "string"
            - "null"
          description: "`EXPIRED` / `QUOTA` / `BUDGET` / `MANUAL`。商家问「怎么停了」要有答案"
        liveNow: 
          type: "boolean"
          description: "此刻是不是真的在生效。**与 status 分开**：周期活动在非时段里 status 仍是 RUNNING， 而商家问的是「现在减不减」。"
      required: 
        - "activityNo"
        - "name"
        - "triggerType"
        - "benefitType"
        - "scheduleType"
        - "quotaUsed"
        - "budgetUsedMinor"
        - "audiences"
        - "goodsNos"
        - "status"
        - "liveNow"
      additionalProperties: false
      description: "商家活动（P5，新模型 `pmt_activity`）。"
    StoreActivityDraft: 
      type: "object"
      properties: 
        activityNo: 
          type: "string"
          description: "活动号。**为空 = 新建**；传了就是改这一个"
        name: 
          type: "string"
          description: "活动名。商家自己起，出现在活动列表与冲突提示里"
        goal: 
          type: 
            - "string"
            - "null"
          description: "`ACQUIRE` 拉新 / `WAKEUP` 唤回 / `CLEAR` 清库存 / `BASKET` 提客单。只影响建的时候的默认值"
        storeNo: 
          type: 
            - "string"
            - "null"
          description: "限定到某一家门店。空 = 主体下所有门店"
        triggerType: 
          type: "string"
          description: "`NONE` / `AMOUNT` 满额 / `QTY` 件数 / `GOODS` 命中商品"
        triggerAmountMinor: 
          type: 
            - "number"
            - "null"
          description: "满额门槛（分）。triggerType=AMOUNT 时用"
        triggerQty: 
          type: 
            - "number"
            - "null"
          description: "满件门槛。triggerType=QTY 时用"
        benefitType: 
          type: "string"
          description: "`CUT` 减钱 / `PRICE` 改单价 / `GIFT` 送商品 / `COUPON` 发券"
        benefitAmountMinor: 
          type: 
            - "number"
            - "null"
          description: "优惠金额（分）。CUT 是减多少，PRICE 是改成多少"
        benefitQty: 
          type: 
            - "number"
            - "null"
          description: "赠品件数。benefitType=GIFT 时用"
        benefitRef: 
          type: 
            - "string"
            - "null"
          description: "赠品商品号或券号，随 benefitType 变"
        scheduleType: 
          type: "string"
          description: "`ONE_OFF` 短期 / `ALWAYS_ON` 长期 / `RECURRING` 周期"
        startAt: 
          type: 
            - "number"
            - "null"
          description: "开始时刻（毫秒）"
        endAt: 
          type: 
            - "number"
            - "null"
          description: "结束时刻（毫秒）"
        scheduleRule: 
          type: 
            - "string"
            - "null"
          description: "RECURRING 的 JSON：`{\"weekdays\":[3],\"from\":\"08:00\",\"to\":\"20:00\"}`"
        quota: 
          type: 
            - "number"
            - "null"
          description: "限量：这个活动最多优惠多少单。空 = 不限量"
        budgetMinor: 
          type: 
            - "number"
            - "null"
          description: "预算上限（分）。空 = 不限 —— 用尽后自动停，已享受的不回收"
        audiences: 
          type: "array"
          items: 
            type: "object"
            properties: 
              type: 
                type: "string"
              value: 
                type: "string"
            required: 
              - "type"
              - "value"
            additionalProperties: false
          description: "定向到哪些人。**空数组 = 对所有人生效**，不是「谁也不发」"
        goodsNos: 
          type: "array"
          items: 
            type: "string"
          description: "参与的商品。空 = 全店商品都参与"
      required: 
        - "name"
        - "benefitType"
      additionalProperties: false
      description: "建活动入参。`activityNo` 为空 = 新建"
    StoreCategorySpecs: 
      type: "object"
      properties: 
        categoryNo: 
          type: "string"
          description: "类目号"
        categoryName: 
          type: "string"
          description: "店主改过名的用店主的叫法（「好菜」而不是「蔬菜」）—— 这一页是给他看的"
        dims: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecTemplate"
          description: "销售规格：买家要挑一档，每档单独定价、单独算库存"
        props: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/SpecTemplate"
          description: "商品参数：只描述，不分 SKU、不影响价格与库存。\n\n<p>与 `dims` 并排而不是合成一列加个字段：它们在界面上是两块， 合成一列端上每处都要先过滤，而漏过滤一次就是「产地」被当成规格。"
      required: 
        - "categoryNo"
        - "categoryName"
        - "dims"
      additionalProperties: false
      description: "「我的规格」里的一组：**这家店的一个货架类目**，以及它能用到的规格。\n\n<p>按货架类目给而不是给平台的全部通用维度：一家只卖蔬菜和肉的店， 看到「尺码」「口径」「时长」是纯噪音，而噪音会让他觉得这一页与自己无关。\n\n<p>`dims` 可能是空的 —— 那是运营还没给这个类目配规格，**商家看得见才问得出来**。"
    AfterSaleReason: 
      type: "string"
      enum: 
        - "NOT_WANTED"
        - "DAMAGED"
        - "MISSING"
        - "WRONG_ITEM"
        - "QUALITY"
        - "EXPIRED"
        - "OTHER"
      description: "售后原因。**取值与后端 `/mp/after-sale/reasons` 下发的一致** —— 端上不再自己硬编码一份清单（此前那份少两个、多一个，两边各自漂移， 运营改后端那份端上纹丝不动）。\n\n后端下发的是**码**不是文案：这是三语 App，翻译得留在端上。"
    CartItem: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        skuNo: 
          type: "string"
          description: "SKU 单号。购物车按 SKU 去重，不是按商品"
        title: 
          type: "string"
          description: "商品标题快照"
        cover: 
          type: "string"
          description: "封面图快照"
        spec: 
          type: "string"
          description: "规格文案快照"
        price: 
          type: "number"
          description: "加购时的单价（最小货币单位）。结算时以服务端最新价为准，不一致会提示"
        qty: 
          type: "number"
          description: "数量"
        type: 
          "$ref": "#/components/schemas/CategoryType"
          description: "商品形态"
        fulfillment: 
          "$ref": "#/components/schemas/FulfillmentType"
          description: "用户选定的履约方式。跨履约方式的商品结算时会拆单"
        merchantNo: 
          type: "string"
          description: "所属商家。**后端 `CartItemVO` 一直在发这两个字段，是这里此前没声明**—— 于是数据到了端上就被丢掉，购物车只能按履约方式分组，店名一个字都显示不出来。\n\n后果不是「少个标签」：用户从头到尾看到「一单」，提交后拿到的是按商家拆出的 N 笔子订单（`ord_sub_order`）。见 TDD-购物车商家可见。"
        merchantName: 
          type: "string"
          description: "商家名。**购物车按它分组** —— 一车东西来自几家店， 结算时会拆成几笔子订单，分组是把这件事提前说清楚（见 TDD-购物车商家可见）。"
        invalidReason: 
          type: "string"
          description: "失效原因，如「已下架」「库存不足」。有值即不可勾选结算"
        giftQty: 
          type: "number"
          description: "买赠自动带出的赠品件数（不计价）"
        giftLabel: 
          type: "string"
          description: "赠品说明，如「买 2 送 1」"
      required: 
        - "goodsNo"
        - "skuNo"
        - "title"
        - "cover"
        - "spec"
        - "price"
        - "qty"
        - "type"
        - "fulfillment"
        - "merchantNo"
        - "merchantName"
      additionalProperties: false
    OrderPreview: 
      type: "object"
      properties: 
        amount: 
          "$ref": "#/components/schemas/OrderAmount"
          description: "试算出来的金额。**页面显示的应付必须等于这里的 payableMinor** —— 端上不要自己再算一遍：优惠叠加顺序（先活动后券）在后端， 两处各算一次必然算出两个数，而用户看到的是「确认页 46.40、付款 51.40」。"
        items: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/OrderItem"
          description: "试算出来的订单行，含赠品行（价格 0）。数量与下单后落库的一致"
      required: 
        - "amount"
        - "items"
      additionalProperties: false
      description: "订单预览的返回。**后端返的是完整 OrderVO，这里只声明端上要用的那部分** —— 预览页只关心金额与行，声明全套会让每次后端加字段都得改端上类型。"
    OrderAmount: 
      type: "object"
      properties: 
        goodsMinor: 
          type: "number"
          description: "商品小计（最小货币单位），不含运费与优惠"
        freightMinor: 
          type: "number"
          description: "运费"
        discountMinor: 
          type: "number"
          description: "优惠合计（券 + 活动），正数表示减掉多少"
        payableMinor: 
          type: "number"
          description: "应付：`goodsMinor + freightMinor - discountMinor - pointsDeductMinor`"
        paidMinor: 
          type: "number"
          description: "实付。未支付时为 0；称重差价补退后与 payableMinor 可能不等"
        weighAdjustMinor: 
          type: "number"
          description: "称重差价（正=补款 负=退款），仅 FRESH"
        pointsDeductMinor: 
          type: "number"
          description: "积分抵扣的金额"
        pointsUsed: 
          type: "number"
          description: "本单使用的积分数"
        pointsEarn: 
          type: "number"
          description: "本单可获得的积分（订单完成时才真正入账）"
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "下单时的货币，订单一经创建即锁定，不随用户切市场变化"
      required: 
        - "goodsMinor"
        - "freightMinor"
        - "discountMinor"
        - "payableMinor"
        - "paidMinor"
        - "pointsDeductMinor"
        - "pointsUsed"
        - "pointsEarn"
        - "currency"
      additionalProperties: false
    OrderItem: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        merchantNo: 
          type: "string"
          description: "所属商家 —— 分账与「我买过的商家」都依赖它落在订单行上"
        skuNo: 
          type: "string"
          description: "SKU 单号"
        title: 
          type: "string"
          description: "下单时的商品标题**快照**。商品后续改名不影响历史订单"
        cover: 
          type: "string"
          description: "封面图快照"
        spec: 
          type: "string"
          description: "规格文案快照"
        price: 
          type: "number"
          description: "成交单价（最小货币单位）快照。改价不追溯已成交订单"
        qty: 
          type: "number"
          description: "数量"
        type: 
          "$ref": "#/components/schemas/CategoryType"
          description: "商品形态"
        nominalGram: 
          type: "number"
          description: "FRESH 且按重计价：下单时的标称重量（克）"
        weighed: 
          type: "boolean"
          description: "是否已实际称重。称重后按实重产生差价，见 `OrderAmount.weighAdjustMinor`"
        isGift: 
          type: "boolean"
          description: "赠品行：价格为 0，不参与计价，履约时随单发出"
        points: 
          type: "number"
          description: "该商品每件赠送的积分"
      required: 
        - "goodsNo"
        - "merchantNo"
        - "skuNo"
        - "title"
        - "cover"
        - "spec"
        - "price"
        - "qty"
        - "type"
      additionalProperties: false
    CheckoutCapability: 
      type: "object"
      properties: 
        usablePayMethods: 
          anyOf: 
            - type: "array"
              items: 
                type: "string"
            - type: "null"
          description: "整单可用的支付方式 = <b>各商家支持集合的交集</b>。\n\n交集而非并集：一笔支付覆盖整单，有一家不支持就用不了。 <b>空数组 = 这一车货没有任何方式能付</b>，端上要拦在结算页 —— 让他点下去只会得到一个说不清原因的「支付失败」。\n\n<b>null = 未配置</b>（一个商家都还没进件完）——端上<b>不要拦</b>。 两者混成空数组的话，一个完全正常的订单会被拦死。"
        anyNotInvoiceCapable: 
          type: "boolean"
          description: "车里有商家开不了票。**必须在付款前告诉用户**：买完才发现，平台补救不了"
        merchants: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/MerchantCapability"
          description: "逐商家的能力，端上据此在对应的商家分组上打标"
        usablePayModes: 
          type: "array"
          items: 
            type: "string"
          description: "整单可用的**支付方式**（`PAY_MODE`：ONLINE / OFFLINE）。\n\n⚠️ **与 `usablePayMethods` 是两根轴，别混**：那个是**通道** （WECHAT / ALIPAY / H5…），这个是**线上付还是当面付**。 一笔订单要同时确定两者。\n\n同样取交集（一笔支付覆盖整单）。**ONLINE 永远在里面**， 所以不会是空集，也就不需要 `null` 那一档 —— 与 `usablePayMethods` 的取舍不同，因为那边真的可能「没配过」。"
      required: 
        - "usablePayMethods"
        - "anyNotInvoiceCapable"
        - "merchants"
        - "usablePayModes"
      additionalProperties: false
      description: "结算页的<b>能力提示</b>：这一车货能不能开票、能用哪些支付方式、额度还够不够。\n\n<p>与  {@link  OrderPreview }  分开是有意的：preview 回答「多少钱」， 这个回答「付得了吗、票拿得到吗」。\n\n<p>三件事一起给，是因为它们的共同后果都是<b>付款那一刻才炸</b>—— 小微没有 H5/App 支付方式（混合购物车整单付不了）、小微不能开票 （买完才发现补救不了）、额度用尽（通道直接拒收）。 每一条单独看都像偶发故障，放在一起看才是同一件事： 平台放弱主体进来了，而结算页还没告诉买家这意味着什么。"
    OrderReceiver: 
      type: "object"
      properties: 
        name: 
          type: "string"
          description: "收货人姓名。取不到时为空 —— 空就是空，不要回落成「顾客」"
        phone: 
          type: "string"
          description: "脱敏程度由后端定，见 `Order.receiver` 的说明"
        address: 
          type: "string"
          description: "省市区 + 详细，拼好的一行"
      additionalProperties: false
      description: "收件人。下单时固化在子订单上，**不是用户当前的地址簿条目**。\n\n三端共用：C 端订单详情、B 端配送/发货、平台端查单。"
    InvoiceRequestStatus: 
      type: "string"
      enum: 
        - "REQUESTED"
        - "ISSUED"
        - "REJECTED"
      description: "开票申请的状态（ADR-017 §3.4 条件 2）。\n\n本版是**手工开票**：运营在票据系统里开完，回来回填票号。 接票据系统是第二步，届时在 `ISSUED` 之后延长状态机，不改前面的。"
    InvoiceTitleType: 
      type: "string"
      enum: 
        - "PERSONAL"
        - "COMPANY"
      description: "抬头类型。单位抬头必须有税号，否则对方入不了账 —— 票开出来等于白开"
    InvoiceRequest: 
      type: "object"
      properties: 
        requestNo: 
          type: "string"
          description: "开票申请号"
        orderNo: 
          type: "string"
          description: "按**主单**申请，不按子单 —— 消费者眼里那是一次购买，票也该是一张"
        titleType: 
          "$ref": "#/components/schemas/InvoiceTitleType"
          description: "`PERSONAL` 个人 / `COMPANY` 单位。单位抬头必须有税号"
        title: 
          type: "string"
          description: "发票抬头"
        taxNo: 
          type: "string"
          description: "单位抬头必填"
        email: 
          type: "string"
          description: "电子票只能发到这里，填错就是开了也收不到"
        amountMinor: 
          type: "number"
          description: "开票金额快照。**不实时读订单** —— 退款会改订单金额，已开的票不会跟着变"
        status: 
          "$ref": "#/components/schemas/InvoiceRequestStatus"
          description: "状态"
        invoiceNo: 
          type: "string"
          description: "发票号。开出来之后才有"
        issuedAt: 
          type: "number"
          description: "开票时刻。空 = 还没开"
        rejectReason: 
          type: "string"
          description: "驳回原因。不写原因的驳回等于让消费者再猜一遍"
        createdAt: 
          type: "number"
          description: "申请时刻"
      required: 
        - "requestNo"
        - "orderNo"
        - "titleType"
        - "title"
        - "email"
        - "amountMinor"
        - "status"
      additionalProperties: false
      description: "开票申请：**平台开给消费者**的销项票。\n\n与结算侧的采购发票（`stl_purchase_invoice`）是两回事： 那是**进项**（供应商开给平台，决定平台能不能列支成本）， 这是**销项**（平台开给消费者，决定归集资金模式成不成立）。"
    Order: 
      type: "object"
      properties: 
        orderNo: 
          type: "string"
          description: "订单单号"
        status: 
          "$ref": "#/components/schemas/OrderStatus"
          description: "订单状态。粗粒度；售后细节见 `afterSale`"
        fulfillment: 
          "$ref": "#/components/schemas/FulfillmentType"
          description: "履约方式，下单时锁定"
        items: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/OrderItem"
          description: "订单行。含赠品行（`isGift`，价格为 0）"
        amount: 
          "$ref": "#/components/schemas/OrderAmount"
          description: "金额明细"
        verifyCode: 
          type: "string"
          description: "自提码 / 核销码"
        redeemCode: 
          type: "string"
          description: "VIRTUAL：兑换码；CARD：卡号"
        pickupNo: 
          type: "string"
          description: "PICKUP：自提点单号"
        pickupName: 
          type: "string"
          description: "PICKUP：自提点名称快照"
        expressNo: 
          type: "string"
          description: "EXPRESS：快递单号，发货后才有"
        appointmentAt: 
          type: "number"
          description: "APPOINTMENT：预约开始时间戳"
        createdAt: 
          type: "number"
          description: "下单时间"
        payDeadlineAt: 
          type: "number"
          description: "支付截止时间。超时自动取消，仅 WAIT_PAY 有意义"
        timeline: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/OrderTimelineNode"
          description: "状态流转轨迹，按时间正序。订单详情的进度条据此渲染"
        idempotencyKey: 
          type: "string"
          description: "下单幂等 key。端上生成，重复提交返回同一笔订单而不是新建"
        buyerNickname: 
          type: "string"
          description: "下单人昵称。团长视角（分拣单/核销台）要看得见是谁的单"
        receiver: 
          "$ref": "#/components/schemas/OrderReceiver"
          description: "收件人（下单时的**快照**，自提单没有）。\n\n快照而不是现查地址：买家下完单把地址改成新家，商家看到的就跟着变了， 而货已经按旧地址在路上。\n\n⚠️ **`phone` 的脱敏程度由后端按履约方式决定**：商家自送给完整号 （送到楼下找不到人就得打电话），其余履约方式给 `****1234`。 端上**不要自己判**要不要打码 —— 两处规则迟早分叉。"
        reviewed: 
          type: "boolean"
          description: "已评价"
        pointsGranted: 
          type: "boolean"
          description: "积分是否已发放（幂等标记，防止重复核销重复发分）"
        trafficSource: 
          "$ref": "#/components/schemas/TrafficSource"
          description: "客流来源。**决定平台费率档**：商家自带客流建议零佣金 —— 他带来的客户 在别家的消费才是平台的收益（ADR-004 §6）。从店铺码/店铺分享进入即为 MERCHANT_OWNED。"
        groupNo: 
          type: "string"
          description: "参与的团。邻里自提的核销作用域就靠它裁剪（E16）"
        afterSale: 
          "$ref": "#/components/schemas/AfterSale"
          description: "售后单。订单状态只有粗粒度的 REFUNDING/REFUNDED，细节在这里"
        merchantNo: 
          type: "string"
          description: "本单归属的商家。**一单只属于一个商家** —— 购物车跨商家时拆成多笔子订单（E3）。 不拆的话分账无从谈起：一笔钱要分给几家、各分多少，没有承载的单据。"
        merchantName: 
          type: "string"
          description: "商家名快照"
        payGroupNo: 
          type: "string"
          description: "支付组号。同一次结算拆出的子订单共享它，**一次支付付掉整组**。 用户感知是「买了一次」，资金与分账感知是「N 笔各归各家」。\n\n⚠️ **后端叫 `payOrderNo`，库里是 `ord_order.order_no`** —— 三处三个名字。 按这个名去后端或库里找会找不到（2026-08-17 人工测试时撞到）。"
        subOrders: 
          type: "array"
          items: 
            "$ref": "#/components/schemas/Order"
          description: "**仅支付视角**：这次付款覆盖的各商家订单。订单视角为空。\n\n后端 `OrderVO` 一直在发（同一个结构承担订单/支付两种视角）， 端上此前没声明 —— 于是收银台是整条拆单链路里**唯一哑掉的一屏**： 购物车说会拆 2 单、确认页说会拆 2 单、订单详情各自标着商家， 中间付款那一步却只有一个总额。"
      required: 
        - "orderNo"
        - "status"
        - "fulfillment"
        - "items"
        - "amount"
        - "createdAt"
        - "timeline"
      additionalProperties: false
    OrderTimelineNode: 
      type: "object"
      properties: 
        status: 
          "$ref": "#/components/schemas/OrderStatus"
          description: "流转到的状态"
        label: 
          type: "string"
          description: "展示文案，如「已到货，请到自提点取货」。后端下发已本地化"
        at: 
          type: "number"
          description: "发生时间"
      required: 
        - "status"
        - "label"
        - "at"
      additionalProperties: false
    AfterSale: 
      type: "object"
      properties: 
        afterSaleNo: 
          type: "string"
          description: "售后单号。**售后是独立资源，不是订单上的一个字段** —— 它有自己的生命周期（申请→同意/驳回→寄回→收货→退款），能被取消、能上升平台， 一个订单还可能先后发起多次。挂在订单下用 orderNo 寻址，第二次申请就没法表达了。 后端一开始就是这么建的（/mp/after-sale/{afterSaleNo}/**），这里向它对齐。"
        subOrderNo: 
          type: "string"
          description: "所属**子订单**号（`SUB…`）。\n\n⚠️ **要关联回订单卡片用的是这个，不是下面的 `orderNo`。** C/B 两端列表里的一行是一张子订单，而 `Order.orderNo` 字段里装的就是子订单号 （后端 `OrderVO.orderNo` = `SUB…`）；售后单上的 `orderNo` 却是**主单号**（`SO…`）。 两个字段同名不同物 —— 按 `orderNo` 去 join 一条也匹配不上， 而症状是「售后页签空着」，与它本来要修的 bug 一模一样。"
        orderNo: 
          type: "string"
          description: "所属**主订单**号（`SO…`）。跨商家下单会拆成多笔子订单，它们共用这一个主单号。 展示「同一次下单」时用它，关联单张订单卡片请用  {@link  subOrderNo } 。"
        type: 
          "$ref": "#/components/schemas/AfterSaleType"
          description: "售后类型：仅退款 / 退货退款"
        status: 
          "$ref": "#/components/schemas/AfterSaleStatus"
          description: "售后单状态，独立于订单状态流转"
        reason: 
          type: "string"
          description: "用户填写的售后原因"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "举证图（破损、少件的照片）。是否必填由售后类型决定"
        refundMinor: 
          type: "number"
          description: "这张售后单要退的钱（分）。**不等于订单金额** —— 一张子订单可以只退其中一件，也可以先后发起多次。\n\n<p>后端一直在发（`AfterSaleVO.refundMinor`），只是契约里漏了声明， 于是 B 端售后页拿不到它，只能退而求其次显示**整张子订单的应付**。 单件单品的单子上两个数恰好相等，所以这个错在联调环境里看不出来 —— 直到有人退三件里的一件。"
        instant: 
          type: "boolean"
          description: "极速退：金额在阈值内的仅退款，系统自动通过。\n**商家只可见不可拒**，所以这类单上不该出现同意/驳回按钮。"
        merchantReply: 
          type: "string"
          description: "商家同意/驳回时的说明"
        returnExpressNo: 
          type: "string"
          description: "用户寄回的运单号（RETURN_REFUND）"
        disputeReason: 
          type: "string"
          description: "上升平台时用户的申诉理由"
        updatedAt: 
          type: "number"
          description: "最后一次状态变更时间。超时自动同意等时效规则以它为基准"
        createdAt: 
          type: "number"
          description: "申请时间"
        liability: 
          type: "string"
          description: "责任方，平台裁决后才有（口径未定）"
        timeline: 
          type: "array"
          items: 
            type: "object"
            properties: 
              status: 
                type: "string"
              label: 
                type: "string"
              at: 
                type: "number"
            required: 
              - "status"
              - "label"
              - "at"
            additionalProperties: false
          description: "售后自己的时间线（申请 → 同意 → 寄回 → 退款），与订单时间线分开"
      required: 
        - "afterSaleNo"
        - "subOrderNo"
        - "orderNo"
        - "type"
        - "status"
        - "reason"
        - "images"
        - "refundMinor"
        - "updatedAt"
      additionalProperties: false
    AfterSaleType: 
      type: "string"
      enum: 
        - "REFUND_ONLY"
        - "RETURN_REFUND"
      description: "售后类型。**仅退款与退货退款的流程根本不同** —— 仅退款同意即退；退货退款必须**先收到货再退款**，否则「退款了货没回来」。 此前两者走同一条路，是售后闭环缺的后半段（B-7.3）。"
    AfterSaleStatus: 
      type: "string"
      enum: 
        - "APPLIED"
        - "REFUNDING"
        - "REFUNDED"
        - "REJECTED"
        - "ARBITRATING"
        - "CLOSED"
      description: "售后单状态。**这是后端 `OrdAfterSale` 真实存的取值。**\n\n⚠️ 这里此前是完全另一套：`PENDING`/`AGREED`/`RETURNING`/`RECEIVED`/`DONE`/`DISPUTED`， 与后端**只有 `REJECTED` 一个词重合**。c/b 两端按它判断、按它建 i18n 词条， 于是售后详情页的状态永远落进兜底分支，「填退货单号」按钮永远不出现 （它 gate 在一个后端永远不会下发的 `AGREED` 上）。\n\n那一套描述的是**想象中更细的流程**：同意 → 寄回 → 收货 → 退款四步。 后端没有把「寄回中」「已收货」做成独立状态 —— 商家一同意就进 `REFUNDING`， 退货物流走 `expressNo` 字段而不是状态。粒度差异是真实的设计选择， 端上不能自己补一套更细的词然后假装后端会给。"
    User: 
      type: "object"
      properties: 
        cUserNo: 
          type: "string"
          description: "C 端用户单号。前缀 `cUser` 是有意的：B 端商家、平台 STAFF 是**另外两个账号池**，单号不通用"
        nickname: 
          type: "string"
          description: "昵称。微信授权取来的，用户可改"
        avatar: 
          type: "string"
          description: "头像 URL"
        phone: 
          type: "string"
          description: "手机号。已脱敏（中间四位星号），完整号码不下发到端上"
        communityNo: 
          type: "string"
          description: "当前绑定的社区。未绑定时为空 —— 首页的商品可见范围依赖它"
        pickupNo: 
          type: "string"
          description: "默认自提点。下单时预选，用户可改"
        merchantNo: 
          type: "string"
          description: "常去的店。与 communityNo 正交 —— 可以在 A 社区却常买 B 店（ADR-004 §5.1）"
      required: 
        - "cUserNo"
        - "nickname"
        - "avatar"
        - "phone"
      additionalProperties: false
    PhoneCapable: 
      type: "object"
      properties: 
        capable: 
          type: "boolean"
          description: "true = 显示「微信一键获取」；false = 显示手机号 + 验证码"
      required: 
        - "capable"
      additionalProperties: false
      description: "微信一键取手机号当前可不可用。\n\n<p>由后端说了算：它取决于小程序认证状态与通道开关，端上判不出来。 写死在端上的话，认证下来之后还要再发一次版。"
    PointRecordType: 
      type: "string"
      enum: 
        - "EARN"
        - "USE"
        - "REFUND"
        - "EXPIRE"
        - "RECEIVE"
        - "SETTLE"
    PointRecord: 
      type: "object"
      properties: 
        recordNo: 
          type: "string"
          description: "流水单号。积分是平台负债，每一笔变动都要可追溯（ADR-006）"
        type: 
          "$ref": "#/components/schemas/PointRecordType"
          description: "变动类型，决定这笔是增是减"
        points: 
          type: "number"
          description: "变动量，正=增加 负=减少"
        title: 
          type: "string"
          description: "流水标题，如「订单消费获得」「过期作废」。展示用"
        orderNo: 
          type: "string"
          description: "关联订单。消费/退款类必有，过期/结算类为空"
        at: 
          type: "number"
          description: "发生时间"
        balanceAfter: 
          type: "number"
          description: "变动后余额，用于对账 —— 只存变动量的话，一条记录出错后面全错"
      required: 
        - "recordNo"
        - "type"
        - "points"
        - "title"
        - "at"
        - "balanceAfter"
      additionalProperties: false
    PointAccount: 
      type: "object"
      properties: 
        balance: 
          type: "number"
          description: "当前可用余额。**只含能花的分**，待生效的在 pendingBalance"
        pendingBalance: 
          type: "number"
          description: "待生效积分：已发放但未过售后期，**不计入 balance**。\n\n两个数必须分开展示（「可用 400 / 待生效 100」）。合成一个的话， 用户看到「我有 500 分」却只能用 400，没有任何办法解释这个差额。"
        pendingActivateAt: 
          type: "number"
          description: "最近一批待生效积分的可用时间。`pendingBalance=0` 时为空"
        totalEarned: 
          type: "number"
          description: "累计获得（含已用、已过期），只增不减"
        totalUsed: 
          type: "number"
          description: "累计已抵扣"
        expiringSoon: 
          type: "number"
          description: "30 天内将过期的积分"
        expiringAt: 
          type: "number"
          description: "最近一批积分的过期时间。`expiringSoon=0` 时为空"
      required: 
        - "balance"
        - "pendingBalance"
        - "totalEarned"
        - "totalUsed"
        - "expiringSoon"
      additionalProperties: false
      description: "用户积分账户。**单位是积分个数** —— 商家侧是钱，用  {@link  MerchantPointAccount }"
    PointsDeductible: 
      type: "object"
      properties: 
        maxPoints: 
          type: "number"
          description: "本单最多可抵扣的积分数。已扣掉四级开关与上限，端上直接用"
        maxAmountMinor: 
          type: "number"
          description: "对应金额（分）"
        balance: 
          type: "number"
          description: "用户当前可用余额，用于展示「你有 X 分」"
        disabledReason: 
          type: "string"
          description: "不可用时的原因，直接展示。可用时为空"
      required: 
        - "maxPoints"
        - "maxAmountMinor"
        - "balance"
      additionalProperties: false
      description: "结算页的积分试算结果。**服务端算**，端上只负责显示。\n\n端上自己算的话，下单时服务端会再算一遍 —— 两处算法只要有一点不同 （券后金额口径、运费是否参与、开关判断顺序），用户就会看到 「结算页说能抵 30，下单后只抵了 25」，而这个差额没人解释得清。"
    Address: 
      type: "object"
      properties: 
        addressId: 
          type: "string"
          description: "地址 ID。这里是 `Id` 不是 `No` —— 它不是业务单号，是用户地址簿里的一条本地记录， 不跨端流转、不出现在订单快照里（下单时地址是**整体快照**进订单的）"
        name: 
          type: "string"
          description: "收货人姓名"
        phone: 
          type: "string"
          description: "收货人手机号"
        region: 
          type: "string"
          description: "省市区，拼好给人看的一串"
        province: 
          type: 
            - "string"
            - "null"
          description: "省 / 市 / 区县，**分开的三个**。\n\n与 `region` 并存不是冗余：`region` 是展示用的一串（存量地址、地图回填都只有它）， 这三列是**能拿来算的**那份 —— 按省算运费、按区派单、按市校经营范围。 后端 `usr_address` 一直有这三列，端上一直没填，于是那些规则全在 null 上求值， 一条都不命中，而页面上完全正常。\n\n可能为空：存量地址是纯手填的，拆不出来。"
        city: 
          type: 
            - "string"
            - "null"
          description: "市"
        district: 
          type: 
            - "string"
            - "null"
          description: "区/县"
        detail: 
          type: "string"
          description: "详细地址（街道门牌）"
        isDefault: 
          type: "boolean"
          description: "是否默认地址。整个地址簿至多一条为 true"
        tag: 
          type: "string"
          description: "标签：家 / 公司 / 其他"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "收货点坐标（gcj02，E6）。地图选点回填；**可能为空** —— 存量地址是纯手填的。 商家的「自送半径」要拿它跟门店坐标算距离，没有坐标那条规则就永远算不出结果。"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "addressId"
        - "name"
        - "phone"
        - "region"
        - "detail"
        - "isDefault"
      additionalProperties: false
    UserCard: 
      type: "object"
      properties: 
        cardNo: 
          type: "string"
          description: "卡号。核销时出示的就是它"
        goodsNo: 
          type: "string"
          description: "购买时的商品单号"
        title: 
          type: "string"
          description: "卡名快照"
        cover: 
          type: "string"
          description: "卡面图"
        balanceMinor: 
          type: "number"
          description: "储值卡剩余额度（最小货币单位）"
        timesLeft: 
          type: "number"
          description: "次卡剩余次数"
        expireAt: 
          type: "number"
          description: "过期时间。过期后余额/次数作废"
        currency: 
          "$ref": "#/components/schemas/CurrencyCode"
          description: "购卡时锁定的货币，不随用户切市场变化"
      required: 
        - "cardNo"
        - "goodsNo"
        - "title"
        - "cover"
        - "expireAt"
        - "currency"
      additionalProperties: false
    UserCoupon: 
      type: "object"
      properties: 
        userCouponNo: 
          type: "string"
          description: "这个人手里那一张的编号"
        coupon: 
          "$ref": "#/components/schemas/Coupon"
          description: "券模板快照"
        status: 
          type: "string"
          description: "UNUSED / USED / EXPIRED"
        usableNow: 
          type: "boolean"
          description: "当前这笔订单能不能用它 —— 由服务端算，端上不要自己判门槛"
        receivedAt: 
          type: "number"
          description: "领取时刻"
        usedAt: 
          type: "number"
          description: "核销/使用时刻。空 = 还没用"
      required: 
        - "userCouponNo"
        - "coupon"
        - "status"
        - "usableNow"
        - "receivedAt"
      additionalProperties: false
      description: "领到手的那张券（`mkt_user_coupon` 的一行）。\n\n与  {@link  Coupon }  的关系：Coupon 是**模板**（活动配的那张）， UserCoupon 是**某个人手里的那一张**。领取接口返回的是后者 —— 契约此前写成返回 Coupon，而后端一直返回这个形状，字段一个都对不上。 页面恰好不读返回值（领完重拉列表），所以没人撞上；但契约说的是假话。"
    LoginReq: 
      type: "object"
      properties: 
        grantType: 
          "$ref": "#/components/schemas/GrantType"
          description: "登录方式，决定 principal / credential 各放什么"
        principal: 
          type: "string"
          description: "凭证主体：`WX_*` 放 wx.login 的 code；`PHONE_OTP` 放手机号；`APPLE` 放 identityToken"
        credential: 
          type: "string"
          description: "凭证副本：仅 `PHONE_OTP` 需要，放短信验证码"
        inviterNo: 
          type: "string"
          description: "邀请人。从邀请链接进入时带上，用于拉新归因"
        merchantNo: 
          type: "string"
          description: "从店铺码/店铺分享进入时带上，用于进店归因与费率分档（ADR-004 §5.4）"
        agreed: 
          type: "boolean"
          description: "是否已勾选同意用户协议与隐私政策 —— 注册的合规前置，服务端要留痕"
      required: 
        - "grantType"
        - "principal"
      additionalProperties: false
    LoginResp: 
      type: "object"
      properties: 
        token: 
          type: "string"
          description: "访问令牌。后续请求放 `Authorization: Bearer <token>`"
        user: 
          "$ref": "#/components/schemas/User"
          description: "登录用户档案"
      required: 
        - "token"
        - "user"
      additionalProperties: false
    LoginReqBody: 
      type: "object"
      properties: 
        grantType: 
          "$ref": "#/components/schemas/GrantType"
          description: "登录方式，决定 principal / credential 各放什么"
        principal: 
          type: "string"
          description: "WX_MINI: wx.login code；PHONE_OTP: 手机号"
        credential: 
          type: "string"
          description: "PHONE_OTP: 验证码"
        inviterNo: 
          type: "string"
          description: "裂变归因：邀请人"
        merchantNo: 
          type: "string"
          description: "进店归因：从店铺码/店铺分享进入时带上（ADR-004 §5.4）"
      required: 
        - "grantType"
        - "principal"
      additionalProperties: false
      description: "入驻申请可选的商家类型。 不用 `Extract<MerchantType, ...>` —— 生成 schema 时它的名字会变成 `Extract<MerchantType,(\"COMPANY\"|\"INDIVIDUAL\")>`，不符合 OpenAPI 的组件命名规则。 契约类型要能干净地映射成 DTO 名，所以这里写成直白的联合。"
    BindPhoneReq: 
      type: "object"
      properties: 
        phone: 
          type: "string"
          description: "手机号"
        code: 
          type: "string"
          description: "短信/微信下发的验证码"
      required: 
        - "phone"
        - "code"
      additionalProperties: false
      description: "绑定手机号（验证码）。号码要以**字符串**传 —— 见 phone-gate.vue 里那段注释"
    WxPhoneReq: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "短信/微信下发的验证码"
      required: 
        - "code"
      additionalProperties: false
      description: "微信一键授权：端上只拿得到 code，换号在后端做"
    BindCommunityReq: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "要绑定的社区。**商品可见范围依赖它**，绑错了首页就是别的小区的货"
        pickupNo: 
          type: "string"
          description: "默认自提点，须属于该社区"
      required: 
        - "communityNo"
        - "pickupNo"
      additionalProperties: false
    SaveAddressReq: 
      type: "object"
      properties: 
        addressId: 
          type: "string"
          description: "有值 = 编辑，无值 = 新增"
        name: 
          type: "string"
          description: "收货人姓名"
        phone: 
          type: "string"
          description: "收货人手机号"
        region: 
          type: "string"
          description: "省市区，拼好给人看的一串"
        province: 
          type: 
            - "string"
            - "null"
          description: "省 / 市 / 区县，分开的三个。后端 `SaveAddressReq` 一直收这三个字段， 端上一直没发 —— 于是 `usr_address` 那三列永远是 null（见 `Address` 的注释）"
        city: 
          type: 
            - "string"
            - "null"
          description: "市"
        district: 
          type: 
            - "string"
            - "null"
          description: "区/县"
        detail: 
          type: "string"
          description: "详细地址（街道门牌）"
        isDefault: 
          type: "boolean"
          description: "设为默认。置 true 会把原默认地址改为 false"
        tag: 
          type: "string"
          description: "标签：家 / 公司 / 其他"
        latE6: 
          type: 
            - "number"
            - "null"
          description: "地图选点给的坐标（gcj02，E6）；不传 = 不改"
        lngE6: 
          type: 
            - "number"
            - "null"
          description: "经度 ×1e6。**全站坐标一律 gcj02**"
      required: 
        - "name"
        - "phone"
        - "region"
        - "detail"
        - "isDefault"
      additionalProperties: false
    NearbyQuery: 
      type: "object"
      properties: 
        lat: 
          type: "number"
          description: "纬度。与 lng 成对出现，不传则按用户已绑定社区返回"
        lng: 
          type: "number"
          description: "经度"
      additionalProperties: false
    GoodsListQuery: 
      type: "object"
      properties: 
        page: 
          type: "number"
          description: "页码，从 1 起"
        size: 
          type: "number"
          description: "每页条数"
        merchantNo: 
          type: "string"
          description: "只看某个商家的商品（门店主页用）"
        type: 
          "$ref": "#/components/schemas/CategoryType"
          description: "按商品形态过滤"
        categoryNo: 
          type: "string"
          description: "按类目过滤"
        keyword: 
          type: "string"
          description: "搜索关键词，匹配标题与副标题"
        communityNo: 
          type: "string"
          description: "按社区过滤 —— **决定这个小区的人能看到哪些商家的货**。不传则按当前绑定社区"
      additionalProperties: false
    PromotedMerchantsQuery: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "按社区取推荐。不传则按当前绑定社区"
        size: 
          type: "number"
          description: "取几条，默认由服务端定"
      additionalProperties: false
    PromotedGoodsQuery: 
      type: "object"
      properties: 
        communityNo: 
          type: "string"
          description: "按社区取推荐。不传则按当前绑定社区"
        size: 
          type: "number"
          description: "取几条，默认由服务端定"
      additionalProperties: false
    CartAddReq: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "商品单号"
        skuNo: 
          type: "string"
          description: "SKU 单号。购物车按 SKU 去重，同商品不同规格是两行"
        qty: 
          type: "number"
          description: "加购件数，正整数"
      required: 
        - "goodsNo"
        - "skuNo"
        - "qty"
      additionalProperties: false
    CartUpdateReq: 
      type: "object"
      properties: 
        skuNo: 
          type: "string"
          description: "要改的 SKU"
        qty: 
          type: "number"
          description: "改后的件数。传 0 等同于删除该行"
      required: 
        - "skuNo"
        - "qty"
      additionalProperties: false
    CartRemoveReq: 
      type: "object"
      properties: 
        skuNos: 
          type: "array"
          items: 
            type: "string"
          description: "要删除的 SKU 列表。批量是因为购物车支持多选删除"
      required: 
        - "skuNos"
      additionalProperties: false
    CreateOrderReqBody: 
      type: "object"
      properties: 
        items: 
          type: "array"
          items: 
            type: "object"
            properties: 
              goodsNo: 
                type: "string"
                description: "商品单号"
              skuNo: 
                type: "string"
                description: "SKU 单号"
              qty: 
                type: "number"
                description: "件数"
            required: 
              - "goodsNo"
              - "skuNo"
              - "qty"
            additionalProperties: false
          description: "下单行。跨商家时服务端**拆成多笔子订单**，共享一个 payGroupNo（E3）"
        fulfillment: 
          "$ref": "#/components/schemas/FulfillmentType"
          description: "履约方式。决定下面 pickupNo / addressId / appointmentAt 哪个必填"
        pickupNo: 
          type: "string"
          description: "PICKUP 必填：自提点单号"
        addressId: 
          type: "string"
          description: "EXPRESS / 自送必填：收货地址。下单时地址整体**快照**进订单"
        couponNo: 
          type: "string"
          description: "使用的优惠券"
        usePoints: 
          type: "number"
          description: "使用的积分数。服务端按抵扣上限与账户余额截断，端上传的只是意愿"
        remark: 
          type: "string"
          description: "买家留言"
        groupNo: 
          type: "string"
          description: "参团下单时传团单号。**后端 CreateOrderReq 目前不认这个字段**，接上去会静默变成普通单"
        appointmentAt: 
          type: "number"
          description: "APPOINTMENT：预约开始时间戳"
        payMode: 
          type: "string"
          description: "支付方式（`PAY_MODE`）。**不传按 ONLINE** —— 存量端上没有这个字段， 不能因为补了它就让老版本下不了单。\n\n能不能选 OFFLINE 由 `orderCapability` 的 `usablePayModes` 说了算， 而后端在 create 里会**再判一次**：端上不该是唯一的闸。"
        appointmentSlotNo: 
          type: "string"
          description: "APPOINTMENT：选定的**预约时段**。这家店开了时段就必填 —— 没开则忽略，走 `appointmentAt` 那条旧路（兼容期）。"
        idempotencyKey: 
          type: "string"
          description: "幂等 key，防重复提交"
      required: 
        - "items"
        - "fulfillment"
        - "idempotencyKey"
      additionalProperties: false
    OrderListQuery: 
      type: "object"
      properties: 
        page: 
          type: "number"
          description: "页码，从 1 起"
        size: 
          type: "number"
          description: "每页条数"
        status: 
          type: "string"
          description: "按订单状态过滤，不传为全部。取值见 `OrderStatus`"
      additionalProperties: false
    AfterSaleReq: 
      type: "object"
      properties: 
        type: 
          "$ref": "#/components/schemas/AfterSaleType"
          description: "仅退款 / 退货退款 —— 两者流程根本不同，不能合成一个"
        reason: 
          type: "string"
          description: "已拼好的原因文案（前端把 reason 枚举与补充说明合并后提交）"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "举证图。破损/少件类售后没有图基本判不了"
        reasonCode: 
          "$ref": "#/components/schemas/AfterSaleReason"
          description: "结构化原因，便于服务端统计与风控"
      required: 
        - "reason"
        - "images"
      additionalProperties: false
    GroupBuyListQuery: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "按自提点过滤 —— **成团单位就是自提点**。不传则按当前绑定的自提点"
      additionalProperties: false
    JoinGroupBuyReq: 
      type: "object"
      properties: 
        qty: 
          type: "number"
          description: "参团件数，正整数"
      required: 
        - "qty"
      additionalProperties: false
    CreateGroupBuyReq: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "要开团的商品，必须是已上架商品"
        pickupNo: 
          type: "string"
          description: "成团的自提点"
        neighbor: 
          type: "object"
          properties: 
            toMyHome: 
              type: "boolean"
              const: true
            address: 
              type: "string"
            timeSlot: 
              type: "string"
          required: 
            - "toMyHome"
            - "address"
            - "timeSlot"
          additionalProperties: false
          description: "邻里自提：送到我家（ADR-005）。只能是发起人自己家，不能指定别人家"
      required: 
        - "goodsNo"
        - "pickupNo"
      additionalProperties: false
    RequestListQuery: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "按自提点过滤。求团的范围同样是自提点/小区"
      additionalProperties: false
    CreateRequestReq: 
      type: "object"
      properties: 
        pickupNo: 
          type: "string"
          description: "需求所属的自提点/小区"
        title: 
          type: "string"
          description: "需求标题，如「想团儿童床垫」。发起时**商品还不存在**"
        desc: 
          type: "string"
          description: "需求详述：尺寸、材质、用途，供商家判断能不能接"
        expectQty: 
          type: "number"
          description: "期望数量"
        budgetMinor: 
          type: "number"
          description: "心理价位（最小货币单位），可不填。填了商家报价更有的放矢"
      required: 
        - "pickupNo"
        - "title"
        - "desc"
        - "expectQty"
      additionalProperties: false
    ChooseQuoteReq: 
      type: "object"
      properties: 
        quoteNo: 
          type: "string"
          description: "选定的报价。**选定即锁价**，此后下单一律用快照价（ADR-003）"
      required: 
        - "quoteNo"
      additionalProperties: false
    MerchantListQuery: 
      type: "object"
      properties: 
        keyword: 
          type: "string"
          description: "搜索关键词，匹配店名"
        communityNo: 
          type: "string"
          description: "按社区过滤 + 按距该社区距离排序。不传 = 全域（搜索场景）"
      additionalProperties: false
    ReviewListQuery: 
      type: "object"
      properties: 
        goodsNo: 
          type: "string"
          description: "只看某商品的评价"
        merchantNo: 
          type: "string"
          description: "只看某商家的评价。与 goodsNo 二选一，都不传则报错"
      additionalProperties: false
    CreateReviewReq: 
      type: "object"
      properties: 
        orderNo: 
          type: "string"
          description: "被评价的订单。**必须是已完成订单**，且一单一评"
        goodsNo: 
          type: "string"
          description: "被评价的商品。一单多商品时逐个评"
        rating: 
          type: "number"
          description: "总分，1–5 整数"
        content: 
          type: "string"
          description: "评价正文"
        images: 
          type: "array"
          items: 
            type: "string"
          description: "评价图 URL 列表，可为空数组"
        scores: 
          "$ref": "#/components/schemas/ReviewScores"
          description: "三维分（商品 / 履约 / 服务）。**可选** —— 老客户端只给总分。\n\n评价页一直在发这个字段，但类型里漏了它，于是它是**悄悄漏出去的**： `satisfies` 检查不到、OpenAPI 里没有、后端也就无从知道要收。 是 wire-alignment 守卫在后端实现时把它抓出来的。"
      required: 
        - "orderNo"
        - "goodsNo"
        - "rating"
        - "content"
        - "images"
      additionalProperties: false
    VerifyPickupReq: 
      type: "object"
      properties: 
        code: 
          type: "string"
          description: "取货码。发起人在邻里自提点为参团者核销时出示的那串码"
      required: 
        - "code"
      additionalProperties: false
    MarkArrivedReq: 
      type: "object"
      properties: 
        orderNos: 
          type: "array"
          items: 
            type: "string"
          description: "要标记到货的订单。**批量**：一次到货通常是一整批，逐单调用会把通知发成 N 条"
      required: 
        - "orderNos"
      additionalProperties: false
    PointsDeductibleQuery: 
      type: "object"
      properties: 
        merchantNo: 
          type: "string"
          description: "试算哪个商家的单 —— 开关是按商家判的，不同店结果不同"
        payableMinor: 
          type: "number"
          description: "券后金额（分）。抵扣上限按它算，**运费不参与**"
        payMode: 
          type: "string"
          description: "支付方式（`PAY_MODE`）。线下能否用积分由平台一个开关控制 —— 不传的话试算按线上算，而下单时按真实支付方式算，两处会给出不同的数。"
      required: 
        - "merchantNo"
        - "payableMinor"
      additionalProperties: false
    Record_Lang_string: 
      type: "object"
      properties: 
        zh-CN: 
          type: "string"
        en: 
          type: "string"
        ar: 
          type: "string"
      required: 
        - "zh-CN"
        - "en"
        - "ar"
      additionalProperties: false
    Record_string_boolean: 
      type: "object"
      additionalProperties: 
        type: "boolean"
    Record_string_string: 
      type: "object"
      additionalProperties: 
        type: "string"
    Record_string_number: 
      type: "object"
      additionalProperties: 
        type: "number"
paths: 
  "/mp/user/otp/send": 
    post: 
      operationId: "sendOtp"
      summary: "发送验证码"
      tags: 
        - "user"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    description: "无返回体（data 恒为 null）"
                    nullable: true
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/mp/user/login": 
    post: 
      operationId: "login"
      summary: "登录建户"
      tags: 
        - "user"
      security: []
      parameters: []
      responses: 
        "200": 
          description: "OK"
          content: 
            "application/json": 
              schema: 
                type: "object"
                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/LoginResp"
                required: 
                  - "code"
                  - "msg"
                  - "data"
      requestBody: 
        required: true
        content: 
          "application/json": 
            schema: 
              "$ref": "#/components/schemas/LoginReqBody"
  "/mp/user/profile": 
