                properties: 
                  code: 
                    type: "integer"
                    description: "0 表示成功"
                  msg: 
                    type: "string"
                  data: 
                    "$ref": "#/components/schemas/User"
                required: 
                  - "code"
                  - "msg"
                  - "data"
  "/mp/user/logout": 
    post: 
      operationId: "logout"
