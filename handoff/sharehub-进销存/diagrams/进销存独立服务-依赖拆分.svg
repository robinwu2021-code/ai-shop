<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" font-family="system-ui,-apple-system,'PingFang SC',sans-serif">
<title>依赖拆分：shop-inventory 今天依赖三个商城模块，独立后核心零商城依赖</title><desc>左半是今天：shop-inventory 依赖 shop-base、shop-base-auth、shop-store-mybatis，共 28 个外部类、123 处 import；shop-app 有 38 个文件反向依赖它，其中 invbridge 32 个。右半是独立后：inventory-core 不依赖任何 ai.neargo.shop 包（ArchUnit 守门），商城只经 inventory-client 调用；原控制器与 Port 实现移回 shop-app 做适配。</desc>
<defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A94A2" stroke-width="1.4" stroke-linecap="round"/></marker><marker id="pd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B39A6A" stroke-width="1.4" stroke-linecap="round"/></marker><style>.bx{fill:#FFFFFF;stroke:#D5DBE3;stroke-width:1.2}.bn{fill:#FFFDF6;stroke:#D9C89A;stroke-width:1.4;stroke-dasharray:5 3}.bg{fill:#F3F6FA;stroke:#C8D0DA;stroke-width:1.2}.bk{fill:#FFF5F3;stroke:#E2B7AE;stroke-width:1.2}.n{font-size:13.5px;font-weight:600;fill:#161A21}.s{font-size:11px;fill:#5A6472}.band{font-size:11.5px;fill:#7B8695;letter-spacing:.08em}.l{font-size:10.5px;fill:#5A6472;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}.lw{font-size:10.5px;fill:#8A7434;paint-order:stroke;stroke:#FFFFFF;stroke-width:3.5;stroke-linejoin:round}.ar{stroke:#8A94A2;stroke-width:1.3;fill:none}.ard{stroke:#B39A6A;stroke-width:1.3;fill:none;stroke-dasharray:5 3}.tag{font-size:10px;fill:#8A7434;font-weight:600}</style></defs>
<text class="band" x="30" y="28">今天</text>
<text class="band" x="480" y="28">独立后</text>
<rect class="bx" x="30" y="46" width="180" height="56" rx="8"/><text class="n" x="46" y="72">shop-app</text><text class="s" x="46" y="90">invbridge 32 · 其它 6</text>
<rect class="bx" x="30" y="150" width="180" height="70" rx="8"/><text class="n" x="46" y="176">shop-inventory</text><text class="s" x="46" y="196">领域 + 12 个控制器</text><text class="s" x="46" y="212">+ 4 个商城 Port 实现</text>
<rect class="bk" x="250" y="110" width="180" height="44" rx="8"/><text class="n" x="266" y="137">shop-base（21 类）</text>
<rect class="bk" x="250" y="166" width="180" height="44" rx="8"/><text class="n" x="266" y="193">shop-base-auth（5 类）</text>
<rect class="bk" x="250" y="222" width="180" height="44" rx="8"/><text class="n" x="266" y="249">shop-store-mybatis（2 类）</text>
<path class="ar" d="M120 102 L120 148" marker-end="url(#pa)"/>
<path class="ar" d="M210 172 L248 132" marker-end="url(#pa)"/>
<path class="ar" d="M210 186 L248 188" marker-end="url(#pa)"/>
<path class="ar" d="M210 202 L248 242" marker-end="url(#pa)"/>
<rect class="bx" x="480" y="46" width="200" height="56" rx="8"/><text class="n" x="496" y="72">shop-app 适配层</text><text class="s" x="496" y="90">原控制器 · 原 Port 实现</text>
<rect class="bx" x="720" y="46" width="170" height="56" rx="8"/><text class="n" x="736" y="72">ShareHub BFF</text><text class="s" x="736" y="90">只依赖 client</text>
<rect class="bg" x="580" y="140" width="220" height="44" rx="8"/><text class="n" x="596" y="167">inventory-api · client</text>
<rect class="bx" x="580" y="214" width="220" height="56" rx="8"/><text class="n" x="596" y="240">inventory-server</text><text class="s" x="596" y="258">→ core（零商城依赖）· infra</text>
<path class="ard" d="M580 102 L640 138" marker-end="url(#pd)"/><text class="lw" x="560" y="128">M5</text>
<path class="ar" d="M805 102 L760 138" marker-end="url(#pa)"/>
<path class="ar" d="M690 184 L690 212" marker-end="url(#pa)"/><text class="l" x="698" y="202">HTTP</text>
<text class="tag" x="480" y="310">ArchUnit：core 不得 import ai.neargo.shop.* ；api 不得依赖 core</text>
<text class="s" x="30" y="310">28 个外部类、123 处 import：异常与错误码 45 · 商城身份 20 · SPI / 内部协议 / 任务 / 事件 58</text>
<text class="s" x="30" y="332">过渡期 shop-inventory 嵌入模式继续运行，只修 bug；新能力只进独立服务</text>
</svg>
