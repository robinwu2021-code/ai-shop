# 2026-09-14 盘满事故引入。安装位置：/etc/systemd/journald.conf.d/00-size.conf
#
# 此前 journald 没有任何上限配置，走默认值：文件系统的 10%、封顶 4G。
# 事故当天 rsyslog 往 journal 里写了 363 万行「No space left on device」，
# 一天归档出十个 124.7M 的文件 —— 当时它只显得 965M，是因为盘满逼着 journald 自己删旧的；
# 盘一空出来，它会一路长到 4G。
#
# 500M 的依据：日常 journal 主要是 sshd / systemd / cron 与 ai-shop-pay（它的 stdout 进 journal），
# 事故后实测去掉 rsyslog 刷屏，9/13 起两天只有 6 千行；500M 足够留几个月。
# SystemMaxFileSize 调小，是为了清理时粒度更细 —— 一次删一个 124M 的归档太粗了。
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=64M
