# MySQL 9.7 的内存限额（2026-09-16）
#
# **这两个数必须与 /etc/mysql97/my.cnf 的 innodb_buffer_pool_size 一起看。**
# 此前 pool=1G 而 MemoryHigh=384M，两边直接矛盾：pool 一申请就撞上限、
# 被 memcg 回收，匿名页只能进 swap —— 那 1G「整库常驻」从未成立。
# 判据是 memory.events 的 high 计数一路上涨（实测半小时涨了约 900 次）。
#
# 现在：pool=384M（全部数据 296M，够整库常驻）+ 自身开销约 150M ≈ 550M，
# MemoryHigh=768M 留出余量，MemoryMax=1G 封顶防跑飞。
#
# ⚠️ **别用 `systemctl set-property` 改**：那会写进 /etc/systemd/system.control/，
# 于是同一件事有两个真相源，而那个目录不进仓库、也标着「Do not edit」。
[Service]
MemoryHigh=768M
MemoryMax=1G
