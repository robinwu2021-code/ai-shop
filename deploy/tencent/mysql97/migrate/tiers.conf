# 种子数据分级 —— 决定一张表的数据进哪一档。
# extract-seed.sh 读它:REQUIRED 与 SKIP 是显式名单;剩下所有表默认归 TEST。
# 新表默认落 TEST(安全:不会把业务/演示数据误当"必要"灌进生产)。
#
# 三档的意义(2026-09-14 定,针对盘满事故的教训:测试商品 SK9901 混在生产库里):
#   REQUIRED 必要 —— 空库没它就跑不起来/登不进的系统配置与参考数据。生产也要。
#   TEST     测试 —— 演示业务数据(社区/商家/商品/订单/库存流水…)。只有测试环境才灌。
#   SKIP     运行时 —— 日志、会话、发件箱、幂等、Flyway 历史等。**新环境里就该是空的**,一条都不灌。
#
# 另有两类单列(见脚本):
#   REGION   —— sys_region 66 万行行政区划,由迁移 V31/V181 灌,不进种子文件(太大且属"结构自带")。
#   ACCOUNTS —— sys_ops_staff 运营账号,含密码哈希。单独一个文件、当凭据处理、不入库(git)。

# ── 必要(REQUIRED):系统配置 / 参考数据 ───────────────────────────────
# 权限体系:菜单、功能点、角色、角色-功能点、角色成员
REQUIRED ai_shop sys_function sys_function_point sys_role sys_role_point sys_role_member
# 系统字典/开关
REQUIRED ai_shop sys_industry sys_legal_form sys_market sys_merchant_plan_def sys_setting sys_banned_word
# 渠道-类目规则、支付渠道配置
REQUIRED ai_shop sys_channel_category_rule sys_pay_channel sys_pay_channel_market sys_pay_channel_rate
# 类目树 + 规格字典 + 标品库(商品都挂在它们下面)
REQUIRED ai_shop prd_category prd_category_spec prd_category_spec_value prd_category_pay_mode prd_category_points
REQUIRED ai_shop prd_spec_dim prd_spec_template prd_spec_value prd_spu_std
# 通知渠道/场景/模板配置
REQUIRED ai_shop notify_channel notify_scene_channel notify_template
# 结算费率、承运商、运费模板
REQUIRED ai_shop stl_fee_rule ful_carrier ful_freight_template
# 商家准入策略、商家侧角色定义
REQUIRED ai_shop mch_admission_policy mch_role mch_store_role
# 风控规则、帮助中心 FAQ
REQUIRED ai_shop risk_rule msg_faq
# 进销存:计量单位
REQUIRED ai_shop_inv inv_uom
# 定时任务定义
REQUIRED ai_shop_job job_definition

# ── 运行时(SKIP):新环境里就该是空的,一条不灌 ──────────────────────
# 按后缀通配(见脚本):*_log *_session
# 显式点名:
SKIP ai_shop sys_outbox sys_idempotent sys_auth_code sys_event_consumed shedlock
SKIP ai_shop sys_media_asset sys_media_purge_batch sys_job_run
SKIP ai_shop risk_signal_hit geo_poi_cache
SKIP ai_shop notify_push_token notify_push_task notify_message notify_ticket notify_subscribe
SKIP ai_shop mch_store_audit
SKIP ai_shop_inv inv_outbox
SKIP ai_shop_job job_run
# 通配后缀(任意库):以这些结尾的表一律 SKIP
SKIP_SUFFIX _log _session

# ── 单列 ────────────────────────────────────────────────────────────
REGION   ai_shop sys_region
ACCOUNTS ai_shop sys_ops_staff
