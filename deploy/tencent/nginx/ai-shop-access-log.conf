# Install in /etc/nginx/conf.d/ (http context). Route names are fixed labels.
map $uri $ai_shop_route {
    ~^/ops(/|$)          ops;
    ~^/biz(/|$)          biz;
    ~^/mp(/|$)           mp;
    ~^/common(/|$)       common;
    ~^/internal(/|$)     internal;
    ~^/(open/pay|terminal/pay|checkout|pay/callback|pay-ops)(/|$) pay;
    ~^/callback(/|$)     callback;
    default             other;
}
map $request_method $ai_shop_method {
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
    default OTHER;
}
log_format ai_shop_safe '[$time_local] bytes=$body_bytes_sent method=$ai_shop_method route=$ai_shop_route status=$status '
                        'elapsed=$request_time request_id=$request_id';
