# ai-shop · img.hxmall.top —— 公开图「经应用服务器」出口
#
# 设计见 docs/technical/design/TDD-图片走服务器与流量切换.md（ADR-026）。
# 库里存的规范地址就是 https://img.hxmall.top/<key>；另一个出口 cdn.hxmall.top（经图片服务器）
# 由后端配置 shop.media.delivery=direct 切过去，这个站点在那之后仍然保留，作回退路径。
#
# 这台是轻量服务器，与桶同在广州：桶域名在服务器上解析到内网 169.254.0.47，
# 取图走内网、不计流量。对外受 5 Mbps 带宽限制，所以列表一律用 !wNNN 缩略图。
#
# ⚠ 本文件在 sites-enabled 里要排在 www.hxmall.top 之前（按文件名字母序，img < www）：
#   下面的 upstream cos_bucket 两个站点都在用。

# key 名随机、从不覆盖，缓存安全。回收任务删掉的孤儿图，缓存里最多还留 30 天 —— 只有没人引用的图才会被删，可以接受。
proxy_cache_path /data/cache/img       levels=1:2 keys_zone=img:20m       max_size=8g inactive=30d use_temp_path=off;
proxy_cache_path /data/cache/img-thumb levels=1:2 keys_zone=img_thumb:20m max_size=2g inactive=30d use_temp_path=off;

# 用 upstream 而不是在 proxy_pass 里直接写域名：带变量的 proxy_pass 要在运行时解析域名，
# 没配 resolver 就是 502。upstream 在启动时解析一次（服务器上是内网地址）。
# Host 必须显式设成桶域名 —— 否则 COS 收到的是 "cos_bucket"，而私有图的签名也对不上。
upstream cos_bucket {
    server hxmall-merchant-1301656997.cos.ap-guangzhou.myqcloud.com:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name img.hxmall.top;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.hxmall.top;

    ssl_certificate     /etc/nginx/ssl/hxmall.top/fullchain.crt;   # *.hxmall.top 通配证书
    ssl_certificate_key /etc/nginx/ssl/hxmall.top/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/img.access.log;

    # 只读。桶本身是公有读，放行写方法等于把桶的写口开在我们域名上
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # 根路径就是「列出桶里全部对象」（ListObjects），带什么查询参数都一样
    location = / { return 403; }

    # ── 缩略图：…/<key>!w200 | !w375 | !w750 ─────────────────────────────
    # 只认三档宽度：任意宽度会被人用来把缓存和 CPU 撑爆。写法与数据万象的样式（分隔符 !）一致，
    # 切到 cdn.hxmall.top 时客户端拼的地址不用变。
    # 两层：这一层缓存缩好的图，缩图在下面 127.0.0.1:8095 那个 server 里做 ——
    # image_filter 作用在代理响应之后，与 proxy_cache 写在同一层的话，缓存里存的是原图。
    location ~ "^/(?<k>[^!]+)!w(?<w>200|375|750)$" {
        proxy_pass http://127.0.0.1:8095/$k?w=$w;
        proxy_cache img_thumb;
        proxy_cache_key "$k!w$w";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache $upstream_cache_status;
    }
    # 其它写法的 !w（!w376、!w0 …）一律 404，不回源
    location ~ "!w[0-9]*$" { return 404; }

    # ── 原图 ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://cos_bucket;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host hxmall-merchant-1301656997.cos.ap-guangzhou.myqcloud.com;
        proxy_set_header Authorization "";
        proxy_cache img;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 403 404 1m;
        proxy_cache_lock on;
        proxy_hide_header x-cos-request-id;
        proxy_hide_header x-cos-trace-id;
        proxy_hide_header x-cos-hash-crc64ecma;
        proxy_hide_header Server;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache $upstream_cache_status;
    }
}

# ── 内部：从 COS 取原图并缩到 ?w= 宽，只给上面那一层用 ────────────────────
server {
    listen 127.0.0.1:8095;
    access_log off;

    location / {
        # 只转发路径，不带 ?w= —— 那是给 image_filter 的，COS 不认识的参数可能被拒
        proxy_pass http://cos_bucket$uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host hxmall-merchant-1301656997.cos.ap-guangzhou.myqcloud.com;
        # 上传上限 5MB；缓冲区小于原图时 image_filter 直接回 415
        image_filter_buffer 8M;
        image_filter_jpeg_quality 82;
        image_filter_interlace on;
        image_filter resize $arg_w -;
    }
}
