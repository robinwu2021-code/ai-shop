# IP 直连入口 —— **备案下来后只剩一条 301**（2026-09-01）。
#
# 备案期间这里是一份完整的站点配置（122 行），与 www.hxmall.top 的
# location 段逐条对着写。那份配置的注释里记着它踩过的坑：
# 「改一处必须改两处」——官网接管根路径时漏改过一次，
# 从 IP 打开时页面白屏而 HTTP 状态码全是 200。
#
# 备案下来之后那份配置就该退休了：**两份必须保持一致的配置，
# 迟早有一份忘了改**，而这一份恰恰是没人天天看的那份。
#
# 为什么保留 301 而不是整个删掉：
#   · 删掉的话 IP 请求会落到 nginx 的默认站点（或上一个 default_server），
#     出来的可能是别的东西，而不是一个能看懂的提示；
#   · 已经装在手机上的旧包、印出去的物料里可能还带着 IP，
#     301 让它们跳到域名而不是直接死；
#   · access.log 里还能看见「还有多少人在用 IP」，那是决定何时彻底关掉的依据。
#
# API 请求（/mp /biz /ops）**同样跳转**：跨域 301 之后浏览器会带着
# 新域名重发，而 App 端的 uni.request 也跟随重定向。
# 想彻底断掉 IP 的那天，把这个 server 块删掉即可。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # $request_uri 带着查询串，别用 $uri —— 后者会把 ?code=xxx 丢掉，
    # 而店铺码、分享链接恰恰都靠查询串传参。
    return 301 https://www.hxmall.top$request_uri;
}
