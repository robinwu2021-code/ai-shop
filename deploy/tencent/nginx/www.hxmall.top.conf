# ai-shop · www.hxmall.top —— 对外唯一入口
server {
    listen 80;
    listen [::]:80;
    server_name www.hxmall.top;

    # 物流渠道推送走 HTTP 也要直达（TDD-物流模块 P1，2026-10-09）：快递100 订阅推送的回调地址
    # 默认只支持 http，开 https 要找他们技术人员。不能跟着下面整段 301 跳 https —— 推送方把 301
    # 当回调失败，重推三次后放弃。只开 /callback/logistics/，其余照旧跳 https。
    # 推送不带我方令牌，靠渠道签名自证（PushReceiver 验签）；SecurityConfig 已放行 /callback/**。
    location ^~ /callback/logistics/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hxmall.top;

    ssl_certificate     /etc/nginx/ssl/hxmall.top/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/hxmall.top/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;
    root /data/app/ai-shop/web/site;
    index index.html;

    # ── 后端三个面 ────────────────────────────────────────────────
    # ⚠ ^~ 必须在 /ops 之前生效：否则 /ops-web/ 会被 /ops 前缀先匹配走。
    # 少一个尾斜杠就 404：location ^~ /ops-web/ 只匹配带斜杠的，
    # 而 /ops-web 会落到下面的 location / —— 那里的 root 是官网站点，
    # 找不到同名文件就 =404。用户手敲地址十次有九次不带斜杠，
    # 而返回的 404 页看不出「只差一个字符」。三个子站一起补。
    # 缓存策略：**HTML 不缓存，带哈希的 assets 长缓存**。
    # 不写 Cache-Control 时浏览器/WebView 按启发式规则自己决定，而且常常不回源校验 ——
    # 商家端那个壳（android-shell release 的 shell_entry 就指着 /b/）因此会把 index.html
    # 缓存住，里面引用的还是上一版的哈希文件名，于是发了新版真机上仍是旧界面，
    # 而服务器这边一切正常、查不出异常。
    location = /ops-web { return 301 /ops-web/$is_args$args; }
    location = /b       { return 301 /b/$is_args$args; }
    location = /c       { return 301 /c/$is_args$args; }
    location = /dl      { return 301 /dl/$is_args$args; }

    location ^~ /ops-web/assets/ {
        alias /data/app/ai-shop/web/ops-web/assets/;
        # 一条就够： 与  并用会发出两个 Cache-Control，
        # 客户端取哪一个不确定
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /ops-web/ {
        alias /data/app/ai-shop/web/ops-web/;
        try_files $uri $uri/ $uri/index.html /ops-web/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /b/assets/ {
        alias /data/app/ai-shop/web/b-app/assets/;
        # 一条就够： 与  并用会发出两个 Cache-Control，
        # 客户端取哪一个不确定
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /b/ {
        alias /data/app/ai-shop/web/b-app/;
        try_files $uri $uri/ /b/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /c/assets/ {
        alias /data/app/ai-shop/web/c-app/assets/;
        # 一条就够： 与  并用会发出两个 Cache-Control，
        # 客户端取哪一个不确定
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /c/ {
        alias /data/app/ai-shop/web/c-app/;
        try_files $uri $uri/ /c/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 店铺码短链 https://www.hxmall.top/s/<code> —— **由后端解析**，见下面那条反代正则里的 `s`
    # （TDD-店铺码与分享 §3.5）。
    #
    # 这里原来是 `location ^~ /s/ { return 302 /c/$is_args$args; }`：
    # `$is_args$args` 只保住 query，**路径里的码被丢掉**。实测 /s/SMTBA2 → Location: /c/，
    # 而同一个码 /mp/store/by-code 解析得好好的 —— 印在包装上的码、店主分享出去的链接，
    # 点开都只到 C 端首页，店主一直以为自己在带客。
    #
    # ⚠️ 那条 `^~` 前缀规则必须删掉而不是留着：`^~` 会短路后面的正则 location，
    # 留着它的话把 `s` 加进正则也不会生效。

    # /internal/** 是独立调度器回调业务方法的通道 —— **不走 Spring Security**，
    # 全部门禁只有 X-Job-Token 一个共享密钥。所以这里只对本机开放。
    #
    # 调度器 ai-shop-job 与业务同机，打的是 127.0.0.1:8081，本来就不经过 nginx；
    # 这条路由现在没有任何消费者。**显式写出来是为了把边界变成一条配置断言** ——
    # 在此之前「外部访问不到」靠的是「碰巧没人给它配路由」，
    # 而那种性质会在有人往下面那条正则里补一个 internal 时静默消失。
    #
    # 前缀匹配用 ^~：它会短路后面的正则 location，顺序无关。
    # 没有配 real_ip，$remote_addr 就是真实对端，allow/deny 不可伪造。
    location ^~ /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 支付域的回调（微信 notify_url / 支付宝 notify_url）────────────
    # 路径按**业务域**排：支付的回调跟着支付走，消息推送的回调跟着消息走
    # （/mp/wx/callback 一直就是这么放的）。
    #
    # **整段放行**，不再一条一条加：退款、分账结果、支付宝……每加一种回调
    # 都要回来改 nginx 的话，漏改的表现是「用户付了钱、通道重推全 404、
    # 后端日志一行都没有」——最难查的一类。
    #
    # 敢整段放行，是因为同一前缀下那个开发期假回调 /pay/callback/stub
    # **在生产根本不装配**（PayCallbackController 挂 shop.pay.stub=true，
    # 生产是 false）。此前它靠「nginx 没反代 /callback」挡着，那是侥幸不是设计。
    #
    # 这些口**公网可达且不带我方令牌**，靠通道验签自证
    # （ChannelPayCallbackController：验签 → 回查通道 → 才落账）。
    location ^~ /pay/callback/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 第三方回调（快递100 取件状态等，TDD-快递100商家寄件）。与 /pay/callback/ 同理：
    # 公网可达、不带我方令牌，靠通道签名自证（Kuaidi100CallbackController 里验签）。
    # SecurityConfig 已放行 /callback/**；少这一段，回调落到官网的 try_files 返回 404，快递100 会一直重推。
    location ^~ /callback/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # 私有图（证件、售后凭证）的签名地址：https://www.hxmall.top/cos-private/<key>?q-sign-…
    # 永远走应用服务器、不参与出口切换（ADR-026）。不缓存：签名有时效，缓存会让过期签名照样能打开。
    # Host 必须是桶域名 —— 签名里算进了 host，换成别的 COS 直接 403。upstream cos_bucket 定义在 img.hxmall.top.conf。
    location = /cos-private/ { return 403; }   # 不带 key 就是桶根路径 = 列出全部对象
    location ^~ /cos-private/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://cos_bucket/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host hxmall-merchant-1301656997.cos.ap-guangzhou.myqcloud.com;
        proxy_cache off;
        proxy_hide_header x-cos-request-id;
        proxy_hide_header x-cos-trace-id;
        proxy_hide_header Server;
        add_header Cache-Control "private, no-store";
    }

    # ── 元器件独立服务（elec-svc :8085）────────────────────────────
    # 它接用户流量：小程序 C 端 /elec/c/**、B 端 /elec/b/**、运营端 /elec/ops/**。
    # **不反代 /internal/**（上面那条 location 已经把 /internal/ 限死在内网）——
    # elec-svc 走本机 127.0.0.1:8081 调主系统，不经这里。
    #
    # 前缀匹配用 ^~：它短路后面的正则 location，与顺序无关（同 /pay/callback/ 那条）。
    location ^~ /elec/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 按 IP 限流（游客查料号）读的是它的最左一跳，所以这里必须传
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        # 上传库存表：5MB 的 xlsx（应用侧 max-file-size 也是 5MB）。
        # 不设的话 nginx 默认 1MB，表现是「传大表直接 413，小表没问题」
        client_max_body_size 6m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # common：匿名的公共字典（/common/master-data，三端都调）。漏了它会落到下面官网的
    # try_files =404 —— 运营端从 2026-08-10 起每页都报这个 404，只是控制台里安静地红着。
    location ~ ^/(mp|biz|ops|common|actuator|uploads|media|s)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 官网（根路径 · Next.js 静态导出）────────────────────────────
    # trailingSlash:true → 每个路由是「目录/index.html」，故要试 $uri/index.html
    # 兜 =404 而不是 /404.html：后者会用 200 状态码返回错误页，搜索引擎会当正常页收录
    # 安装包分发。**放在 site 根目录之外** —— 官网发布用 rsync --delete 同步
    # /data/app/ai-shop/web/site/，放里面的包每次发官网都会被删掉。
    # ⚠ 与 ai-shop-ip 必须同时存在：商家端 release 壳加载的是 http://<IP>/b/，
    #   它的「检查更新」也会走同一台机的 /dl/。
    location ^~ /dl/ {
        alias /data/app/ai-shop/web/dl/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        autoindex off;
    }

    location / { try_files $uri $uri/ $uri/index.html =404; }
    error_page 404 /404.html;
}
