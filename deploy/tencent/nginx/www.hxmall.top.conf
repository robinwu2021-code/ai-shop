# ai-shop · www.hxmall.top —— 对外唯一入口
server {
    listen 80;
    listen [::]:80;
    server_name www.hxmall.top;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hxmall.top;

    ssl_certificate     /etc/nginx/ssl/hxmall.top/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/hxmall.top/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;
    root /var/www/ai-shop/site;
    index index.html;

    # ── 后端三个面 ────────────────────────────────────────────────
    # ⚠ ^~ 必须在 /ops 之前生效：否则 /ops-web/ 会被 /ops 前缀先匹配走。
    # 少一个尾斜杠就 404：location ^~ /ops-web/ 只匹配带斜杠的，
    # 而 /ops-web 会落到下面的 location / —— 那里的 root 是官网站点，
    # 找不到同名文件就 =404。用户手敲地址十次有九次不带斜杠，
    # 而返回的 404 页看不出「只差一个字符」。三个子站一起补。
    # 缓存策略：**HTML 不缓存，带哈希的 assets 长缓存**。
    # 不写 Cache-Control 时浏览器/WebView 按启发式规则自己决定，而且常常不回源校验 ——
    # 商家端那个壳（android-shell release 的 shell_entry 就指着 /b/）因此会把 index.html
    # 缓存住，里面引用的还是上一版的哈希文件名，于是发了新版真机上仍是旧界面，
    # 而服务器这边一切正常、查不出异常。
    location = /ops-web { return 301 /ops-web/$is_args$args; }
    location = /b       { return 301 /b/$is_args$args; }
    location = /c       { return 301 /c/$is_args$args; }
    location = /dl      { return 301 /dl/$is_args$args; }

    location ^~ /ops-web/assets/ {
        alias /var/www/ai-shop/ops-web/assets/;
        # 一条就够： 与  并用会发出两个 Cache-Control，
        # 客户端取哪一个不确定
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /ops-web/ {
        alias /var/www/ai-shop/ops-web/;
        try_files $uri $uri/ $uri/index.html /ops-web/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /b/assets/ {
        alias /var/www/ai-shop/b-app/assets/;
        # 一条就够： 与  并用会发出两个 Cache-Control，
        # 客户端取哪一个不确定
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /b/ {
        alias /var/www/ai-shop/b-app/;
        try_files $uri $uri/ /b/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /c/assets/ {
        alias /var/www/ai-shop/c-app/assets/;
        # 一条就够： 与  并用会发出两个 Cache-Control，
        # 客户端取哪一个不确定
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /c/ {
        alias /var/www/ai-shop/c-app/;
        try_files $uri $uri/ /c/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 老店铺码链接 https://www.hxmall.top/s/<code> —— 官网接管 / 之后不能 404。
    # 保持它今天的行为：打开 C 端（带上 ?g= 参数）。这些码可能已经印在包装上了。
    location ^~ /s/ { return 302 /c/$is_args$args; }

    # /internal/** 是独立调度器回调业务方法的通道 —— **不走 Spring Security**，
    # 全部门禁只有 X-Job-Token 一个共享密钥。所以这里只对本机开放。
    #
    # 调度器 ai-shop-job 与业务同机，打的是 127.0.0.1:8081，本来就不经过 nginx；
    # 这条路由现在没有任何消费者。**显式写出来是为了把边界变成一条配置断言** ——
    # 在此之前「外部访问不到」靠的是「碰巧没人给它配路由」，
    # 而那种性质会在有人往下面那条正则里补一个 internal 时静默消失。
    #
    # 前缀匹配用 ^~：它会短路后面的正则 location，顺序无关。
    # 没有配 real_ip，$remote_addr 就是真实对端，allow/deny 不可伪造。
    location ^~ /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(mp|biz|ops|actuator|uploads|media)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 官网（根路径 · Next.js 静态导出）────────────────────────────
    # trailingSlash:true → 每个路由是「目录/index.html」，故要试 $uri/index.html
    # 兜 =404 而不是 /404.html：后者会用 200 状态码返回错误页，搜索引擎会当正常页收录
    # 安装包分发。**放在 site 根目录之外** —— 官网发布用 rsync --delete 同步
    # /var/www/ai-shop/site/，放里面的包每次发官网都会被删掉。
    # ⚠ 与 ai-shop-ip 必须同时存在：商家端 release 壳加载的是 http://<IP>/b/，
    #   它的「检查更新」也会走同一台机的 /dl/。
    location ^~ /dl/ {
        alias /var/www/ai-shop/dl/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        autoindex off;
    }

    location / { try_files $uri $uri/ $uri/index.html =404; }
    error_page 404 /404.html;
}
