# 抗扫描洪水（2026-09-16）
#
# 背景：11:40 关掉口令登录之后，**攻击并没有停，只是换了形态** ——
# 126 分钟里 2776 次连接、32 个来源，96% 来自 4 个 IP；
# 708 次拿 root、592 次拿 ubuntu 试公钥，另有 1193 次 kex_exchange_identification
# （连上 TCP 就断的纯扫描）。它打不进来（成功登录 12 次全是 publickey 且全来自我们自己），
# 但它已经造成**可用性**损害：
#
#   error: beginning MaxStartups throttling
#   drop connection #10 from [82.156.126.92]:51144 past MaxStartups
#   exited MaxStartups throttling after 00:00:33, 3 connections dropped
#
# MaxStartups 10:30:100 是**全局**额度：并发未认证连接到 10 条就按概率随机丢。
# 实测单个 IP 一家就占了 8 条 —— 于是它把全局额度吃光，
# **而被丢掉的是随机的，包括我们自己的登录**。
#
# PerSourceMaxStartups 把额度按来源 IP 分：一家最多占 3 条，吃不光全局。
# 3 是够用的：认证通常在 1 秒内完成，「未认证」这个窗口很短，
# 正常人同时开十个终端也很少同时有 3 条处于未认证状态。
#
# NetBlockSize 32 = 按单个 IPv4 地址算，不按网段合并 ——
# 合并网段会误伤同一出口下的其他人。
PerSourceMaxStartups 3
PerSourceNetBlockSize 32
