# SSH 端口迁移：过渡期同时听 22 和 50722（2026-09-16）
#
# ⚠️ **写在这里，不要写 ssh.socket 的 drop-in。** 走过一次弯路，记下来：
#
# 试过 /etc/systemd/system/ssh.socket.d/10-ports.conf 里写 ListenStream=，
# 结果 systemd 只绑了 IPv6（ss 里只剩 `[::]:22`，`0.0.0.0:22` 消失），
# **IPv4 客户端在 SSH banner 之前就被关**：
#   kex_exchange_identification: Connection closed by remote host
# 当时没立刻发现，是因为日常用的那个 ssh 别名配了 ControlMaster 连接复用，
# 它在复用已有连接、根本没新建 —— **复用会掩盖「新连接已经连不上了」**。
# 要走 socket 那条路的话，必须显式写 0.0.0.0: 和 [::]: 两组，或 BindIPv6Only=both。
#
# 另一个坑：改完要 `systemctl restart ssh`，**`reload` 不会重新绑定端口** ——
# reload 之后 `sshd -T` 会如实报出新端口，而 `ss` 里根本没有它。
# **判据永远是 ss，不是 sshd -T。**
#
# 迁移顺序（第 5 步最后做，过渡期两个端口都在听，出错还有 22 兜着）：
#   ① 控制台放行 50722（已做）② 同时听两个 ③ 外部验 50722 通
#   ④ 改本机 ~/.ssh/config ⑤ 删掉下面的 `Port 22` ⑥ 控制台关掉 22
Port 22
Port 50722
