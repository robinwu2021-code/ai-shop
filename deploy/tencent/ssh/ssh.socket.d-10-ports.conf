# SSH 监听端口（2026-09-16）
#
# ⚠️ **端口写在这里，不是 sshd_config。** Ubuntu 24.04 用 socket 激活：
# ssh.socket 持有监听套接字再交给 sshd，于是 sshd_config 里的 `Port` 被完全忽略 ——
# 实测 `sshd -T` 明明报 `port 22 port 57022`，而 `ss -ltnp` 里只有 22。
# **「配置读进去了」不等于「端口在听」，判据只能是 ss。**
#
# 空的 ListenStream= 是必需的：不清空的话新值是**追加**到单元自带的 22 上，
# 而不是替换 —— 那样看起来也能用，直到有人以为自己改掉了 22。
ListenStream=
ListenStream=22
ListenStream=57022
