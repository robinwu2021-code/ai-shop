# SSH 加固（运维-目录与日志方案 §11.3 · 2026-09-16）
#
# 必须放在 sshd_config.d/ 里、且文件名排在 50-cloud-init.conf 之前：
# /etc/ssh/sshd_config 第 12 行先 Include 这个目录，而 sshd 以**先读到的值**为准 ——
# 只改主配置的第 33/123 行什么也不会变，50-cloud-init.conf 会把 PasswordAuthentication 盖回 yes。
#
# 依据（9-06~9-16 的 auth.log，只认 sshd[pid] 自己写的行）：
#   Accepted password  0 次      ← 关掉它切不到任何人
#   Accepted publickey 137 次    ← 真实登录全走公钥
#   Failed password    11988 次  ← 关掉它挡掉的是这些
PasswordAuthentication no
KbdInteractiveAuthentication no
# root 仍可用公钥登录（deploy 与 root 各有 1 把钥匙在 authorized_keys 里）
PermitRootLogin prohibit-password
