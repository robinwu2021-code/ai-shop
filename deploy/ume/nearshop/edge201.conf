# Parallel application domain; payment callbacks and Apple validation stay on twpay.
server {
 listen 80;
 server_name nearshop.umeshop.ai;
 access_log off;
 error_log /dev/null crit;
 return 301 https://nearshop.umeshop.ai$request_uri;
}
server {
 listen 443 ssl;
 server_name nearshop.umeshop.ai;
 ssl_session_cache shared:nearshopSSL:10m;
 ssl_session_timeout 1h;
 ssl_certificate /usr/local/nginx/conf/cert/twpay/fullchain.pem;
 ssl_certificate_key /usr/local/nginx/conf/cert/twpay/privkey.pem;
 ssl_protocols TLSv1.2;
 access_log off;
 error_log /dev/null crit;
 location ^~ /internal/ { return 404; }
 location ^~ /pay-ops/ { return 404; }
 location ^~ /ops/ { return 404; }
 location = /common/auth/automation { return 404; }
 location / {
  proxy_pass http://192.168.3.166;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 100s;
  client_max_body_size 20m;
 }
}
