# Include inside BOTH twpay and nearshop server blocks on app166.
# Application visibility/signature checks remain authoritative; never alias the disk.
location ^~ /uploads/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /media/ {
    limit_except GET { deny all; }
    access_log off;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 404 = @ai_shop_private_signed;
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
# API and OPS may have different runtime signing keys. Both verify the signature.
location @ai_shop_private_signed {
    limit_except GET { deny all; }
    access_log off;
    proxy_cache off;
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
