# Parallel non-checkout entry. Existing twpay virtual host remains unchanged.
server {
 listen 80;
 server_name nearshop.umeshop.ai;
 # Preserve browser HTTPS through the internal HTTP reverse proxy.
 absolute_redirect off;
 add_header Referrer-Policy "no-referrer" always;
 access_log off;
 error_log /dev/null crit;
 location = / { return 302 /ops-shop/; }
 # Hosted payment pages stay on the established payment origin.
 location ^~ /h5/ { return 307 https://twpay.umeshop.ai$request_uri; }
 location ~ ^/(?:c|q|s|result|return)/[A-Za-z0-9_-]+$ { return 307 https://twpay.umeshop.ai$request_uri; }
 location ^~ /nearpay-checkout/ { return 307 https://twpay.umeshop.ai$request_uri; }
# ai-shop 运营端（商城）：页面 /ops-shop/，接口 /ops-shop/ops/* → 本机 ai-shop-ops 18081 的 /ops/*
location = /ops-shop { return 301 /ops-shop/; }
location ^~ /ops-shop/ops/ {
    proxy_pass http://127.0.0.1:18081/ops/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
    proxy_read_timeout 100s;
    client_max_body_size 12m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# OPS static bundle shares its API prefix for public master data.
location = /ops-shop/common/master-data {
    proxy_pass http://127.0.0.1:18082/common/master-data;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
}

# Package evidence is validated by the application that issued the signed URL.
location ~ "^/media/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/mallpay/[0-9]{6}/[A-Za-z0-9_-]+\.jpg$" {
    limit_except GET { deny all; }
    access_log off;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 404 = @mallpay_ops_signed;
    proxy_pass http://127.0.0.1:18082;
}
location @mallpay_ops_signed {
    access_log off;
    proxy_cache off;
    proxy_pass http://127.0.0.1:18081;
}
location ^~ /ops-shop/ {
    root /data/www/ai-shop-ops/current;
    try_files $uri $uri/index.html $uri.html =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
# ai-shop 商户端 API（B 端 App 联调）：只放行 /biz/** 与主数据；自动化登录、internal、ops 一律不出去
location ^~ /shop-api/biz/ {
    proxy_pass http://127.0.0.1:18082/biz/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
    proxy_read_timeout 100s;
    client_max_body_size 20m;
    add_header Cache-Control "no-store" always;
}
location = /shop-api/common/master-data {
    proxy_pass http://127.0.0.1:18082/common/master-data;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
}
# 商户 App 版本检查（未登录可调；/common 其余接口仍不出去）
location = /shop-api/common/app/version {
    proxy_pass http://127.0.0.1:18082/common/app/version;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto;
    add_header Cache-Control "no-store" always;
}
# 运营端 ops-web（/oms，deploy/nearpay/prod/nginx-oms.conf）：静态页 + 登录三端点 + /pay-ops/v2；其余 /oms-api 404
location = /oms { return 301 /oms/; }
location ^~ /oms/ {
    root /data/www/oms-root;
    try_files $uri $uri/index.html $uri.html =404;
    error_page 404 /oms/404.html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
location ^~ /oms/_next/static/ {
    root /data/www/oms-root;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /oms-api/auth/login {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18081/ops/auth/login;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto; proxy_set_header Cookie "";
    proxy_read_timeout 20s; client_max_body_size 16k; access_log off;
    add_header Cache-Control "no-store" always;
}
location = /oms-api/auth/login/verify {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18081/ops/auth/login/verify;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto; proxy_set_header Cookie "";
    proxy_read_timeout 20s; client_max_body_size 16k; access_log off;
    add_header Cache-Control "no-store" always;
}
location = /oms-api/auth/me {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18081/ops/auth/me;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto; proxy_set_header Cookie "";
    proxy_read_timeout 20s; access_log off;
    add_header Cache-Control "no-store" always;
}
location ^~ /oms-api/pay-ops/v2/ {
    proxy_pass http://127.0.0.1:18093/pay-ops/v2/;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $twpay_forwarded_proto; proxy_set_header Cookie "";
    proxy_read_timeout 30s; client_max_body_size 64k; access_log off;
    add_header Cache-Control "no-store" always;
}
location ^~ /oms-api/ { return 404; }

 location / { return 404; }
}
