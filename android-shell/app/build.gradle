plugins { id "com.android.application" }

// 正式证书签名：个推按登记的「包名 + SHA256」校验，签名对不上注册不出 cid。
// 密码由 gradle 读 signing/keystore.properties，不写进代码。
def ksPropsFile = rootProject.file("signing/keystore.properties")
def ksProps = new Properties()
if (ksPropsFile.exists()) { ksPropsFile.withInputStream { ksProps.load(it) } }

android {
    namespace "ai.neargo.shop.shell"
    compileSdk 34

    signingConfigs {
        release {
            def sf = ((ksProps['storeFile'] ?: '') as String).replaceFirst('^~', System.getProperty('user.home'))
            if (sf) storeFile file(sf)
            storePassword ksProps['storePassword']
            keyAlias ksProps['keyAlias']
            keyPassword ksProps['keyPassword']
        }
    }

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        // 个推 APPID（虹选好物）。占位符注入 AndroidManifest 的 GETUI_APPID meta。
        manifestPlaceholders = [ GETUI_APPID: "ayD7XjKbip61jmm4fUxM45", GT_INSTALL_CHANNEL: "shell" ]
    }

    // 两个端一套壳代码，靠 flavor 分开：
    // **applicationId 必须不同**，否则装第二个会顶掉第一个 ——
    // 而运营/商家/用户三种身份要能在同一台测试机上并存
    flavorDimensions += "endpoint"
    productFlavors {
        consumer {
            dimension "endpoint"
            applicationId "ai.neargo.shop.c"
            resValue "string", "app_name", "社区好物"
        }
        merchant {
            dimension "endpoint"
            // 个推登记的安卓包名就是这个 —— 必须一致，否则推送校验不过
            applicationId "top.hxmall.bapp"
            resValue "string", "app_name", "邻里商家"
        }
    }

    buildTypes {
        /*
         * debug 指向宿主机的 dev server（配合 `adb reverse`），**不是 assets 里的离线产物**。
         * 理由见 MainActivity.ENTRY_RES：file:// 的 origin 是 null，后端 CORS 不认，
         * 于是每个请求都被浏览器拦掉，页面渲染成一片空状态而不报错。
         * 端口 5174 = b-app dev server（launch.json 里的 b-app-h5）。
         */
        debug {
            applicationIdSuffix ""
            resValue "string", "shell_entry", "http://localhost:5174"
            // debug 也用正式证书 —— 个推按登记的 SHA256 校验，默认 debug key 对不上
            signingConfig signingConfigs.release
        }
        release {
            // 生产：加载 nginx 上的 b-app（http 同源，API 走 /biz 等反代到 8081）——
            // 不用 file://（避开 uni-app H5 在 file:// 下的黑屏），不用 CORS（同源）。
            resValue "string", "shell_entry", "http://106.55.27.246/b/"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"

    // appcompat 1.7 会同时拉进 kotlin-stdlib 1.8.22 与 kotlin-stdlib-jdk8 1.6.21，
    // 两者含同名类，D8 合并时报 Duplicate class。
    // 1.8 起 jdk7/jdk8 的内容已并入主 stdlib，把它们对齐到同一版本即可 ——
    // 不是 exclude，因为传递依赖里确实有代码引用它们
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")

    // 个推推送 SDK（uni-push 2.0 的同一底座）。原生集成，不经 DCloud。
    implementation "com.getui:gtc:3.3.3.0"
    implementation "com.getui:gtsdk:3.3.15.0"
    implementation "com.getui:gsido:1.4.14.0"
}
