# Independent internal business service; no public client authentication or default credentials.
server:
  port: ${BEAUTY_SERVER_PORT:8087}
spring:
  application:
    name: beauty-server
  datasource:
    url: ${BEAUTY_DB_URL:}
    username: ${BEAUTY_DB_USER:}
    password: ${BEAUTY_DB_PASSWORD:}
  flyway:
    enabled: false
shop:
  beauty:
    enabled: ${SHOP_BEAUTY_ENABLED:false}
    deployment: standalone
  services:
    internal-token: ${SHOP_INTERNAL_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,beautyReadiness
