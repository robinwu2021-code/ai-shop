# Independent internal business service; no public client authentication or default credentials.
server:
  port: ${BEAUTY_SERVER_PORT:8087}
spring:
  profiles:
    default: api
  application:
    name: beauty-server
  datasource:
    url: ${BEAUTY_DB_URL:}
    username: ${BEAUTY_DB_USER:}
    password: ${BEAUTY_DB_PASSWORD:}
  flyway:
    enabled: false
shop:
  beauty:
    enabled: ${SHOP_BEAUTY_ENABLED:false}
    deployment: standalone
  services:
    internal-token: ${SHOP_INTERNAL_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,beautyReadiness

logging:
  file:
    name: ${BEAUTY_LOG_FILE:}
  console:
    enabled: ${BEAUTY_LOG_CONSOLE_ENABLED:true}
  threshold:
    console: ${BEAUTY_LOG_CONSOLE_LEVEL:TRACE}
  pattern:
    level: "%5p rid=%X{requestId:-}"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
      clean-history-on-start: true
