# 元器件服务（elec-svc）的错误文案。**键与文案逐字抄自主系统** shop-app/i18n/messages*.properties ——
# 两个进程报同一个码要说同一句话。ElecMessagesParityTest 盯着：少一条、与主系统不一致都会红。
# 只收本服务会报的码：全局异常处理那几条通用的 + err.elec.*
err.bad_request=请求参数有误
err.unauthorized=请先登录
err.token_expired=登录已过期，请重新登录
err.forbidden=没有操作权限
err.not_found=数据不存在
err.conflict=资源冲突，请刷新后重试
err.too_many_requests=操作太频繁，请稍后再试
err.internal=系统开小差了，请稍后再试
err.biz.role_forbidden=这一步需要「{0}」的权限，你在这家店的角色没有——让店主给你加个角色
err.elec.phone_required=请先绑定手机号，平台需要联系你
err.elec.not_supplier=你还不是供应商，先完成入驻
err.elec.supplier_exists=你已经是供应商了
err.elec.supplier_suspended=供应商账号已暂停，请联系平台
err.elec.upload_format=只支持 .xlsx 和 .csv。如果是 .xls，请在 Excel 里另存为 .xlsx 再上传
err.elec.upload_no_header=表里没找到「型号」和「数量」两列，请检查表头
err.elec.upload_too_many_rows=一次最多上传 {0} 行，请分成几张表
err.elec.batch_expired=这次预览已经过期，请重新上传
err.elec.batch_empty=没有可以上架的行
err.elec.rfq_lines_invalid=询价要有 1 到 {0} 行，每行填料号和数量
err.elec.rfq_state=这张询价单现在不能这么操作，请刷新后再看
err.elec.quote_expired=报价已过期，请重新询价
err.elec.mfr_exists=这个厂牌代码已经有了
err.elec.alias_taken=这个写法已经对应到厂牌 {0}，不能再指给另一家
