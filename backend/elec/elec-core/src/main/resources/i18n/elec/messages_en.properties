# 元器件服务（elec-svc）的错误文案。**键与文案逐字抄自主系统** shop-app/i18n/messages*.properties ——
# 两个进程报同一个码要说同一句话。ElecMessagesParityTest 盯着：少一条、与主系统不一致都会红。
# 只收本服务会报的码：全局异常处理那几条通用的 + err.elec.*
err.bad_request=Invalid request
err.unauthorized=Please sign in
err.token_expired=Your session has expired — please sign in again
err.forbidden=Permission denied
err.not_found=Not found
err.conflict=Resource conflict
err.too_many_requests=Too many requests, please retry later
err.internal=Something went wrong, please retry later
err.biz.role_forbidden=This needs the “{0}” permission, which your role at this store does not have — ask the owner to grant you a role
err.elec.phone_required=Please link a phone number first so we can contact you
err.elec.not_supplier=You are not a supplier yet. Please sign up first
err.elec.supplier_exists=You are already a supplier
err.elec.supplier_suspended=Your supplier account is suspended. Please contact us
err.elec.upload_format=Only .xlsx and .csv are supported. For .xls files, save as .xlsx in Excel and upload again
err.elec.upload_no_header=Could not find the part number and quantity columns. Please check the header row
err.elec.upload_too_many_rows=Up to {0} rows per upload. Please split the sheet
err.elec.batch_expired=This preview has expired. Please upload again
err.elec.batch_empty=There are no rows to list
err.elec.rfq_lines_invalid=A quote request needs 1 to {0} lines, each with a part number and quantity
err.elec.rfq_state=This quote request cannot be changed right now. Please refresh and try again
err.elec.quote_expired=This quote has expired. Please request a new quote
