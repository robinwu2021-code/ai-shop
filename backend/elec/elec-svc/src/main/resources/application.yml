# 电子元器件 · 独立进程。**接用户流量**（经 nginx 的 /elec/**），与 pay-svc、job-worker 不同。
server:
  port: ${ELEC_SVC_PORT:8085}

spring:
  application:
    name: elec-svc
  # 库的连接不走 spring.datasource：元器件库由 ElecDataSourceConfig 自己建（连接池名 elec-pool，
  # 启动时核对拿到的就是它）。Spring Boot 的数据源自动配置见到它就退让
  flyway:
    # Boot 自带的 Flyway 关掉：迁移由 ElecDataSourceConfig 自己跑、历史表 elc_flyway_history。
    # 开着的话它会拿同一个库、默认位置 db/migration 再建一张 flyway_schema_history —— 空跑，但留下垃圾
    enabled: false
  servlet:
    multipart:
      # 库存表：5MB 的 xlsx 大约四五万行，已超过单次上限（2 万行）
      max-file-size: 5MB
      max-request-size: 6MB

shop:
  elec:
    enabled: true
    datasource:
      # 默认值是开发机用的。生产填 MySQL 9.7（3307）上的 ai_shop_elec
      url: ${ELEC_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_shop_elec?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      username: ${ELEC_DB_USER:}
      password: ${ELEC_DB_PASSWORD:}
    upload:
      # 上传原件：failed/（未入库，每周清）与 applied/（已入库，暂不删）两区。
      # 生产 /data/cache/elec-upload，要预先建好并 chown 给 deploy；写不进去 elec-svc 起不来（启动自检）
      dir: ${ELEC_UPLOAD_DIR:${java.io.tmpdir}/elec-upload}
      failed-retention-days: ${ELEC_UPLOAD_FAILED_RETENTION_DAYS:7}
      # 0 = 不删
      applied-retention-days: ${ELEC_UPLOAD_APPLIED_RETENTION_DAYS:0}
      pending-ttl-minutes: ${ELEC_UPLOAD_PENDING_TTL_MINUTES:60}
      cache-max-batches: ${ELEC_UPLOAD_CACHE_MAX_BATCHES:10}
      daily-max: ${ELEC_UPLOAD_DAILY_MAX:20}
      delist-confirm-bp: ${ELEC_UPLOAD_DELIST_CONFIRM_BP:3000}
    ai:
      # 大模型认列（cdw 上的 qwen）。默认关；生产 ELEC_AI_BASE_URL=http://cdw.near3.ai:8003/v1、ELEC_AI_ENABLED=true
      enabled: ${ELEC_AI_ENABLED:false}
      base-url: ${ELEC_AI_BASE_URL:}
      model: ${ELEC_AI_MODEL:qwen3.6}
      timeout-seconds: ${ELEC_AI_TIMEOUT_SECONDS:8}
  services:
    # 主系统。不经 nginx（它不反代 /internal），走本机
    targets:
      PLATFORM: ${ELEC_MAIN_URL:http://127.0.0.1:8081}
    # 与主系统同值。**没配就一律拒绝**，不是没配就不校验
    internal-token: ${SHOP_SERVICES_INTERNAL_TOKEN:}

elec:
  # 本机开发放行的跨域源（逗号分隔），如 http://localhost:3100（运营端 dev server）。
  # **生产不配**：同域经 nginx，不需要也不该开跨域 —— 空着链上就没有 CORS 这一段
  dev-cors-origins: ${ELEC_DEV_CORS_ORIGINS:}
  # 通知点开后落到的页面前缀。并进 c-app 测试时是 pkg-elec/pages/，独立小程序时改成 pages/（见 ElecPages）
  page-prefix: ${ELEC_PAGE_PREFIX:pkg-elec/pages/}
  # 库存快到期的站内信，每天一次。设成 - 关掉（Spring 的「禁用」写法）
  expiry-remind-cron: ${ELEC_EXPIRY_REMIND_CRON:0 0 9 * * *}
  # 上传原件清理，每周一次。设成 - 关掉
  upload-clean-cron: ${ELEC_UPLOAD_CLEAN_CRON:0 30 3 * * MON}
  wecom:
    # 企业微信群机器人。**默认复用主系统那条**（SHOP_NOTIFY_WECOM_WEBHOOK，生产上已经配着，
    # 收入驻意向的就是那个群）—— 不用为元器件再要一次地址。
    # 要单独建一个元器件群时，只配 ELEC_WECOM_WEBHOOK 就会盖过它。
    # URL 本身就是凭据：只在服务器 env 里，不进仓库。两个都空 = 不发
    webhook: ${ELEC_WECOM_WEBHOOK:${SHOP_NOTIFY_WECOM_WEBHOOK:}}

logging:
  level:
    ai.neargo.shop.elec: INFO
    com.zaxxer.hikari: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: WARN
