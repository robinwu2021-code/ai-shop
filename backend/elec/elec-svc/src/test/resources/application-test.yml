# elec-svc 的测试：元器件库用 H2 内存库跑真迁移（db/elec-h2 由 db/elec 重放生成，
# db/elec-h2-seed 是测试专用的一个料号）。主系统用 FakeMainSystem 顶替（在 HTTP 客户端那一层）
shop:
  elec:
    enabled: true
    flyway-locations: classpath:db/elec-h2,classpath:db/elec-h2-seed
    datasource:
      url: jdbc:h2:mem:elecsvc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
  services:
    internal-token: test-internal-token
    targets:
      # 不会真的连：MainSystemApi 被 FakeMainSystem 顶替。填一个连不上的地址，万一漏顶替会立刻失败
      PLATFORM: http://127.0.0.1:1
elec:
  wecom:
    webhook: ""
