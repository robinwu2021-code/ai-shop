# 测试：密钥库用一个内存库，并在本进程跑密钥库迁移建表（生产不跑，迁移归 shop-app）。
# 同一 JVM 的各上下文共用这个库：凭证的 owner= / system= 绑定（CredentialScope）保证别的上下文的同号业主认不过来。
inventory.secret.env=SANDBOX
inventory.secret.datasource.url=jdbc:h2:mem:inv_secret;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
inventory.secret.datasource.username=sa
inventory.secret.datasource.password=
inventory.secret.flyway-enabled=true
