# 阿拉伯语。
#
# 为什么补这一份：c-app / b-app 早就支持三语（LANGS 里 ar 的 rtl 都配好了），
# 而后端 i18n 只有中英 —— 实测阿语请求收到的是**中文报错**：
#   Accept-Language: ar  →  「请求参数有误」
# 界面全套阿语、报错突然是中文，比英文兜底还糟：用户不知道那是不是出错了。
#
# 键集必须与 messages.properties 逐字一致，由 BackendI18nParityTest 守住 ——
# 端上早有三语一致性守卫（i18n-parity.test.ts），漏的正是后端这一侧。
