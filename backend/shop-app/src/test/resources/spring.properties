# Spring 测试上下文缓存上限（默认 32）。
# shop-app 有 500+ 个 @SpringBootTest，配置组合多出十几种上下文；全部常驻时测试 JVM
# 默认堆（物理内存的 1/4）会被撑满，后面加载的上下文全部 OutOfMemoryError，
# 表现成十几个「Failed to load ApplicationContext」——与被测代码无关。
# 超出上限的上下文按 LRU 关闭并释放，下次用到再建。测试 JVM 的堆另由 shop-app pom 的 argLine 按物理内存比例放大。
spring.test.context.cache.maxSize=12
