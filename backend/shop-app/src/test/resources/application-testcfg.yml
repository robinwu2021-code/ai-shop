# 测试用内存库：S0 验证契约、装配与越权防线，不验证 MySQL 方言。
# 真正的 SQL 兼容性由 S1 起的集成测试对 MySQL 跑（Flyway 脚本本来就是 MySQL 语法）。
spring:
  datasource:
    url: jdbc:h2:mem:shop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false     # V1__infra.sql 是 MySQL 语法，H2 下不跑；测试建表见 schema-test.sql
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379

shop:
  auth:
    token-store: memory
  after-sale:
    # 显式设阈值，让用例的「命中/不命中」一眼可读，不依赖生产缺省值
    instant-threshold-minor: 5000
  seed:
    # 测试库必须有数据才能验证「逛」的链路；生产默认 false
    enabled: true
  store:
    # 门店额度开到 3 跑用例。**生产默认 1**（= 与单店时代行为一致），
    # 用默认值的话「超额被拒」之外的分支一条都走不到。
    #
    # 放在这里而不是用 @TestPropertySource：后者会造出第二个 Spring 上下文，
    # 而 H2 是同一个内存库 —— 建表脚本跑第二遍，整套测试成片挂在主键冲突上。
    max-per-entity: 3
  pay:
    # 进件与资金都走假网关。**生产默认 false** —— 默认开的话真实现没接上时
    # 会「进件成功」而通道根本没开户，商家第一笔订单才发现收不了钱
    stub: true
