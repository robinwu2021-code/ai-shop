# 共享的**测试行为**配置：桩网关、种子数据、放开的额度阈值。
#
# 这里**不含数据源** —— 用哪个库由另一个 profile 决定（H2 见 application-h2db.yml，
# 真库见 application-e2e.yml）。两件事拆开，E2E 才能复用这些开关而不被拖回内存库。
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379

shop:
  auth:
    token-store: memory
  notify:
    # 商家渠道凭据加密密钥（AES-256，N5）。测试固定值；生产走 SHOP_NOTIFY_CRED_KEY。
    cred-key: bmVhcmdvLW5vdGlmeS10ZXN0LWtleS0zMmJ5dGVzISE=
  after-sale:
    # 显式设阈值，让用例的「命中/不命中」一眼可读，不依赖生产缺省值
    instant-threshold-minor: 5000
  seed:
    # 测试库必须有数据才能验证「逛」的链路；生产默认 false
    enabled: true
  store:
    # 门店额度开到 3 跑用例。**生产默认 1**（= 与单店时代行为一致），
    # 用默认值的话「超额被拒」之外的分支一条都走不到。
    #
    # 放在这里而不是用 @TestPropertySource：后者会造出第二个 Spring 上下文，
    # 而 H2 是同一个内存库 —— 建表脚本跑第二遍，整套测试成片挂在主键冲突上。
    max-per-entity: 3
  pay:
    # 进件与资金都走假网关。**生产默认 false** —— 默认开的话真实现没接上时
    # 会「进件成功」而通道根本没开户，商家第一笔订单才发现收不了钱
    stub: true
  ops:
    # 初始密码走响应体而不是邮件。**生产默认 mail**。
    #
    # 整套用例建完账号要立刻用初始密码登录（验角色、验权限、验首登改密），
    # 走邮件的话密码只在邮件正文里，测试得去解析邮件体才能拿到——脆且与被测行为无关。
    #
    # 「mail 模式下响应体里没有明文」这条**不是没测**：
    # OpsPasswordDeliveryFlowTest 用默认值单独跑，它是这次改造的核心断言。
    password-delivery: response
  otp:
    # 发码限流关掉。**生产默认 true**。
    #
    # 关它是因为「登录」是几乎每条旅程的第一步：整套用例反复给同一个手机号发码，
    # 开着的话 60 秒间隔闸会把第二条之后全部拦掉 —— 实测 374 个错，
    # 且报出来的是 `NoSuchElement`（peek 不到码），看着像测试数据问题，
    # 与限流毫无关联，很难查。
    #
    # 三道闸本身由 OtpRateLimitFlowTest 单独验：它用 @SpringBootTest(properties=…)
    # 把开关打开并把阈值调小，是唯一一处真的跑闸的地方。
    rate-limit: false
  upload:
    # 上传落在 target 下而不是默认的 ./data/uploads —— 后者会往仓库里写文件。
    #
    # 放在这里而不是各测试类上的 @DynamicPropertySource：理由与本文件开头那条一样，
    # 而且是刚踩过的 —— 两个媒体测试类各声明一份动态属性，就造出了第二个上下文，
    # 于是 H2（同一个内存库）被重复播种，整批测试挂在 sys_industry 主键冲突上。
    dir: target/test-uploads
  media:
    # 固定签名密钥。不配的话每次启动随机生成（生产必须配 SHOP_MEDIA_SIGN_SECRET），
    # 而随机密钥下「签名 URL 能打开」这条断言就无从谈起。
    sign-secret: test-secret-for-media-signing
