# E2E 专用：**真 MariaDB**，不是内存库。
#
# 与 application-test.yml 的分工：
#   test —— H2 内存库 + MockMvc，跑得快，覆盖广（240 用例），进默认构建
#   e2e  —— 真库 + 真 HTTP 端口，只放关键旅程，**不进默认构建**
#
# 为什么必须有这一份：H2 全绿而真库出错的情况本轮出过三次
# （VO 字段名、待审队列没过滤、数据域把订单过滤成空）。
# 而 H2 的 MODE=MySQL 只是语法兼容，行为不是。
#
# ⚠️ 它连的是 **ai_shop_e2e**，不是开发库 —— E2E 会 clean 整个库，
# 指错库等于把开发数据清空。
spring:
  datasource:
    url: jdbc:mysql://${SHOP_E2E_DB_HOST:127.0.0.1}:3306/ai_shop_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${SHOP_DB_USER:shop}
    password: ${SHOP_DB_PASS:shop}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # E2E 要能重置库，clean 必须放开。**只在这个 profile 里放开**
    clean-disabled: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: 127.0.0.1
      port: 6379

shop:
  auth:
    token-store: memory
  after-sale:
    instant-threshold-minor: 5000
  seed:
    # 演示数据要有：J1 之外的旅程会用到种子社区（CM001）与自提点（PP0001）
    enabled: true
  pay:
    # 支付与进件都走假网关：E2E 验的是我们这边的链路，不是通道的
    stub: true
  store:
    # 多门店旅程要建分店。**生产默认仍是 1**（与单店时代行为一致），
    # 这里放开只是为了让 J2 能走到「两家店的账要分开」那一步
    max-per-entity: 3
