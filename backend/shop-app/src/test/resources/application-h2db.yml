# 测试用内存库：S0 验证契约、装配与越权防线，不验证 MySQL 方言。
# 真正的 SQL 兼容性由集成测试对 MySQL 跑（Flyway 脚本本来就是 MySQL 语法）。
#
# **为什么它从 testcfg 里拆了出来**：
# testcfg 原本同时管两件正交的事 —— 「用哪个库」和「测试行为开关」（桩网关 / 种子 / 门店额度）。
# E2E 要后者、绝不要前者：它的整个存在意义就是跑**真 MariaDB**。
# 而 profile 组成员的优先级高于组名（`e2e: testcfg,…` 展开后 testcfg 排在 e2e 之后），
# 于是这份 H2 配置会把 application-e2e.yml 的真库连接和 flyway 开关一起盖掉 ——
# 症状是 E2E 启动时报「没有 Flyway bean」，看上去像依赖缺失，
# 实际是**整套 E2E 悄悄跑在了内存库上**。
spring:
  datasource:
    url: jdbc:h2:mem:shop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false     # V1__baseline.sql 是 MySQL 语法，H2 下不跑；测试建表见 schema-test.sql
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

# ── 进销存独立库 ────────────────────────────────────────────────────────
# 它是**另一个数据源**，所以要另一个内存库；名字不同（inv ≠ shop），
# 这一点本身就是「两个库真的分开了」的验证：跨库 join 在这里会直接失败，
# 而不是像同库那样悄悄成功。
#
# Flyway 关掉，理由与上面那条一样（V1 是 MySQL 语法）；
# 建表走 INIT=RUNSCRIPT —— 它在连接建立那一刻执行，
# 早于任何 Mapper 用到它，不必再排 bean 的先后。
# ⚠️ **暂时关着**（2026-08-26）。打开它会让 Spring Boot 的 DataSourceAutoConfiguration
# 与 MybatisPlusAutoConfiguration 整体退让（两者都是 @ConditionalOnMissingBean），
# 于是平台侧连自己的 SqlSessionFactory 都没有，全部 Mapper 静默绑到进销存那个
# **刻意不装拦截器**的工厂上 —— 丢的不只是乐观锁，**DataScope 越权防线也一起丢**。
# 更隐蔽的是 spring.sql.init 只作用于主数据源：主数据源没了之后，平台的建表脚本
# 会灌进进销存那个库，两套表挤在一个库里而测试照样全绿。
#
# 打开它的前提是**先把平台的 DataSource 与 SqlSessionFactory 显式接管过来**
# （@Primary + 复用 MybatisPlusProperties），那是一次单独的、要跑全量回归的改动，
# 不该夹在功能提交里。跟踪见开发计划 S0-b。
shop:
  inventory:
    enabled: false
    flyway-enabled: false
    datasource:
      url: "jdbc:h2:mem:inv;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema-inventory-test.sql'"
      username: sa
      password: ""
