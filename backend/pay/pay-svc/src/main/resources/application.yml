# 支付域独立形态（形态 B）。**不接前端流量。**
server:
  port: ${PAY_SVC_PORT:8083}

spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: pay-svc
  datasource:
    # 今天仍指向主库 —— 独立进程与独立库是两件事，后者是 D2（唯一不可轻易回退的一步）。
    # 先分进程、后分库：这个顺序让「跨域事务写不出来」这件事在切库之前就已经成立。
    # 默认值是**开发机**用的。生产填 db.svc.internal（名称不是 IP，见 ADR-023）——
    # 换机器那天只改一处 /etc/hosts，各服务配置与代码都不动。
    url: ${PAY_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PAY_DB_USER:}
    password: ${PAY_DB_PASSWORD:}
  # Flyway 关掉：迁移由主应用统一跑。
  # **两个进程都开 Flyway 会互相等锁，且谁先起谁决定版本** ——
  # 而这个进程今天连的还是主库。
  flyway:
    enabled: false

shop:
  services:
    internal-token: ${SHOP_INTERNAL_TOKEN:}
    targets:
      PLATFORM: ${PLATFORM_API_BASE_URL:}
  pay:
    # 接入守卫按入口装配（ADR-045）：这个进程今天只承接内部调用。对外入口随独立部署切换（开发计划 M7）再加
    guard:
      entries: INTERNAL
      internal:
        # 内部入口来源 IP 白名单（开发计划 M2.8）：只认 TCP 对端。今天与 shop-app 同机，只放本机；拆机部署时配内网网段
        allowed-ips: ${PAY_INTERNAL_ALLOWED_IPS:127.0.0.1/32,::1/128}
    report-facts:
      enabled: ${PAY_REPORT_FACTS_ENABLED:true}
    entitlement:
      # Stable shared random secret (>=32 characters) for scoped query cursors; no development fallback.
      # Original ORDER-coupon compatibility stays opt-in until core checkout/import acceptance.
      migration-recovery:
        enabled: ${SHOP_PAY_ENTITLEMENT_MIGRATION_RECOVERY_ENABLED:false}
      legacy-coupon:
        enabled: ${SHOP_PAY_ENTITLEMENT_LEGACY_COUPON_ENABLED:false}
        usage-repair-enabled: ${SHOP_PAY_LEGACY_COUPON_USAGE_REPAIR_ENABLED:false}
        issue-recovery-enabled: ${SHOP_PAY_LEGACY_COUPON_ISSUE_RECOVERY_ENABLED:false}
      cursor-key: ${SHOP_PAY_ENTITLEMENT_CURSOR_KEY:}
      code:
        enabled: ${SHOP_PAY_ENTITLEMENT_CODE_ENABLED:false}
      code-key: ${SHOP_PAY_ENTITLEMENT_CODE_KEY:}
    # 这个进程自己不读这个开关（有闸门盯着：PayHasNoControllerTest）。
    # 形态由**主应用侧**决定注入 Local 还是 Remote。
    deployment: standalone

logging:
  level:
    ai.neargo.shop.pay: INFO
    # 框架噪音降到 WARN（日志方案 §7）。logger 名取自线上实际打印的那些，
    # 见 shop-app/application.yml 里同一段的说明
    com.zaxxer.hikari: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: WARN
